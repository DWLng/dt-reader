派要打断这个过程。危急时井九与赵腊月坦然走出，齐灵问罪：你为何要害死苍龙？众人骇然忆起镇魔狱事变时逃出的那道快影，鹿国公讨要证据，齐灵称有证据他早就死了。恐怖威压笼罩井九之际，静园外传来一声猫叫——白鬼大人到了。"},{"n":423,"orig":423,"title":"三剑之约","people":["井九","麒麟","卓如岁","白鬼","渡海僧"],"one_line":"麒麟逼井九以剑接三击，井九索要青天鉴为注","summary":"白鬼蹲上成华殿檐角看戏，暗藏杀机。静园里井九指出麒麟化形便不敌白鬼，显本体又会引天雷，并道出真相：苍龙不是他杀的，而是死于想吃掉他与冥皇的贪婪。齐灵自知今日难杀井九，转而代表中州派提出：井九须证明实力才有资格留仙箓——麒麟将境界压至元婴期，井九用飞剑接三击不死便算胜。卓如岁喊出「师叔让你丫一只手」。井九先索要好处：中州派须借青天鉴一次，让他再入幻境参详。齐灵以为井九接击必死，一口应下。井九侧身抽出黑铁剑，平指齐灵。"},{"n":424,"orig":424,"title":"眼空宇宙一剑锋","people":["井九","麒麟","卓如岁","赵腊月","渡海僧"],"one_line":"井九硬接两击反伤麒麟，宇宙锋现世","summary":"赵腊月出言讥讽，麒麟弹出如烟尘般重逾山岳的一指，井九凝视其双眼，提前算落点，以黑铁剑遮天一挡，巨响震彻果成寺。他被轰进雨廊，逼出全部剑意，却站了起来。卓如岁高喊第一击为其争取喘息，铁剑锈垢随之剥落。井九以幽冥仙剑闪至山间，麒麟一掌化满天流星追杀，爆竹声掩盖了劲箭炸裂之声。第二击未落，井九脚影一闪，竟以剑在麒麟眉角划出血珠——接三记，没说不能反击。满场骇然。井九再举铁剑，锈垢簌簌落尽，露出明亮剑身，冷然报出其名：宇宙锋，一把能斩断时间与空间的剑。"},{"n":425,"orig":425,"title":"铁剑依然在","people":["井九","麒麟","阴三","白鬼","卓如岁"],"one_line":"宇宙锋身世揭晓，阴三现形，白猫吓得炸毛","summary":"宇宙锋的来历揭晓：它原是适越峰莫仙师剑归青山时留下的普通铁剑，井九当年问了一句「你的剑怎么样」便继承了它。雪原六年燃烧剑元当火把、镇魔狱三年沉于苍龙胃中毒潭，加上长年剑意蕴养，早经脱胎换骨，麒麟一击如点睛，令其醒来。卓如岁自愧当初有眼无珠，感慨人死剑在，剑就是青山的精神。成华殿上，一名年轻僧人突然坐到白鬼身边，熟练地摸了它一把，吓得白鬼毛骨悚然，确定那几张纸的味道来自真人。静园里井九不等第三击，主动挥剑，宇宙锋快到极致，连麒麟的耳垂、鼻翼、唇角都被划出细小血口。"},{"n":426,"orig":426,"title":"飞天的麒麟，丑和尚","people":["麒麟","井九","玄阴老祖","阴三","卓如岁"],"one_line":"丑僧金刚杵重创麒麟，阴三明言要杀的是井九","summary":"麒麟讥井九不够强，蓄力欲发第三击。井九借护山阵佛火穿行，以动静如一的身法让麒麟自己撞上宇宙锋，剑入其胸数寸，却被神体锁住无法拔出。井九选择握柄硬受第三击：左拳攥仙箓对上麒麟之拳，周身骨骼尽裂，被砸进地沟。青光拳将至，一个丑陋老僧忽道「你去死吧」——黑石金刚杵已刺入麒麟腰间。麒麟暴怒升至大乘中期，引来天雷，老僧却轻描淡写接下一掌，随后飞起一脚将其蹬上千山之外。阴三抱着白猫道破天机：麒麟只是顺带的买卖，他要杀的是井九。老僧飞落静园上空，卓如岁第一次抬头，只说了两个字：好丑。"},{"n":427,"orig":427,"title":"如岁的视线，青山剑","people":["井九","玄阴老祖","神皇","卓如岁","柳词","赵腊月"],"one_line":"神皇现身硬撼老祖，卓如岁抬眼引柳词一剑贯穿","summary":"丑老僧正是失踪四百年的玄阴老祖，井九一眼认出「玄阴子」，还道来的该是背龟壳那位。玄阴老祖落掌压向静园，大常僧吐血败退，护山阵的佛火神通竟被他夺来所用，渡海僧正欲舍身拦阻，一名青衣官员挺身而出，竟是乔装随行的当代神皇，两道火翼携皇气与老祖硬撼一记。老祖心生警兆决意遁走，卓如岁自始至终死死盯着他，目光未眨，老祖惊觉运威镇压，卓如岁捏碎剑符昏倒——青山剑光应符而至，柳词蓄势三日的最强一剑贯穿老祖胸膛。天光峰上元龟睁眼，剑峰云开。柳词悲声自问：「师父，青山在你心里究竟算什么？」"},{"n":428,"orig":428,"title":"祖孙相逢应不识，怎知火锅入人心","people":["赵腊月","阴三","玄阴老祖","柳词","水月庵主"],"one_line":"老祖重伤遁走，赵腊月仗剑追僧，火锅对答藏机锋","summary":"柳词一剑穿胸，玄阴老祖以黑烟替身重伤遁走；青山剑阵随即启动，无形巨剑扫过东海百余里，邪修妖物纷纷遁逃，剑锋掠过水月庵外，过冬仍在沉睡。老祖精血燃烧点燃寺中殿宇。阴三早料到柳词会出剑，自称今夜只是看戏，飘然离去。赵腊月驭青山九剑中最快的弗思剑紧追，却始终追不上这位境界相仿的年轻僧人，对方还能随口道出阴凤等镇守的隐秘名讳。阴三讥她被井九带进歧途，绝情灭性太过无趣，赵腊月答：他不喜欢吃火锅，却从不阻止我吃火锅，你喜欢吃火锅，便想让天下人都吃，这才是错的。"},{"n":429,"orig":429,"title":"短发形态的赵腊月","people":["赵腊月","阴三"],"one_line":"阴三自认太平真人，赵腊月明知是局仍冒险追杀","summary":"阴三承认自己就是太平真人，赵腊月按辈分该称师祖，今天却要大逆不道。阴三点破援兵指望不上，白家的人就在北方云上；她答：我也是蚂蚁，我可以咬死你。她识破阴三并非快过自己，而是故意装出潇洒随意诱她放弃——他因她寸步不离而无法施展遁法，这正是井九把她扔出禅殿的用意。阴三遁入莽莽野山，赵腊月冒险在高速追击中强行破境，剑元反噬几近溃散；她嫌散落的长发碍事，剑意出体将其尽数斩断，再次变回短发形态，抱守道心继续与剑丸二次融合。"},{"n":430,"orig":430,"title":"剑光鸟影贺新年","people":["赵腊月","阴三","柳十岁"],"one_line":"赵腊月绝境破入游野中境，柳十岁赶来并肩追杀","summary":"中州派早已接走麒麟退回北方，赵腊月明白井九的用意：不能丢了阴三，还要杀了他。追至绝壁前，阴三忽然停身回指，一指正中她眉心，她坠落之际，弗思剑自行出剑护主，被阴三的骨笛挡下。那道澄静剑意进入她体内，竟激发溃散边缘的剑丸反击，赵腊月抱守道心，二次融合成功，晋入游野中境。她以九死剑诀强攻，骨笛如飞剑般在她肩头留下无形伤口，阴三讥其剑法太少，传授万物皆剑之理。她故意放大剑鸣召援，柳十岁驭不二剑携魔火之拳赶到，认出这位前辈后仍选择并肩追杀，二剑一鸟追过破庙野坟，直至新年爆竹响起。"},{"n":431,"orig":431,"title":"第二个遁剑者","people":["阴三","赵腊月","柳十岁","萧皇帝","玄阴老祖"],"one_line":"阴三遁入萧皇帝龟壳疗伤，赵柳追至大泽无功而返","summary":"追杀持续三天三夜。阴三境界与二人相仿，却有千年修道阅历，诸峰剑法信手拈来；但赵腊月与柳十岁默契惊人，阴三四次回身秒杀，都因对方不顾彼此生死、借势搏命而失败，他暗叹井九那样怕死的家伙竟教出两个不怕死的弟子。他身体有隐患不敢行险，最终遁入大泽畔小镇的铁匠铺——那是第二位遁剑者萧皇帝的龟壳天地。萧皇帝为其切去腐肉、以蛟筋线缝合，断言这具身体至多再撑三年。万年冰魄桶里，玄阴老祖正被换血续命。赵腊月与柳十岁遍寻不获，判断出有遁剑者在暗中相助，只得回果成寺查看井九安危。"},{"n":432,"orig":432,"title":"当年的真相","people":["渡海僧","神皇","赵腊月","柳十岁","井九","阴三"],"one_line":"渡海僧道出杀局真相，神皇细数太平真人八百年往事","summary":"赵腊月与柳十岁赶回果成寺，井九重伤沉睡，左手仍握仙箓。赵腊月以弗思剑刺穿渡海僧肩头逼问，渡海僧平静道出杀局：玄阴老祖的使命是引出井九身边所有强者，他只须等井九独处、仙箓将成最弱的时刻，以般若天下掌断其道树，令其再不能炼化仙箓，终被反噬而死。神皇继而揭开八百年往事：道缘真人飞升失败成就第一位遁剑者雾岛老祖；太平被逐出青山原是苦肉计，携冥皇游历二十载，人类诸派围攻冥皇，他借势回青山夺位，凭景阳之力重续道统；又先后扶植前朝皇孙萧皇帝、逼玄阴老祖成为第二、第三位遁剑者。景阳识破其阴谋后隐于神末峰，太平入果成寺为住持，欲夺舍挚友前代神皇，事败被镇入剑狱。"},{"n":433,"orig":433,"title":"赵柳对谈","people":["赵腊月","柳十岁","渡海僧","卓如岁","神皇","井九"],"one_line":"赵柳首次对谈交心，众人守着沉睡井九等待掌门救援","summary":"渡海僧自辩师父所求乃大业，道出追随太平的缘由：当年只是寺里无人在意的小和尚，住持却陪他扫了一下午落叶；他开口只为告诉神末峰一脉是怎么输的，真人会自己证明，随后含笑而逝。仙箓里最后一丝仙识仍在，井九因神魂受制而沉睡。卓如岁与赵腊月先后尝试缚其左手、裹住逸散仙气，均告失败，众人只能等柳词赶到，卓如岁索性偷吸仙气修行。守榻期间赵腊月与柳十岁第一次交心：她道出身名来历，暗示井九在她娘胎里便选中了自己；她自认面对祖师时很害怕，也终于明白井九不许她破境，是要她找到自己的道——剪去长发、不再理会景阳的意图，才是完全的自己。寺门外，小荷看见童颜到来。"},{"n":434,"orig":434,"title":"青鸟有信，井外有天","people":["童颜","青儿","井九","赵腊月","麒麟"],"one_line":"童颜携青天鉴来求救，青儿吸仙气后跳入井九体内","summary":"童颜鞋烂指黑地来到果成寺，神皇准他入内。他摘下笠帽，里面竟是失踪的青天鉴——他挖通地脉后带鉴叛出云梦山。神皇以古火融冰，近乎透明的青儿飞出，发现沉睡的井九后循味扑上其左手，吮吸仙气补养灵体，很快稳定下来，随后一头跳进井九身体里。青儿未对任何人透露她在里面看见了什么，清晨时又飞了出来。柳词途中感应井九情形，一句「这样也行」便折返青山。麒麟感应仙识将灭、青天鉴失踪，暴怒发现地道，啸鸣震彻云梦山——两年前便有猜疑的白早，正是那封报信人。中州派符书通告天下，称童颜叛派，人人得而诛之。童颜背起青天鉴离寺，青鸟随之而去。"},{"n":435,"orig":435,"title":"井九醒来，水月庵便有了春天","people":["井九","赵腊月","柳十岁","过冬","水月庵主"],"one_line":"井九醒转尽知前事，随青帘小轿赴水月庵救过冬","summary":"青山诸人未拦童颜，九天后井九醒来，自称不可能醒不过来，还说做了一个梦：燃烧的星云、流星般的飞剑，还有幻境众生的种种画面。仙箓里的仙识已被完全炼化，只剩最纯净的仙气。讲经堂长老告知雪原隐忧：雪国女王之子将成年，若败者被逐出雪原来到人间便是人族大劫，禅子与刀圣因此长驻白城。水月庵太上长老的青帘小轿降临，井九留下「我在神末峰等你」便随轿而去。他向庵主致意后走进静室，散放出无数道金光，把仙气灌入苦撑多年的过冬体内，水月庵瞬间进入了春天。"},{"n":436,"orig":436,"title":"好多的尘缘","people":["井九","过冬","白鬼","赵腊月","顾清"],"one_line":"仙气救活过冬，井九叹尘缘渐多，白猫道歉留身边","summary":"井九散出的仙气灌入过冬体内，她被西海剑神一剑断绝的经脉生机终于得续，水月庵万物回春，数十里外通天井的阴灵鬼物死伤惨重。他向庵主辞行，在通天井畔盘算：中州派还有仙箓，好在随冥皇修过魂火之御，三年后可再应付一张；变形的右手让他连宇宙锋都不能立即交给顾清。井九驭剑归青山，把宇宙锋交给顾清，言明以后可能再借用几年，赵腊月则只慢半天赶回。他本想这世只当了断前尘，谁知尘缘越结越多，顿感厌烦。白猫愧疚现身，坦承自己太怕死当时不敢出手，井九揉着它的头说：没事，我也很怕死。"},{"n":437,"orig":437,"title":"剑峰生于天地间","people":["井九","赵腊月","平咏佳"],"one_line":"井九剑峰养伤，揭示青山剑峰自生飞剑的起源之谜","summary":"井九藏有神末峰深处的秘密洞府，以数百块晶石化成的淡金玉池浸养伤躯，剑丸臂骨修复，唯右手如故。他带赵腊月登上云雾终年不散的云行峰——旧人称剑峰。井九道出青山起源：数万年前此峰自行蕴养出一把剑，开派祖师凭之悟出剑道，才有青山宗；剑归青山最初并非传承精神，而是字面之意，峰间乱石崖缝里藏满天地自生与历代归还的飞剑。宇宙锋性子太清冷，被他插入崖间蕴养；赵腊月则坐进当年淬体的崖洞，以剑意稳定新境。半年后夏天，年轻弟子平咏佳登峰寻剑，误将二人当作石像叩拜，剑峰骤然震动，青山剑阵启动。井九睁眼问她：有没有听说过一招从天而降的剑法？"},{"n":438,"orig":438,"title":"老狗","people":["阴三","玄阴老祖","天近人","西海剑神"],"one_line":"老祖联手天近人设局败露，天近人神魂被阴三所控","summary":"阴三与玄阴老祖在海州不老林酒楼吃着火锅拿到地址，踏海找到天近人的海底洞府。天近人曾执掌白鹿书院、受方景天所托杀井九未遂，被禅子逐出朝歌城后匿居至此。他假意被破阵，实以黑洞般的眼窝吞噬阴三神魂，原来他早已与玄阴老祖合谋，老祖现身其身后准备落掌。千钧一发之际，阴三散去道法，青山剑阵的寒意瞬间锁住二人，依约赶来的西海剑神以如潮剑意替他们挡住剑阵一瞬。老祖趁机一掌拍在天近人头顶：「你以为我真的是狗吗！」天近人神魂反被阴三彻底控制。稻草堆旁阴三点评演技，老祖谄笑：我就是真人的一条老狗，忠心耿耿。"},{"n":439,"orig":439,"title":"不管黑狗还是白狗，只要够狠就是好狗","people":["井九","玄阴老祖","阴三","赵腊月","天近人"],"one_line":"老祖反卖西海，井九探剑狱见太平断臂化笛的白骨","summary":"天近人七百余岁，是当年替雾岛老祖选中剑西来的接引者。玄阴老祖经胖僧联络苏子叶，请西海剑神合谋：趁阴三控制天近人时反制，套出其躲避青山剑阵之法。阴三早已识破——果成寺里他故意不出手相援，让老祖重伤濒死以为教训；老祖随即跪地悔过，反手卖掉西海剑派，胖僧暴毙。阴三从天近人处得知初子剑下落等秘密。井九断定师兄把青山剑阵当玩具，先前剑阵所指很可能是剑西来；他也确认白刃偷袭、烟消云散阵早已被动了手脚。因骨笛连弗思剑都斩不断，他带赵腊月入上德峰剑狱，见过尸狗后推门进入那间特殊囚室——床上太平真人的白骨右臂齐肘而断：师兄以断臂炼成了骨笛飞剑。"},{"n":440,"orig":440,"title":"一眼无辜神末峰","people":["苏子叶","白早","井九","顾清","卓如岁","元曲"],"one_line":"苏子叶密会白早传邪道之约，青山议事追查柳十岁行踪","summary":"泄漏天近人藏身处的正是西海剑派，苏子叶虽局败受辱，却凭客卿身份无恙。他依十几年前与童颜的旧约，在桂云城珍器阁拍出千年莲子，四天后等来白早。他亮出青脸，自认已非玄阴宗少主，身后那两位可怕的人物只提条件：西海剑派覆灭后，灵脉归玄阴宗；他只做信使，别的不能问，还提醒此事莫告知井九。神末峰这边，井九把宇宙锋暂还顾清，从顾清处得知雪原、朝歌与悬铃宗诸事，青山因卓如岁走漏柳十岁现身果成寺的消息而召集议事。元骑鲸的三尺剑亲临神末峰问罪，元曲一脸无辜答师叔早就走了。顾清则奉师命到洗剑溪寻到平咏佳——那个眼神不好、误把白骨当石像的弟子，被井九选中。"},{"n":441,"orig":441,"title":"磨剑","people":["井九","萧皇帝","鹿国公","鹿鸣","冥皇"],"one_line":"井九为磨剑治手借龟壳被拒，改用冥皇妖骨打磨右手。","summary":"井九为修复变形的右手离山寻找磨剑石，先在朝南城宝树居留下法宝名单，再往大泽向遁剑者萧皇帝借龟壳被拒；他穿过大泽湖底北上，遍寻前人洞府与矿山无果，最终到朝歌城井宅见鹿国公，扮作管事进入太常寺，从镇魔狱紫竹下挖出冥皇遗物骨笛——一截连苍龙胃液都泡不化的强大妖骨。他回书房布下阵法，以右手在妖骨上高速摩擦，如同磨剑，骨粉簌簌而落；井梨的恋人撞见这幕，惊呼他在磨手皮，井九不为所动，一心把右手磨回锋利。"},{"n":442,"orig":442,"title":"不管陈茶还是骨茶，都是好茶","people":["井九","井商","井梨","少女","鹿国公"],"one_line":"井九磨尽妖骨复原右臂，以一杯茶成全井梨姻缘。","summary":"少女把妖骨粉当成玉泥脂粉，看得入迷还讨要；井商一家返府，井九随井商用饭，见井梨修行进境慢，说实在不行便送去青山学剑。他连磨三天三夜，相当于出了十万剑，对剑道感悟更深；醒后唤少女倒茶，得知她倾心井梨，便留话「告诉井梨我喝了你一杯茶」，以一杯茶成全这段姻缘。初秋妖骨磨尽，右臂已看不出变形，只剩手腕微有扭曲令他难忍；他唤来鹿国公，把骨粉留下，嘱咐用浓茶送服、分给家人补身。"},{"n":443,"orig":443,"title":"分茶","people":["井九","鹿国公","神皇","景尧","鹿鸣","胡贵妃"],"one_line":"井九进宫面圣直议国事，鹿国公分骨粉茶于全家。","summary":"井九应鹿国公之请进宫，与神皇喝茶闲谈，得知景尧成年后，为景辛被幽禁鸣不平的朝臣愈发活跃；井九不懂帝王权术，直接建议杀掉或送去果成寺出家。胡贵妃想引景尧拜见这位祖师未能如愿，景尧却说祖师境界越高自己便越好。鹿国公与儿子闲谈，点破朝局：并非青山要入朝歌，而是陛下要借青山这把剑。晚间他召集全家，避开与中州派有牵连的迟姨母，把妖骨粉混入茶汤分给众人服下，只说好处日后自见。"},{"n":444,"orig":444,"title":"地底有朵燃烧的荷花","people":["井九","鹿少奶奶","鹿国公","鹿鸣","邪修"],"one_line":"鹿家为井梨亲事犯难；井九入冷山地缝寻妖骨。","summary":"鹿鸣媳妇跪求公公与井家说情：她娘家早年回绝过井家为井梨提的亲，如今侄女小七为井梨觅死觅活，而娘家亲眷多与中州派有牵连，这门亲事难成，只能请井家劝井梨与小七断了来往。井九对此一无所知，他避开雪原千里北上，七天后抵达冷山野湖，独坐一夜下定决心，破冰潜入与聚魂谷地脉相连的地缝，想找当年大战遗留的大妖骸骨做磨剑石；他以右手开路直沉地底十余里，撞上一件邪修法宝，惊动了隐居岩浆河畔的强者。"},{"n":445,"orig":445,"title":"天上有只看景的寒蝉","people":["井九","邪修","寒蝉"],"one_line":"井九算杀地底邪修，本命法宝被送进宇宙惊动寒蝉。","summary":"藏在地底百余年的邪修现出身形，境界远在井九之上，放出本命法宝里炼养的数千怨魂阴灵扑袭，却被井九的剑意尽数斩碎；井九反手把法宝送入宇宙，正趴在竹躺椅上的寒蝉好奇一拨，吓得法宝里的怨魂缩头不敢出。邪修误以为他身怀空间法器，开启阵法引岩浆压顶，又见火中假影，以为井九已死；井九破岩浆而出，一握便捏断其腕骨，宇宙锋随后斩落，将其头颅身躯连同魔婴斩成碎片，尽数葬入岩浆河。"},{"n":446,"orig":446,"title":"一昼夜太短，只争万古","people":["井九"],"one_line":"井九磨碎火蛟鳞法宝超度怨魂，古战妖骨尽朽于岁月。","summary":"邪修至死不知，井九是拣起法宝时便算准了整场战斗：宇宙锋先暗埋身后，布团在岩浆里燃成假火诱他松懈，最终引他撞向剑锋——境界高于自己的对手，是被推演算死的，这正是青山剑道。井九看出那件法宝由火蛟鳞片炼成，恰好拿来磨剑，数日后法宝磨碎，剩余的怨魂阴灵不敢逃散，他想起神末峰怨灵旧事，明白因果偷懒不得，一剑将其尽数超度。随后他深入地心古战场，寻到三万年前冥部大战的大妖骸骨，却见森森白骨触手即溃、尽化粉尘，数万年时光早已朽尽一切。"},{"n":447,"orig":447,"title":"顺流逆流","people":["井九","冥师","冥皇"],"one_line":"井九隔封印见冥师，谈冥皇之玺传承并劝其叛太平。","summary":"井九泡在岩浆河里想到，自己最不喜欢欠人，而最大的债主正是冥皇——他答应为冥皇之玺与魂火之御寻一位继承者，十三年未办成。他顺岩浆沉向深处，隔着中州派封印冥界通道的透明巨墙望见冥界山河，以重生以来最强的剑意出一指，几乎耗尽剑元。冥师的投影应召而至，索要冥皇之玺；井九自称执玺者，提出让冥部推选皇位继承人送来人间、经他认可后归还之玺，并劝冥师与青山联手除去太平，还点破对方是太平在冥界收下的弟子「小三」。"},{"n":448,"orig":448,"title":"神末峰的小东西们","people":["井九","冥师","平咏佳","元曲"],"one_line":"冥师约期十年后答复；承剑会上神末峰抢下平咏佳。","summary":"冥师没有回绝，约定十年后冬至在通天井畔给答复，随即因火王苏醒匆匆离去，临走故意留下投影，被岩浆里那只金色鲤鱼一口吞掉，给井九留下难题。井九与这只能吞冥师影子的怪鱼对视，互相想问对方究竟是什么东西。另一边，青山承剑大会重开，无剑的平咏佳被同窗讥讽，实则他登剑峰时遇见了闭关的井九与赵腊月，顾清让他等待安排；神末峰由元曲出面，天光峰与清容峰也同时开口争抢，元曲一句「这孩子是小师叔先看中的」震动全场。"},{"n":449,"orig":449,"title":"走出雪原","people":["平咏佳","顾清","何霑","瑟瑟","禅子","过南山"],"one_line":"平咏佳入神末峰；何霑出雪原，雪原大震强敌将至。","summary":"平咏佳如愿拜入神末峰，顾清点破他能在剑峰爬到极高处，正是剑道天赋极佳的证明，让他先养剑意、莫急着取剑。白城战事日紧，两忘峰弟子过南山、顾寒等常年在雪原追杀妖兽，已有七名同门重伤，冷山邪道也蠢蠢欲动；懒散怕事的卓如岁随队却毫无战意，被简若水讥讽。蹈红尘传人何霑走出雪原，告知瑟瑟发现了姜瑞的尸体；瑟瑟恳求他务必去老太君寿辰，称那天必出大事。白城后的小庙里，禅子与刀圣正议论烈阳幡重炼、玄阴教坐大，雪原忽然大震，强敌气息逼近。"},{"n":450,"orig":450,"title":"最深的白","people":["禅子","刀圣","白色身影"],"one_line":"禅子重伤女王之子逼其退回雪原，人族严阵以待。","summary":"禅子判断来的是「小的」——雪国女王的孩子。雪原上妖兽与人形雪怪尸横遍野，全是女王母女相残所致；那道最深的白重伤遁逃，宁可冒着人族的围杀也不肯回雪原。禅子以无上禅法两心通锁定其踪，请两百余名医僧诵地藏经结成光镜，借宝镜神通将其重伤逼回雪原深处，自己也呕血负伤，惊叹女王之子仅二十余年便强大至此，并庆幸女王生的是女儿，否则人族要同时面对两个女王。北国城墙阵法已经启动，方景天与谈真人等强者坐镇，严防这个孩子突破防线南逃。"},{"n":451,"orig":451,"title":"火鲤大王","people":["井九","火鲤大王","禅子","刀圣"],"one_line":"聚魂谷底井九遇火鲤大王，以寒蝉与未知之物退敌。","summary":"禅子回到小庙后呕血，动用宝鉴神通重伤女王之子，自己也付出沉重代价，感叹那孩子二十三年便强大如斯，血脉果然可怕；他与刀圣确认女王生的是女儿，母女相残不留手，人族才躲过两王并立的绝境。聚魂谷底，金色鲤鱼自称云梦神兽火鲤大王，在地火里养了两万多年还未成年，奉命镇守冥间通道；它见井九与冥部之人交谈，便要杀他。井九搬出向晚书、童颜、白早等旧识说情无用，虚晃欲逃；寒蝉被当礼物献出，又悄悄放出连火鲤也看不见的微小之物，未知的恐惧逼得火鲤直呼「有话好好说」。"},{"n":452,"orig":452,"title":"轻轻挥一挥右手，不带走一粒尘埃","people":["井九","火鲤大王","明王","乔沈"],"one_line":"井九为火鲤治伤后出地表，连杀三名玄阴教探子。","summary":"火鲤不敢再动手，却拉不下脸，便提出各退一步：谎称自己咬伤了背鳍，请井九随手治治。井九替它剔除焦坏死鳞，认出先前邪修的法宝正是火鲤鳞片所制，顺便磨了右手，随后道别离去。地表冷山，玄阴教主明王率教众布下大阵，搜寻被他用烈阳幡逼出地底的中州派叛徒——偷走青天鉴的童颜；三名教徒隔着十里闲话解闷，聊到「白早仙子喜欢的是青山井九」，忽觉地动，乔沈迎面撞上从地底钻出、浑身泥土的井九，一个「井」字未喊完便身首异处，井九挥手间连杀三人，试出磨了一年多的右手已够锋利。"},{"n":453,"orig":453,"title":"井九的觉悟","people":["井九","苏七歌","高崖"],"one_line":"井九推演锁定青天鉴；玄阴老祖脱困之秘浮出水面。","summary":"井九登上孤山俯瞰荒原，看清玄阴教三百余名教众的搜索阵势，推算青天鉴的大致位置；他确认冥师并不知道自己就是景阳，心情不错，又暗叹青山数万年不炼法宝的积弊——王小明凭烈阳幡便有通天境威能。玄阴教总坛里，前宗主苏七歌对高崖道破教主王小明借烈阳幡坐大、无人能制，并出示令牌暗示玄阴老祖已经脱困，烈阳幡的驭使秘法由此重现；他忧心青天鉴落入王小明之手，旧祸重演。井九循着熟悉的气息找到枯死林，扒开野草下的泥土，敲响青天鉴道：「开门。」"},{"n":454,"orig":454,"title":"童颜的眼光","people":["井九","童颜","青儿","王小明"],"one_line":"童颜青儿道出盗镜始末，井九探路被烈阳幡烧伤。","summary":"童颜从青天鉴里现出身形，青儿雀跃。他道出原委：白真人想冰封青天鉴、让青儿魂飞魄散，童颜认定将成天宝真灵的青儿是真生命，不容宗派随意处死，索性明抢镜子；青儿引他躲进聚魂谷底，靠故交火鲤遮掩，却因王小明以烈阳幡伤鲤、激发地火而被逼出地底。井九下地底探路，被与火脉连成一体的阳罡之火烧得狼狈而回，只道「不是我挖洞不行，是烈阳幡太厉害」。童颜转述王小明多疑暴戾，曾连灭十四个邪派、屠四百余道神魂祭幡，却不扰凡人；井九想起当年赵腊月力主除掉此人，被自己以麻烦为由搁置。"},{"n":455,"orig":455,"title":"小明的脚步声","people":["井九","童颜","王小明","青儿"],"one_line":"井九揭穿王小明奇遇皆被安排，出剑试烈阳幡锋芒。","summary":"井九假寐一日夜，实则以剑意算尽百里地底的阵法与火路，带着童颜、青儿破开雪山脱离搜索圈，却听身后传来跛脚的脚步声——玄阴教主早已候在崖畔，那条生路正是他设下的口袋。井九一句「别人为你准备的人生过的可还如意」，戳破王小明二十三年奇遇尽是安排的真相，令他如坠冰窟。认出来者是井九后，王小明由恨转狂喜，尖啸未及喊出「井」字，宇宙锋已无声斩落，被烈阳幡自动护主挡下；井九试剑后确认自己暂非此幡对手，除非以同阶法宝对轰。"},{"n":456,"orig":456,"title":"不会打架的天阶法宝，执着的丑小鸭","people":["井九","王小明","童颜","青儿"],"one_line":"井九确认非烈阳幡之敌；王小明坚称自己是普通人。","summary":"宇宙锋斩进山体引发雪崩，井九确认烈阳幡攻防皆属修行界前列，自己暂非对手，最稳妥的杀法便是拿同阶法宝对轰，于是盯上了青天鉴；青儿急得直喊「我不会打架」，童颜解释法宝并非都能用来作战，井九便让他们先走、留青儿吸引火力。崖上王小明借童颜搭话拖延，自陈不做修行者、坚持跛足以记普通人身份，恨的是修行者欺压凡人无数年；童颜直言能否修行才是唯一标准，他早已变成自己最厌恶的人。听到井九的名字，王小明恨意滔天，誓要杀之。"},{"n":457,"orig":457,"title":"天地皆火，上下皆鉴……或剑","people":["井九","王小明","童颜","青儿"],"one_line":"烈阳幡天地皆火，井九以青天鉴与宇宙锋护住童颜。","summary":"童颜道破王小明的身世与施丰臣的死因，王小明泪流满面，坚称是井九逼死义父，誓要杀他再杀赵腊月，随即催动烈阳幡全力镇杀：阳罡真火自地缝喷涌，天火如陨石雨砸落，天地皆成炼狱。井九举青天鉴挡住火柱，再把它抛上天空化作十余丈方圆的青铜巨镜遮拦流火，宇宙锋则横挡地火，一鉴一剑如两块铁板护住童颜。青天鉴幻境里的旧楚国也被波及，热浪滔天，唯一醒着的张大公子忧心如焚，只怕沉睡的众人来不及醒来便被热死。"},{"n":458,"orig":458,"title":"寒沙四面平，飞雪千里惊","people":["井九","童颜","青儿","王小明","雪姬"],"one_line":"井九取宇宙寒沙降温后独战王小明，雪姬雪中现世。","summary":"青儿飞出青天鉴告急，再无办法众人皆死；井九得铃声传讯，从宇宙取回蕴着极寒的泥沙覆在青天鉴与宇宙锋上降温，但寒沙渐热、此法不能持久。他自评杀王小明只有两成把握，把青儿托付童颜后独身赴战；童颜劝青儿收镜弃子、由自己带她离开，青儿才知下棋之人个个冷酷。井九走后，青天鉴烧得通红，宇宙锋软如面条，童颜寒蝉在火中苦撑。雪崩处，一个白发黑眼的小小雪人立起，幽冷地望向火海——雪姬现世。"},{"n":459,"orig":459,"title":"雪姬现世","people":["井九","雪姬","王小明","童颜","青儿"],"one_line":"雪姬循寒意闯火海，井九趁机三千剑斩伤王小明。","summary":"雪姬是女王之女，为逃亡离开雪原；她感应到井九从宇宙带回的寒意——那是她这种生命本能追求的绝对寒冷与静止，竟不顾烈阳幡的阳罡之火，径直闯过重重火海。她无视王小明，落在青天鉴下，吓昏的寒蝉坠上她头顶结成蝴蝶结；天火砸散寒沙令她震怒，发出无声厉啸，雪瀑与流火相抗。井九趁机以幽冥仙剑穿越火海来到雪山前，握住宇宙锋，在王小明八个字的话音间刺出三千余剑，斩其血痕、自身也被烈阳幡吞没烧伤；雪姬赶到，捧起宇宙锋细细端详。"},{"n":460,"orig":460,"title":"说走就走","people":["井九","雪姬","王小明","青儿","童颜"],"one_line":"井九裂烈阳幡重伤王小明，携青天鉴离去遇雪姬候剑。","summary":"雪姬抱着宇宙锋细看，井九如临大敌却不敢争抢，好在烈阳幡忽然失控，自行攻击雪姬；他趁隙欺近，右手一剑在幡面划出裂口，王小明呕血重伤，靠一件魔甲碎裂保命，被长老们死命劝离，唯恐禅子等正道强者赶来夺幡。昆仑何真人与风刀教主随后赶到，只见疮痍不见人影。井九不与雪姬寒暄，抱起青天鉴便走，连宇宙锋与寒蝉都弃之不顾，只求离她越远越好；行出百余里，宇宙锋忽然飘起——雪姬坐在剑上，寒蝉别在发间，静静望着他。"},{"n":461,"orig":461,"title":"风雪里的嘤嘤怪","people":["井九","雪姬","童颜","青儿","寒蝉"],"one_line":"雪姬拦路以嘤语索要寒意世界，随后伤重入睡。","summary":"雪姬坐在宇宙锋上拦住去路，井九如临大敌不敢言语；童颜赶到，认出她竟是雪国女王血脉，惊得说不出话。寒蝉醒来作死般靠近，被井九收进宇宙；雪姬发出腹语般的嘤嘤声，井九靠猜与她交流，答称自己没有能力送她去那个绝对寒冷的世界，只肯交出寒蝉、剑等与那世界有关之物。僵持间雪姬忽然闭眼沉睡——她被烈阳幡所伤，进入冬眠般的状态；童颜判断她是女王的女儿，尚是孩子，三人暂时脱险。"},{"n":462,"orig":462,"title":"再至三千院","people":["井九","童颜","张大公子","青儿","火鲤大王"],"one_line":"井九童颜决定带走沉睡的雪姬，南下大原城三千庵。","summary":"雪姬沉睡令井九与童颜为难：她是女王的女儿，出现在人族疆域会带来灾难，杀之又恐女王报仇，唯一的办法便是带走看管；青天鉴幻境里的旧楚国恢复正常，独自醒着的张大公子重获清凉，却惦记起井中那条会说话的红鲤鱼——火鲤大王——前些天忽然消失。地底的火鲤感知到那道可怕气息远去，欢快打滚，又为张大老弟的安危担心。井九一行带着雪姬南下，大原城降下倒春寒，积雪最厚处正是三千庵，庵堂成了白色圆的圆心。"},{"n":463,"orig":463,"title":"忽然过冬","people":["井九","李公子","老尼姑","雪姬"],"one_line":"李公子庵堂救人被阻，长生灯阵锁住雪姬寒意。","summary":"李公子靠当年的金叶子开起古董行，得知三千庵大量买袄被，第二天便去故地重游；禅室里被山埋着个气若游丝的小姑娘，他想救人却被无形之力弹开，井九现身喝止，告知不如此全城人都会冻死。李公子认出这位容颜不变的故人正是仙人，深揖而别。夜里老尼姑点起庵中长生灯，启动水月庵阵法，锁住雪姬外泄的寒意，井九告知她雪姬再过几年便会醒。琴声再起，李公子弹起望春吟，冬去春来，井九却听不懂琴意，转身走向禅室。"},{"n":464,"orig":464,"title":"大道如青天","people":["井九","青儿","李公子","童颜"],"one_line":"井九以青天鉴磨剑，教青儿想通做人的答案。","summary":"井九从被山下取出青天鉴，蘸着雪湖水以右手在镜面磨剑——他确认这面铜镜正是自己寻了一年多的磨剑石；青儿问他怎样才算真正的人，井九答「只要你认为自己是人，那就是人」，并问她为何偏要做人，青儿终于想通。青天鉴幻境里雷霆渐歇、大雪停止，张大公子以为陛下听了自己的骂声，缩回被窝；幻境中沉睡的人们纷纷出现醒转的迹象。水月庵阵法起，湖冰消融，庵前莲枝破雪而起。"},{"n":465,"orig":465,"title":"雪姬醒了","people":["井九","雪姬","童颜","李公子"],"one_line":"雪姬醒转寒意伤人，瞬学剑诀令井九骇然。","summary":"童颜进城打探，推断当年庵堂里的姑娘是水月庵前辈。夜里雪姬忽然醒来，寒意外溢，冻伤李公子与出手阻拦的童颜；井九喝令住手，递给雪姬一本承天剑法，要她学会阵法以便带走。井九解释雪国只有阶层没有社会，女王只知命令，不臣服者皆被抹灭，必须教会她别的交流方式，便把差事推给了童颜。童颜搬出青铜器、瓷器与书本，欲从金文教起；雪姬却突然起身冲出禅室——她已在极短时间内学完承天剑诀，井九骇然，视之为两世修仙遇见的最可怕的存在。"},{"n":466,"orig":466,"title":"如果不能天上见，何以误了这多年","people":["井九","雪姬","童颜","李公子","青儿"],"one_line":"井九带雪姬辞庵南下，灯阵困住童颜强夺青天鉴。","summary":"井九推算出雪姬看书到学会承天剑法至多十余息，感慨生命阶层的差距，决定不再教她任何功法，免得她学会人族的虚伪与滥杀，只问她要不要学围棋。他趁机厚脸皮提出条件：那个绝对寒冷的世界要等他能达到那种境界——等于让她将来助他飞升。李公子远远望见井九像长辈般摸雪姬的头，自嘲凡人妄图救仙人，抱着琴落寞离去；童颜感慨仙凡殊途。井九与雪姬乘宇宙锋离开，童颜欲拦被灯阵挡住，青儿道歉称青天鉴已被抢走；雪姬以承天剑意锁死自身寒意，随行而去，一枚小瓷瓶自天而落，落在李公子手中。"},{"n":467,"orig":467,"title":"雪姬入青山","people":["井九","雪姬","青儿","南忘","平咏佳"],"one_line":"井九与雪姬立约上青山，诸峰闭关静候这位灾星。","summary":"井九与雪姬达成协议：他提供足够的寒意来源让她存活，雪姬则随他上青山、不闹事、未经允许不得离开。青山早有戒备，掌门剑令诸峰弟子集体闭关，南忘疏散清容峰门人，元龟默念自己只是驮碑石龟，刘阿大被平咏佳抱进洞府。青儿不解以井九的谨慎怎敢与虎谋皮——若能收服雪姬，青山将迎来史上最强镇守。宇宙锋落在上德峰，尸狗对雪姬高度警惕，井九闪电般扭回她的脑袋，不让两位高阶生命对视；随后带她进入剑狱深处的寒脉囚室。"},{"n":468,"orig":468,"title":"细细的红线","people":["井九","雪姬","青儿"],"one_line":"井九骗雪姬入剑狱囚室，以万物冰封禁制将其关押。","summary":"剑狱囚徒感知雪姬威压，尽皆伏地臣服；井九把雪姬安置进曾囚太平真人的寒脉囚室，出门走出十三步，以承天剑法触发十三道剑光，重新封死万物冰封禁制。原来所谓请雪姬上青山全是虚言，唯一能关住她的只有这间囚室，井九便是禁制钥匙；他坦承在找到办法前只能先关着她，请她不要生气。这短短十三步是他生命里第三次最紧张的时刻；青儿骇然于井九的冷酷，悄悄躲回青天鉴。雪姬被关后，杀死了井九留下的监视蚊子，脸上浮现一道细细的血线，无声地笑了。"},{"n":469,"orig":469,"title":"现在以及未来的青山巨头们","people":["井九","柳词","元骑鲸","平咏佳","赵腊月"],"one_line":"井九柳词元骑鲸密议雪姬处置，瞒中州派告皇帝。","summary":"井九在上德峰与元骑鲸会合，柳词以承天剑传音，三人确认雪姬是女王血脉、暂时镇压得住，商定不能让任何人知道雪姬在青山，但该知道的人要尽快知道；中州派被排除在外。柳词去白城通知曹园与禅子，井九去朝歌城告知皇帝，元骑鲸负责说服尸狗瞒住师父。王小明见过雪姬成为隐患，柳词主张路上杀他，井九以为烈阳幡太强、对方会更谨慎。青山解禁，井九回到神末峰，正式受平咏佳拜师，感慨峰中有姓柳的、姓元的，还有自己，隐隐不祥。"},{"n":470,"orig":470,"title":"庸人三问","people":["井九","赵腊月","雪姬","神皇","平咏佳"],"one_line":"雪姬杀蚊示威；朝局危急，井九悟师兄意在乱世。","summary":"井九把寒蝉还给阿大作挡箭牌，安排平咏佳学清容峰无端剑法；他与赵腊月梳头闲谈，自感这些年像是在还债，决意把雪姬之事说清。寒蝉示警：剑狱里那只监视蚊子死了——雪姬已发现并击杀它，井九上德峰探视，被幻象般的冰雪扑面试探，确认她在示威。随后他赶赴朝歌城面圣，得知朝局：中州派力挺景辛、废储难行，青山与中州派开战似已难免；他推演战局正觉麻烦，忽然明白一切动荡都源于师兄，只求大陆生灵涂炭便算他赢。一位相府小姑娘在他身边坐下垂泪，他认真答道：我不是庸人，他也不是。"},{"n":471,"orig":471,"title":"人类一直不是一类人","people":["井九","顾清","井商","小七","奚一云"],"one_line":"井九拍板井梨婚事，顾清提亲遭一茅斋书生回绝。","summary":"净觉寺垂泪的小姑娘正是宰相家的小七，井九请她倒茶后赶往井宅，让井商来见，当场拍板：只要井梨想娶小七，这门亲事就要成，一切交顾清操办。顾清决定抢先去宰相府提亲，抢在詹国公世子之前，认为身后有鹿国公、陛下与青山，未必要输给有中州派背景的詹国公府。井九点破真意：这门亲事若成不了，景尧还怎么当太子；说服一茅斋则要用东西去换。随后顾清找到卓如岁同行，向一茅斋的奚一云提出让其为景尧授课，被以「他非我族类」断然回绝。"},{"n":472,"orig":472,"title":"一茅斋的秘密","people":["井九","柳十岁","布秋霄","奚一云"],"one_line":"柳十岁背起居录，井九锁定布秋霄当年受伤之秘。","summary":"奚一云拒绝合作，顾清却请出了在一茅斋读书的柳十岁。回到井宅，井九与柳十岁核对近况，得知斋主布秋霄已隐约怀疑柳十岁握有镇斋之宝管城笔——当年严老书生指其私德有亏、要求退位不成，反带着管城笔叛斋而逃，最终死在西王孙剑下。柳十岁背出一百年的斋中起居录，井九以青天鉴敲点择要，锁定四十七年前布秋霄在千里风廊受伤一节：如墨妖血来自一只颈细长的巨妖。他让柳十岁传信布秋霄，要八天之内前来一见。"},{"n":473,"orig":473,"title":"故事的本质就是瞎编以及重复","people":["井九","鹿国公","岑相","岑诗","柳十岁"],"one_line":"井九脑补无证故事；提亲当日鹿国公闯府宣旨。","summary":"井九由起居录推想出一个没有证据的故事：水月庵太上长老才是辈分最小者，何霑的奇运可能来自庵中那顶青帘小轿；又在青天鉴幻境里看到小河、乌篷船与一个婴儿、远去的书生，心中大致有了轮廓。他只要说服自己，不需要证据。婚事线推进：詹国公府八日后提亲，宰相府喜迎七小姐岑诗出阁，鹿鸣夫妇察觉岑诗不哭反喜，隐隐不安。提亲当日，鹿国公带着井家父子与圣旨闯府，指婚井梨与岑诗，宰相以「君有乱命，臣不应」拒旨，中州派白千军站台，卓如岁懒洋洋地顶了回去。"},{"n":474,"orig":474,"title":"抢亲？","people":["鹿国公","岑相","井商","卓如岁","白千军","顾清"],"one_line":"圣旨指婚遭宰相拒接，白千军卓如岁当场对峙。","summary":"鹿国公带井家父子闯入提亲礼，宰相怒斥强人所难；鹿国公取出圣旨，陛下直接为井梨与岑诗指婚。岑相拒不受旨，搬出「君有乱命，臣不应」，直言不会同意；中州派白千军露面站台，讥青山宗「很了不起吗」，卓如岁应声而出「有本事你打过我啊」。顾清另有安排：顾家已藏下詹国公世子私赎的青楼少妇母女，准备当众揭破丑闻；一位书生却先一步潜入珍宝行，劝少妇去一茅斋当洗衣妇，局势悄然生变。"},{"n":475,"orig":475,"title":"杨柳岸无题","people":["奚一云","顾清","井九","布秋霄"],"one_line":"布秋霄叫停婚事，井九旧梅园提条件：景尧继位。","summary":"奚一云代表一茅斋到场，先指顾清动用下作手段、救人实为心机深刻，顾清坦然自称商人、救人要有回报；奚一云随即转达布秋霄之意——师父同样反对岑诗嫁给人渣詹国公世子，婚事被叫停。宾客散去，井九按约与布秋霄在旧梅园见面，称这次见面与当年的梅会一样决定人间格局；他直言青山的要求：景尧为下任神皇，景辛入果成寺为僧或死，并以神兽、禅子为例驳斥「狐妖之子不得为帝」的书生理念。"},{"n":476,"orig":476,"title":"我与斋主两心通","people":["井九","布秋霄"],"one_line":"井九点破何霑身世之秘，布秋霄惊怒交加。","summary":"井九先提条件：景尧为下任神皇，景辛入果成寺为僧或死；布秋霄以斋规回绝。他发现井九竟会用果成寺两心通，井九坦承这是故意的叫牌。随后井九一语点破他隐藏数十年的秘密——与水月庵太上长老有私情、生下何霑，致其破境失败而逝，严书生正是因此指其私德有亏、不配为斋主。井九断言「何霑是你儿子」，布秋霄杀机顿起又强自克制，坦承从未想过杀严灭口——严至死不泄密，正是出于对他的信任。"},{"n":477,"orig":477,"title":"圣人无名","people":["井九","布秋霄","岑诗","顾清"],"one_line":"井九以水月庵之秘迫布秋霄就范，圣人无名点化。","summary":"布秋霄坦承旧事：当年他愿担责，太上长老却不愿，选择退让，遂生变故；他至今不懂「情」字。井九以水月庵相胁：若让庵中那位醒来知道真相，一茅斋恐难保全，布秋霄遂应下婚事与皇位中立，只求归还管城笔；井九以妖凤命牌为信，回赠四字「圣人无名」。消息传出，宰相府喜事落定，岑诗喜出望外，景辛府与中州派脸色难看，皇宫欢腾。井九私下推想：何霑生父可能另有其人，布秋霄是在替前任斋主背锅，对他观感更佳；当夜他在白马湖设宴犒劳顾清等人。"},{"n":478,"orig":478,"title":"世间无我这般人","people":["井九","卓如岁","顾清","柳十岁","神皇"],"one_line":"柳十岁留一茅斋，顾清入宫护景尧，暗处有影随行。","summary":"神仙居里说书人正讲井九旧事，井九喝着白汤听若未闻，随后安排柳十岁回一茅斋安心读书，学习正气之道，也埋下一茅斋将来倾向青山的伏笔；卓如岁担心柳十岁投斋，井九不置可否。他让顾清入住皇宫一年护卫景尧，一年后旨意未下便回青山；又与神皇对谈国事，劝其不必拘泥帝王之术，不听话的杀了便是。离开皇宫时，井九察觉暗巷里有一道注视，能瞒过他的必然不是人——他喝令树影里的东西出来。"},{"n":479,"orig":479,"title":"南方飘来一朵云","people":["井九","大祭司","冥师"],"one_line":"冥部大祭司与冥师先后接触井九，留语南云将至。","summary":"树下影子现出冥部大祭司的投影——冥皇死后有权与冥师并列的大人物。他自称只想报个名字，日后青山做决定时留一条出价之路，还透露打击太平余孽之利；井九惊觉与布秋霄、冥师的谈话竟都被冥界知晓。冥师随后现身，承认冥皇之玺的消息是他故意放出的，并反过来拉井九合谋把大祭司送进冥河——他查到此人一直与云梦山暗通款曲；但他直言只与最后的胜利者联手，井九太弱，不可信。冥师留下一句话消失：「南方飘来了一朵云」，井九僵立原地，望向南方。"},{"n":480,"orig":480,"title":"海边送来了一封信","people":["南趋","南筝","柳词","井九"],"one_line":"雾岛老祖南趋携棺离岛欲灭青山，信使跳崖传信。","summary":"师兄的信只有一句话——南方飘来了一朵云。那朵云是笼罩南海群岛的浓雾，雾里的南趋是朝天大陆第一位遁剑者、青山最强大的敌人，师祖广缘真人因他飞升失败而消解。数百年来雾岛被青山剑阵锁死，如今那团雾竟脱岛北飘，蓬莱大船与一个渔村的人悄无声息死去；不老林出身的南筝侥幸活着，雾中老人自称她的祖宗，命她找来一口阴气重的黑棺，把雾气尽数收进棺中。他要赶在寿元耗尽之前灭掉青山。与此同时，一个普通人来到青山南山门，自称「我是一封信」，把信送上天光峰后纵身跳崖而死；柳词读罢，望向西海，久久无言。"},{"n":481,"orig":481,"title":"我见青山多妩媚","people":["井九","柳词","元骑鲸","元龟"],"one_line":"井九步行登天光峰，应太平之请，将与柳元二人说破青山内鬼","summary":"井九步行上青山，从南松亭、浣剑溪走到天光峰顶，一路回忆八百年前被师祖道缘真人带回青山之事：师祖被南趋暗算身亡，师父欲破境报仇却道心消解而死，师兄开峰收徒重续青山道统。他在天光峰顶对柳词道出「青山是我的青山」，表示会同意太平真人重回青山的要求。柳词透露太平也给自己写了信，若隐瞒便会被上德峰知道，疑似挑拨手段。元骑鲸驭三尺剑而至，指太平当年能从剑狱逃走，青山内必有大鬼，他与柳词互相怀疑多年，今日终于要摊牌说破。"},{"n":482,"orig":482,"title":"欲窥人心问太平","people":["柳词","元骑鲸","井九","雷破云"],"one_line":"柳词转述太平来信定策西海，井九主张杀南趋后连太平一并杀","summary":"三十年前太平趁景阳飞升逃出剑狱：碧湖峰主雷破云受名剑之诺，送雷魂木助其移魂冥部妖人之身（即阴三）躲过剑阵，事后被元骑鲸以走火入魔之名关押，两年后逃出凄喊「没有一，那二呢」，疑似遭灭口。柳词与元骑鲸互疑对方是内鬼。柳词转述太平来信：他已去西海，要青山趁机灭掉西海剑派——青山打压西海只因西海剑神师承雾岛老祖，如今太平藏身西海便是最大恶行，青山师出有名。井九指出关键是柳元二人信不信太平，若对方真正的目标是杀他们便危险。柳词选择相信，井九定策：杀死南趋，再把太平杀了，天下太平。"},{"n":483,"orig":483,"title":"这样做不好，不要做好人","people":["井九","赵腊月","柳词","元骑鲸"],"one_line":"井九定策倾巢而出，向赵腊月剖白选柳词掌门缘由与不做好人论","summary":"井九定策：局面越复杂应对越简单，青山倾巢而出赴西海，连白鬼、阴凤都带上，只留方景天看家。最难在杀南趋：柳词没有剑，井九建议请雪姬与之联手，被元骑鲸斥不该对小姑娘下手。他向赵腊月交代那封信之事，二人谈起青山的鬼：井九早年怀疑柳词，但柳词果成寺一剑重伤玄阴子等作为已洗清嫌疑，元骑鲸嫌疑最大。井九自承当年选柳词接任掌门只因境界更高，何况元骑鲸不喜欢他。赵腊月劝太危险不如离开青山，井九答能活着便证明对方无杀心，又留下「不要当好人，这个世界太重」之语，随后取出青天鉴沉默磨剑。"},{"n":484,"orig":484,"title":"准备出剑","people":["阴三","西海剑神","苏子叶","井九","玄阴老祖"],"one_line":"阴三摸到西海阵枢，西海剑神布局诱青山，井九磨剑右手复原","summary":"阴三与玄阴老祖夜探西海，因吞噬了大阵设计者天近人的神魂，对西海阵法了若指掌，找到山门大阵阵枢所在的洞府，打算届时开阵放青山进来。另一边西海剑神接见苏子叶，得报中州派称太平真人在青山有内应、杀之可引青山来人。西海剑神嘱其对外宣称初子剑在天璇岛以诱敌，并应苏子叶所请，答应事成后杀阴三——苏子叶怀疑阴三才是老祖真正的传人。童颜偷青天鉴叛出中州派的消息传来，西海剑神许他来投。西海剑神自嘲不擅阴谋，只信实力，此番更非一人作战。神末峰上井九闭关磨剑终日，剑峰群剑嗡鸣似迎名剑，出关后右手伤势尽复。"},{"n":485,"orig":485,"title":"噫，南忘！","people":["井九","南忘","赵腊月","顾清"],"one_line":"井九托付青天鉴后携南忘南下一夏寻南趋，道州城终获线索","summary":"井九把青天鉴交顾清送回三千庵堂，履行对童颜的承诺，与赵腊月等人郑重道别，赵腊月拥抱相送。他单独出山，到云集镇火锅酒楼接上柳词安排的同行者——清容峰主南忘，一位嗜酒娇纵的破海境南蛮女子，醉后撒泼被井九以冰水泼醒，白鬼出手挡下她的抓捏。二人乘顾家马车南下，青山动用卷帘人与大批剑修传递消息，寻了一整个夏天南趋藏身处，却始终无线索。南忘压力极大，借酒浇愁。至道州城湖面，她醉后纠缠井九要他笑一个、跳个舞，恰在此时湖畔驶来一辆刻海棠的马车，大夫冲出高喊：找到了。"},{"n":486,"orig":486,"title":"山神庙与红灯笼","people":["南忘","井九","南筝"],"one_line":"南忘通神术绘出线索图，南筝驾棺车入野山山神庙点红灯笼","summary":"情报指向鹿山，南忘恢复清容峰主威严，与井九赶赴这座南蛮祭祖名山，召集部落长老相助。她在山神庙施展南蛮通神术与无端剑法合一的神通，织出天南地图：蓬莱宝船被屠处、岸边村庄离奇死亡处等可疑光点连成扇形向北散开，一条暗线自鹿山伸向益州方向。井九推断南趋必是用山神拘魂大法把自己炼成活尸，方能屏蔽青山剑阵探查，因此绝不能动，只能借最普通的运输入山——他在棺材里。同一时间，不老林出身的南筝驾着载有黑棺的马车潜入益州附近野山，竟发现一座部落山神庙，将棺材抬入庙中，点亮一盏红灯笼，红光喜庆又诡异。"},{"n":487,"orig":487,"title":"最擅长挖洞的人","people":["童颜","西海剑神","南筝","阴三","白早"],"one_line":"剑鬼童子现世守棺，童颜借青天鉴投西海挖洞觅得初子剑","summary":"红灯笼亮起，棺上竟坐出一个苍白孩童，自称剑鬼童子，能嗅出「伪神的味道」，嘱咐南筝守好棺材便消失无踪。白早到水月庵求卜无门，她已猜到过冬前辈的身份，此行是受童颜师兄所托。童颜携青天鉴投奔西海剑神，换来研习少明岛太上玄功副册的机会，被关入石室。他并未立刻修炼，而是凭记忆中的阵图挖洞，直通藏剑洞府——那里放着初子剑，虽因神皇烙印与剑神禁制无法带走，他仍隐入角落耐心等待。同时阴三与玄阴老祖也摸上少明岛，老祖自夸最擅挖洞，阴三却说不必：只等山门大阵破掉那天，走过去拿走便是。"},{"n":488,"orig":488,"title":"什么我都有预感","people":["井九","南忘","南筝","白猫"],"one_line":"青山推定南趋炼成活尸，白猫引路寻得破庙，井九察觉剑鬼已离体","summary":"青山推演多年得出结论：南趋以蛮部山神拘魂大法把自己炼成活尸，故能避开大阵搜索，可靠率九成以上。南忘不解为何不循棺材线索追查，井九告以凡人常识：大陆每年死人上千万，要查的区域每天有上万具棺材开合。二人循白猫嗅觉深入荒山，寻到挂红灯笼的破庙，南忘认出守棺少女是当年清洗漏网的南筝，庙中神像竟是南趋本人。井九以弗思剑传书青山却不让诸峰来援——他察觉红灯笼是召魂之器，棺中干尸没有魂魄，南趋的剑鬼已离体，恐去了西海，青山必须全力赴西海应战。他安排南忘与白猫先走，自己留守监视。"},{"n":489,"orig":489,"title":"剑舟出青山","people":["井九","南忘","柳词","赵腊月","元骑鲸"],"one_line":"南忘因南蛮存亡留守，青山十七艘剑舟倾巢出征西海","summary":"井九推算棺中南趋醒来可能不超过一成，劝南忘与白猫离开，南忘拒绝——青山若倒，南蛮部落的安稳便不复存在。弗思剑飞回神末峰落入赵腊月手中，她开启禁制准备出征。青山九峰依次登舟：元骑鲸率上德峰强者，连镇守阴凤都随之离山；成由天领碧湖峰，过南山等两忘峰弟子自雪原归来便再赴战场，适越峰由广元真人带队，连洗剑阁未承剑的少年少女也随行。柳词令小四方景天留守看家，取下承天剑鞘，鸣剑为号，十七艘剑舟破云杀向西海。数十份剑书投往大陆各处昭告伐西海，青山行事堂堂正正——何况掌门没剑，坐舟更快。"},{"n":490,"orig":490,"title":"一人出而天下惊","people":["柳词","白真人","禅子","布秋霄","何渭"],"one_line":"剑书诏告太平出关，大陆震荡，千余修行者齐聚西海观战","summary":"青山剑书诏告天下：太平真人出死关藏身西海，青山前去要人。消息震动大陆：张遗爱连夜进宫面圣，神皇却异常平静；果成寺禅子定调「太平必须死」，派讲经堂高僧赴西海盯着青山；北方宗派闭山，神骑军南移，布秋霄率一茅斋书生乘苦舟赴西海。正道领袖中州派反而平静——白真人早从苏子叶处确认太平已逃，她料定青山最擅外战其次内斗，要帮青山记住真实目的，遂率云船出发。十七艘剑舟在天空洒下流星般的剑光，万民跪拜。数十宗派千余修行者齐聚西海外围，无人敢近前。阴云中无数「闪电」斩落海岛，随后剑舟破云现身——闪电原来都是青山飞剑。"},{"n":491,"orig":491,"title":"青山好强","people":["成由天","广元真人","祈莫赎","何渭","布秋霄","柳十岁"],"one_line":"剑舟碾压西海外围，成由天秒杀祈莫赎，广元一剑惊人","summary":"青山剑舟展现可怕打法：舟首弟子轮番闭目驭剑轰击，剑元耗竭便换人，丹药晶石源源补给，剑光昼夜不歇，外围百余座岛屿或毁或降。算天阁凭天近人打造的护岛阵法挡住飞剑，剑舟一声令下结成剑网，瞬间破阵；阁主祈莫赎持白鹿书院法宝冲天欲撕开剑网，被碧湖峰主成由天借弟子剑阵引动潮水一剑轰落海中，法宝反被夺走。黑石山守军顽抗，天光峰长老墨池与白如镜两剑贯穿山腹斩断石山。一名西海破海长老出击，被无人识得的青衣道人以回日剑六龙剑诀一剑腰斩，何渭与布秋霄骇然不知其人，苦舟中柳十岁道破：是适越峰主广元真人。观战诸派尽皆胆寒。"},{"n":492,"orig":492,"title":"山中贼都是青山贼","people":["柳词","西海剑神","阴三","布秋霄","柳十岁"],"one_line":"西海剑神现身请战，柳词请家师回山，少明岛阵枢自开阴三现身","summary":"诸派渐看清：青山师长只在关键时出剑，普通弟子轮番主力出击，上德峰降雪、碧湖峰落雷、天光峰结阵，西海法宝阵法皆被随意破解，实为碾压。布秋霄点破青山故意等各派到齐才动手，此战是打给全大陆看的。柳十岁望着神末峰剑舟黯然。西海剑神终于携仙阶名剑十二重楼现身，青山仅派皆空、回日、八方三剑相迎。柳词宣示来意「请家师回山」，神皇下旨令各派配合，西海剑神拒绝开阵，宣称以战相见，并催动大阵、召出飞鲸，摆出玉石俱焚之势。柳词却一直在等：阵枢所在的少明岛巨石移开，山门大阵自开，阴三端坐楼台喝茶，高呼柳词孽徒，问是否真要师徒不死不休。"},{"n":493,"orig":493,"title":"举世之敌","people":["井九","白真人","柳词","顾清","皇帝"],"one_line":"诸派确认太平现身，朝歌揭其旧恶，井九起身走向破庙","summary":"各派掌门确认那年轻人便是太平真人，举世震动。柳十岁敏锐察觉诸事太自然，像被精心安排；白真人断言「演得太过了」，青山最擅外战其次内斗，中州派要帮青山记住真实目的。元骑鲸暴雪冰封海面断绝太平退路，西海剑神怒而一剑削平少明岛山顶，玄阴老祖暗中接下这一剑护住阴三。柳词斥西海剑神故技重施杀人灭口。朝歌城里顾清向景尧皇子讲透关窍：青山久欲灭西海只缺理由，身为举世公敌的太平便是最好的理由，没有人会允许他活着。皇帝则道出旧秘：太平当年想打造没有凡人、只有修行者的世界，酿成百年灾祸，非正常死亡逾三亿。井九这边起身走向破庙，去会黑棺里的老鬼。"},{"n":494,"orig":494,"title":"似曾相识剑归来","people":["南忘","井九","南趋","西海剑神","柳词"],"one_line":"南忘毁灯笼开棺，南趋睁眼；西海剑神承认师承请战柳词","summary":"南筝认出灭门仇人南忘，舍命一击被剑弦绞成重伤。南忘付出代价焚毁召魂的红灯笼，敲开黑棺挥剑斩击，那具干尸竟毫发无损，南趋睁眼说没想到你们找到了我。西海方面，飞鲸欲撞少明岛与太平同尽，被阴凤以尾剑拦截重创，潜回海底。柳词开出苛刻条件：解散西海剑派、诸派共管、剑神发剑鬼毒誓永离大陆，西海剑神断然拒绝，公开承认师承雾岛，宣称要与青山分个剑道高下，请柳词出剑。荒山中井九看出南趋走的是逆修成剑、养鬼夺魄的全新道路，暗赞此乃真正的开宗建派。南趋打量井九的面容，缓缓道：好一把完美之剑，似曾相识。"},{"n":495,"orig":495,"title":"两把剑的相遇","people":["南趋","元骑鲸","柳词","阴凤","西海剑神"],"one_line":"南趋剑鬼借鲸血潜入剑舟重创元骑鲸，柳词与剑神战于虚境","summary":"柳词负手凌空与西海剑神对峙，众人惊觉掌门竟未召剑。元骑鲸盯着阴凤尾羽上的血渍起疑：荒山红灯笼烧破时，血泡里的小黑点迎风涨成剑鬼童子——南趋的剑鬼一直藏在飞鲸体内，借飞鲸假意撞岛、混在鲸血里潜入剑舟，穿过元骑鲸的身体，令这位通天大物重伤，三尺剑始终在外维持对少明岛的冰封。剑鬼童子在舟上大开杀戒：长老段莲田殒命，迟宴断臂，更毁剑舟阵核令其坠落，阴凤全力追击亦不能及。元骑鲸以风雪与冰团暂困强敌，数百飞剑围杀无效，柳词遂与西海剑神战于高天虚境，雷电落下。"},{"n":496,"orig":496,"title":"我杀这边，你杀那边","people":["井九","南趋","卓如岁","柳词","柳十岁"],"one_line":"井九大悲手锁南趋本体，卓如岁布阵，不二剑飞来补全剑阵","summary":"井九以禅宗大悲手握住南趋干尸，欲唤青山剑阵毁其本体与剑鬼，南趋却笑言自己寿元已尽、大限将至，是来赴死的，无所畏惧。井九下令动手，宇宙锋、锦瑟剑与白鬼同时攻向南趋要害。西海这边，数百飞剑杀不死剑鬼童子，阴凤追之不及，又毁一艘剑舟。柳词连喝星位，关门弟子卓如岁观察十三息后布下六星剑阵困住剑鬼，但阵法需六峰主剑，尚缺其一；元骑鲸以冰镜护住卓如岁再喷精血。关键时刻，本应随景阳飞升的不二剑破空而至补全剑阵，布秋霄深深看向柳十岁，后者只道：打雷了，是不是要下雨？南趋现身，西海剑神以弟子礼相迎，众人方知剑鬼童子便是雾岛老祖。"},{"n":497,"orig":497,"title":"柳词请剑","people":["柳词","南趋","井九","白猫"],"one_line":"南趋压服柳词自诩超越青山，柳词道出「其实我有剑」请剑","summary":"南趋给柳词挑战机会，扬言无剑何以至大道，要收他为徒。交手中柳词被一剑斩得狼狈落海，南趋自陈当年道缘不肯收他，他在海外得仙人遗府创出新剑道，以剑鬼为人、以人为剑，如今终于证明超越青山，放话青山之衰由此刻开始。柳词淡然回敬：偷袭与超越是两个概念，又点破这法子青山早已有之。荒山里井九苦战南趋本体，被对方拿当武器砸得南忘、白猫连连重伤，井九浑身溢血。绝境中柳词亮出真相：其实我有剑——承天剑鞘现于身前，他右手握住空中某处缓缓拉出，天地闻剑鸣。白猫哀求地望着井九，井九问了南趋几个关于「哪个才是真的你」的问题，随后接受柳词的邀请，飘了起来。"},{"n":498,"orig":498,"title":"我是一道剑光","people":["井九","南趋","柳词","西海剑神"],"one_line":"井九化作剑光破南趋本体，柳词落剑斩杀南趋剑鬼于高天","summary":"青山九峰异象齐现，井九身体飘起如剑离弦，高速撞穿南趋本体留下一个空洞，随即化作一道剑光直奔西海。柳词自承天剑鞘中拔出无形之剑，天地剑意汇聚右手，落剑时数百青山飞剑低头臣服。南趋剑鬼不敢正面接剑而逃，西海剑神出手拦截，被过路的剑光撞飞重伤，十二重楼剑尽数碎裂；剑光入海解体飞鲸，随后追南趋至高天。天上落雨，人们知道南趋死了。荒山中南趋本体明白万物一之理，闭目而逝。虚境里井九与南趋神识对话，自报「我是景阳」，南趋感慨好一把绝世之剑、好一个绝世之人，身化光点散作细雨。井九道：风平一世，浪静千秋。"},{"n":499,"orig":499,"title":"天空又再涌起密云","people":["井九","苏子叶","西海剑神","童颜","阴三"],"one_line":"苏子叶以裴白发剑意重创剑神，童颜举青天鉴仙光射阴三","summary":"井九确认自己因应柳词之请发生玄妙变化，也担忧少明岛上的师兄若真是那只鬼，此局终了恐无福享用。世间震骇于那道或有史以来最强的剑光，柳词有剑在手便是天下最强。西海剑神逃回坠仙岛质问苏子叶是否从头到尾都是局，苏子叶坦然承认目标就是杀他，中州派许诺事成后为玄阴宗寻一条灵脉，随即眉心射出裴白发的剑意，重创西海剑神道树。西海剑神没有杀他，只留下一句「看来青山也要出事」。少明岛上，阴三计划取初子剑转剑身后再上青山重来，却遇上了守在剑旁的童颜。童颜双手举起青天鉴，一道蕴含仙气的白光直射而出。"},{"n":500,"orig":500,"title":"青山宗的仙与鬼","people":["柳词","童颜","阴三","玄阴老祖","井九","白真人"],"one_line":"仙箓引天劫诛太平，柳词出手相护，阴凤竟载太平遁走","summary":"青天鉴中的仙箓仙气尽出，仙光穿体重创阴三，更引动雷域天劫轰向少明岛——当年发愿此生不度天劫的太平，终究劫数临头。危急时刻柳词现身，一只手掌挡尽满天雷火，救下太平并因此受伤。青山弟子迁怒引光的童颜，飞剑齐出，童颜借中州派万里玺瞬间脱身至云船，白真人一句「这几年辛苦你了」道破这是中州派的局。玄阴老祖背起重伤的阴三突围，布秋霄驭龙尾砚拦截，却被广元真人挡下；果成寺高僧欲围堵，被天光峰墨池拦住；追击的何渭被阴凤砍落冰面。最终阴凤竟驮着太平与玄阴老祖远遁，元骑鲸令井九杀阴凤，井九却迟迟未动，暗叹青山的鬼远不止两三个。"},{"n":501,"orig":501,"title":"中州派的故事","people":["白真人","柳词","童颜","井九","白早"],"one_line":"柳词纵放太平震慑诸派，童颜盗鉴始末回溯","summary":"白真人当众质问青山为何救魔、阻拦追杀，柳词答「家师再如何该死，我救他也没有错」，随后率剑舟离开西海，只留碧湖峰善后，各派因忌惮那道剑光无人敢动。井九知道柳词挡下的是天劫必受重伤，也看见广元、墨池等青山强者出手背后显现的裂痕。井九与白早擦肩对视，回溯童颜盗鉴始末：他挖洞救出青天鉴被白真人擒获，白早求情，童颜以一个当场编成的故事打动白真人，获赠万里玺为护身禁制；仙箓借火鲤大王神识藏入青天鉴幻境，再经井九还鉴回到童颜手中。暗室开启，太平真人走了进来。"},{"n":502,"orig":502,"title":"莫道万物不值得","people":["井九","柳词","童颜","白真人"],"one_line":"井九道破柳词是鬼，二人夜谈剑与掌门之约","summary":"井九复盘此局：青山得西海，但太平现身、阴凤叛逃、内乱引子埋下，真正大获全胜的是中州派。云船上白真人问童颜立功想要什么，童颜只求让青儿活着；白真人一句「太平死了吗」令他沉默，他自问是否尽力，最终没有把雪姬之事告诉师尊。返程后井九与柳词峰顶夜谈，井九道破「原来是你啊」——柳词正是青山最大的鬼。柳词坦言自己只是想要一把剑：承天剑鞘本是控制那把剑的器物，历代掌门皆为执剑人；井九坚持「这是我的剑」，柳词答「我是掌门，这当然是我的剑」。井九承认杀太平是自己最想做的事，只是没算到柳词会站出来替师兄挡下天劫，叹道「不值得」，柳词宽慰说仙箓是副箓，还能活几年。"},{"n":503,"orig":503,"title":"只问平生行何事","people":["井九","柳词","童颜"],"one_line":"柳词剖白放虎出山之由，劝井九接掌门之位","summary":"井九指柳词挡天劫不值得，柳词回忆初见井九崖畔发呆的往事后，道出放太平出剑狱的缘由：井九飞升在即，他与元骑鲸寿元只剩百余年，青山不能败、自保便是败，放太平这只猛虎出山，青山便不会出大事。井九不认同这般粘乎行事，感叹当初不该选他做掌门，柳词答「那你来啊」——原来柳词的邀请还有更深一层：只有掌门才能执承天剑鞘，剑已归鞘便必须托付给井九绝对信得过的人。井九头一次没能直接拒绝。柳词宽慰那道仙箓是副箓、还能活几年，并说若是永生万物不换，拿几十年换个舒畅有何不可。二人正谈论余生想做什么，童颜连夜到访，提议青山把青天鉴夺回去。"},{"n":504,"orig":504,"title":"老夫聊发少年狂","people":["童颜","柳词","井九","南忘","平咏佳"],"one_line":"童颜献计叛投青山，井柳二贼夜偷青天鉴","summary":"童颜自陈挖洞六年深知云梦大阵并写好解法，建议青山去夺青天鉴；柳词点破此事一旦泄露他必死，童颜只道自己眼里只有黑白，杀太平是正，后果不该他承担。柳词不许，除非他与青天鉴一道归入青山，童颜干脆应允。神末峰剑舟上南忘放话柳词死后必杀童颜，平咏佳却拿毡布把他蒙起来，说回青山藏几年换个道号，气氛为之一松。井九与柳词修正童颜的地图解法，顺带聊起柳十岁身世等旧事，随后二人乘宇宙锋夜入云梦山。青儿以为只是随柳词游历，垂泪问童颜会不会死，柳词答不会。得手出山后，柳词提议顺手把玄阴宗灭了，井九答：好啊。"},{"n":505,"orig":505,"title":"谈笑间","people":["柳词","井九","苏子叶","曹园"],"one_line":"柳词一剑灭玄阴宗，曹园助刀，浊水一夜变红","summary":"柳词请剑出鞘，井九再度化作剑光直取冷山烈阳峡。剑光瞬间击破以烈阳幡为基的玄阴宗山门大阵，斩碎烈阳幡，王小明血染幡布惨死，宗门历年积累的魔器珍藏被尽数摧毁。赶回冷山的苏子叶正欲收拢旧部，北方忽来一道刀光——刀圣曹园见猎心喜，自千里外来一刀助兴，剑光刀光相和，整座峡谷被掀上天空再落下，高崖、苏七歌与阖宗上下无一生还，玄阴宗就此而绝。数日之内雾岛老祖被杀、西海剑神被逐、西海剑派与玄阴宗相继覆灭，邪道千年难复元气；那道剑光更连夜贯穿整条浊水，万里河水被妖尸染红。朝歌城里，神皇颁旨立景尧为太子。"},{"n":506,"orig":506,"title":"云游","people":["井九","柳词","赵腊月"],"one_line":"柳词云游离大陆，井九道破太平欲杀尽凡人","summary":"神皇再下旨查办景辛皇子（当年赵腊月遇刺案主使），景辛被迫去果成寺出家，果成寺拒收，改送水月庵；中州派随即宣布封山三年。柳词与井九游历东海，看过通天井，柳词还想为最后一剑去趟雪原，被井九以「冷静」劝止，遂决意驾云离开朝天大陆去异大陆云游，青儿相伴。井九回神末峰，向赵腊月道破那只鬼是柳词，并解释太平真人的理想：杀死所有凡人、创造只有修行者的世界；他认为凡人非但不是奉养修行者，反是修行者在养活凡人，修行者该多生孩子，不能修行的后代则任其死去；赵腊月推演后发现那样的新世界依旧层层压迫，与旧世界并无本质区别。井九道破真因：他眼里不止这个世界。"},{"n":507,"orig":507,"title":"剑外之意","people":["井九","赵腊月","阴三","元骑鲸","童颜"],"one_line":"井九剖太平人人飞升之志，向童颜讨初子剑","summary":"井九向赵腊月道破太平的野心：他感觉天上世界充满竞争与危险，自认负有引领世界的责任，想打破规则带领所有修道者一同离开，即「人人飞升」，与禅宗人人成佛相通；井九不认可其实现手段——洪水滔滔、皇兄身死、连自己人都杀。清容峰上南忘借酒高歌，井九提起她本该是柳词的道侣，只因她不喜欢他。元骑鲸伤愈出关，入隐峰逼方景天承诺闭关至获准为止。阴三化名蛰居南华城外村落，收养一名三四岁的孩子预备「教四年写大文章」，又让人送来受伤的阴凤。井九探剑狱与雪姬无言对视，还问她椅子硬不硬要不要换。最后他潜入隐峰找到藏身的童颜，开口要投名状：我要初子剑。"},{"n":508,"orig":508,"title":"匣中之剑","people":["井九","童颜","赵腊月","成由天"],"one_line":"初子剑回归井九，青山群强闭关静候春雨","summary":"井九向童颜点破初子剑就藏在他处：此剑本是道缘斩南趋后交予井九，三百年前井九转赠神皇，南趋一死、神皇烙印又已消散，剑本该物归原主。童颜以青山弟子身份讨要待遇，井九许他九峰秘剑随便挑，最终以碧湖峰送回的一颗巨海珠为匣，初子剑重归井九之手。神末峰众人猜测此剑归属，井九只说不是给元曲与平咏佳的。剑归而故人将逝，井九心情低落，赵腊月轻揉他残缺的耳垂。随后井九宣布闭关，赵腊月相随，青山九峰强者陆续闭关、大阵全面开启与封山无异，举世静候那场春雨。两年后井九出关，见赵腊月已至游野上境关口，童颜亦现破境征兆，元骑鲸伤愈复出，井九决定近日破境。"},{"n":509,"orig":509,"title":"破海","people":["井九","元骑鲸"],"one_line":"井九孤身赴清心大会，碧湖峰召雷破海","summary":"井九难得安慰失落的元骑鲸「你也更强了」，元骑鲸自嘲老病将死看淡诸事，不过是回光返照。他告知悬铃宗清心大会将开：老太君寿元将尽，想借大会彻底解决宗主之争，青山原拟派普通长老何不慕出席，井九却说自己独自去、不必告诉别人。随后井九如雄狮巡视领地般走遍云行峰、适越峰等诸峰查看剑械丹药，再到碧湖峰湖底宫殿取出雷魂木重宝——他没有动成熟的五根，只取了一根尚需数百年方能长成的新木，借大阵阵眼召来雷暴雨，以天地精纯能量洗剑。雷暴过后，井九白衣成絮、耳垂焦黑地走出湖中，换上新衣——他破了海境。"},{"n":510,"orig":510,"title":"谁当掌门比较好？","people":["井九","年轻僧人","老僧","阿大"],"one_line":"井九携初子剑出山，散修热议青山下任掌门","summary":"井九抱着初子剑离开青山，白猫猜出他意在以剑为饵诱太平真人现身，惊惧抗议却被他无视，还挨了一爪。另一边，悬铃宗清心大会前夜，东岭破庙里各派散修齐聚互通消息：老太君执意如期开会，是想趁天下不敢轻动时定下宗主之位。果成寺老少二僧的意外现身令众人心生不安——无大事果成寺不出动——甘姓散修当场离去。众人转而热议柳词之后谁当青山掌门：多数押元骑鲸，也有人举破海巅峰的广元真人、深不可测的方景天，云行峰主伏望亦被提及，末了齐叹再无人能如柳词一剑耀天下。夜尽人散，戴笠帽的井九起身问二僧：你们觉得谁当青山掌门比较好？"},{"n":511,"orig":511,"title":"清心一问","people":["井九","何不慕","老太君","德渊泉","年轻僧人"],"one_line":"老太君挟德渊泉夺位，何不慕当众问你想死吗","summary":"井九与二僧夜话，得知西海事后禅子因柳词放走太平而恼怒，果成寺已断绝与青山往来，井九自称神末峰弟子化解尴尬；年轻僧人早不修闭口禅，絮絮讲述游历治病旧事。三人买笠帽扮作果成寺僧人同赴黎明湖。清心大会当晚风云突变：老太君携夫家侄儿德渊泉亮相主位，宗主陈氏与少宗主瑟瑟不见踪影，众人惊觉她竟要直接传位外人。青山代表何不慕当即发难，要求明日见到宗主与少宗主，老太君以男女有别推拒；何不慕道出神末峰多年只有童颜、白早与瑟瑟三位客人，撂下「她不能有事」，最后盯着德渊泉问出那句变体的青山口头禅：你……想不想死？"},{"n":512,"orig":512,"title":"井九做事","people":["井九","德渊泉","老太君","阿大","何不慕"],"one_line":"井九磨剑布杀局，一剑穿颅狙杀德渊泉","summary":"何不慕放话后带弟子离去，给悬铃宗一夜思量。老太君却已决意今晚让德渊泉杀死陈氏，以死亡取信青山，再借瑟瑟要挟拖到云梦开山。同一夜，小院里井九盘坐炼剑，以磨剑术同时淬炼宇宙锋与初子剑，南趋与西王孙留在剑上的精血痕迹渐渐磨去；阿大潜入禁地找到囚禁陈宗主母女的石壁，也探得老太君的杀局。深夜，一道飞剑直入德渊泉居所，他以铃铛夹住飞剑正自得意，井九凭空出现，右手化作金属光泽的光线穿过他的头颅，不留一滴血。而二十余里外的小院里，井九始终端坐蒲团未曾动过，阿大震惊无言。"},{"n":513,"orig":513,"title":"陈宗主与她的女儿","people":["井九","瑟瑟","陈宗主","阿大"],"one_line":"井九救出陈宗主母女，兑现瑟瑟杀人名单","summary":"井九出剑归来面不改色，向阿大道破此乃破海后的幽冥仙剑——以自己为剑，剑意飘渺如仙如鬼，配合精准计算一击狙杀德渊泉；他本就是朝天大陆最擅长做刺客的人。稍事调息，井九携阿大跳入井中潜水潜至孤岛，以承天剑法化解石壁，寻到囚室：断腿流血的陈宗主温婉如常，误把井九认成女婿何霑，瑟瑟慌忙掩饰。井九言明来意——当年答应帮她杀人的承诺如今兑现，索要那份名单。瑟瑟本因双方面已撕破脸想作罢，得知德渊泉已死，又惊又服，重新生出狠劲，笑言若非已有霑哥儿，一定要娶了井九。井九转身离去，陈宗主温声道别。"},{"n":514,"orig":514,"title":"一声叹息杀一人","people":["老太君","何不慕","何霑","井九"],"one_line":"井九连环诛悬铃宗要员，何霑笠帽替身脱局","summary":"德渊泉尸身曝光，老太君借头颅中残余剑意指认青山，何不慕木然推说当时正与大泽左雨使闲谈，随后竟接受软禁留下「看热闹」。此后数日黎明湖畔命案连连，死的尽是悬铃宗要员，死状皆是脸上一个洞，满山铃铛警报从未响起；支持陈宗主的势力趁势逆转大局。老太君循飞剑痕迹以命铃锁定小院，围院擒凶，各派围观。何不慕暗握剑诀准备拼命，笠帽摘下，露出的却是何霑的脸——他自称果成寺僧人问心无愧。原来前夜两名长老几乎同时被杀，井九只杀一人，另一人是学得诡异身法的何霑；而井九早算准老太君不敢杀何霑，以此金蝉脱壳。"},{"n":515,"orig":515,"title":"你到底是谁？我们呢？","people":["井九","何霑","老太君","陈宗主"],"one_line":"井九窃走大阵阵枢，何霑追问其真实身份","summary":"老太君率众围院之际，井九潜入摘星楼寻阵枢，发现竟是窗前一盆三夜昙的瓷盆，拔花夺盆而去，悬铃宗山门大阵随之瓦解，各派散去，陈氏一派控制局面。井九与何霑话别，何霑追问「你到底是谁」，道出修行界流传最广的猜测——景阳真人的私生子；井九否认，只提示「柳十岁与柳词都姓柳」。何霑自愿留下善后，井九独自离去，断言老太君景淑会放弃，因为「我知道她想要什么——在她很小的时候见过她」。深夜摘星楼里，败局已定的老太君被儿孙软禁楼中等死，陈宗主温和宣告不杀之恩，老太君再也维持不住平静，破口大骂狐媚子。"},{"n":516,"orig":516,"title":"花要落地，娘要嫁人","people":["井九","阿大","阴三","瑟瑟","何霑","玄阴老祖"],"one_line":"老太君认命放弃，井九诱师兄落空，阴三赴冷山","summary":"老太君从此在摘星楼中日日咒骂儿媳；瑟瑟与何霑定情道别，何霑赠她烤鱼秘方，此后留在悬铃宗助妻掌权。归途中井九向阿大解释老太君放弃的缘由：她已看清瑟瑟与何霑结为道侣才是德家最好的出路——和尚的私生子会随父姓，瑟瑟之子大概率姓德，宗门终不外流；井九在城镇医馆确认陈氏重掌大权，老太君形同活死。井九一路带着初子剑在朝歌城外原野守候，欲诱太平真人现身夺剑，守候多日师兄却始终未来，暗中随行的元骑鲸也扑了空。另一边，阴三与玄阴老祖扮作病客乘马车潜行，阴三明言不抢皇宫里的初子剑，因元骑鲸一板一眼很少犯错；阴凤前来会合，众人同赴冷山。"},{"n":517,"orig":517,"title":"羽化","people":["阴三","阴凤","玄阴老祖","火鲤"],"one_line":"阴凤取鳞献羽，阴三欲行传说中羽化之道","summary":"阴凤奉命钻入地缝擒住火鲤，先打后谈，讨要两片鱼鳞，两只神兽先厮杀后攀起「哥」来，最终阴凤生拔鳞片，又需自舍一根本命羽。至此阴三已集齐苍龙骨髓、飞鲸软骨、火鲤鳞片，还差千里风廊的荷——荷在禅宗象征复活轮回。玄阴老祖这才惊觉真人的图谋：羽化。羽化与飞升不同，自古无人见过，近乎传说；阴三自陈得了一本老书，近年自行补全残缺，欲以佛法修正道法，成与不成只能一搏。老祖一生畏他，此刻才真心拜服。阴凤提醒莫忘当年一人得道鸡犬升天的承诺，阴三答：你们不能出去，我就不离开。羽化所需的朱雀雀羽早已绝迹，阴凤说，用我的。"},{"n":518,"orig":518,"title":"皇宫秘事","people":["井九","神皇","顾清","景尧","阴三"],"one_line":"神皇托孤玉卵，井九赐剑太子，各方试探掌门","summary":"阴凤随车絮叨担忧小四与掌门之位。井九回朝歌城，先入井宅与兄长一家吃了顿饭作别，又摔碎名贵瓷器召来鹿国公安排夜入皇宫。他把初子剑赐给太子景尧，命顾清准备回山。深夜面见神皇，神皇自知借羽化续命无望，将养了多年的朱雀玉卵托付井九，实为托孤——求青山日后庇护胡贵妃。神皇提起镇魔狱年前出过事，井九前往查看，发现有人取走了苍龙的一点骨髓。井九滞留赵园引发各方试探：布秋霄遣奚一云来问掌门人选，井九答「不是伏望」；净觉寺住持来问，得到同样答案；风刀教使者所得则是「不是方景天」。世人愈发笃信他是景阳血脉，掌门归属悬而未决。"},{"n":519,"orig":519,"title":"润万物而无声","people":["井九","顾清","柳词","元骑鲸"],"one_line":"柳词离去剑鞘归山，青山恭迎新掌门","summary":"井九带顾清回青山。顾清推演掌门人选，井九一句「元骑鲸不愿意」断其念想，又否定广元真人，摸了摸自己的脸喃道「服众啊」，心意已定。翌年春，青山闭关众人陆续出关，井九携神末峰众人登天光峰，九峰大人物除隐峰的方景天外全部到齐。一道黑线自天边而来，承天剑鞘飞回插上石碑——元龟怀念，尸狗悲伤，一茅斋的柳十岁临窗南望，千里风廊的小荷面色苍白，阴凤与玄阴老祖护着一辆响着黄梅小调的马车正穿行风中，柳词是黄梅镇人。宇宙锋、锦瑟、皆空、回日、潮来、弗思、不二与数百道飞剑齐齐指向石碑，青山弟子拜倒齐呼：恭迎掌门，剑归青山！春雨落下，润万物而无声。"},{"n":520,"orig":520,"title":"风过青山来就来","people":["井九","元骑鲸","白如镜","赵腊月","柳词"],"one_line":"柳词身后举哀，井九当众坐上掌门之椅","summary":"春雨当日，中州派同步结束三年封山，麒麟长啸出山，白早南望思师兄，举世皆知柳词走了，大陆变局将至，焦点仍是青山掌门之位。天光峰顶举哀既毕，诸峰人物齐聚选掌门：元骑鲸沉默不语，昔来峰代表抢先推举广元真人，伏望推举方景天，成由天推举元骑鲸，场面渐乱；白如镜提请宣读掌门遗诏，元骑鲸却不肯去取剑鞘，气氛剑拔弩张。就在此时，一道白衣踏风而来，井九在满峰震动中走到石碑前，踩上元龟的壳取下承天剑鞘，转身坐上那把三百年无人坐过的掌门之椅，淡然道：我来吧。元骑鲸叹了口气，赵腊月早已料到，卓如岁睁圆了眼，风过青山。"},{"n":521,"orig":521,"title":"说井九，为什么是井九？","people":["井九","明国兴","简如云","白如镜","马华","元骑鲸"],"one_line":"柳词遗诏传位井九，简如云当众反对。","summary":"青山宗修行极难，多数弟子一生困守一境，南松亭授业仙师明国兴便是无彰境多年，他向年轻弟子吹嘘当年是自己接引井九入山。天光峰顶，井九坐上掌门之椅说了声我来吧，众人从错愕到愤怒，白如镜厉喝他疯了。井九拍承天剑鞘放出掌门剑意，凝出柳词遗诏，只有五个字：青山归井九。全场震动之际，因弟弟查碧湖峰左易案被冥界妖人所杀、记恨井九与柳十岁的简如云率先高呼反对，声称宁死也要阻止。随后马华等十余名弟子陆续落到他身后，峰顶陷入僵局。"},{"n":522,"orig":522,"title":"说反对，谁有资格反对","people":["井九","白如镜","赵腊月","马华","过南山","卓如岁"],"one_line":"白如镜等发起诸峰推选，过南山卓如岁倒戈反白。","summary":"白如镜、伏望等长老接连反对，指井九入青山不过三十年、境界太低难以服众，赵腊月以景阳隔世弟子同辈的身份回击。马华提出门规：可由诸峰推选掌门，得三分之二支持即可，元骑鲸同意投票。白如镜盘算八峰在手必胜，广元、伏望果然反对，眼看尘埃将定，井九却反问白如镜凭什么代表天光峰——顾清点明天光峰的人不愿被他代表，过南山与卓如岁先后出列反对白如镜。原来青山本有不奉遗诏的传统，井九与师兄当年正是杀了众多师伯师叔才夺回掌门之位，他早料到有人会搬出门规，一直在等这一刻。"},{"n":523,"orig":523,"title":"说不服，还真有谁不服","people":["井九","白如镜","阿大","南忘","墨池","元骑鲸"],"one_line":"天光峰倒戈支持遗诏，白猫阿大现身自表一票。","summary":"白如镜自恃天光峰资历最深、又是破海上境，墨池却站出来主张天光峰应执行遗诏，元骑鲸更揭穿他入门比墨池晚一天、当年靠劝骗改了名册。天光峰倒向遗诏，南忘称这是柳词最后的心愿当然要支持，成由天因认出白猫阿大也投了支持，唯昔来峰反对。白如镜放话，除非井九像太平真人与景阳真人那样杀得诸峰服气。广元真人转而推举元骑鲸，看似大局已定，白猫阿大却放出通天境威压表明不服——顾清提醒门规：推选掌门还须问过四位镇守。阿大跳上井九的膝盖打起呼噜，元龟也被问出态度，井九离八票只剩元骑鲸与尸狗两票。"},{"n":524,"orig":524,"title":"白衣少年应犹在，只是竹椅改","people":["井九","白如镜","元骑鲸","简如云","顾清","阿大"],"one_line":"众人拜见掌门，井九以宇宙锋废招重伤白如镜。","summary":"元骑鲸率先拜见掌门，各峰峰主长老与数百弟子随之行礼，剑峰数千飞剑齐齐腾空相贺，宛若万剑来朝。简如云绝望欲自杀，被元骑鲸拦下，判他挑动诸峰不奉遗诏入剑狱受罚。井九的继任感言只有一句：一切依旧例，就这样。众人散去时白如镜冷哼一声，井九以一声嗯回应不满；阿大依计放出威识，白如镜下意识唤剑，被顾清当场喝问竟敢对掌门亮剑。他两次试图收剑都被宇宙锋拦住——拦收剑比挡攻击难无数倍，众人骇然。井九抱猫起身瞬移至其身前，一掌震碎承天剑意屏障，把这位破海上境长老打得吐血撞上断崖。"},{"n":525,"orig":525,"title":"青山的未来","people":["井九","赵腊月","白如镜","过南山","元骑鲸","南忘"],"one_line":"井九早已破海，重判白如镜入狱，自陈倦意。","summary":"井九抱着猫重伤白如镜，众人这才知道他数日前已破海，入青山三十余年便至此境震古烁今，广元真人以为是先天无形剑体之功，实为掩饰。元骑鲸判白如镜入剑狱三年，这是井九为柳十岁当年旧事蓄谋已久的报复。井九把天光峰交给过南山打理，规定两忘峰行事须先经神末峰同意，自己仍住神末峰。夜里他对赵腊月坦言：当掌门只为把承天剑鞘握在手里，票数其实可能不够，若输了他便离开青山。赵腊月这才明白那场投票是他给自己找的离开理由，也是青山最后一次挽留他的机会，难过道：就算要走，也该是他们走。他从剑鞘里唤出青鸟青儿。"},{"n":526,"orig":526,"title":"春雨的过去","people":["井九","青儿","赵腊月","南忘","阿大"],"one_line":"青儿讲述柳词云游三年，南忘逼问阿大真相。","summary":"青儿从承天剑鞘里飞出，转述柳词三年的游历：从蓬莱神岛得宝船，经雾岛与大漩涡抵达海外西风大陆，见过精灵、巨人与十七个人类王国，沿途麻烦都被柳词杀了。这是柳词最后的故事，井九不停打岔，只为让青儿讲得慢些。井九提起青天鉴原是他与柳词从云梦山偷出、童颜许诺给他，青儿拒绝透露其所在，还抹掉井九留下的剑识，从此无人能找到青天鉴。另一边南忘扣着阿大逼问井九到底是谁，阿大只含糊暗示他身上有景阳的味道、柳词正因知晓其身份才传位。南忘望着神末峰，忽然自语：他是景阳和谁生的？"},{"n":527,"orig":527,"title":"不是当掌门的料","people":["井九","元骑鲸","阿大","顾清","南忘"],"one_line":"元骑鲸点破柳词以井九制衡自己，政务尽付顾清。","summary":"南忘把阿大扔回神末峰，阿大向井九抱怨：打白如镜前不打招呼，最后还靠它用威压震住对方心神才赢，事后又被南忘抱去盘问。元骑鲸连夜来访，质问井九是不是当掌门的料，并点破柳词的用意——放眼天下只有井九能让他主动退让，遗诏是为防他。井九只说柳词生前反复问他你来不，我便我来。元骑鲸断定他终究是为了承天剑，要求把继任大典办得盛大，因为云梦山开禁、青山不能低调，井九索性全推给他安排。此后诸峰长老带着三年积压的政务上山求见，井九全权交给顾清处理，自比赵国皇帝，把顾清比作秉笔太监。"},{"n":528,"orig":528,"title":"垂帘偶尔听政","people":["顾清","井九","元曲","平咏佳","过南山","迟宴"],"one_line":"顾清代掌政务，井九判定益州明王实为苏子叶。","summary":"顾清独自在小木屋处理诸峰二十余项政务，从七星玉兰的分配到各峰奖惩，元曲与平咏佳都不敢沾手，笑称这是太监干政得偷偷地做。井九就任掌门的消息传遍天下，各宗派纷纷遣使送礼，一茅斋的贺礼是柳十岁亲手做的一把新竹椅，井九试过评价：还可以，不如我做的那把。上德峰又送来玉牌，顾清发现简如云在剑狱仍寻死，当年反对井九的年轻弟子躁动欲做极端之事，井九指示再闹就逐出青山，别死在山里就行。过南山来报，益州有人自称明王召集玄阴教旧部，两忘峰想去查看，井九断言：不是王小明，是苏子叶。"},{"n":529,"orig":529,"title":"新人旧事两相忘","people":["井九","过南山","元骑鲸","童颜","雪姬","方景天"],"one_line":"井九禁两忘峰出山，访剑狱隐峰并收服童颜。","summary":"井九确认王小明已死、益州是苏子叶所为，随即下禁令：两忘峰弟子何时破海何时出山。他列举三十年来两忘峰死了十四位天才弟子，直言让有天赋的孩子去送死是白痴行为，两忘峰数百年斩妖除魔的战绩还不如柳词一夜杀得多，过南山与两忘峰弟子皆不服。井九先与元骑鲸谈过两忘峰是柳词的得意之作，又入剑狱探望雪姬并邀她换新竹椅被拒，再进隐峰：方景天被逼在洞府冲击通天境，成则出山败则成枯尸，井九堆沙推演后离去；童颜因与外界隔绝尚不知变故，被井九亮明掌门身份震住，领命写一份对付中州派的方略，摆出棋局应对。"},{"n":530,"orig":530,"title":"青山三百日，世事总无常","people":["顾清","过南山","井九","童颜","卓如岁","赵腊月"],"one_line":"童颜授计益州，赵腊月借顾家整治马简两家。","summary":"童颜以棋局解析：中州派不会正面翻脸，而是蚕食青山附属势力，苏子叶落子益州意在动摇西海，还送井九一个对付苏子叶的方略，条件是十年内别来烦他。众人评估后认为此计太繁——井九如今是掌门，对付玄阴宗余孽不必遮掩身份，难的是无人可派：两忘峰弟子未破海不能出山，破海长老出面又会引来中州派强硬反应。夏日井九在雷暴中回碧湖峰吸收天雷蕴养己身。转年初春，过南山屡次来催益州之事无果，又求顾清放过被顾家打压的简氏与马家，顾清点明这不是掌门的意思而是师姑赵腊月的主意——当年站出来反对井九的那一刻，他们便赌上了整个家族。"},{"n":531,"orig":531,"title":"火锅与剑，消散的云烟","people":["井九","顾清","卓如岁","赵腊月","元曲","平咏佳"],"one_line":"神末峰吃火锅，井九赴剑峰为弟子选剑。","summary":"井九出关当日宣布吃火锅，重演太平真人与柳词继任掌门时的旧例，神末峰众人围炉，吃得最多的竟是赵腊月。平咏佳与元曲趁机讨剑，井九亲赴云行峰剑崖，用七梅剑诀为元曲选中有三道弯、夹陨铁的飞剑，还需在剑峰蕴养；适合平咏佳无端剑法的剑找不到，只好再空手几年。夜里他独坐剑峰崖洞回想烟消云散阵：此阵本应助修行者斩断尘缘因果再飞升，自己破雷劫开天路却断不尽尘缘，才被白刃偷袭；他确认布阵无误，怀疑是师兄当年教的阵法源头就有问题。又想起白刃附在仙箓里的仙识表明她想回来，中州派手中还剩一主两副仙箓，必有图谋。"},{"n":532,"orig":532,"title":"铁树开花镜照人","people":["井九","雀娘","赵腊月","广元真人","元曲"],"one_line":"井九查明分镜术源自镜宗弃徒闫真路，秘访镜宗。","summary":"井九直入适越峰藏书禁地，取出记载自观法与分镜术的薄册，下令彻查此书来历，要查到最开始时。广元真人调动全峰之力，三日便查明作者是千年前的散修大家闫真路，而此人应是镜宗弃徒。梅会临近，南忘称要闭关不肯带队去朝歌城，改由广元真人带队，元曲竟拿下青山试剑第一，井九命他到朝歌城也不准输。井九与赵腊月戴着笠帽秘访镜宗，雀娘认出他又惊又喜，先禀报了闭关中的宗主，宗主下令全力配合且不许走漏消息。雀娘陪在院中，以师礼拜见井九求指点棋道，井九说：镜子把你照成什么模样，是镜子的问题，不是你的问题。"},{"n":533,"orig":533,"title":"小荷又露尖尖角","people":["井九","柳十岁","小荷","雀娘","元曲","广元真人"],"one_line":"分镜术被师兄动了手脚；小荷曾引太平入蛟池。","summary":"井九推演结论：闫真路的分镜术在第七级被人调换了顺序，烟消云散阵因此埋下隐患；薄册七百三十四年前进入青山，师兄七百三十三年前开始研究此阵，动手脚的正是师兄，若修不好此阵便只能另寻飞升之法。梅会上中州派借口青山已无追杀冥部之责，要求削减其修行资源份额，广元真人与越千门几乎动手，禅子一句话化解，双方约定秋天在果成寺再谈，白真人亲至，青山由元骑鲸出面。元曲道战只得第二，第一是代表一茅斋的柳十岁。柳十岁最开心的一年里，小荷哭着坦白：去年春雨那天太平真人来过千里风廊，是她用令牌把人引进了斋后蛟池；柳十岁没有怪她，用认主不久的管城笔写信告知井九。"},{"n":534,"orig":534,"title":"你走这边，我走那边","people":["井九","柳十岁","阴三","玄阴老祖","元骑鲸"],"one_line":"太平取荷疑谋转世，阴三北海备材谋羽化。","summary":"柳十岁的信送到青山，井九得知太平真人从一茅斋取走一朵荷，心中隐觉不妙——荷在禅宗意味着转世，而果成寺恰有一位转世之人，于是决定秋天亲赴果成寺。他备齐当年飞升用的道法材料，当年凑了四套只用一套，青山里还剩三套，尽数送进神末峰洞府闭门运作，元骑鲸猜测他是在提前摆阵飞升。与此同时，玄阴老祖与阴凤随宝船逃入北海，阴三在船舱深处备齐羽化祭炼之物：苍龙骨髓、火鲤鳞片、飞鲸软骨与一根凤羽，唯独缺少烈阳幡碎片，宝船晶石炉温度也不够，他打算让苏子叶帮忙送来。井九告知元骑鲸阵法有问题想改未成，又入剑狱与雪姬隔门对视。"},{"n":535,"orig":535,"title":"再灭你满门一遍","people":["井九","苏子叶","卓如岁","赵腊月","华阴","童颜"],"one_line":"井九亲赴益州斩华阴，卓赵先灭玄阴余孽。","summary":"井九在棋盘落子，决定亲自出山办事，向童颜问起白真人在果成寺之会的动向。益州地底暗河里，藏匿的玄阴宗余孽被剑光屠戮，最后关头他们点燃精血自爆，卓如岁受伤，赵腊月赶到收尾。苏子叶在老茶馆里服下含毒丹药压住痛苦，认出来者是卓如岁，又见游野上境的赵腊月压阵，取出能吸尽水分的四荒瓶，再召出隐姓埋名多年的玄阴宗长老华阴——此人魔功等同破海境，二对二似有胜算，谁知华阴刚现身就被一道剑光斩成两截。白衣井九落在茶馆里，苏子叶望着满地血水，失声唤出他的名字。"},{"n":536,"orig":536,"title":"到地狱也不放过你","people":["井九","苏子叶","卓如岁","童颜","赵腊月"],"one_line":"井九劝降苏子叶为内应，密送童颜入冥界。","summary":"华阴已死，玄阴宗余孽尽灭，苏子叶自知宗派历史就此终结。卓如岁点破童颜是他送进西海才引来春雨之祸，井九明确玄阴宗必须断根，但留下苏子叶一命：许诺助他重建宗派，连昆仑派的灵脉都可以给他，还能解他缠身的丹毒，条件只有一个——玄阴子若与他联络，立刻通知青山。苏子叶自述魔胎身世与求死之意后终被打动。此次清剿全赖童颜对苏子叶的了解布局。随后剑舟驶往东海通天井，井九以寒蝉的蚊子联络冥界，把藏在箱中偷偷带出隐峰的童颜交给前来接应的鬼差，童颜化作落叶随鬼差沉入井底，进了冥界。"},{"n":537,"orig":537,"title":"桃花沧海两心通","people":["井九","水月庵主","禅子","甄桃","过冬"],"one_line":"井九探过冬杀意显露，禅子识破身份惊观沧海。","summary":"井九独自造访水月庵，沉睡五年的过冬仍无醒转迹象，体内却隐约出现奇怪变化，庵主担心湖畔草木疯长、天地灵气正向她汇聚。庵主告知悬铃宗老太君已死，又与井九论生死因果。庵主以天人通看破他的杀意——他要杀景辛，井九称若过冬还醒着，景辛早就死了。庵主以假装没看见通天井那次交接作交换，转达这是陛下的请求，并承诺秋天果成寺之会水月庵支持青山。随后井九到了果成寺，与禅子互不行礼僵持良久，禅子终于点破：都说你是景阳的儿子，喊声叔叔来听听。他以莲云观沧海半时辰平复心神，回来只说：你挑的这脸倒是不错。"},{"n":538,"orig":538,"title":"回到各自的位置","people":["禅子","井九","卓如岁","顾清","赵腊月","阿大"],"one_line":"禅子彻查典籍确认井九身份，顾清静园将破境。","summary":"禅子回顾多年来对井九身份的怀疑，本以为是荒唐猜测，如今真相大白心神剧震，追问缘由，井九只说有些事没办完。两人谈起太平真人：他夺船藏于海上、身受重伤，取了龙髓与千里风廊的荷，禅子判断他想转世，并说明莲转世并非前世的延续，自己才是唯一真正的转世重生者，因果犹存而过往皆无，又应允取来东易道典籍供井九参详。禅子问烟消云散阵为何出事，井九以铜镜与清心铃演示分镜术，两人以神识翻阅近千本佛宗典籍比拼速度。静园外，赵腊月与阿大各守旧位，卓如岁带顾清拜过前代神皇灵骨塔，在禅子外溢的神念清风里睡了一觉，醒来发现顾清剑意离体，即将破入游野中境。"},{"n":539,"orig":539,"title":"吾辈中人","people":["赵腊月","卓如岁","柳十岁","小荷","陈文","顾清"],"one_line":"赵卓寻破境契机，柳十岁为护小荷迎战陈文。","summary":"顾清剑意离体、剑鬼即将成形，卓如岁自认他的蜕变始于拜入井九门下，顿感压力决意勤修。秋意初起，赵腊月与卓如岁双双卡在游野上境门槛，结伴外出寻找破境契机。两人重访果成寺旧地：太平真人住过的白山禅室、玄阴子烧过菜的厨房、柳十岁当年闻剑鸣的菜园，谈起各自上一次破境都因杀人，卓如岁感叹果然是吾辈中人。二人正打算去深山烤熊掌，弗思剑忽然颤动，绝壁下的溪畔，昆仑派长老陈文率众堵住小荷，斥她是不老林狐妖，讥讽青山选小孩子当掌门是天大的笑话。柳十岁把小荷拦在身后，平静说了一个字：来。"},{"n":540,"orig":540,"title":"青山从来不二","people":["柳十岁","陈文","会元大师","白千军","卓如岁","小荷"],"one_line":"柳十岁以管城笔不二剑重创陈文，会元突下杀手。","summary":"破海境的昆仑派长老陈文面对柳十岁本有绝对优势，柳十岁一记血魔拳率先轰出被遁法避开，随即取出镇斋之宝管城笔，在天地间写出一道彩虹，将陈文轰上绝壁重创。真元耗尽的柳十岁以不二剑迎战，连斩对方飞剑，陈文惊怒现出火鹤近身强攻，关键时刻通化寺会元大师以念珠隔开二人，号称德行高洁的他却在调停中骤然发难，百余枚念珠同时爆开，把陈文炸得尸骨无存，随即消失无踪。昆仑派弟子惊怒围向柳十岁，小荷布下屏障护他，柳十岁点破应是不老林阴谋。中州派白千军自云船跃下以风洞袭杀，绝壁里飘出一道灰色飞剑，在他身上割出十余道裂口——卓如岁现身道：不偷袭你也打不过我。"},{"n":541,"orig":541,"title":"吞舟","people":["卓如岁","赵腊月","柳十岁","越千门","小荷","顾清"],"one_line":"越千门索人被拒，众人察觉太平取荷有阴谋。","summary":"卓如岁亮出柳词亲赐的天光峰第一飞剑吞舟，白千军再败于其手。炼虚境的中州派长老越千门赶到，要带走柳十岁问话，赵腊月以阿大在怀强硬拒绝，果成寺钟声与归去讯号响起，越千门只好带昆仑弟子离开。众人分析：杀陈文的会元大师应是不老林的人，一直跟着柳十岁与小荷寻找下手机会——他真正想杀的不是人，而是在等取荷之人。所有线索都指向太平真人：他摘走一茅斋的荷，恐怕是要借果成寺之会挑动青山与中州、昆仑等北方宗派开战。卓如岁撂下一句那就打，云船被落日吞没，梅会数日后必再生事端。"},{"n":542,"orig":542,"title":"叶子","people":["井九","白早","童颜","冥师","柳十岁","阿大"],"one_line":"白早话别井九；童颜入冥界会见冥师与阿飘。","summary":"井九判断太平真人搅乱修行界是为了自保，他如今最虚弱，乱世反而安全。柳十岁磕头道贺后回一茅斋，小荷留在静园。中州派白早在落叶里来见井九，二人有一段旧情，她将接任中州掌门，注定与青山掌门无缘，只得摘下一片金叶相赠黯然离去；井九提醒她关键时刻自己小心，并否认童颜在青山。同时童颜已在冥界，见到冥师带回的皇族血脉、下一任冥皇阿飘，一个数日便精通人族文字的孩子。冥界通道里十二祭司正飞速上行，童颜断言他会死，冥师道谢——这是井九设下的杀局，诱冥界强者上来送死。"},{"n":543,"orig":543,"title":"青山来人","people":["童颜","冥师","井九","赵腊月","顾清","卓如岁"],"one_line":"童颜设局诱冥部祭司上界，果成寺梅会开场。","summary":"冥师道破冥界强者上界如人族飞升般艰难，柳词一剑令地脉变动，古通道重现。童颜的方案是以冥皇之玺相关情报为饵，诱使冥界祭司在指定时间地点现身大陆，冥师负责选人做局，上界之后的事由井九处理。梅会开场，各宗派齐聚果成寺，通化寺住持求见白真人被拒，众修议论纷纷，认为青山无冥妖可杀不该再占大头，理应让步。中州派声势浩大，白真人携越千门等三位炼虚谷主亲至，而青山只来了寥寥数人：赵腊月抱着白猫，顾清抱着裹布的飞剑，卓如岁抱着自己，井九走在最后。"},{"n":544,"orig":544,"title":"大人物","people":["井九","何渭","布秋霄","白真人","禅子","赵腊月"],"one_line":"何渭问罪柳十岁，白真人一句话压下全场。","summary":"梅会正式开始，青山四人入殿与中州派分庭对峙，禅子居上首，朝廷由和国公与已同中州派决裂、饱受攻讦的张遗爱列席。昆仑掌门何渭首先发难，要井九给师弟陈文惨死一个解释；井九不答，一茅斋斋主布秋霄起身指出下手者是通化寺会元大师。何渭转而指柳十岁与不老林狐妖勾结设伏杀陈文，提出由云梦山查案，实为逼一茅斋与青山决裂、请白真人主持公道。局势一触即发之际，白真人只淡淡说了句这件事情就到这里，何渭如瞬间老了十岁，颓然坐回不再开口，全场愕然：这位最强者竟不愿为盟友出头。"},{"n":545,"orig":545,"title":"弱者不得已而为之？","people":["童颜","阿飘","白早","井九","冥师","赵腊月"],"one_line":"白早逼青山让步，井九以十二祭司真身被杀回击。","summary":"童颜与未来的冥皇阿飘论因果，问其将要带领冥界走向何处，阿飘称阳光雨露与冥族功法血脉不合、不必外出，只盼人族慷慨些，又狡黠点破童颜的中州派身份；童颜透露他将成为井九的学生。果成寺殿上，白早正式重申中州派要求：太平真人造的孽青山理应承担更多，削减份额势在必行，朝廷不插手。井九开口只提一个条件：西海那一份是我们的，别的不变。话音未落，青山剑书与清天司飞书先后而至——冥界十二祭司以真身出现在冷山，随即被青山道友杀了。众修哗然：冥界大人物真身上界，多年未有的大事，竟是个死局。"},{"n":546,"orig":546,"title":"冷山上空的鹰","people":["广元真人","十二祭司","风刀教主","顾清","白早","井九"],"one_line":"十二祭司真身现世即被广元真人斩杀。","summary":"殿上白早追问青山为何出现在冷山，顾清答因为这是我们应该做的事——中州派不是说无冥妖可杀吗，现在有了。井九承认这只是开始，随即离场，大会无疾而终。冷山原野上，冥界十二祭司至死不明就里：他奉中州派传出的路线，先寻火鲤取烈阳幡残片，再经苏子叶找到太平真人夺取冥皇之玺，谁料刚出冥界就撞上埋伏。出手者是青衣道人广元真人，他以回日剑硬拼重伤，将这位冥界新生代最大威胁斩于荒野。风刀教主赶到时才发现青山布置之深：南忘在远处山头喝酒，更远处一道孤立风雪里，剑律元骑鲸亲自坐镇。"},{"n":547,"orig":547,"title":"青山起微澜","people":["井九","禅子","广元真人","风刀教主","白真人","元骑鲸"],"one_line":"冥部祭司接连送死，中州派让步，井九兴师问罪。","summary":"风刀教主欲助阵，广元真人只说掌门喊我们来我们就来了，焚尸后按纸条奔赴下一个地点。禅子点破井九走了太平勾结冥界的旧路，井九反指中州派借冥皇名义从下界压榨资源，双方皆无实据，他请禅子盯着白家勿令其与下界联络。此后冥界祭司接连上界送死：七祭司与两名魂火术士死于居叶城外，第七日一位祭司重伤成由天后，被元骑鲸率五位峰主与八名破海长老绞成粉末。中州派被迫收回削减份额的提议，西海份额正式划归青山，井九分了一半给诸派。临别他向中州派放话：聚魂谷通道放出的冥妖青山可以杀，但不要有下次。白真人问：是要兴师问罪吗？井九：嗯。"},{"n":548,"orig":548,"title":"真如一人","people":["井九","白真人","禅子","布秋霄","冥师","童颜"],"one_line":"白真人道受教离去；井九决意再诱杀太平。","summary":"面对问罪，白真人只答两个字受教，便率中州派离开，众人惊觉这场较量根本不在果成寺而在冷山与冥界。布秋霄私下警告井九：若青山在冥界的帮手是太平余孽，朝歌城那场谈话便作罢，井九答只是提前派了名青山弟子下去。冥界里祭司们识破阴谋围攻冥都要童颜的命，冥师全力维护，并请童颜确认井九的真实身份——若他真是那个人，冥师会因恐惧终止合作。通天井畔，禅子点破井九与冥师这对师兄弟的传承，井九直言皇兄被太平所害所以必杀之，又说不原谅柳词，因为师兄们都活着。他决定再试一次：趁太平取荷羽化、最虚弱的当口，诱他出来杀掉。"},{"n":549,"orig":549,"title":"各种光，各种水面","people":["白真人","白早","井九","禅子","赵腊月","陈雪梢"],"one_line":"白真人拜墓定计不落子，静观井九师兄弟相残。","summary":"禅子警告井九中州派皆白家天下，白真人多半已猜到他的身份；井九浑不在意，自言惯于等对方布局再破局。白真人离开果成寺后直奔悬铃宗陵园，在老太君墓前道破天机：井九就是她怕了一辈子的叔公，冥界之事只是试探，她决意不落子——那对彼此最忌惮的师兄弟迟早自相残杀，还放话要斩断景淑双臂祭坟，这些话都是特意说给随行的白早听的，要她斩断情丝。另一边井九在通天井久候童颜不至，得知蓬莱神岛因宝船两度被抢而封岛震怒。他带赵腊月等人赶往大泽小镇欲杀萧皇帝，对方却已遁走，一行转往医馆调阅卷帘人卷宗，追查会元大师下落。"},{"n":550,"orig":550,"title":"我们一起修行吧","people":["井九","卓如岁","赵腊月","顾清","周云暮","阿大"],"one_line":"井九携三弟子借身引灵气荒山共修。","summary":"萧皇帝遁走，井九言要杀的并非此人，医馆卷帘人也查不到会元大师行踪。井九不愿回青山听元骑鲸盘问冥师之事，宣布带三人去修行，落脚在豫郡与北华州交界一处灵气稀薄的荒山。他一入定，天地灵气便如风般从四面八方涌向他，崖间灵气浓度暴增，赵腊月与顾清沾光修行，玄天宗长老周云暮远远察觉仙剑气息，又惊见雨水中竟含灵气，忙唤全宗弟子淋雨。大雪封崖，四人如雪人般连坐数月，剑书传来消息，卓如岁苏醒问出那句：以前你们也是这样修行的？"},{"n":551,"orig":551,"title":"八面来风，雷也来","people":["井九","卓如岁","赵腊月","会元大师","顾清","阿大"],"one_line":"井九入雷域收天雷，益州平谷寺寻到会元。","summary":"崖间灵气如风汇聚，卓如岁与赵腊月相继站到游野上境门槛。井九读罢剑书只身冲入虚境、破开屏障进入雷域收取天雷，归来时身体滚烫如烙铁、耳垂焦糊，犹自说很好。三人随他驾剑南返，玄天宗上下跪送剑光，周云暮就此闭关冲境。井九循线找到益州富商贾胜的家庙平谷寺，去年秋袭杀昆仑长老陈文的会元大师果然藏身其间充任住持。井九劝他供出太平下落可免死，会元冷笑青山掌门天下无敌说的是柳词不是你，井九抬手对准老僧，一股死亡的阴影与雷鸣之意笼罩平谷寺。"},{"n":552,"orig":552,"title":"平谷寺毁灭以及鹅","people":["井九","会元大师","苏子叶","赵腊月","卓如岁","阿大"],"one_line":"井九天雷轰杀会元，顺烈阳幡碎片追至冰海。","summary":"会元大师祭出漫天念珠，井九以收取的天雷轰落，平谷寺三殿尽毁，老僧双目流血、佛言被无形剑意截断，留下三句遗言：你永远不会找到真人；雷霆之怒亦不可久；你的归来是因为这个世界需要你，最终你会认识这一点获得平静，随后化作飞灰。知州府书房里，身为不老林暗桩的益州知州被卓如岁以承天剑阵锁住全身仍设法自尽，他本要在次日送出第二块烈阳幡碎片。苏子叶交出的碎片证实了线索：井九遍查书房细节后断定，取走第一块碎片、备齐龙髓与荷的太平真人，正乘宝船藏身极北的冰风暴海。"},{"n":553,"orig":553,"title":"因果是一条通往雪海深处的直线","people":["井九","卓如岁","赵腊月","顾清","阿大"],"one_line":"三人冰海破境，井九携阿大独行追杀太平。","summary":"冰风暴海罡风刺骨，井九引动天地灵气稳住体内天雷，卓如岁与赵腊月双双确认破入游野上境，顾清自言所图甚大刻意留境。井九让三人回青山，独自带着阿大循宝船晶炉留下的热痕北上。卓如岁复盘时越想越不安：掌门师叔专挑他们三个年轻人同行，急提升境界像在交代后事，却为何不带剑律师伯？阿大与井九的计划是它只需拖住玄阴子七息——井九要杀的是太平真人，更要赶在其羽化之前问出那个问题。所有细节表明阴三在走一条无人走过的路：羽化，世间没有朱雀，便只能从阴凤着手，而此刻正是阴三与阴凤最虚弱的时刻。"},{"n":554,"orig":554,"title":"人生若只如初见","people":["井九","阴三","玄阴老祖","阿大","阴凤"],"one_line":"井九冰海临近宝船，雪国女王神识忽然降临。","summary":"宝船在极北冰原上拖行，阴三身体已随时间腐朽、行将就木，玄阴老祖莫名不安，阴三却笃定井九会独自前来——羽化若成他无从追问，若死更无处问，因为井九有个问题只有他能答。井九在数百里外停剑，点破会元杀陈文的局太浅，线索是阴三故意留的，师兄一直在等他；静心之际他发现多年前朝歌城旧梅园庵神识之战里天近人留下的阴影，正是这抹阴影让他多年来执着于寻找太平，他随手抹去，道心重归清宁。宝船上阴三交待后事，玄阴老祖坦言做老狗不如看他做事有趣。井九现身，师兄弟视线相接如初见，阴三却引动雪国女王的神识隔空降临，冰海震裂，阿大调侃：要不要先联手和她打一场？"},{"n":555,"orig":555,"title":"羽化谁忍看，冰山谁来搬？","people":["阴三","井九","赵腊月","玄阴老祖","阴凤","阿大"],"one_line":"阴三当着雪国女王神识启羽化，井九怅然而返。","summary":"雪国女王的神识只带着好奇降临，井九因神识里带着雪姬的气息怕被认出，以幽冥仙剑极速遁走。阴三索性当着女王的神识开始羽化：虚空之鼎里投入苍龙骨髓、火鲤鳞片、飞鲸软骨与凤羽，烈阳幡碎片缓缓化为灰烬，他吹奏骨笛，借无根之荷的清新之气涤净腐朽，代价是皮肉成片脱落、受凌迟般的痛楚，他始终不肯用一滴真露。玄阴老祖问他是不是也倦了，历数守峰、入冥、血洗青山、剑狱三百载、裂身之苦，阴三闭目不语，老祖躬身祝他得解一切苦厄。井九远看一眼便回了浮冰，对赵腊月说自己很难过，分不清是累还是难过；她以当年四海宴乘兴而来兴尽而返的旧事宽慰，阿大落汤归来默默趴进他怀里。"},{"n":556,"orig":556,"title":"该孤寂的，在哪里都孤寂","people":["井九","赵腊月","阿大","成由天","南趋"],"one_line":"井九剖白孤寂，远赴西海寻三千年前谪仙痕迹。","summary":"井九向赵腊月坦白难过的根源是孤寂——修道者终将失去与世界的所有联系，大道无情，但他旋即放下，开始推演：师兄在他飞升前便动了烟消云散阵，白刃也莫名偷袭，他真正要问的是你为何要这么做，如今太平羽化在即，答案只能自己找。他想到唯一飞升成功又自愿归来的人——传说坠仙岛上的前代剑仙。井九赴西海，在坠仙岛一无所获，转赴被剑神斩断的少明岛，从藏书楼一本剑仙录里发现南趋笔迹：亦仙亦疯吾亦是。他下令征来海州全城旧书，数万卷同阅，终于在三千年前的县志里找到那位中年疯子：日日海边奔跑、醉呼外面着火千万不要出去、称天空是个铁盖子，泄题之后一步踏入长街尽头的天空，当夜废尽一城宗派修为。"},{"n":557,"orig":557,"title":"像我这样的人","people":["井九","赵腊月","顾清","南忘","元曲","阿大"],"one_line":"井九得谪仙之答即闭关，大典定于四年后。","summary":"那位中年疯子确是谪仙：飞升后自愿归来。井九首次讲述外面的世界——一切变化极快，他远望过数万把飞剑在星辰间燃烧，那不是朝天大陆的飞升者，未知世界里任何人都可能是敌人，但探寻未知是生命唯一的意义，必须去做。火锅白汤沸起的一刻，他感知阴三羽化成否已定，朱鸟玉卵生出感应；他确认师兄在叛乱之前从未想过杀他，那个问题的答案已经有了。回到神末峰，他命顾家四年后在云集镇修宅、把宇宙锋正式赠给顾清、宣布大典四年后举行，随即闭关谢客。赵腊月问他求道为何这么苦，他答受世界供奉却无回赠，为何不能受苦。初春南忘出走归来，自称去了趟水月庵、像她这样的人不会输，话音未落呕出一口血。"},{"n":558,"orig":558,"title":"寻剑","people":["南忘","平咏佳","元曲","南筝","顾清"],"one_line":"南忘遣南筝入水月庵，平咏佳剑峰守剑得剑体。","summary":"南忘与水月庵主打成平手却因连三月不在而心有不甘，她的境界已至破海巅峰。她唤出囚禁多年的南筝——南蛮逃亡者、不老林刺客、南趋肉身的侍奉者——命其剃发易装混入水月庵，查清连三月是否已死、过冬究竟怎么回事，事成放人。另一边，神末峰人人闭关，平咏佳不愿再等师父赐剑，独自上云行峰寻剑。沿途十余把飞剑主动示好他皆婉拒，最终在云纹岩里看到师父为元曲养的那把曲折带霜的剑，索性坐下替师兄守剑。四年云行峰剑意淬体，元曲取剑时惊见平咏佳竟已剑体大成，与赵腊月的后天剑体殊途同归，只可惜他赶不上几天后的掌门大典。"},{"n":559,"orig":559,"title":"太平时节，不落闲棋","people":["童颜","阿飘","冥师","尸狗","元骑鲸"],"one_line":"十年之约到期，童颜携冥皇阿飘返回青山。","summary":"距冷山地底与冥师定下的十年之约到期，童颜自冥界归来，借水月庵青帘小轿直入青山，再经上德峰寒井下到剑狱，把箱中的阿飘带进隐峰自己的洞府。阿飘说石桌上那盘青山对中州派的棋还没下完，而这次落子的不是他——幕后是太平真人。话音未落阿飘闪电般一掌拍在童颜胸口，童颜双耳溢血，指其不该在外面时抢先出手，阿飘坦言害怕那顶古怪的青帘小轿。阿飘以竹笛无声开石门离去，自认师承太平真人；重伤的童颜明知隐峰难出却无法示警。此时洞府外宝石转红，方景天的死关已近九年。"},{"n":560,"orig":560,"title":"剑鸣花开 小曲通天","people":["阿飘","方景天","尸狗","井九","水月庵主","白真人"],"one_line":"大典剑鸣中方景天得太平之助破入通天。","summary":"阿飘把竹笛插进方景天闭死关的洞府外，笛生枝丫、开出七朵梅，暗助其破关。掌门即位大典当日，各宗派顶级人物齐聚天光峰，白真人、禅子、布秋霄、水月庵主等悉数到场，水月庵主隐觉有异却被一声剑鸣打断——井九踏剑鸣走向那把椅子。剑狱深处，尸狗见七梅花开便知方景天出关：这位被元骑鲸罚入隐峰的昔来峰主只用了九年便踏入通天境，且天地无感应，显然有人以大阵隔绝了异象，尸狗知道内情却不动声色。峰中一名被困六百年的破海巅峰老怪怨毒咒骂太平助阵不公，随即气死，尸狗从他尸身里取出一道飞剑。方景天踏野花入剑狱，取笛走向一间囚室：师叔祖，走吧。"},{"n":561,"orig":561,"title":"我是景阳","people":["井九","方景天","元骑鲸","泰炉","顾清","南忘"],"one_line":"方景天通天归来质疑井九来历，井九自认景阳","summary":"青山掌门大典上，方景天破境通天，自隐峰乘轮椅现身，雨丝穿阵而落正是破境异象。他携剑狱中的枯瘦老者，当众质疑柳词遗诏「青山归井九」，追问井九来历：朝歌城井家二子从未有人见过，上德峰查证有假；元骑鲸默认井家孩子出生便被抱走，方景天称他早已猜到井九身份，逼问「你到底是谁」。井九摸着白猫，说出当年在池塘边随意取名之事，然后向全场宣告「我是景阳」。雨停，天空落下一声惊雷，众人如遭雷击。"},{"n":562,"orig":562,"title":"一声惊雷，再来一声","people":["井九","方景天","元骑鲸","赵腊月","南忘","白早"],"one_line":"众人惊觉井九就是景阳，方景天却称他是剑妖","summary":"雷鸣中全场震惊，众人回想棋盘山棋局、雪原殷血乱梅图、青天鉴中破天一剑，终于接受井九就是景阳真人。元骑鲸坦言上德峰早知真相、为他作证，井便是景、上九为阳。布秋霄与朝中重臣纷纷行礼，白早垂泪强忍，赵腊月早已猜到真相，只觉得他许是倦了才坦然相认。方景天却发出更惊人的指认：景阳飞升时被万物一剑偷袭，此天生异宝夺其神魂、继承记忆，转生为白衣少年骗取掌门之位——他不是景阳，而是一把剑。"},{"n":563,"orig":563,"title":"剑妖现世？","people":["井九","方景天","元骑鲸","南忘","顾清","雷一惊"],"one_line":"方景天列举证据指井九为剑妖，井九认剑不认妖","summary":"方景天断言井九是万物一剑成妖，青山弟子才知剑典首页「万物一剑」竟是剑名。他列举细节：无人见过井九驭剑，因其怜惜同类不愿踩踏；完美脸庞上突兀的招风耳正是万物一的剑锷；当年镇魔狱中放走冥皇、害死苍龙的灰影不用剑便来去自如；西海斩杀南趋的剑光也疑似出自他手。众人渐渐动摇，元骑鲸斥其只是猜想，成由天以「先天无形剑体」辩解也被嘲弄驳回。最后井九坦然承认：现在的身体确实就是万物一剑，「但我还是景阳」。"},{"n":564,"orig":564,"title":"一剑，好久不见","people":["井九","方景天","泰炉","元骑鲸","赵腊月","顾清"],"one_line":"元骑鲸解释借剑转生，方景天请出证人泰炉师叔祖","summary":"元骑鲸解释：景阳当年飞升被无耻之辈偷袭重伤，以雷魂木将神魂附于万物一剑回归，故有诸般异象。方景天指出关键无法判断：究竟是景阳夺剑身，还是剑妖夺神魂。他请出唯一见过万物一的证人——比太平真人还高一辈、被囚剑狱六百多年的莫成峰泰炉师叔祖。泰炉对井九说「万物一，好久不见」，神识传意：不论你是谁，今日都是死路一条，莫成峰血洗之债要还。元骑鲸斥方景天私放泰炉视同叛门。赵腊月与顾清各自暗谋：泰炉必须死，死便无对证。"},{"n":565,"orig":565,"title":"一拳，一个通天","people":["井九","泰炉","赵腊月","顾清","元骑鲸","布秋霄"],"one_line":"泰炉剑意慑退赵腊月顾清，井九一拳将其轰杀","summary":"赵腊月与顾清默契同时出手：顾清当众破境引人注目，赵腊月欲以九死剑诀第七式趁乱杀泰炉。泰炉以意剑布下重重屏障，剑意震散二人气机，顾清破境被打断喷血重伤。泰炉自承当年是通天上境，太平真人才留他性命囚于剑狱。井九起身走向轮椅，也不拔剑，右拳裹着黑金光芒直接轰穿层层剑意，一拳将这位通天大物轰成飞灰。众人骇然：破海境如何能杀通天？他右手握的究竟是什么？有人想起当年他一拳废掉白千军，手里握着长生仙箓。"},{"n":566,"orig":566,"title":"蓝衣童子一封信","people":["井九","方景天","元曲","阿飘","赵腊月","过南山"],"one_line":"井九早定杀泰炉之计；冥界蓝衣童子自称是封信","summary":"井九四年前便算定泰炉苟延残喘必生大乱，且剑狱中还有雪姬，遂借方景天之手将其带出剑狱再顺手杀死。他一掌为顾清疗伤助其继续破境，赐赵腊月丹药。元曲引门规七条，证明掌门可私藏冥皇之玺、可诛擅离剑狱者，堵住物议；方景天讥他持玺杀青山长老太过嚣张。此时一名脚不沾地的蓝衣童子飘上山道，称井九应被证明也可被证明；众人察觉其无心跳、气息阴冷，竟是冥界皇族。童子自称不是来送信，「我就是那封信」——家师太平真人写给井九的信。"},{"n":567,"orig":567,"title":"信的内容是一招剑法","people":["阿飘","井九","方景天","禅子","白真人","元骑鲸"],"one_line":"太平真人借阿飘传信：用归一式验证井九是否万物一","summary":"蓝衣童子名阿飘，原是冥师为井九选定的未来冥皇，与童颜对弈多年，如今被太平真人收为弟子，代价是可以留在人间修行。他代师传信：泰炉只见过剑妖外形，无法证明井九是谁，真正的物证是井九自己。太平真人传他承天剑法归一式——此式只传历代掌门，是控制万物一的剑法；承天剑只是剑鞘，万物一才是青山首剑，无此剑便没有青山宗。若井九敢拿出承天剑让阿飘试演归一式，便可自证清白；不肯拿出来，便等于认了剑妖身份。"},{"n":568,"orig":568,"title":"我是我之因果的所有指向","people":["井九","阿飘","元骑鲸","赵腊月","禅子","陈雪梢"],"one_line":"井九不交剑受质疑，答「我是我之所有因果的指向」","summary":"阿飘提出可将归一式转授元骑鲸代试，堵死井九退路。元骑鲸感慨没有万物一便没有青山宗，阿飘却断言井九是生出贪欲、夺景阳神魂并吃掉他的剑妖，还质问冷山冥界祭司之死、与冥师的交易。井九始终不取承天剑，众修者由疑转憎。阿飘最后诛心一问：也许你自己都忘了，你其实就是万物一。众人由惧生悯，赵腊月陷入「我是谁」的沉思。井九答：「我是我之所有因果的指向」，禅子叹「果然吾师」。"},{"n":569,"orig":569,"title":"因果就是不看你一眼","people":["井九","白如镜","赵腊月","阿大","过南山","雷一惊"],"one_line":"白如镜发难攻井九，阿大吞其飞剑，赵腊月断其双臂","summary":"井九以「因果」阐释身份：景阳不是名字与记忆，而是众人因果指向的那个点，无人听懂却令群峰沉浸玄妙氛围。被释出剑狱的白如镜怒喝井九是剑妖，数十道飞剑直指井九；出人意料，两忘峰雷一惊、幺松杉等年轻弟子的飞剑也升起护住掌门，百余飞剑对峙。元骑鲸叹青山何曾这般难堪，井九决意离开，向石龟道别。白如镜追袭一剑，被白猫阿大张口吞掉，剑丸受创；赵腊月趁隙一剑斩断他双臂，平静走回井九身后。"},{"n":570,"orig":570,"title":"我要走，还要都带走","people":["井九","方景天","禅子","元骑鲸","赵腊月","和国公"],"one_line":"井九拒交掌门信物欲走，禅子出手护持，各方表态","summary":"井九拒绝交出承天剑与冥皇之玺，因为他不交出青山掌门。方景天以久蕴峰体的剑意遮蔽天地拦截，井九抱猫走向崖边。禅子以佛门光镜挡下如岁剑与百余飞剑，宣告「我却是信的」，并称与景阳有关之事皆是天下事，谁都管得。元骑鲸以剑律身份请井九出山休养、不要走远。各宗派先后表态：大泽、镜宗中立，悬铃宗信重井九，和国公称陛下旨意认的便是井九掌门。中州派云台上，白真人静观不语，乐见青山裂痕加深。"},{"n":571,"orig":571,"title":"大道之行也","people":["井九","禅子","方景天","赵腊月","阿飘","柳十岁"],"one_line":"井九携神末峰众人离山，禅子论天下为公，阿飘被冻","summary":"白真人无意今日出手，青山飞剑自收。墨池请留承天剑，顾清以「休养非退位」挡回。赵腊月宣告景阳真人在处便是青山，「你们才是叛徒」。井九一行坐剑离山，顾清挥手作别。禅子道破太平真人屡败之因：太平有的是徒弟与下属，景阳有的是赞同理念的同道者，大道之行天下为公；这样的大人物什么都不做，才是对天下的公平。阿飘被元骑鲸冻成冰块扔进上德峰井底，布秋霄本欲带走未果，柳十岁获准随行。卓如岁对过南山直言「习惯了」，决意跟随。"},{"n":572,"orig":572,"title":"青山分庭意难忘","people":["顾清","卓如岁","井九","南忘","元骑鲸","白真人"],"one_line":"卓如岁顾清随行，青山人心浮动；井九落脚云集镇","summary":"顾清本欲留守神末峰扮孤臣，被卓如岁劝走；数十名年轻弟子请离被元骑鲸压下。白真人临别放话，井九离山后中州派将设法杀他；水月庵主则让甄桃日后去探望被冻进上德峰井底的阿飘。元骑鲸与镇守尸狗谈论，认为井九即便真是万物一也当是第二个师叔，只叹他又在犯懒躲清静。三剑五人会合吃火锅，赵腊月定计不投别派，就近住进云集镇外四年前顾家修好的宅院，众人才知井九早备好退路。刚抵院门，清容峰主南忘携煞气拦在门前。"},{"n":573,"orig":573,"title":"山川河流，宇宙万物，还有你们","people":["南忘","井九","赵腊月","卓如岁","顾清","柳十岁"],"one_line":"南忘怒掴井九倾诉旧情，神末峰众人跪认师承","summary":"南忘挥手震塌半座木楼，狠狠掴了井九一记耳光，质问他当年为何不许她嫁给柳词。井九道她只是赌气，南忘痛哭柳词已死自己孤身一人。井九认真答道山川河流宇宙万物都喜欢，当然也有她。南忘掷去一唾，直言再不喜欢这张脸，转身离去——她故意闹出雷鸣地震，让天下人知道井九落脚处。院外赵腊月等三人跪拜行礼，正式认下景阳师承；谈及门内排序，井九吩咐照旧。柳十岁衣袖带血赶到，出山时与昆仑派长老打了一架。"},{"n":574,"orig":574,"title":"离开青山的第一天","people":["井九","赵腊月","白早","柳十岁","卓如岁","顾清"],"one_line":"白早表明心迹，各派弟子来探，云集镇人满为患","summary":"井九许诺替柳十岁把受的委屈打回来，门内仍按旧序。众人溪畔闲谈，仍疑他是否万物一而不自知，赵腊月简述景阳飞升被白刃偷袭的始末，众人体会到青山与中州派终有一战。白早在海棠树下直言：他若是剑妖被逐出青山，自己反而欢喜，又羡又佩赵腊月能同行。井九心情不佳，自承倦意始自西海柳词的选择与元骑鲸始终不交青山大阵。瑟瑟、雀娘、甄桃等各派晚辈联袂来探，此后云集镇外修行者越聚越多，跪雾求见者不绝。"},{"n":575,"orig":575,"title":"酒楼上","people":["卢今","周云暮","程如清","赵腊月","元曲"],"one_line":"狂生辱景园被诛；玄天宗师徒进园，书生求药无果","summary":"天擎宗狂生在云集镇酒楼作恶，被一道血色雷光诛灭，实为赵腊月的弗思剑出鞘，镇上修行者自此安分。酒楼中众修争论井九到底是景阳转世还是剑妖，多愿相信前者。玄天宗宗主卢今随师周云暮求见，盼借机突破元婴之上。景园开门只召二人；中年书生跪求卢今代呈妻子的医案——妻子是凡人，因双修出了问题病重。卢今带医案入景园求告，出来却道真人也无办法。书生黯然收起医案，向雾中一礼，独自离山。"},{"n":576,"orig":576,"title":"黯然销魂者","people":["周云暮","卢今","过南山","程如清","卓如岁","顾清"],"one_line":"玄天宗师徒遇袭获青山剑阵救援；书生身世查明","summary":"周云暮与卢今归途中连遭三批强者劫掠，皆因众人认定他们得了景园好处。山神庙前，藏身大树中的邪道高手以喜鹊血雾化黑烟围杀二人，周云暮欲以元婴同归于尽护徒。淡蓝剑光先至，随后十余道剑光合击，正是两忘峰过南山率队施展青山剑阵，邪修连魔婴一并碎灭。过南山奉师命暗中巡察，有意把重点放在云集镇一带。景园这边查明书生程如清身世：曾读一茅斋，与凡人妻子入东易道双修致其病重，井九看医案时便已算到。"},{"n":577,"orig":577,"title":"不要别离","people":["井九","赵腊月","元骑鲸","谈真人","禅子","阿大"],"one_line":"年夜井九言莫要别离；元骑鲸怒雪驱人；谈真人访禅","summary":"年夜赵腊月抱井九，说起程如清夫妻之事触动别离之感。井九讲幼时眼睁睁看友人老死的往事，坦言自己每天都在想如何才能不别离，求她好好修行至少再活几千年。顾清与元曲担心井九心情，往外送信；元骑鲸怒降春雪，割裂云集镇外修行者衣衫，众人惊惧散去，景园终于清静。中州派掌门谈真人到访果成寺，向禅子求证井九身份，禅子答只要继承景阳所有因果便是景阳。谈真人点破天剑成妖难以通天的死穴，预言元骑鲸死日便是井九死期，请禅子写信，欲亲赴云集镇。"},{"n":578,"orig":578,"title":"你要不要来云梦山？","people":["谈真人","井九","赵腊月","元骑鲸","白早","方景天"],"one_line":"谈真人亲赴景园提亲，许掌门之位被井九拒绝","summary":"谈真人持禅子信函踏空而来，青山最强三人元骑鲸、方景天、广元分空戒备。他进景园开门见山提亲：井九若赴云梦山，便把白早嫁他、让出中州派掌门之位，还可提供仙箓解其修行之困。井九想都没想便拒：「我是青山掌门」。众人揣测此事应是白早的主意，谈真人则是不想中州派永远姓白，借景阳破局。青山那边，方景天改井九旧规，简如云等出狱，白如镜成废人；依附神末峰的宝树居遭诸峰压逼，东家跪求顾清撑场。"},{"n":579,"orig":579,"title":"剑不及人，请学会闭嘴","people":["卓如岁","顾清","马华","简如云","尤思落"],"one_line":"卓如岁宝树居力压简如云，警告青山勿欺神末峰旧人","summary":"青山各家外家齐聚宝树居分配份额，马华逼迫顾家族长让族中七人自尽，简如云冷眼羞辱。顾清现身，自称景阳亲传弟子，青山无人有资格为其师长。卓如岁在台上吃菜看戏，嫌辩论麻烦提议打一架；马华搬出师长压制，他讥青山无掌门、天光峰无峰主，没人管得了自己，随手以筷尖驱吞舟剑重创简如云，其飞剑出豁口、剑丸开裂，十余年难复。尤思落按剑不动。卓如岁放话：剑不如人，就要学会闭嘴——凡与神末峰相关者，青山里的人不许再伸手。"},{"n":580,"orig":580,"title":"似是故人来，又来杀人","people":["苏子叶","顾清","卓如岁","马华","尤思落"],"one_line":"简马两家族人各七人被杀，凶手竟是苏子叶","summary":"当夜简家与马家各死七位要人，与顾家此前所失对等，顾清称公平；两忘峰欲查真凶。凶手是玄阴宗少主苏子叶：他受井九解丹毒之方，丹毒化为气息，魔轮渐圆，自认已胜过卓如岁、柳十岁，甘为景阳做杀手脏活。他到商州城旧青楼，点三十个馒头，向年迈老鸹打听三十余年前护卫被血色飞剑断头的命案，随后自三楼杀到后院，斩尽护卫管事与东家。老鸹含泪立在火光前，只觉解脱；她不求报答，只求知道托杀之人是谁，苏子叶未答。"},{"n":581,"orig":581,"title":"血观音","people":["苏子叶","马华","过南山","老鸹","尤思落","元曲"],"one_line":"马华劫持老鸹逼供被斩杀；元曲回山遭昔来峰拦阻","summary":"苏子叶杀简马两家后出城，两忘峰马华设阵以老鸹为质逼他招供，声称行正道莫问其心。苏子叶冷言青山弟子比邪道更邪，转身欲走；过南山赶到斩断剑索救人，斥「这不是小节」，罚马华回山入剑狱反省。马华心有不甘，被一道血色剑光枭首，剑鬼亦被剑意撕碎，赵腊月仍在暗中清理追杀者。另一边元曲回青山办事，在南山门被昔来峰弟子当剑妖一脉围攻，他以更精的七梅剑诀击伤众人；上德峰迟宴以雪流剑法镇场，斥其弟子愚蠢，亲自护他上山。"},{"n":582,"orig":582,"title":"谁家过年不吃顿好的","people":["元曲","谈真人","白真人","方景天","迟宴","白早"],"one_line":"元曲探隐峰传话；年礼涌向景园；云梦山议后手","summary":"元曲上山探玉山师妹，向上德峰元骑鲸与剑狱深处的童颜传话——井九问童颜要不要出来，并留下关于中州派的问题。他探望在云行峰沉睡的平咏佳后回景园，阿飘的冰块已被移入园中。青山大会上，诸峰为顾家、宝树居与简马两家的血案争执，迟宴以查无实据压下，方景天放话只要那些人安分便到此为止。一年过去，各宗派年礼纷纷转呈景园，朝廷将青山明年资源份额的三分之一拨给景园。云梦山上，谈真人与白真人研判局势，必要时将请出后山凶人寇青童；白早在云梦大阵深处捧着一张仙箓。"},{"n":583,"orig":583,"title":"谁家过年不拣个小姑娘","people":["井九","阿飘","赵腊月","顾清","卓如岁","元曲"],"one_line":"弟子们磕头拜年，阿飘受不了火锅诱惑立誓归降","summary":"景园过年，弟子跪拜请安后忍不住问井九何时讲道，方知他吸收灵气动静太大、灵气狂暴会伤及旁人，这一年众人修行愈勤，深知平静之下未来极凶险。新年头一天，雷一惊、幺松杉等陆续一百六十四名青山年轻弟子顶着师长压力来磕头，井九心情大好开火锅宴。冰中的阿飘被摆到院中，坚绝不叛太平真人，却被九香居毛肚馋得崩溃喊降。她立下冥河血誓，魂火融入冥皇之玺；井九挥碎寒冰，经赵腊月打浴更衣，众人惊觉这个冥界小皇族竟是女孩子。"},{"n":584,"orig":584,"title":"开课啦","people":["井九","阿飘","赵腊月","顾清","卓如岁","元曲"],"one_line":"井九讲授剑道本意，许教阿飘魂火之御与帝王之术","summary":"井九开课讲剑：青山以剑拟万物，剑的本意是切断；万物皆有缝隙，光能照进的地方剑便能进，明暗交割亦是剑道；境界的差别只在剑能飞多远、多快、多准。他演示瓷瓶裂纹，众弟子听得出神。被罚举瓶的阿飘问他为何能杀泰炉，答曰「因为我是我」；井九许诺三年后教她魂火之御，此前先教帝王之术，自称在青天鉴做过几十年皇帝。深夜他看阿飘练魂火，嘱咐她记得提醒自己讲镇魔狱的往事。青天鉴内秦皇暴毙、楚国奉赵太后为主，张大公子日日对着井底寻「鱼儿」，青鸟出鉴，与一只殷红小鸟四目相对。"},{"n":585,"orig":585,"title":"平咏佳出关！","people":["平咏佳","老猿"],"one_line":"平咏佳剑峰醒转，独闯神末峰发现人去峰空","summary":"平咏佳在剑峰一觉睡醒，体内剑意爆开割裂崖壁，数百把飞剑自地底飞出相迎，却因敬畏与自卑纷纷避让，他一把剑也拿不到。下峰时听到弟子们议论师父是剑妖、众人被逐出青山，他面色惨白奔往神末峰，被禁制剑意所伤，便闭眼如睡、以身探路，连蹦带跳登上峰顶。峰顶冷清，洞府道殿空无一人，崖下老马已被猿猴葬在石堆下。老猿感其痴傻，牵他过溪，带他找到崖间青藤后藏着的一座洞府。"},{"n":586,"orig":586,"title":"豆子惹的祸！","people":["平咏佳","老猿"],"one_line":"平咏佳误吞一瓶丹药，臭闭关一年出关已近破海","summary":"老猿带平咏佳找到井九旧藏的洞府，内有飞剑与一茅斋符纸封印的青玉瓶丹药。飞剑依旧避他，他便拧开瓶盖把一瓶丹药当豆子嚼了。药力狂暴，他躲进洞府，阵法密闭无空气流通，浊气排不出去，他在恶臭中被迫闭关整整一年，竟未爆体反将杂质尽数逼出，道树与肉身洗炼一新。出关时剑意随挥手切开溪水，他浑然不觉自己境界已至何等境地，只想着出山寻师父，下山便听说当日正是青山试剑大会，自叹运气直追何霑。"},{"n":587,"orig":587,"title":"我也没剑啊！","people":["平咏佳","简如云","方星外","雷一惊","梅里"],"one_line":"平咏佳女装扮相出战试剑，徒手废方星外飞剑","summary":"青山试剑大会于天光峰剑林举行。简如云重伤雷一惊，讥讽心向景园者磕头无用、世间没有先天无形剑体。昔来峰方家子弟方星外出列挑衅，清容峰长老梅里主动接局，点了躲在队伍末尾、戴笠帽被误认成女弟子的平咏佳。平咏佳无剑可出，慌乱中抬手，剑弦织网竟真锁住了方星外的飞剑，又凭在神末峰看元曲演练数十遍的记忆，以无端剑法指法将其飞剑生生击碎，方星外剑丸受创吐血落败，昔来峰长老惊呼「锁清秋」。"},{"n":588,"orig":588,"title":"剑法自然","people":["平咏佳","简如云","梅里","过南山","时明轩"],"one_line":"平咏佳胜方星外后挑战简如云，自报家门师承井九","summary":"梅里解围称那是清容峰剑网术。平咏佳正得意，忽生勇气指名挑战两忘峰强者简如云，摘下笠帽亮出男儿身，自报「神末峰弟子平咏佳，家师井九」，满场死寂。云行峰长老时明轩喝止并禁他参赛，平咏佳不予理会。简如云御剑全力出击，苍鸟剑法快逾闪电；平咏佳自觉剑太快躲不开，借石柱反震飞身上天，衣领袖底飘出数十道淡剑光。迟宴与过南山等凝望高空云层，无人再敢轻视这场剑争。"},{"n":589,"orig":589,"title":"请看无形剑体！","people":["平咏佳","简如云","时明轩","梅里","方景天"],"one_line":"平咏佳重伤简如云，当众展示「无形剑体」质问方景天","summary":"高空剑战结果揭晓：平咏佳落回石柱，简如云重伤昏迷坠落，幸被时明轩接住。平咏佳喷血跪地，伤势较轻，数十道剑光随微风敛入他体内——那正是藏剑入体的手段。他望向方景天挑衅发问：「这就是先天无形剑体，你们看懂了吗？」时明轩怒喝拿下妖人，全场无人应声，众目齐望向方景天。事后梅里带他逛云集镇，点破南忘因情烂醉、自己笃信井九是景阳；平咏佳兴冲冲冲入景园，却发觉园中空无一人，连猫与寒蝉都不在。"},{"n":590,"orig":590,"title":"消失的人们","people":["平咏佳","雀娘","伏望"],"one_line":"平咏佳梅会道战夺魁，与雀娘遍寻不获失踪的井九","summary":"景园空置二十余日，平咏佳凭顾家商行得知消息，乘井九旧马车赴朝歌城寻师。今年梅会在朝歌城举行，他顶替青山名额参加白城道战，三日杀满血梅夺魁，为史上第二多，真实身份随之公开。他与镜宗雀娘查遍井宅赵园，没有任何线索。雀娘劝他梅会后回青山等消息，自己留下继续查，夜里却撞见一个周身金光的矮胖高手，随后失踪。她提醒平咏佳进宫谢恩时千万小心，朝歌城近来不太平。"},{"n":591,"orig":591,"title":"家里的马死了，人都关起来了","people":["平咏佳","井九","赵腊月","顾清","童颜","雀娘"],"one_line":"平咏佳宫中寻回井九；井九把众人锁进隐峰备战","summary":"平咏佳入宫面圣，察觉神皇鬓发骤白、宫中戒备森严，退出时被皇宫供奉金明城拦路，对方却自行退去，井九随即现身。平咏佳扑倒大哭，只说家里的马死了。另一头，井九早已借故把赵腊月、顾清、卓如岁、元曲骗回青山隐峰童颜的洞府锁死，众人屡破阵无果，弗思剑亦无法破开山崖阵法，连来朝歌城寻人的雀娘也被镇守夜哮扔了进去。赵腊月怒问井九要去办什么事，童颜推断只有一种可能：他要与云梦山对上，而神皇要死了。"},{"n":592,"orig":592,"title":"窗里的人","people":["井九","平咏佳","阿飘","神皇","谈真人","童颜"],"one_line":"井九携平咏佳阿飘留守皇宫陪神皇；谈真人赴水月庵","summary":"童颜认出金明城，众人确认神皇将死、中州派要抢皇位，所忧者唯后山凶人寇青童；好在太平真人未死又知井九即景阳，胜负难言。皇宫里井九留下平咏佳作眼线，嘱他事急便逃回青山报信；阿飘也被留下学帝王之术。神皇接见阿飘，井九承诺此事只在朝歌城解决，又坦言自己怕死、也怕身边人死，神皇如孩子般大笑。同日，谈真人无视水月庵大阵直入庵中，欲接走被幽禁的景辛皇子，撂下一句：妖狐之子怎能做人族神皇。"},{"n":593,"orig":593,"title":"青山来的人","people":["谈真人","景辛","南筝","阴三","青儿","水月庵主"],"one_line":"谈真人携景辛离庵；太平真人与青儿入朝歌观局","summary":"谈真人在水月庵逼得景辛下跪，带他离庵赴朝歌。庵主识破潜伏打探沉睡女子连三月消息的南筝，放她乘青帘小轿先进宫报信。朝歌城里，红衣的太平真人阴三携青儿看戏，断言各家入城、中州派必推景辛夺位、遗诏无用，还称乱后才能大治、人族必须变强，吓得青儿连呼疯子。中州派十余艘云船压境，朝歌城数百座神弩上弦疏散百姓。青山不派剑舟是梅会规矩，阴三笑言：我不是已经来了吗。"},{"n":594,"orig":594,"title":"最后一次朝会","people":["神皇","白真人","南筝","顾盼","张遗爱","景尧"],"one_line":"南筝报信景辛被劫；神皇开最后一次朝会待归","summary":"顾盼与张遗爱等中州派出身却效忠神皇的官员严阵以待，清天司已备好战死之心；井家老小撤往城外赵园，赵爵爷决意留守朝歌。南筝乘青帘小轿抢在谈真人前入宫，报知景辛被带走，神皇早有预料。神皇主持最后一次朝会，群臣跪拜泣别，他笑言被拘宫中三百余年也算不亏。应天门上白真人隔空对答，称中州派尊重陛下，其归去前什么都不做，却也不改遗诏、不废太子——皇位归属之意不言自明。"},{"n":595,"orig":595,"title":"陛下走吧，不要回头","people":["神皇","白真人","布秋霄","井九","阴三","胡贵妃"],"one_line":"神皇撑至百姓撤尽驾崩；白真人开阵，井九动手","summary":"一茅斋苦舟赶到，布秋霄以黎民为重要求止战限于皇城，白真人竟允诺。神皇与胡贵妃茶叙往事，井九静坐偏殿窗边。疏散中的朝歌城危机四伏，深宅大院里人影浮动，各方暗手蓄势待发。夜半神皇驾崩——他一直撑到城中人撤尽才走，举朝恸哭，三百年太平尽是他的馈赠。礼部尚书请景尧登基，白真人下令开阵，皇城大阵竟渐渐变薄；井九低声道「动手」，阴三亦道「杀了」。"},{"n":596,"orig":596,"title":"卷帘方知人不老","people":["顾盼","詹国公世子","井梨","金供奉","牛供奉","辛海辰"],"one_line":"卷帘人不老林联手清剿内应，皇城大阵重新稳固","summary":"神皇早有布置：卷帘人顾盼联合不老林的礼部侍郎，诛杀欲毁禁阵的清天司副指挥使；观星台被血洗，钦天正手中阵眼易主；詹国公世子受南蛊胁迫亲手害死藏阵眼的祖母，井梨收走阵眼。十余处内应接连被清除，皇城大阵重回坚固，一艘云船撞上光圈被毁，神弩齐射警告。皇宫地底，金供奉与牛供奉互相戒备数个时辰后各自罢手，原来一个是不老林、一个身份成谜。就在此时，北神卫军指挥使辛海辰暴起，隔空挥刀斩向景尧。"},{"n":597,"orig":597,"title":"同一个景字，同一把剑","people":["井九","辛海辰","景尧","鹿国公","白真人"],"one_line":"井九诛辛海辰，遗诏封其皇叔景阳监国，初子剑清场","summary":"辛海辰拼死一刀被井九白衣所挡，井九扼喉碎颈将其诛杀，随后命鹿国公宣读遗诏：传位景尧，顾清为帝师，而监国者竟写作「皇叔景阳」——井九是皇族长辈的真相震动朝野，众人这才明白神皇为何亲近青山。景尧拜见皇叔祖登基，仍有将领侍卫欲效仿行刺，景尧腰间初子剑应声出鞘，剑光无声穿行，转瞬将刺客斩成血块。白真人遥遥问是不是南趋的初子剑，井九答：这是我的初子剑。此剑千年辗转、克尽所有主人的仇敌，如今终于回到景阳手里。"},{"n":598,"orig":598,"title":"广如天地，美如人间","people":["谈真人","井九","景辛","白真人","布秋霄"],"one_line":"谈真人云梦诏破阵被元气炮逼退，步行入皇城提条件","summary":"谈真人携景辛至，祭出云梦诏要破皇城大阵，井九弹指启动宫殿石柱中的十二破空元气炮，击伤云船、稳固大阵——那是前任神皇藏在宫中的手段。谈真人以天地错步穿阵步行而下，朝中中州派官员跪迎。他开出条件：景尧与胡贵妃可安全离开，梅会体制一切如旧，实则要恢复云梦山对皇朝的控制，并请各派作证。各宗派强者陆续赶来观望，果成寺循例不涉皇位之争，禅子只为井九而来；井九沉默，众人等他答复。"},{"n":599,"orig":599,"title":"我想和你打一场","people":["井九","谈真人","阴三","青儿","越千门","布秋霄"],"one_line":"谈真人提三场血战；井九拒绝，只约他单打一场","summary":"一艘中州派云船轰击棋盘山一带追杀太平真人，布秋霄以龙尾砚对峙，白真人道「太平在那里」。阴三弃尚书府而走，越千门率云船沿途毁街杀民，青儿怒斥其残忍，他只答人族不变强便会被灭绝。皇城内谈真人提议两派各出三人血战到底。井九自算纵用那一招也只有九成胜机，青山后继无人，必输无疑，遂拒绝此案，提出简化：我是青山掌门，你是中州掌门，你和我打一场就好。"},{"n":600,"orig":600,"title":"我让你们动了吗？","people":["井九","谈真人","景尧","景辛"],"one_line":"谈真人拒单挑改议五场对局；青帘小轿内忽出异声","summary":"满城震惊于井九的单挑之请，谈真人却摇头拒绝——纵是景阳再世，重修岁月太短，境界终是不够。井九改提两派各出十人对战，又称可增至百场千场，尽显对青山的信心；谈真人最终敲定五场、胜者继续，井九应下。皇城大阵解除，云船退至城外，众人却在疑问：元骑鲸与方景天都不在场，青山何人出战？此时宫墙边那顶青帘小轿里传出一道平淡却响彻天地的声音：我让你们动了吗？"},{"n":601,"orig":601,"title":"寻常无奇连三月","people":["连三月","谈真人","井九","白真人","阴三"],"one_line":"过冬现身实为连三月，当众认井九，要代青山出战","summary":"皇宫广场的青帘小轿里走出水月庵弟子过冬，她声称本想偷袭谈真人，却决定留他一命、正大光明打一场，随即气势暴涨压过谈真人。谈真人唤出其真名连三月：六百年前雪国兽潮南侵、北方大乱，正是这位水月庵天才弟子南下烧寨杀匪，以一己之力稳住乱局；她被视为最有望飞升者，传闻早已死去，实则飞升失败后以春蚕化蝶之法转世重修，如今归来。她宣称这是天下事、天下人都能管，面对白真人「你终究不是青山的人」的质问，她答「但我是他的人」，笑容令满城动容。前世二人同游一次便吵翻，这一世装作互不相识多年，此刻她向谈真人正式叫阵。"},{"n":602,"orig":602,"title":"如雷贯耳寇青童","people":["寇青童","连三月","井九","白真人","阴三","青儿"],"one_line":"白真人请出千年老怪寇青童，一拳将连三月轰入地底","summary":"井九一声轻嗯，承认了「我是他的人」；连三月取出一朵桃插在鬓畔，那是他当年在水月庵她沉睡时所留，随即向谈真人叫阵。白真人遂请出云梦后山藏身多年的老怪物寇青童：此人厌恶阳光，开口索要仙箓作报酬，讥讽中州派一代不如一代，随后携满天惊雷撞破天空降临皇宫。连三月在他身上嗅到熟悉的气息——那是杀人杀到不把自己当人的味道。寇青童视她为此生最强对手，一拳轰出如附着域外天魔的流星，威力堪比西海剑神全力一剑，连三月仓促合掌硬挡，竟被轰入地底深洞，生死未知。井九神色平静，暗知今天打死寇青童的不会是自己；阴三则算准方位，说这个凶人值得亲手杀一杀。"},{"n":603,"orig":603,"title":"血魔教最后的两个人","people":["寇青童","连三月","柳十岁","布秋霄","井九","平咏佳"],"one_line":"寇青童魔童身世曝光，柳十岁魔息发作，连三月生还","summary":"皇宫死寂，众人认出寇青童的来历：千年前血魔教肆虐，正道围剿久攻不下，白刃仙人推迟飞升亲自收服教中地位极高的魔童寇青童，借他掌握总坛情报破敌，血魔教教主更因他偷袭而死在白刃与道缘真人合击之下；事后他依约在云梦后谷隐修至今。念及这段往事，各派无人声讨中州派。柳十岁当年在浊水底修过血魔教邪功，被同源魔息激发，呕血濒危，布秋霄灌清风、喂丹药才稳住，寇青童怒斥他不该投一茅斋门下。井九望着寇青童，如看一个死人。地底呜咽声中水柱激射，浑身湿透、唇角带血的连三月从深洞回到广场，寇青童讶异：你居然还没死？"},{"n":604,"orig":604,"title":"连三月的悔与怒","people":["连三月","寇青童","井九","平咏佳"],"one_line":"连三月嫌受伤晦气，一拳将寇青童打飞出皇城","summary":"连三月拭血整装，自认不该让寇青童先出手——她不怕受伤却不喜欢受伤，只要她先出手，对手便再无出手机会。面对「六百年来最凶、杀人最多」的头衔，寇青童自认千年前的他才是杀人最多者，问她算没算过杀人数目。连三月答「我从来不以杀人为荣，只以能杀人为荣」，高下立判。她让寇青童试试自己的拳，随即凭极致速度消失于天地，一记最简单的直拳撕开血魔教秘法魔息，穿过他的双手落在胸口。寇青童被击飞，撞破宫墙与应天门，一路向南到城墙下才停住，从陷坑到广场犁出一道笔直深沟，他半身埋在石砾里，茫然又愤怒。"},{"n":605,"orig":605,"title":"还有她的残忍","people":["连三月","寇青童","井九"],"one_line":"连三月数千拳镇压寇青童，杀意笛声随之响起","summary":"寇青童不堪被打飞之辱，撕下朝霞化作血光砸回，连三月卷下云彩化海相迎，二人以拳对拳，皇城大阵几近崩溃，谈真人渡真元助金牛两供奉稳住大阵。恶战过后寇青童遍体鳞伤，问她怎么这么扛打，她答因为你太弱。震落鬓边桃花一瓣后，连三月眼神转冷，张开双掌似托住整片天空，碧空里生出数千道线——每道都是她的拳，数息间轰出三千余拳，血魔教秘法、中州派道法尽皆无用。寇青童单膝跪地，再次沿同一路线被打飞，撞塌应天门，重伤伏于城墙之下。三名中州派谷主赶来相救，一道充满杀意的笛声却先响了起来。"},{"n":606,"orig":606,"title":"我还要打你！","people":["连三月","谈真人","井九","平咏佳","布秋霄"],"one_line":"连三月连胜后挑战谈真人，一滴水点开巅峰之战","summary":"连三月收拳，众人敬畏更甚——这位多年未出手的传说人物比传闻更可怕。她直言寇青童虽强仍稍弱，但不如谈真人，所以要打他。五场决胜负中胜者可连战，谈真人没有拒绝，认真摆开双手如抱虚空，那双手能握住真实的异度空间。连三月也不先出手，弹一滴水落入其掌间，涟漪荡开如湖面，战斗就此开始。谈真人的道法将整座皇城收入镜中、切割成交错画面，空间叠加挤压，连三月旧伤迸发却找不到他的真身。她索性抓住一束晨光握断，以光之微粒填满所有镜面令其崩溃，宫殿归位。此刻，谈真人从御园高塔中走了出来。"},{"n":607,"orig":607,"title":"血后桃花分外美","people":["连三月","谈真人","井九","景辛","景尧"],"one_line":"谈真人持景云钟仍不敌，自认输了离朝歌而去","summary":"谈真人持中州派镇派法宝景云钟现身，此钟能令谪仙魂飞魄散，更可借天地错步随意挪移。连三月以水月庵天人通预判他每次现身之处，晨光候遍去路。谈真人终于欺近十余丈内敲响景云钟，连三月将速度提至极致，周身亮光组成光幕与之擦身而过。光散后二人背对而立：连三月血擦不净，谈真人衣衫焦痕、皱纹加深，爽快认输，自言不想死、还有很多事要做，并称她真元可入修行界历史前三，朝天大陆无人是其对手，随即踏空回云梦山。景氏兄弟景辛景尧趁乱相见，相对无言。连三月洗净血污，坐到井九身旁，鬓边染血的桃花微微颤动。"},{"n":608,"orig":608,"title":"喝了杯茶，来了个人","people":["连三月","井九","寇青童","阴三","平咏佳","青儿"],"one_line":"阴三一剑诛杀寇青童终结血魔教，白早随白真人现身","summary":"连三月坐石阶与井九闲谈，笑骂他行事黏糊、如今太弱，二人提及她若不醒井九本要用的那一招，都说自己受了对方影响。平咏佳战战兢兢端茶，连三月饮茶谢过，二人却都看不出这孩子有何特别。另一边重伤的寇青童躺在城墙豁口，三名中州派谷主赶来相救，笛声忽起，一道无形小剑穿其双耳而过，他迅速枯萎成枯叶随风而散，血魔教历史就此终结。三名谷主追笛声而去，与越千门合流围捕太平魔头，竟追之不及。阴三在酒楼以井水泡茶远眺白真人，称是试探，断言今天会有人死。随后白真人云雾飘入皇宫，雾散处，白早从她身后走了出来。"},{"n":609,"orig":609,"title":"良宵","people":["井九","连三月","白早","平咏佳","白真人"],"one_line":"中州派第三战竟是白早，连三月以良宵道法困住井九","summary":"白早戴帷帽入场，井九知道她就是青山的第三个对手。连三月怨他当初不该传她功法，井九执意自己上场，连三月以「你现在太弱」反对，二人险些先打一场，最终她以梦中悟出的道法「良宵」借晨光将他困住，把那朵桃插进他缺损的耳里。井九要平咏佳逆行剑元，把全部剑意逼出给自己。连三月走向广场，怒斥白真人身为亲母竟对女儿下手——白早闭眼如熟睡般自行前行，实已被操控。太阳雨骤降，乌云蔽日，雷电交加，无数道闪电自云端、雷域乃至更高处劈入白早体内，一场降临就此开始。"},{"n":610,"orig":610,"title":"归来的仙人","people":["白刃","连三月","井九","阴三"],"one_line":"白刃仙分身降临白早之身万民跪拜，连三月升空迎战","summary":"闪电入体后白早睁眼，气息已超人间范畴，一句轻语便令众生晕眩倒地——众人惊觉降临的是飞升千年的白刃仙人，朝歌城万民跪拜。原来连三月飞升失败后一直在寻传人，因赵腊月上了神末峰而选中雪原归来的白早，师徒无名师徒之实；如今看她被家族图谋弄成这样，满心怜惜。阴三举杯独不跪，讥讽回来了就算不得仙人；被良宵道法困住的井九不动声色，借平咏佳源源送来的剑意磨损束缚，晨光断尽便要试着杀仙，哪怕白早会同死。连三月应了句是对是错打过再说，飞入虚境与白刃对战，却如流星被一次次打落，坠进广场蛛网中央，久久不动。"},{"n":611,"orig":611,"title":"战你个仙人","people":["连三月","白刃","井九","童颜","赵腊月"],"one_line":"连三月屡败屡战硬撼仙人，弗思剑宇宙锋脱困北飞","summary":"连三月被打落后又站起，揉脖吐血再次飞升，落下、再起、再落，广场蛛网连片，满城死寂中她一次次撑起身躯，战意不灭，众人敬畏无已。青山隐峰里，弗思剑与宇宙锋忽然破洞而出直飞天际，童颜以一个故事说动镇守的尸狗放行。虚境之上真相揭晓：白刃留下六道仙箓，长生仙箓被井九夺得后炼化仙识，将仙气尽数灌入连三月体内，她沉睡多年将其转为真元，才有了足以对抗仙人的无穷仙气与最强状态。连三月化作一道金线，再度直指白刃。"},{"n":612,"orig":612,"title":"一根弦","people":["连三月","白刃","白早"],"one_line":"连三月以一根仙气弦锁仙人，一掌拍出白刃分身","summary":"白刃道破连三月久战不下的根由：仙人有仙识，如立于山外看山全貌，山中人永远算不准仙人方位，她纵有仙气也击不中对手。连三月任她指尖点上眉心，广场下沉一尺，她却借同源仙气相亲之性，以改过的无端剑法把体内仙气凝成一根坚韧金线，锁死白刃指尖令其无法离开——「我只需要一根弦」。随后她以一招「镜水月」轻描淡写一掌拍在白早胸口，竟将白刃仙人从其身体里拍出，凝成金光分身悬于高空，众人惊骇至极。白早迷惘苏醒，倒在连三月怀里轻唤前辈；连三月抱她走向大殿，把接下来的事留给某人。"},{"n":613,"orig":613,"title":"诛仙剑阵","people":["井九","白刃","连三月","白早","平咏佳"],"one_line":"井九召四大名剑布下诛仙剑阵，困住白刃分身","summary":"连三月以无端剑法凝仙气为桥，把仙气尽数灌入白早体内逼白刃离体保命，自己仙气耗尽。白刃化为纯仙气灵体悬于高空，声称纵然不能久留仍可杀尽众人。石阶前晨光碎裂，平咏佳呕血昏死。井九升空，剑意覆盖皇城，各派飞剑纷纷应召——他以剑意唤回传出去的四剑：弗思、初子、宇宙锋与不二，四剑各据方位自成天枢，布下一座剑阵困住白刃。白刃移形十余里仍在阵中，催动闪电也难破阵，神情凝重询问阵名，井九答道：诛仙剑阵。"},{"n":614,"orig":614,"title":"一招从天而降的剑法","people":["井九","白刃","白真人","布秋霄","阴三"],"one_line":"井九入阵为第五剑，万千飞剑自天而落绞碎云船","summary":"井九答出诛仙剑阵之名，朝歌哗然。白刃挥袖放出毁灭金风，四剑灵气受损、剑阵转弱，井九遂以万物一剑斩开星路亲入阵中，连占十七星位，剑阵重稳、杀意倍增，但白刃以仙意相隔，他坦言剑还不够。同时白真人不顾赌约，令十余艘云船强攻朝歌城，欲趁仙人未走夺取皇城大阵、杀景尧定局，布秋霄怒而起身，阴三惊叹中州派比他还疯。此时阴云下生出无数细线，前端皆是一把把寻常飞剑，千万飞剑穿云而落如暴雨倾盆，先锋云船阵法瞬间崩解，率队谷主被数百剑穿体化作血雾。白刃问这是什么，井九反问：你有没有听说过一招从天而降的剑法？"},{"n":615,"orig":615,"title":"青山剑阵！","people":["井九","白刃","连三月","赵腊月","元曲"],"one_line":"青山万剑北上结阵，井九以幽冥仙剑诛杀白刃","summary":"青山隐峰石门开后，满天飞剑离山北上，元曲的怪剑与卓如岁的吞舟剑亦随之而去——这便是传说中无人能挡的青山剑阵。剑雨将攻城云船尽数绞碎，中州派强者逃无可逃，惨死遍地，飞剑钉满地面如野草，杀人如草。高空里剑阵早已洞穿白刃的仙气灵体，仙气如金丝外溢不可逆转。白刃看出井九强用青山剑阵几近找死，叹其手段后，井九以幽冥仙剑穿过她的身体，终结了这位仙人，自己也被反噬震得咳血，一滴金色血珠自耳垂落下。他回到石阶坐下，白真人云雾再临，淡淡问：接下来是谁？"},{"n":616,"orig":616,"title":"笛声再起","people":["阴三","白真人","井九","越千门","童颜"],"one_line":"阴三笛声再起吓退白真人，青山剑舟围攻云梦山","summary":"白刃仙人已死，白真人仍不罢手，布秋霄与禅子明言五场三胜青山已赢，她依旧向大殿走去。危急时红衣少年阴三横笛入门，笛声唤起满地青山飞剑斩杀中州派高手，越千门法宝被绞碎、断臂而逃。面对「你拎给我看看」的讥讽，西北云梦山方向传来麒麟怒吼，白真人深深看了井九与阴三一眼，竟率云船尽撤。真相是十三艘青山剑舟破云围攻云梦山，元骑鲸等峰主尽出，讲了个故事离开隐峰的童颜立于舟首，算破云梦大阵薄弱处，指点飞剑强攻。青山宗史无前例地围攻中州派山门。"},{"n":617,"orig":617,"title":"活着，便是羞辱","people":["童颜","谈真人","南忘","元骑鲸","井九","阴三"],"one_line":"青山强攻云梦山，谈真人回援，井九按停阴三巨剑","summary":"童颜靠讲故事与盘外招离开隐峰，在剑舟上补全了元骑鲸那套说辞，指挥两忘峰弟子攻阵。谈真人归来劝罢手，元骑鲸以「你们罢手了吗」回敬；南忘感应到连三月还活着、且在帮井九打仙人，羞愤交加不要命地以无端剑弦猛攻，破开云梦大阵一角。朝歌城传来井九诛杀仙人的巨响，青山弟子欢呼小师叔威武。麒麟被激怒欲出，却见云海之上趴着冷漠如山的尸狗，只得收敛。另一边白真人撤走后各派强者锁定阴三，阴三挥笛聚起乱剑成巨剑斩向苦舟，井九站起伸右手按停巨剑，讥他只能影响少部分青山。"},{"n":618,"orig":618,"title":"皇城血色","people":["井九","阴三","连三月","白早","元骑鲸"],"one_line":"师兄弟话别各去，白早保命沉睡，井九携连三月离去","summary":"师兄弟多年后近距相见竟在争夺青山剑阵，巨剑散作满天剑雨归地。井九谢阴三救命之恩，以「我是你师弟，不是你徒弟」回应他的责问，阴三大笑着带话离去，青儿却留下。白早因仙气冲体只能靠长睡炼化，连三月拥她入睡，叹她与雪姬、自己睡过同一张榻。元骑鲸赶到朝歌坐镇，向连三月道谢，让她与井九离开。城外赵园收留难民，阴三与玄阴老祖对饮，惋惜白真人撤得太快没能杀成；井九摸着怀里的阿大说可惜，它暗自庆幸白真人走了。皇宫正午，光柱穿过阴云落在满地飞剑与尸体上，诡异而美。"},{"n":619,"orig":619,"title":"同游","people":["井九","连三月","白早","阿飘","平咏佳"],"one_line":"井九连三月云游同游，白早入雪茧沉睡三千庵","summary":"阿飘死活跟着井九走，连三月得知他竟收了关门弟子平咏佳，笑他变通。新帝登基大典在残破皇宫举行，平咏佳醒来时漫天飞剑正向青山飞去，误以为师父飞升了，阿飘笑他：先生陪连三月前辈云游去了。二人到大原城外三千庵，连三月以春蚕化蝶道法将白早裹入雪茧，估计她炼化满身仙气要睡很多年。湖边井九偷袭点她头顶被反震出惊雷异象，二人说起仙气相赠的缘由，井九称自己永远不死，连三月骂他永远是骗子。牵手同行时她说想去白城见那个男人，井九答我陪你去。"},{"n":620,"orig":620,"title":"人间夜夜皆良宵","people":["连三月","井九","曹园","李公子"],"one_line":"连三月白城别曹园，听罢良宵引散作晨光而逝","summary":"井九陪连三月到白城小庙见刀圣曹园，重提当年邀他南行之事，曹园坦言后悔，她请在佛前抱她入睡，三天后道别；曹园谢井九还活着能陪她。此后二人同游诸城，看遍一轮春夏秋冬。回三千庵时，心悸一年的大原城李公子上山弹琴，连三月听罢道出「仙人殊途」的旧憾。夜里她与井九说起当年决裂缘由：他怕耽搁她飞升才分开，又说出「我会等你」这句最动人的情话；她答这次不用等了，来世再等，随即化作金光散入天空变成晨光，就此陨落，太阳照常升起。李公子一夜白头，曹园刀光直入雪原深处，不知是否一去不回。"},{"n":621,"orig":621,"title":"我不要长发及腰","people":["井九","顾清","何霑","赵腊月","平咏佳","阿飘"],"one_line":"连三月陨落，井九听琴后倒下沉睡，赵腊月蓄发而至","summary":"朝歌城一役一年后，皇宫初步修复。大原城清晨提前到来，意味着连三月陨落。井九在殿中命胡大学士弹琴，评了句「没有我昨天听的琴好」，又说自己学不会弹琴、也学不会哭，交代顾清别让何霑回北边，说了句「真难」便向后倒去，气息悠长却再无醒兆，满朝震动。何霑从雪原赶来要讨说法，见井九沉睡，又暗知姨妈连三月已死，痛哭一场后赶回白城盯着刀圣与雪国女王之战。众人商议把井九送回太常寺旁的井宅。当晚血色晚霞里，赵腊月立在井宅海棠树下——她听闻噩耗后开始蓄发，已将及腰，随即一剑将满树海棠斩成碎屑，披发守在书房外。"},{"n":622,"orig":622,"title":"百年回响","people":["赵腊月","顾清","禅子","水月庵主","元曲"],"one_line":"赵腊月断发留书守候；百年出关成最年轻破海巅峰","summary":"赵腊月在井宅圆桌沉默吃完一顿饭，让井梨媳妇替她编了辫子，随后在书房前枯坐，抬手以弗思剑割下辫子送回井九身边，自己驭剑回了青山。禅子把净觉寺后三殿整座搬来街对面坐镇，水月庵主来看过便回东海守通天井，悬铃宗、镜宗、大泽等各派环侍井宅四周，与皇宫里的元骑鲸一道护住沉睡的井九。转眼百年：青山广元真人通天、方景天至通天中境，中州派如封山般沉默，元骑鲸枯守皇宫不明原因地活着。某个秋日赵腊月出关，百年连破三境至破海巅峰，成为有史以来最年轻的破海巅峰，连当年景阳的进度也被她超越，元曲震惊失礼，碧湖峰顶阿大一声喵呜，满是想念与佩服。"},{"n":623,"orig":623,"title":"窗外","people":["顾清","胡太后","方景天","赵腊月","卓如岁","元曲"],"one_line":"方景天谋立掌门；胡太后与顾清的百年私情难抑","summary":"方景天经营百年，以「井九一日不醒，青山便一日无掌门」为由提出新立掌门，天光峰卓如岁等激烈反对，明年春的青山试剑将做最终决定。赵腊月得知果成寺、水月庵、一茅斋等轮流守着井九，也疑惑元骑鲸为何早过寿数仍活。朝歌城里，胡太后与顾清商定：若方景天成掌门他便须听召，故应在开春前与水月庵甄桃结为道侣、引庵主为援，顾清坦言自己确实也喜欢甄桃。太后打趣男人现实后，二人隔着十几丈静看空无一物的窗外，许久她轻声问「那你就准备这么丢下我吗」，眼眶泛红落泪——这段瞒尽天下的私情，已经维系了一百年。"},{"n":624,"orig":624,"title":"顾清的故事","people":["顾清","胡太后","井九","顾寒","景尧"],"one_line":"顾清忆庶出身世与神末峰机缘，自道为太后可拼命","summary":"顾清忆起身世：庶出之子生于偏院，天赋不及嫡兄顾寒，被顾家送入青山做剑童。承剑之夜他的飞剑被井九随手砸飞，他请教对手反得指点，又因柳十岁一句「你要不要去那边试试」决意投神末峰，从此脱离顾家，成为井九弟子、神末峰大管家、景尧之师、代理掌门直至监国，百年辅政无人能挑出错处。母亲去世时他回了趟家，那是他与人间最后的连线。他自问除师父外还愿为谁拼命——答案是她。当年他因胡贵妃生得太好看而刻意避着，神皇驾崩夜她扑进他怀里痛哭一夜；他破境那日得她窗外一瞥；十年后一个寻常秋日，两人牵着手在御园走了整夜，什么都没发生，却什么都已经发生。"},{"n":625,"orig":625,"title":"还君明珠","people":["顾清","胡太后","越千门","阴三","玄阴老祖"],"one_line":"顾清胡太后相伴六十年；阴三杀越千门夺还天珠","summary":"御园牵手之后十年，顾清与胡太后终究走到一起，相伴六十年。他坦承自己的道需要同行者，与师父不同；太后怨他「就算我是妖族又能有几个一百年」，顾清提起六十年前的承诺：她若肯同修大道，他可弃监国与掌门之位带她去蓬莱甚至异大陆，可她三次都放不下景尧。她只能接受他将与甄桃结为道侣，只求他照顾自己到死。与此同时，宫中老太监竟是中州派暗桩，借至宝还天珠录下了二人夜话。越千门密取还天珠，欲借此拿捏顾清、离间青山与朝廷，却遭笛声伏杀：阴凤双翼截断夜色，无形小剑贯颅，玄阴老祖将其吞入腹中炸死，还天珠落入阴三之手。"},{"n":626,"orig":626,"title":"该死的男人","people":["顾清","阴三","井九","甄桃","胡太后"],"one_line":"顾清受还天珠要挟，决意设局以命换杀太平真人","summary":"顾清以剑火替沉睡的井九擦洗，对着榻上师父袒露心结：舍不得胡太后却不能与她在一起，喜欢甄桃也是真心，自嘲烂人，仍决定开春与甄桃结为道侣，只求师父醒来。他与甄桃在星夜牵手同行。阴三在酒楼出示还天珠里的画面要挟：先叫停朝廷与果成寺、水月庵、一茅斋在青山大会向方景天施压的布置，日后再办两件事，顾清面色苍白却镇定应下。回去后他深吻胡太后，在元骑鲸身前长跪，又把承天剑三隐式的想法尽数告诉甄桃。他已打定主意设局杀死太平真人——身败名裂注定，而他自少年起便觉得自己这种男人该死，那就去死好了。"},{"n":627,"orig":627,"title":"该劈的人们","people":["童颜","赵腊月","元曲","顾寒"],"one_line":"童颜出隐峰定计，与元曲欲推赵腊月做青山掌门","summary":"童颜收到朝歌来信，结束百年隐居走出隐峰。路过洗剑溪，他听到新弟子把百年前的故事传成井九一人连败掌门与仙人，又对中州派百般不屑，随即被洗剑阁薛姓教习拦下盘问——他修的仍是中州道法，又无青山身份，幸得顾寒赶到斥退众人并郑重致歉。上得神末峰，童颜与元曲先定下最稳妥的策略：支持同为通天境的广元真人争掌门，赵腊月出关后一个「不行」否决。二人翻遍门规一天一夜无所获，赵腊月只留一句「明年春天之前我回来」便驭剑北去。童颜与元曲定计推赵腊月做掌门，元曲担心若师父醒来会被一剑劈了，童颜答：我境界不好劈，你比较危险。"},{"n":628,"orig":628,"title":"短发的理由","people":["赵腊月","何霑","瑟瑟","曹园"],"one_line":"赵腊月访刀圣拒做第二个连三月，独闯雪原深处","summary":"赵腊月北上雪原，先到边地庭院与何霑、瑟瑟吃火锅，得知刀圣当年因连三月之死冲进雪原，与女王大战十年，重伤至今未愈；风刀教与昆仑派约定明春在烈阳峡旧址比拼争夺冷山。她入白城后山小庙探望刀圣，对方警告她不要与女王相争——当年连三月坚持组队杀女王，不过是想与景阳争强，事实证明是错的，人该与天争；景阳当年的回答是「别打扰我飞升」，二人自此形同陌路。赵腊月答自己没那么蠢，不是连三月也不想成为她，更不愿做井九心里的替代品，这正是她剪去长发的理由。言罢她敛去剑光，独自飞向雪原深处。"},{"n":629,"orig":629,"title":"你的名字","people":["赵腊月","彭思"],"one_line":"赵腊月雪原寻旧洞，为柳十岁一剑诛昆仑长老彭思","summary":"雪国怪物不需进食，凭寒气自生，数量越过界限便会南下成兽潮，人族只能持续深入猎杀维持平衡。赵腊月进入雪原七十余日，杀雪怪七百六十二只，寻到当年井九与白早被困六年的崖洞，摩挲壁上旧日剑火焦痕与天蚕丝，在井九当年坐处调息。洞外昆仑派长老彭思霸占地盘，斩断一名风刀教徒手臂，赵腊月出洞只问他的名字——当年正是彭思打伤柳十岁，井九说过「遇着我给你打回来」，如今师父沉睡，这笔账由她来讨。彭思认出她是神末峰主后不以为意，她一剑断其臂，再以剑意将其洞穿而亡。风刀教徒感叹：前辈当年第一次下山，就是凭杀人出的名。"},{"n":630,"orig":630,"title":"人生自古皆如此","people":["赵腊月","彭思"],"one_line":"赵腊月血战雪魅证道破海巅峰，遭飞剑暗算重伤","summary":"赵腊月斩杀彭思令众修震惊，风刀教徒道破她当年初次下山便是以杀人成名；这一剑也为柳十岁讨回旧账。她继续北行，深雪原中已无破海境强者肯来。她在冰川遭女王亲卫雪魅伏击，这种直立行走的雪国怪物战力堪比破海强者，她先杀一只，再连杀五只，继而主动闯入二十余只雪魅的重围，以战养剑，血染冰原，在生死之间练成真正的破海巅峰。正待离去，雪魅竟抓起同伴掷向天空，更高处有强者在阳光里暗藏飞剑偷袭，一剑穿透她的手掌与身体，她跌落冰川——凶手境界不在她之下，剑招老辣幽冷，一击即走。"},{"n":631,"orig":631,"title":"白雪红汤使人痴","people":["赵腊月","卓如岁","元曲","童颜","何渭"],"one_line":"赵腊月濒死犹战雪魅；卓如岁出关晋破海巅峰","summary":"偷袭者一击即走，赵腊月断定是昆仑掌门何渭。她压下体内残留剑意，拖着残躯与围拢的雪魅死战，再坠雪崖，血染视线，想起井九，此行真正的缘由不过是想亲眼看看雪原深处那座孤峰。青山这边，卓如岁再度出关，一举晋入破海巅峰，据广元真人观察甚至不止于此，只比井九当年慢了一年；元曲当众拆台说他比赵腊月还慢三年，又拉他去云集镇景园吃火锅。席间童颜点出正题：明年春天方景天要做掌门。卓如岁听闻顾清将与甄桃结为道侣，又得知童颜打算推赵腊月为掌门，表示只要赵腊月肯认他这个徒弟，便支持她。"},{"n":632,"orig":632,"title":"归来的弟子们","people":["平咏佳","阿飘","卓如岁","顾清","童颜","元曲"],"one_line":"阿飘平咏佳自冥界召回，顾清请平咏佳助办大事","summary":"景园火锅桌上卓如岁应下童颜之请，条件是赵腊月肯认他为徒。东海通天井畔，平咏佳与阿飘从冥界归来：数十年间阿飘在冥师帮助下已获多数子民认可，大祭司虽有中州派暗援仍节节败退，眼看清运将成，却因青山掌门之局被召回人间。青帘小轿却把他们径直送进朝歌城，阿飘想起七百年前冥皇被囚镇魔狱的旧事，吓得大哭求饶，连冥皇之玺都不要了，平咏佳好说歹说才安抚住，结果只是虚惊。顾清在井宅相迎，请二人先去看沉睡的师父，随后坦言自己遇上了不能回青山的大麻烦，此事没有平咏佳办不成。"},{"n":633,"orig":633,"title":"信自己","people":["顾清","平咏佳","阿飘","胡太后","赵腊月","景尧"],"one_line":"顾清密谋以诛仙剑阵杀阴三；赵腊月血战将殒","summary":"阿飘入宫，胡太后视她如女，景尧劝母亲对这位未来冥皇尊重些反被训斥，母子走后太后独自掩面无声而泣。井宅里顾清道出所谋：不老林的线索让他确认了太平真人的位置，他要平咏佳像百年前那样逼出全部剑意、隔空布下诛仙剑阵，配合皇城大阵困杀阴三——知情者越少越好，只能用自己人。雪原深处，赵腊月被何渭偷袭后强撑着与雪魅血战一天一夜，衣衫成布条、皮肉翻卷见骨，血将流尽仍拄剑不倒。五只雪魅围拢，晶石般的眼里竟现出雪国对高阶生命才有的尊敬。她平静等待长夜降临——没有修道者能温和地走进长夜，但真来了，平静些也是好事。"},{"n":634,"orig":634,"title":"活着的理由","people":["赵腊月","何霑","瑟瑟","曹园"],"one_line":"雪国女王传讯放行，赵腊月凭意志走出雪原","summary":"五只雪魅忽然收步离去，雪原深处孤峰传来一道宏大神识，信息清晰：我们很相似，都不是替代品，会变得更强大、真正战胜造就我们的人，希望你能活着离开。此后再无怪物阻拦，但赵腊月剑元耗尽、经脉千疮百孔，只能步行出雪原：靴子磨成碎片，小脚趾冻断，途中不断出现井九、父母等人的幻觉，她认出那张频繁浮现的女子脸只是想象中的连三月，凭推演与意志硬撑到走出雪原，见了何霑才倒下。白城全力施救，曹园坦言从未见过这么重的伤，她本该必死。苏醒后她说：我不喜欢痛，但也不怕；我答应过他要活着，要永远活着，也许将来道路不同，但目的一样。"},{"n":635,"orig":635,"title":"好春光，不过梦一场","people":["赵腊月","童颜","顾清","广元真人"],"one_line":"赵腊月决意回青山杀方景天，弗思剑寄予顾清","summary":"广元真人亲率剑舟载适越峰仙药救回赵腊月，童颜潜行探望，告知顾清密召平咏佳与阿飘之事——那必是要重摆诛仙剑阵杀太平真人。赵腊月拒绝去朝歌城，决定把弗思剑游给顾清，自己回青山杀方景天。童颜问她为何要越境挑战通天大物、是否志在掌门，她答：因为他没死，青山就不能有新掌门；若顾清解决不了太平真人，「那他就自杀好了」——井九说过，选择这种事只要能承受后果便无关对错。朝歌城柳絮渐深，顾清对榻上师父絮叨百年心迹与不为人知的跳脱性情，最后轻轻戳了一下井九的脸，开心地笑了——今天他要去做那件无论成败都会死的大事。"},{"n":636,"orig":636,"title":"柳絮","people":["顾清","柳十岁","平咏佳","阴三","赵腊月"],"one_line":"顾清携剑布局旧梅园，只身叩门直面阴三","summary":"顾清替井九掖好薄被，在院中望了望柳絮如雾的天空。赵腊月寄出的弗思剑悄然而至，化作剑镯系上他的手腕，这份信任令他松快许多。井宅里守了八十年的柳十岁察觉顾清行迹反常——白天擦洗、书房久留、话语太多——留小荷吃饭，自己跟踪而出。皇宫广场上平咏佳逼出比百年前更凝实的剑意，初子剑应召离鞘悬于其身前，景尧不安却被阿飘劝住。顾清背着布裹的宇宙锋，穿过死灰复燃的棋摊长街，走进七百年前首届梅会所在的旧梅园，绕梅林一周布下阵脚，才拾阶敲响小庵的门。庵内青烟缭绕，红衣少年含笑而坐，顾清认真行礼：见过师伯。"},{"n":637,"orig":637,"title":"诛仙剑阵重现","people":["顾清","阴三","平咏佳","柳十岁"],"one_line":"顾清以弗思剑索锁阴三，四剑合布诛仙剑阵","summary":"阴三验看第一件事的成果——顾清的信已叫停朝廷与三大派在青山大会施压的布置。他递出纸条安排第二件事，顾清摇头拒绝：节奏不对，一旦接受便再无法摆脱，日后会对元曲他们生出恶意。话音未落，腕上弗思剑化作剑索缚住阴三左手，梅林脚印中的承天剑阵同时激活。阴三先惊后笑，点破顾清连死都不怕、却怕连累狐妖太后，又自陈精通九峰真剑与承天剑法、最擅九死剑诀，以青山剑阵杀他形同笑话。他骨笛生出无形小剑刺向顾清眉心，宇宙锋横挡，顾清喷血挥剑拍落，初子剑与不二剑破窗而入，平咏佳的剑意自皇城铺来，四剑成阵——百年前斩杀白刃的诛仙剑阵重现。"},{"n":638,"orig":638,"title":"青山大会又开","people":["顾清","阴三","方景天","广元真人","赵腊月"],"one_line":"顾清血书引皇城大阵困敌；青山大会方景天胜出","summary":"阴三枯坐挥笛，以九峰真剑的精妙挡下神末峰众人全力合击，一口气便在顾清右肩贯穿一洞。顾清蘸血书符，皇城大阵携山岳之威压向旧梅园——他自始至终没想斩断阴三的手臂，因为断就是离；他把选择交给对方，阴三果然选了先杀人再离开，给了大阵启动的时间。而诛仙剑阵护的竟是顾清本人，地上血线又把他的脚缚死，令阴三无法挟他同走，他要的是同归于尽，至少废掉阴三一臂。青山天光峰上，方景天与广元真人在虚境剑争分出胜负，广元归队认负，青山再无人有资格与方景天争掌门之位，重伤初愈的赵腊月立于峰顶另一端，大战将起。"},{"n":639,"orig":639,"title":"夕阳无限好","people":["方景天","赵腊月","卓如岁","雀娘","鹿国公","元曲"],"one_line":"方景天剑争胜出欲继位，赵腊月卓如岁当场发难","summary":"方景天胜过广元真人，正欲坐上掌门之位，清风忽至，椅子自行倒下摔碎——卓如岁举手认账，称出关那天太高兴不小心弄坏的。赵腊月漠然发难：他还没死呢，再说他连承天剑都没有，有什么资格做掌门。卓如岁举着手起哄，两大破海巅峰同时反对，昔日长辈纷纷倒向天光峰，声望尽归神末峰。镜宗雀娘以先生之谊质问青山何以如此待景阳，鹿国公搬出朝廷颜面，果成寺与悬铃宗相继质疑，方景天淡然回应：这是青山宗的事，只有青山人可定青山事，通天剑意如梅枝铺展。碧湖峰顶阿大朝天光峰喵呜一声，满天剑意切碎的阳光化作假晚霞，吞舟剑飘至卓如岁身前。"},{"n":640,"orig":640,"title":"不让近黄昏","people":["顾清","阴三","柳十岁","玄阴老祖","井九","苏子叶"],"one_line":"顾清柳十岁死战不退，沉睡百年的井九睁眼醒来","summary":"皇城大阵如山压向旧梅园，柳十岁欲援却被诛仙剑阵剑意所伤；阴凤赶来被禅子以光镜定在空中，柳十岁遂遁地直取城西，凭一茅斋正气与管城笔力战手握还天珠的玄阴老祖，苏子叶赶来吞鬼火相助，柳十岁更以管城笔使出承天剑法，又令苏子叶放火、挥扇扇出两片火海对峙。旧梅园已成废墟，顾清骨断七根、七窍流血，仍握剑索撑着诛仙剑阵死守，不许阴三越雷池一步。阴三叹这群年轻人可爱却都是井九的弟子，终于动了：血影凝剑，无声刺向顾清眉心。就在此时，沉睡一百零一年的井九在井宅睁开眼睛，如平常般起身，问青鸟：在哪里？——旧梅园。他随即消失。"},{"n":641,"orig":641,"title":"天地生大物","people":["井九","阴三","顾清","柳十岁","玄阴老祖","阴凤"],"one_line":"井九破诛仙剑阵战阴三，夺还天珠破境通天","summary":"诛仙剑阵被破，井九现身旧梅园与阴三手指相抵，二人神识交谈：井九称等了十七年，沉睡正是为等阴三施展羽化真本事、真正来到人间时再醒。二人再战，井九夺皇城大阵，把顾清掷向皇宫；阴三左臂断脱，化作红鸟遁走。井九化作剑光钻入玄阴老祖腹中将其重创，夺回还天珠；阴凤救走玄阴老祖，井九亦负伤，收起飘落的黑羽。朝歌城落雨，井九把夺来的骨笛吹净血线后交给柳十岁。碧空现出无数剑痕，天地生大物——井九沉睡百年，就此破境通天。"},{"n":642,"orig":642,"title":"你我皆通天","people":["赵腊月","方景天","南忘","卓如岁","元曲","井九"],"one_line":"井九破境异象传遍天下，南忘亦通天退方景天","summary":"天光峰顶，赵腊月不出剑而败于通天境的方景天，此前卓如岁抢先出剑败得更干脆；元曲正准备接着车轮战拖住方景天，天空忽然裂开云层，显出十余道蓝色车辙——天地生大物的征兆。云行峰万剑伏首，清容峰剑弦升空与北方剑意相连，众人确认井九在朝歌城醒来并晋入通天。刚破境的南忘踏剑弦而来，问方景天还争不争掌门之位，方景天遂回昔来峰。南忘问赵腊月为这个男人值得吗，她答在我眼里他就是他。井九携柳十岁入朝歌城，万民敬畏，回井宅向禅子道辛苦；禅子不愿见他，动身去白城。"},{"n":643,"orig":643,"title":"不能入宫的理由","people":["井九","禅子","柳十岁","顾清","胡太后"],"one_line":"井九还乡叙旧议大事，胡太后夜探顾清","summary":"井九回到井宅，井梨跪哭——他心丧若死修行荒废，百余岁便苍老不堪。井九摸了摸柳十岁的头，让他回一茅斋，说布秋霄那边快了，是好事。井九寻禅子喝茶，禅子感叹他运气真好：此世借万物一转剑生，破境需海量灵气，全靠朝歌城一役杀白刃仙人分身、夺仙箓仙气才得通天。井九想解决元骑鲸的问题，禅子劝他莫执念。井九定下顺序：先解决太平真人，再解决中州派，然后安心修行；禅子担心他飞升所需灵气世间难足。禅子去白城坐镇，井九送行后到赵园看星星，迟迟不进宫。皇宫里，胡太后深夜来看养伤的顾清，问他就这么想死吗。"},{"n":644,"orig":644,"title":"在一起，在一起","people":["顾清","井九","胡太后"],"one_line":"井九进宫宽解顾清，情爱选择无需问对错","summary":"顾清敢攻击太平真人，是因私情被对方拿作把柄逼他祸害青山，他索性提前告知禅子与元师伯设下险局。数日后井九终于进宫，顾清跪地请罪，坦白与胡太后私情及百年朝堂黑幕，井九却说这些你都对我说过了——原来他沉睡中一直能听到顾清夜夜倾诉。井九说他心机深并无喜恶，但遇这种小事便想死实属愚蠢；男女情爱无关对错，能承担后果便好。对甄桃一事，井九让他能瞒则瞒，瞒不住就直接说让她选。顾清顿悟自己与胡太后此刻就在皇宫，已经在一起，那就是在一起。胡太后则跪在殿中等井九来杀。"},{"n":645,"orig":645,"title":"吃着火锅，打着麻将……","people":["井九","元骑鲸","胡太后","雀娘","顾清"],"one_line":"元骑鲸续命百年油尽，麻将火锅后化雪而逝","summary":"井九向胡太后解释不会杀她：神皇临终所托并非防她秽乱宫廷，而是知道狐妖情深，怕她随他而去，当年让顾清进宫教景尧便是铺垫，望她再喜欢一个人、开心活着。胡太后泪落。井九随后去偏殿见元骑鲸——他靠青山秘法强行续命百年，失去所有感受、神魂日夜冲突，只为等井九醒来坐镇朝歌，如今只剩一天寿数。井九唤来胡太后与雀娘陪元骑鲸打麻将，顾清做火锅，牌局持续一日一夜。元骑鲸终于做成九莲宝灯，笑道你们一直都在唬弄我，说这几百年也算开心，随即走出殿门，在晨风里化作满天雪，安然离世。"},{"n":646,"orig":646,"title":"重回人间，为君开锋","people":["井九","赵腊月","禅子","曹园"],"one_line":"井九携赵腊月重游旧地，为刀圣曹园开锋","summary":"元骑鲸逝，朝歌城反常落雪三日。赵腊月来朝歌迎回剑律大人的肃杀与干净，南忘留在青山伤心。井九与她重游三千院，在李公子坟前凭吊，碑上刻着殊途同归；赵腊月猜李家古画里的撑伞姑娘便是数百年前的连三月。庵中白早仍在沉睡，此地正是连三月离去之处，赵腊月抱住井九说我不走的。二人去白城见何霑与瑟瑟，途中井九论情爱不过是吸引、亲密与承诺。果成寺里，当年修闭口禅的年轻僧人已成中年，师父圆寂，他一见井九痛哭，井九一掌为他灌顶。最后二人上红崖小庙，井九以掌心生火，为刀圣曹园那柄带缺的铁刀重新开锋。"},{"n":647,"orig":647,"title":"初露","people":["井九","赵腊月","曹园","何渭"],"one_line":"井九与曹园切磋，居叶城外一剑斩何渭右臂","summary":"铁刀开锋后清亮如新，刀圣曹园道谢。井九以百年领悟的新剑意与曹园刀意在庙中切磋，胜负无人知晓，井九出来时脸色苍白、耳垂带血。赵腊月说自己终究是自己，井九叹生死之间有大物，也许你是对的——二人道不同，但能同行一段已是福分。二人到居叶城得知：昆仑派击败风刀教夺得冷山控制权，掌门何渭出手狠辣，背后有中州派影子；他因惧怕赵腊月寻仇，急于替中州派办差表诚意。何渭在烈阳峡旧址布阵时察觉杀意抢先出剑，剑光却如雪遇阳消融，井九现身数里外空中，一剑斩落他的右臂。"},{"n":648,"orig":648,"title":"总有很多事逃不掉","people":["井九","赵腊月","谈真人","苏子叶","何渭"],"one_line":"井九斩杀昆仑掌门何渭，冷山火脉还玄阴宗","summary":"井九连斩何渭四肢，其头颅落地，逃向荒山的剑鬼被赵腊月指点碎；苏子叶现身领命，井九当年允诺帮他重建宗门，冷山火脉物归原主，风刀教与朝廷暗中支持。二人入地底看过火鲤，谈真人现身质问，井九说要替元骑鲸完成打掉中州派的心愿，二人对视而散。如今青山已有四位通天大物、破海上境十一人，中州派百余年内无新大物，只剩谈白二真人、麒麟与两张仙箓。井九当众杀何渭震动天下。景园火锅正酣，井九忽然升空，雷电绵延如剑光，童颜见了收起棋盘，说自己要出去走走。景园外忽响起雷鸣般的敲门声，众人推诿谁去开门。"},{"n":649,"orig":649,"title":"凭什么？","people":["南忘","井九","平咏佳","阿大"],"one_line":"南忘与井九对饮，井九道破太平当年恶意","summary":"平咏佳开门迎进南忘，她质问井九凭什么破境比她还快。南忘取出小酒壶与他对饮，井九说对他来说连三月走了没多久；南忘说他懒且怕死却多次为人拼命，说明喜欢的还是她，井九答我都喜欢，当年不许她喜欢自己，是因都喜欢便都不要喜欢，太麻烦。南忘劝他别再针对太平真人，井九道破：当年太平教他烟消云散阵时动了手脚，从一开始就没打算让他飞升，这是修道者最大的恶意。南忘声明不参与恩怨，但师兄们走了她要看着青山，谁也别太过分，随即踏剑弦离去。白鬼大人阿大来访，井九撸猫，取出瓷盘细沙，拈沙入盘画成天地。"},{"n":650,"orig":650,"title":"一盘散沙","people":["井九","赵腊月","阴三","阴凤","玄阴老祖"],"one_line":"井九散沙推演誓战太平，摘掌门画像","summary":"井九以难以想象的空间构造力让一盘散沙化作江山图，这是他推演天下的手段。赵腊月看懂了：他如今只需足够时间便能飞升到足够远的地方，不由落泪；井九安慰还早，把百年前她剪下的辫子还她，她用剑火烧掉，决意同回青山。众人经云集镇、南山门回宗，井九在小楼看历代掌门画像，指着太平真人与景阳两幅说都摘下来，过些天他与太平之间谁死了再挂回去。另一边，商州农家院里，阴凤怨愤井九气运太好，玄阴老祖自叹老了，阴三左臂竟已复原如新，蹲在树梢日日砸老鼠，谁也猜不透他在想什么。"},{"n":651,"orig":651,"title":"光说不练，那是假把式","people":["阴三","井九","赵腊月","玄阴老祖","广元真人"],"one_line":"阴三访柳词故里学种田，井九归青山受拜","summary":"阴三夜里驱石子飞出数百道线条复盘败局，认为西海遇童颜、朝歌城遇连三月与井九醒来皆是运气，若井九这一世气运始终不散便是气运，他想知道井九这一世到底怎么过
