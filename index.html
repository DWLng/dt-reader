的。他重回云集镇吃火锅，偷走顾家马车，寻到柳词祖籍的小山村——柳词为让幼弟后人避祸安置于此，柳家如今已成州府大户。阴三向老农打听后，请对方教他种田，自称想学学真把式，事后抹去对方记忆。同时井九携众回青山，洗剑溪畔满山弟子恭迎掌门真人归山，广元真人行礼称师叔，又郑重改口拜见掌门真人。"},{"n":652,"orig":652,"title":"回青山便是战","people":["井九","方景天","赵腊月","广元真人","金思道"],"one_line":"井九归山直上昔来峰，与方景天赴隐峰死战","summary":"井九归山受各峰行礼，南忘与方景天未现身；新任云行峰主金思道神情冷淡，井九随口说那就你来好了，暗示让平咏佳接任，举座震惊。他不回神末峰，径直落上昔来峰找方景天，广元真人等苦劝莫让青山内耗给中州派喘息之机。赵腊月点破：当年众人不认他是师叔，只因他不够打；如今认了，是因为他能打——既然如此，今天怎能不打。方景天称已等他很久，二人同赴上德峰，经剑狱进入隐峰。作者在后记里谈及家人间的传承，并为删减方景天笔墨致意。"},{"n":653,"orig":653,"title":"野花深处，大戏开场","people":["井九","方景天","南忘","赵腊月","尸狗"],"one_line":"井九方景天入隐峰死战，众弟子押注观战","summary":"隐峰只有一条进出通道，由尸狗镇守，井九与方景天入内便是真正的死战——输了便只能永困其中，或者飞升。方景天拾起野花深处的竹笛，野花随之凋零；他自述当年不知井九身份时曾想收其为徒，又道我想你死，随即施展七梅剑诀，一枝梅剑意贯穿天地。天光峰顶众人只能遥望，元龟驮的石碑簌簌落尘，如战鼓般令人不安。南忘本想暗中打断这场战斗，却因隐峰封路无法入内，只得丧气提议下注看戏；赵腊月率先押上弗思剑，赌井九胜。"},{"n":654,"orig":654,"title":"吾于青山真无敌","people":["井九","方景天","阿大","尸狗","赵腊月"],"one_line":"弟子尽押井九必胜，阿大偷袭被尸狗按住","summary":"赵腊月把弗思剑押在天光峰上，元曲押无名怪剑，平咏佳押一块饼，卓如岁只摸出一片金叶子；参与赌局的弟子竟无一人看好方景天，因为景阳真人从未输过，井九同境无敌。夜里元龟睁眼吞食一片星光，望向隐峰露出恼火与痛意。隐峰内剑光彻夜交错，满地沟壑，数十座山峰被毁。阿大潜入想偷袭方景天助井九一臂之力，刚要跃起便被尸狗一爪按住——尸狗决意不插手这场争斗，也不许它插手，还叼着它去了埋葬历代破境失败者的石山。"},{"n":655,"orig":655,"title":"谁是真的了不起？","people":["井九","方景天","雪姬","南忘"],"one_line":"方景天败困隐峰，井九与雪姬约定互换","summary":"数日激战后剑光停歇，井九把竹笛插回土中，野花重新开满山野；方景天重伤躺在花海里，剑丸碎裂、剑鬼涣散，需两百多年方能复原，除飞升外永世困于隐峰。井九出隐峰途中在剑狱通道停步，与囚室中的雪姬对视，双方约定互换，井九请她过些天帮忙，也是帮她自己。他现身天光峰顶，确认方景天未死，全峰之人拜见掌门真人；井九吩咐赵腊月，云行峰主由平咏佳接任。井九返神末峰，隔绝峰顶的剑阵消散，万千剑意向天地张扬。"},{"n":656,"orig":656,"title":"什么事情都得平","people":["平咏佳","金思道","井九","顾清","赵腊月"],"one_line":"平咏佳无形剑体胜金思道，接掌云行峰","summary":"平咏佳被指定接任云行峰主，金思道不服质问凭什么，他硬着头皮提议打一场。他以无形剑体两度瞬息近身制住金思道，第二次连对方召出的名剑皆空都未及出招，金思道交剑认负，愤然离去；平咏佳却连自己如今什么境界都答不上来，赵腊月赞他很不错。数日后顾清从朝歌城赶回，向井九汇报青山赏罚、中州派对朝廷分配生怨等事务，井九对这些琐事毫无兴趣。随后井九随口问顾清：你那边的事情平了没有？顾清握着茶杯的手顿时僵住。"},{"n":657,"orig":657,"title":"亲爱的，不要走进那条河","people":["井九","顾清","阴三","玄阴老祖","阴凤"],"one_line":"井九嘱顾清瞒住情事，阴三言明欲灭世","summary":"顾清对甄桃的事说不出口，井九让他继续瞒着，能瞒到死或飞升最好，又嘱他筹备掌门就位大典。赵腊月问两件事先办哪件，井九答中州派在他与太平分出生死前不会动手，所以先办太平真人。另一边，阴三在山村劳作多日，悟出井九甘做凡人之事是想走另一条河流，自己不该随之而动忘了自己的河——他修他的道，我灭我的世。他自言七百多年前第一次下冥，准备多年，不信井九真能算尽一切。夜里柳族祠堂正对通奸的寡妇与佃工用刑，阴三望着夜空喃喃：得道者多助失道者寡助，我算得道者还是迷途者。"},{"n":658,"orig":658,"title":"顺我者亡，逆我者亡","people":["太平真人","阴凤","玄阴老祖","柳十岁","赵腊月"],"one_line":"太平真人屠柳词故里满村，留战书后失踪","summary":"阴三点破支持灭世者少的原因：不能飞升的修道者都留有血脉后代，柳家祖上正是柳词幼弟。他弹出一颗石子穿透门板与祠堂匾额，击穿柳老太爷眉心；石子不停飞出，柳氏满村老幼尽数倒在血泊。他背起玄阴老祖离去，自言从今不再是阴三，他就是太平真人——那条大河，顺我逆我都要亡。柳十岁数日后赶回，面对亲族尸骸悲愤难抑；赵腊月说三名通天同行无人能杀，柳十岁称这是一封给公子的战书。血案传遍大陆，青山与朝廷合围搜捕，太平真人却消失无踪。翌年春天大风起，各派与朝廷代表齐聚一茅斋——布秋霄即将成圣。"},{"n":659,"orig":659,"title":"恨不能孤家寡人","people":["太平真人","柳十岁","任千竹","小荷"],"one_line":"太平真人谋划毁冥界屏障，夜访柳十岁","summary":"布秋霄即将成圣，天地先现大风与荷花早开等征兆；中州派遣任千竹前往一茅斋贺喜修好。一只红鸟逆风而落，与任千竹交谈——任千竹原来也是不老林的人，当年越千门行踪泄露被杀便因于此。红鸟正是太平真人所化，他要寻火鲤毁去人间与冥界间的屏障；又计划在布秋霄成圣时伤其本体、夺圣人之气，破掉一茅斋镇压冥界通道的阵法，借大风把冥河火焰尽数点燃。他夜访柳十岁所在的客栈，柳十岁手握管城笔与不二剑却不敢出手，恨不能孤家寡人，终究放下了笔与剑。太平真人对小荷笑道：那年烦你带我去摘莲，还未谢你。"},{"n":660,"orig":660,"title":"百年结果","people":["太平真人","柳十岁","小荷"],"one_line":"太平真人夜宴柳十岁，道明来摘因果之果","summary":"太平真人坐下来与柳十岁叙旧，从白如镜与景阳两条线上论师祖名分，柳十岁只答我打不过你。太平真人让小荷去做饭，席间点破浊水底的鬼目鲮、妖丹与血魔教秘法都是他当年布置的手段，西王孙诱叛青山也是他的安排；他自言观柳十岁与自己相似，一直想让井九最看重的传人变成自己这样的人，还欲杀赵腊月，因她像第二个井九。柳十岁答公子从不会要求自己做什么，只让自己做选择，并相信公子所说自己比他们两个都强。太平真人最后道明来意：当年浊水底的妖丹与秘法是因，今天便是来摘你这只果。"},{"n":661,"orig":661,"title":"一朝入魂","people":["柳十岁","太平真人","小荷","奚一云"],"one_line":"太平真人以两心通袭柳十岁，被骨笛惊退","summary":"太平真人与柳十岁席间长谈后骤然发难，小荷拼死以狐尾搏命一击，被红羽钉在墙上；柳十岁惊觉右手已被对方的两心通控制，遂咬破舌尖以心血催动古赋挡住其视线，又命不二剑斩向自己以破局，危急关头井九所赠骨笛自行飞出，太平真人竟生畏惧，化红鸟遁走。柳十岁带重伤的小荷闯入千里风廊赶到一茅斋，向奚一云报告：太平想用两心通控制他的心神，疑与布秋霄成圣有关。奚一云让小荷留在斋中休养，仍按原计划让柳十岁去青山参加掌门大典，再三叮嘱小心。"},{"n":662,"orig":662,"title":"世界毁灭之前","people":["玄阴老祖","讲经堂首座","阴凤","白真人","谈真人"],"one_line":"太平爪牙分头破通天井与血祭，白渊请仙","summary":"玄阴老祖潜回果成寺，发现讲经堂首座也是太平真人的人；二人同往东海畔通天井，与一名水月庵师太合谋，由二僧以毕生所究蚀化镇压咒阵，老祖则备运魔功自海底打破井中三十三重天。大海深处鸣泉秘境，阴凤奉命召来四海妖兽，将以血祭摆通天杀阵；遥远的海外高山上，一个巨人被啸声唤醒。云梦山里，谈真人劝阻白真人莫去青山大典，她认为只要外力足够强，因果也能打断；白真人独自入云梦深处的黑石星阵，跪请先人白刃仙人归来。"},{"n":663,"orig":663,"title":"回来吧，回来哟","people":["白真人","白刃仙人","柳十岁","井九","赵腊月"],"one_line":"白真人请白刃仙人归界，柳十岁先归青山","summary":"白真人向先人白刃仙人转达诉求：连三月已死、曹园重伤，请仙人归来镇压青山、阻止景阳再次飞升；白刃仙人以归来便再无飞升可能为由推拒，白真人坦言若仙人不归，无人能制青山，井九更将带无数天地灵气飞升，此界危矣，恳请仙人真正归来。另一边，青山掌门大典将启，柳十岁最先进山，先到天光峰访旧、砍竹，再上神末峰为井九修竹椅、煮茶，随后以不二剑切肉备火锅，神末峰众弟子到齐，好生温暖。"},{"n":664,"orig":664,"title":"故地重游","people":["柳十岁","井九","赵腊月","南忘"],"one_line":"柳十岁重游青山诸峰，秋语台遥望南忘","summary":"井九应下大典取出承天剑的门规，试穿掌门礼服后只说不喜欢，还是白衣好看。柳十岁在神末峰住了三天，随后徒步游历诸峰：访顾清修的木屋，到清容峰讨梨酿，独坐秋语台遥望峰顶的南忘，眼里满是温暖笑意，峰下少女们议论这位柳师叔满身正气，全然不像有狐妖道侣之人。崖畔赵腊月对柳十岁说，他可以走了；柳十岁答那就走吧，大道不必一直同行。赵腊月又问他走后想做些什么，柳十岁说想呼风唤雨、一瞬千里、遨游四海，还想睡在梦里、醒在梦境。"},{"n":665,"orig":665,"title":"我见青山","people":["柳十岁","平咏佳","方景天","顾寒"],"one_line":"柳十岁游遍青山九峰，隐峰石山前留遗言","summary":"柳十岁上云行峰探视闭关的平咏佳，看了很久也看不出所以然，只道真是有些古怪；又去适越峰寻到无人知晓的荒芜药园与废弃丹房，服下七叶莲与一瓶霸道的丹药。他取道昔来峰后峰看书，上两忘峰见顾寒，最后登上上德峰，经剑狱进入隐峰，隔着山石看了昏睡的方景天一眼，又踏着野花云海来到埋葬青山前人的石山前，说了一句像遗言的话：若他日身死，就把他放在这里，让青山弟子需要时来吃他一口肉。"},{"n":666,"orig":666,"title":"大典","people":["井九","柳十岁","南忘","广元真人","水月庵主"],"one_line":"掌门大典群雄毕至，各方暗手同时发动","summary":"一茅斋里小荷耳垂上的红宝石耳坠轻轻摇摆，透着诡异；大海深处阴凤驱妖兽血祭，通天杀阵渐成；东海畔二僧诵咒蚀化通天井禁制，玄阴老祖海底运功待发。青山掌门大典开幕，天下宗派齐聚，神皇景尧亲临，中州派云船携谈白二真人而至，被青山剑阵放入——世间强者云集，朝天大陆反而空虚。大泽令致辞颂井九，果成寺高僧净额，广元真人宣读柳词遗诏；井九白衣出场，柳十岁立于其左手后方，大典行至最后环节。"},{"n":667,"orig":667,"title":"还是我来吧","people":["井九","柳十岁","广元真人","南忘","大泽令"],"one_line":"井九奉承天剑鞘受拜，柳十岁忽言我来","summary":"众宾客见一茅斋只来了柳十岁，暗自议论其与奚一云的继任之争。大典最后环节，井九走到小庐前，不取剑，转身随意坐上象征掌门之位的椅子，如躺自家竹椅，随后反手取出承天——果然不是剑，而是剑鞘。广元真人、南忘与满山弟子拜倒，各宗派修行者齐齐行礼，连谈真人与雾中白真人也微微欠身。唯独柳十岁自始至终没有动，等所有视线聚来，他掸了掸衣裳上前一步，看着井九说出一句与百余年前井九一模一样的话：还是我来吧。"},{"n":668,"orig":668,"title":"天衍四九，人遁其一","people":["太平真人","井九","柳十岁","水月庵主","赵腊月","广元真人"],"one_line":"柳十岁现身成太平真人，水月庵主一掌无功","summary":"井九道破：149年前他飞升失败之时，太平真人恰从剑狱遁走，去小山村见过孩童、在云集镇酒楼假死遁走，大道五十，天衍四九，人遁其一。太平真人借柳十岁之口索要承天剑：当年他没把剑传给柳词，是景阳偷袭把他关进剑狱，论青山道统承天剑本该是他的。柳十岁一笑变作太平真人，满场惊呼魔头，几名青山长老却跪呼掌门归来。井九松手，承天剑鞘悬在两人之间；他示意青帘小轿，水月庵主一掌想把太平从柳十岁体内打出，却只令对方溢血、自己负伤退回。太平讥讽：同样的方法你在朝歌城用过，还想再用一次？"},{"n":669,"orig":669,"title":"争青山","people":["太平真人","井九","平咏佳","大泽令"],"one_line":"师兄弟争承天剑阵枢，剑峰万剑自相残杀","summary":"果成寺高僧点破手段是两心通；太平真人坦言当年浊水底的妖丹便是因，如今来摘果，还服过补天丹与七叶莲，不在乎柳十岁这具身体的存灭。不二剑自柳十岁腕间飞出偷袭，被太平两指夹住弹进剑峰山崖。剑峰群剑受承天剑召唤引发混战，平咏佳在洞中沉睡，被剑意波及耳中流血。众人至此确认青山剑阵的阵枢就是承天剑，井九与太平争剑便是争剑阵与万物一的所有权；大泽令祭八方风雨幡助战，被青山剑阵削断幡角。最终青山剑阵罩住崖畔二人，剑意凌厉，群峰崩裂，大阵青光摇摇欲坠。"},{"n":670,"orig":670,"title":"大海落冥界","people":["童颜","冥师","太平真人","井九","阴凤"],"one_line":"海水灌入冥界成火海，太平灭世之局揭晓","summary":"广元真人劝阻无效，太平真人直言毁灭旧世界的感觉很美妙。大海深处妖兽相继跃入大漩涡化作血雾，凝成血魔教从未摆成的通天杀阵；海外巨人忧虑地抱着木棒走向大海。冥界里，冥师借童颜之助围困大祭司残部，此刻天穹撕开，无尽海水从天而降灌入冥河，燃成火海，大祭司军队灰飞烟灭。童颜终于明白：这是太平真人的灭世手段，毒烟将杀死所有普通人——他要建立只有修行者的世界；冥师自承是真人的学生，童颜第一次感到恐惧。"},{"n":671,"orig":671,"title":"天地为炉","people":["童颜","冥师","布秋霄","玄阴老祖","小荷"],"one_line":"毒雾入世计划启动，红羽割破布秋霄手指","summary":"冥师向童颜交底：血祭改道引海水入冥为柴，风廊灌风助燃冥河为火，通天井为烟道，天地为炉炼化众生，毒烟将杀尽普通人。千里风廊里，小荷耳垂上的红宝石耳坠化作红羽，穿过一茅斋阵法飘入布秋霄书斋，在他右手食指割出细口；一滴血珠散作血雾升空，大风被染红，风向逆转倒灌，镇压冥界通道的石钟山迅速崩解。东海畔玄阴老祖一掌轰破通天井六重天，冥界青烟升起，海龟触之即死。童颜以景云钟重伤冥师，身怀中州派的景云钟与千里玺遁走。"},{"n":672,"orig":672,"title":"看那边洪水滔滔","people":["太平真人","井九","南忘","谈真人","童颜"],"one_line":"太平真人当众道破飞升真相与灭世逻辑","summary":"童颜再敲景云钟后力竭，危急中凭袖中宝物遁走；冥师惊疑他为何身怀中州派的景云钟与千里玺。青山崖畔，太平真人宣告世界正在毁灭，冥河将入人间；又当众阐述飞升真相：飞升者去的是陌生寒冷近乎死寂的世界，那里有极强大的存在；此界无外界灵气补济，飞升者一人带走海量灵气，终有一日屏障崩塌、雷域化虚，天地暴露便会瞬间毁灭；被问及白刃仙人是否守在外界猎杀飞升者，谈真人始终沉默。南忘茫然发问师父为何如此，太平只说凡人迟早会死。井九想起自己曾见数万飞剑燃火穿行星域，果成寺老僧亦提起禅宗古经里域外天魔的说法。"},{"n":673,"orig":673,"title":"当世界要毁灭的时候，他出了一张牌","people":["太平真人","井九","赵腊月","卓如岁"],"one_line":"太平道尽灭世逻辑，井九捏碎阴凤命牌","summary":"赵腊月追问域外天魔为何不曾杀来，太平答有屏障或灵气太少。他继而抛出改造世界的方案：杀尽凡人，让天赋较差的修行者操持俗务，不足便多生、再生下不能修行的再杀——卓如岁冷眼逼他把这答案说尽，满场震骇，这正是否少数百年前青山巨变的真相。井九直言其想法做法皆属白痴，太平则解释早已改动烟消云散阵，欲让天下修道者连结灵脉同时飞升以求生路。井九说世界是活的，要毁它时总会有人站出来；太平讥无人可站出，井九摊开手掌，露出一块刻着锦鸡的幺鸡竹牌——阴凤的命牌，随手捏碎。"},{"n":674,"orig":674,"title":"有圣人出","people":["布秋霄","青鸟","奚一云","禅子","曹园"],"one_line":"青鸟叼走红羽，布秋霄舍成圣以血封山","summary":"太平布局数百年自认算无遗策，却算不到所有人。一茅斋上空血风狂啸，一只青鸟自天而落，从断莲间叼走那根红羽，风势顿减；书生们以符纸刻字封堵石钟山裂缝，纷纷吐血倒地。布秋霄在神游将成圣之际感知天地剧变，毅然醒来，御风至石钟山，以指血在崖壁上书写封堵。眼看血迹将被吹散、成圣就此错过，崖壁血迹忽然亮起，庄严如朱笔，封住缝隙——布秋霄以舍弃成圣之心反而成圣。白城小庙里，禅子以光镜联通雪国女王，刀圣曹园出言许诺，随后那只满是伤疤的手握住了铁刀刀柄。"},{"n":675,"orig":675,"title":"举起铁刀，睁眼成圣","people":["曹园","童颜","玄阴老祖","阴凤"],"one_line":"曹园提刀离庙，佛睁眼举刀于大海成圣","summary":"白城小庙里，曹园提刀只说去去就来，血色山崖垮塌，一道巨大身影破空而去。东海畔，通天井三十三重天将尽，童颜借千里玺从井中逃回，摘下崖壁上殷红的「解」字，先击杀打开禁制的水月庵师太，又挡在讲经堂首座身前，直面玄阴老祖杀来的魔焰。大漩涡上妖兽血祭不止，阴凤主阵正自得意，天空忽然破开，一尊漆皮斑驳的巨大金佛破空而落，稳坐漩涡中央；面对漫天血煞，佛像睁开眼睛，抬手举起铁刀——佛举起刀，便成了圣。"},{"n":676,"orig":676,"title":"血海钟声","people":["曹园","阴凤","童颜"],"one_line":"曹园现出金佛真身，血海屠妖如钟声","summary":"童颜所说被低估的人正是刀圣曹园——小庙金佛即他本人，心怀天下勇绝无双故而为佛，提刀而战便是刀圣。大漩涡里曹园挥刀如飞雪，无数妖兽化作血肉坠向深渊，杀戮之众更胜当年柳词浊水一夜。阴凤讥他杀得越多血祭越强，问他一个最强者为凡人赴死是否值得；曹园握刀插地轰碎来犯妖兽，答这不是值得与否的问题，是我的问题——这样的我才是我，不然我就死了。他浑身浴血如一尊血佛，自白城跨越数万里而来，连井九都做不到。"},{"n":677,"orig":677,"title":"真的打不过","people":["曹园","阴凤","井九","巨人"],"one_line":"阴凤现真身战曹园，被命牌与巨棒连击","summary":"阴凤驱通天杀阵之力碾压曹园，曹园以佛文光圈硬受，继而出言激它：杀掉主阵者可破阵，杀死世间最强的我便是你唯一的机会。阴凤借血祭染红全身、翼展百丈扑向大漩涡；曹园双手握刀，它正自快意，神魂深处却传来青山方向的极致痛楚——井九留着的命牌碎了，当年朝歌城留下的那根尾羽精血被封回牌中。阴凤泣血厉啸「景阳你这个骗子」，挣扎欲遁，半空一根数十丈粗的巨树棒把它砸飞天涯。曹园感慨：景阳没骗人，他说不用担心你，便真的不用担心。巨人落在海面，俯视小佛，试探着喊了声阿加。"},{"n":678,"orig":678,"title":"海上与海外","people":["巨人","曹园","西来"],"one_line":"巨人以雷魂木止血祭，西海剑神将归来","summary":"巨人接管大漩涡，一掌将曹园掷向朝天大陆；他自己踏入杀阵如挠痒，从漩涡底摸出一根沉底多年的神木，随手把扑来的妖兽尽数击飞到天边，断绝了通天杀阵的血祭之源，又走向漩涡中心欲堵海水。原来大漩涡的海水经天地通道流向遥远的别处，出口之一便在极北冰川之下。另一座无名大陆上，海上之海凭空消失，独臂的剑圣立于沙滩，对教廷骑士自报名号——西来。他说自己终于要从南边回去了，一道闪电杀死挑衅的骑士首领与牧师，随后剑光破空，自海上消失，赶赴朝天大陆。"},{"n":679,"orig":679,"title":"肥天下","people":["曹园","玄阴老祖","童颜","西来"],"one_line":"通天井全通，曹园化作大佛堵井吞烟","summary":"西来破空赴大陆。东海畔童颜借玄阴老祖魔功反杀讲经堂首座，自己也身负重伤；老祖一掌震通通天井三十三重天，青烟涌入人间，走兽飞鱼触之即死。危急时刻虚境裂开，一尊大佛不偏不倚落在通天井口，将毒烟尽数挡住、吸入腹中——正是从大漩涡赶回的曹园。玄阴老祖打量这尊胖佛吐槽刀圣怎么如此能吃，曹园老实解释：朝廷配额、教派供奉、寺里香火都进了肚子，不吃胖些、体量大些，根本扛不住雪国女王陛下那一身力气。"},{"n":680,"orig":680,"title":"我站的比你们都高","people":["井九","太平真人","曹园","玄阴老祖"],"one_line":"井九早布后手：赠仙气教魂火之御予曹园","summary":"玄阴老祖得知曹园伤愈的真相：井九去白城赠了他体内仙气，又传他魂火之御，金身可御魂火，故能今晨离庙、经鸣泉秘境瞬息万里连破两处危局。青山崖畔对峙依旧，井九言一个人可以战胜一个世界，却难以毁灭这个活着的世界；太平叹终究还是让你用了阴凤命牌，又问井九为何不肯信他的道。井九答：你就是洪水，曹园才是治水的人；太平惊觉井九早把魂火之御传了曹园，问他难道不想飞升了，井九说正是想着飞升之后的事才去见了他——他还见过另外一个人。"},{"n":681,"orig":681,"title":"捂着耳朵，雷还是会鸣","people":["曹园","玄阴老祖"],"one_line":"曹园一刀斩杀求死的玄阴老祖","summary":"曹园修成金身、得景阳仙气与魂火之御，已是世间最强者，劝玄阴老祖放下屠刀修成金身。玄阴坦言自己真信太平真人的说法：正邪灵脉不公，他更怕无法飞升、黑夜将至的死亡恐惧，才钻进地底躲避青山剑阵数百年，出关后甘愿为太平做狗，屡想反噬皆失败，想借灭世战胜恐惧。他请曹园举刀助他战胜恐惧，刀光落下，他如捂耳怕雷的孩子般被斩，临死仍追问雪国女王到底有多强，曹园只嘱咐他捂紧耳朵，小心手按紧些。"},{"n":682,"orig":682,"title":"闭上眼睛，天还是会黑","people":["曹园","玄阴老祖","井九","太平真人","卓如岁"],"one_line":"玄阴老祖授首，曹园入冥界救人","summary":"玄阴老祖临死仍想弄明白曹园这等强者为何总打不过雪国女王，曹园劝他省些气力，闭目受死，一刀将其连眉心血线彻底斩灭，黑雾火焰在海面凝成巨佛又瞬息散去。曹园以命就是命为由入冥界救人，此时冥界青烟肆虐、海水狂风灌入，冥师疑心有异，巨佛当空落下。天光峰上，太平质问井九把仙气给了曹园还有何自信飞升，井九答修道千年不会浪费，两人自认飞升等闲事，卓如岁在雨中大叫，催太平快点认输。"},{"n":683,"orig":683,"title":"她想","people":["井九","太平真人","赵腊月","卓如岁","顾清","元曲"],"one_line":"青山众剑破阵开缝，赵腊月潜入搏杀机","summary":"太平自言即使处处落败，只要胜井九夺得青山剑阵仍可翻盘，青山因两人相争面临毁灭。井九身轻如烟，与太平各执承天剑一端，剑阵感应收紧。卓如岁跳着高喊催二人动手，实为同门打掩护：顾清、元曲、卓如岁、广元真人、南忘先后以飞剑攻向剑阵光罩同一处，五剑皆被震飞重创，终于裂出小缝；赵腊月借后天无形剑体潜入阵中，一掌拍向太平。她心里什么都不想，只想青山依旧在，想井九活着。"},{"n":684,"orig":684,"title":"天地一声哮","people":["井九","太平真人","赵腊月","尸狗","卓如岁","柳十岁"],"one_line":"赵腊月重伤，夜哮一哮止战，二人入剑狱","summary":"骨笛剑意重伤赵腊月，井九以幽冥仙剑挡在她身前，与太平同时握住承天剑，青山剑阵压缩愈急，群峰将毁。过南山欲以死相谏，卓如岁破口大骂二人难看；柳十岁凭两心通操控管城笔写下劝言。忽然一声响彻天地的哮鸣止住一切，青山镇守夜哮现身，师兄弟被引至剑狱深处通往隐峰的通道，沿途囚徒惧极噤声，一名邪道妖人误以为要杀己而冲出，瞬被剑阵绞成尘粒。太平行至关押雪姬的囚室外，井九说道：那就麻烦您了。"},{"n":685,"orig":685,"title":"扑扇","people":["井九","太平真人","阿大","柳十岁","雪姬","尸狗"],"one_line":"阿大抓破两心通，太平现羽化真身","summary":"井九欲放囚室中的雪姬为外援，须解千里冰封。一直藏在袖中的白猫阿大扑出，抓伤太平握剑之手，太平以朱红扇将其击伤震飞，扇面残片燃烧，红鸟落地化作红衣少年——太平弃柳十岁之躯现出羽化真身，妖猫之血破了控制柳十岁的两心通。阿大重伤退出战局。柳十岁醒来发现自己在剑狱囚室，雪姬告知约定：景阳解除千里冰封，她出手一次并保他性命，出手时机未到。太平命尸狗打开通往隐峰的通道。"},{"n":686,"orig":686,"title":"不同的道路","people":["井九","太平真人","方景天","阿大","尸狗"],"one_line":"师兄弟隐峰边战边论道，各走一边","summary":"隐峰中隐世长老被惊动，尸狗一声哮令其噤声，方景天与阿大、尸狗旁观这场决战。井九与太平边战边谈：太平问当年背叛之因，井九答受世间奉养千年是因果，不愿见众生枉死；又指牧羊人之说错了，修道者与凡人可生育后代，本是一类人。太平叹当年视其为继承者，井九直言大道朝天各走一边。二人隔剑将毕生剑法道法尽数施展，连镇魔狱的蚊子与骨笛无声之剑都用了出来，又以两心通对天人通论道；忽而狂风大作，尸狗神色凝重。"},{"n":687,"orig":687,"title":"青山剑阵的消亡","people":["井九","太平真人","尸狗","阿大","广元真人","南忘"],"one_line":"承天剑崩解，青山剑阵消亡，太平再败","summary":"两人都不肯松手，承天剑不堪重负，终于崩解成数百碎片，青山剑阵就此消亡，无形波动传遍天地，万物一剑从此再无对手。天光峰上元龟驮的石碑裂开，青山弟子如丧父母般哭泣，广元、南忘悲恸。井九言剑阵有无不重要，自己够强才是根本；太平也因不再执掌青山而得自由，随即化光遁走，井九追出，二人在隐峰高空以幽冥仙剑对决。尸狗暗忖灵体难敌剑体，果然高空绽开巨大火光，一抹鲜红缓缓飘落，太平输了。"},{"n":688,"orig":688,"title":"故事结束之前","people":["井九","太平真人","青儿","平咏佳","谈真人","赵腊月"],"one_line":"井九入青天鉴斩杀太平真人","summary":"太平落点正是他花几十年从青儿无心间骗出的青天鉴藏处，欲借鉴避劫；青山剑阵崩解后，平咏佳把满山失群的飞剑聚拢在身边。青儿衔来红羽，井九言必入鉴寻他，随即入鉴。青天鉴内二人皆化作少年道士，为免引发天劫同压境界，以当年青山剑法对决，井九终究技高一筹，坦言太平是输给了世界本身。太平笑叹正义的胜利千篇一律、有趣的灵魂必死无疑，身化红色光点消散。井九破空而出回到隐峰，拾起骨笛望天：太阳落山了，她要来了。"},{"n":689,"orig":690,"title":"无尽暮色里落下的一粒光尘","people":["井九","尸狗","赵腊月","南忘","广元真人","青儿"],"one_line":"太平身死天地垂暮，仙人光尘降临青山","summary":"太平真人身死，天地垂下无尽血色暮光，大陆各处皆见异象，修行界如释重负又多怅然，白真人于云端躬身致意。忽然暮色尽敛，天空最高处现出黑洞，一粒光尘缓缓飘落，威压与高妙气息笼罩大地，竟似来自雷域之上的仙人世界。青山剑阵已毁无人能挡，尸狗生出空前战意，井九嘱咐青儿留在隐峰，通往剑狱的山脉却骤然化线消失，隐峰出口被封。弗思剑与数十道青山飞剑先后杀向那粒光尘。"},{"n":690,"orig":691,"title":"这就是仙人","people":["白刃仙人","赵腊月","南忘","广元真人","谈真人","卓如岁"],"one_line":"白刃仙人真身归来，一脚踏平上德峰","summary":"数十道青山飞剑尽数被光尘震断震飞，广元、南忘、赵腊月等重伤倒地。光尘现出真容：白裙女子目光如星河，只一眼便令水月庵主吐血重伤。谈真人率众拜见——她正是千年前飞升的中州派前掌门白刃仙人，此刻归来的是真身而非分身。她落于上德峰顶，仙气令冰雪消融，随即将整峰坍缩成坚逾法宝的铁球，剑狱与通往隐峰的通道尽毁，囚徒化为粉末，卓如岁的吞舟剑也断成两截。仙人一脚，把青山踩到了脚下。"},{"n":691,"orig":692,"title":"居高临下","people":["井九","白刃仙人","尸狗","禅子","方景天","谈真人"],"one_line":"井九携尸狗破隐峰而出，直面仙人","summary":"禅子苦劝雪国女王勿南下迎战仙人，以曹园之情说服她留守雪原。冥界中曹园感应天地六动，知仙人归来，冥师惊疑中州派所图。白刃仙人当众宣示：雷域之上并非仙界而是险恶世界，景阳二度飞升将带走大量天地元气危及众生，她归来只为阻止，且不杀人，只把井九永远困在隐峰。话音未落，元龟驮的石碑碎裂，竟是隐峰另一出口：尸狗驮井九踏星光而出，方景天与三位隐世通天长老随行。井九居高临下俯视白刃：你居然真的回来了，我有些失望。"},{"n":692,"orig":693,"title":"天上地下","people":["井九","白刃仙人","尸狗","平咏佳","白真人"],"one_line":"白刃遁空被雪线追击，惊天一战开启","summary":"白刃劝井九降服、许尸狗不死，自称天上地下无人是其对手。井九不认，上德峰内部忽生裂痕并迅速崩开，白刃化作光尘以快过幽冥仙剑的速度遁上高空，一道雪线紧追而至，两股巨力相撞，光流喷射、飓风落地，白刃衣袂被削去一角，惊怒喝出孽畜敢尔。云行峰中平咏佳想重布剑阵而不得，绝望跪地；白真人于云雾中冷言井九与夜哮也非仙人对手，青山众人一时沮丧。"},{"n":693,"orig":694,"title":"雪姬","people":["雪姬","白刃仙人","井九","卓如岁","柳十岁","谈真人"],"one_line":"雪姬现身，竟是世界最强雪国女王","summary":"雪线把重伤的柳十岁掷回天光峰，卓如岁惊骇竟有人能与仙人相抗。风雪中现出的竟是个裹着旧绣被的雪人少女——剑狱中的雪姬。谈真人怒斥青山私养雪国女王之后、不顾人族安危，白刃宣告即使她母亲来也不是对手，必杀之。雪姬解下绣被，一拳轰向夜空，被仙家神通压成铁球的上德峰整个沉入地底；她的水与白刃的金光皆是血，白刃竟落下风，惊问她到底是谁。井九答：她不是女王的女儿，她就是雪国女王，这个世界最强的存在。"},{"n":694,"orig":695,"title":"银溪","people":["井九","雪姬","白刃仙人","尸狗"],"one_line":"洗剑溪化银鞭千里追缚白刃仙人","summary":"百一十八年前女王产下后代被逐出雪原，禅子出手，其后雪姬救了被烈阳幡困住的井九，被他藏于三千院后带上青山关进剑狱；世人皆以为是女王之女，唯有井九从一开始就知道她就是女王本尊，彼此心照不宣至今。此时雪姬神通虽强，白刃身为仙人却快得无从捉拿。井九抬手握向虚空，洗剑溪离谷而起化作横贯天地的银鞭，追出千里，无视仙家身法与金光，在浊水上空正中白刃脚踝。"},{"n":695,"orig":696,"title":"杀仙","people":["白刃仙人","雪姬","井九","平咏佳","卓如岁"],"one_line":"万剑重生，雪姬联手青山剑阵杀仙","summary":"银鞭捆住白刃，井九道此乃青山祖师飞升前留下的镇山法宝，目的就是杀她。白刃讥雪姬连话都不会说、不懂道法，殊不知女王早看过承天剑两眼便学会，又在剑狱借千里冰封学尽井九剑法。吞舟残剑带头，青山满山飞剑挣地而起，剑阵重生。雪姬携万剑欺近，白刃仙音与金光洞穿的只是水雾化身，真身被无数飞剑穿过，仙气如太阳般爆发四散，仙人就此陨落，天地复苏。"},{"n":696,"orig":697,"title":"飞雪","people":["雪姬","井九","尸狗","卓如岁","谈真人"],"one_line":"雪姬渡史上最强天劫飞升，永离此界","summary":"群峰死寂中人们惊觉仙人真被杀死，而寒蝉爬过雪姬脸颊裂出一道血线，似冷酷的笑。青山上下更忧放虎归山：剑狱已毁，女王又尽得青山剑法。井九亲自上前送客，点破她故意先毁承天剑、以免此剑落入自己手中；他放她离开，但要她作为她自己走，而非做他的剑。雪姬吸尽风雪与地底寒脉灵气，引来史上最强天劫，趁白刃归来的通道崩断前破空而上，雷暴竟避开通道，黑线断绝。她大笑：我再也不回来了。"},{"n":697,"orig":698,"title":"束云","people":["井九","白真人","谈真人","水月庵主","大泽令"],"one_line":"井九捆住白真人，谈真人倒戈镇杀道侣","summary":"雪姬飞升后众人犹自震撼。井九解释：她是天地创始时诞生的生命，堪称此界守护者但非人族守护者；她造出另一个自己镇守雪原，才觅得离开之机；井九当年许她一个飞升之机，如今兑现。云雾中的白真人讥讽井九步步算尽，问他接下来准备怎么办。井九突然出手，银鞭腾空将云雾捆住，宣称要把她留下。众人惊愕，水月庵主等老辈人物想起白家赘婿旧事；谈真人竟祭出血魔教遗宝十方镇妖塔，砸向自己的道侣白真人，中州派内部哗然。"},{"n":698,"orig":699,"title":"云深","people":["白真人","谈真人","井九","火鲤大王","任千竹"],"one_line":"白真人金蝉脱壳，乘火鲤入冥","summary":"白真人本名白渊，是白刃仙人的亲外孙女。云雾散尽，她真身不在青山——谈真人与井九去年在冷山密议，此刻联手镇杀她，而她早已身在冷山柳词剑斩出的地缝前，对白刃之死与道侣背叛毫无波澜，只遗憾柳词不在，临去留言：你真以为自己能算到一切吗？中州派云船上嫡系与任千竹一系几欲火并。她降至地底火河尽头，以白家秘法解开聚魂谷底隔绝冥界的禁制，火鲤大王受神魂禁制被迫载她穿越岩浆，白真人乘火鲤入冥。章末附作者更新延迟告示。"},{"n":699,"orig":700,"title":"真人已乘火鲤去","people":["白真人","火鲤大王","曹园","大祭司","井九"],"one_line":"白真人入冥布阵，大祭司暗候听命","summary":"白真人乘火鲤潜入冥界，远观曹园所化巨佛与冥师的无色之树，火鲤惊惧不敢多言。曹园察觉天降火河的异象，欲寻冥师做最后谈判，树下却已空无一人。火鲤游至冥河经过魂火窟的荒滩，冥部大祭司竟跪候于白石滩上——他败于冥师后一直听命中州派，此刻阵法皆备、青烟随时可上，并称冥师是太平真人的弟子，没有道理不助。火鲤惊觉惊天阴谋，白真人只淡淡道：人间正道是沧桑，想沧海变桑田，死些人有什么不可以。"},{"n":700,"orig":701,"title":"一夜芙蓉生红泪","people":["井九","白真人","曹园","谈真人","赵腊月"],"one_line":"中州派败退，井九耳垂渗血留悬念","summary":"冥界里白真人乘火鲤沿冥河而下，路遇曹园所化巨佛；曹园望见天降火河心生疑窦，回树前欲与冥师谈判，冥师已失踪。青山这边井九道今天就到这里，中州派云船北归，各宗派相继告辞，青山众弟子拜见掌门真人，雀娘与赵腊月留在青山；上德峰已毁，其门下暂赴洗剑阁安置。井九将银鞭掷回群峰，洗剑溪恢复如初，溪间却传来鞭梢击物的脆响；众人惊见井九耳垂裂开血线，渗出一滴血珠，如美人辞亲的红泪。"},{"n":701,"orig":702,"title":"谁赢了？","people":["井九","方景天","赵腊月","雀娘","阿飘"],"one_line":"白真人诈死遁冥，井九暗中布后手","summary":"井九耳垂裂出血珠，重演当年被南趋斩伤的旧状，众人惊觉他付出的代价远超想象。他问方景天师父死了作何想法，方景天答若井九飞升便万事皆休，被送往昔来峰休养；井九又让过南山收拾群峰，把顾清赶回朝歌城另有要事。随后井九道破白真人未死：十方镇妖塔是白渊为谈真人设的反杀局，谈真人真受重伤；他派阿飘搭水月庵的轿去东海，传令曹园入冥杀白渊，让童颜说服冥师相助。末了井九与雀娘飞快下一盘棋，青鸟落在棋枰上，他叹道：你虽然最快，也来不及了。"},{"n":702,"orig":703,"title":"再落子","people":["井九","白真人","冥师","平咏佳","尸狗","青儿"],"one_line":"井九剑峰托付大事，白真人冥界再落子","summary":"青儿知道井九不会让自己去冒险追白真人；尸狗请命出战，也被井九以守青山为由留下。井九耳垂伤口燃起剑火方才止血，歇息一夜后亲赴剑峰，将满天飞剑放归山崖，并透露昨夜群剑杀仙是他亲自吩咐。他对平咏佳说有件大事需征得同意，平咏佳惶惑不安。冥界里白真人乘火鲤南下，回忆当年冥皇被镇魔狱囚禁、太平借酒消愁的旧事；冥师赶到询问缘由，她答此事很有意思：太平与景阳的棋局看似景阳全胜，她此时再落一子，终局便成了中局。"},{"n":703,"orig":704,"title":"咸雨如泪","people":["童颜","阿飘","白真人","水月庵主","曹园","火鲤大王"],"one_line":"童颜识破白真人布局，火鲤将被血祭","summary":"阿飘乘青帘小轿到东海唤醒童颜，童颜猜到白真人布局：大祭司听命于她，冥师也会相助，曹园孤身难敌，唯有算准她现身之处才有机会。水月庵主催动桃光符经照亮东海指明方位。冥界里，昨日还厮杀的两派竟联手围攻曹园的大佛。白真人乘火鲤循着冥界天顶的咸雨找到裂缝，穿过黑暗抵达大漩涡，第一次见到人间大海。她拈起通天杀阵遗落的妖血血珠，火鲤颤声问自己是不是要死了，白真人平静答：是啊。"},{"n":704,"orig":705,"title":"我只是一条有很多话想说的鱼","people":["火鲤大王","白真人"],"one_line":"火鲤百般求活无门，被白真人血祭","summary":"火鲤看似话痨怯懦，实为聪慧神兽，早知白真人带它来是要以它的神兽真血献祭通天杀阵。它体内被中州派祖师下了与神魂相连的禁制，无法偷袭也无法逃走，只能晓之以理、动之以情、撒泼耍赖，自荐去偷青山老龟的血、提议等成年再杀，白真人一概不理。她指出冥河是火、海水是柴，火鲤助她重开大海入冥通道也算死得其所。火鲤绝望拼死一搏，禁制即生剧痛，白真人挥手将它斩碎，神兽之血纷纷落入海中。"},{"n":705,"orig":706,"title":"一拳碧落为黄泉","people":["白真人","曹园","火鲤大王","冥师","大祭司","巨人"],"one_line":"白真人一拳重开大海入冥，冥界再遭灾","summary":"火鲤之血燃遍海面，被白真人引入血珠阵网，通天杀阵复又强盛。她以隐藏的十方伏妖塔为阵眼，引妖血入仙箓，一拳轰穿大漩涡海底，重新打开大海入冥的通道，鸣泉秘境就此消失，无尽海水如数百条蓝龙砸向冥界。曹园怒起刀光相抗，被数百朵白莲拦下，铁刀崩出豁口，冥师与大祭司联手拖住他。白真人踏白莲舟顺冥河而去，循着一缕罡风直奔一茅斋。巨人归来见漩涡成洞而茫然无措；青天鉴中张老太爷忽然扶井吐血，嘶喊陛下杀了她。"},{"n":706,"orig":707,"title":"看井","people":["井九","平咏佳","赵腊月","青儿","张老太爷"],"one_line":"井九托剑平咏佳，化剑光独自出山","summary":"青天鉴中张老太爷扶井吐血，血入井水竟重新凝成火鲤，被他捞进金盆供在祠堂。青山剑峰上，井九向平咏佳托付大事：承天剑鞘已毁，唯有他能号令青山群剑，井九要以自身化剑去杀白真人，恳求平咏佳将来无论自己变成什么样，都不可杀他、不可禁锢他的自由，因为人无法把自己提起来，他可以成为剑却无法同时做执剑人。赵腊月极力反对，坚称他的命必须握在自己手里，青儿也疑问丛生。平咏佳含泪应允，指向井九，井九身轻如风化作剑光，破开两忘峰崖壁射向东方，举宗目送。"},{"n":707,"orig":708,"title":"那就让我来拯救你和这个世界吧","people":["井九","平咏佳","童颜","巨人","张老太爷","水月庵主"],"one_line":"井九破通天杀阵，决心亲手救世","summary":"井九借平咏佳之力化剑光，转瞬便至东海通天井畔，从童颜手中接过景云钟，请水月庵主以桃光封住井口，随即赶赴大漩涡。他以青天鉴射出经文光柱，罩住通天杀阵深处的幽暗火苗收进鉴中，再挥剑光切断漫天血珠的联系，通天杀阵就此崩解消散。巨人连声呼喊提醒，井九浑不在意。青天鉴里，张老太爷把重生的火鲤供进祠堂，又喊着要澡桶池塘。井九望着晨光心道：师兄喜欢灭世，你喜欢救世，可这种事情这么累，有什么意思呢？"},{"n":708,"orig":709,"title":"直接一剑切了","people":["井九","曹园","冥师","大祭司","巨人"],"one_line":"井九首入冥界，斩大祭司拔山为堤","summary":"井九破阵后衣衫褴褛、疲惫不堪，让巨人暂堵洞口，自己纵身跃入大海，首次进入冥界。天降海水如碧蓝巨龙吞噬生灵，他以剑光斩断所有水柱。见冥部大军仍围攻曹园，他锁定了冥师与大祭司：冥师望见那道剑光惊呼大师兄复生，转身便逃；大祭司被曹园刀光斩出虚空，又被井九一剑切作血雾，冥师双腿齐断而废。井九再以剑意从地底拔起千丈山脉拦住海水，告知曹园四个时辰后海水会绕过山脉，曹园答届时横刀死挡。冥师哀叹你们来不及了，井九不作深究，化光而去——直接一剑切了。"},{"n":709,"orig":710,"title":"送钟","people":["井九","布秋霄","麒麟","奚一云"],"one_line":"井九携景云钟逼出麒麟，限期寻敌","summary":"井九以剑光切开镇魔狱底的琉璃屏障返回人间，顺路看了一遍朝歌城：太后守着禅字，顾盼立于城头，市井如常，却未见白真人。棋盘山亭中古枰被剑光照亮。他赶到千里风廊，见布秋霄浑身浴血以圣人血封住罡风入冥通道，奚一云与十余名书生已死，白真人曾来偷袭。井九要他再撑两个时辰，自己则破开云梦大阵最深处，逼出麒麟真身，追问白渊下落。麒麟狂笑万物一剑杀不死真神兽，井九摊开掌心，景云钟赫然在目。"},{"n":710,"orig":711,"title":"夭寿","people":["井九","麒麟","白真人","平咏佳","赵腊月"],"one_line":"麒麟供出天寿山，井九墓室遇伏","summary":"景云钟并非麒麟的本命神物，而是天生克制它的至宝，难怪麒麟见之魂颤欲跪。麒麟辩白此事与己无关，井九警告一个时辰内杀不死白真人便回来杀它，随即化作剑光遍寻人间与各处入冥通道，一无所获。青山里平咏佳强撑剑诀牵引剑光，赵腊月暗自观察他的弱点，以便将来随时可杀。期限将至，麒麟想起天寿山：前皇朝陵墓下也有一条冥界通道，由无恩门世代驻守，封山大阵隔绝天地。井九破阵而入，连破七重殿宇直抵墓室，白玉棺中果然藏着白真人，他的手指却被一只灰蚌夹住——那是萧皇帝的河蚌。"},{"n":711,"orig":712,"title":"互算","people":["井九","白真人","水月庵主","童颜","萧皇帝"],"one_line":"白真人重创井九，反被童颜设局偷袭","summary":"井九的手指被萧皇帝的河蚌夹住，白真人趁隙一拳轰在他脸上，仙气与皇气齐至，他如石块般被击飞出陵墓，剑光歪斜地逃向远方，白真人只当他重伤败逃，浑然不知这正是井九的算计。她赶赴东海通天井，欲破水月庵主的桃光禁制，自太阳高处降下一掌拍向青帘小轿。童颜先前装出的绝望原是诱敌之计：庵主硬接一掌后，掌心忽生剑尖，井九之剑借她之手穿透白真人肩臂，带出一蓬血。白真人眼眸深处亮起金芒，护住道心，遁入血雨消失。"},{"n":712,"orig":713,"title":"落叶与秋风无关，只是时间到了","people":["萧皇帝","白真人","无恩门少年","水月庵主","童颜"],"one_line":"无名少年百年一剑，斩杀萧皇帝","summary":"白真人眸中金芒护体逃过杀身之劫，遁入血雨消失；青帘碎裂，水月庵主露出少女真容，她硬接一掌只为换取偷袭之机，童颜坦承骗了曾经的师父。天寿山陵墓中，前皇朝最后一位遁剑者萧皇帝现身——他正是太平真人的军师，以天地为炉的真正设计者之一。封山百年的无恩门里，只有一个守殿的年轻弟子持入门剑经迎敌，萧皇帝不以为意。谁知少年一百余年只练第一式，剑意之简之纯冠绝天下，一剑竟穿透萧皇帝腹侧。萧皇帝问他是谁，少年茫然答不知道，随后萧皇帝散作满地黄叶，被秋风卷走。"},{"n":713,"orig":714,"title":"停下与经声无关，只是累了","people":["井九","白真人","谈真人","麒麟","童颜"],"one_line":"井九白真人塔林对峙，皆已力竭","summary":"中州派云船死寂归山，重伤的谈真人先拜会后山长老，再到大阵深处见麒麟，透露已把掌门之位内定给叛徒童颜，又亮出景云钟震住暴怒的麒麟。另一边白真人借果成寺钟声经声遮掩气息，在白山禅室休整。井九循迹而至，两人相遇于塔林，皆已油尽灯枯，不约而同停下对峙——只是累了。白真人问他还能横行几时，井九答不知道；她提起井九的亲兄长葬于此地，忽然指着天空的太阳问：你觉得那是什么？"},{"n":714,"orig":715,"title":"问道","people":["井九","白真人"],"one_line":"塔林问道，白真人自陈追随太平之念","summary":"白真人道破天机：此界太阳只是外界那颗苍白火球的投影，原初之光便是仙气，故她自认稳操胜券。两人于塔林论道：井九承认世界或有设计，但摇篮正是为了让人长大破壁离开；白真人自述出身白家、一生无趣，羡慕太平与连三月的活法，视太平灭世之念有趣而正确，甘为其追随者，曾派大祭司暗中配合，又故意骗白刃仙人归来——无论其杀尽众人还是被算死还仙气于天地都是好事。她最后追问井九为何放弃自由亲自落场，井九答这个决定想了整整一晚。"},{"n":715,"orig":716,"title":"明灭","people":["井九","白真人","尸狗"],"one_line":"白真人燃箓化身金身，尸狗遮日破局","summary":"井九道明本心：师兄要灭世本可各走一边，但对方掀起的浪太大，浊了他这口井；他破天而出仍无法斩断与这个世界的因果，索性回来做了断。白真人宣称大道之争的评判唯有活下来，先燃副箓将仙气镀成金身，再动用主箓召来阳光织成光栅困杀井九，容颜迅速苍老。井九早料到此局，战前已在天际写字传信，危急关头尸狗化作黑山挡住太阳，斩断阳光之源。白真人仍以光柱将他轰飞数百里外海岛，井九浑身浴血，挥手召回数道剑光还以颜色。"},{"n":716,"orig":717,"title":"浪花只开一时","people":["井九","白真人","尸狗","阿大","赵腊月"],"one_line":"万剑终局，白真人含笑殁于大海","summary":"井九隔海虚斩，白真人以光明逆行来到海上对轰，井九瞬息间放出数千道剑光，如万剑齐发将她钉出无数细洞，白真人坠入海中。仙箓毁灭，仙气尽数归还天地，尸狗移开黑山，可见其伤重。白真人临终与井九论道：大道之争不重要，只是想有趣地活着；井九答越有趣越悲凉，永生虽无法证明，但他一直在解这道题，这正是活着的乐趣。她满意地闭上眼睛，随浪而逝。青山里阿大为重伤的尸狗舔伤，赵腊月望着东海心绪难明，井九则换上新衣，飞向大漩涡，开始拯救世界。"},{"n":717,"orig":718,"title":"补天","people":["井九","巨人","赵腊月","连三月"],"one_line":"井九以天蚕丝系剑网补天，力竭昏死","summary":"井九以剑光在大海与冥界之间穿行，布下无形剑意之网兜住泻落的海水，令水势渐缓。剑网愈重他愈慢，飞行踉跄如醉，巨人屡屡呼喊劝阻，他仍咬牙续织，直至暮色如血才勉强成网。剑网的线端缠在他右手尾指上，割裂指骨，他无法将其系于岩石，便剖开自己腰侧，挑出一百多年前连三月为他缝伤的天蚕丝——与剑意共生百年、坚韧异常。巨人把古树插入海底，井九以天蚕丝绕树无数圈，最后打了一朵桃花结，随后昏死在海水中。赵腊月血色剑光而至，将他抱进怀里，弗思剑再度断裂沉海。"},{"n":718,"orig":719,"title":"填海","people":["布秋霄","巨人","曹园","阿飘","谈真人","禅子"],"one_line":"举世填海功成，冥界积水成呼伦湖","summary":"巨人在剑网上铺设岩石泥沙，布秋霄浴血赶到，以圣人血书符文凝固碎石；青山长老与各宗强者陆续赶来搬山填海，连中州派也派大长老支援——其内乱已平，谈真人镇压麒麟、处死任千竹等叛党，需百日疗伤。冥界里曹园以肉身连山筑堤，阿飘持冥皇之玺降临，以冥皇之身号令冥部强者修山为堤连成一个圆。不知过了多少天，天降暴雨骤停，大海入冥的通道被彻底堵住，海水在冥界积成浩瀚的呼伦湖。冥界先哭后欢呼，阿飘望着湖水思念下落不明的井九。"},{"n":719,"orig":720,"title":"道理我都懂","people":["赵腊月","井九","雪国女王","顾清","苏子叶"],"one_line":"井九生机断绝，赵腊月踏雪求救无门","summary":"人间欢呼劫后余生，顾清却在通天井畔焦灼：井九被赵腊月带走后杳无音信，他威胁清天司全力搜寻。赵腊月背着气息全无的井九深入雪原，向冰峰中的雪国女王求救。女王神识嘲弄，赵腊月直言不恨造就自己的人，只求救他，正如女王之母助她离开。女王确认井九未死却无法救治：剑没了剑元，如人失血。赵腊月转赴居叶城召来用毒圣手苏子叶，诸法皆无效。她守在床边暗想：道理我都懂，他没死，可若永远醒不来与死何异。同一时刻，一道无人察觉的剑光返回了朝天大陆。"},{"n":720,"orig":721,"title":"打西边来了个中年人","people":["西来","赵腊月","井九","白早"],"one_line":"西海剑神归来，寻井九一试剑锋","summary":"西海剑神西来自异大陆归来，百年前他被柳词重伤离去，如今境界更高。归途海上他收殓了阴凤的尸骸，对太平、白刃、仙人诸事毫不关心，只想找到井九试剑，提着阴凤扮作猎户走遍人间。赵腊月则把井九带到三千院，安置在沉睡的白早身旁，用天蚕丝笨拙地缝他腰间伤口，夜里入湖洗浴、独自垂泪，天明决定回青山求援。西来循迹而至，三千院大阵被其剑意切碎，师太们惊呼西海剑神居然还活着，他只道喊我西来就好。赵腊月眼睛一亮，急问他有没有办法唤醒井九，西来一时无言。"},{"n":721,"orig":722,"title":"疯子也会害怕","people":["赵腊月","西来","井九","广元真人","南忘","青鸟"],"one_line":"赵腊月请西来救井九，广元南忘联手亦非其敌","summary":"赵腊月请西海剑神西来救醒井九，这个荒唐请求竟被应允。西来推演出十七种方法，唯有一种可试——让井九在死亡威胁前凭求生欲醒来，赵腊月决定再等等。西来坦言自己与井九是一类人，只关心剑道，从异大陆归来就是为了战胜那道剑光。广元真人与南忘赶来，以锦瑟、回日双剑齐袭，却被西来无形之剑轻易化解，二人重伤。西来声明不会让他们把井九带回青山，因为他感觉井九若回青山可能永远无法醒来。青鸟带来消息：平咏佳醒了，他也很害怕。"},{"n":722,"orig":723,"title":"天才也会犯蠢","people":["平咏佳","元曲","卓如岁","赵腊月","井九"],"one_line":"平咏佳自认万物一剑剑灵，惧占师父之身","summary":"平咏佳向师兄元曲坦白恐惧：他在剑峰闭关修成无形剑体后，竟能感知井九的想法、引导青山飞剑，怀疑自己是万物一剑的剑灵，害怕那种联系会把自己吸去占了师父的身体。卓如岁直言若他真是剑灵，拿回身体不过是物归原主，元曲急忙捂嘴不许乱说。平咏佳吓得不敢离开青山，而赵腊月不肯带井九回青山，正是为了在他威胁掌门时能第一时间杀死他。随后青山剑舟抵达大原城，元曲与卓如岁提着茶具火锅进驻三千院，借吃喝制造动静试图唤醒井九。"},{"n":723,"orig":724,"title":"劝你睁开眼","people":["井九","顾清","卓如岁","元曲","童颜","雀娘"],"one_line":"神末峰众人轮番唤醒无效，顾清摊牌亦无用","summary":"元曲与卓如岁在三千院煮火锅、泡茶，边吃边留意禅室动静，井九毫无反应。雀娘携棋盘赶来，童颜随后与她对弈，仍唤不醒井九；童颜提议敲景云钟，被西来否决——井九神魂会散，除非他自己想醒。顾清从朝歌城赶到，重洗茶壶换上小雅茶、改良火锅菜式都不奏效，索性跪在床前宣布要把与太后的私情向太后和桃子说清楚，井九依旧沉睡。柳十岁最后赶到，被赵腊月问有什么主意，他忽然转身离开三千院。"},{"n":724,"orig":725,"title":"时间到了","people":["柳十岁","井九","西来","周云暮","卢今","阿大"],"one_line":"柳十岁制竹椅陪师，玄天宗决意送还黑牌","summary":"柳十岁从天光峰旧址取来自己百余年前种下的竹子，亲手做成竹椅，把井九抱出禅室躺在廊下，从此井九卧于竹椅感受天地，阿大也赶来伏在他怀里。西来观察神末峰弟子多日的火锅茶饭后说出感想：最初以为井九救世是为了连三月，现在明白是为了所有人——弟子们也是他的因果，所以才有如今的他。与此同时，豫北玄天宗师徒周云暮与卢今揭开旧事：百余年前他们是唯一进过景园的客人，景阳曾赠一块黑牌，嘱咐觉得该送回时便送回。周云暮认定就是此刻，决意亲自送牌。"},{"n":725,"orig":726,"title":"高，真高","people":["禅子","西来","井九","卢今","卓如岁"],"one_line":"禅子断言井九须舍前世因果方能醒来","summary":"卢今带着玄天宗保管百余年的黑牌动身。禅子结束大漩涡事务后绕路来到三千院，以光镜探查井九：他剑元俱无，按理早该死了，却在最深处留了一丝剑意；因受伤太重，神魂也陷入深眠，无法进入青天鉴。禅子点出关键——井九的身体是万物一剑所化，他的神魂只是借住的客人，梦里不知身是客；若能舍掉景阳的因果、真正成为此刻的井九，他便可能醒来。随后禅子与西来以抽木棍比拼推演计算，禅子认负，承认西来的推演已不在井九之下。青鸟用爪嘴抽走最后一根，被卓如岁吐槽是在踩高跷。"},{"n":726,"orig":727,"title":"黑，真黑","people":["布秋霄","西来","卢今","赵腊月","柳十岁","曹园"],"one_line":"布秋霄败于西来，卢今送黑牌现出地图","summary":"一茅斋斋主布秋霄来到三千院，与西来各展本事：他取出一本内藏江河湖海的书，西来先读完且毫无倦色，连圣人也自承不是对手。柳十岁求得此书翻看后受了伤，卓如岁贪心硬看，直接昏死过去。青山众人忧心西来境界已超当年南趋，无人能赶。冥界里，金身大佛曹园正用身体堵住岩浆裂缝，与布秋霄合力修复冥界。随后玄天宗掌门卢今抵达三千院，说明当年景阳真人托付黑牌的旧事，将其交给赵腊月；赵腊月注入剑意，牌中显出一幅地图，光点指向青山外围某处，柳十岁认出那是自己小时候去过的山村。"},{"n":727,"orig":728,"title":"人间最苦是无识","people":["南忘","赵腊月","柳十岁","井九"],"one_line":"三人寻得景阳遗蜕，解开井九不醒之谜","summary":"赵腊月、南忘、柳十岁循黑牌地图来到柳十岁幼年的山村，穿过瀑布进山腹，发现洞府外布着曾囚禁太平真人的千里冰封剑阵。黑牌中的飘渺剑意融入剑阵将其开启，石榻上正是景阳真人的遗蜕：当年他飞升失败遭白刃偷袭重伤，回人间藏身于此，临死前用雷魂木把神魂引渡进万物一剑转剑重生。南忘无声哭泣，道出真相：井九的神魂本能想回到前世身体，因此不肯在现在的身体里醒来；那具身体可以感受痒痛醉意，而现在的他什么都感受不到——不吃火锅不饮酒并非天性，而是无识无觉的极苦。"},{"n":728,"orig":729,"title":"银铃叮当响，意思不一样","people":["井九","平咏佳","南忘","西来","卓如岁","元曲"],"one_line":"遗蜕化灰当日，井九醒来并向西来约战","summary":"南忘以南蛮神术将景阳遗蜕火化成纯白之灰，随风而散，替他断了前世最后的因果；就在遗蜕消散那一刻，青山剑峰云雾破开一线。平咏佳鼓起勇气离开青山来到三千院，向卓如岁、元曲委屈喊出：他不是要强夺师父的身体，当年转剑生肯定不是那样。话音未落，井九在禅室里平静答道「当然不是这样」，就此醒来。他走出来束起长发，接过西来怀中的阴凤尸身抛上天空，阴凤化作凤凰状光粒消散。井九随即邀战，西来说要给他三天时间准备后事，还笑道：没有信心这种感觉很有意思，所以我觉得我应该能杀死你。"},{"n":729,"orig":730,"title":"醒来的世界到底是谁的？","people":["井九","顾清","胡太后","景尧","赵腊月","青儿"],"one_line":"井九醒来震动诸界，顾清携太后私奔","summary":"井九苏醒的消息传遍诸界，雪国女王收回注视，禅子欣慰，阿飘喜见冥宫青树生出新叶。朝歌城里，顾清确信师父不会输，当机立断带着胡太后从皇城私奔，神皇景尧闻讯震怒。太后与监国数十年的私情、平咏佳的真实身份，天下人早有耳闻只是无人敢问。赵腊月赶回后当众抱住井九。井九令众人吃惊地宣布：这次要自己备战，那道剑光也「这次我自己来」，不再需要他人引导。青儿道贺：从此世间再无景阳真人，只有井九。两日后，井九与西来同时升空，两道剑光照亮天地。"},{"n":730,"orig":731,"title":"前度彭郎今又来","people":["彭郎","井九","西来","孙长修","广元真人"],"one_line":"寻常弟子彭郎误杀萧皇帝，挡下神级剑光","summary":"井九与西来交战的两道剑光劈碎了无恩门的旧剑舟，年轻掌门彭郎出于本能挺剑护住孙长老，竟挡下这一击，剑断人伤而未死，两道剑光随之落进大原城一间古董铺被封存。彭郎原是商州寻常少年，入门百年庸碌无为，却在万寿山陵墓前随手一剑刺死了化作落叶的萧皇帝，就此破入通天境，成为无恩门新任掌门。广元真人认出孙长修，孙长老向井九行礼并引荐彭郎，举世哗然。井九问明原委，道「难怪你能挡住西来的这一剑」。井九与西来都看中了这个百年成通天的剑道天才，同时只能叹出两个字：可惜了。"},{"n":731,"orig":732,"title":"万物一剑（上）","people":["西来","井九","彭郎","赵腊月"],"one_line":"西来悟出青山真义万物一剑，井九不动","summary":"井九与西来同时感叹可惜——彭郎天赋更胜青山众弟子，却已是无恩门掌门；西海剑派已灭，西来一身剑道无人可传，他请彭郎继承剑道被当场回绝。西来便邀井九观其新悟剑道，以废墟古鼎、砖墙石缝、门板风雨等万物生出剑意，数百道剑光斩向井九，白衣处处破口。西来点明这正是青山剑典第一页所载「万物皆可为剑」，是开派祖师悟出剑道真义的源头，他竟自行掌握了青山至高剑道，举座皆惊。井九承认这确实是祖师的万物一剑，随即令满天雨珠静止原地，淡淡道：但那不是我的万物一剑。"},{"n":732,"orig":733,"title":"万物一剑（下）","people":["井九","西来","柳十岁","彭郎"],"one_line":"井九以万物剑阵胜西来，荐柳十岁学剑","summary":"井九道出自己所求不是万物皆可为剑，而是万物为一剑：雨珠、云丝、场中诸剑乃至无形之物尽皆对准西来，协调如一，天地本身化作一剑，谓之万物剑阵。西来判定这是合而为一的青山剑阵，自觉认输——井九当初能在剑光中收剑，胜负早已注定，能见此剑道已无憾。他真正遗憾的仍是后事无着，感叹雾岛难再出这样的少年。井九无意杀他，反而把心性沉稳、学过潮来剑法的柳十岁推荐给他为传人，西来离去前留话「他走后，你再来寻我」。井九升空归位，静止的雨珠哗然落下。"},{"n":733,"orig":734,"title":"那些果儿（上）","people":["井九","柳十岁","顾清","景尧","赵腊月","胡太后"],"one_line":"顾清携太后出海，井九道破道种前缘","summary":"西来离去后，井九留在三千院，柳十岁奉命待井九飞升后去西来处学剑、十年后归，心中怅然。景尧赶到三千院，却得知顾清已带着胡太后乘抢来的宝船出海远走，同行还有甄桃，不禁神色难看匆匆离去；顾清自觉这是循规蹈矩一生唯一的出格，也笃定师父会希望他这么做。井九向赵腊月、柳十岁道破前缘：当年飞升前他在朝歌城一眼看出孕妇腹中的赵腊月，又在洞府附近救起险些溺亡于地河的柳十岁——白刃给中州派留仙箓，他给青山留下的就是这两个天生道种。洞府里的两张蒲团，则是他当年准备携万物一剑一同飞升。"},{"n":734,"orig":735,"title":"那些果儿（下）","people":["井九","平咏佳","彭郎","赵腊月","卓如岁"],"one_line":"平咏佳身世大白，彭郎与井九密谈一夜","summary":"井九揭开平咏佳身世：万物一剑是活着的剑妖，当年他准备携其飞升，却发现天宝真灵如青儿、雪姬一般无法离开天地，于是花数年助剑灵脱离器物承载，谁知平咏佳失去记忆变回猴子跑掉，青山重逢时彼此已认不出。井九允他仍旧喊师父，命他回青山去。众人谈及井九无识无觉之苦，井九只说还好：他尝不出火锅茶酒的滋味，却喜欢看弟子们抢肉吃锅、看茶气后的世界，只是难过时不会哭，此事到此为止。随后彭郎被引入禅室，与井九密谈一夜，青山众人都好奇二人谈了什么。"},{"n":735,"orig":736,"title":"两个问题","people":["井九","彭郎","布秋霄","曹园","赵腊月"],"one_line":"井九赴冷山问两事：何霑身世与曹园来历","summary":"彭郎出禅室，称井九指点了他诸多剑道，允其日后上青山剑峰自觅一剑，还说井九认为他名字有问题却不能改，众人不解其意。井九为沉睡的白早洗脸作别，命神末峰弟子回峰等候，携赵腊月赴冷山。地底布秋霄正以天地大赋凝固岩浆，与曹园合力修复冥界。井九专程来问两个问题：其一，何霑的生父究竟是谁——布秋霄守口不言，井九便让赵腊月记住「何霑的亲生父亲是布斋主的老师」，留作制衡；其二，向深渊里的曹园求证连三月讲过的他出生的故事真假，曹园沉默良久答「是真的」，并说井九走时他会来送行。"},{"n":736,"orig":737,"title":"同一片岩浆，不同的池塘","people":["井九","赵腊月","火鲤","张老太爷","曹园"],"one_line":"井九泡岩浆入青天鉴，探望火鲤与故人","summary":"曹园确认身世为真，并说井九走时会来送行。井九与赵腊月索性泡进冷山岩浆河流：井九能感到灼痛，请她不必同情；赵腊月以无形剑体凝剑意护体，抱着青天鉴沉入其中。井九神魂入鉴，来到楚国故都探望故人。火鲤当年被白真人以灵血祭阵所杀，只剩一缕神魂被井九救入青天鉴，寄居在张老太爷挖的池塘里，因会说人话被世人当作妖怪，唯有老太爷日日相伴、叮嘱它忍着别吓人。井九现身池畔，火鲤惊喜大喊真人终于来了。"},{"n":737,"orig":738,"title":"飞鸟与鱼，木柴与火","people":["井九","赵腊月","火鲤","何霑","禅子"],"one_line":"火鲤拒还阳世，井九以木棍喻前世今生","summary":"井九提出用朱鸟玉卵助火鲤还阳重回人间，火鲤怕变成怪物，又舍不得张老太爷，宁愿留到老太爷去世再说。井九入祠堂上香后离开青天鉴，正撞破赵腊月趁他入睡的偷吻，二人均不在意。井九又与何霑、瑟瑟烤鱼同乐，何霑早察觉自己身世隐秘，终究聪明地没有开口。随后二人到白城小庙见禅子，井九以细木棍点燃作比，道破景阳与井九并非一条河的上下游，而是同一团火——前一根的火苗点燃后一根。禅子连呼懂了，拦下他别再烧棍。"},{"n":738,"orig":739,"title":"那就今天吧","people":["井九","赵腊月","禅子","南忘","景尧"],"one_line":"井九告别之旅走遍旧地，定下飞升之期","summary":"禅子问井九何时悟出此理，井九答是当年在镇魔狱与冥皇讨论魂火时想到的。谈及雪国女王，井九说她不如其母雪姬，自己无意杀她；禅子以「第二次成亲有什么好看的」为由拒绝送行观礼。井九与赵腊月开始告别之旅：探望将不久于人世的赵父赵母，入宫见景尧，重游新旧梅园、太常寺与井宅，但不去果成寺看白早的石塔；再到南河州浊水忆旧，于云集镇酒楼吃火锅，最终回到青山小楼看南忘所绘的景阳画像。整个天下都在等他飞升却无人敢问日期，南忘开口相询，井九答：那就今天吧。"},{"n":739,"orig":740,"title":"漫长的等待","people":["井九","南忘","曹园","童颜","赵腊月","彭郎"],"one_line":"全修行界齐聚青山，景云钟宣告飞升时刻","summary":"飞升前，南忘向井九坦白：当年烧掉遗蜕不是恨他，而是懂他要断前世因果的心意；她直言喜欢的是景阳也是井九，但不会要他留下等待。飞升之日，全修行界齐聚青山：上德峰已化作黑色玉盘，镇守尸狗伏卧其上成为新的山峰，一茅斋、悬铃宗、镜宗、重新开山的无恩门乃至结仇的中州派童颜尽数到场，人群中还有一个戴笠帽的神秘人。井九乘弗思剑落上玉盘，赵腊月、柳十岁、平咏佳等弟子随行，金身大佛曹园随后赶到。童颜祭出景云钟，曹园以刀意击钟，钟鸣传遍朝天大陆每个角落——时间到了。"},{"n":740,"orig":741,"title":"井九说故事","people":["井九","曹园","禅子","赵腊月","布秋霄"],"one_line":"井九飞升前说法，讲刀圣曹园的身世","summary":"钟声响彻世界，海那边回家的巨人、宝船上的顾清、雪原冰峰里的身影皆有反应；禅子趴在香案下不去观礼，只念着当年景阳每夜讲故事哄他入睡的旧事。井九对数千修行者宣布不讲道理，只讲三个故事。第一个故事揭开刀圣曹园的身世：居叶城曹家为护住天赋寻常、易遭时家毒手的孩子，夫妇二人一夜灭时家满门，再赴果成寺托孤，随后自杀。曹园认下此事，补称时家并未死绝，风刀教收留了不少姓时的族人。井九点破他因自认带罪而生，镇守雪原、修复冥界只为让死者死得有价值，无法飞升只因三个字：想不开。"},{"n":741,"orig":742,"title":"不死万万年","people":["井九","苏子叶","布秋霄","柳十岁","彭郎"],"one_line":"井九讲苏子叶魔胎出身与自己的来历","summary":"井九讲第二个故事：玄阴宗少主苏子叶原是父亲苏七歌种在亡妻尸腹中的魔胎，生来便要被吞食炼成魔婴，他提前婴化、以尸毒反噬令父亲瘫痪才活下来。井九说他不是恶果，并给出朝天大陆之名的新解——人死屌朝天，不死万万年，坦言欣赏的正是苏子叶这口气。第三个故事是他自己：生于最乱的朝歌城皇宫，被道缘真人带上青山，与师兄太平真人缠斗两世，如今独活，成了世上最老的传奇。他自问自己是什么人，自答当年在小山村便已推演三千年，并宣称终有一日要舍了这道身。"},{"n":742,"orig":743,"title":"一走了之","people":["井九","赵腊月","平咏佳","陈雪梢"],"one_line":"井九万剑开天破天劫，一走了之飞升","summary":"井九以火焰递相传喻前世今生，宣布要舍道身、扔木棍，重申「我是我之所有因果的指向」，最后只说了两个字「走了」，便化作剑光冲天飞升。虚境中雷暴漩涡迎面而来，数千万道闪电凝成光山，史上未见——飞升者越强天劫越厉。井九把下方云雾牵成细丝万剑开天，竟引得天劫电光回首向天，可见天道亦是天地一部分，雷暴就此消散，剑光如万颗流星永悬天空。赵腊月仰望他离去，体会着飞升即生离死别的滋味。剑光破开黑暗寒冷的世界，井九回首，来处一片虚无。"},{"n":743,"orig":744,"title":"飞升之后","people":["井九","彭郎","白早","赵腊月","谈真人","卓如岁"],"one_line":"井九俯瞰故人各安前路，留仙箓后离去","summary":"井九在黑暗寒冷的宇宙里寻到那把竹椅躺下，透过时间流速差俯瞰朝天大陆：赵腊月脚下生出野草直通天际，白早醒来，曹园开始第二次蹈红尘，布秋霄为学生奚一云著书，苏子叶解丹毒开宗立派，卓如岁继任青山掌门。彭郎受白早撺掇挑战雪国女王，惨败却留在雪原，女王再度怀孕；白早自觉算不过井九，远走蓬莱成为仙子，谈真人闭死关传位童颜。井九炼出一道仙箓送回青山剑峰交给平咏佳，以备天地元气不足时补充屏障，随后真正离去。不久，谈真人飞升而至，坐上竹椅炼制仙箓。"},{"n":744,"orig":745,"title":"原来这就是星星","people":["井九","谈真人","西来","曹园"],"one_line":"井九循迹确认域外天魔，引开强敌护星","summary":"谈真人、西来先后坐过竹椅离去，曹园金身坐不进去也走了。井九循着镇魔狱与阿大残留的味道追踪雪姬，一路发现多具死去的域外天魔尸体——形如无柄黑色蒲公英、体生数千触角、死后依然坚逾精铁，确认雪姬正沿此方向离开。他望着渐远的白色火球，恍然明白原来这就是星星。前方红色恒星旁，一只大数百倍、依然活着的天魔挡住阳光，气息搜寻四方。井九伪装成陨石躲过扫掠，又怕它循迹找上离此最近的白色火球、殃及朝天大陆，便打个响指，以指尖剑火引开强敌。"},{"n":745,"orig":746,"title":"不虚此行","people":["井九","太平真人"],"one_line":"井九杀域外天魔重伤，太平真人燃魂相送","summary":"井九以剑火挑衅，天魔的意识场冻结空间、直袭神魂，他凭两世转修的坚韧神魂反攻，钻入魔躯连斩触手将其击杀，自己却被对方自爆重创，剑元耗尽、剑识受损、昏睡将死。随行的那缕青烟现出太平真人身形，点破这种不惜命的天魔正是「天魔」二字的由来；他承认证实了自己数百年信念之误，遂用最后的神魂推着井九飞向红色火球补充仙气，自身腰部以下尽数虚化。目睹数万艘燃烧战舰围拢而来的壮观景象，太平真人叹「真美，不虚此行」，就此消散。文末附作者感言：前二百万字井九飞升完卷，末百万字将按开书构想写完。"},{"n":746,"orig":747,"title":"低等文明","people":["井九","钟李子"],"one_line":"井九落入星际世界的底层街区，隐姓二十天","summary":"数万艘战舰点火远去。实验室里两名科学家对着防护罩中完美得如艺术品的赤裸男子争论不休，猜他是远古文明遗存的液态金属机器人，却扫描不出任何处理器。男子睁眼只应了一声「嗯」。新世学院的学生们议论银发少女钟李子挂在网上的修仙小说《大道朝天》，嫌男主角死脸无趣；钟李子为小说辩护后回到昏暗的下层街区，冲着紧闭的卧室大喊要求修改「飞升之后去了哪里」的剧情，开门却见一个戴帽少年静静看星，答道井九「就到这个世界来了」。她尖叫反对题材融合，而井九已在此生活二十天，确认这是个低等文明。"},{"n":747,"orig":748,"title":"实验室里的囚徒","people":["井九","钟李子"],"one_line":"井九醒来困于能量场，誓不做实验室囚徒","summary":"井九因那张脸被钟李子收留合租，每晚八点准时看电视新闻了解世界。新闻里官员称金属门前的爆炸是意外，他疑惑为何通缉令上没有自己的脸，并在画面背景里记住了那个金发男子。原来他在实验室醒来时，先听到那名男科学家对自己表达超越性别的爱慕，随即发现这个满是金属的世界对仙气的利用极为落后；他起身行礼却惊得二人直喊那里有六级能量场。井九用剑光试探无形屏障，竟连剑光也被弹回，确认自己被当作囚徒，这是他不能接受的事。"},{"n":748,"orig":749,"title":"当然不回头","people":["井九"],"one_line":"井九破不开力场便杀出基地，一剑冲天","summary":"井九的数百道剑光绕行一圈仍破不开能量场，连无形剑光也被弹回，朝天大陆也没有法宝能完全改变空间结构，这个仙界有些意思。他改以精神意志穿透屏障控制两名科学家，却发现指令无法精确执行，索性脱走，顺手穿上女科学家的外衣。他本想低调摸清环境再离开，但躲避扫描、换装、找出口这类纯事务性的流程令他极烦，遂改变主意：斩断管道，一道剑光直上，合金夹层与耐热材料纷纷破开，基地的激光主炮尚未发射便被削成废铁引爆。他冲出基地时发现自己的速度比在朝天大陆慢了许多，确认这个世界层次确实低。"},{"n":749,"orig":750,"title":"第一次接触","people":["井九","钟李子"],"one_line":"井九潜入钟李子家，无意毁其论文","summary":"井九飞出基地却仍在地底——这颗被掏空的行星没有天空。他循光落在亮灯的五层小楼窗外，从电视新闻里看到星河联盟的军队正在宇宙中围剿域外天魔：战舰齐射粗大光线，一枚仙气炸弹引爆出巨大火球。他判定敌人的敌人是朋友、这个世界的人类与朝天大陆同源，决定少杀人，随后潜入屋内，屋主正是沉睡的银发少女钟李子。井九摆弄她的电脑时不慎删掉了她写了半个月的论文，少女醒来后先惊呼论文尽失，继而抱着死去爱猫小黄的照片默默垂泪。井九把她的一切细节记在心里，最后在客厅看电视学说话时触发了报警器。"},{"n":750,"orig":751,"title":"幽灵租客","people":["井九","钟李子"],"one_line":"井九窥见星河联盟秘史，化身租客登门","summary":"井九捏碎报警器，像幽灵般住进钟李子家：看电视学话、翻书识字未成，还撕破了一页旧书。钟李子回家发现破损的书页，蹲在地上痛哭，诉说自己的一生：母亲因基因优化失败早逝，经济学教授父亲被基金骗局所骗、破产自杀，只留下一屋纸书和一只猫，而猫也死了。井九因那只猫想起阿大，在心里道歉。数日间他摸清了这个世界：星河人类联盟占据数百恒星系，远古文明与暗物之海同归于尽后轮回再战，百余年前联盟突现神明般的强者——按星空一天抵大陆一年换算，正是青山开派祖师飞升之时。他决定系统学习，遂以合租之名正式登门。"},{"n":751,"orig":752,"title":"又一个九天","people":["井九","钟李子"],"one_line":"井九九天狂学各科，独在物理前受阻","summary":"钟李子家贫病缠身，正盼着合租救急，见来客面貌惊为天人，听说他有难处还要加钱，收下一枚够付三年房租的黑市金币。井九自定规矩：每晚看一小时新闻、不做饭、家中保持原样，借走她的电脑，靠复制的指纹绕过密码，又请她帮忙虹膜登录学院网。此后他一连九天疯狂学习：首日学完语文，次日天文地理，第三天生物化学，第四天起被物理难住，看遍哲学艺术无所得后回头死磕物理，还追问钟李子宇宙大爆炸之前是什么，得出「也许对，但我不喜欢」的判断。他拒绝修行与基因改造教材，称那是末道。"},{"n":752,"orig":753,"title":"在知识的海洋里迷路","people":["井九","钟李子","谈真人"],"one_line":"井九数学受挫，决定写小说引飞升者现身","summary":"井九推想谈真人会是第二个飞升者，并已托付他炼仙箓补天地元气，又惦记数百年后青山有谁能飞升。他放下物理改看星际浪子，翌日转攻「最简单的数学」，一天读完中小学课程，却在大学数学的数论与代数几何里迷了路。九天期满，他抱着软垫自嘲：推算能力举世无双的自己，为何在这个世界学不动了。他在纸上写下「年」与「机器人」两个无解之词，随后扫描了钟李子的虹膜，向她请教如何让讯息传遍宇宙。他要写一部关于景阳的小说发到网上，等朝天大陆的飞升前辈循故事找来——他寻的是「我是谁」这个答案。"},{"n":753,"orig":754,"title":"在故事的世界里伤感","people":["井九","钟李子"],"one_line":"井九写成全书发上网，满分卷惊呆钟李子","summary":"钟李子教他用遥感笔写作，井九一口气把朝天大陆的故事写完，从梅会直写到「第七卷终，他看到了那些战舰」。小说以她的账号发上学院网，每日更新字数讨价还价后定为十万。钟李子连夜读完哭肿了眼，转头却批评他文笔虽干净、情节却散漫，看到后面忘了前面，还嫌景阳装腔。小说在论坛毫无水花，只有几条八卦评论。井九全不在意，十几天学完学院四年的物理与数学课程，七套试卷全满分。钟李子由敬畏转为怜悯，认定他是遭家族迫害逃亡的天才，力邀他进新世学院图书馆深造，井九应允，夜里照旧幽灵般守着咳嗽入睡的她。"},{"n":754,"orig":755,"title":"在冷清的街区里抢钱","people":["井九","钟李子","丹先生"],"one_line":"井九稳住少女病体，顺手抢了黑市金币","summary":"钟李子的卧室没有真窗，星空全是假的，她其实是被疾病囚禁的人。井九透视她的身体，确认那是严重的血液病，先渡一道剑意暂时稳住。休息日他随她去黑市丹先生处制作身份手环，报出两枚金币的价钱后，他出门片刻便带着崭新的金币回来，惊得丹先生连忙让座。随后游戏厅老板发现保险柜里的金币接连无声失窃，怒不可遏——井九的手既是世间最利的剑，也是能开一切锁的钥匙。二人踩着登山梯上到崖顶，井九透过半透明的蓝天白云，看到了那艘悬浮的战舰。"},{"n":755,"orig":756,"title":"怎样吃掉一座图书馆","people":["井九","钟李子","陆水浅"],"one_line":"井九吸干学院数据库，食堂辨出谎言","summary":"井九自报观火境十一级，随钟李子入新世学院办了旁听与借书证。图书馆只有三千八百万本文册，他嫌终端太慢，布剑阵隔绝阅读室后直接握住数据光缆，把整座数据库如潮水般吸进识海，硬生生撑断了运算核心，全校终端瘫痪。事后他留在石阶等钟李子吃饭。食堂里同学讥笑她穷病交加，钟李子不动声色。曾泄露她隐私的女生陆水浅前来道歉，井九听完便道「她在撒谎」，随后与钟李子对着那盘真菜而非营养块的午餐道谢落座。"},{"n":756,"orig":757,"title":"可能成为物理学家的井九","people":["井九","钟李子","陆水浅"],"one_line":"井九推演光速差，确认两界文明同源","summary":"井九能凭呼吸血液看穿谎言，饭桌上直言「我更好看，但没人说我坏话，你的性格是不是有问题」，钟李子答好看易被嫉妒，他说所以应该有刺。陆水浅追问他的身份，被他一句「你想死吗」吓跑。他从测试仪与武道修行看出此界人类练真气不炼仙气，追问肉身为何孱弱，用餐刀砍臂自试、推演光速与基本粒子，得出惊人的结论：这个世界的光速更低、时间更慢，按此推算平咏佳竟是个人工智能。次日他吸收天文数据，怀疑暗物之海即暗物质文明，最终确认朝天大陆与这个世界本是同一个文明，只因光速之差各走一边，隔绝于那把竹椅之前。"},{"n":757,"orig":758,"title":"各走一边？","people":["井九"],"one_line":"井九推断朝天大陆是远古文明的退路","summary":"井九推想：远古文明毁灭前或许在另一个世界做了准备，那便是朝天大陆——大道朝天，各走一边。星门行星是远古文明遗存，而联盟数据库对远古文明的记载全被封禁。为寻真相他修炼云鬼手段，先夺图书馆数据库控制权，再破入星门基地上层网络，最后潜入最深最神秘的隐网。他的窥探被一道数据流察觉并追杀，他布置虚假标识、掐断信息跃桥，把对方甩在基地第三层便消失。那道数据流盘桓片刻，竟透出落寞与不甘，默默离去。"},{"n":758,"orig":759,"title":"我看你往哪儿走","people":["井九","钟李子","野兔"],"one_line":"井九反追云鬼野兔，揪出军用战舰藏身处","summary":"井九决定组装一台电脑作安全阀，又一次潜入游戏厅搬走硬件，老板认定闹鬼。他装出两台银色电脑，一台送钟李子并可直上星域网，叮嘱她莫带去学校。随后他再入隐网，直闯云鬼高手的密室，正撞上先前追杀他的野兔，留话「今天轮到你跑了」便展开反追，竟穿透军网与民网的隔绝，查出野兔藏在一艘战舰上。隐网众人得知后炸了锅，痛骂其作弊无耻，也骇然于这个新人的手段。井九没报出具体战舰位置，只安静领受了满屋的震惊。"},{"n":759,"orig":760,"title":"新鬼与旧朋","people":["井九","钟李子","野兔"],"one_line":"联盟无人能答井九之问，野兔斧劈信息盒","summary":"隐网众人不敢再惹这个新人，主动提出为他解答问题。井九连续发问，全是数论等无人能解的难题，半小时后满屋静默，各行其是的研究者——联盟主星实验室的老研究员、万山行星的瘦子、星际飞船上的院长——也全都毫无头绪。另一边，躲在边境战舰上的野兔原来是个军装少女，为防井九循网侵入，竟抡起斧头劈碎了舰长室的信息金属盒，物理断联，舰长瞠目结舌。井九欣赏这份决断，转头看见钟李子因写小说荒废学业被老师当众训斥，他挥手间测试仪炸裂起火，草坪大乱。回到家中，他望着装睡少女的门，若有所思。"},{"n":760,"orig":761,"title":"打造一位元气少女","people":["井九","钟李子"],"one_line":"井九暗中渡元气，把病弱少女练成元气少女","summary":"井九弄清星河联盟的修行体系：初境十二级，过六级才能当交换生，而钟李子只有四级，自幼病弱又基因改造失败，早已不抱希望。看着她夜里苦练最基础的肉身功法，他点评观火境「不是洞若观火，是隔岸观火」，她却听成了冷话。深夜他再度剑意稳住她血中的毒素，顺手修好恒温器，又以指尖渡入元气，临走时剑火烧掉了沾灰的运动服。翌日清晨钟李子神清气爽、走路带风，自觉浑身充满名为希望的力量。井九想起网上看过的漫画，暗想难道这就是元气少女的来由。"},{"n":761,"orig":762,"title":"关于流程这种事情……","people":["井九","钟李子"],"one_line":"井九散书引飞升者，伪造批文催生游戏项目","summary":"井九把《大道朝天》偷偷散布到星域网各大论坛，想引出藏匿的飞升者，一天过去却无人讨论，应者寥寥。漩雨游戏公司一个濒临裁撤的工作室里有员工看中此书，认为适合改编成游戏，但购买版权的报告压在大公司流程里无人理会。井九等不及，直接入侵漩雨内网，把报告提到最上面，伪造七个部门负责人和董事长的电子签名与「同意」批示，让项目瞬间获批。他畅想着游戏推向全联盟后，飞升同道尤其是雪姬会循着小说找来。晚上他开了瓶无味的麦酒递给钟李子，半夜她狂喜惊呼——自己突破五级了。"},{"n":762,"orig":763,"title":"一瓶麦酒祝通关","people":["井九","钟李子"],"one_line":"钟李子考核连跳两级夺第一，井九悄然离去","summary":"钟李子突破五级后终于绷不住大哭：母亲早亡、父亲自杀、自己有病随时会死，满头银发是染的，用来掩饰弱小。井九确定她会成为交换生并有钱做基因优化，递上一瓶啤酒。定级考核中她低重力项目表现出色，却遭同学嘲讽靠地下街区占便宜；元气测试时她在漩雨公司赞助的新仪器上测出观火境六级，全场震惊，当日考生仅七人达标。实战前她在人群里找不到井九，却在远处小门认出那个身影，安心微笑，记着「只要快就行」，一招放倒自负的对手。井九确认她可以了，悄然离开。"},{"n":763,"orig":764,"title":"人生如酒，总会有点涩","people":["井九","钟李子"],"one_line":"钟李子名额被顶怒怼校长，漩雨公司找上门","summary":"钟李子实战一招制胜夺下定级第一，井九确认她已上路，独自查漩雨内网，发现那纸伪造的董事长批示惊动了总裁层，动静有些大。她拿了第一却在次日被告知交换生名额给了别人——校长早受了请托。她闯进校长室对质，搬出历届交换生的先例逼问书面告知，最后留下一句「因为我不能变成你这样的人」，摔门而去。前夜她曾请井九吃烧烤庆祝，井九举杯庆贺自己解开了这个世界所有能解决的物理问题；她醉倒前认真道谢，井九答「你应该知道我是在利用你」。她离开校长室时，漩雨公司的飞行器正落在校园草坪上。"},{"n":764,"orig":765,"title":"强者不需要表情","people":["高树","钟李子","井九"],"one_line":"高树威逼校长还回名额，钟李子答应售出版权","summary":"漩雨公关顾问高树被总裁紧急召见：董事长批示疑点重重，总裁认定钟李子与岳父有隐秘关系，命他不动声色买下小说版权并讨好这位少女。高树得知她刚到手的交换生名额又落选，赶到学院拦下名单，威胁校长若不改回来，学院明年起将再无交换名额。校长只得拼命追回钟李子。当晚她向井九道谢，说漩雨施压让校长以社会成就加分为由把名额还给了她；她没答应卖版权，说一切听原作者的，井九让她答应下来，称他们是在讨好你，还坚称小说本就写得好，只是她不信。三杯米酒后她再度醉倒，井九扛人回家。"},{"n":765,"orig":766,"title":"女祭司的初选","people":["井九","钟李子"],"one_line":"井九看女祭司初选，全会考题再添年月之惑","summary":"宿醉的钟李子醒来问井九要不要署名权，井九称自己有钱，反问若作者是他漩雨还会帮拿名额吗；她猜他想引起上层大人物注意。井九打开电视，正逢星门女祭司换选初选——现任女祭司年老将死，十月水祭将由她指定继承者，行星各片区先行初选。考题偏重冷门历史，井九全会；第二轮考验空间解构与重构能力，对大脑开发程度要求极高。钟李子支持的温婉女孩落选，她怒骂黑幕。井九注意到胜出的黑发少女有着极致容貌。他又在写有「年」「机器人」的纸上添了「月」字，追问为何一年十二个月、三百六十五天，钟李子答不上来。"},{"n":766,"orig":767,"title":"跃出海面的巨鲸","people":["井九","钟李子","高树"],"one_line":"钟李子赴星门大学，井九深夜攀崖飞出地底","summary":"钟李子要去星门大学做半年交换生，想出租公寓挣钱，井九断然不许，补她租金又从游戏厅老板账户转来一大笔信用点，说这是利用她的报酬。她抱住他道谢，他像木头人一样任她抱。临行前她送他一个双肩包，井九把银色电脑装进去，把软椅留在了家里。飞行器载着她升空，高树暗中打量这个初次离地却异常平静的少女，越发确信她与董事长关系不凡。飞出云雾的一刻她看到太阳，想起纪录片里跃出海面的鲸鱼，不知自己会否同样落回海中。井九随后沿钢铁崖壁飞升，短暂关闭沿途监控，在朝阳跃出山脊时抵达第二层。"},{"n":767,"orig":768,"title":"当你凝视的时候","people":["井九"],"one_line":"井九潜入博物馆密库，亲见远古机甲遗存","summary":"井九抵达第二层的守二都市，沿途了解这颗行星的防御：暗物之海入侵时地壳侧壁的机器会组成巨大引力场，地表将被放弃——数十年前暗物之海摧毁地表九成建筑、杀死数百万人，地底却毫无损失，政府机构由此迁入第二层。他去歌剧院听了出女祭司从远古文明中挖掘改编的歌剧，随后凭新旧工程图的对比找出博物馆隐藏库房，破解合金墙与复杂锁具，见到玻璃罐中半埋泥土的远古机甲。人机对视，远古文明确实存在的真相砸在他面前。"},{"n":768,"orig":769,"title":"嘀！嘀！嘀！","people":["井九","钟李子"],"one_line":"井九自制中继戒指，赠钟李子木椅作信物","summary":"确认远古文明确实存在、并非联盟骗局后，井九走进美术馆，在一幅女祭司临摹自远古的向日葵前驻足——那位女祭司画完便离世，他疑惑原画里束住花束的东西为何没有被画出。随后他在押井区攻破一家网络安全公司，自制成一枚贴身中继器戒指。想到飞升者若循小说找来而自己不在，性子暴戾的雪姬可能顺手杀了钟李子，他赶往星门大学酒店，递给刚出浴的她一个木雕作防身信物。她感动收下，又不解信物为何雕成一把椅子。"},{"n":769,"orig":770,"title":"我就是神明","people":["井九","主教","工装布刺客"],"one_line":"井九自称为神，徒手接下七十公里外狙击弹","summary":"井九走进星河联盟唯一的宗教场所传火塔，无名的神明受万民叩拜。一位主教主动布道，称信神不是神明的需要，而是人的需要；井九让路口指示灯熄灭，说了句「我就是神」便走入人海。随后他在广场察觉杀意：七十公里外的地壳山脉深处，一名伪装成政府维修工的列星境枪手，用电磁加强枪射出足以摧毁大厦的违禁高燃子弹。井九抬手以掌心硬接，子弹在他掌中爆成残渣，衣袖被震碎。枪手目睹这一幕几近崩溃，无法相信有人能徒手挡下这种攻击。井九甩去残渣，已锁定对方位置。"},{"n":770,"orig":771,"title":"第一次正式的较量","people":["井九","工装布刺客"],"one_line":"井九擒获刺客逼问，对方脑中自毁装置爆头灭口","summary":"井九借悬浮列车之风瞬息赶到数十公里外的春原，伸手拦住即将关闭的电梯。刺客认出这个徒手接住高燃子弹的怪物，自知不敌，先后触发皮下自毁电路与微型枪械，却被井九尽数阻止——他捏住那粒乳白色子弹，淡淡道「你会死的，但要等会儿」。井九以玄阴宗搜魂手读取其意识，刚捕捉到两个人名与十几个数字，刺客的头颅便轰然自爆。联盟军方会在特殊成员脑中植入装置，一旦察觉意识入侵便自动起爆。井九确认此人来自军方，剑火烧净血污，又去里海洗净身体，换上钟李子手洗过的蓝色运动服。"},{"n":771,"orig":772,"title":"在井底观天","people":["井九"],"one_line":"井九潜入地底实验室查卷宗，锁定敌为飞升者","summary":"井九冷静梳理：漩雨的内部斗争不至于动用军方，最大嫌疑是他苏醒的实验室一直在监控自己。他走进星门管理局，乘直行通道直达靠近地心的重点实验室——星门基地仿佛为此实验室而存在。他入侵内网获得权限，找到自己苏醒的房间，又顺着卷宗痕迹追踪：研究报告层层加密送往科学院，再到军方后线索中断，而实验室与政府竟无任何寻找他的计划。用工装刺客的数据反查也一无所获。排除所有可能后，他望向窗外虚假的天空，认定想抹掉他存在的只能是朝天大陆的飞升者，心想那是个白痴。"},{"n":772,"orig":773,"title":"破茧","people":["井九","江与夏","钟李子","汤谷"],"one_line":"井九控科学家布悬赏，江与夏寻访小说作者","summary":"井九在实验室用两心通控制金发科学家汤谷，读走了液态金属机器人相关的资料。他在隐网雪屋发出悬赏：谁能查清工装布刺客的来历，他便替对方办一件事，遭「野兔」出言讥讽。与此同时，科学院院长正追踪这个神秘新人，在雪屋外撒下数据尘埃，还研究着联盟无法触碰的「破茧者」禁忌，追踪在井九察觉后诡然中断。井九感觉被窥视，回到钟李子身边。此时女祭司候选、神学院的江与夏来星门大学报到引发全校骚动，她径直走到钟李子面前问：「请问……你就是大道朝天的作者吗？」"},{"n":773,"orig":774,"title":"银杏大发","people":["井九","江与夏","钟李子"],"one_line":"江与夏结交钟李子，井九等战舰现身后得线索","summary":"江与夏自称喜欢《大道朝天》，与钟李子交换联系方式。她实为祭司家族重点培养的传人，奉长辈之命接近与漩雨项目关系密切的钟李子，但读完小说后已真心成为景阳真人的狂粉。井九整日躺在草坪晒太阳，被全校当作怪人围观，实则在等云层后的战舰动手——他已在驻星门战舰核心电脑写入程序，飞升者若动用战舰，他便反杀过去揪出对方。夜里他理清刺客事件的本质：那一击是试探加警告，对方想确认他的身份，又怕小说暴露朝天大陆的秘密，此人已在此生活多年不愿被打扰。他偏不罢休。隐网里雾里人发来消息：查到了。"},{"n":774,"orig":775,"title":"在星海间飞舞的蝴蝶","people":["井九","冉寒冬"],"one_line":"野兔查明刺客属神秘蝴蝶组织，索得井九真名","summary":"隐网摩天轮里，雾里人告知井九：刺客名叫陈信，本是十一年前战死于暗物之海的联盟星际战士。她提到两百多年前军方一个无番号特殊部门，现场都留蝴蝶痕迹，还毁过一颗行星；两百年间约一成联盟大事背后都有蝴蝶影子，她判断陈信正为其卖命。索要报酬时她要求井九说出真实身份，井九自报姓名并画出自己的脸。原来雾里人正是被他追过的「野兔」、战舰电脑维修官冉寒冬，她发现画像只是游戏图，怒骂骗子，申请休假回星门基地探望「远房表姨」。"},{"n":775,"orig":776,"title":"夜观星象，昼望云气","people":["井九","钟李子","江与夏"],"one_line":"井九找到家乡太阳方位，江与夏主动接近井九","summary":"漩雨总裁吩咐高树照顾好钟李子，并请她亲自为游戏角色做初设。井九承诺治好钟李子的病，随后借野兔战舰的军事行动记录，结合自己的飞行速度与时间，推算出家乡太阳的方位：那是一颗偏远黯淡的白色火球，看得到却回不去，更远处便是暗物之海所在的宇宙黑域。他又望着星核方向写下「年」「月」「机器人」等词，思索远古文明与飞升者们的去向。钟李子因与江与夏交好受到全校关注，两天收到七封情书。江与夏抱着纸质书走到草坪上那个遮头掩面的怪少年身边，问他是不是钟李子的朋友，井九没有理她。"},{"n":776,"orig":777,"title":"仙人抚顶","people":["井九","钟李子","江与夏"],"one_line":"井九深夜以剑意为钟李子驱病，江与夏生好奇","summary":"江与夏好奇井九在看什么，他无法作答——他在看云层后的战舰，等那位飞升者出手。她的生命功法透出水系气息，井九因白真人的缘故不喜欢，让她坐远些，她只得抱膝坐在银杏树下。钟李子坦言学业压力，同学幼时便做基因优化与知识输入；又炫耀收到七封情书，提醒井九离江与夏远些，说自己从小独立、识人很准，还说自己真的有病，井九答「我真的有药」。夜里他让她陷入沉睡，掌心发出凌寒冷冽的剑意从头到脚扫过她全身，床头杯里的水瞬间冻裂成冰——他在以剑意替她驱病。"},{"n":777,"orig":778,"title":"风吹雨散你没事","people":["钟李子","井九"],"one_line":"体检证实钟李子绝症痊愈，她喜极而泣","summary":"钟李子醒来发现身体酸痛却充满力量，水杯碎在垃圾桶里，她追问井九昨晚对自己做了什么，井九只顾睡觉。井九连日在雨中草地沉睡，成了全校闻名的怪人；钟李子逃课跑来为他撑伞。数日后他恢复，提出教她更有用的修行功法，她却摇头，坦白自己患血液四型y类重病，即将去地面参观需体检，怕学不了那些东西；井九说「我说你没事，你就没事」。体检时医生惊讶发现她的指标全部正常，调取三家医院原始病历后确认：她的病好了，可能是当年一次基因优化未完全失败、如今被偶发激活。钟李子泪水不受控制地流了下来。"},{"n":778,"orig":779,"title":"神明不需要","people":["井九","钟李子","汤谷","主教"],"one_line":"钟李子决意参选女祭司，灰幕后神谕选中井九","summary":"摆脱死亡阴影的钟李子兴奋地扑倒井九，被冷漠推开，她宣布要去传火塔还愿感谢神明。井九唤来被两心通控制的地底科学家汤谷，得知自己的卷宗在院长来访后无人再碰，打算等雪姬出现后去主星科学院深挖。钟李子受主教引导，郑重决定参加女祭司征选，这是她十六年来最有勇气的决定。当晚井九潜入主教豪宅搜魂，发现主教曾去地面一座巨塔，跪在巨大灰色幕布前领受神谕：幕布后的声音命他「去侍奉那个少年吧」，还说神明离开前留下的最后意志是寻找新的神明——「我觉得就是他」。"},{"n":779,"orig":780,"title":"参选","people":["井九","钟李子","江与夏","崔主任"],"one_line":"钟李子报名女祭司征选，参观时雷神机甲异动","summary":"女祭司征选考查学识、品德、武道修为与意志力，新祭司将在十月水祭上诞生。钟李子不顾崔主任「这个世界没有奇迹」的劝告，以「这个世界有奇迹」作答，正式报名。数日后交换生赴地表参观本校，学生们第一次亲眼看到草原与跃出地平线的朝阳。在机甲系三号实验室，他们见到了曾在庭门之战斩杀三个暗物之海怪物的巨型机甲雷神。井九随行其间，仍留意着隐网与家世不凡的野兔动向。参观未毕，雷神机甲竟在无人操控下自行启动，抬臂指向天空，实验室一片混乱，有女生当场吓晕。"},{"n":780,"orig":781,"title":"远方的巨塔","people":["井九","钟李子","江与夏"],"one_line":"井九窥探雷神机甲后独行草原，直抵女祭司巨塔","summary":"机甲异动实为井九所为：他割开线缆接入内网控制雷神，借启动之机扫描学习，确认这种核能巨型机甲威力近似白渊的光栅，防御却挡不住他的手指，笨得像头巨猪，他挥手便可毁掉它。风波过后崔主任带队前往祭司家族庄园，众人这才知道那庄园竟是江与夏的家；她不愿面对嫉妒的同学，拉着钟李子躲开去喝茶。井九独自登上地表深处的沙丘，遥望草原上那座他在主教意识里见过的宏伟巨塔——十七根巨石柱撑起，女祭司就住在里面。"},{"n":781,"orig":782,"title":"女祭司","people":["井九","女祭司"],"one_line":"井九潜入祭堂见女祭司，被认作新神明","summary":"井九潜行两百公里穿透地底，从祭堂禅园的古井中现身。他隔着如天空般的灰色幕布见到星门女祭司，被问是否相信神明存在，他答「不」。女祭司坦言：远古文明与暗物之海同归于尽却安排好了自身复苏，能知一切、算到一切者便是神明；神明在世间留下脚印，博物馆那台机甲正是其一。她透露女祭司一脉靠口口相传铭记远古文明，三千人如今只剩七百余，她负责艺术；神明离开前留下的最后意志是等待新神出现，而井九无所不能又来自另一个世界，从他在实验室苏醒起她便留意着他，认定他就是新的神明。"},{"n":782,"orig":783,"title":"神明也有妹妹","people":["井九","江与夏","钟李子","女祭司"],"one_line":"女祭司泄露神的妹妹，江与夏弃选托钟李子","summary":"女祭司不肯尽述所知，只透露世上曾出现过与井九一样的人，但他们不如他强、也未经主星那位认可，故不算新神。井九问起向日葵，得知那是仿作，真迹在主星远古遗址，作者据传是神的妹妹——神也有家人。与神对谈让女祭司紧张到了极点。另一边，江与夏带钟李子回庄园，坦白不想做女祭司、不愿当家族傀儡，本打算征选前逃走，转而恳求钟李子务必成功，并赠上毕生所学的祭司课程存储器。井九现身，认可她真心相待。夜里井九提醒女祭司一脉很苦、终身不能生育，钟李子说自己从未想过留下后代——她的病是遗传的。"},{"n":783,"orig":784,"title":"真正的新生","people":["井九","钟李子"],"one_line":"井九夜灌祭司知识，钟李子乌发重生答史题","summary":"井九梳理对话，推断朝天大陆与星河联盟都是远古文明与暗物之海同归于尽时留下的后手，是两条不同的路，如此手笔近神。他读了江与夏给的存储器，随后以剑元配合两心通，把祭司知识直接灌入熟睡的钟李子脑海。她在梦里见到神，被问是否愿终生侍奉做女祭司，她答应了，还在红光里泡了场如岩浆浴般舒服的澡。醒来后她精力充沛，发现发根长出健康黑发——病是真的好了。她本要补染银发，井九让她换色，选了红色天鹅绒。课堂上女教授考问北固原战役细节，她脑中忽然浮现大段记忆，对答如流，惊呆众人。"},{"n":784,"orig":785,"title":"十月水祭开始","people":["井九","钟李子","江与夏","夏先生"],"one_line":"十月水祭开幕，红发钟李子惊艳登场","summary":"十月水祭正日，数十万民众汇向草原深处的祭堂，战舰以光柱照明，整颗行星关注着新女祭司的诞生。百名候选少女白衣肃立石阶，钟李子一头红发如火，格外扎眼，几位大主教皱眉不喜；祭司家族族长夏先生不满侄女江与夏与她并肩，又见井九被守二都市主教恭迎引入高处，心生警惕。井九躺在灰色幕布边缘的椅子上俯瞰全场，认出石柱后跪着一名军装少女。征选开始，主教致辞，女祭司身影在幕布上显现，全行星的人们跪拜如潮，井九独坐高处不为所动。"},{"n":785,"orig":786,"title":"整颗星球都在看着这里","people":["钟李子","江与夏","莫衷","井九"],"one_line":"百美候选入场，背书考核形同儿戏引疑","summary":"百名候选少女依序入场，热门人选莫衷、溪与江与夏相继亮相，而来自民生街区的钟李子是史上第一位走进正式征选的地底少女。整颗星球都在观看：新世学院食堂沸腾，陆水浅酸楚落泪；民生街区夜市围着烧烤摊老板的电视，丹先生与游戏厅老板也认出了她。第一项考核宣布：二十分钟内背完一本未读过的神学典籍，答不上者淘汰。这对经过基因优化与知识输入的天才少女们并非难事，众人却觉过于简单。莫衷自信满满，钟李子则紧张得靠井九敲扶手的频率调整呼吸。规则宣布后，江与夏忽然出声：这本书我看过，请换一本。"},{"n":786,"orig":787,"title":"能饮一杯无","people":["钟李子","冉寒冬","江与夏","莫衷","井九"],"one_line":"冉寒冬武道碾压百美，酒字考核无人能解","summary":"背书考核里江与夏、溪、莫衷对答如流，钟李子有惊无险过关，仅两名少女出局。第二项武道考核，请出的军方高手竟是位约二十岁的少女军官——第七军区的冉寒冬，连行政长官都起身寒暄，众人愕然。结果更骇人：百名少女无一人能撑住片刻，莫衷、江与夏相继落败，钟李子被一记摆拳击飞十余丈。幕布后冉寒冬向姨母女祭司抱怨星门没人才。第三项考核的谕旨只有一个由「静」字变来的「酒」字，教士们送上海量无名美酒任少女随意饮用，无人明白考的是什么。自知酒量极差的钟李子干脆倒满一大杯谷物烈酒，闭眼灌了下去。"},{"n":787,"orig":788,"title":"醉里挑灯背书","people":["钟李子","江与夏","莫衷","夏先生"],"one_line":"醉后背书钟李子惊艳全场，登记问话藏机","summary":"钟李子一杯烈酒下肚当场醉倒，全场哗然。半小时后考核结束，醉倒的三人却未被淘汰，夏先生随即宣布考核正式开始——桌上摆回先前读过的典籍，由教士随机抽查背诵。武道挫败加酒精侵蚀，少女们纷纷卡壳接连出局；莫衷开口便把神明三定义背反，险遭淘汰；江与夏不愿圣洁之位落入莫衷之手，开始认真作答，一字不差。钟李子被主教以秘药唤醒，捧青瓷钵的水洗了脸，高喊「来吧」，起初磕绊，越背越流畅，表现惊艳，全星球为之欢呼。最后的登记问话像有魔力，莫衷微笑不语，江与夏滴水不漏，醉上加醉的钟李子只是傻笑摇头。"},{"n":788,"orig":789,"title":"李子红了","people":["钟李子","莫衷","江与夏","井九"],"one_line":"钟李子爆冷入围三强，全星球狂欢见井九","summary":"钟李子酒劲上涌，当众吐进青瓷钵，随后最终三人名单公布：江与夏、溪、还有钟李子——地底少女首次走进女祭司征选最终名单，整颗星球陷入狂欢，新世学院砸了桌椅，烧烤摊老板被抬着游行。莫衷当场崩溃质问不公，夏先生淡淡给出理由：最后考核时她喝的酒比你多——规则未定，酒量也是一种品质。莫家家主发难，漩雨总裁罕见出面为钟李子说话，知情的大人物们明白莫家必败；涉事教士被罚去神学院「思过」，实为嘉奖。三位少女入内殿沐浴更衣，准备拜见女祭司听候抉择，却发现露台上立着井九。钟李子明白一切全因了他。"},{"n":789,"orig":790,"title":"女祭司的继承者","people":["井九","女祭司","钟李子"],"one_line":"钟李子获定女祭司继承者，祭堂外杀机起","summary":"井九坐到女祭司身旁，先问钟李子是否确定要当女祭司，她反问他是否一定要孩子，得到「不要」的答复后说「那我就要做」。女祭司微笑定局：继承者从她决定参选那一刻便已选定。谕令公布，星球狂欢，莫家家主面色阴沉。女祭司私下道出困惑：钟李子天赋普通、与漩雨董事长毫无血缘，神迹为何落在她身上？井九答只是刚好遇见她，不在乎她平凡与否。江与夏留在后殿向他问好，他因白早的旧例始终不理。忽然守二都市主教匆匆来报祭堂外有问题，女祭司拜求道「请您怜惜」，井九淡淡应道：「我会少杀几个。」"},{"n":790,"orig":791,"title":"夜色里的线","people":["井九","莫家家主","夏先生","冉寒冬","钟李子"],"one_line":"莫家布局围杀祭堂，井九夜遇无形之线","summary":"冉寒冬掀幕而入，报告舰队出现异常启动，见井九便问他是谁，井九不答，只对钟李子说了声「走」。与此同时莫家家主把夏先生骗到草原大树旁，借祭司家族之名调离祭堂人手，扬言那几个敢离堂者必须死，但不敢动女祭司与那位少女军官；夏先生冷笑他不知祭堂底蕴，靠树闭目等他送死，莫家家主喃喃自语「有些人的力量我是知道的」。井九带钟李子走下石阶，夜色里竟被无数无形之线拦住去路，脸与衣衫上顿时浮现几道细线割痕——那线极细极利，连他的皮肤都生出刺痛。"},{"n":791,"orig":792,"title":"洞穿一切","people":["井九","莫家家主","夏先生"],"one_line":"井九斩线破围屠灭莫家私军，战舰轰至","summary":"井九识出那些线与祭堂灰色幕布同属超微颗粒材料，随手挥剑斩断满空细线。莫家三十五名精锐立刻集火齐射，弹雨却被一道无形屏障挡在五米之外；井九从子弹判断对方与军方无关，一道剑意如蛇掠过沙丘，二十余名流金境私军瞬间毙命，额鬓处只余精确如手术的血洞。莫家家主的保镖刚要出战便被洞穿头颅，家主惊惧逃向夏先生呼救，话音未落也栽倒在地——最后一个血洞终结了他。夏先生自语神是公平的，却见远方夜空亮起数十道光柱，战舰的高能激光正轰向祭堂。"},{"n":792,"orig":793,"title":"逆光而行的男人","people":["井九","钟李子"],"one_line":"战舰激光轰祭堂，井九潜入太空查内鬼","summary":"井九只杀想杀自己的人，毁掉其余飞行器引擎。察觉激光袭来，他反手把钟李子推回祭堂，自己留在原地。三艘战舰中有一艘忽然调转炮口，数十道高能激光无差别轰向祭堂，全靠引力场屏障堪堪挡下，地面被烧成玻璃。井九趁能量混乱瞬移至太空，附上那艘战舰外壁，破开检修盖接入内部系统：发射命令者的权限极高，直接越过整套发射程序，所有监控在发射瞬间被抹灭，查不到此人痕迹。他还在战舰数据通道最深处听到一声幽冷如井底的叹息——那是个能威胁到他的存在。井九没有轻举妄动，决定先控住战舰慢慢再查。"},{"n":793,"orig":794,"title":"仿佛一切并未发生过","people":["井九","钟李子","高树"],"one_line":"井九安然归来，漩雨惊觉岳父不识钟李子","summary":"井九化作流星落回，验过莫家家主尸体无所得，换上死者衣物，随后安然现身祭堂前——众人以为他已死，主教跪倒，钟李子惊喜扑进他怀里。回到酒店，漩雨与星门大学联合封锁四周，高树汇报莫家产业已被政府接管，管理局打算把激光炮说成对新女祭司的庆祝。总裁致电主星的岳父表功，却惊闻对方根本不知道钟李子的存在——原来从小说到批示都是有人做的手脚。总裁当机立断不查不问，只下令把女祭司侍奉好，并送来最新游戏舱请原著作者做人物初设。井九与钟李子如常度日，全行星电视都在重播征选，无人知晓暗杀。"},{"n":794,"orig":795,"title":"神一样的待遇","people":["井九","钟李子","冉寒冬"],"one_line":"钟李子享神级待遇，冉寒冬识破追兔之人","summary":"全网热议新女祭司，钟李子醉倒吐酒的样子成了萌点，无人说她坏话。井九提醒她成为女祭司「还早」——上任女祭司还在世，而他不会让对方早死。漩雨与星门大学连夜无声改造酒店整层，添了酒吧、健身房与影院，清晨又送来比飞行器还贵的新型游戏舱，请作者做《大道朝天》人物初设，井九破例应允。守二都市主教携冉寒冬登门拜访，主教进门便跪——跪的是井九。冉寒冬更在露台看清了他的脸——正是摩天轮里那张被她当成游戏图的面孔。她颤声问对方到底是谁，井九答「我是追兔子的人」。"},{"n":795,"orig":796,"title":"让战舰先下来","people":["井九","冉寒冬","钟李子"],"one_line":"井九借冉寒冬查内鬼，为偷懒召战舰下地","summary":"冉寒冬确认自己「野兔」的身份早已暴露，与井九在隐网摩天轮对质。井九交给她烈阳号的绝密数据，请她协助找出下令攻击者的误差值——因为她也想查。汤谷被派作她的副手，十余天里对照战舰的一切细节。祭堂向军部施压，舰队被迫让烈阳号降落地面受查。这十几日钟李子困守酒店，井九则占着游戏舱为《大道朝天》捏脸。冉寒冬查出百余新调官兵可疑，判定关键人物做过整容手术且饭量极大。她提醒井九那人绝不会趁战舰降落逃跑，井九却说他要战舰下来，只是因为自己懒得去太空。清晨他对钟李子说出门杀个人。"},{"n":796,"orig":797,"title":"让你先飞会儿","people":["井九","方响"],"one_line":"井九舰上认出死者方响，对方亮出装甲","summary":"井九换上军服混入降落在专属二区船坞的烈阳号。战舰官兵被禁足多日怨声载道，餐厅集合点名正是清查良机。他以剑目扫视数百张面孔，找出十七名整容者，锁定一名沉默独食的中年军官——那人做过削骨手术，体内更藏着与职位不符的强大力量。井九在意识里复原其本来容貌，对照军方死者数据库，确认此人就是本已战死的方响：前星链舰队强袭营指挥官，列星上境。面对质问，方响平静承认身份，随即爆发威势，身上覆上一层异种合金战斗装甲，硬生生挡下井九的十余道剑光——这是第一个挡住他剑光的人。方响旋即破舱飞上高空。"},{"n":797,"orig":798,"title":"画面太美不忍看","people":["井九","方响"],"one_line":"井九太空碎甲擒元婴，证实其为飞升者弟子","summary":"方响驱动战斗装甲以激光狙击，井九张掌以身为剑面把光接住反送回去，装甲受创坠山。方响丧失战意逃出大气层，井九跳上太空追击，军装被大气磨成灰烬，星光下不着寸缕宛若神明。宇宙中激光齐射尽数落空，井九剑光连斩，异种合金装甲碎成漫天碎片雨。方响凭护体屏障幸存，推开碎片欲战，井九穿雨而至，一掌碎其头颅，同时抓住自爆芯片——碎裂的躯体内竟飞出一尺高的元婴。井九叹「果然是飞升者的弟子」，以承天剑意困住元婴施搜魂手取走情报，随即用剑阵将其斩灭，化作剑光返回行星。"},{"n":798,"orig":799,"title":"破茧者","people":["井九","女祭司","冉寒冬"],"one_line":"破茧者即飞升者获证，井九又问出李将军","summary":"井九自祭堂古井归来，女祭司侍奉更衣、奉上温茶。他问出关键秘密：破茧者是什么？女祭司答就是像他一样来自另一个世界的人。井九由此确认破茧者即飞升者，并推断方响的战斗装甲来自朝天大陆的储物法宝，此人正是飞升者的弟子。他向冉寒冬出示自爆芯片，告知方响已死无痕，并提出要军部权限——他不想惊动网络深处的幽灵，冉寒冬说要先问父亲。随后他挥出一道清新剑意，抚平女祭司常年重复记忆造成的精神损耗，为她延寿。夜里他循芯片搜入星域网看到蝴蝶铁门等画面，醒来问出「李将军」——当今军部统帅。"},{"n":799,"orig":800,"title":"我不孤单，只是有些烦","people":["井九","钟李子"],"one_line":"井九锁定李将军嫌疑，入游戏重历景阳新生","summary":"李将军是星河联盟军部统帅，无人知其全名。井九意识到两次暗杀都有军方影子，那个飞升者竟可能是这个世界的主宰；朝天大陆姓李的飞升者，他想到血魔教祖师、蓬莱岛散修与陈屋山石人。幕后之人骚扰令他心烦，恰逢游戏舱初设完成，他破天荒进舱：以承天剑阵把精神压至九万分之一，选景阳角色重回朝歌城皇宫出生，见父母兄长，听道缘真人说「青山剑宗就要在你手里发扬光大」。他不肯改变故事走向，只在青山听猴叫、三千院听琴，一坐九天不出舱，漩雨紧急开启内测。第九天他终于出来，钟李子却觉得他有些不一样了。"},{"n":800,"orig":801,"title":"再一次离开","people":["井九","钟李子","女祭司"],"one_line":"井九入游戏再会故人，将偕钟李子赴主星","summary":"井九九天游戏后第一次真正睡着。钟李子回放全程：他在游戏里不与任何人互动，只寻访故人，于三千院听琴、果成寺听钟、青山听猴叫，与前代神皇、柳词、太平真人、连三月等并肩而坐，最牵挂的赵腊月反而没多坐。漩雨总裁来信请求角色肖像授权，井九随意应允。钟李子担心他分不清真实与虚假，井九答：也许在这个世界里他们是虚假的，在别的世界里却真实存在。他宣布将与她同赴主星，去找一个人——然后杀了他。随后二人趁消防演习清场参观博物馆与美术馆，女祭司介绍那台二十三万年前的远古机甲：它本身就是艺术。"},{"n":801,"orig":802,"title":"一舰西来","people":["井九","钟李子","冉寒冬","西来","溪"],"one_line":"井九乘烈阳号赴主星布局；西来在林登矿星现踪。","summary":"井九到博物馆看那台被埋在泥土里的旧机甲，肯定它动起来时是白色。随后他随新任女祭司钟李子登上烈阳号战舰前往主星，凭戒指拿到军部权限，打算完全控制这艘曾炮击祭堂的战舰；他在纸上写下年、机器人、标准时间、日食、蝴蝶、有灵魂的超算核心等词，疑惑西来、曹园与雪姬为何百余天毫无消息。舰上，冉寒冬以秘书自处，提醒他小心军网核心里的幽灵般存在。另一边，西来飞升后随采矿飞船落到偏远的林登矿星，不眠不休学习数十日，隐姓埋名，此时一艘无声的战舰正破开大气层自西而来。"},{"n":802,"orig":803,"title":"世人称我李将军","people":["西来","李将军"],"one_line":"西来矿星遭围攻，李将军现身定住万物一剑。","summary":"西来飞升后与曹园分道，破开采矿飞船货厢来到林登矿星，不眠不休学习数十日，伪造身份扮作残疾操作工藏身矿区。察觉战舰自西而来，他无法启动对空防御，遂离开生活区，准备躲进藏有强放射性矿石的十三号矿仓逃亡。电磁枪与自动枪械平台先后偷袭，他以光镜护体，剑光瞬间摧毁三座平台。这时自称李将军的破茧者踏空而来，扬言此间没有天劫、要考核西来。西来出手便是万物一剑，矿石、机械、寒风尽化为剑雨袭去，却被李将军抬手尽数定在半空。"},{"n":803,"orig":804,"title":"井里与井外","people":["西来","李将军"],"one_line":"李将军破万物一剑断西来双臂，毁其神魂装盒带走。","summary":"李将军笑称好演技，激光炮群随即齐射，两人在爆炸与剑光中缠斗。西来全力以仙气凝剑抢攻，李将军却以腰间核动力炉汲取光热，仙气近乎无穷，轻易握住他的拳头，震断了他仅剩的手臂。西来自认此前的路走错了，竟输在科技与修道结合的力量上。李将军早已凭万物一剑认出他是西海剑神，警告他只要上网就会被发现，这个世界尽在破茧者掌控之中。他不愿就此杀死这等修道天才，以秘术折磨粉碎其神魂，欲将其炼成近乎傀儡的存在。西来苦苦支撑许久，最终被装进注满冰冷液体的金属盒随战舰离去。"},{"n":804,"orig":805,"title":"采矿船上的刀客","people":["李将军","西来","曹园","赤松真人"],"one_line":"李将军改造西来并印证小说；曹园化身胖船长。","summary":"实验室重启西来的神魂，他大脑已死仍不放弃，李将军下令功率调到三倍，西来发出凄厉呐喊后终于放弃，李将军吩咐给他装上最好的战斗机械臂。他翻阅小说《大道朝天》，因西来真的悟出万物一剑而确认书中故事属实，疑惑雪姬为何始终没有出现，随后得知井九在印海星云，命赤松接完那个刀客后去看一眼，强调不准弄死井九。另一边，曹园离开竹椅后很快接触星河联盟，所遇采矿船被太空海盗劫掠一空，他以道理与武力说服绝望的矿工，又为破船争取到公司挂靠，成了船长，正载着满舱矿石返回前进三号基地。"},{"n":805,"orig":806,"title":"我叫曹园，我没事","people":["曹园","赤松真人"],"one_line":"曹园斩怪物救人，赤松血雾屠城，二人反目。","summary":"曹园的采矿船降落前进三号基地，他修好船回到林间小屋，夜夜研读暗物之海的资料，觉得那些黑暗怪物有些熟悉，隐约生出某种猜测。警报骤响，暗物之海侵染降临，黑色触手撕碎采矿飞船，曹园提刀升空，一刀斩杀怪物救下基地。自称考核人的银框眼镜中年人现身，嫌逐一斩杀太慢，放出数百血珠化成血雾，瞬间杀灭林中怪物，也杀死了生活区里的全部普通人。曹园称死者为同伴，中年人嘲讽仙人不该与蝼蚁为伍，扬言为封暗物质通道死些人算什么。曹园握紧铁刀，动了杀机。"},{"n":806,"orig":807,"title":"斩开战舰的神明","people":["曹园","赤松真人"],"one_line":"曹园四刀沉街救人，硬扛核弹，一刀斩断战舰。","summary":"赤松真人以战舰主激光炮轰击曹园，被他用铁刀挡下。赤松直言考察便是要他接受牺牲的逻辑：溢出通道必须封锁，两个生活区的人今夜本来就要死。曹园要求取消命令被拒，三艘战舰放出十颗核弹。曹园赶在核弹落地前连出四刀，将整条长街连同街上的人们斩落进地底深处，随后自己躺了下去，以金身硬扛十颗核弹爆炸，重伤得面目全非，另一个生活区的人终究没能救下。他从余烬中站起，跃入夜空，铁刀刺入战舰底部，一往无前，把那艘联盟最先进的战舰从头到尾斩成两半，如执刀的神明。"},{"n":807,"orig":808,"title":"面向太阳的佛，不见星海的少年","people":["曹园","赤松真人","井九"],"one_line":"赤松捏碎铁刀，曹园重伤藏身近日行星。","summary":"赤松两指捏住铁刀，以血色松树之力将曹园的至宝震成数十万块碎片。曹园借机遁走无踪，赤松的手指却被刀意切出两道裂痕，仙躯无法自愈，被角落里的生化人少年军官提醒注意时间。联盟搜捕无果，两艘战舰启程前往印海星云迎接烈阳号，迎接里藏着什么杀机只有赤松知道。行星最靠近恒星、酷热无比的半球上，半液化的岩浆里冒出几个气泡，隐隐凝成风化石佛的模样——重伤的曹园藏在那里。烈阳号上，井九认出身旁毫无存在感的少年军官是生化人，随后警报响起，战舰再次进入扭率空洞。"},{"n":808,"orig":809,"title":"我很期待你们的到来","people":["井九","冉寒冬"],"one_line":"井九给核弹写符被冉寒冬撞见；得知西来曹园出事。","summary":"井九凭权限完全控制烈阳号，潜入核心弹药库，以剑光在数千颗核弹上刻线写符。暗中监控全舰的冉寒冬追来持枪喝止，说一颗核弹便能毁掉一座城市，井九以目光慑住她，将核弹归位锁好，警告她不要制造新问题。穿越扭率空洞后，戒指程序搜到两条新闻：林登矿星地动，现场痕迹显示有人用过万物一剑，当是西来出事；前进基地遭暗物之海侵染，联盟以核弹封锁通道，折损一艘战舰——勇到敢挡核弹、猛到能斩战舰的自然是曹园。井九预感到下一个便是自己，时隔多年生出期待。"},{"n":809,"orig":810,"title":"最后一次考察","people":["井九","钟李子","冉寒冬"],"one_line":"两艘黑舰拦路考察，井九接管烈阳号放出核弹。","summary":"烈阳号进入印海星云深处，钟李子问井九当初为何选择自己，井九心中给出的答案是：她是他在这个世界最初的因果，是精神层面的锚点。警报骤响，前方通道入口出现两艘没有军方标识的黑色战舰，拒绝通话、武器预热完毕，烈阳号被锁定。冉寒冬质问井九为何不提前示警，井九说这是他的问题自然会解决，随即以权限接管全舰、切断网络，释放并加速数千颗核弹。对方传来声音，称这只是一次考察，也是最后一次；井九回以「是的，这是最后一次了」，少女们隐约觉得他就要离开了。"},{"n":810,"orig":811,"title":"点灯的人","people":["井九","钟李子","赤松真人"],"one_line":"井九置身真空，剑光依次点燃核弹照亮敌舰之路。","summary":"黑色战舰指挥室里，赤松真人端坐血玉椅，参谋们判定太空核弹速度再快也威胁不了战舰，气氛轻松。烈阳号上，井九接过钟李子递来的茶，说出去一趟，便从窗前消失，独身立于宇宙真空。他催动剑光追上飞得最慢的那颗核弹将其引爆，借爆炸遮掩行迹，接连点燃数十颗、数百颗核弹。黑暗的宇宙里亮起数百个光点，如道旁路灯，照着前行之人。烈阳号上的少女们猜到那道光是谁——井九正孤身穿越核弹爆炸的火海，剑光越燃越亮，直奔远方敌舰。"},{"n":811,"orig":812,"title":"携万千灯火而至的一剑","people":["井九","赤松真人"],"one_line":"井九借核弹仙气加速，一剑贯穿赤松战舰。","summary":"黑舰这才发出真警报，唯有赤松真人以血色光泽蒙眼，从镜片浮现的符文里看清了穿行于核弹爆炸间的剑光，暗道有些意思。他以为对方要掩藏行迹实施狙杀，赞一声好手段，认为考察该结束了，正要发信号和平收场，却见剑光越飞越快。原来井九在核弹上刻了符文，让它们乖巧排成两列，如路灯般伸向敌舰；他在剑光前端不断吸收核弹爆炸释放的仙气，越来越快——这是他为星际战争想出的解法，只为确保自己是最强者。星云变形，火光成线，数十道剑光穿过空气、血玉椅与赤松的身躯，落地窗与合金地面尽数开裂。"},{"n":812,"orig":813,"title":"我的剑说给你听","people":["井九","赤松真人"],"one_line":"井九答出万物一剑，借曹园刀伤一剑斩杀赤松。","summary":"剑光凝成井九的身影，战舰引擎随之爆炸。赤松问这是什么剑法，井九答是自己的万物一剑，数千枚核弹也是剑；此剑靠汤谷提供的战舰核弹资料与无数夜晚的计算成形。赤松承认若非先受了刀伤，井九杀不死他。井九追问去杀曹园的是否也是他，赤松自称只是去接人；井九冷冷丢下一句「喊你去接他的人想你死」，又说他要杀我，随即道出「死吧」。赤松的血肉连同神魂魔念纸尸尽数被剑光切碎——他指间尚留曹园刀伤，青山剑与白城刀在其体内相逢，无人能承受。远处传来平静声音责他挑拨，井九答那句话正是说给你听的。"},{"n":813,"orig":814,"title":"燃烧的蝴蝶","people":["井九","钟李子","冉寒冬"],"one_line":"井九诛赤松灭黑舰，与幕后之人对话后回舰休眠。","summary":"井九早察觉有人远程注视战舰，那句挑拨逼出回应：对方称赤松放下屠刀加入事业，不该杀；井九驳其刀从未放下。对方称所有破茧者都须经考察方能成蝶，邀井九到主星见面，随即结束通话。燃烧的黑色战舰解体成漫天碎片，另一艘逃入扭率空洞，井九借残余核弹的仙气飞回烈阳号。全舰无人明白发生了什么，只知两艘黑舰一焚一逃；舰长向主教讨说法被拒。钟李子替井九更衣，见他苍白疲惫，忍不住摸了摸他的脸。这天是她的生日，窗外数千颗核弹或熄或燃，宛如黑暗里燃烧的蝴蝶。第八卷至此结束。"},{"n":814,"orig":815,"title":"苟","people":["谈真人","井九"],"one_line":"谈真人苟在大学，目睹井九主星摘帽露脸。","summary":"远古改造的田园行星天普星上，西北大学有位额头高耸的苟教授，正是谈真人。他飞升后落在此星，以三乾卦法改名苟不出，不联网不冒头，扮成普通学者进入核研院，只求先解决核动力炉微型化。他日日看新闻与网络小说，见井九的《大道朝天》把云梦山写成反派，忧心被以前的飞升者找上门；又从林登矿星地动、前进基地遭侵染的新闻里掐算出有飞升者出事，暂且不管。直到电视直播女祭司继承者抵达主星，蓝帽衫少年摘帽露脸，谈真人长叹：景阳真人，您这到底是要做什么啊？"},{"n":815,"orig":816,"title":"秀","people":["井九","钟李子","泰洋","江与夏","溪"],"one_line":"井九主星摘帽露脸举世惊艳，内务处上门调查。","summary":"女祭司继承者钟李子抵达主星，随行蓝帽衫少年井九当众摘帽，那张无法形容的脸令官员、记者与万千观众失神，直播收视曲线陡升，全联盟从此记住了这张脸。祭堂礼宾车超规格接待，军方机甲护航、戒备森严，因为烈阳号遇袭仍是绝密。泰洋主教告知诸般隐情，钟李子从此话少了许多，只照旧给井九倒茶整理衣领。车队抵达西北群山中的祭司学院，茶炉水沸之际，军部内务处军官率精锐闯入，声称奉统帅授权可调查任何人，与主教们对峙。钟李子凑近井九，红着脸低声问要不要一起逃，井九敲了下她的脑袋：有人解决，不用管。"},{"n":816,"orig":817,"title":"冉","people":["井九","冉东楼","冉寒冬"],"one_line":"冉将军解围，冉东楼坦言联盟受蝴蝶组织统治。","summary":"内务处凭军部统帅授权可调查任何人，此番闯祭司学院本是示威。一名肤色黝黑的将军早已在楼内等候，军人随即撤走。他带井九乘地下悬浮列车去见父亲，坦言内务处只是表态，自己只能为井九挡一时。这位冉将军是冉寒冬的大哥；其父冉东楼身兼主星行政长官、管委会副议长与军部副统帅，是承夜境强者。冉东楼坦言早猜到井九来历：联盟被蝴蝶图腾的神秘势力统治，李将军便是破茧者；身为祭司派，他愿赌「新神将临」的预言，也因井九够强而合作。权限是善意，交易后议，井九只须静候「那位」召唤。"},{"n":817,"orig":818,"title":"谈","people":["井九","钟李子","冉东楼","冉寒冬"],"one_line":"冉东楼道破蝴蝶组织真相；井九静候那位召唤。","summary":"冉东楼确认井九来自朝天大陆，坦言联盟上层皆知破茧者，军部统帅李将军便是其一；破茧者统治世界还需「那位」女祭司相助，身为祭司派的他愿赌新神将临的预言。他因井九够强而选择合作，权限是善意，交易后议，井九须等「那位」召唤。回到祭司学院，冉寒冬成了他的秘书。井九一连沉睡七天，时常摩挲缺损的耳垂；铁壶上的纹样，是星门女祭司照他当年所拟画面铸成。钟李子得知自己将侍奉新神，井九揉乱她的头发，说像以前那样就好。三日后浓雾清晨，他忽然说出去走走，与冉寒冬直奔首都市。"},{"n":818,"orig":819,"title":"游","people":["井九","冉寒冬","陈中校"],"one_line":"井九直闯军部大楼见李将军，陈中校早有准备。","summary":"雾散后的首都市露出太空电梯、空间站与军部大楼——那其实是一艘随时能起飞的战舰，李将军的办公室就在舰体最高处。冉寒冬靠军部停车重量、餐厅采购等信息算出李将军在楼内的概率约为七成二，井九纠正为四成三：对方八天前还在林登矿星，不会让自己太辛苦。他直言来主星就是为了见李将军，两人径直走进军部大楼。冉寒冬自嘲疯了才会带他来，井九却说自己与他约好了见面。电梯到顶，秘书官陈中校一眼认出井九，微笑称其「井先生」，说将军吩咐过几句，请他随来——对方显然早已知道他会来。"},{"n":819,"orig":820,"title":"第六章一","people":["沈云埋","井九","冉寒冬"],"one_line":"沈云埋折辱冉寒冬；井九认出李将军的故人痕迹。","summary":"军部大楼舰首的园林里，白袍公子抚琴不成，训斥将军们：三艘战舰被刀砍一艘被剑刺一艘，像一头猪。他看完井九剑光穿体的监控，赞其很强，又嘲那张美脸不过瓷偶；既然是自家人便不理他，任他沉浸在自己的故事里，祭司派抓的人杀掉便是。这公子便是沈云埋：武道学识容貌自恋皆第一，二十三岁凭核动力炉超微粒子化获星辰奖，如今有统帅级权限，传言是李将军流失的幼弟。他在茶馆捏住冉寒冬的脸出言污辱，指尖却一根根僵住——井九正从上层窗口俯视他。而井九已认出满架书的摆法与适越峰如出一辙。"},{"n":820,"orig":821,"title":"轰","people":["井九","沈云埋","冉寒冬"],"one_line":"井九一指重创沈云埋，双方立赌再战一触即发。","summary":"井九瞬移到沈云埋身前掀帽露脸，索要权限放人，并问他是飞升者后人吗；沈云埋纠正那叫破茧者，拒绝放人：知道秘密的人都要死，战舰上的人已经死了。井九平静回敬：他们死，你就死。沈云埋自陈无敌多年人生无趣，抛出筹码——井九若输，钟李子、江与夏、溪都会死。井九未被激怒，右手食指快到无人能捕捉，点向对方眉心；沈云埋的手指只来得及落在他肩头。轰然巨响，白衣如乱旗，沈云埋倒掠撞断数道墙壁，眉心渗出一滴金血；井九左肩蓝衣也多了道细口。他再次出手，第二次点向沈云埋的眉心。"},{"n":821,"orig":822,"title":"剑争","people":["井九","沈云埋"],"one_line":"井九以诸峰剑法力压沈云埋，废其双臂。","summary":"井九弃用青山剑法，只以极简一剑点向沈云埋眉心，硬拼之下对方败落，剑光破体却未能杀死他。沈云埋竟懂青山诸峰剑法：以掌心布承天剑阵抵挡，借低温射线施雪流剑法，井九以七梅剑法相克毁掉射线枪；沈云埋又用激光炮施八方雷动、以引力场为阵眼布剑阵，被井九以清容峰无端剑法锁住左手。沈云埋握住他手腕称无端脱胎于莫成峰旧剑、很好学，两人剑光缠斗，一路斩碎军部大楼，连实验室逃出的暗物怪物也被绞成粒子。最终沈云埋坐在废墟中高举双手——他的手被井九抓着，双臂血肉尽溃，露出里面繁复的金属改造结构。"},{"n":822,"orig":823,"title":"不愧青山","people":["井九","沈云埋","冉寒冬"],"one_line":"井九胜而放人，借赤松眼镜看穿云后伏舰。","summary":"沈云埋求和，承诺放人、六十天内不找麻烦，井九便松手离开。沈云埋始终保持举手的姿势，笑说因为痛、但这感觉真好。井九戴上赤松的银边眼镜——那可隐秘接入军网——看清云层后的伏舰，放话想再打一艘，吓得冉寒冬连忙劝他忍耐。归途上冉寒冬介绍沈云埋：传言他是李将军私生子，因他杀了散播者而不攻自破；此人厌恶尖端科技，却痴迷古琴与仙侠小说。井九欣赏这个把修道与科技结合得完美的年轻人——不愧是青山的人；又评他疯狂源于虚无：暗物之海也在这个宇宙里，他没有目标，也不够自信。"},{"n":823,"orig":824,"title":"不是请客吃饭，也不是钓鱼煮茶","people":["井九","冉寒冬","钟李子","冉将军"],"one_line":"井九施压祭堂，限那位三天内表态否则自行登门。","summary":"回到庄园，井九对钟李子只说是无聊出去走走；她临走时说眼镜挺好看。冉寒冬独处时才后怕发抖，恐惧既来自沈云埋的疯狂，更来自井九随时可能同归于尽的疯狂。官方新闻把军部大楼事件定成投降派恐怖袭击，声称无一军人牺牲。楼下再起争执：冉将军与主教质问井九为何擅自去首都特区，甚至怀疑他要挑起军方与祭堂的战争。冉寒冬以秘书身份回击，抛出「沈云埋今天差点死了」的真相，震住众人，并限祭堂与那位三天内表态，否则井九会自己去见她。井九认可这是自己的意思，但嫌三天太长：又不是钓鱼，我为何要有耐心。"},{"n":824,"orig":825,"title":"那位","people":["井九","那位","冉寒冬","冉东楼"],"one_line":"祭堂请柬至，井九入极北引力场拜会那位。","summary":"政府借恐怖袭击名义强力清剿投降派，沈云埋率星锋舰队离京，云集号指挥战舰却秘密驶向主星。祭堂请柬终至，井九应邀前往极北高原：那位是人类重生后第一位女祭司、远古火种的持有者，所有女祭司皆其学生，大人物见她都须跪吻脚背，无人知其姓名代数，只称「那位」。飞船穿过引力场凝成的巨大雪球，内有青山碧湖；大人物们守候湖畔，冉东楼却听女儿说：井九根本不是来求那位认可的。井九乘渔船穿雾登上彼岸，走进一座与世隔绝的远古文明早期城市遗址，黑车里传来少女的声音：这是我最初感受的世界，也是我最怀念的时光。"},{"n":825,"orig":826,"title":"如画的少女","people":["井九","那位"],"one_line":"那位化身少女接谈，井九追问标准时间之源。","summary":"名叫飞的少女白衣如瓷、毫无生气，井九明白这是那位远程对话的傀儡，如同当年与雪姬的神识交流。他开门见山问出此行真正的疑问：星河联盟的标准时间从何而来？少女答：远古文明起源于一颗行星，标准时间即那里的规则；月源于其伴星；食日传说也与朝天大陆一致。井九追问「我们那里是哪里」，少女只说神明也无法创造世界，最多只能发现新世界，又讥讽他与其他飞升者并无不同。井九把脚伸进温泉，称自己没有知觉，直言：我与那些飞升者终究是不一样的。少女唇角缓缓牵起诡异的笑：你想说服我，你与我是一样的？"},{"n":826,"orig":827,"title":"浓雾乍破","people":["井九","那位","冉东楼"],"one_line":"井九与那位论存在与虚无，点破她需要自己。","summary":"井九坦言来意是修行：飞升是为了出来，修行是为了存在。少女称时间之外没有时间，暗物之海也只是此世的一部分；井九答不信时间有终点。少女透露沈云埋五岁便说过同样的话，十八岁在此痛哭一夜才变成如今模样，并要井九拿沈云埋或李将军的人头作投名状。井九却点破真相：她的文明需要他抵制飞升者，她需要他保证自己的独立存在。少女静坐良久，只道有空再来喝酒。湖畔众议一无所获，冉东楼仍坚持借游戏观察玩家数据；沈云埋六十天之诺只剩五十天，云集号数日内抵主星。"},{"n":827,"orig":828,"title":"像流星划过天际","people":["井九","冉寒冬","钟李子","沙喻"],"one_line":"井九恒星旁吸仙气如流星，漩雨送来玩家数据。","summary":"钟李子问那位是什么样的人，井九答：和我一样的人。他向冉寒冬挑明：此界被破茧者控制，祭司一脉需要他；云集号将至，他随时可改投那边——能毁战舰能杀人的他，价值比这一切更大。随后他躺上军事卫星直面恒星，两小时便将大战耗损的仙气吸满，化作流星返主星，全联盟直播目睹。冉寒冬汇报烛光游行与信徒接受度，又呈上求见名单，井九看到一个熟悉的名字：漩雨公司所有者、议员沙喻。沙喻奉冉东楼之命送来芯片——井九要借《大道朝天》游戏找出滞留此界的朝天飞升者，心中惦念雪姬是否在内。"},{"n":828,"orig":829,"title":"又见青山","people":["井九","雪姬","冉寒冬","李将军"],"one_line":"井九游戏青山寻得雪姬，与李将军初次相见。","summary":"井九把沙喻送来的芯片接入戒指，筛选出三十几个在游戏青山里行为异常的可疑账号，与冉寒冬联手逐个排查，记下了一批疑似飞升者的位置，却没找到谈真人与雪姬。他驭剑进入游戏里的青山，在万物一剑最初出现的剑峰，遇见了那身碎白裙的少女——藏身数据网络里的雪姬。她评平咏佳把自己变成难看的胖子，质疑井九杀了破茧者要员还想被接纳，最终开出条件：合作成功，青天鉴归她。井九答好。随后李将军着素净剑袍现身草庐，眉目竟与柳词有几分相似——他们都是青山宗掌门；井九起身，行了多年未行的礼。"},{"n":829,"orig":830,"title":"弗思","people":["井九","李纯阳","钟李子"],"one_line":"李将军即太师祖纯阳真人；井九泡岩浆静心。","summary":"李将军全名李纯阳，正是青山第十四代掌门、最后飞升的剑仙纯阳真人，道缘真人的师父、井九的太师祖——井九纵不情愿也须面对。李纯阳感慨没等到小道飞升，靠那本小说才知朝天变故，闻柳词与井九联手杀白刃，叹声可惜。他问井九与那位见面有无结果，直言青山弟子不会得她信任，除非把飞升者写成莫成峰一脉；井九答我不说谎。李纯阳欣慰晚辈完成了长辈未竟之事，约定明天亲至主星面谈。井九退出游戏，携钟李子下到庄园地底，将身体浸入滚烫岩浆，如回聚魂谷底静静理清心绪，岩浆翻涌如弗思剑光。"},{"n":830,"orig":831,"title":"不一样","people":["井九","钟李子","冉寒冬"],"one_line":"井九赠钟李子纸鹤防身，南下冰原密会李将军。","summary":"井九从地底迅速归来，问起钟李子的功课，得知女祭司传承靠入定接收知识碎片、绝不落文字，他一语道破：她不相信人类。钟李子问是否与那位谈得不好，井九答：不，我也不相信。他近来常摸缺损的耳垂，第一次开始考虑自己可能出事，便交给钟李子一只纸鹤，嘱咐出事就烧掉；他不肯教她修道，不愿她卷入太深。次日清晨，他背着双肩包与冉寒冬秘密南下，黑色飞船降落极南冰原，一路竟无任何监控——能做到这一点的只有掌控军方的李将军。井九正是去见他，要补上战舰燃烧那晚没说完的下半句话。"},{"n":831,"orig":832,"title":"最长的一段话","people":["井九","李将军"],"one_line":"南极艺术馆对谈，井九道破朝天大陆真相。","summary":"李将军约在南极冰盖下的星河艺术馆见面，当日封馆。当代艺术馆里黑色油污灌入蓝色泳池的艺术装置暗指暗物之海，两人立于崖畔，李将军红氅如旗。井九说出他一千多年来最长的一段话：十几万年前次元壁垒被撕裂，暗物之海入侵，远古神明选择与黑暗同归于尽，死前发现朝天大陆所在的时间域，把人类与被暗物浸染生命的复制品——雪国怪物——一并放入其中，既为文明留下火种，也盼那里的人类进化出战胜黑暗的方法。对那个世界这叫飞升，对这个世界这叫回归。李将军确认大抵如此，井九闭上眼再睁开：换句话说，我们都是实验品。"},{"n":832,"orig":833,"title":"我们的道理","people":["井九","李将军"],"one_line":"李将军阐述破茧者之道，井九拒当任何人手中剑。","summary":"李纯阳称朝天大陆也可说是炼蛊，难怪井九对暗物怪物觉得熟悉。他阐述破茧者之道：新人类应带领人类向前，这与死去的神明无关，是自由意志；井九只肯承担活着的责任，直斥两边之争幼稚，绝不做谁手中的剑。李纯阳借油污困鸟的画讲授暗物之海：黑色如病毒，只知吞噬感染，唯有高强度光热可清除，关键在隔离；星链计划已行两百余年，耗资巨大，故必须掌控联盟，那位必须服从——这是不可谈判的分歧。井九重申不接受例行考察。临别时李纯阳问：那天战舰上没说完的话，今天见到了我，然后呢？"},{"n":833,"orig":834,"title":"彼此的想法","people":["井九","李将军","冉寒冬"],"one_line":"李将军坦言祖师将逝；神秘教授入游戏寻谈真人。","summary":"井九要个说法：让赤松先寻曹园再接自己，分明想他死。李纯阳只认想让他受教训，并道破考察真意：飞升者离开是浪费，青山需要听话的打手。他感谢井九没杀沈云埋——那竟是祖师之子；祖师将不久人世，走前会见井九。曹园在前进基地养伤，西来轻伤受训，谈真人不明。井九以剑火烧尽泳池油污离去。暗处，科学院老院长把核聚炉研究者名单送交一位文雅的中年教授，教授锁定失踪的苟教授，看着照片笑道不愧是白家的女婿，随后写符潜入游戏。小行星上阴冷老者问李纯阳可真信井九，答曰他是青山弟子、此事关乎全人类。冉寒冬查明：两名被监控目标已抵主星。"},{"n":834,"orig":835,"title":"离开前的一声轻嗯","people":["井九","钟李子","冉寒冬"],"one_line":"井九接受李将军条件，向钟李子道别离主星。","summary":"监控目标里有两个到了主星，神秘战舰上的军官悄然备好不明武器；井九备好反杀预案，最终没动手：他不清楚那武器底细，更不愿与太师祖开战。既然没谈崩，他决定接受李将军的条件。回到庄园他对钟李子只说了三个字：我走了。她请他讲讲自己的故事，井九答大道朝天就是我的故事；她终于确认他是景阳真人，来找同伴且已找到——蝴蝶会本是飞升者自治同盟，青山宗借李纯阳统治星河联盟，而他是最出色的青山弟子，这片宇宙往后就是他的。钟李子只问去那边安全吗，井九难得感动，摸了摸她的头。"},{"n":835,"orig":836,"title":"井九的选择","people":["井九","钟李子","溪","冉寒冬","李将军"],"one_line":"井九决意随李将军走，辞别钟李子只带溪。","summary":"钟李子明白祭堂与飞升者正在争夺井九，而他已做出选择。她劝他别信那些人，井九说我不会相信任何人，也拒绝了同行请求，只嘱咐收好纸鹤。庄园外大人物们云集质问，却无人敢上楼。收拾行装时，井九出人意料地说带溪走——她是主星家的远亲，慌得直说要问家里人意见，井九说我会去问。李将军如约派军方车队来接；树下道别时，钟李子说喜欢他写的那本小说，喜欢连三月、赵腊月，也喜欢景阳真人。井九答我知道，摸了摸她的头。车队悄然驶入戒严的首都市，进入军部大楼顶层。满室藏书的办公室里，李将军只问：家的娃娃？井九嗯了一声。"},{"n":836,"orig":837,"title":"第二十三家的娃娃","people":["井九","李将军","溪","姜知星"],"one_line":"井九访家观向日葵真迹，以首席顾问登烈阳号。","summary":"李将军猜井九带溪是留一条通向女祭司的线，又问那幅向日葵——画就在家中。井九与李纯阳论暗物质：它不是任何已知未知的微粒，人类需要进化；李纯阳说我们都是进化后的人类，井九答不够。李纯阳要他日后去暗星看看；井九先去了家，生化人管家迎客，城堡里藏着真正的远古文明油画——那幅向日葵被染血的蕾丝布带束住，他终于明白花为何不倒。随后二人乘太空电梯登上烈阳号，舰长姜知星敬礼相迎：井九已被任命为军部首席顾问，沈云埋降为星核舰队总指挥。舰队启程护送他前往加里星域；望着窗外环形山，井九问溪能不能杀人，溪答那是犯法的。"},{"n":837,"orig":838,"title":"犯法的事情不做","people":["井九","溪","沈云埋","那位","冉东楼"],"one_line":"井九不杀石人飞升者；沈云埋御琴拦路相邀。","summary":"环形山底的阴冷老者被井九的神识警告震住——那是九千年前飞升的陈屋山石人，想不通对方如何发现自己。烈阳号上溪用姑娘们塞进包的铁壶煮茶；井九解释不反杀的理由：杀人犯法，复制人也犯法。另一边那位对冉东楼挑明：井九终究是个破茧者；规则非她所定，也非死去的神明所定。其后井九与冉寒冬在隐网碰头：空间站离开的飞升者应是一茅斋斋主曾举，另一人就在舰队里。星核舰队数万战舰燃火而行，井九心怀敬意，又对溪坦言不喜欢这个世界——它也有尽头。忽然警报响起，沈云埋盘坐古琴上拦在舰队之前。"},{"n":838,"orig":839,"title":"别拦路","people":["井九","沈云埋","溪"],"one_line":"沈云埋赠暗海绝密资料，舰队碾压矿船赴边缘。","summary":"沈云埋在真空中自谱琴曲与井九论道：那边的青山与这边无异，你摆平云梦山与果成寺、确是最强，难怪老家伙们决定把世界交给你。他提醒暗物之海才是真正目的地，可能会死噢；井九答我不会，沈云埋说每个人都会死，随即交出全联盟不足五人有资格阅看的绝密资料：人类对暗物质近乎无知，只能靠被浸染的怪物间接研究；卷宗末尾的加密秘密是一座城市。星核舰队加速十七天，途中三艘误入航道的矿船被齐射摧毁——井九想起钟李子患绝症的父亲投资的矿船。二十七天后舰队抵达本星系群边缘，与星链舰队汇合，前方是一颗被强行熄灭的黑暗恒星，和一座远古文明的城市。"},{"n":839,"orig":840,"title":"一座城市","people":["井九","沈云埋","溪"],"one_line":"舰队抵达暗物之海边缘，环形基地旁是首座地狱。","summary":"舰队驶入暗物之海边缘：黑暗恒星似被强行熄灭，太空残留着十几万年前远古文明核爆的痕迹。飞船降落黑色行星北极的环形基地——周长四百余公里，引力场等级最高。沈云埋带着琴童赶来，军官却先向井九敬礼——他才是首席顾问。这颗行星是暗物之海最早侵染之地，基地外的城市是第一座地狱，被远古文明整颗隔绝封存；新人类凭女祭司线索找到这里，怪物与浸染宛如今日，是研究的第一手资料；研究所前任所长即现任科学院院长，沈云埋也在此工作过半年，观察始终不敢深入。窗外是死寂的黑色城市，溪问怪物死光了谁来冲击，井九只是静静看着。"},{"n":840,"orig":841,"title":"生命本身","people":["井九","沈云埋","溪"],"one_line":"井九尽览暗海怪物档案，孤身剑光飞向死城。","summary":"井九明白了李将军为何要他亲来。军官讲解：黑色尘埃仍是本世界物质，只是被微粒子层面改造；暗物质无静质量、无法捕捉，浸染不可逆，唯有隔离；关键在抹平次维空间裂缝，联盟正与时间赛跑。被浸染的只有有机生命，死星球反拖慢其扩张，暗物之海至多威胁本星系——但人类就是生命本身。怪物按宿主分为介鳞、半尾、灰木、血拇与人类所化的代序，解剖档案翔尽陈列。井九看着档案想起镇魔狱的蚊子、寒蝉，不知第几次想起雪姬。崖畔他与沈云埋谈起远古文明当年灭尽怪物、封死裂缝的次恒星级武器，科学院毫无线索。言罢井九化作剑光穿过基地防护罩，径直飞向那座死城，警报与惊呼大作。"},{"n":841,"orig":842,"title":"看看太阳","people":["井九","沈云埋"],"one_line":"井九探857死城验明无惧浸染，坚持要去远方看看","summary":"井九不做防护独自飞入857行星死城，感知到血拇仍存，任孢子落在手上再以剑意震碎，确认这具身体无惧浸染。沈云埋自述初来857时右手被浸染黑化，斩臂换了机械臂，索性把全身改造了一遍。恒星表面覆满失去活力的黑色孢子而显灰暗；资料显示远古文明当年动用秘密武器灭掉全行星生命，把死城封存成陈列品。井九由介鳞、半尾、灰木、血拇、代序的分类联想到朝天大陆雪原怪物，怀疑雪姬、域外天魔与母巢另有来源。沈云埋说本星系群确定没有别的智慧生命，逃亡派早已死在无望旅途，井九望着星空仍说：「还是该去看看。」"},{"n":842,"orig":843,"title":"太阳下没有新鲜故事","people":["井九","沈云埋","溪"],"one_line":"逃亡派注定死路，井九仍要去看；溪考他领袖之问","summary":"远古文明当年分为死守派与逃亡派：死守派全军覆没，却让暗物之海归于沉寂；逃亡派经数学模型推算结局凄惨——所有扭率空洞都只在本星系群内，飞行器无法超越光速，星系群之间的距离足以让文明灭绝。女祭司撰文断言，对逃亡者的任何期望都是对死者的羞辱。井九在死城轻触一具抱着猫的尸骸，人与猫瞬间化灰，他仍坚持人类该去更远处看看。回到基地，他问溪李将军让他看这些的用意，溪褪去天真，平静地问他：「如果你是人类的领袖，遇到暗物之海会怎么选择？」"},{"n":843,"orig":844,"title":"大道不同","people":["井九","溪","沈云埋"],"one_line":"井九答溪：我活着便是人类活着；沈云埋荒原夜奔","summary":"溪连番发问，井九一一作答：若他是人类领袖，会像那位神明一样尝试彻底解决暗物之海；若数学模型的结果如此，他也会选择灭掉全星生命；若要牺牲自己换更多人活，他不愿意——「我活着，便是人类活着。」溪沉默良久，感慨当年那位若像他这么混蛋就好了，井九答：「道不同，但都是大道。」当夜沈云埋不用防护、不借飞行，在死亡荒原上夜奔七百多公里，感受死亡气息，井九飞去相陪，看他衣衫尽破，只淡淡说了句：「你这衣服不行啊。」"},{"n":844,"orig":845,"title":"聪明的脑袋不长毛？","people":["井九","沈云埋","谈真人","溪"],"one_line":"井九识破谈真人假扮龙教授，要求十一位专家齐上课","summary":"沈云埋解释白衣是超微粒子材料自制，只为自然；又与井九平静讨论改造身体后该选什么性征，井九建议怎么方便怎么来，还说他本就是变态，沈云埋反觉熨帖，约定定了第一个告诉他。次日井九下到地底七公里的研究所，认出新签的龙教授竟是谈真人假扮——此人先前在西北大学任教时姓苟，井九不动声色，只在对方光亮的额头上多停了一瞬。军方安排十一位顶尖学者为他讲授暗物之海知识，估算需六十天，众专家还在争执从何讲起，井九只说：「一起来吧。」"},{"n":845,"orig":846,"title":"学习班","people":["井九","沈云埋","溪","曾举"],"one_line":"井九九天学完暗物之海知识，沈云埋夜归断了一臂","summary":"井九让军方把会议室隔成十一间，以数据流同时向各领域顶尖专家提问，三百多个问题从孢子特性、怪物弱点问到武器战术，专家们由看热闹转为紧张应答，反像被他考较学问。最后他问远古文明当年用什么武器灭掉857行星，专家答那是次恒星级武器、启动时留有极大余量，但逆分析毫无结果，疑有资料被当局抹去。这场估算需六十天的浩大学习，井九只用九天完成。当夜沈云埋来到崖畔，左袖空荡，井九只问了两个字：「断了？」"},{"n":846,"orig":847,"title":"第二次夜奔","people":["井九","沈云埋","曾举"],"one_line":"沈云埋忆断臂之战；曾举现身，带井九去看真正秘密","summary":"沈云埋道出断臂缘由：星核舰队在暗物之海边缘演习，十七艘战舰莫名被浸染，两万名军人变成怪物攻击舰队，他亲自出手，付出百余强者陨落与一条手臂的代价。他备着十二套备用配件，只是新臂昂贵，过预算会议麻烦。两人又聊起浸染速度太快反而免去了人间许多伦理悲剧，沈云埋说喜欢与井九说话，因为不用废话。次日清晨他的手臂已修复，带井九去见一位中年教授——一茅斋第七代斋主曾举，七千余年前飞升的圣人，井九开门见山：「没想到这么早便见面了。」"},{"n":847,"orig":848,"title":"地心游记","people":["井九","曾举","沈云埋"],"one_line":"曾举引井九地心直下，穿过囚室通道抵达星空","summary":"曾举是七千余年前飞升的圣人、一茅斋第七代斋主，刚与沈云埋在星核舰队联手作战负伤，便赶来857见井九。他申明各方目标一致：暗物之海没有意识、不接受投降，已是最大的幸运；并宣布考察到此为止，接下来让井九看人类真正的秘密。三人跳入直通地心的洞，穿过岩浆海与远古超级能源炉，通道两侧的囚室里关押着被浸染的怪物。尽头的大空间里，曾举以神通驱散灰雾，千亿星辰显现——那是本星系群的星图。"},{"n":848,"orig":849,"title":"蓝色的蝴蝶","people":["井九","曾举","沈云埋"],"one_line":"神明曾点燃三万颗恒星灭暗物之海，只余蓝色蝴蝶","summary":"地心星空是本星系群的实时映射，曾举指向一团淡蓝色星云：那里曾有三万颗恒星，是远古文明最繁华、也最先被暗物之海吞噬的星域。他向井九讲解破局思路——要根除威胁必须堵上次元空间裂缝，融蚀需七百万度高温，恒星虽如无数颗核弹，表面温度却不够，唯有让恒星爆炸。远古文明末年，那位神明点燃了所有恒星，暗物之海消失、文明一同中断，宇宙一角只余这只蓝色的蝴蝶。破茧者的蝴蝶徽记，正源于此。"},{"n":849,"orig":850,"title":"怎么点燃那些星星？","people":["井九","曾举","沈云埋"],"one_line":"恒星点燃计划曝光，点燃顺序与方法要井九来定","summary":"这团星云被命名为海印。曾举调出星图展示人类主要星域，推算三百年后暗物之海将笼罩此地；只在本星系群内迁移只会带着黑暗扩张，直至无处可逃。沈云埋道出真正计划：人类迁往邻近星域后，像那位神明一样点燃那些星星，是为恒星点燃计划。计划有两大难点：选定恒星、算准点燃顺序与方法，以及最关键的武器技术，现在的人类距离这一层次还差无数光年，只能指望找到远古文明遗痕。两人把定序之责交给井九，只因少女祭司太冰冷，而井九在朝歌城下与童颜那盘棋，证明了生命的直觉。"},{"n":850,"orig":851,"title":"星罗棋布","people":["井九","曾举","沈云埋","溪"],"one_line":"井九驳后续计划为扯淡；沈云埋送他超微粒子核动力炉","summary":"井九质疑计划无意义：就算成功，人类文明照常发展，暗物之海终会重现。曾举说要争取时间、减缓文明速度、派超级舰队去外围实验，井九直言不要扯淡。回程他想到朝天大陆外的真实太阳恰在海印星云与星河联盟之间，三者构成稳定结构，曾经的暗物之海在内、如今的在外，故有域外天魔传说而天魔难侵大陆。另一边沈云埋在荒原试飞新机械臂与战舰武器，腰间藏着刚研发成功的超微粒子化核动力炉——正式的三台中，一台给了李将军，一台在他腰间，箱中那台本就是为井九准备的。"},{"n":851,"orig":852,"title":"小小的太阳","people":["井九","沈云埋"],"one_line":"井九试用核动力炉化身小太阳，沈云埋邀饮违禁药酒被拒","summary":"井九在崖边穿戴核动力炉，剑心与炉中能量迅速同调，沈云埋提醒他小心意识输出、记住自爆线——那是被浸染瞬间的自毁设计。井九启动后化作一轮小太阳照亮夜空，飞出十几万公里，蓝色连帽衫被能量烧成虚无，追来的沈云埋白衣同样烧尽，两艘战舰慌忙调姿避开了监控。二人落在小行星上，沈云埋取出装着违禁药剂的小酒瓶，这些药剂足以弄疯几千人，却只能让他的意识稍有反应。井九只说：「我不好这个。」"},{"n":852,"orig":853,"title":"公子啊~","people":["井九","沈云埋","溪","谈真人"],"one_line":"沈云埋望向朝天大陆说想去看看，二人相约天尺星系","summary":"沈云埋的耳钉竟是空间法器。他自陈痴迷古风是想知道来处，让井九指出朝天大陆所在的白色恒星，凝望许久说想去看看。井九解释去了便难再出来——已有三名飞升者回去后无法二次飞升；沈云埋说可以放弃身体，井九提醒他脑子无法放弃。随后沈云埋宣布要去即将被暗物之海吞没的天尺星系，井九说「我也去看看」。两人回基地走完流程，井九向溪展示了核动力炉。夜里的实验室外，假扮龙教授的谈真人抚墙长叹，单手按在摩擦力近零的合金墙上，竟没有滑落。"},{"n":853,"orig":854,"title":"残缺的行星","people":["井九","沈云埋","溪"],"one_line":"残缺行星之谜揭晓：下令毁星者是沈云埋的父亲","summary":"溪送上超微粒子强化材料的黑色双肩包，可装核动力炉，理由是系在腰上显得特别没脑子。烈阳号与焦尾号两艘战舰启程，按联盟传统它们分属井九与沈云埋，若主人战死，战舰将共赴星河。穿过四个扭率空洞后，官兵脱帽哀悼——前方是一颗被轰掉三分之一的残缺行星，三千一百六十二万人随之丧生。沈云埋讲述旧事：七十年前矿业公司违规使用高能场工具引发次元空间裂缝，破茧者赤松真人处置强硬激化事态，七万余艘飞船欲连夜逃离，最后下令毁掉行星的，正是他的父亲。"},{"n":854,"orig":855,"title":"我也去看看","people":["井九","沈云埋","溪"],"one_line":"舰队抵黄玉三号星，沈云埋将融蚀空间裂缝，井九同去","summary":"井九推测祖师是以数万艘战舰组成青山剑阵轰碎了行星，沈云埋承认自己天赋比井九差一点点，井九说以后还会出来个姓彭的。舰队抵达黄玉三号行星：这里出产难以替代的稀有元素9447，被浸染后成战区，为保矿石不能动用核弹轰炸，只能靠地面部队苦战三年。沈云埋此行的任务，就是融蚀藏在行政首都地底的次元空间裂缝。井九说「我也去看看」。星境上校闻讯摔碎酒杯，愤然于大人物来抢军功。"},{"n":855,"orig":856,"title":"观光客的自觉","people":["井九","沈云埋"],"one_line":"沈云埋激光剑阵清场，自缚双手激井九对付代序","summary":"两道剑光破开大气层，全星球机甲抬头敬礼避让，血战三年、眼看收复在即的登陆部队却愤怒于大人物抢功。二人飞入被浸染的森林，孢子与血拇弥漫，沈云埋以数十个微型激光发生器组成激光承天剑阵，把兽潮般的怪物斩成碎末，又掷出晶石高热爆燃弹清场数公里；井九背着双肩包旁观，像个观光客。他观察到这些怪物与雪国妖兽相似、更漠视生死，似受统一意志操控。察觉代序将至，沈云埋取出蓬莱神岛真根青索自缚双手，激井九出手。"},{"n":856,"orig":857,"title":"你好像个电焊工啊","people":["井九","沈云埋"],"one_line":"井九剑灭代序震慑全军，沈云埋开工融蚀空间裂缝","summary":"井九以数百道剑光无声杀灭百余名代序，残影化灰，目睹全程的两大舰队官兵震撼无言，再无抢功怨言。代序由人类浸染而成，命名者认为它们是冷漠客观意志的代理程序，井九再次想到：若朝天大陆是神明的实验室，他设计得很成功。二人穿过曾举九年前冒险布设的阵法通道——正是这座阵法把次元空间裂缝的扩张减缓了三万倍，行星才撑到今天。裂缝形如一只巨大而妩媚的眼睛，注视过久精神会坠入深渊。沈云埋架起喷射装置开始融蚀，井九在旁俏皮一句：「你好像一个电焊工啊。」"},{"n":857,"orig":858,"title":"人性的证明","people":["井九","沈云埋"],"one_line":"沈云埋融蚀次元裂缝成功，井九剑火护法","summary":"核动力炉研发的首要目的就是融蚀空间裂缝，此项工作唯有自幼接受身体改造、能精确控制小太阳的沈云埋承担，这正是两个文明融合之力的证明。焊接期间超幅输出，自爆线步步逼近，井九以监工自居留在场间，搬出青山掌门身份压这位祖师之子，还以剑火精准诛杀涌向裂缝的漏网怪物，几千朵剑火燃亮地底；军方同步以激光主炮与机甲阵列清剿地表兽潮。裂缝终于融蚀成功，沈云埋问这感觉可像镇魔狱底的深渊，井九答：「这才是真的深渊。」"},{"n":858,"orig":859,"title":"事了拂衣去看海","people":["井九","沈云埋"],"one_line":"黄玉三号战事落幕，两人拂衣去天尺星系看暗物之海","summary":"裂缝融蚀后二人留场观察，确认空间稳定。沈云埋阐述：次元空间裂缝多随人类活动出现——引力场、曲率航行与扭率空洞都会撕裂空间，远古遗迹又让宇宙千疮百孔，如今只能不停修补延缓崩溃，井九则坚持有因果就有规律。事了拂衣去，二人回基地消毒后悄然离去，黄玉三号战争结束，十几万军人放假，全联盟迎来五年来最大胜利。烈阳号与焦尾号则载着二人前往天尺星系——那片星域正被暗物之海淹没。"},{"n":859,"orig":860,"title":"造物主最伟大的作品","people":["井九","沈云埋"],"one_line":"七千亿蟑螂探出暗物之海边界，长尺星系恒星被吞没","summary":"恒星并非真死，只是光线被暗物之海拖慢、又被孢子遮蔽。星链舰队以蟑螂为侦察兵探测暗物之海边界：植物、蛆虫、小白鼠皆不合格，唯有大蠊能在真空存活、变成怪物后又不过于强大，军方投放七千亿只并植入芯片，芯片技术由温泉畔的浴衣少女解决。一只蟑螂触海自爆，七千艘战舰如退潮般后撤。众人随即目睹长尺星系的恒星被暗物之海整个吞没。沈云埋感叹蟑螂是造物主最伟大的作品，井九纠正：「是人类。」"},{"n":860,"orig":861,"title":"开始度假","people":["井九","溪","沈云埋"],"one_line":"众人赴度假星休整，溪问井九是否会成新神明","summary":"二人学会赞叹风景、彼此认同，令舰队官兵莫名。返程路上溪提出暗物质世界可能才是真正的主空间，是人类先触碰了它们，黑暗才如海水漫来。黄玉三号大胜后，857研究所的核动力炉小组获度假嘉奖，两艘战舰载着教授学者们前往浊流恒星系的度假星——那颗行星恒星同步、永昼永夜并存，可满足所有人需求。海滩上溪笑说我喜欢你，又问井九会不会成为新的神明，井九答不会，溪眼底掠过失望。海浪中走出一名古铜色肌肤的裸女，是来给沈云埋送东西的。"},{"n":861,"orig":862,"title":"海","people":["井九","沈云埋","溪"],"one_line":"井九被沈云埋请到度假星黄玉三号看海","summary":"井九本不喜欢度假，却被沈云埋请到联盟政府改造的度假星黄玉三号看海，溪与857基地的部分教授学者同行度假。这颗海洋星球被改造成著名的度假胜地，恒星与伴星双重牵引造就的大浪区最为壮观，每日限额开放，是全星球最昂贵的游览项目。沈云埋身份尊贵，安排的行程极尽奢华。井九对声色享乐毫无兴趣，一路淡漠平静，任由沈云埋张罗这场难得的闲暇。"},{"n":862,"orig":863,"title":"浪","people":["井九","沈云埋","溪","暗夜女王"],"one_line":"沈云埋夜半球星海买醉，井九自称此刻正在太阳上","summary":"沈云埋邀井九同游夜半球，溪以自己还是个孩子为由拒绝。海水无风自分，三栖飞行器载二人潜入海底，再冲进著名的大浪区，百米高的水墙扑面而来，两人毫无动容，沈云埋还有闲心编琴曲。抵达夜半球城市，二人穿过赌场与脱衣舞场毫不停留，直入酒店顶层套房。沈云埋取出剧毒药剂——两毫克即可杀死一名成年人——让暗夜女王跪地斟酒，邀井九同试被拒。井九只说想去晒晒太阳；沈云埋幽幽问他：「你活得这么明白，怎么还不去死？」井九答：「我不想死。」沈云埋饮尽足以毒死半座城市的酒，举杯「祝我们能死的愉快」。深夜他难眠思及生死，通话问井九在哪里，得到的回答是：「我在太阳上。」"},{"n":863,"orig":864,"title":"阳光灿烂的日子","people":["井九","沈云埋"],"one_line":"井九在太阳表面做实验取数据，度假星海底突发大爆炸","summary":"井九飞上恒星，凭戒指阵法与符文防护走过太阳表面，要办两件必须背对宇宙的事：一是以剑意裹住从长尺星系带回的被浸染死蟑螂，以入微剑目细察，看到活着的孢子与特殊粒子片段，质疑学界慢速中微子变形之说解释不了根源；二是把手伸进太阳深处，忍痛取回人类从未触及的第一手数据，并彻底焚毁蟑螂。他回烈阳号记录氢核聚变异常曲线时，度假星传来相似能量波动——海底发生惊天爆炸，蘑菇云覆盖数万平方公里。井九以极限速度飞回，衣物尽毁，穿过蘑菇云见到被阵法隔开海水的爆炸中心与游轮残骸，找到只剩半截身躯的沈云埋。对方眼睛急速眨动打出军中密语：「我觉得我还能再抢救一下。」"},{"n":864,"orig":865,"title":"海上日出","people":["沈云埋","井九"],"one_line":"沈云埋自爆核炉堵住空间裂缝，井九嫌手碍事扯下他头颅","summary":"沈云埋向井九讲述经过：有人把高阶引力场发生装置偷偷安放在度假星海底，启动后撕开空间裂缝，欲把暗物之海引进人类星球。他察觉后破窗而出，穿透数千米海水赶到海底，用耳钉中藏着的微型核动力炉与融蚀设备封闭裂缝。此时数十枚装载超碳结构细束集爆弹的导弹袭来，专为摧毁战舰与机甲的弹头把他割得遍体裂口，融蚀设备受扰，裂缝再度扩张。危急关头他以承天剑阵与符纸护体，索性把核动力炉塞进空间裂缝引爆。惊天大爆炸中导弹尽数汽化、裂缝被融蚀，如一轮红日从海里升起，夜半球都看到了日出，他自己身体尽毁。井九叹他竟这么拼命，拖人时嫌断手碍事，索性踩住咽喉把他的头整个扯了下来。"},{"n":865,"orig":866,"title":"人间喜剧","people":["井九","沈云埋","暗夜女王"],"one_line":"井九剑识坠机甲众强敌，读记忆揭暗夜女王身世与阴谋","summary":"井九拎着沈云埋的头飞出海面，数十台机甲已在等候，为首的正是昨夜接待他们的暗夜女王。她声称这是造物主对沈云埋的惩罚，双方隔空互呛，沈云埋放出无耻狠话。井九闭目以剑识出击：机甲尽数失效坠入海底，一道剑光掠过，众强者授首，只留女王活口。他探入她的记忆读尽她的一生：她生于隐居的田园派星球，七岁那年星核舰队侦察舰队以演习为名，用激光主炮把整颗星球犁了一遍，族人尽死；她被神秘老人收养，成为激进的恐怖分子。近年在一位病死大富豪的资助下组织壮大，选中度假星做基地；她经某世家弄来三级引力场发生装置改造后藏于海底，欲引暗物之海毁灭全人类，又接到接待沈云埋的订单，便顺势加上了刺杀。"},{"n":866,"orig":867,"title":"送人头","people":["井九","沈云埋","溪"],"one_line":"女王自尽沉海，沈云埋以桶装头生疑，西来获提名接任","summary":"井九抽手离开，暗夜女王道了句今天算你运气好，自行坠入海底深坑，海水随即埋掉深坑里的一切。溪驾轻型战舰接应，井九把沈云埋的头丢进一桶无土蔬菜养殖液，度入仙气布下承天剑阵养护。战舰回到夜半球都市，井九把人头安置进酒店套房的水族箱，剑火烧净满地衣物工具与药剂气味。四小时后烈阳号与焦尾号赶到，数百艘轻型战舰宣布戒严。沈云埋却拒绝回自己的焦尾号，坚持转上烈阳号——田园派、世家流出的引力场装置、病死的富豪、神秘的老人，巧合太多便不再是巧合，他怀疑有人布局。军部同时传讯：李将军认为沈云埋不宜再任星核舰队司令，提名西来接任。焦尾号奉令留在星系等待调查。"},{"n":867,"orig":868,"title":"再送人头","people":["井九","沈云埋","西来","溪"],"one_line":"西来就任司令登舰会故人，沈云埋人头被送回沈家黑舰","summary":"烈阳号穿过扭率空洞返航，溪趴在改造过的医疗舱边，好奇围观浸泡在混有仙气的生物营养液里的沈云埋人头，三人互相斗嘴。途中两艘战舰前来对接，其中通体幽黑、不反射星光的奇特战舰属沈家所有，船上尽是被打入思想烙印、永不背叛的仆人。现任星核舰队司令西来披着装有核动力炉的黑色大氅登舰，与井九淡然寒暄，对沈云埋却毫不客气，自称与青山宗是仇敌。沈云埋伤重不肯让西来代送，只信井九。井九提着箱子登上黑色战舰，仆人们跪迎人头，女管家将他引往战舰深处装有引力场发生装置的密室——那里已备好一切，随时可开始阻止伤势恶化的手术。井九打开箱子，粗鲁地把那颗头抓了出来。"},{"n":868,"orig":869,"title":"最好的脑外科专家遇到了停水的问题","people":["沈云埋","井九","女管家","西来"],"one_line":"沈云埋自我开颅手术进行到半途，手术水柱忽然被人掐断","summary":"沈家黑舰的密室是最高端的手术室，人头浸泡在温度合宜的维生液里。沈云埋邀井九养伤时来玩被拒，井九摸摸他的头离去，只说：「我没有全退。」——如今青山掌门是卓如岁，此事连沈父与李将军都不知情。回烈阳号后，井九向西来问起思想烙印，西来反问是否怀疑自己被洗脑，井九答：「只有被洗脑的人才会如此敏感。」黑舰上手术开始，沈云埋本是联盟前三的脑外科专家，早已把大脑缩至常人七分之一并设下多重防护，此刻用等离子束刀切开自己最坚固的头颅保护罩，再以水刀清创修复。就在这最脆弱的时刻，水柱忽然消失。女管家平静承认是她关的水，连她也不理解为何这样做——显然有人动了她的思想烙印。"},{"n":869,"orig":870,"title":"谁能给黑暗带来光明？","people":["沈云埋","井九","西来","女管家"],"one_line":"沈云埋遭亲生父亲软禁黑舰，幕后指使指向冉家与启明人","summary":"沈云埋质问之下得知：父亲并无杀意，只想把他关起来不许乱跑。女管家戴有脑波屏障，他的精神控制失效，操控手术刀偷袭也被这位承夜初境的强者一剑制住。仆人们切断能源与信息、撤走设备、摘掉他的银钉，随后引力场启动，房间化作绝对黑暗的独立世界——他被沈家幽禁了。黑暗中他盘算脱身：没有手破不了引力场，仆人皆被屏蔽，唯一指望是引力场潮汐的一瞬向外求援，可求援需要朋友，他只想到井九。另一边，井九与西来叙旧，西来坦言被李纯阳击败后接任舰队司令，因暗物之海的问题总要有人解决。井九问指使者是谁，西来答：引力场装置与冉家有关，执行者是田园派，其领袖是自称启明人的神秘老人——他要开启一个新的文明。"},{"n":870,"orig":871,"title":"寻找怎样的答案","people":["井九","曾举","溪"],"one_line":"井九重回857基地见曾举，步步逼问青山祖师的下落","summary":"西来走后，井九让溪去查他飞升后的一切遭遇。数日后二人回到857环形基地，发现生化人军官与龙教授都不见了。井九穿过一茅斋阵法到崖间，见圣人曾举仍在推演恒星点燃计划，曾举答人类大祸躲不开、不必把自己想得伟大，井九由此下定加入的决心。他又问朱鸟、海上巨人族等远古飞升者的下落，曾举推测他们或远渡星河、或已被暗物之海浸染，母巢可能就是强大生命感染后的怪物，这正是飞升者必须受考察、回答敢不敢赴死的原因。谈话末尾井九突然发问：青山祖师在哪里？曾举推说不知，井九紧逼：你在此看了两百多年星空，算不到凭什么飞升，又以信任为名索要答案。曾举沉默良久，反问：你到底要做什么？"},{"n":871,"orig":872,"title":"盖棺","people":["井九","曾举","沈云埋"],"one_line":"井九索要祖师坐标作人质，沈云埋纸鹤求援惊动其父","summary":"青山祖师是人族第一位飞升者，身体已不佳，行踪只有李将军知晓。井九以「我需要一个人质」为由索要其坐标，这个恶毒理由反而说服了曾举——青山宗行事极端，有内部制衡总是好事。曾举交出推算结果：祖师可能藏在本星系群最远处名为银河系的棒旋星系细臂上的某颗恒星。临别曾举劝他加入这份事业，井九同意留下。另一头，被幽禁七日的沈云埋等到引力场潮汐的一瞬，点燃井九藏在头发里的纸鹤，穿越裂缝向外求援。随即一道苍老神识穿透引力场而来，正是他的父亲：不阻拦纸鹤，只因要借此让井九动起来，需要时还会重启他。沈云埋拒绝再交流，闭眼沉睡，黑舰如一口棺材驶向宇宙深处。"},{"n":872,"orig":873,"title":"落子","people":["井九","溪"],"one_line":"井九布数亿棋子推演恒星计划，一子落下引爆一片星海","summary":"井九回到烈阳号，核弹库房已被清空，整个文明侍奉着他：星门大学同款软椅、泥炉银炭与煮好的绿茶。他抓起瓷盘细沙，库房金属架应声泻下漫天黑白棋子，铺满地面后悬浮空中，分布与857地底的星空相似——白棋四亿九千万颗代表恒星，黑棋一亿三千万颗代表暗物之海，这是人类文明史上最复杂的一盘棋。井九整日闭眼躺在椅上，溪几度想走还是留下，坐上软椅末端那个属于钟李子与赵腊月的位置。忽然他睁眼，眼中剑光如算筹流转，数万颗棋子化作光与暗物质的洪流彼此渗透撕扯。最后他拈起一颗以意识凝成的白子随手落下，如石子投入湖心，那片角落的棋子轰然爆碎成灰，仿佛空间坍缩——那是一次提前爆发的超新星。"},{"n":873,"orig":874,"title":"谁在铁皮屋外","people":["井九","溪","西来"],"one_line":"超新星方案被溪质疑，井九认定沈云埋应是他的弟子","summary":"那颗白子是一次提前爆发的超新星。黑白棋子即暗物之海与恒星，点燃恒星计划就是让恒星爆炸去融蚀空间裂缝、压缩暗物之海。溪却指出此路难通：超新星平均三年才爆发一次，对空旷宇宙不过一枝烟花，而要数百颗同时爆炸就必须有超光速武器——可当年点燃恒星的武器究竟是什么？与毁灭857的武器有何关联？溪断言远古文明不会留下万全资料，把现实诗歌化是愚蠢的。随后井九收到溪寻来的机密：西来在矿星惨败后遭军方反复精神冲击与改造。他平静看完，出库房联络西来，确认对方记得一切；西来说：「继续看着我吧，如果我真的不是我，请叫醒我。」井九不感动，径直挂断。溪不解他为何关心西来与沈云埋，井九答：他们有些像我，我觉得沈云埋应该是我的弟子。"},{"n":874,"orig":875,"title":"请喝茶","people":["井九","溪"],"one_line":"飞升者会议将启，沈云埋法鹤求援，井九再向溪索权限","summary":"戒指送来飞升者会议的名单与坐标：会议设在雾外星系外围一颗磁暴肆虐的小行星上，酷寒绝密，只有飞升者能停留。名单上陈屋山石人、东易道六合真人等赫然在列——朝天大陆的飞升者远比典籍记载的多。溪警告磁暴会毁掉他破损的戒指，井九只说可以换个新的，暗含交出权限的邀约，她犹豫未答。烈阳号抵达蝎尾星云时，十几艘飞升者座驾隐于黑暗。井九认定西来的阳光笑容可疑——把现实诗歌化是投降主义，他不是投降派。忽然心血来潮，一只光鹤破暗而来，竟是沈云埋的求援信。井九扫定七艘战舰的方位，回舱煮茶递给溪，再问她能否进行物理操作。溪答：「我能做多少，就能做多少」；你是青山弟子，我没法信任你。井九笑道：青山宗最擅长的就是欺师灭祖。"},{"n":875,"orig":876,"title":"一切都是假的（上）","people":["井九","西来","纯阳真人","溪"],"one_line":"井九入西来精神世界查烙印，发现纯阳真人神魂驻守","summary":"井九自认能说服溪与她身后之人，一并解决西来被控、沈云埋被禁的事——自星门醒来那日起他便隐约觉得世界虚幻，前路如被雾遮住，索性直取中路。西来抵达后，井九亲手斟茶直说：你的脑子里有问题，随即布下承天剑阵把证据传入其意识。西来看完只道谢，坚称自己是醒的：只要不被隐瞒，为人类存续承受牺牲就能接受，他不是井九那样的特例。井九冷语相激，西来反问：宇宙太大，我们总要有个落脚处。他提出要进西来的精神世界查看，西来默然良久，举杯应允。意识深处穿过南海与西海来到荒原河边，一个红衣年轻道士正在垂钓——思想烙印竟是个人，正是纯阳真人留下的一缕神魂。道士抬首道：「你不该来这里。」"},{"n":876,"orig":877,"title":"一切都是假的（下）","people":["井九","西来","纯阳真人","溪"],"one_line":"西来以十二重楼剑反刺井九，引来等离子炮轰击烈阳号","summary":"红衣道士正是李将军留在西来精神世界里的一缕神魂。井九道明来意：他要给西来「活着」，因为他不想死也不希望别人死。道士撒土成山、化水为剑攻来，井九踏草成阵挡下；西来唤出十二重楼剑围困两岸，却不向道士出剑。河岸崩塌之际，井九伸手去握那只要坠落的手——剑鸣骤起，十二重楼剑竟从那只手中刺穿了他的身体。西来道歉：人类需要活着。道士宣告：人类需要免于死亡与恐惧，这份自由不能给你。井九称一切皆假困不住我，道士拂尘一拂，红日沉落，天地入夜。现实中仅过零点零二秒，井九在烈阳号醒来，神魂已被十二重楼剑锁定难以脱身，而西来体内信号源正向宇宙播发座标。井九挥手布千里冰封护住溪，一道淡蓝色光束已无声命中烈阳号舰首。"},{"n":877,"orig":878,"title":"斩首","people":["井九","西来","溪","密真人"],"one_line":"井九以核弹激光凝成巨剑斩碎密真人战舰，众飞升者震惊","summary":"来袭的是星河联盟最强的远程武器新型等离子炮，数百万度电浆笼罩舰首：千里冰封阵迅速变薄，井九黑发断裂，西来因预先服下解药得以自保。发射者藏在黑暗中，正是星锋舰队指挥官密真人的座舰，此刻正为第二炮蓄能。井九先命战舰释放数百颗核子鱼雷、数十座激光主炮齐射，看似慌乱还击，实则借反作用力让烈阳号缓缓后撤，舰首自电浆中平滑脱落，如同被斩首。随后他抬起右手，五指虚拢如握剑柄——鱼雷在数万公里外爆开成柄，将熄的激光骤然明亮成锋，一柄人类文明从未出现过的巨剑握在手中，向那艘战舰遥遥斩落。战舰无声崩解，舰上所有人生机断绝，密真人陨落。暗处十几艘战舰上的飞升者目睹全程，震撼失语：这是剑吗？李将军还是他的太师祖，为何同门相残？"},{"n":878,"orig":879,"title":"破题","people":["井九","李将军","西来","溪"],"one_line":"李将军揭晓井九是远古恒星武器，井九拒绝为人类牺牲","summary":"战舰废墟中剑光一闪，密真人正式陨落。井九终于在这片宇宙找到自己的剑道：把一艘战舰的全部武器凝而为一，万物皆是他的剑。他正欲杀西来绝后患，披红色大氅的李将军已近前，所有人都在等这场决裂的答案。李将军道破：因为你是人类唯一的希望。西来补上真相——井九就是远古文明遗留下来的恒星级别武器，是那把能点燃恒星、彻底消灭暗物之海的万物一剑，无数人苦寻的答案就是他本人。李将军问他：将来人类需要你牺牲时，你愿意吗？井九答：「当然不。」这便是今日战争的由来。西来与李将军皆称换作自己愿意牺牲。井九向整个宇宙宣告：我不接受为美好事物提前终结——因为我的存在，比所有的事业都更加瑰丽、壮美而伟大。"},{"n":879,"orig":880,"title":"仙人老虎狗","people":["井九","李将军","西来","溪"],"one_line":"飞升者结阵围杀井九，危急中揭晓溪是神明的分身","summary":"十余艘战舰结成引力场构成的青山剑阵，朝天大陆数万年来的飞升者大半齐聚，要把井九留下。井九讥其仙人多如狗，不过一群狗。双方剑意对拼，三座核动力炉点燃——李将军藏于红氅，西来的竟装在体内，本欲自爆留人。交锋过后李将军大氅裂口、西来颈部见骨，引力场与神识威压开天辟地般压下，冰块中的溪喷出鲜血，星锋舰队一万余艘战舰亦破雾而至对准井九。李将军劝他接受命运，井九答自己写了两百万字告诉世界不会同意，愿踏进那条河是因为早有准备。李将军追问准备是什么，井九转向冰块问她：现在可以信任我了吗？溪这才承认——她正是那位远古神明的分身，当年井九靠温泉边酒杯上的指纹认出了她，星门女祭司奉他为新神明的真因也在于此。"},{"n":880,"orig":881,"title":"重启","people":["井九","溪","李将军","谈真人"],"one_line":"井九获神明分身授权接管星域网，温泉棋局轻道一声重启","summary":"溪的身份揭晓：她是远古文明留下的人工智能「那位」的分身，人类文明因她才得以重续。李将军与飞升者们向她行礼，她自称只是观察者，井九却知道她需要外援制衡飞升者，遂索要权限。溪取出黄金戒指——星域网最高权限，问他确认成为新神明、承担人类责任不后悔？井九答：「我愿意。」戴上戒指，他的意识接入星域网，整个文明的芯片、终端与战舰尽在眼中。他远程接管星锋舰队，一万艘战舰减速转向，炮口齐指李将军与众飞升者，这便是神迹，李将军发出一声如释重负的叹息。另一边，857基地的龙教授正是中州派掌门谈真人，已与生化人军官悄然离去。最后，某蓝色星球的温泉边，一位戴笠帽的枯瘦老人与浴衣少女对坐五子棋，老人连落四子：「时间到了，重启吧。」"},{"n":881,"orig":882,"title":"前尘往事尽在今日画像","people":["井九","青山祖师","李将军","溪","太平真人"],"one_line":"青山祖师布局揭底，井九怒嘲其比画像更丑","summary":"青山祖师来历揭晓：蛮荒年代沈姓樵夫拾妖剑得道，号青山真人，炼承天鞘拘剑灵，创青山宗，成人族首位飞升者，却未能带走万物一剑；少年景阳与消失的剑为伴。祖师飞升后得知此剑是点燃恒星、消灭暗物之海的唯一武器，静待其来；剑毁承天后，他把新承天炼成一段程序。井九杀母巢重伤，太平真人推他向太阳缩短疗伤而自陨，星锋舰队救回沉睡的井九；军方实验无法破开其身。井九醒来、结识溪，全是祖师安排的考察：无论选蝴蝶组织还是当新神，都会被程序清除自主意识。井九当众嘲讽：你比画像里更丑。"},{"n":882,"orig":883,"title":"丧钟","people":["井九","溪","青山祖师","谈真人"],"one_line":"井九自称即人类，谈真人敲钟引日焚敌舰","summary":"井九嘲祖师貌丑，飞升者哗然。溪重提857基地的考察问题，井九曾答不愿为救人牺牲自己，因为「我活着，便是人类活着」；此刻他直言自己就是人类，震动全场。溪引「朕即国家」相比，称要替死去的神明完成遗愿；井九点破神明已死，并识破祖师就是启明人，祖师承认，自认神的选民负有责任。井九决意以杀止争：谁活着谁就有道理。另一边，谈真人识破祖星小岛的陷阱，替身与生化人军官先后被毁；真身远在他乡观望星空，取出魔方里的景云钟弹指敲响，钟声引动太阳喷发，火焰吞噬了祖师所在的金色行星。"},{"n":883,"orig":884,"title":"当数学家遇到了看似简单的是非题","people":["井九","西来","青山祖师","飞","溪"],"one_line":"承天程序锁死井九，西来苏醒问能否永恒","summary":"金色行星实为巨型战舰，内有模拟太阳与碧海草原。青山祖师与自称飞的浴衣少女下五子棋，少女搅乱必输棋局，允诺谈真人、西来可活，景阳投降亦可。新承天剑程序凝成光圈锁住井九，他动弹不得；溪称会尽量保住其自我意识。井九早有预案：按数学模型自估百分之七胜机，西来醒加十个百分点，曹园醒再加三，找到雪姬可过四成，谈真人杀祖师则百分之百。他的道心渐失守，仙气外溢，战舰与飞升者合围。危急时刻西来忽然苏醒，面无表情问井九自己能否永恒，井九答可以，西来斥他仍爱骗人，井九只说：不要。"},{"n":884,"orig":885,"title":"彗星消失的那一夜","people":["西来","李将军","井九","溪"],"one_line":"西来苏醒与李将军陨石为剑决战","summary":"井九留在西来精神世界的神识被信息洪流冲毁，李将军的烙印随之崩解，十二重楼剑斩碎河边的年轻道士，西来真正苏醒。他重审矿星被俘受辱的记忆，领悟死人不在乎发生在自身的事，自己如今等于活了过来，当即决定出手。李将军率先飞离，西来追随，双方隔小行星带对峙。二人皆是剑道最高境万物一的领悟者，以陨石为剑互掷对斩，小行星带被耗尽后改用彗星，满天彗星散去剑争亦止，可谓两败俱伤。西来称上次败于李将军的核动力炉不算，如今自己体内也装了一台，说罢引爆破炉，核爆光芒吞噬激光与两位剑道最强者。"},{"n":885,"orig":886,"title":"思考严肃哲学问题的飞鸟","people":["西来","井九","李将军","陈屋山石人"],"one_line":"西来悟死亡之剑，言尽溘然长逝","summary":"西来只剩半截身躯，以十二道石柱结阵抵挡舰队激光；李将军重伤垂死，陈屋山石人飞身护主，背后仍被无形剑气刻出深痕。西来出身南海雾岛，一生只求看剑道终点，先败于井九再败于李将军皆未死，此刻赢了一次却将死。他使出最后领悟的无形一剑「死亡的阴影」，井九评其差不多，只是名字普通了些。西来说自己在海边抱回死鸟、湖边久坐而悟，对死亡的态度与井九不同：最大限度的可能性存在于自我放弃之中；既然你就是人类，也就是我，我死了无所谓，你活下去就行。留下「也许我只是有些累了」，他如倦鸟合翅，就此死去。"},{"n":886,"orig":887,"title":"人间大炮","people":["井九","李将军","溪","沈云埋"],"one_line":"井九咬药保清醒，化身重离子炮击杀李将军","summary":"西来之死令飞升者各生动摇：禅宗之祖决意去杀曾圣人，陈屋山石人要找曹园一战；西来以死给「井九即人类」投下第一票。井九趁核爆打断信息洪流的一瞬，咬碎腹中藏着的沈云埋药剂小瓶，剧毒阻断大脑放电，得以保持清醒。沈云埋留下的核动力炉自爆，融化千里冰封阵，井九不理溪的死活，以其能量为源，把手指化作跨越数千公里、细至原子级的线，贯穿李将军胸口，再以体内喷出的超重粒子瞬间刺破其身六十万亿枚晶核。李将军临死领悟：井九已把修道文明与科技文明合而为一，身体就是一座重离子炮。"},{"n":887,"orig":888,"title":"下水道里","people":["井九","溪","李将军","陈屋山石人","雪姬"],"one_line":"李将军陨落，井九携溪假死脱身寻雪姬","summary":"那根细线被斩断，李将军留下遗言：收集残丝认真研究，随即闭目而亡，遗体在道念加持下化为水晶以保存残丝，陈屋山石人抱尸痛哭。千里冰封阵散去，降临溪身体的那位已借芯片离去，溪变回天真少女；井九以剑阵裹住她，冲进核爆火球借乱遁走。金色行星上，飞确认谈真人也逃了，并解谜：承天剑只能控制剑灵，井九选择自我放弃，令系统进入沉睡，程序无处启动，遂趁乱脱身。军方封锁蝎尾星云，清剿太空海盗。数日后井九潜入重工业星球，走进下水道，哑声说：我需要你的帮助。里面传出微弱的嘤嘤声。"},{"n":888,"orig":889,"title":"女王的归来","people":["井九","雪姬","钟李子","赵腊月","寒蝉"],"one_line":"井九循迹寻回雪姬，赵腊月叩响钟李子门","summary":"井九借星域网监控寻雪姬：以粒子加速器异常、血拇误报、气温异常与寒蝉标记为线索，锁定阿尔矿星及寒蝉画下的红色弗思剑街画。他靠沈云埋的药剂压制大脑放电，仍挡不住承天程序劈斩意识，也由此明白西来必须死，否则祖师可循其体内神识追踪自己。酸雨中寒蝉与蚊群先出，雪姬随后自下水道爬出，浑身污泥、满眼恐惧——她怕被世界主控程序（那位少女祭司）发现并改写。井九见昔日主宰沦落至此，倒在雨中。另一边，钟李子遭暗杀后撕开黄纸鹤获救，却被层层降级逐回地底公寓；深夜叩门者正是赵腊月，肩头蹲着白猫阿大。"},{"n":889,"orig":890,"title":"小雨","people":["井九","雪姬","溪","寒蝉"],"one_line":"雪姬极寒冻碎戒指，井九吞片自防","summary":"雪姬对众人满心警惕，井九请她帮忙毁掉戒指——戒面覆有十二个屏蔽一切力量的微型阵法。雪姬嘤嘤诉说苦衷：她不想被这个世界发现，因为朝天大陆是神明实验室，她是主控程序兼天宝真灵，一旦被那位少女祭司（主控程序）察觉便会被改写。井九以「没有我你离不开朝天大陆」相要挟，雪姬只得出手：先布承天剑阵屏蔽信息通道，再握住他的手指，以极致低温冻灭微型阵法，戒指碎成小片，井九立刻吞下所有碎片。寒意未散，他体内响起如小雨落叶般的噼啪声——那是重粒子在轰击戒片，确保阵法无法重构。"},{"n":890,"orig":891,"title":"大雪","people":["井九","雪姬","溪","寒蝉"],"one_line":"井九低温自封压程序，酸雨化雪众人行",
