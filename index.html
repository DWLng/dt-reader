<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161a">
<title>大道朝天 · 速读版</title>
<style>
:root{--fs:19px;--hd:52px;--ft:56px}
html[data-theme=dark]{--bg:#12161a;--panel:#1a2026;--ink:#c9ced6;--dim:#77828e;--acc:#7fc0a8;--line:#242c34;--chip:#1e262e}
html[data-theme=paper]{--bg:#f2ecdf;--panel:#e9e1cf;--ink:#3c372e;--dim:#8a8172;--acc:#8a6d3b;--line:#ddd2ba;--chip:#e4dbc6}
html[data-theme=green]{--bg:#cfe6cf;--panel:#c2dcc2;--ink:#2f3a2f;--dim:#6b7d6b;--acc:#3e704e;--line:#b2cbb2;--chip:#c8e0c8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang SC","Noto Serif SC",serif;-webkit-tap-highlight-color:transparent}
#pbar{position:fixed;top:0;left:0;height:3px;background:var(--acc);width:0;z-index:30;transition:width .2s}
header{position:fixed;top:0;left:0;right:0;height:calc(var(--hd) + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);
 display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
 border-bottom:1px solid var(--line);z-index:20;padding-left:6px;padding-right:6px}
header button{background:none;border:none;color:var(--dim);font-size:19px;padding:8px 10px;cursor:pointer;font-family:inherit}
header button:active{color:var(--acc)}
#hTitle{flex:1;text-align:center;font-size:14px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:1px}
#banner{position:fixed;top:calc(var(--hd) + env(safe-area-inset-top));left:0;right:0;background:var(--panel);color:var(--dim);
 font-size:12px;text-align:center;padding:5px 10px;border-bottom:1px solid var(--line);z-index:19}
main{max-width:680px;margin:0 auto;padding:calc(var(--hd) + env(safe-area-inset-top) + 26px) 22px calc(var(--ft) + env(safe-area-inset-bottom) + 40px)}
h2{font-family:"Noto Serif SC","Songti SC",serif;font-size:24px;line-height:1.4;text-align:center;margin-bottom:10px;color:var(--ink);letter-spacing:1px}
#cOne{text-align:center;font-size:13px;color:var(--dim);margin-bottom:14px;letter-spacing:.5px}
#cPeople{text-align:center;margin-bottom:18px}
#cPeople span{display:inline-block;background:var(--chip);border:1px solid var(--line);color:var(--dim);
 border-radius:20px;padding:2px 11px;margin:3px 2px;font-size:12px}
#cBody p{font-size:var(--fs);line-height:2.02;margin:0 0 1.05em;text-align:justify}
#cBody p.first::first-letter{font-size:1.6em;font-family:"Noto Serif SC","Songti SC",serif}
#cEnd{margin-top:34px;text-align:center}
#cEnd button{background:var(--chip);border:1px solid var(--line);color:var(--acc);border-radius:10px;
 padding:11px 22px;font-size:14px;cursor:pointer;font-family:inherit}
footer{position:fixed;bottom:0;left:0;right:0;height:calc(var(--ft) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);
 display:flex;align-items:center;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);
 border-top:1px solid var(--line);z-index:20}
footer button{flex:1;background:none;border:none;color:var(--ink);font-size:15px;padding:14px 6px;cursor:pointer;font-family:inherit}
footer button:disabled{color:var(--dim);opacity:.4}
#pos{text-align:center;font-size:12px;color:var(--dim);min-width:86px}
#tocMask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
#tocMask.open{display:block}
#toc{position:absolute;top:0;right:0;bottom:0;width:min(360px,88vw);background:var(--bg);border-left:1px solid var(--line);
 display:flex;flex-direction:column}
#tocHd{display:flex;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;border-bottom:1px solid var(--line);align-items:center}
#tocQ{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:9px 12px;font-size:14px;outline:none}
#tocClose{background:none;border:none;color:var(--dim);font-size:18px;padding:6px;cursor:pointer}
#tocList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
#tocList div{padding:11px 16px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5;cursor:pointer;display:flex;gap:8px}
#tocList div:active{background:var(--panel)}
#tocList div.cur{color:var(--acc)}
#tocList .rn{color:var(--dim);font-size:12px;min-width:44px}
#tocList .tick{color:var(--acc);font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(var(--ft) + 24px);transform:translateX(-50%);background:var(--panel);color:var(--ink);
 border:1px solid var(--line);border-radius:20px;padding:8px 18px;font-size:13px;z-index:50;display:none}
/* ── 听书 ── */
.sent.speaking{background:color-mix(in srgb,var(--acc) 30%,transparent);border-radius:4px;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 30%,transparent)}
#btnTts.playing{color:var(--acc)}
#ttsSheet{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--panel);border-top:1px solid var(--line);
 border-radius:16px 16px 0 0;padding:14px 18px calc(env(safe-area-inset-bottom) + 14px);transform:translateY(105%);
 transition:transform .25s;max-width:680px;margin:0 auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
#ttsSheet.open{transform:translateY(0)}
.ttsRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.ttsRow label{font-size:13px;color:var(--dim);min-width:56px}
#ttsSheet button.tt{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:14px;cursor:pointer;font-family:inherit}
#ttsSheet button.tt.big{flex:1;padding:11px}
#ttsSheet button.tt.big.playing{color:var(--acc);border-color:var(--acc)}
#ttsRates button{background:var(--chip);border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit;margin-right:4px}
#ttsRates button.on{color:var(--acc);border-color:var(--acc)}
#ttsVoice{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font-size:13px;max-width:100%}
#ttsPitch{flex:1}
.ttsTip{font-size:11px;color:var(--dim);line-height:1.7;margin-top:2px}
#ttsBar{position:fixed;left:0;right:0;bottom:calc(var(--ft) + env(safe-area-inset-bottom));height:46px;display:flex;align-items:center;gap:4px;background:var(--panel);border-top:1px solid var(--line);padding:0 6px;z-index:33;max-width:680px;margin:0 auto;box-shadow:0 -4px 16px rgba(0,0,0,.2)}
#ttsBar[hidden]{display:none}
#tbPlay,#tbExpand,#tbStop{background:none;border:none;color:var(--ink);font-size:17px;padding:10px 12px;cursor:pointer;font-family:inherit}
#tbStop{color:var(--dim)}
#tbTitle{flex:1;font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
</style>
</head>
<body>
<div id="pbar"></div>
<header>
  <button id="btnToc">☰</button>
  <div id="hTitle">大道朝天 · 速读版</div>
  <button id="btnFont">Aa</button>
  <button id="btnTts" aria-label="听书">🎧</button>
  <button id="btnTheme">◐</button>
</header>
<div id="banner" hidden></div>
<main id="art">
  <h2 id="cTitle"></h2>
  <div id="cPeople"></div>
  <p id="cOne"></p>
  <div id="cBody"></div>
  <div id="cEnd"></div>
</main>
<footer>
  <button id="btnPrev">‹ 上一章</button>
  <div id="pos"></div>
  <button id="btnNext">下一章 ›</button>
</footer>
<div id="tocMask"><div id="toc">
  <div id="tocHd"><input id="tocQ" placeholder="搜索章节名 / 章号…"><button id="tocClose">✕</button></div>
  <div id="tocList"></div>
</div></div>
<div id="ttsSheet">
  <div class="ttsRow" style="justify-content:space-between;margin-bottom:6px">
    <b style="font-size:14px">听书</b>
    <button class="tt" id="ttsCollapse">收起 ▾</button>
  </div>

    <button class="tt big" id="ttsPlay">▶ 从当前阅读位置开始听</button>
    <button class="tt" id="ttsStopBtn">⏹</button>
  </div>
  <div class="ttsRow"><label>倍速</label><div id="ttsRates">
    <button data-r="0.75">0.75×</button><button data-r="1">1×</button><button data-r="1.25">1.25×</button><button data-r="1.5">1.5×</button><button data-r="2">2×</button>
  </div></div>
  <div class="ttsRow"><label>音色</label><select id="ttsVoice"></select></div>
  <div class="ttsRow"><label>语调</label><input type="range" id="ttsPitch" min="0.7" max="1.3" step="0.05" value="1"></div>
  <div class="ttsRow"><label>连播</label><input type="checkbox" id="ttsAuto" checked> <span style="font-size:12px;color:var(--dim)">本章读完自动进入下一章；收起面板后照常播放</span></div>
  <div class="ttsRow"><label>跟随</label><input type="checkbox" id="ttsFollow" checked> <span style="font-size:12px;color:var(--dim)">正在读的句子加亮并自动滚动</span></div>
  <div class="ttsTip">朗读从当前阅读位置开始；收起面板后由底部迷你播放条控制，不遮挡阅读、播放不中断，点标题跳回正在听的章节。想要更自然有感情的语音：iPhone 到 设置 → 辅助功能 → 朗读内容 → 声音，下载「Siri」或「增强」版中文语音。「在线高清」音色为 MiniMax 预生成的全书音频（有感情、按句精确高亮），未生成的章节自动回退本机语音。</div>
</div>
<div id="ttsBar" hidden>
  <button id="tbPlay">⏸</button>
  <div id="tbTitle"></div>
  <button id="tbExpand">☰</button>
  <button id="tbStop">✕</button>
</div>

<script>
const BOOK = {"book":"大道朝天","author":"猫腻","generated":"2026-10-03T10:49:22","total_units":1024,"present":1024,"done":true,"orig_chars":3098649,"comp_chars":235637,"ratio_pct":7.6,"entries":[{"n":1,"orig":1,"title":"序","people":["井九"],"one_line":"井九自白：人生若重来，我大概还是这样。","summary":"全书题记。仅一句主角井九的自白：如果人生能够重来，我大概还是这样。以第一人称定下全书基调——纵使重活一世、再选一次，他依然会走同一条长生大道，不改其志。"},{"n":2,"orig":2,"title":"三千里禁","people":["赵腊月","阴三","孟师"],"one_line":"赵腊月杀冥部探子，青山颁三千里禁迎景阳飞升。","summary":"云集镇酒楼中，冥部弟子阴三被一条淡银色细链捆住，仍惦记吃火锅，不断向桌对面静坐不语的少女搭话。少女赵腊月年仅十二三岁却辈分更高，一言不发，以悬停的小剑在阴三眉心开出血洞将其杀死，剑索收回化作腕间银镯，留下一句「我是外门弟子，没有剑」。青山宗孟师现身，称冥部妖人死有余辜，嘱弟子清理痕迹，莫扰世间。众人议论：七日前天光峰颁下三千里禁，非请者格杀勿论；两忘峰师兄已去浊河镇妖，四大镇守同时醒来，满天星光被吃去一半。禁令越长事情越重，当年太平真人闭死关也只下八百里禁。如此如临大敌，只因青山宗千年最大的一件大事：景阳师叔祖今日飞升。"},{"n":3,"orig":3,"title":"斩天一剑","people":["景阳","孟师","赵腊月"],"one_line":"景阳不待天雷，一剑斩开天穹强行飞升。","summary":"观礼大人物云集：悬铃宗老太君、无恩门主、镜宗长史、卷帘人接连现身，佛宗禅子也到了，云层深处还藏着别处大陆的大能。孟师回想师叔祖景阳的传闻：他是太平真人师弟、大陆境界最高的强者，却自入青山便静修峰间，不赴梅会、不与人切磋、从未出手，只是修行，孟师疑惑这样的传说对宗门苍生有何意义。赵腊月提着阴三尸体走向镇外，全程不望峰顶。天光峰上掌门出剑，剑意扫过群峰，逼得西海剑神的剑光退出三千里外。第九峰孤峰突遭数十团天雷轰击，峰中生出一道剑光，随意斩向天空：天雷遇之而灭，湛蓝天穹被斩出一道细口，金玉般的光浆流泻而下，照亮整个大陆——景阳不等第二轮天雷，主动一剑斩开通天之路，观礼众强者尽皆震惊失语。"},{"n":4,"orig":4,"title":"再次踏进那条河的白衣少年","people":["赵腊月","井九"],"one_line":"白衣少年收走石尸飞剑化作腕镯，却忘了入门口诀。","summary":"赵腊月提着阴三的尸体出镇，看着天空的裂口与剑光露出笑容，遗憾不能与景阳师叔祖同代求学问道，转身时却对手中的尸体隐隐生疑。另一边，白衣少年站在山腹石室中，石床上躺着一名浑身伤口、气息全无的死者，脸上笼着无法看清的雾气，腰间黑木腰牌忽然消失，一道飞剑离开尸体绕他疾飞，最后落在他腕上化作银镯。少年说他羡慕死者可以休息，自己还要再忙很多年。他想起「人不可能两次踏进同一条河」的话，走进溪水，顺流跌进湖里，狼狈地抱着湖底石头上岸。他无法唤出剑火烘干衣物，只好翻找久远记忆钻木取火，算出烘衣需三刻，便用这段时间静思修行，睁眼时却发现自己竟想不起入门口诀。"},{"n":5,"orig":5,"title":"九天","people":["井九","柳十岁"],"one_line":"井九进村被当仙师，九天学会所有家务。","summary":"白衣少年顺溪走出深山，来到一座村庄。村民见他容色惊人，认定是仙师，全村跪拜。他说要在这里住一年，看中田里一个憨厚结实的男孩，让他教自己铺床叠被、洗衣做饭、砍柴种田，并给他改名：今后叫柳十岁。村民坚信仙师身边自有剑童，对柳家羡慕不已。当夜柳十岁开始教学，第二天便发现这位「仙师」是真的什么都不会：倒水会倒出米、柴砍得太细、鱼鳞不会刮。但九天之后，少年学会了所有家事，把小院打扫得窗明几净，做出来的饭比谁都香，砍的柴漂亮得无法形容，还编了把竹椅、修好院墙与檐角，唯独从没见他洗过衣裳，白衣却始终雪白。柳十岁再也无法怀疑对方的身份。"},{"n":6,"orig":6,"title":"一年","people":["井九","柳十岁","吕师"],"one_line":"井九自报姓名，推演三年三千年，等来吕师。","summary":"秧苗插得笔直完美，井九看一眼便满意收工，自称只是想学并不喜欢，因为懒且不擅长，他真正擅长的是「切断」——找到万物薄弱处令其断开。柳十岁问他名字，他答：井九，水井的井，第九的九。一年过去，井九把日子全用来睡觉，散尽银钱修祠堂、仙庙和进县城的新路，偶尔指点村中孩子读书，被村民敬若神明。夜里井九敲着竹椅指点柳十岁呼吸吐纳，柳十岁觉得心越来越静。井九看水中倒影：那张脸完美至极，只配了一对有趣的招风耳。他对柳十岁谈起推演：若耗尽心血写成的文章被烧成灰，除了重写别无他法，且重写必是更好的文章，因为记不住的词句本就不重要。当夜他说「我只推算出时间到了」，一位背负长剑的中年修行者从天而降。"},{"n":7,"orig":7,"title":"偏向故山行","people":["吕师","柳十岁","井九"],"one_line":"吕师验出柳十岁天生道种，携井九步行入青山。","summary":"中年修行者吕师出自青山第三峰上德峰，承意圆满、两度冲击无彰境失败，现任南松亭门师，为招好弟子亲自下乡。他发现柳十岁竟是天生道种，狂喜现身，却先前完全没察觉躺椅上白衣少年的存在；细看之下，井九道心稚嫩、并无道种，他只当是空有皮囊的凡人美少年。吕师问柳十岁可愿修大道求长生，柳家父母隔墙哭泣，柳十岁却只犹豫能不能带上公子，井九说「想去就去」。夜里井九告诉忐忑的十岁：收弟子只看天赋，心性随年月而变没法看，还说「无敌者才无敌」。清晨出发，柳家发现院里的竹椅不见了；厢房水缸里，半颗淡青色丹药正悄悄融化。吕师竟全程步行百余里而不驭剑，井九暗觉奇怪。第三日三人穿过大雾到了南山门，门口一名灰袍男子正趴在桌上睡觉。"},{"n":8,"orig":8,"title":"第一堂课","people":["吕师","柳十岁","井九","明国兴"],"one_line":"柳十岁登记入册，吕师讲授有仪与抱神二境。","summary":"守山门的明国兴用剑识一观柳十岁，惊得声音发颤：天生道种！吕师唯恐夜长梦多，当即登记入册进山门——入了山门，任何宗派乃至朝歌都别想抢人。明国兴问姓名，柳十岁认真答「我就叫柳十岁」。二人以主仆之礼往里走，明国兴震惊于天生道种竟甘为人仆，吕师无奈表示早劝过但说不听。剑堂前，数十名由各处选来的新弟子已苦等多时——授业仙师一直在等一位弟子。吕师驭剑先至，分发入门法诀，讲授初境两阶段：一为有仪，熟习功法炼体端正仪姿，待圆满时道种稳定、能熬过心罡之乱；二为抱神，意志坚定后感应天地灵气，纳灵气化真元，充盈灵海，方算境界初成。众弟子听得入神，唯独柳十岁在队尾给井九倒凉茶、打圆扇，声声入耳。"},{"n":9,"orig":9,"title":"天生道种","people":["吕师","柳十岁","井九","薛咏歌"],"one_line":"吕师寄望柳十岁赶上赵腊月，众人惊闻天生道种。","summary":"柳十岁倒茶的动静引吕师不悦，他弹指一声剑音震醒众人，训话：不论天赋如何都要争取三月内破有仪、三年内抱神圆满入内门，大道越往后越难，三年进不了内门这条大道不走也罢。有弟子天真地问能否参加三年后的承剑大比，引来哄笑——那需要守一境圆满。吕师却突然说：希望你能赶上赵腊月，说的竟是柳十岁，满场震动。散课后弟子们得知柳十岁是天生道种，青山宗除赵腊月外只有掌门关门弟子卓师兄有此资质，差距太大，连嫉妒都生不出来。世家子薛咏歌殷勤推荐甲四院，柳十岁却以溪水声吵、公子爱睡觉为由，向执事要了后山两间相邻小院。井九翻看入门口诀，发觉与当年只差两处细微修改，看不了多久便睡着了。黄昏柳十岁满脸通红奔回小院，跪地重重磕了两个头。"},{"n":10,"orig":10,"title":"随你","people":["柳十岁","井九","吕师"],"one_line":"柳十岁悟出玉门吐息来历，宁弃修行也要报恩。","summary":"柳十岁炼体时呼吸自然进入奇特节奏，完美配合发力，正是一年前井九在村里教的呼吸法——玉门吐息。他这才明白井九一眼认出自己道种后早有安排，用最基础的吐息护住了他的天赋。井九说你不用谢我，你也教过我，只是交换，让他不必再来服侍；柳十岁急问「你不要我了吗」，井九看着庭院，只说「随你」。此后十余天外门弟子日夜苦修，柳十岁破境在望，却依然每天打理井九起居，吕师与众人都觉荒唐，渐渐动了把二人隔离、甚至找理由赶走井九的念头。深夜吕师堵住柳十岁，斥修道者岂能为人奴仆，命他一剑斩断故往；柳十岁低头说「公子对我有大恩，我要报答他」，若赶公子走自己便不修行了。吕师转怒为欣赏，答允不强赶，却警告他：变化已然发生，有一天井九会跟不上他的脚步。"},{"n":11,"orig":11,"title":"公子只是怕麻烦","people":["井九","柳十岁"],"one_line":"井九吃紫玄丹如炒豆，灵海太深填满需一年。","summary":"柳十岁辗转一夜，清晨照旧来洒扫服侍，甚至干劲更足，井九便不再提赶人的话。柳十岁终于鼓起勇气劝：公子再懒下去怎么通过内门考核、被赶走怎么办？井九怔了怔，笑了。当夜他独自望峰：其实他踏进山洞那条溪时便已是抱神境，快得冠绝青山，只因这具身体特殊——能顺畅吸纳并承受海量天地元气。他把初境最好的丹药紫玄丹当炒豆嚼，寻常弟子一颗等若一年苦修、多吃会真元暴涨而死，他却毫无反应；问题在于灵海如深不见底的大海，填满极慢。他推算紫玄丹三日后便再无用处，填满灵海还需一年多。他解释自己并非懒而是怕麻烦：山村一年长睡，是在融合这具身体、思考自己为何在此、推演从前与将来、计算得失局面。如今无事可做，他第一次体会到一种叫「无聊」的情绪。"},{"n":12,"orig":12,"title":"像花儿一样","people":["井九","柳十岁","薛咏歌"],"one_line":"井九首次出院，为柳十岁稳境界、答疑解惑。","summary":"入门十余日，井九头一次走出小院，崖坪间苦修的弟子们哗然，议论纷纷：多半以为他是受不住书童翻身、自己沦为笑柄的羞辱才闭门不出，连招呼都吝啬。井九径直去剑堂喊柳十岁：「你来一下。」堂内众弟子正围着天生道种请教，薛咏歌冷嘲「还把自己当少爷」，话未说完柳十岁已满脸通红地跑到公子跟前，欢喜得像花儿一样。回院后井九递给他一杯融了紫玄丹的茶，助他稳固抱神境界；柳十岁担心与仙师赐的丹药冲突，井九说那些太差不吃也罢，他便一饮而尽。随后井九难得心情不错——其实只是无聊——有问必答，如剑芒斩开繁复，把修行讲得简单清楚，柳十岁仰慕不已。临别井九忽然反问：你聪明善良坚毅，有坚定的是非观，为什么还要留在我身边？"},{"n":13,"orig":13,"title":"剑堂三静","people":["井九","柳十岁","薛咏歌","吕师"],"one_line":"井九入剑堂替众弟子断疑，句句见血。","summary":"柳十岁低着头打死不答，转天却向井九坦白：昨夜把公子的解答告诉了同门，他们还有疑难，他答不了。井九叹口气——看在他服侍用心的份上，再说再不表现点什么只怕真要被赶走。剑堂里，几位天赋较好的弟子递上写满疑难的纸，薛咏歌讥他「看过几本书便指点江山」，被柳十岁虎崽般的眼神逼得冷笑出堂。井九逐张看题，语气平淡却句句断死：这个想法错了，灵海与剑果的关系暂时不必想；引天泉灌顶不是引天地元气而是体意相通；这句话没可能、道种会枯死、经脉图画错会瘫痪、从前面到后面就没有对的。越平淡越有说服力，弟子们头越来越低。他提笔疾书写下许诺的图解，众人围拢屏息观看，剑堂一片死静。此时吕师走进来，皱眉喝问：你们这是在做什么？你又是在做什么？"},{"n":14,"orig":14,"title":"初露锋芒","people":["吕师","井九","柳十岁","赵腊月"],"one_line":"赵腊月初驭剑惊动全宗，井九锋芒初露。","summary":"吕师本要训斥井九妄言解疑，接过纸细看却越看越惊：纸上显露的眼光与能力太过优秀，再看井九的眼神温和了许多，只告诫众弟子宗门只予法诀是为了验各人悟性心性，今日不罚、下不为例。井九却当众说这法子太蠢应该改，还要举例清容峰——说她出身南寨不通文字，当年若无人教识字，青山宗险些错过这位天才。话被一声巨响打断：一道剑光破云穿行，正是天生道种赵腊月初次驭剑成功，群峰间欢呼雷动。井九只淡淡评了句「不错啊」。柳十岁告诉他，赵师姐十二岁入青山、一年抱神圆满入内门、三月在云行峰得古剑认主，如今十四岁已可驭剑，境界近守一；青山宗自师叔祖飞升后缺绝世天才，如今指望她两年后在承剑大会上与洛淮南、童颜、白早乃至果成寺禅子等外界天才分庭抗礼。"},{"n":15,"orig":15,"title":"又一年","people":["吕师","井九","柳十岁"],"one_line":"一年后井九沙盘积沙，柳十岁疑他是奸细。","summary":"深夜吕师来访，指出井九晨间最后一题解错——那是景阳师叔祖亲自做的法诀新解。井九坚持：宗门以前的理解没错，是新解法错了，谁都会犯错，不管他是外门弟子还是师叔祖。吕师斥他恃才傲物，井九再提宗门教育之弊，并说出清容峰峰主不识字、险些被埋没的旧事，吕师大惊他如何得知，暗疑这少年是某座峰提前布下的棋子。转眼一年，柳十岁已十二岁，气质从容，众人皆知他申请了内门考核——入山门仅一年，史上只有飞升的师叔祖用半年、掌门关门弟子卓如岁用一年半、赵腊月用一整年。同门多认为他因服侍井九分心而胜算渺茫，吕师也早对「太懒」的井九死了心，只注意到他椅边多了个沙盘，沙粒日增，连柳十岁也不许碰。院中柳十岁坦白要参加考核后，忽然低声问：公子，你是别的宗派的奸细吗？"},{"n":16,"orig":16,"title":"终于到来的分别","people":["柳十岁","井九","吕师","明国兴"],"one_line":"柳十岁引剑胎强鸣入内门，井九送别嘱莫记。","summary":"柳十岁担心井九是奸细，井九失笑摇头：反正我不是。柳十岁想想也对——这么美又这么懒的人，整天呆在院里能打听到什么？考核当日南松亭全员送行，井九果然没来。吕师半年前用剑识查过井九，发现他连道种都没养成，彻底失望，只嘱咐柳十岁心无杂念。考核房中，柳十岁把手放上漆黑冰寒的剑胎，催动真元，剑胎嗡鸣如无数剑同时相撞——天生道种引出的强共鸣让两位考官震惊狂喜。半个时辰后他笑着走出剑堂，满场欢呼。树林深处井九懒得去看：天生道种、提前筑基、还吃过紫玄丹，除非灵海和他一样深不见底才可能失败。柳十岁跑回小院激动得说不出话，井九难得起身，认真送别：大道险且漫长，此去经年，忘却是自然之事，莫刻意记起。柳十岁生气答：我才不会忘记。"},{"n":17,"orig":17,"title":"我看错你了","people":["井九","吕师","薛咏歌"],"one_line":"三年后井九自陈抱神圆满，吕师自叹看错。","summary":"柳十岁进入诸峰后再没回来。井九开始自己做杂务，每天往沙盘里放两三粒沙，对外门的冷嘲热讽毫不在意。吕师某夜再来，剑识确认井九体内依然没有道种，确定他并非哪座峰暗选的弟子，惜才心起，主动安排后路：推荐他去专藏剑诀真法的适越峰做执事，整理典籍深研学问，可为宗门立功、受赏仙药，只是再没资格得授真剑。井九婉拒——他不喜欢适越峰，而且再过一年他就要离开这里。第三年春，井九罕见地主动到剑堂找吕师：我准备进内门，灵海已基本填满，抱神境应该算圆满了。吕师怒而用剑识笼罩他准备揭穿谎言，查明属实后茶杯坠地摔碎，喃喃「原来我还是看错了」。井九拍拍他的肩：这不是你的错。消息传开，距抱神圆满仅一步之遥的薛咏歌脸色大变，公然质疑他怎么可能灵海已满。"},{"n":18,"orig":18,"title":"非一日之寒","people":["井九","薛咏歌","玉山","元骑鲸","迟宴"],"one_line":"井九一眼过考核；诸峰议事暗流涌动。","summary":"薛咏歌带头嚷「内门考核岂能乱来」，玉山师妹率感念答疑之恩的同门反击，剑堂外吵成一片。房内井九根本没把手放上剑胎，只看了一眼便引出一声清冽剑鸣——若真动用全部真元，剑胎会被融成铁团。考核通过，欢呼四起，井九回望小院片刻便离开，竹椅与沙盘随他消失。同日诸峰议事：五把主剑悬于天光峰顶，独碧湖峰潮来剑未至，无人敢问。剑律元骑鲸定下赏罚重赏吕师；清容峰主提议重用柳十岁，元骑鲸却疑他入门前练过罕见吐息法、有奸细之嫌，清容峰主一句「既然你查过就该知道他绝不是奸细」令他作罢。上德峰石室中，元骑鲸向师弟迟宴点破：柳十岁练的是玉门吐息，是掌门挑中的人。迟宴不甘，转而盘算「另一位天生道种」，又问起刚通过考核的井九，元骑鲸冷哼一声：那个懒鬼？"},{"n":19,"orig":19,"title":"说一不二","people":["元骑鲸","迟宴","雷破云","井九"],"one_line":"雷破云疯囚剑狱，井九看画后初入内门。","summary":"元骑鲸向迟宴交底：碧湖峰峰主雷破云疯了，对外只说他在朝歌被不老林与冥部联手偷袭重伤。疯子被关在上德峰深井——那口井直通地底剑狱，井底日夜传出凄厉喊声：「就算没有一，那二呢！」整座青山没几人懂这句话，迟宴懂，他甚至怀疑正是这句话让雷破云发疯，更疑心掌门为何不干脆让他死，留他到此试探自己。井九进内门前，依腕上银镯（飞剑）之意去了画像小楼，看完历代两忘峰主的七幅画像，又在最新挂上的景阳真人画像前站了很久：「我都快忘了你长什么样。」此后是内门洗剑阶段：弟子须在洗剑溪畔接连突破知通与守一，才有资格参加承剑大会，被诸峰收为亲传，或报名两忘峰——青山宗的剑。昔来峰师叔问井九若始终破不了境怎么办，他认真答：我从来没想过这个问题。对方大笑，称这是最完美的答案。"},{"n":20,"orig":20,"title":"一部剑经四个字","people":["井九","林无知"],"one_line":"林无知讲九剑与境界，井九凝视「万物一剑」。","summary":"洗剑阁中，掌门亲传弟子、天光峰林无知讲授剑道入门：青山乃剑宗，九峰有九剑可定天下——天光承天、上德三尺、云行皆空、清容锦瑟、适越回日、昔来如岁、碧湖潮来、神末弗思、两忘不二；其中弗思与不二两剑随景阳师叔祖飞升被带走，九剑失其二。弟子们疑虑实力折损，林无知教训：剑随人起，人足够强剑便足够强，若能修到通天境，你们的剑便有资格补上主剑之位。随后讲次境两关：知通境以灵海灌注道种结成剑果、剑意与飞剑相联方能控剑；守一境真元转剑元、剑果成金质，剑丸一成便可驭剑而行、参加承剑大会。判断标准极简：一剑杀百丈外之敌为承意，飞剑十余里杀敌为游野，一剑千里为通天，一剑破空斩域外天魔便是大陆最强。满堂欢声里，井九只盯着剑经首页四个墨字：万物一剑。"},{"n":21,"orig":21,"title":"问剑于黑衣老者","people":["井九","林无知","莫师叔"],"one_line":"登剑峰取剑乃第一课，井九问出莫师叔归剑之意。","summary":"林无知带十余名新晋内门弟子来到云行峰（剑峰）下讲解：青山强者寿元将尽时会把飞剑归还此峰，峰中藏剑无数、来历成谜，越往峰顶品质越高；赵腊月常年在云雾深处修行剑意焠体——那是极苦极险、通常只有寿元将尽者才用的法门，井九对她生出几分欣赏。弟子们站在山下便被剑意刺得眼睛发酸，林无知宣布入门第一天就要登峰取剑，这是青山第一课。此时一名满头白发、容颜枯槁的黑衣老人到来，林无知与云行峰执事恭送备至——他是在适越峰抄书百余年的莫师叔。老人温和地勉励众弟子，见井九生的好看，认真嘱他今后多努力，井九却目无回应，弟子们拼命使眼色也不理。老人自嘲一笑，转身向剑峰走去，井九忽然开口：「你的剑现在怎么样？」"},{"n":22,"orig":22,"title":"剑归青山","people":["莫师叔","井九","林无知","柳十岁","顾寒"],"one_line":"莫师叔剑归青山仙逝，林无知责令井九必取其剑。","summary":"黑衣老人答「很久没用过，我也不确定」，井九说「要不然，我试试」，老人沉默良久应道：看你本事。他驭剑而上，身形不再佝偻，如初入青山时的少年，消失在云雾里。峰间无数剑鸣齐响，执事高唱「莫师伯剑归青山」，九峰齐应贺。弟子们这才明白：老人是仙逝前把剑还给青山，盼后人继承。林无知眼眶微湿，又警告井九——他那句话激起了莫师伯最后的骄傲，剑归在离峰顶极近处，既然答应就必须做到，否则不管他是哪座峰选好的弟子，都不许参加承剑大会。执事分发剑牌，言明抱神境取剑无望、普通弟子平均三年才有飞剑，赵腊月也用了三个月。众弟子商定先上峰熟悉环境，井九却转身便走。此时两忘峰三师兄顾寒带人自林中走出，身旁正是已十三岁的柳十岁，柳十岁惊喜大叫着奔向井九。"},{"n":23,"orig":23,"title":"丑小鸭的第一次飞翔","people":["柳十岁","顾寒","井九","马华"],"one_line":"柳十岁受棍罚仍念公子，断崖初驭剑飞入云层。","summary":"柳十岁奔向井九急停不住，同门这才知道他就是传说中的天生道种。顾寒喝问井九「你在做什么」，不许柳十岁解释，命他自己领受责罚：胖子捧出两忘峰的规矩木棍——用峰规管教等于把柳十岁当作两忘峰亲传，众人羡慕多于同情。木棍闷响不停，柳十岁含泪硬撑，示意井九不要乱来；井九安静片刻转身离去，只有顾寒注意到他也摇了摇头。顾寒与马华评价井九：道种资质普通，两年破境多半靠丹药，两忘峰的剑是用来杀人的，智识无用；并警告柳十岁记住两忘峰弟子不可能是仆人，不许再与井九来往。执事透露柳十岁半年前便已取剑。顾寒带他登上剑峰，在千余丈断崖边逼他第一次驭剑，柳十岁吓得迈不出步，最后说「我还是要与公子见面的」，踏剑而出，摇摇晃晃地飞入云层之上。"},{"n":24,"orig":24,"title":"重逢夜话","people":["柳十岁","井九","顾寒"],"one_line":"柳十岁夜访井九叙旧，井九直言不喜欢两忘峰。","summary":"顾寒知道柳十岁驭剑去了云层上方，想起自己当年亦然，又想到不肯入两忘峰的赵腊月，叮嘱胖子不要让十岁与那个废物见面。井九回到崖畔洞府，过着晒太阳、给猿猴扔果子的日子。夜里柳十岁来访，为顾寒解释：他是好人只是严格，还允许自己私下称师兄、许诺在承剑大会上取他；说罢便熟门熟路地替井九铺床叠被、洒扫院子——天生道种为刚入内门的弟子做杂役，无人看见。他讲了一年见闻，又提议介绍公子与顾师兄认识、一起学剑，井九摇头：我不感兴趣，我不喜欢两忘峰，还有你那位顾师兄——就算他是圣人我也可以不喜欢。柳十岁委屈说不过他，暗想莫非是白天受罚的缘故。离开后柳十岁踏剑升空，兴奋大喊，被耳力远超同侪的井九听在耳里。井九摸着手腕上的镯子心想：从一开始他就没喜欢过两忘峰，这就是证明。"},{"n":25,"orig":25,"title":"九夜","people":["柳十岁","井九","马华","顾寒","玉山"],"one_line":"两忘峰阻隔二人往来，九夜渐断，承剑大会定明春。","summary":"柳十岁接连几夜来访：第三夜来服侍时腿脚不便、颈后有伤，谎称比剑所受，井九沉默。第四夜来的是两忘峰排三十七的胖子马华，代顾三传话：不要再与十岁见面，他现在每天都被峰规惩罚；又暗示十岁既然不能来看你，你完全可以去看他——邀井九入两忘峰，还说自己不管他是不是靠丹药入的内门，这么懒还能走到这一步便是天才，两忘峰最喜欢天才。井九不喜两忘峰，抬手送客。第五夜柳十岁面有疲惫与犹豫，第六夜没来，第七夜来了，第八夜没来，第九夜井九确认他不会再来，此后不再望向窗外。新一批弟子入内门，薛咏歌宣扬井九懒散却响应寥寥，玉山师妹与乐浪郡元姓少年专程探望。玉山告知承剑大会定于明年初春，柳十岁剑丸已成，若赶上将成为史上第二年轻的承剑者。次日清晨，井九出洞去找柳十岁。"},{"n":26,"orig":26,"title":"要有剑","people":["井九","顾寒","柳十岁","梅里","林无知"],"one_line":"井九顶撞顾寒称配用莫剑，决意上剑峰取剑。","summary":"井九因玉山师妹告知承剑大会将近、想着柳十岁或许需要稳剑丸的玄济丹，来到洗剑溪上游练剑处。顾寒喝问「有事？」，井九答「不关你事」，满溪哗然。顾寒讥他半年境界毫无进展、连剑果影子都没有，问他觉得自己有资格用莫师叔的剑吗，井九想也不想：「有。」顾寒斥凭丹药永远上不了通天大道。清容峰梅里师叔出面说修行在个人、与你无关，林无知也赶到说井九是他课上的人，顾寒深深看井九一眼离去，留话要柳十岁自己决定去留。梅里与林无知各为其主争人：墨师叔想看看井九有没有希望，梅里放话只要井九能承剑必然进清容峰。井九被顾寒霸道的剑识查探引出久违的不喜——当年不喜便一剑杀了，但首先得有把剑；腕上镯子不能用，而且他答应了小莫。要有剑，剑在剑峰上，井九便去了剑峰。"},{"n":27,"orig":27,"title":"见到一双眼睛","people":["井九","赵腊月"],"one_line":"井九夜登剑峰云顶，与修行剑意焠体的赵腊月初遇。","summary":"深夜井九独自登剑峰，对常人难熬的剑意视若无物，不用攀爬便如履平地，一路走进云层深处，一步数十丈直上峰顶附近。浓云散处，他与一双白眸如水银、黑瞳若点漆的眼睛几乎贴面对视——崖洞里坐着的是常年在峰顶修行剑意焠体的赵腊月。二人各自报名，都说听说过对方，赵腊月歪头评价：你不如传闻里好看。井九道声抱歉，继续向更高处去。赵腊月察觉天地间剑意骤变，猜不出峰间是否将有新名剑诞生。井九在剑峰西麓崖壁间散出剑识，深藏崖间的群剑纷纷生出感应又争相退缩，如遇险的兔子。他劝道：你们不要觉得配不上我——当然，你们确实配不上我，不过我不在意；我不会像以前那般只在山间呆着，这次我准备出去看看。剑意骤起，争先恐后。"},{"n":28,"orig":28,"title":"峰顶有事","people":["井九","赵腊月","左师叔"],"one_line":"赵腊月暗藏承意境界，被碧湖峰左师叔窥破欲杀之。","summary":"井九在满山剑意里找到目标，通体黝黑、光泽微暗的莫师叔之剑自石壁缓缓生出，剑意凝纯度并不出色，井九摸着宽大的剑身满意点头。取剑前他发现一只重伤的铁鹰——剑峰唯一能存活的异禽——在崖间挣扎流血，正想旁观，却见赵腊月挥手放出青色剑光把雏鹰带回，细心包扎。井九由此看出她竟已隐秘进入承意境界，连青山宗都无人知晓。一个灰衣中年人现身百丈外，原来赵腊月早已发现他。左师叔是碧湖峰无彰境强者，惊叹她小小年纪破入承意、难怪两忘峰想她想得发疯，随即坦言今夜是来杀她的：因为她不该查那些事——峰主为何发疯、他为何要冒险杀她，那些不是她有资格查的事；他若不是在卷帘人里有旧，也想不到查案的是她。赵腊月问：杀我，你有没有想过后果？左师叔叹道：有的事后果比杀死你严重一万倍，但我们还不是做了。"},{"n":29,"orig":29,"title":"隔着漫天血花相对","people":["井九","赵腊月","左师叔"],"one_line":"赵腊月重创不退，井九现身助斩左师叔。","summary":"赵腊月先召剑防守，青色小剑织成光幕，左师叔赞她已近承意圆满，随即八方剑诀出手：隐雷之剑轻易撕碎光幕，青剑落地如废铁，灰色飞剑连刺她七个血洞。他不急着杀，要逼问赵腊月查那些事受谁指使、是清容峰还是天光峰。赵腊月说「你就不该离我这么近」，腕间银镯化作剑索捆住他——飞剑竟斩不断这根剑索，左师叔惊怒，吞剑丸放剑罡挡住剑索。赵腊月飞剑已废，竟用外门入门拳法贴身暴打，小拳又准又硬，打得无彰强者喷血，再以剑索绕颈、双腿蹬背想斩下他的头，仍杀不死。境界差距终究难弥补，她血越流越急，自知握不住剑索之时便是死期。此时云散星光落下，左师叔眼前凭空出现一个白衣少年——无声无息，仿佛一直站在那里。井九抬手抚上他的颈间，摩擦声与惨叫戛然而止，头颅落地。隔着漫天血花，井九与赵腊月对视。"},{"n":30,"orig":30,"title":"人是我杀的","people":["井九","柳十岁","马华"],"one_line":"柳十岁追问，井九承认杀了碧湖峰师叔。","summary":"碧湖峰一位无彰境师叔被杀，尸身被发现于溪边、头颅被切，是九峰近年最恶性的事件。碧湖峰因峰主疗伤本就人心不稳，上德峰承受巨大压力全力查案却无线索，倾向是同门所为。洗剑溪畔气氛凝重，柳十岁练剑频频走神险些伤己，连马华都觉出不对。当夜柳十岁来到井九洞府，眼睛发红地问：公子，是不是你做的？那晚我来过，你不在；顾师兄他们说凶手断颈光滑，该是游野境高手或用了绝世名剑——可你说过，你最擅长的是切断。井九本可轻易编个理由让他安心，却直接承认：是的，那个人是我杀的。他让柳十岁可以去禀报师长，甚至早就应该如此。柳十岁说自己知道公子的秘密，是因为公子从没想过瞒他、还想帮他。临走他停在洞口，颤声问那位师叔是不是坏人。井九隔了许久才答：站在我的立场上，他当然是坏人。柳十岁终究没有告发。次日清晨，井九去看赵腊月。"},{"n":31,"orig":31,"title":"一朵奇葩入云来","people":["井九","赵腊月","梅里","林无知"],"one_line":"井九白日登剑峰直接入云，给赵腊月送果送药。","summary":"消息传开：井九要去取剑了。半年毫无动静的他终于登剑峰，洗剑阁弟子涌出围观，梅里师叔提前下课赶到，林无知也来了。众人最初奚落嘲讽，但看他行走峰间稳如平地、轻松越过六百丈的鹰嘴岩，惊叹逐渐取代倒吸冷气——他第一次登峰便直接走进了云层。云层里井九来到赵腊月的崖洞，放下猿猴摘的一大筐补养血气的山果和一颗丹药。赵腊月开口便问：为什么尸体会被发现？井九答：我很久没杀人，忘了后续处理，而且处理尸体很麻烦啊——所以随便丢在溪边。赵腊月觉得这少年真是朵奇葩，比自己还怪，追问你到底是谁；井九反问那你呢，你又是谁。二人各知彼此握有秘密，此事注定只能成为两人间的秘密。井九确认她伤势无碍便下山，临走想起自己似乎忘了什么事。溪畔虽遗憾他没带回剑，再无人敢嘲讽：他第一次登剑峰便入了云。"},{"n":32,"orig":32,"title":"一壶茶水穷意思","people":["井九","赵腊月","柳十岁","马华","顾寒"],"one_line":"赵腊月焠体功成下山，数访井九看沙盘称有意思。","summary":"上德峰的查案没有触及井九，柳十岁终究没有告发，反而愈发刻苦沉默，境界飞快提升。洗剑弟子陆续取剑成功，把剑抱在怀里、系上缎带爱若性命，直到梅里师叔发怒才稍收敛。数日后更大的消息轰动洗剑溪：赵腊月完成剑意焠体下山，没有拜见师长、没有回洞府，径直去了井九的洞府与他说话。全溪弟子隔着溪水遥遥围观，又惊又羡，薛咏歌咬定井九是夜里偷修、白天装懒的伪君子。崖坪上二人话都很少，赵腊月盯着他椅边的沙盘看了很久，说「有些意思」——她看出盘中细沙别有深意，但觉得太难，不值得把最珍惜的时间放上去，坐了半日便走。几天后她再度来访，静思半日，井九让她倒杯水，她说「不」。井九这才想起，她不是柳十岁。"},{"n":33,"orig":33,"title":"一道铁剑盖山河","people":["井九","赵腊月","雷破云","元骑鲸"],"one_line":"雷破云疯剑袭山被元骑鲸镇压；井九劝赵腊月莫藏拙。","summary":"赵腊月说不在乎井九的真实身份，更想知道：这么懒的人为何修出如此充沛的剑元。井九答来青山学剑正因这里从不管弟子怎么修道；又劝她刻意隐藏反而惹眼，没有能永远保守的秘密，就像太阳每天升起，总试图不让地面的人看到光辉是愚蠢的。赵腊月不确定地问：你把自己比作太阳？井九说是比方。她沉默说「我觉得我不如你」——她自出生便在众人注视下修行，选剑意焠体或许正为躲在云层深处不被看见。井九揉了揉她的头发被杀意瞪视，劝她去洗头，她答剑元是用来杀人的，怎能用在这些事情上。忽然一道疯狂剑光破云而至，驭剑者喊声凄厉：「就算没有一，那二呢！」恐怖剑意扫断崖壁大树，诸峰亲传只能结阵自保。一道方正铁剑自天穹落下化作十余丈穹盖，将疯剑镇压在数里外山地，轰鸣半个时辰。赵腊月问这就是破海境的威能吗；井九说元骑鲸多年未亲自出手，可能早已破海圆满、进入通天境。"},{"n":34,"orig":34,"title":"风雪里的一口老井","people":["元骑鲸","迟宴","井九","赵腊月"],"one_line":"疯剑之谜难解，元骑鲸布局夺碧湖峰；初雪告别。","summary":"消息传开：那道疯剑正是碧湖峰主剑潮来，疯者是被传遭暗杀重伤的雷破云。那句话无头无尾无人能解，与前些天碧湖峰师叔被杀相联，越发诡异；井九知道含义，望着夜空如一口老井，眉间生出一抹厌倦。上德峰洞府里，元骑鲸忧心：能从戒备森严的剑狱放出雷破云的绝非普通人，这是借刀杀人还是对自己的又一次试探？他令深查但莫把事情弄大——承剑大比将临；又令迟宴设法把碧湖峰夺过来。上德峰报名承剑的弟子一年比一年少，迟宴提议关注井九，元骑鲸冷哼：那个懒鬼？两忘峰那些小家伙怎会放过他。初冬掌门应清容峰之请开青山大阵放进风雪，井九推演却生出一种「遗忘」的感觉。初雪那天赵腊月第七次来访，说自己生于腊月的一场大雪；井九问她承剑大会会选哪座峰，她沉默，只说要去剑峰做最后准备，前来告别。行至洗剑溪尽头，她被顾寒拦住了去路。"},{"n":35,"orig":35,"title":"溪石上的两道身影","people":["赵腊月","顾寒","过南山","井九","林无知","顾清"],"one_line":"赵腊月斥顾寒，承剑大会将启，顾清身份揭晓。","summary":"赵腊月不答顾寒的质问，只留一句「你错了，青山之未来在于我，而不在于你们」便消失在风雪里。顾寒回两忘峰见首席师兄过南山：过南山支持他的磨砺之法——那孩子遇着连番羞辱连剑都不敢拔，将来如何降魔卫道；顾寒答那个家伙连剑都没有，谈何拔剑；过南山嘱他保证顾清与柳十岁不出问题。转年初春，承剑大会将临：水月庵、悬铃宗、果成寺、朝歌、镜宗乃至风刀教都派员观礼；最受瞩目的除赵腊月、柳十岁，还有从未露面的顾清——过南山的剑童、顾寒的亲弟弟，境界被认作压过赵腊月的同代最强。承剑前夜，碧湖峰峰主之位低调传承：一位隐居长老击败上德峰迟宴接任。清晨井九到洗剑阁报名，说「我习惯今天的事情今天做」，林无知递上名册又替墨师叔拉票，心里嘀咕：剑呢？你怎么还不去取剑？溪畔他无视玉山留的位置，径直坐到赵腊月身边的大青石上。"},{"n":36,"orig":36,"title":"原来他就是井九","people":["井九","过南山","林无知","赵腊月","梅里"],"one_line":"井九报名承剑震惊诸峰，清容峰主初识其人。","summary":"承剑大会开场前，崖间诸峰师长暗中排布名单：顾清必直接回两忘峰，柳十岁肯定被两忘峰召去但要先定由哪峰承剑，杞元良、司空宜民、奇飞英等各有归属与交易。过南山望着青石上一立一坐的两道身影，遗憾道「看来真的不行」——赵腊月不肯承诺入两忘峰，井九又没取剑无法参加。林无知带来消息：井九报名了。过南山说是好事，顾寒冷言这家伙又要弄什么事；过南山解释井九的懒其实是一种对万物无爱、居高临下的极致骄傲，若不能清醒便没资格来两忘峰，磨砺是助他成长。林无知嘲他不习惯这种自说自话，过南山反问他从没看懂自己教的学生，林无知道：我觉得你今天可能会失望，而且是两次。清容峰女弟子们第一次见到井九真人，惊叹闻名不如见面；梅里断定他没藏剑、今年承不了剑。帷幕后清容峰主清婉发问：她身边那个白衣少年是谁？听得回答，轻叹一句：原来他就是井九。"},{"n":37,"orig":37,"title":"开会了","people":["柳十岁","井九","陈琳","林英良"],"one_line":"承剑大会开场演剑，柳十岁驭剑破云技惊四座。","summary":"承剑大会开始，弟子依次登溪间演剑。入内门七年、五年前取剑的陈琳修至守一圆满才获资格，演完剑后崖间死寂无人愿收，他硬挺着不敢低头，直到云行峰决定收他，才惊喜应下随程长老学苍鸟剑法。杞元良、司空宜民、奇飞英等各被选中，镜宗使者学乖不再轻易鼓掌。悬铃宗一位十三四岁的银铃使者小姑娘看得直打呵欠，嫌一剑来一剑去太乏味，直到人群微乱：天生道种柳十岁出场。他飞剑悄无声息破开石壁成浑圆细洞，收剑、踏剑、驭剑直破云层，归来时脸不红气不喘，沉默施礼。崖间骤然喝彩：看似简单，实则沉稳至极毫无多余，正是青山剑道风范。观礼宾客感慨这位入门前从未接触修行的天生道种不知如何被青山寻到。小姑娘刚嫌不够热闹，便见一名神情沉稳的年轻弟子走到柳十岁对面：「柳师弟，请指教。」"},{"n":38,"orig":38,"title":"少年你意欲何为？","people":["柳十岁","井九","赵腊月","林英良"],"one_line":"柳十岁快剑胜林英良，掌门亲定其随白长老学剑。","summary":"甲课同窗林英良挑战柳十岁，两道剑光交错即分胜负：柳十岁的剑快上半分、停在对方眉心三寸，林英良的剑距他还有一尺。悬铃宗小姑娘惊呼这就完了，少妇讲解青山剑道只论飞剑速度威能、一击便杀，所以极少同门切磋，真要练杀伐只能去两忘峰。林英良虽败犹获适越峰邀请。轮到定柳十岁去向，崖间久无声音——不是没人要，是想要的人太多：清容峰早已示好，上德峰想以查代布局却发现他入门前练的玉门吐息是掌门亲传心法。云雾深处传来掌门清和的声音：柳十岁，你可愿随白长老学剑？柳十岁看顾寒一眼，见其点头便应下——先随破海上境的白如镜学剑打基础，一年后仍会入两忘峰。井九注意到他答应前看顾寒的那一眼。赵腊月与井九论起不愿被人盯着看，井九说还有一法：成为真正的太阳，光线刺眼，就没人敢直视我们了。说罢起身走入溪间：「承剑啊~」全场哗然。"},{"n":39,"orig":39,"title":"剑呢","people":["井九","顾清","过南山","马华"],"one_line":"井九唤回忘在猿猴处的莫剑，守一圆满全场震动。","summary":"井九两手空空便要承剑，满场愕然：半年前他入了剑峰，之后再没人见他登过，都以为他没取到剑。他自己这才想起忘了什么——那夜与赵腊月联手杀掉碧湖峰左师叔后，顺手取了莫师叔的剑；因剑上沾血嫌洗剑麻烦，扔给崖间猿猴去弄干净，然后就把这事忘了。适越峰长老冷声问「剑呢」，井九朝下游山林喊了一声「剑呢」，猿声四起，片刻后一只猿猴持剑掷来，剑在半空翻滚将落溪中，井九抬手，那把宽直黝黑的仙剑隔空静止、化作清光落进他掌心——数十丈外隔空唤剑，证明他已守一境圆满，承剑资格无疑。马华罕见地严肃，指责他如此对待长辈遗剑有失尊敬，井九只答：这是我的剑——过往种种，皆一剑斩之。过南山觉得他比想象中更骄傲，就该承受更大的挫败，命顾清上场。一名如仙人般的少年自对岸走入溪间，知情者骚动：两忘峰秘藏的天才顾清来了。"},{"n":40,"orig":40,"title":"愤怒的顾清","people":["顾清","井九","赵腊月","过南山"],"one_line":"顾清露承意境挑战，井九抡剑砸落其飞剑。","summary":"顾清是顾寒亲弟、过南山剑童，天赋不输天生道种，同代弟子中被认为可能比赵腊月更强。他入溪间却站在数十丈外——远超守一境攻击范围，意味着他已在洗剑阶段进入承意境界，全场震惊两忘峰竟藏着这样的天才。众人以为井九必输，连认输都算体面，井九却抱拳应战。赵腊月回想剑峰之夜：境界差距靠天赋手段无法弥补，那夜若无井九她已死在左师叔剑下，但她对这白衣少年无比信任。顾清出剑，隐有古意的飞剑瞬间掠过数十丈直指井九面门，快到普通弟子无法反应。剑却没有停在井九眼前——一声清脆，井九像猎户抡棒打野鸡般，一剑把那道飞剑砸落溪水。死一般寂静里，顾清脸色由热转白，眼底野火燃烧，怒喝一声再出剑：飞剑滚烫燃烧如火龙，竟是适越峰六龙剑诀——两忘峰私传九峰剑法，为胜不惜暴露。看着火龙扑向井九，井九的神情终于认真了些。"},{"n":41,"orig":41,"title":"清溪一声笑","people":["井九","顾清","顾寒","赵腊月","柳十岁","林无知"],"one_line":"井九砸落顾清飞剑完胜，打背三记为柳十岁出气","summary":"顾清召回飞剑再战，接连两次被井九用剑身砸落，最后一次倾尽剑元的疯狂进攻也被击飞出数百丈外。井九走到顾清身前，提剑在他后背打了三下，面对崖间顾寒的怒斥，又故意转身补上一记并道承让，点明这就是打给两忘峰看的。顾清不解自己承意圆满为何惨败，井九解释剑道只需极于速度与力量，又点他有把好剑，剑就是剑。观礼各派宾客被这场越境之胜震撼，九峰师长看出井九目力惊人、剑元丰沛，天生对剑敏感，是天生该用剑的人。云雾里的林无知明白井九是在替柳十岁回报当年两忘峰的责打，柳十岁绷着的小脸忍不住笑出声。"},{"n":42,"orig":42,"title":"抢人","people":["井九","梅里","墨长老","赵腊月","广元真人"],"one_line":"九峰争抢井九承剑，各执一词，井九说要再想想","summary":"师长们从剑斗中品出井九剑道天赋惊人：肉眼捕捉飞剑、剑元丰沛、天生知道剑何处最薄弱，而他选中那把宽厚结实的旧剑，正为发挥自身长处。天光峰墨长老率先开口收他，碧湖峰、昔来峰、云行峰争相招揽，梅里声明井九只归清容峰，适越峰主广元真人更以两年前便相中他为由加入争夺。主持长老压价私下许诺丹药灵果。井九权衡：雷破云已死，碧湖峰不必去；清容峰打死不去；他嫌昔来峰要与人打交道、云行峰修行无必要、适越峰猴子聒噪，本属意能同柳十岁同枝的天光峰，却在看到赵腊月后生出新的想法，宣布再想想，只允诺大会结束前决定。随后全场目光转向赵腊月。"},{"n":43,"orig":43,"title":"吾愿青山第九峰","people":["赵腊月","元骑鲸","清容峰主","井九"],"one_line":"赵腊月拒掌门与元骑鲸，宣布承剑神末峰","summary":"赵腊月收剑免于演剑，诸峰按排名逆序游说：碧湖、昔来自知无望只例行劝说，清容峰主志在必得，云行峰力陈剑峰苦修之缘。谁料多年不收徒的上德峰主元骑鲸亲自出面要收她，掌门更紧随开口邀她入天光峰，若三道种同归一峰，满场哗然。元骑鲸让她自己选，清容峰主也说怎么选都行。赵腊月等的就是这一刻，她宣布选择神末峰。清容峰主指出数百年来神末峰无传承、景阳从不收徒，且门规载明三次承剑无人承剑便算传承断绝、重开新脉。赵腊月说不想看到一座新的什么峰，要为神末再续传承，并道破自己本是景阳师叔祖选中的承剑弟子。井九坐在青石上，心想原来是这样。"},{"n":44,"orig":44,"title":"我也是这么想的","people":["赵腊月","井九","元骑鲸","过南山","清容峰主"],"one_line":"井九宣布同选神末峰，二人峰前准备登顶","summary":"清容峰主质问景阳已飞升，赵腊月跟谁学剑、承什么剑。赵腊月引青山旧例：只要登上神末峰拿到弗思剑便算承剑成功。元骑鲸警告峰阵自禁、登峰九死一生，她说既承师叔祖之剑便不怕死；元骑鲸冷言若失败未死，三年内不得再承剑只能溪畔自修。过南山提议让她入两忘峰避开惩罚，掌门默许，连朝歌城两位王公都反常地出声赞许。随后众人想起井九还没选，井九宣布想好了，也选神末峰，全场再度死寂哗然。暮色中二人来到峰前，过南山与顾寒叮嘱小心，赵腊月谢绝两忘峰留的后路。井九语重心长说她真有可能会死，自称只是好奇上面有什么，有人开路能省力气。墨池紧张嘱咐，柳十岁担心无言。"},{"n":45,"orig":45,"title":"割裂的青峰","people":["赵腊月","井九","顾寒","林无知"],"one_line":"赵腊月闭眼凭剑识破阵，井九照抄步法随行","summary":"神末峰前死寂诡异，赵腊月看出峰内剑阵不为杀人、只为切断：它斩断峰与天地的联系，剑意把峰内空间切成无数块，如内部生裂纹的宝石，游野境强者也无法前进，落叶飘入即被切成细丝。她迈过分界线，衣袖应声而裂，索性闭眼只凭剑识感知剑意，摸索着左转后退寻路前行。井九把她的动作分解后精确重组，只在关键处微调，避开她被剑意割到的位置，一路跟进，峰外众人咋舌，顾寒骂无耻，林无知叹投机取巧也是本事。二人沿破旧山道缓慢前行，赵腊月衣衫多处被割开，最险时剑意擦颊割落数茎黑发，耳垂也见了血。井九几次说我累了让她休息，实则都是她力竭之时。他由此想明白：她在剑峰苦修剑意焠体，原来一直为今日登峰做准备。"},{"n":46,"orig":46,"title":"我怕来不及","people":["赵腊月","井九","元骑鲸","墨长老"],"one_line":"赵腊月重伤言怕来不及，力竭睡去井九忧禁制","summary":"越往深处剑阵越强，赵腊月伤口渐多，欲用剑索探路，井九提醒不到最后不用，因为有人在看着——通天境大物能看穿一切，他防的是掌门与元骑鲸。夜深她承认高估了自己，靠松树坐下歇息。峰外众人焦急，墨长老恳求掌门救人，上德峰顶元骑鲸冷笑说真是不知死活。赵腊月浑身是血说出缘由：她真是景阳师叔祖选中的承剑弟子，当年景阳路过朝歌城时点中腹中的她，她的人生因此被祝福，无人相信这个说法，但她坚持至今。井九不假思索说我相信你，又问何必这么急。她坦言因为怕来不及，却没说破真正的秘密：她只是想去峰顶看看那把剑在不在、那个人在不在。随后她力竭睡去。井九望向死寂的峰顶生出悔意，禁制设得太强，连他也觉得麻烦。"},{"n":47,"orig":47,"title":"看就看吧","people":["井九","赵腊月"],"one_line":"井九提赵腊月硬闯剑阵登顶，驱怨灵入景阳洞府","summary":"井九顾虑有人窥视本欲作罢，但不愿让熟睡的赵腊月失望，遂道一声看就看吧。赵腊月腕上手镯所化的剑索竟听他号令，他解开剑索缠住她，提着这睡熟的少女向峰顶走去，手法巧妙如吊床。他不避不让直接硬闯，剑声如雷霆轰鸣，白衣被割成数十条布条，脸也被打得发麻。临近峰顶，数十团冥火聚成狰狞怨灵扑来，那是当年冥师率部借大阵漏洞潜入九峰想夺某物、被景阳一剑尽灭后残留的魂火，此事牵涉青山大秘密被严密遮掩至今。井九一声散开，怨灵自散成青烟湮灭。他走进景阳洞府，转动夜明珠唤风除尘，感慨没想到这么早便能重见此地，随后按开暗壁，在景阳留下的素色衣衫间挑了件白衣换上。"},{"n":48,"orig":48,"title":"仙人抚我顶，结发授长生","people":["井九","赵腊月"],"one_line":"赵腊月寻剑不得心碎吐血，井九渡元护其剑心","summary":"赵腊月惊醒时已在景阳洞府，井九只肯编白胡子仙人相救的故事，她追问你到底是谁，他答我也在寻找答案。二人遍寻洞府不见弗思剑，赵腊月判断剑不在便意味着师叔祖飞升失败、人已不在，四年的坚持霎时崩塌，青剑当场断成两截，她喷血昏死过去。井九告诉她他没死，只是差一点死了，并举掌渡入源源剑元，护住她受损的剑心慢慢修补。他替她擦净脸上血污，又用阴木梳把短发梳起扎了个冲天鬏，一面自语原来你家姓赵、那天明明只是场小雪，透露他知晓她的幼年旧事。赵腊月醒来对镜发现辫子大怒，斥他又不是小孩子，井九一本正经说头发这么短只能算鬏，而且我觉得挺可爱。"},{"n":49,"orig":49,"title":"原来你一直在这里","people":["赵腊月","井九","过南山","清容峰主"],"one_line":"剑镯藏弗思剑现世，赵腊月承剑，神末峰解禁","summary":"井九再编新故事，说老仙人告知那把剑一直在她手上。赵腊月想起出生便戴着的剑镯，将剑索递到井九手中，他握索缓缓下捋，银屑剥落如蛇蜕皮，露出里头鲜红如血的弗思剑，原来景阳早把弗思剑化作剑镯戴在她腕上。赵腊月以剑是井九发现为由推辞，井九指出景阳的意愿很清楚：从她出生起便属意她继承神末峰，否则不会把剑放在她身边。她郑重将弗思剑插入洞府剑台。峰下苦守一夜的众人只见神末峰卷起大风，落叶漫天，崖壁被晨光点燃般自体发光，显出满山剑阵隔断，随后银瓶乍破般的清脆剑声响彻天地，禁制解除，神末峰重现人间，第九峰再续传承。清容峰主伤感道，没想到这么快便又能看到这座山。"},{"n":50,"orig":50,"title":"散会了","people":["井九","赵腊月","柳十岁","顾寒","林无知"],"one_line":"大会消息震动四方，迎客台送客，井九讨竹修椅","summary":"承剑大会的消息震动南方诸郡乃至朝歌城、风刀郡，连冥部与冰雪王国都收到消息：景阳洞府所在的神末峰重开，赵腊月声名大噪，井九之名也开始流传。青山弟子嫉妒二人独得师叔祖遗产，真正被嫉妒的是毫发无伤的井九；顾寒提议取消其资格，林无知点破他一直看错了井九。次日迎客台送别宾客，悬铃宗银铃使者小姑娘与三人结交，答应寄铃铛给井九却禁止他登门，理由是他长得太好看、怕姆妈想嫁给他。朝歌城王公问赵腊月带不带信，她连信都不写。柳十岁将回乡探亲，问井九要带什么，井九让他砍几根山后的竹子带过来，最好能移栽——椅腿又坏了，椅背也破了个洞。"},{"n":51,"orig":51,"title":"叫声师叔来听","people":["井九","过南山","赵腊月","顾寒"],"one_line":"两忘峰招揽被拒，井九点破师叔辈分压服众人","summary":"送客之际过南山再劝赵腊月入两忘峰，因神末峰没有九死剑诀真谱，顾寒甚至放下身段道歉求和。赵腊月拒绝，说只想学景阳师叔祖的剑法。过南山转而招揽井九，称两忘峰修的便是杀敌之道、不拘手段，正适合他。井九直言修的道不同，两忘峰的道是错的：他们靠外在压力磨砺剑心，由外而内，而修道应是自身之事、由内而外的自觉，还拍了过南山的肩膀。顾寒怒斥无耻，质问他今后学什么剑。井九点破关键：赵腊月承景阳之剑算再世弟子，与掌门、诸峰主同辈，须称峰主或师叔，顾寒也该喊他一声师叔。年轻弟子们慌乱散去，过南山苦笑认了，真叫了一声师叔，顾寒铁青离去。"},{"n":52,"orig":52,"title":"井九的来历","people":["迟宴","程长老","梅里","白如镜","昔来峰主","井九"],"one_line":"诸峰议井九来历，迟宴疑其出身果成寺","summary":"诸峰要员齐聚昔来峰大殿议事，峰主们因两名三代弟子骤成同辈的尴尬纷纷回避。上德峰迟宴提出要查顾清用适越峰六龙剑诀之事，剑锋直指掌门首徒所在的天光峰，适越峰长老想和稀泥。碧湖峰程长老追问左易被杀与雷破云暴毙两案，与迟宴针锋相对。随后众人讨论井九的来历：他出身朝歌城来历清楚，却从未有人见过他修行，三年连破四境，还在那个小山村停了一年、恰逢天生道种柳十岁，白如镜否认与天光峰有关。迟宴断言神末峰解禁多半是井九的功劳，赵腊月只是开道，怀疑井九出身果成寺。梅里点破迟宴能知峰间情形，众人惊觉元骑鲸可能真已入通天境，青山局面或将改变。"},{"n":53,"orig":53,"title":"每个人的心里都有一个鬼","people":["迟宴","元骑鲸","赵腊月","井九","梅里"],"one_line":"迟宴列果成寺证据，元骑鲸追问弗思剑下落","summary":"迟宴细数证据：井九家与皇族有隐秘关联，而皇族与禅宗交好；果成寺律堂首席破例赴会、昨夜守在神末峰下；当年禅子曾在九峰停留百日；井九或身怀金刚不坏之身；他还爱摸人脑袋，似禅宗灌顶。众长老决定查明便养着，最好养成第二个刀圣，刀圣当年正是果成寺僧人、历炼北地留在风雪里的旧事。上德峰顶，元骑鲸让迟宴从左易之死查起，顺带压一压两忘峰，并问出关键：为何直到最后没人提景阳飞升为何没带走弗思剑？他冷笑，每个人心里都有鬼，或者怕人看到自己的鬼，或者不敢看别人的鬼，但不看鬼就不存在吗？神末峰上，井九自认拍过南山肩膀只是下意识，赵腊月换上景阳留下的素色衣衫，用弗思剑裁去袖摆下摆，张臂问他好不好看。"},{"n":54,"orig":54,"title":"谁才是猴子搬来的救兵","people":["井九","赵腊月"],"one_line":"赵腊月自认景阳痴粉，井九内观剑果，助猴退敌","summary":"赵腊月坦言自己最崇拜的人是景阳师叔祖，从未见过他却是他狂热的追随者，如今来到他的山峰便像与他在一处修行，很开心；她确信弗思剑随她多年说明自己是师叔祖安排的后手，也把井九算在其中，井九否认但说不清不同在哪。井九心神自观内景：经脉如河流汇入浩瀚银色大海，道种结成参天大树，树中悬着一颗淡色果子，即青山所谓剑果，待剑元滋养至透明便成剑丸，那将是他入承意之日；他更期待无彰境，届时飞剑可与剑丸相合收归体内，他很想看看那会发生什么。神末峰开禁，原属此峰的猿猴最先搬回，却引来适越峰猴群抢地盘，井九提剑下山帮自家猴子打架，说得理所当然，赵腊月愣了半天才回过神，好生羞恼。"},{"n":55,"orig":55,"title":"放着我来","people":["井九","顾清","赵腊月","柳十岁"],"one_line":"井九默写九死剑谱，顾清顶罪被逐将投神末峰","summary":"井九帮猴子打赢了架，主动揽下给赵腊月做衣裳的针线活，又在洞府默写订成数册，其中一册是气势决绝、九死不悔的九死剑诀。赵腊月以为景阳把剑留给她、剑谱留给井九，心生嫉妒，同时冒出一个石破天惊的猜想，却终究没有开口问。另一边，上德峰借六龙剑诀施压，两忘峰让顾清认下偷学剑法，将其逐出两忘峰、回洗剑溪再等三年，他成了保全师兄们的牺牲品。顾清忍受洗剑弟子奚落，回想承剑大会上井九认真解答自己的困惑，问柳十岁井九究竟是什么人；柳十岁以一入山门凡间皆斩推托主仆旧情，又劝正想转投他派的顾清去神末峰做执事试试，说自己也快轮到为青山牺牲的时候了。"},{"n":56,"orig":56,"title":"不同道路的开端","people":["顾清","柳十岁","井九","赵腊月","段莲田"],"one_line":"顾清上神末峰获准修屋，柳十岁遭上德峰问话","summary":"顾清次日上神末峰请求做执事。赵腊月拒绝收执事，说你也不应该做端茶倒水的事，青山宗多一个执事没有意义，这番隐含看重的话令他心境平静。他正欲下峰，井九躺在竹椅上忽然说这座山很大、只那些猴子住太空了，顾清顿时明白：纵不能承剑，他也可以在这座峰里修房子住下。同日，柳十岁首次被上德峰问话：左易被杀那夜他离开崖洞去寻井九，却发觉井九不在。面对手段强硬的段莲田步步紧逼，暗示他或涉通风报信，柳十岁只说出去走走、没有方向，拒绝为莫须有的嫌疑编造说辞，段莲田撂话过些天再问。走出崖洞，负责照看洗剑弟子的马华欲拍他肩膀以示亲近，手停在半空，柳十岁径直走过。"},{"n":57,"orig":57,"title":"一声叹息","people":["赵腊月","井九","顾寒","柳十岁"],"one_line":"赵腊月道出叹息之疑，井九查出阴三眉心空洞","summary":"顾寒提醒柳十岁往后还会受委屈，宣讲两忘峰连年在外征战厮杀，才换来诸峰安稳修道，柳十岁说愿为青山做任何事。神末峰上，井九问出赵腊月坚持怀疑景阳没飞升成功的缘由：当年她奉孟师之命押着被杀的冥部弟子尸体到云集镇野林掩埋，恰在师叔祖飞升那一刻，脑海深处响起一声叹息，怅然留恋又无比满足。她后来越想越确定那声叹息来自神末峰，怀疑师叔祖飞升时也给自己留了什么信息。二人挖出那具多年不腐、萎缩如脱水树叶的尸体，井九用剑识遍查，发现死者眉心深处有个光滑的空洞，形状像人参果，像是有什么东西在里面住过很长时间。他把这个发现没有说出口。"},{"n":58,"orig":58,"title":"阴三是一个好名字","people":["赵腊月","井九","孟师","顾清"],"one_line":"阴三查无此人牵出雷魂木，井九焚尸劝查未果","summary":"赵腊月查明冥书上根本没有阴三这个人，她由此暗查当年对她疼爱有加的外门仙师孟师，如今孟师正得上德峰赐药冲击游野境；又经卷帘人查出三千里禁前碧湖峰少了两根雷魂木，此宝据说可助人移魂转魄多出一次命，雷破云的走火入魔与暴毙恐与此有关。井九劝她不要再查，直接以剑火烧了阴三的尸体，赵腊月怒而驭剑离去。他独自行走数百里回峰，途中喂了受伤的猿猴一颗珍贵的一心丹，路过顾清修房的断崖没有停留。此前他在云集镇酒楼曾对着空座位自语：用这个名字很自信，假死太粗糙，只是没想到我能回来，希望尽快再见。赵腊月立在峰顶重申一定会继续查下去，因为师叔祖一直都没有出现。"},{"n":59,"orig":59,"title":"知错不必改","people":["顾清","顾寒","井九","赵腊月"],"one_line":"顾清平静认下顶罪代价，井九劝赵腊月莫问尘世","summary":"井九以驭剑俯瞰大地、滔滔之水如静止为喻，劝赵腊月修道者该与人世保持距离，修道不为争胜也不求意义，只为飞得更高看得更远，实则是担心她查案会招来他护不住的凶险。次日顾清上峰顶烧水煮茶，赵腊月点破顾寒会生气，井九评价顾清天赋不及二人但心性更稳，对收留他只说反正来都来了。顾清在山腰修房子，越做越伤心：他本是顾家不起眼的庶子，因过南山发现其天赋才有今日，输给井九后被顾寒训斥，又被推出来认下偷学剑法，为什么牺牲的一定是自己？顾寒寻到山腰要带他受惩戒，顾清却平静回视，平静认下代价：自己承认偷学，被逐出两忘峰、三年不得承剑，这便是代价，眼神里再无惧意与歉意。"},{"n":60,"orig":60,"title":"白痴及鬼","people":["顾寒","顾清","井九","赵腊月"],"one_line":"顾寒讨人被拒怒裂树，井九悄然入承意欲赴碧湖峰","summary":"顾寒命顾清随他下山受惩戒，顾清拒绝：他已不是两忘峰弟子，并反问你们为断柳十岁与井九的来往，对他说一入山门俗世皆斩，对我却要提家法，青山便是吾家，哪来的家法。顾寒上峰顶质问井九是否挑拨，警告他莫与顾家、两忘峰为敌；赵腊月回绝交人，说顾清只是暂住。顾寒下山时撞见赵腊月俯身与井九低语，心神激荡，剑意离体裂树，被猿猴们围观如看白痴。盛夏雷暴之夜，诸峰弟子出大阵借雷洗剑、适应承意新境，无人知晓井九几天前也已悄然进入承意境界。他望着碧湖峰方向的雷暴想起雷魂木，判断雷破云因卷入此事承受巨大压力发疯，随后被灭口。井九决定去碧湖峰看看，无人可问，就去问鬼。"},{"n":61,"orig":61,"title":"夜探碧湖峰","people":["井九","白鬼"],"one_line":"井九夜探碧湖峰养魂秘殿，与镇守白鬼对峙谈判","summary":"暴雨夜，井九无声潜入戒备森严的碧湖峰，直上峰顶湖心岛——那里是青山以雷威养魂木的秘处，由四大镇守之一的白鬼居住，殿宇吞噬雷电，无弟子看守。井九压着心跳前行，仍被窗台上一只懒洋洋的白猫一眼看穿，当年无彰境的左易都发现不了他，这让他自认这场谈判注定落于下风。他问白猫雷破云把那根雷魂木给了谁，点明白鬼是四大镇守里最纤细敏感警惕的一个，定早已察觉此事，又提起四年前自己出事时它袖手旁观，威胁说若它这次仍不站到自己这边，就用它的骨头来磨剑。白猫尾毛炸开如秋苇，天上雷电骤急，天地气息混乱，杀机一触即发。"},{"n":62,"orig":62,"title":"刘阿大","people":["井九","白鬼","成由天"],"one_line":"白猫试探一爪难伤井九，摸猫安抚唤出旧名刘阿大","summary":"白猫隔空挥爪试探，撕扯天网引下一道粗巨闪电，与爪上寒光一并击中井九胸腹，把他震飞数百丈落入碧湖。井九却若无其事地从湖中走出，一人一猫对峙。他上前熟练地摸猫安抚，唤出白鬼的古怪名字刘阿大，点破它欺软怕硬、弄不清对方底细绝不敢擅动，又问它是否担心那个人还活着才保持中立——白猫其实谁都不敢得罪，那对变态可怕的师兄弟，一个无情一个多情。井九叹雷破云什么都不知道却因此丧命，可惜，随后离开。碧湖峰主成由天忧惧这场猛烈雷暴是天罚，掌门与元骑鲸也各自远望碧湖峰沉默不语。白猫趴上树顶，怀念井九温暖的抚摸，顿觉疲累。"},{"n":63,"orig":63,"title":"太平真人的故事","people":["井九","赵腊月","元骑鲸"],"one_line":"井九被白鬼一爪重伤久咳，讲述太平真人旧事","summary":"回到神末峰后井九咳血病倒，一名承意境弟子挨了白鬼正面一爪而不死，全靠强行镇压伤势，这一病直到秋初还咳嗽。赵腊月怀疑是查案引来杀身之祸，井九重申不要再查，说对手很强且残忍，当下要务是安静修行提升境界，赵腊月坚持要查下去。井九讲起太平真人：青山前代掌门、景阳的师兄兼授业之人，当今掌门与元骑鲸等皆出其门下，多年前颁下八百里禁令闭死关，修行界都认为他已死。井九望着上德峰出神——太平真人接任掌门前一直在那里修行，上德峰底的剑狱只有一口深井相通，他琢磨雷破云当年如何逃出剑狱、自己又是怎么逃出来的，越想越咳。所幸夏初新成的剑丸经此一劫破损后修复得更加圆融，或算破而后立。"},{"n":64,"orig":64,"title":"一串香蕉","people":["井九","顾清","赵腊月","柳十岁"],"one_line":"井九赠顾清承天剑谱，柳十岁随队除妖后受伤","summary":"从春末到秋初，顾清每隔十余日来峰顶煮茶，带来猿猴送的香蕉；柳十岁从村中带回的竹子被井九修了椅腿椅背。井九让租客顾清进洞府逛逛，故意让他看见桌上的剑谱，又把谱塞进他手里说这就不是偷了——顾清以为是景阳的九死剑诀，翻开首页却写着承天二字，不由手颤。入冬前浊河北的朝南城出了喜食童男童女的大妖，两忘峰弟子连夜出山除妖，柳十岁也在队伍里，只托顾清转告井九他离山一事莫外传。随后又有洗剑弟子托问三年后神末峰招不招人，赵腊月与井九一喊招一喊不招，赵腊月撂下我是峰主便回洞府。数日后大雪，顾清驭剑急上神末峰传信：柳十岁受伤了。"},{"n":65,"orig":65,"title":"千百年来皆如此","people":["井九","赵腊月","顾清","白鬼"],"one_line":"柳十岁除妖重伤昏迷，井九拒探视夜访白鬼点破旧局","summary":"朝南城除妖顺利，柳十岁却重伤昏迷，浑身滚烫、雪落即化成雾，顾清怀疑不像受伤更像中毒。井九不认同：道种与炼体之下普通毒物无用，反而觉得这或者就是那个故事的开端。上德峰在原因未明前便重罚带队师兄简如云，赵腊月觉出不对。井九拒绝去天光峰探望，说这是柳十岁自己的选择，随后称打算出山走走。赵腊月昨夜已破入无彰境——剑意焠体加上九死剑诀大大缩短了进程，她试探自己是否比井九更适合这套剑法，井九答是，因为自己不喜欢九死剑诀，但有人很喜欢。深夜井九再访碧湖峰，摸着白猫说两忘峰的孩子自以为谋划缜密必能成功，却不知几百年前发生过几乎一模一样的事情。"},{"n":66,"orig":66,"title":"我待为谁发新诗","people":["井九","赵腊月","白如镜","时明轩","顾清","梅里"],"one_line":"井九交待后事携赵腊月出山，青山议事吵作一团","summary":"井九对白猫说，也许那些人最后会成功，但当年师兄不也成功了，何曾想到后来变成那样，又道十岁比师兄和他都强，应该能熬过那一关。他决定出山走走，眼不见为净；白猫婉拒同行，自陈既怕井九更怕井九那位多情的对头。井九告知顾清二人将离开、承剑前回来，顾清留下专心修剑看家，井九嘱咐万一有事就和猴子说。清晨青山议事，白如镜为昏迷的柳十岁暴怒，要求派二代强者查清浊水真相；云行峰时明轩阴阳怪气，暗示柳十岁是偷吃了什么东西，又质问真相未明为何简如云已被关进幽室，两峰争吵不休。随后赵腊月与井九离山的消息传来——峰主只需登记剑牌便可随意出山，无人能拦，梅里忧心他们一走不知多久。"},{"n":67,"orig":67,"title":"青山蒙羞的第一天","people":["井九","赵腊月"],"one_line":"井九赵腊月出山遇窘无路引入城，客栈惊煞小二","summary":"井九与赵腊月离开神末峰，徒步八百里到云集镇吃了顿火锅，再行数百里到商州城外才发现大麻烦：没有官府路引进不了城——两个一心修道、毫无生活常识的人这才明白人世间的规矩，赵腊月木然叹道青山蒙羞。入夜二人驭剑翻过偏僻城墙进城，赵腊月买来两顶笠帽遮脸，因为井九的脸太过惊艳。他们以金叶子住进商州最好的谪仙居天字甲号房，井九以剑火搓净面尘，赵腊月以道法凝水洗脸，送热水的小二被两张脸惊得失魂落魄，回灶房向同伴吹嘘自己见到了此生最美的一张脸，又捧着双手默默祈祷仙师把自己带走。"},{"n":68,"orig":68,"title":"听取蛙声一片","people":["井九","赵腊月"],"one_line":"井九道出徒步之乐与修行之困，二人夜窥青楼","summary":"井九向赵腊月解释坚持步行的原因：驭剑太冷风太大，而行在路上能看到槐树古柳、山泉小溪各不相同的风景，还能听取蛙声一片，不像驭剑时只有风声；他早年也曾数度离开青山远游。赵腊月以师姐、峰主双重身份压他，不许再多问。井九的修行只能靠等：他剑丸初成，需以剑元慢慢焠炼至合源方能入无彰，而他的身体特殊，在这个关键节点必须谨慎，灵药已再无用处，他竟破天荒生出无聊这种情绪。夜里二人戴上笠帽登上摘星楼，远眺数百丈外灯火通明的青楼，以二人的眼力耳力把楼中画面看得一清二楚，赵腊月睁大眼睛，错愕道原来是这样啊。"},{"n":69,"orig":69,"title":"杀之一剑","people":["赵腊月","井九"],"one_line":"赵腊月初次挥剑杀人救少女，二人晓行至浊水南岸","summary":"二人正欲离开，听到巷中传来棍棒声与女子哭喊。井九说修道者一般不干涉世间之事、恶人杀之不净，见着了看心情；赵腊月却说我想做什么就做什么，如果这都做不到还修什么道，捏诀放出弗思剑，干脆利落地斩了巷中四名凌虐逃妓的恶徒。这是她第一次亲手杀人，右手微微颤抖，看到井九温暖的笑容才平静下来，井九欣慰地揉她的头，被她骂有病。巷中倒着四具无头尸体，那个瘦弱少女日后命运如何无人知晓。井九感慨太上无情是修道者回到人间必学的一课，果成寺蹈红尘是另一条路，他尊敬却不会接受。二人默行一夜，清晨走到南方最大的河流浊水南岸，望见对岸人族皇朝的南方重镇朝南城。"},{"n":70,"orig":70,"title":"剑入朝南城","people":["井九","赵腊月"],"one_line":"二人入朝南城躲进青山暗产宝树居，玄草丹换得敬重","summary":"二人以灰布蒙面过通天桥——那是青山开派祖师命昔来峰弟子移土石修成、以剑阵镇压妖兽的巨桥。井九疑惑鬼目鲮当年早被上一代两忘峰弟子杀干净，为何时隔多年复活，推想浊水大妖自西海倒游而来，源头或是传闻直通冥界的大漩涡海天一线。入城时赵腊月直接驭剑闯关，惊动官府与修道者，二人躲进朝南城最大的拍卖行宝树居，井九才知道这是青山的外围产业。管事验资时嫌金叶子眼色冷淡，井九掏出一颗中州宣化山所产的玄草丹，管事立刻恭敬起来，领二人上七楼玄字乙号房。赵腊月说明来意：宝树居主事是雷破云的侄孙，又是青山与外界交流的渠道之一，她想从蛛丝马迹里查出师叔祖飞升的真相。"},{"n":71,"orig":71,"title":"拍卖会上的意外","people":["井九","赵腊月"],"one_line":"果成寺求药遭三都派哄抢，井九一丹拍下冰片","summary":"拍卖会上，果成寺一老一少两位医僧现身求助：受青山之邀除妖后，被鬼目鲮惊慑魂魄的民众尚需定神冰片医治，而举世皆知果成寺很穷。各宗纷纷让出竞价，宝树居也欲赠药博个好名声。不料昆仑派附庸三都派横插一手，称其小主在应城中了毒需此药救命，至于朝南城的凡人只能算运气不好，楼内众人竟默认了这种说法，竞价大战随之而起，价格节节攀升。眼看定神冰片将归三都派，井九让管事报出一颗玄草丹——价值百倍于冰片，满楼哗然，三都派错愕罢手。井九与赵腊月收下宝树居奉还的玄草丹起身离开，没有与果成寺僧人见面。管事寻思这两人来历不明，得赶紧通知东家。"},{"n":72,"orig":72,"title":"你们想死吗？","people":["赵腊月","井九"],"one_line":"三都派拦路索药，赵腊月认真发问你们想死吗","summary":"三都派中年人敢在朝南城叫板，是因为他们知道两年前碧湖峰变天、宝树居失去最大靠山；管事也顾不得规矩，点破三都派是昆仑附庸。原来这场赠药本就是宝树居安排的戏码，想借果成寺求药一事赚些名声，给过些天要来的青山仙师一个交待，却被三都派搅局险些演砸。定神冰片最终落入玄字乙号房，管事小心奉还玄草丹，又低声提醒东家想见二位一面，井九与赵腊月没有理会，径直离开宝树居。二人刚走不远便被三都派拦了下来，赵腊月只在书上见过这种情节，觉得毫无新意很是无趣，看着对方认真发问：你们想死吗？"},{"n":73,"orig":73,"title":"那就都死吧","people":["赵腊月","井九"],"one_line":"赵腊月剑斩三都派满员焚尸，果成寺僧暗认同道","summary":"三都派探得二人境界不高，认定对方是不敢露脸的鼠辈，起了杀心，下令杀人并保住药。赵腊月以弗思剑迎战，不辨真影直接把诡异莫测的三剑诀连人带剑尽数斩碎，弟子们飞剑被毁、喷血倒地。中年人惊觉这抹红色飞剑的威压连掌门飞剑都无法比拟，召剑欲逃，被凌空一剑斩首，余下弟子也被尽数割喉。赵腊月以剑火焚尸，又蹲下捡走尸身上的东西，井九欣赏她比自己当年利落；她说并非毁尸灭迹，只是怕吓着路过的小朋友。二人随后去鸿茂斋吃火锅。不远处破庙里，果成寺老僧凭那道送药的剑光认出是青山同道，年轻僧人心想难怪玄字乙号房拿得出玄草丹，又感激二人杀了纠缠自己的贼人，挂念并肩除妖过的柳十岁为何昏迷。这时庙门被推开，一名官服中年人走了进来。"},{"n":74,"orig":74,"title":"消逝的妖丹","people":["井九","施丰臣","老僧","年轻僧人"],"one_line":"老僧闭口禅挡施丰臣，井九水底验明妖丹已失","summary":"来者是清天司驻朝南城主管施丰臣，通报三都派众人被杀、遗体焚尽，追问年轻僧人可否知道那两个蒙面人的来历。老僧一句不可说，又称师侄正修闭口禅，顺手把装定神冰片的匣子藏了起来，施丰臣明知有异也不敢深究，长揖而去。夜里，井九潜入浊水，在河心断崖深处找到三层楼高的鬼目鲮尸体：颈部头部满是剑伤，双眼伤势像来自凌空道法，后半身被两道铁链捆在崖洞最深处——果然是被人养着的。他撕开大妖头顶坚逾钢铁的皮膜，丹室空空，妖丹果然没有了。柳十岁浑身滚烫、雪落即化、昏迷不醒的种种异象，就此都有了答案。"},{"n":75,"orig":75,"title":"也许从一开始就是错的","people":["井九","柳十岁","赵腊月","顾清","顾寒"],"one_line":"井九断言飞升败于阵法，柳十岁蒙冤入狱又获释","summary":"井九告诉赵腊月此事与雷魂木无关：飞升失败原因在于阵法出了问题，那座阵名为烟消云散、不留任何痕迹，而阵在神末峰顶、雷破云动不了手脚，所以可能是景阳当年学的阵法本就是错的。青山那边，柳十岁被上德峰怀疑偷吞妖丹，虽经严厉审讯、迟宴以剑心听脉都找不到证据，元骑鲸仍下令把他关入剑狱、禁止探望，连白如镜与两忘峰同门都渐渐信了他有罪，柳十岁在囚室里沉默倔强，满身伤痕。顾清不信他会偷食妖丹，想起井九行前嘱咐有事找猴子，让猿猴指点后用左手写下短信托送。第二天柳十岁便被放出，上德峰毫无解释；他回到天光峰迎着满目冷眼，顾寒夜访说这是掌门发了话，柳十岁坐在油灯前，忽然很想念井九和山村池塘边听蝉的日子。"},{"n":76,"orig":76,"title":"两年后的青山","people":["施丰臣","林英良","竹介","幺松杉"],"one_line":"两年间魔头连环杀人震动清天司，海州设伏在即","summary":"两年过去，冥界安静、雪国沉默，北郡军民迎来久违的太平年；海州西王孙将办新一届四海宴。升任清天司副巡查的施丰臣召集各派修道者围剿两个魔头：他们在商州杀四人、朝南城灭三都派，两年间共杀七十余人，看似随意行凶；去年黑龙寺恶名昭著的主持竹贵更被隔着一座青山斩死，对方境界只怕已达无彰中境。众人猜是不老林、无恩门或西海剑修，散修竹介——竹贵的俗家弟弟——语出惊人质疑青山宗，随幺松杉出山历练的适越峰小弟子林英良盯着他回敬：你想死吗？众人凛然于青山剑威。施丰臣断定二人将按路线在数日后出现在海州，欲借四海宴之人手将他们围杀。"},{"n":77,"orig":77,"title":"万里外的海州","people":["井九","赵腊月","幺松杉"],"one_line":"井九以两年游历教赵腊月，携她抵海州欲见一人","summary":"清天司散会后，果成寺年轻僧人急得想让老僧提醒前方的青山师兄弟，老僧知道那两位道友无需任何人担心。海州城外，井九望着赵腊月的背影感慨：两年数万里路、斩妖除魔，行路坐停都是修行——当年在朝歌城他选中了她便再没管过，但她一直没有忘记他，这两年他就是在以自己的方式教她。赵腊月一剑斩了以人为食的海边妖怪，斥责西海废物无用；井九说这妖怪一年吃的人还不如西海捞元气珠溺死的渔夫多——修道者必然无情，她明白他的意思。二人入海州城照例吃火锅，赵腊月终于问出憋了两年的话：你真觉得阴三还活着？井九只说，我来这里是想看一个人。"},{"n":78,"orig":78,"title":"小荷才露尖尖角","people":["井九","赵腊月","小荷","幺松杉","林英良"],"one_line":"妖修小荷火锅店示警，井九径登青山小院亮明师叔身份","summary":"火锅店里琵琶声起，抱琴少女小荷上前示警：清天司正要对他们不利。二人一眼看穿她是妖修——应城以心狠手辣出名的女修，两年前三都派少主轻薄她被她种毒，幸得二人杀了那些贼人，她才特来报信，却不肯说明消息来源。赵腊月问杀不杀，井九说随你，吓得小荷抱琴而逃。海州以飞鲸喷水迎四海宴宾客，赵腊月问怎么打——两年间井九替她挑的全是杀得死的对手，而如今四海宴强者云集。井九问她可曾听过一招从天而降的剑法，随后干脆直接找上门去：青山宗与果成寺、大泽同住的小院里，幺松杉越看笠帽下的两人越觉眼熟，待对方在脸前上下比划了两下，他肃然行礼：拜见二位师叔，林英良险些叫出声。"},{"n":79,"orig":79,"title":"早有十岁在上头","people":["赵腊月","幺松杉","井九","林英良"],"one_line":"幺松杉细说柳十岁蒙冤境况，井九意在神秘西王孙","summary":"赵腊月直认那些人是他们杀的，幺松杉认真评了句杀的好。他讲起两年间的青山：柳十岁被指偷吞妖丹，审讯无果获释，但九峰同门连同师父白如镜都信了，白如镜从此不再指点他的修行，两忘峰也未收留他；一年前上德峰忽然重查左易之死，柳十岁又涉嫌疑，段师叔亲自审问，顾清为此回两忘峰与顾寒大吵一架。井九开口问顾清还好吗，答是整日待在神末峰上没人知道他在做什么。幺松杉又介绍西王孙：四年前现身海州的神秘强者，传为西海剑神的私生子、关门弟子或师弟，所办四海宴实为与朝歌梅会打擂，比的是琴棋书画，只有四位胜者能在云台见到他。赵腊月对视井九一眼，猜到他要见的就是此人。"},{"n":80,"orig":80,"title":"破庙里的不老林","people":["井九","赵腊月","小荷","幺松杉"],"one_line":"清天司夜围客栈，小荷引路破庙，黑衣人亮出不老林","summary":"幺松杉提出出面替二位师叔平息清天司围剿，赵腊月拒绝，说不到必要不表明身份。井九自陈怀疑西王孙就是那个人，赵腊月脱口而出：阴三？他沉默不置可否。当夜清天司锁定客栈，昆仑长老何之冲守在夜空防二人破空而逃，数百名神卫军推进包围，井九不逃也不表明身份。小荷从客栈地道现身，引二人出城，来到海边废弃的海神庙——她早警告过进来了就真的走不了了。庙中海神像后走出一个黑衣人，声音低沉沙哑：当你面对整个世界的敌意的时候，你需要来自另一个世界的帮助，或者，成为那个世界的一部分。赵腊月挑眉道出：不老林？"},{"n":81,"orig":81,"title":"古井无波亦无情","people":["井九","赵腊月","小荷","黑衣人"],"one_line":"赵腊月一剑杀死不老林执事，井九铁剑偷袭钉住小荷","summary":"不老林是朝天大陆最神秘可怕的刺客组织，黑衣执事劝赵腊月加入，许诺晶石珍药与名声地位，遭拒后威胁二人得罪宫中贵妃、重返山门无望。井九听出对方只是普通执事，催赵腊月动手；她人剑合一瞬息欺近，肩耳被落剑幡黑旗划伤也不在意，掌心生出艳红飞剑刺穿执事胸膛。破庙上空威压逼近，井九判断打不过，十年后或可。同属不老林的小荷正困惑谈判为何突变，被井九一记铁剑偷袭贯穿右肩钉在墙上；她自认境界不弱于井九，却连他出剑都没察觉，从那平静眼神里生出极度恐惧——那才是真正的太上无情。"},{"n":82,"orig":82,"title":"四海宴","people":["井九","小荷","赵腊月"],"one_line":"井九与小荷立约套镯，同赴四海宴欲见西王孙","summary":"井九索要解药并逼问小荷在不老林的地位；她自称中层却颇受重视，性情毒女、媚骨狐精、天真少女层层伪装皆被赵腊月以剑心通明看穿。井九要她立约：明年或更久后会见到一个人，无论那人想做什么都要助他，事成助她脱离不老林；小荷不敢信，井九将银色手镯无声套上她的手腕，从此稍动反悔之念便会被切成两截，又摘下她鬓边茉莉。赵腊月好奇手镯来历；井九承认两年带她一路斩妖杀人正是为了引出不老林，也顺带修行，追查其与师叔祖景阳飞升的关联。他真正想见的是四海宴主持者西王孙，唯有琴棋书画夺魁才能相见，便问学棋难不难。四海宴当日，孤山上以琴棋书画逐宝，二人入场即被清天司盯上。"},{"n":83,"orig":83,"title":"我能想到最简单的事","people":["井九","赵腊月","施丰臣"],"one_line":"井九靠恐怖算力连胜两局，无人看懂其取胜之道","summary":"清天司施丰臣派人盯住四海宴上的二人，让竹介在楼内监视，并通知西海剑派传书云台，断定二人必为夺宝而来、出孤山便落网。赵腊月昨夜给井九买了本棋谱小册，井九看过一遍规则便报名参赛，首局以生涩如初学者的行棋莫名其妙地赢了年轻弟子三目。第二局对手是谨慎的散修棋家，观察过井九的棋艺后自信必胜，结果同样不明不白落败，拂袖而去。井九行棋毫无定式、全无美感，却总能在细微处的战斗里一点点占得便宜，渐成优势直至翻盘，连从头观局的西海剑派执事也看不出缘由。他换上新茶，坐着等下一轮对手。"},{"n":84,"orig":84,"title":"中州派的天才少年","people":["井九","向晚书","赵腊月","莫惜"],"one_line":"向晚书夺书画双绝，赵腊月为井九叫板童颜","summary":"井九连赢数局且落子飞快，众人看出端倪：他的推演算力太强，中盘搏杀从细微处不断得利直至翻盘，这种下法闻所未闻。棋未收官，其余三项已出结果：水月庵庵主弟子莫惜琴技第一，中州派天才少年向晚书书画双绝。向晚书被棋楼议论引来，见井九棋形粗陋连连摇头，自谦棋艺普通，众人听说师兄童颜与他下棋只让三子愈发敬畏；输棋的海州棋家当众挑事，向晚书评井九算力惊人只是难看，还笑称自己这般下棋会被师兄打。赵腊月出声讥中州派客套虚伪，与向晚书争执，称对井九来说下棋是世间最简单的事，扬言他不行，让他师兄童颜来。"},{"n":85,"orig":85,"title":"原来不是你","people":["井九","西王孙","赵腊月","向晚书","竹介"],"one_line":"井九独见西王孙只为一探，竹介受清天司指使发难","summary":"赵腊月直指向晚书虚伪：觉得井九棋差不肯明说、想打不敢，就是虚伪，又重申让你师兄来，向晚书以为她不谙世事。胜者与宾客乘海舟登上云中悬空山云台，青山宗幺松杉与林英良认出二人，暗暗震惊。井九被单独引至大殿深处面见西王孙；这位威严如帝王的神秘强者误以为他是走投无路来投靠，劝他莫因一棵树放弃整片树林，井九默想原来你不是他，答称只是想来看看你，也不要宝贝。西王孙以为他尚未下定决心，挥手放人。井九回殿欲与赵腊月同去，散修竹介忽然出言挑衅——他是清天司安排的棋子，更是竹贵之弟、二人的杀兄仇人。"},{"n":86,"orig":86,"title":"一言不发便杀人","people":["赵腊月","竹介","幺松杉","施丰臣","何之冲","向晚书"],"one_line":"赵腊月一言不发隔百丈杀竹介，幺松杉出剑护师","summary":"竹介依清天司之计极尽轻薄羞辱赵腊月，欲激她先出手，好让西海剑派事后无话可说；赵腊月始终沉默，受辱的幺松杉剑眉微挑欲杀人。竹介话音戛然而止——赵腊月隔百余丈一剑无声洞穿其咽喉，当场毙命，飞剑隐回掌心。众修震惊忌惮：她能隔百余丈瞬杀，境界当已入无彰中境。施丰臣率清天司现身，宣布她是两年杀近百人的通缉要犯，与会修道者纷纷召出法宝；但果成寺医僧、大泽左雨使乃至幺松杉都没动。西王孙在暗处静观，本想看完便放走二人。昆仑长老何之冲以三都派血债发难，月轮斩向赵腊月，却被一道笔直的青色飞剑当空击回，何之冲受伤狼狈，惊怒喝问幺松杉疯了不成。"},{"n":87,"orig":87,"title":"原来她是赵腊月","people":["赵腊月","井九","幺松杉","西王孙","施丰臣"],"one_line":"赵腊月摘帽亮明身份，西王孙被迫现身相迎","summary":"幺松杉坦言竹介对我师叔无礼该死，敢对我师叔出手也是找死；众人惊疑间赵腊月摘下笠帽，正是天生道种、承剑神末峰的赵腊月，满殿哗然，众人纷纷起身。莫惜自愧不如；向晚书意外，朝歌赵家之女本该入中州派，师长争了十年未成。众人又猜笠帽人便是传闻中的绝世美男子井九。赵腊月是殿内辈分地位最高者，西王孙被迫亲自现身相迎，西海剑派游野境长老忙收回剑识。西王孙警惕青山是否因鬼目鲮查到西海，但自信不留证据，更盘算妖丹加功法的诱惑终会让那位青山天才同门中招。井九则自嘲早知报出身份便这么容易，何必下那几盘棋，还嫌神末峰一脉不擅阴谋。施丰臣上前质问：青山宗的大人物就可以随便杀人吗？"},{"n":88,"orig":88,"title":"烽火连三月","people":["赵腊月","幺松杉","林英良","施丰臣","井九","向晚书"],"one_line":"青山放言杀贼不需交待，赵腊月代井九邀战童颜","summary":"林英良当众还原朝南城竞药始末：三都派弟子仗势加价作梗、还想抢药杀人，果成寺老僧作证，昆仑长老气结。施丰臣追问商州四路人命等七十余条命案，幺松杉答剑遇不平则鸣，放言青山杀贼不需要向谁交待。向晚书与莫惜出声劝慎杀，气氛微妙。井九直呼水月庵第一人连三月其名，讲出她当年雪国南下、三月连杀四万匪兵得烽火连三月之名的往事，老僧证实，莫惜语塞，幺松杉反问难道我师叔杀的都是好人。正道大派底蕴令施丰臣自知再无法缉拿，只放话回朝歌要讨个交待。赵腊月见过了西王孙便要走，向晚书相约梅会；赵腊月重申让童颜来，众皆哗然，视作井九向童颜邀战，青山与中州派即将正面对上。"},{"n":89,"orig":89,"title":"承天不是剑","people":["井九","赵腊月","白鬼","青山掌门","施丰臣"],"one_line":"白鬼惊醒镇守元龟，掌门泄露承天剑实为剑鞘","summary":"二人握手驭剑离去，向晚书认出那便是真人留下的弗思剑，果成寺修闭口禅的年轻僧人随后高赞仙家风范。施丰臣却记起从清天司前总管处得知的秘密：多年前某位崇尚以杀止恶的大物最终堕入魔道，成为修行界最大的祸害，赵腊月与他极像；他决意回朝歌动用所有人脉争取面圣，要把赵腊月与那个祸害联系起来。青山天光峰上，镇守白鬼与掌门谈及井九还活着、曾找过赵腊月；掌门表明自己知情且支持，年轻一代的热血不能被冷却。白鬼挠醒驮碑的石龟，那竟也是青山镇守元龟。掌门自嘲身为掌门却没有剑，望向碑顶——所谓承天剑没有剑柄，中空如鞘，青山主剑早已遗失，这是九峰之主才知道的最大秘密。"},{"n":90,"orig":90,"title":"很认真也很短的一些感言","people":[],"one_line":"作者上架感言，恳请正版订阅","summary":"《大道朝天》上架，作者写感言：本想悄悄上架被批不尊重读者，他自认一直尊重读者——写书认真，坚持以对得起订阅的钱为及格标准；感谢放在心里，拉票随缘，对成绩不惶恐因为写得不错，期待是真有。投票打赏全凭情份，惟恳请正版订阅，这关乎网文行业的基础与更多作者的生计。不断更不作承诺，唯一承诺是这本书会很好看，最后真诚致谢读者。"},{"n":91,"orig":91,"title":"时隔三年又承剑","people":["井九","赵腊月","顾清","柳十岁","幺松杉","林英良"],"one_line":"赵腊月井九云游归山，承剑大会四日后召开","summary":"青山主剑遗失、承天剑实为剑鞘的秘密只有九峰之主知晓，外门弟子关心的仍是承剑大会。幺松杉、林英良带回赵腊月两年云游斩妖除魔、四海宴杀竹介并代井九约战童颜的消息，青山弟子振奋又不看好井九。赵腊月飞剑归山，猿猴相迎；井九重拾竹椅瓷盘，盘中沙砾已铺近半，可见此事越到后面越难，她由此坚信童颜也不可能是井九的对手。顾清赶来只说了句得赢，并告知柳十岁心态出了问题、不肯见他；井九只说自己确信那是柳十岁自己的选择。二人归山第四天承剑大会开始，因梅会在即观礼宾客大减，风刀教却又派来使者。二人坐在崖上，弟子们发现井九仍背铁剑，疑他尚未入无彰境。"},{"n":92,"orig":92,"title":"仿佛当年","people":["井九","顾清","薛咏歌","林无知","顾寒"],"one_line":"顾清登台一剑击落薛咏歌飞剑，旧景重现","summary":"无彰境界是青山剑修最重要的关口，可得多倍寿命、隐匿气息、飞剑藏于剑丸。井九仍背铁剑，被薛咏歌等讥为三年无进的早慧者，更多人则因当年他战胜顾清而不敢轻断。井九称自己也要收徒，并确认承意境也可收徒。承剑大会开始，弟子溪间演剑，师长择人；许多弟子热望神末峰那个偏僻角落，却始终无人开口。顾清登场，他三年前败于井九、因偷学剑法被逐出两忘峰后转投神末峰，与兄长顾寒彻底决裂，如今沉稳从容。薛咏歌得顾寒暗中示意出手，想证明顾清三年停滞；他唤出飞剑直袭面门，却被顾清一剑击落溪中——画面与三年前如出一辙，两忘峰弟子最为熟悉，顾寒脸色难看，林无知望向崖上那个角落摇头而笑。"},{"n":93,"orig":93,"title":"收徒","people":["井九","顾清","薛咏歌","玉山","元姓少年","迟宴"],"one_line":"井九收顾清，赵腊月收元姓少年，玉山入上德峰","summary":"薛咏歌羞怒之下违禁施展偷学的六龙剑诀，燃烧飞剑再袭，被顾清一记挥击飞百丈，与三年前完全相同；顾寒转身离场，师兄们无人追究薛咏歌偷学之罪。云行峰主与天光峰白如镜先后争相收顾清为徒，顾清却坚持承剑神末峰；众人以为他将拜赵腊月，井九却说「我来」，顾清平静应允，满场哗然。乐浪郡元姓少年一鸣惊人提前入承意境，多方争夺，赵腊月依井九之意收他为徒。玉山师妹因神末峰名额已满而落泪，她驭剑精准完美，梅里招她入清容峰，井九却暗中摇头让她选上德峰；迟宴果然开口收徒，玉山应允。井九望向山道沉吟：白如镜又收了弟子，柳十岁怕是真被天光峰放弃了。"},{"n":94,"orig":94,"title":"取名不是寻常事","people":["井九","元姓少年","玉山","顾清","赵腊月"],"one_line":"元擒虎拜入神末峰获授七梅剑诀，试剑将启","summary":"元姓少年劝玉山安心去上德峰，玉山想着井九不会让她吃亏；二人受井九指点多次，称谓从井师弟升到井师叔。峰顶井九解释不亲收元姓少年，是因自己没收过徒、听说收徒要经常狠狠打，而他不好下手。少年求师尊赐名，自报叫元擒虎，顾清惊觉与上德峰剑律元骑鲸的名讳相似；井九摇头不赐名——柳十岁的名字正是他所取，赵腊月已知其中故事。青山试剑将启，胜者可代表青山参加明年梅会，表现出色者还有机会入两忘峰；元擒虎渴望又因旧怨却步，顾清保证神末峰是最好的选择，两忘峰有的这里都有。井九随后飘出一本昔来峰不传的七梅剑诀给他，此诀隐克上德峰雪流剑法。试剑当日，赵腊月与井九赶赴天光峰，顾清心生不祥预感。"},{"n":95,"orig":95,"title":"青山试剑","people":["井九","赵腊月","元骑鲸","幺松杉"],"one_line":"七柄峰主剑齐聚剑林，井九心系山道后的柳十岁","summary":"青山试剑在天光峰剑林举行，数百石柱高逾百丈，弟子于柱顶殊死相搏，从不邀外宗观礼。元骑鲸亲自坐镇，九峰主剑七柄齐现，连罕见的弗思剑也在列，白发长老恍若隔世。九座石台分坐各峰师长，赵腊月以峰主之位坦然受礼，清容峰主暗赞其气度像极了小师叔当年。众长老对井九观感复杂：三年前战顾清证明他是剑道奇才，今年顾清的剑法更明显出自他；为免引中州派重视，长老们保持沉默，只盼他明年在梅会上胜过中州派同龄对手。试剑抽签对决，选出十人参加梅会；首轮幺松杉胜杞元良，剑光在云雾石柱间穿梭，师长随时救援。井九却始终望着远处那条通往天光峰弟子居所的山道——柳十岁就住在那里。"},{"n":96,"orig":96,"title":"且看山道来一鬼","people":["柳十岁","井九","简若山","赵腊月","迟宴"],"one_line":"自囚两年的柳十岁携剑音现身试剑大会","summary":"首轮试剑中天光峰与碧湖峰弟子表现最佳，清容峰七名女弟子竟全败。两忘峰简若山——简若云之弟——登台后不按抽签，指名挑战井九，要为兄长两年前受罚出气，敌意毕露；井九视若无睹，只望着那条山道，迟宴欲以门规否决这场以下犯上的挑战。此时山道上传来刺耳的剑音，一个瘦如野鬼的身影出现：自囚石室两年的柳十岁来了，双脚无镣，行走间鞋底却有金属摩擦声。行走自有剑音，这是剑意粹体初成的征兆，众人震动：赵腊月在剑峰苦修多年才有此境，被幽禁的柳十岁如何练成？井九只喃喃：那张小黑脸怎么白成了这样，多少天没晒太阳了。"},{"n":97,"orig":97,"title":"野火烧不尽，此恨悠悠","people":["柳十岁","简若山","简如云","白如镜","迟宴"],"one_line":"柳十岁剑罡重创简若山，指名挑战简如云","summary":"柳十岁要求参加试剑，师父白如镜以偷吃妖丹为家门之耻厉声呵斥；简若山趁机邀战并先出剑，柳十岁挥袖间剑罡离剑齐出，一击将简若山击飞撞墙重伤。剑罡极难修成，意味着他的剑意焠体已然大成——他心里那把名为不甘的野火整整烧了两年。迟宴依门规为他辩护：出剑的是简若山，不算偷袭，天光峰与上德峰的宿怨暗涌。柳十岁指名挑战简如云，满场哗然；简如云感慨要他认错，柳十岁怒问犯错的那个人真的是我，简如云脸色苍白地抢话打断，宣称就算他吃了妖丹也不是对手。柳十岁不再辩解，踏剑登柱，缓缓飞出的一剑承载千钧，安静而中正；白如镜认出那是自己只教半年的承天剑诀真义，生出悔意。"},{"n":98,"orig":98,"title":"剑行无彰","people":["柳十岁","简如云","赵腊月","白如镜","顾寒"],"one_line":"柳十岁显露无彰修为，与简如云难解难分","summary":"柳十岁的剑飞过百丈而剑意不散，凝纯无比，揭示他已入无彰境，成为景阳真人之后青山第三年轻的无彰，师长们震惊又感慨，若非出事他本可更快。他剑散四道剑罡全力出手，与简如云的灰剑瞬间交击无数，难分高下，两剑剑身都现出数百处细裂。随后二人御剑而战，凶险倍增；柳十岁能凌空出剑罡，简如云驭剑术更胜一筹，还施展出云行峰苍鸟剑诀第七式借云——他本是云行峰主亲传，禁闭半年竟悟得真意。云雾大作遮蔽柳十岁的剑感，简如云的灰剑仿佛无视空间直刺其面门，杀意毫不掩饰。柳十岁眼露不甘与决然。两忘峰弟子始终沉默，顾寒望着柳十岁踏出石柱的那一步，欣慰又愧疚。"},{"n":99,"orig":99,"title":"走火，然后入魔","people":["柳十岁","简如云","过南山","赵腊月","井九"],"one_line":"柳十岁妖火重伤简如云，被游野境过南山镇压","summary":"绝境中柳十岁体内妖火爆发，空气酷热如无形妖焰，简如云的飞剑如陷蛛网般被困；他驭剑强杀而至，却在对视瞬间认出柳十岁眼中与两年前浊水底鬼目鲮死前相同的野火，惊悔欲逃，一阵惘然后飞剑已贯穿胸膛。柳十岁毫不留情折剑欲斩其首，一道湛然剑光破阵而入，将柳十岁的飞剑绞成碎片——出手者是掌门首徒过南山，众人方知他早已是游野境强者。柳十岁喷血犹不肯罢休，跳柱追杀，过南山凌空数十击将他打落尘埃。井九自始至终面无表情，唯有赵腊月察觉：过南山重击柳十岁那一刻，井九的食指微微一动。过南山当众宣判：柳十岁果然吃了鬼目鲮妖丹，还修了血魔教邪功，满场怒目。"},{"n":100,"orig":100,"title":"一位过客站在这里的原因","people":["柳十岁","过南山","赵腊月","迟宴","井九"],"one_line":"赵腊月力保柳十岁免死，井九当场报名试剑","summary":"柳十岁坦然只要能杀简如云什么都愿意做，并揭发当年想吃妖丹的正是简如云——浊水底简如云欲偷妖丹，被他撞破反遭偷袭。迟宴称其假话不采信：灵魂烙印的秘法遮掩两年查无实据，今日妖丹入腹便是铁证。柳十岁癫狂大笑又落泪：妖丹是自己进来的，换成你们能怎么办？无人能答，却仍不肯信他。简如云保住性命，柳十岁支撑两年的那口气终于泄了，满脸绝望。迟宴宣布罪状并定剑刑处死，赵腊月以峰主身份否决——无人因此身死，且隐情待简如云醒来对质；掌门表态后改判夺剑丸、断经脉、废修为、逐出青山。柳十岁怒斥井九假慈悲：我最需要帮助时你在哪里！井九只抬手嫌他话多。试剑继续，井九忽然起身入场：要参加梅会得先过青山试剑，所以我站在这里。"},{"n":101,"orig":101,"title":"指名两忘峰","people":["井九","马华","迟宴"],"one_line":"井九指名挑战马华，以燎天式驭剑震惊全场","summary":"井九以取得梅会资格为由要求参加试剑，并指名挑战两忘峰弟子——低调不起眼的军师、排行三十七的胖子马华。马华低声问他怎知柳十岁是自己告发的，井九答不知道，他认定柳十岁这个局出自马华之手，且从洗剑溪起就不喜欢此人。马华自陈四年看不透井九，欲借机窥其秘密，驭剑退至百余丈外，自恃承意境飞剑杀伤不过百丈，稳立不败。井九解下铁剑举向空中，以驭剑秘法冲天而起，破云直上青山大阵之外才落下——因久未驭剑生疏而飞得过高，师长们暗叹其剑道奇才，马华第一次露出凝重神情，又退至更远石柱，继续拉开距离。"},{"n":102,"orig":102,"title":"剑去","people":["井九","马华","云行峰主","林无知"],"one_line":"井九速胜马华坦言刚才破境，再指名顾寒","summary":"云行峰主挥袖把云雾压成地上海，好让弟子看清战局。井九一字「去」，铁剑快得没有残影，马华强行召回飞剑才险险挡住，识海震荡；铁剑再至，马华踏剑而逃，原先的石柱被斩出豁口。他喊认输未及出口，铁剑已把他从天空一路砸到地面，剑剑皆斩在剑上——井九并非留情，而是要当众让两忘峰丢脸。重伤的马华颤声问你何时破的境，井九答「刚才」：直到柳十岁被过南山打落尘埃那一刻，他才决意破境入无彰。众人想起柳十岁被废的场景一模一样，感叹此人记仇。井九随即再度望向两忘峰石台：「请指教。」这一次他指名的是顾寒。"},{"n":103,"orig":103,"title":"铁剑依然在","people":["井九","顾寒"],"one_line":"顾寒三峰真剑轮番压制，井九铁剑始终未断","summary":"顾寒坦言一直不喜欢井九，今日因他肯为柳十岁站出来而有所改观；井九称对顾寒的看法未变，重申「你们的道都是错的」。顾寒出手便是八方剑法，又接连施展无端剑法、六龙剑诀，三峰真剑信手拈来；井九虽能后发先至，终究难敌境界差距，被压得险象环生，只能驭剑游走闪避，一路退至数里外的西面石林。观战弟子看不清那边战况，只闻满场赞叹顾寒剑法精熟。峰主们却看得清楚：无论被压制得多辛苦，井九的铁剑始终在；他用的是神末峰九死剑法，纯熟如练了三百年，却毫无蹈死之意，只有看破生死后的平淡。顾寒久攻不下自觉丢脸，决意速胜，飞剑直袭井九面门，同时双手结出秘法——寒井锁清秋。"},{"n":104,"orig":104,"title":"断剑","people":["井九","顾寒","过南山"],"one_line":"井九破寒井锁清秋刺伤顾寒，徒手折断蓝海剑","summary":"顾寒以雪流剑法第九式寒井锁清秋双手锁住井九的铁剑；众人以为无剑的井九必死，长老们准备出手相救。井九身形如沙随风消散，下一刻带着满身如丝剑光出现在顾寒身前——那种速度令峰主们联想到中州派的天地遁法。他横剑一划破开封锁，铁剑穿透顾寒右胸。过南山察觉井九毫无收剑之意、杀意隔着数里都能感应，判断他真会为柳十岁杀人，于是破阵出剑救顾寒，飞剑直斩井九后背。井九不躲不挡，忽然转身双手一合夹住飞剑——正是果成寺大悲手，过南山竟无法召回自己的剑。井九双手一错，将这把名为蓝海的仙剑生生折断，过南山喷出一口鲜血。"},{"n":105,"orig":105,"title":"先天剑体？","people":["井九","过南山","迟宴","赵腊月","顾寒"],"one_line":"峰主们猜测井九身怀先天剑体，隐有回护之意","summary":"两忘峰弟子欲围攻井九，被游野上境的迟宴喝退；过南山揽责自陈破境后骄傲、行剑超出能力，迟宴点破未喊停便出剑属违规偷袭，不追究井九以下犯上。井九对顾寒说：我这时候站出来了，但你没做好承受后果的准备。赵腊月索要一个试剑名额后带井九回峰。傍晚试剑结束，幺松杉等九人获梅会资格，最后一个名额归井九。几位峰主没有离开——战斗里两个画面令他们震撼：井九踏空时衣衫发丝皆带剑光，云行峰主怀疑那是传说中的先天剑体，即剑丸与修行者自身相合；再联系上德峰三年前怀疑井九练过金刚不坏，若果真如此，果成寺果身加上青山剑道，百年后青山或将出一位剑圣，故而诸峰对他隐有回护之意。"},{"n":106,"orig":106,"title":"井九门下大师兄","people":["井九","赵腊月","顾清","元姓少年","昔来峰主"],"one_line":"峰主密议井九来历，顾清暗示大师兄是柳十岁","summary":"峰主们议定把井九一分为二看待：若他真是果成寺蹈红尘的僧人，青山有事他必须回来相助，但双方时间须对等，此事秘而不宣。回到神末峰，赵腊月把溯流珠交给顾清与元姓少年，二人从模糊画面里看懂了试剑大会的变故：柳十岁被废逐出青山，井九连挑两忘峰、让掌门首徒吐血。夜里井九对赵腊月坦言，自己不理解两忘峰为何活得如此认真、愿意为别人而活，道理懂却无法接受；又说今天第一次有了急迫感——若现在已是破海境，就可以把白如镜打一顿。顾清则告诉元姓少年，按入门顺序神末峰的大师兄另有其人，是他们那位不知还能不能回来的大师兄。"},{"n":107,"orig":107,"title":"返乡的废人","people":["过南山","井九","柳十岁","顾清"],"one_line":"过南山夜访求和遭冷遇，柳十岁废修返乡","summary":"过南山仙剑被断，深夜步行到神末峰，自陈破境游野后骄傲、行剑超出能力所致，与井九无关，并请求井九日后莫要做得太绝——顾寒已知晓他的剑战风格，不可能再败。井九斥其言语莫名其妙，直接送客；过南山感慨这座孤峰仿佛有魔力，来的人都会变得像师叔祖那样孤绝。赵腊月问再战顾寒有无机会，井九答：万物皆是一剑，怎么可能只有一种风格。另一边，被废去修为的柳十岁走了整整一个月回到小山村，父亲要打被母亲拦下，隔墙是叹息与哭泣；村民见他都绕道而行。他在自家水田里跌坐，才想起自己已经是个废人。"},{"n":108,"orig":108,"title":"柳十岁的九天与一年","people":["柳十岁","柳父","柳母","玄阴宗使者"],"one_line":"柳十岁务农一年拒修邪功，玄阴宗使者无果而去","summary":"柳十岁像井九当年一样劳动了九天：蹲箭步、练拳、跑步、修屋、砍柴、插秧，从废人渐渐恢复成劳力，村里重新接纳他，有人作媒被他婉拒。春夏秋冬一年过去，青山往事像一场不真实的梦，只在山岭间望见剑光时他会驻足良久。开春时玄阴宗使者现身，提出带他去冷山总坛恢复实力，自称已暗中观察一年；柳十岁说自己知道妖火不灭之法，但那是邪派功法——正道弟子不能修，如今是农夫，也应该走正道。使者骂他傻，扔下一句这辈子最怕你这种人，转身离开。"},{"n":109,"orig":109,"title":"三顾","people":["柳十岁","老书生","魏成子","玄阴宗弟子"],"one_line":"不老林三派轮番劝柳十岁入伙，柳十岁自刎未遂","summary":"一茅斋老书生来访，自称看了柳十岁三个月、很喜欢他，劝道：功法只是刀，杀人救人在一念之间，用邪功行正道便是正道；柳十岁以不确定能否握住这把刀为由拒绝，不愿背门别投。次日中州派元婴境魏成子登门，斥青山小家子气，许诺传他守神功法，若不成便自杀。柳十岁醒悟三派高手同来小村必属同一组织——果然是不老林。他借倒茶进厨房拿菜刀自刎，被阴风掀飞救下。魏成子当面杀死那名玄阴宗弟子（实为魔头夺舍的躯壳），以证不老林也有好人，最后通牒：站在我们这边，或者去死。"},{"n":110,"orig":110,"title":"好一朵美丽的茉莉花","people":["柳十岁","魏成子","柳父","柳母"],"one_line":"柳十岁佩茉莉随不老林离去，井九独行赴朝歌","summary":"魏成子摊牌：中州派元婴长老与一茅斋前辈都是不老林的人，任务是要柳十岁自愿跟走，不从便只有死，还威胁若自杀便全村陪葬。柳十岁要求考虑一晚。当夜他去见父母；柳父从厢柜深处取出匣子，里面是一朵道法封存、依然白嫩如初的茉莉——一年多前井九留下，交待若柳十岁仍要走便交给他。柳母把茉莉缝在他衣襟上，柳十岁从此消失在小山村。梅会在即，青山数十道剑光飞抵朝南城入驻宝树居；宝树居为保住为青山运送资源的肥差，欲改投神末峰门下。此番青山参会阵容被讥为数百年来最弱：过南山断剑闭关炼剑，顾寒简如云养伤。井九独走，在云集镇酒楼要一锅白汤，只煮一片青菜叶。"},{"n":111,"orig":111,"title":"景阳真人别府？","people":["井九","年轻僧人","老僧"],"one_line":"井九赴氓山假洞府等故人，重逢果成寺聒噪僧","summary":"井九乘顾家备好的马车独走，前去氓山——那里传闻有前代真人洞府因宝光现世即将开启。井九知道是假的：所谓景阳真人别府，其实是当年他与那位贪玩爱看热闹的家伙师兄一起做的假洞府恶作剧，他去是要看那个人会不会出现。入夜他先在禁制外的破庙歇脚，果成寺一老一少两位僧人也来避夜，年轻僧人进门便嚷这里不可能是景阳真人别府，把满庙探宝散修骂作白痴，诚恳道歉收场；他认出井九又急又喜，随即被师伯喝令闭嘴，第三次被迫修闭口禅。井九想着要不要把闭口禅学会，过两年再传给十岁。"},{"n":112,"orig":112,"title":"禅子相见不相识","people":["井九","禅子","老僧","昔来峰主","年轻僧人"],"one_line":"禅子现身破假洞府流言，井九借祥云躲过昔来峰主","summary":"老僧解释果成寺遣他们前来是为救治争宝死伤；井九断言洞府是假，只是恶作剧。洞府将开，散修们争执分宝，果成寺禅子驾祥云莲座现身，宣告此间是太平真人与景阳真人当年开的玩笑、并无真宝，众人敬服散去；禅子又叮嘱老僧莫向北。井九原以为会见到那个家伙，崖上却空无一人，反而在人群中发现了最不可能出现的昔来峰主。对方剑识落在他身上，除非拉开足够距离无法抹除，井九立即借禅子祥云的阴影飘然同行数百里；昔来峰主远远注视，终究没有出手，化作剑光归山。祥云加速飞往朝歌城，只留下禅子的声音：小友，就送到这里了，再会。井九暗自牢骚：小友？"},{"n":113,"orig":113,"title":"笑问客从何处来","people":["和国公","禅子","胡贵妃","井九"],"one_line":"禅子入朝主持梅会婉拒胡贵妃，井九雨夜返乡","summary":"和国公奉旨在皇宫别院净觉寺接待禅子，禅子应允为陛下解佛法疑难并亲自主持梅会。和国公问氓山洞府，禅子答那不过是太平真人与景阳真人当年开的玩笑，祥云下的人是故人之后所以看顾一眼。胡贵妃求赐福被婉拒：当年救她是慈悲亦是缘份，今日她福缘极盛不必再贪。寺外胡贵妃愤懑，嬷嬷提议请中州派出面被她厉声斥退——中州派与青山宗对峙多年，不可挑拨正道根基；她只想要赵腊月认个错，又怒斥井九竟敢挑战童颜。井九冒雨入朝歌城，守兵问来做什么，他答回家。他走到太常寺旁那个安静小院前——上德峰查得清楚，井九祖上曾服侍前代神皇，家在这里理所当然。他犹豫片刻，走上前去。"},{"n":114,"orig":114,"title":"井家春秋","people":["井九","鹿国公","鹿鸣"],"one_line":"井九木牌开启旧宅，鹿国公向幼子托付秘密","summary":"井九推动门旁青石机关，方脸老者验过木牌后跪迎。院中井家满门是他名义上的父母家人，皆是朝廷二十年前安排、世代在太常寺做事的臣属，什么都不知却该记的绝不忘。老者禀报：七年前上德峰查过一次后再没来；四年前与一年前共二十一家宗派暗中打探，宫里胡贵妃也派了人。井九说要住到梅会结束，托他给赵府送信。老者经秘道回到府邸——他便是鹿国公。家族数百年的规矩是无条件支持神皇、绝对听从木牌所有者的吩咐，二者相抵触时听后者。当日他幼子正与宰相幼女完婚，他中途离席为井九开门，宾客只见国公匆匆去而复返，膝下灰衣有水渍，无人敢问。"},{"n":115,"orig":115,"title":"试问卷帘人","people":["井九","鹿国公","鹿鸣","大夫"],"one_line":"鹿国公洞房夜传秘密，井九以老暗号叩开卷帘人","summary":"洞房之夜鹿国公唤走幼子鹿鸣，交托传位之意与家族秘密——秘密要从博物架上那只被临时调包的汝窑大碗说起。井九在小院旁观井家人的紧张，拒绝了小孩的抱抱，道了句这些年麻烦你们了，戴上面具出门。他到朝歌城东白马湖畔一家刻着海棠的医馆——那正是情报组织卷帘人的联络地。他以多年前的暗号「海棠依旧否」问事，坐馆大夫惊觉来者用的是大宗派传承的老暗号。井九要查青山宗昔来峰主方景天与太平真人的关系，大夫说层次太高、他付不起代价；井九亮出空间法器里的两箱金叶子仍不够，大夫提出可以拿消息来换。"},{"n":116,"orig":116,"title":"我也知道很多秘密","people":["井九","大夫"],"one_line":"井九以禅子身世惊天情报换取卷帘人三大消息","summary":"前夜氓山之事仍换不到足够价钱，井九点破这位大夫并非普通执事、能第一时间知晓卷帘人所有情报；大夫开启阵法正式谈判。井九代表赵腊月追究三年前查碧湖峰走漏风声的旧辱，要求补偿：查昔来峰主方景天与西王孙，并保证卷帘人在青山九峰内线的安全。价码不够，井九抛出惊天秘密：禅子俗名金生生，父母双亡、被山妖养大，二十七年前汝州翠屏县志与果成寺律堂日志可以求证。大夫极为震动，回赠三个消息：今年梅会五名胜者将得禅子灌顶赐福；点评诸家弟子的天近人将至朝歌——此人盲而能察天地玄机，曾一语点拨欲寻死的落魄少年剑神，创建白鹿书院，洞天绝学胜过两界通两心通；另有价值百晶的梅会道战百人名册。井九对这位传奇人物的评价是：倒是挺能唬人。"},{"n":117,"orig":117,"title":"我下棋你在意吗","people":["井九","大夫","童颜"],"one_line":"卷帘人名册看轻井九，井九让全家押注自己棋胜","summary":"井九回赠消息：赵腊月将参加梅会道战最后一项。大夫据此断定来者正是景阳再世传人井九——知晓故人旧暗号又需要禅子相护的只有他，答应方景天与西王孙之事有进展便通知，还将赵腊月参战的消息记下。井九回院翻看名册：道战首位是洛淮南，西海剑派桐庐意外排第二，青山幺松杉十七，井九自己排在第四十几，评语认定他初学难成大器；棋战部分童颜稳居第一。井九不在意排名，只想着赵腊月参赛后名册会怎么改。他问井家可有梅会赌局，让名义上的兄长带全家下场押注棋战赌他赢——既赚银钱又干净稳妥，只看这家人信不信他。"},{"n":118,"orig":118,"title":"举指齐眉","people":["井九","赵腊月"],"one_line":"井九向赵腊月交托木牌与身世，赵腊月欲战水月庵传人","summary":"赵腊月收到信后来到井家小院。井九坦言这家人并非他真正的家人，身份来历皆是伪造，此院是景阳飞升前留的后手之一，并交给她木牌：若她或赵家在朝歌出事，可持牌寻鹿国公相助。至于师叔祖既然感应到不妥为何还执意飞升——飞升的诱惑太难承受。赵腊月问他何时告知真实身份、为何总躲着清容峰主南忘，答案都是「以后」。她透露水月庵来了位神秘女弟子果冬，是连三月的关门弟子；师叔祖当年与连三月确曾交手，她便不能输给连三月的徒弟，对着镜子遮起浓眉，井九揉揉她的头发笑说可爱死了。梅会明日开始，第一项是琴，而她根本不会弹琴，井九笑她真想死。"},{"n":119,"orig":119,"title":"梅园凌寒台","people":["施丰臣","清容峰主","桐庐","赵腊月","井九"],"one_line":"梅会开幕群雄入座，施丰臣暗誓亲手杀死赵腊月","summary":"施丰臣因查朝南城案得罪青山被排挤靠边站；去年他入宫本想拿发现的线索要挟胡贵妃，却险些丧命，自知陛下早知贵妃底细，自此认定青山那个少女峰主与胡贵妃都是将出的祸害，立誓朝廷管不了、法纪管不了，那就由他亲手杀死赵腊月。梅园由数十座寒台组成，为纪念当年皇族血脉与正道年轻领袖歃血结盟而建，梅会名次决定今后数年各派资源分配。各派入座：北面最高寒台属中州派，洛淮南童颜未到；一茅斋十位书生静坐观梅；果成寺在西方最高处，水月庵白纱女弟子蒙面难辨谁是连三月传人；西海剑派只有寥寥数人，为首是声势渐盛的桐庐。南面最高寒台是青山宗的位置，清容峰主南忘率数十名青衫弟子降临，众人争问谁是赵腊月、谁是井九。"},{"n":120,"orig":120,"title":"你一直都很好看","people":["井九","赵腊月","向晚书","桐庐"],"one_line":"井九梅园摘梅赠赵腊月，满园误当结为道侣","summary":"井九再无法以笠帽遮面，在梅会露脸成为绝对焦点，满园惊叹美极近妖；众人不解已入无彰的他为何仍背铁剑——只有他自己知道，入无彰后飞剑竟无法纳入剑丸，这是身体特殊所致，只能对赵腊月遮掩。中州派白帷后的女子嘱咐对井九多加重视；水月庵深处白纱女子认可赵腊月，却对井九徒有皮囊深感失望。西海剑派桐庐命人盯住清天司，扬言井九若报名道战便不介意与他一组。井九示意赵腊月坐在离清容峰主最远的座位，又摘下寒台边那朵小黄梅插进她鬓角，说她一直都很好看；满园哗然，都当他们已结道侣，倾慕赵腊月的向晚书脸色苍白如失至宝。文末附作者告知：母亲病逝，停更休整，后有断更说明与春节前情提要，预告复更。"},{"n":121,"orig":121,"title":"人间不值得","people":["井九","赵腊月","向晚书","白早","莫惜","南忘"],"one_line":"梅会开幕琴道之争，白早登场技惊四座","summary":"向晚书去年在西海初见赵腊月出剑杀人的英姿，由敬畏生倾慕，深藏心底，今日梅会上却见井九摘梅插上赵腊月鬓间，幻梦破碎。而井九与赵腊月数万里同行，从未想过男女之情，在他们眼中人间尚且不值得，情爱更算不得什么。和国公宣布梅会开始，因传闻断人生死前途的天近人已入朝歌城却未露面，众弟子颇为失望。首项比试琴道之争，各派弟子纷纷献艺，大泽书生引天地感应，向晚书吹箫落雪。青山宗素来不屑以琴棋书画炼养道心，南忘当年曾摘一片树叶吹俚曲夺得琴道第一，是青山宗史上唯一的琴道魁首。众人断言「反正赢的都是水月庵」，井九解释水月庵最擅以琴声入道的天人通。水月庵莫惜登场后，中州派掌门独女白早意外现身，举座皆惊。"},{"n":122,"orig":122,"title":"白露早为霜","people":["白早","赵腊月","井九","莫惜","向晚书","幺松杉"],"one_line":"白早琴音引百鸟，赵腊月宣告出战道战","summary":"白早是中州派掌门独女、正道盟主之位最有力的候选人，众人初见这位传说中的人物，惊于她的柔弱美丽，唯有看惯井九容颜的青山弟子不为所动。白早抚琴清亮干净，唤来百鸟相合，莫惜自知落败，向晚书却只望着青山宗寒台出神。井九与赵腊月对琴声的评价仅是「好听」，赵腊月认为世间好听的声音很多，听着便是，如同溪水悦耳不必鼓掌。曲终白早回望赵腊月，以为对方在关注自己，实则赵腊月关心的是洛淮南为何缺席。青山弟子议论：洛淮南年初已入金丹后期，相当于青山游野中境，年轻一代无人能敌，唯有游野初境的过南山或有一战之力，于是众道视线不由落在井九身上——他的剑曾断过南山的剑。此时赵腊月淡淡说道：「道战我来。」青山弟子震惊，井九看了她一眼。"},{"n":123,"orig":123,"title":"像井九一样弹琴","people":["井九","赵腊月","白早","南忘"],"one_line":"二人离梅会探天近人，途中闻霸气琴音","summary":"赵腊月确认参加道战，南忘不便相劝。此时寒台间有消息流传：天近人正在城中，洛淮南与童颜缺席极可能是去拜见这位命数大师，一时间人心思动。井九看出赵腊月真正想见的是洛淮南，便带她离席，众人哗然。白早猜到二人去向并不在意，只失望于赵腊月竟如此心急去讨他人肯定，认为这样的对手不配与自己相争。山道上井九直言赵腊月目前不是洛淮南的对手，更严肃告诫：数万里路上的战斗只是半真半假，梅会道战是他都不愿触碰的真实，死亡才是真实。赵腊月听不懂，只觉得井九一时遥远如深渊。忽然一声生涩却霸道的琴音自寒台传来，压下天地万籁，连流云都被撕碎，群鸟不敢作声。井九从琴声里听出故人之风，判断弹琴者来自水月庵。"},{"n":124,"orig":124,"title":"像某某一样下棋","people":["井九","赵腊月","大夫","年轻人"],"one_line":"井九携赵腊月问卷帘人，寻得旧梅园","summary":"梅会之外朝歌城暗流涌动，各方势力都在寻找天近人的下落。井九不知天近人在哪，却知道谁知道——城东白马湖畔一间刻着海棠的医馆，正是天下最大情报组织卷帘人级别最高的分理处。大夫一眼认出井九，连「海棠依旧否」的旧暗号都免了；又因资料里写赵腊月行事不拘小节，一时竟没认出鬓间插梅的她。大夫透露天近人一直住在旧梅园。赵腊月由此得知梅会来历：当年雪国怪物入侵，皇朝正统断绝，神皇与正道宗派年轻领袖在梅园结盟，如今的新梅园并非原址，真正的梅园已沦为无人凭吊的遗址，井九当年因破境错过那场盛会。二人走近旧街，遇一名容颜稚嫩、眼高于顶的年轻人连破棋摊，一步马破解了摆了十年、无人能解的残局，逼摊主滚走。"},{"n":125,"orig":125,"title":"故园铃声","people":["井九","赵腊月","年轻人","何先生"],"one_line":"年轻人扫荡棋摊，旧梅园响起破阵铃声","summary":"那名年轻人一步破掉师兄弟二人保守多年、连大棋馆高手都解不开的阴险残局，摊主不肯离开，他冷言「不走，你就死」，一念动天地，众人惊惧散开。春熙棋馆的何先生出面平事，问他缘由，年轻人直言要把这条街的棋摊全部赶走，因为「你们没有资格下棋」。井九看他下棋的样子，想起故人连三月当年杀人的气势，心情微妙，不愿再看，拉赵腊月离开。二人来到旧梅园前，故园荒败蒙尘，却残留着强大阵法气息，凭二人境界破阵不易。梅林深处传来清柔悦耳的铃声，正是悬铃宗的高手强行破阵，井九挑眉，猜那小姑娘比他们更急，不知她想问天近人什么。赵腊月担心悬铃宗安危，握住井九的手驭剑而起，一道红光照亮旧园。"},{"n":126,"orig":126,"title":"云胡不喜","people":["赵腊月","井九","瑟瑟","胡贵妃","翠姨"],"one_line":"梅林外破对峙，赵腊月对上胡贵妃","summary":"悬铃宗的翠姨与瑟瑟小姑娘被宫中老太监率侍卫拦在林外，双方剑拔弩张。赵腊月一声「谁敢」，轻描淡写却无人敢应，老太监认出二人身份后赶紧让路。瑟瑟见到赵腊月十分欣喜，牵住她的手，解释宗里为天近人的行踪付出代价、答应不外传才没通知他们。赵腊月下意识揉了揉她的头，又奇怪自己何时习惯了这样的亲近。众人说起青山宗动辄问人想不想死、行事暴力的名声，赵腊月认真想了想，承认有道理但没法改，因为世上该死以及想死的人太多。石道尽头的小庵前，梅树下站着一位美人，正是宫中最受宠的胡贵妃——当年赵腊月所杀的黑龙寺住持竹贵与她有旧，此番仇人相遇，两道视线穿过落梅相接，庵前空气仿佛凝结。"},{"n":127,"orig":127,"title":"瑟字有几种写法？","people":["赵腊月","胡贵妃","井九","瑟瑟","锦衣年轻人"],"one_line":"胡贵妃言语交锋落败，太子现身梅林","summary":"当年赵腊月杀了与胡贵妃有旧的黑龙寺住持竹贵，清天司大阵仗追缉凶徒多半是受宫里施压。如今仇人当前，胡贵妃以宫中手段暗讽赵腊月母亲身份低微、女儿不及母亲，赵腊月不接招，只淡淡道会让母亲以后不再进宫——赵家下一个千年全系在她身上。胡贵妃自觉拿着绣针与人过招、对方却直接一剑砍来，郁闷作罢。天近人一天只看三人，名额成了争夺焦点，瑟瑟讥讽胡贵妃不过是想给皇帝生孩子。井九看破她真身是被佛家点化的狐狸，天生媚惑，想着见着皇帝要提醒一句。此时一名气息深藏、自带贵气的锦衣年轻人走来，冷淡道：「父亲又不是没孩子，你想问什么？」他问赵腊月是否青山宗道友，井九径直无视他，与瑟瑟打趣她的名字是「得瑟的瑟」。"},{"n":128,"orig":128,"title":"一件小事","people":["井九","瑟瑟","洛淮南","赵腊月","锦衣年轻人"],"one_line":"瑟瑟赠清心铃，洛淮南扬言要断井九剑","summary":"锦衣年轻人对青山宗态度冷淡，只因皇族亲近中州派，井九却彻底无视他的身份。瑟瑟拿出两只悬铃宗清心铃送给赵腊月和井九，品级竟与太子自幼系在脚腕上防身的那只相当，胡贵妃与锦衣年轻人都暗自惊异。井九琢磨回礼，想到峰中众弟子与故人都要他操心，最后许诺：可以帮瑟瑟做一件事，什么事都可以。赵腊月大为吃惊——井九天生不愿与世间万物发生联系，这句承诺是件大事。旧庵门开，走出洛淮南，他先温和补充承诺的边界：不能要井九行恶或伤害自己。随即他直视井九放话：过南山胸襟开阔，不会计较断剑之辱，但自己性情直接，若有机会会断了井九的剑为他出气。赵腊月眼中寒光乍现，那是毫不遮掩的战意与杀意——纵然你是洛淮南，也要一剑杀了。"},{"n":129,"orig":129,"title":"两句天命","people":["洛淮南","井九","锦衣年轻人","胡贵妃","赵腊月","瑟瑟"],"one_line":"洛淮南先行离场，天近人同语拒太子贵妃","summary":"赵腊月剑心的犀利令洛淮南凛然，他想起试剑大会上的传闻：井九或身怀先天无形剑体，若与以剑意焠体、欲修成后天剑体的赵腊月同在神末峰，青山日后将不可限量。井九举手止住赵腊月，洛淮南深看他一眼离去，全程无视锦衣年轻人。童子先传话拒绝太子：事涉天命，无法看——太子想问的是继位。他先是失望，随即想通其中意味，带着满足的笑离去：连看都不必看，已是天命所归。瑟瑟点破此节，胡贵妃恍然，她问子息得到一模一样的答话，先愣后狂喜，连声道谢退场——生下儿子也当不了太子，反倒免了担惊受怕。井九心想皇帝性情还是宽仁，只是没把儿子教好。同一句话拒绝两位大人物，这极可能关乎人族皇朝的将来，深意无人能解。"},{"n":130,"orig":130,"title":"到底谁有秘密？","people":["井九","天近人","赵腊月","童子","瑟瑟"],"one_line":"赵腊月入庵未问，天近人一语留住井九","summary":"井九对童子直言：若天近人的话真有深意，那天命归一何来两处，岂非要挑动皇宫内乱？童子语塞。瑟瑟问出母亲何时改嫁，答案是至少十年之后，她满意离去。赵腊月进庵，井九在庵外久候，得知同伴已出庵却什么都没问，自己则连名额都没讨便要走。童子拦不住他，正在此时，一道唯有井九能听见的意念入耳：「你真的不想知道景阳的下落？」整个世界都以为景阳真人飞升了，知道飞升失败的人必与当年之事有关，可能正是井九一直在寻找的主谋或帮凶，何况对方神识之强连青山破海境长老都不如。井九因此回身入庵，见到传闻中最接近天道的白鹿书院大师天近人：双目尽盲，以雪毫笔写熟墨字，字极好。天近人开口第一问：「既然你对世间没有任何关心，为何会来这里？」"},{"n":131,"orig":131,"title":"你承受得住吗？","people":["井九","天近人","洛淮南","赵腊月"],"one_line":"井九只问他人问题，天近人执意要窥其身","summary":"井九毫不犹豫说出自己的问题：「我想知道他们所提问题的内容。」天近人意外至极——竟有人把求问的机会用来打探他人。井九坦言自己的事自己会问，失败的感觉他尝过，不喜欢。天近人便透露洛淮南问的是前辈看人究竟看什么、雪国天气如何，得到雪国之冷与冥都火锅都将持续百年的答案，洛淮南满意而笑——人族百年内无忧。而赵腊月站在他面前犹豫许久，最终什么也没问。井九随即放弃剩下两个问题，点破对方让自己进来并非为了解答，而是受人所托想问他。天近人不肯说委托人是谁，只道以他之眼可看穿一切伪装乃至天机，执意要看看井九，连天道都敢窥一眼。井九平静反问：「你承受得住吗？」四目相对，庵室里的时间开始变慢。"},{"n":132,"orig":132,"title":"以剑斩意","people":["井九","天近人","童子"],"one_line":"天近人神识潜入，被井九剑意尽数斩碎","summary":"天近人的白色眼球吸噬目光，井九思维渐慢，空间静止、声音消失。守在门外的童子想起数年前无恩门主来访时白鹿书院同样的死寂——此后无恩门在与西海剑派之争中一败涂地，先生也重病一场，真相外人无从知晓。庵内井九惊觉一道微渺而强大的神识片段已随经脉潜入识海，落在道树上，可无声无息地污染道树、滞碍修行、动摇道心，更可能发现他的秘密。这是他再度踏入道河以来最危险的处境。他连续推演三次，确认不可留此大患在体内，随即心意定、剑意起：剑丸散作三百余道剑意，将神识片段斩成碎屑，一道无形雷霆随之轰灭一切。天近人遭神识反噬，闷哼吐血，颤抖着盯住井九：「你究竟是谁？」井九只道这答案你承受不住，拿起案上一叠白纸离去。"},{"n":133,"orig":133,"title":"我不想知道你是谁","people":["井九","赵腊月","天近人"],"one_line":"井九带伤离庵，点破洛淮南与太子避嫌","summary":"案上白纸缀满血点如梅，天近人喃喃「好亮的银光」，震惊于井九如何察觉并破解他的手段。井九实则也受了不轻的内伤，一路以纸擦血、剑火焚纸，以决然姿态震慑对方。他向赵腊月点破：景氏皇族亲近中州派，中州派首徒不可能不认识当朝太子，二人在庵前互不理睬正是避嫌。至于入庵的真正缘由，井九坦言是好奇——传闻天近人最接近天道，而他见过真正的天道，想借此印证自己所见、破除心障，可惜对方离天道尚远，无法证明。回到街上，井九分析那位赶棋摊的年轻人不进庵提问，正因为既聪明又骄傲，深知问题都是问给世人看的，答案反而不重要。赵腊月其实最想问井九是谁，井九正要直言「我就是你想……」却被她抬手打断。"},{"n":134,"orig":134,"title":"你要不要来试试看？","people":["赵腊月","井九","郭琪","年轻人"],"one_line":"赵腊月拒知井九身份，童颜邀井九观棋","summary":"赵腊月说明不问的缘由：她有过许多猜测，甚至想过井九是邪派妖人，但今天想明白了，自己并不需要这个答案——不想听到不好的答案，更不知真到那一步该怎么办。井九承诺不会是坏的答案，她说：「你是谁不重要，我只知道你是对我很重要的人。」井九确认是这样的。因井九带伤，二人破例牵手同行。街上，赶尽棋摊的年轻人已胜过春熙棋馆高手，惊动了闻讯而来的文渊阁大学士郭琪——公认的朝中第一棋道国手。年轻人道明来意：不想让这些人在此下棋，故梅园见证过人族历史上最重要的事，不该被争棋吵闹声与江湖骗子打扰清静。郭琪许诺若败便清场，年轻人断言他赢不了，随后望向路过的笠帽男女，发出邀约：「你来试试能不能看懂我的棋。」"},{"n":135,"orig":135,"title":"旧梅园名局的隐形参与者","people":["井九","年轻人","郭琪","赵腊月"],"one_line":"郭童对弈成棋史名局，井九暗中同步推演","summary":"听到邀约，寻常故事里赵腊月该拔剑而起，井九却在心中推演出那样做的后果：正道两强全面开战，西海剑派趁势而起，邪派与冥界妖人趁乱发难，雪国南下，刀圣战死，朝歌城破，人族皇朝毁灭——这段历史被他终止了。他松开赵腊月的手走到棋摊前，郭大学士凝神对局，视年轻人为数百年来最具天赋的棋才，不敢有丝毫分神。棋子落下，落子看似寻常却无人能推算后续，闻讯而来的棋道高手越来越多，连几位国公都亲临观战，这局旧梅园外的对弈注定写进棋史。无人知晓，戴笠帽的井九才是这局棋的隐形参与者——他从第一步起便同步推演至终局，这个极端方法对没认真学过棋的他最适用，只是格外耗神。站久了，他取出竹椅坐下，成了众人侧目的怪人。"},{"n":136,"orig":136,"title":"挑灯看棋以及看人","people":["童颜","郭琪","井九","赵腊月"],"one_line":"郭大学士中盘认负，童颜身份揭晓问井九","summary":"井九向郭大学士讨了一杯信阳毛尖，青年随即落子反制，郭神情骤然凝重。暮色渐浓，长街灯笼如昼，棋至中盘，观战高手皆站郭一方苦思破解，郭本人长考之后终于长叹认输：「人力果然不能胜天，我还是太贪心了。」能中盘胜当朝第一国手的，放眼世间只得一人——中州童颜，毫无争议的天下棋道第一。童颜不看棋盘，转头问竹椅上的笠帽人：「你看懂了吗？井九。」井九摘帽，露出那张无法形容的脸，满街哗然。众人想起传闻：去年四海宴与青山试剑时，井九都曾放言要参加梅会、在棋道上战胜童颜。可卷帘人为梅会编的小册子里，棋道第一是童颜，井九连前十都未入，童颜又素来孤傲，怎会专程在此等他？这一局棋与这一问，究竟有何深意？"},{"n":137,"orig":137,"title":"打的一手好算盘","people":["童颜","井九","赵腊月","郭琪"],"one_line":"童颜讥井九下棋如打算盘，井九落子自堵","summary":"童颜看过井九四海宴的棋谱，认定他是苦战流，只凭蛮力计算得失，毫无美感，直言：「你那不是在下棋，是在打算盘。」还说井九断过南山之剑用的也是算计，算计终究难成大道——中州天才竟为青山首徒打抱不平。井九回应：下棋和麻将没有区别，都是游戏；宇宙无限算不尽，但棋盘只有三百六十一个点，为何不能算尽？没有人能算到对手的每一步，因为对手自己都可能不知道。临走他在棋盘上落下一子，把自己一大片棋堵死，众人只当是体面认输的机智，唯有童颜与郭大学士盯着另一处默然无语——那才是他真正落子的地方，井九离开前用指尖敲过。赵腊月不解，井九解释：他想不到我会这么走，也就想不到自己下一步会怎么走，终究还是要算尽所有可能。"},{"n":138,"orig":138,"title":"遁去的一","people":["井九","赵腊月","元骑鲸","骨笛青年"],"one_line":"夜谈棋力高下，冷山青年唤出遁剑者","summary":"夜谈中赵腊月望着星空又生出面对深渊之感，那个最不可思议的猜测再次浮现，她不敢深想。井九评价棋力：象棋童颜绝不可能赢他，围棋则他不如童颜——旧梅园外那一子只是旁观者清，真让他下场对整盘，败面很大。赵腊月对当年四海宴的一句话引来这些事暗生悔意。临别时井九被问起麻将，承认以前被人逼着打过几次。青山宗里，新晋通天境的元骑鲸默默注视上德峰那口通向地底的幽井；掌门立于天光峰石碑前，望着碑中剑鞘若有所思，守山元龟不解掌门们为何总有想不开的心事。朝歌城之外，冷山雪原上一名骑牦牛、吹人骨笛的青年收到纸鹤，笑谈有人想借一个神棍对付他小师叔。他行至绝壁前，敲石唤道：「出来吧，遁剑者。」"},{"n":139,"orig":139,"title":"遁剑者的传说","people":["骨笛青年","井九","鹿国公"],"one_line":"遁剑者传说揭晓，鹿国公道破童颜婚约","summary":"世间有三名遁剑者：南海通天境剑仙以大阵将宗派岛屿自禁于海雾，前皇朝继承者藏身万年灵龟壳隐姓埋名，最出名的是玄阴宗第三代祖师——因坏清容峰弟子名节被青山剑宗追杀，总坛被毁后藏于地底不见天日。三人自此销声匿迹，遁剑者遂成大陆最著名的传说，也有人质疑这只是青山宗自抬声威的编造。绝壁前，骨笛青年以通知青山宗晚辈相胁，逼出沉默的老祖，道明来意：「我只是想拿回属于我的东西。那副麻将牌已经很久没打了，你想不想做我的新牌搭子？」朝歌城里，井九向井家大哥问麻将，得知棋局押注已无法撤回，连夜研读棋书并复盘郭童之局，胜负只在半子之间。鹿国公道破关键情报：童颜是中州派掌门夫人为女儿选的女婿，他自己却不愿——因为洛淮南才是掌门亲自选定的女婿。"},{"n":140,"orig":140,"title":"井九进宫","people":["井九","鹿国公","神皇"],"one_line":"井九指认方景天，深夜入宫面见神皇","summary":"井九告诉鹿国公：天近人想杀他——神识片段若潜入成功，他的生死便被对方掌握。他又道青山内部之事不必查，直接点出方景天的名字，这份直言既是绝对的信任，也是自信。鹿国公为难：天近人受万民景仰，是西海剑神的挚友半师，且是神皇亲自邀请来朝歌城的，与请禅子的邀请前后发出。井九立刻明白皇帝是想测算自己的寿元、安排好后事；水月庵庵主闭关未至，来人至今神秘。井九当夜便要进宫，鹿国公凭两代神皇的信任办到，角门悄开，侍卫太监默契地视而不见。大殿中不闻谈话声，偶有井九的咳声与陛下的爽朗笑声。鹿国公望着自己的影子，想起国公府数百年来最担心的那片阴影，确认父亲的判断无差——神皇的意志与木牌所有者的意志果然统一。井九回府读完全部棋书，等到了那个消息。"},{"n":141,"orig":141,"title":"步步生莲","people":["天近人","禅子","井九","童颜","果冬"],"one_line":"禅子约晤天近人，一步一莲留下禅念","summary":"梅会第一天传出三个消息：琴道之争竟是水月庵名不见经传的果冬——连三月的关门弟子——胜了白早；童颜未参加梅会，在旧梅园外中盘胜了郭大学士；天近人的住处曝光，洛淮南拜见的问答传开，声望更盛。无人知晓前夜井九曾进宫与神皇长谈。清晨清天司确认天近人未离开，神皇手书送至净觉寺，禅子邀他一晤，昨日刚吐血的天近人仍赴约。禅子以少年僧人形象现身，问皇帝请二人来朝歌的用意，点破陛下忧心的并非国族大事，而是一位故人之后，又直接发问「是方景天？」——当年景阳假洞府开启时，正是他发现方景天对井九动了杀意，才以莲云护井九离开。天近人不答。禅子称那个年轻人也算自己的故人之后，飘然离去，足迹间的湿泥里一步生出一朵白莲，将禅念留给了天近人，他不知自己能否活着离开。"},{"n":142,"orig":142,"title":"荷花入夜","people":["天近人","禅子","井九","赵腊月"],"one_line":"天近人破禅念重创，就此离开朝歌城","summary":"禅子留下的禅念化作白莲轻烟、起舞美女与满天神佛，或诱或压。天近人洒出十余枚前朝古铜钱驱散舞女，又令铜钱气息凝成桃枝抽向神佛，却不能损其分毫。他决意放手一搏，以白鹿书院养炼多年的磅礴意念枯萎白莲、逼退神佛，却在生灭之际猛然醒悟：自己双目尽盲，为何能看见这些？既然一切皆是虚妄、皆是一念所系，他便不再看见。满天神佛散去，天近人浑身是血、双目流血——能活着已是禅子慈悲，若不醒悟继续攻击，那些力量都会落在他自己道心上，纵活也会变成白痴。他离开朝歌城，修为大损，十年内无法演算天机，心灵重创。外界传言他高人风范或遭天道反噬，井九知道全是假的，赵腊月也猜到真相，二人感叹以后游历该带上顾清。赵腊月另带来一个消息：皇帝要去棋盘山看棋。"},{"n":143,"orig":143,"title":"开放","people":["胡贵妃","井九","果冬"],"one_line":"神皇准胡贵妃停服断离丸，她狂喜昏厥","summary":"天近人离去后梅会继续，果冬拿下琴战第一，棋道之争因井九放言挑战童颜而备受瞩目，神皇决定亲临棋战现场更把热度推向高潮——以往他只在最后的道战露面。胡贵妃心情大好：昨夜枕边撒娇，陛下答应带她观棋，届时井九惨败于童颜手下的窘相定然精彩。她早年受禅子教诲已断替竹贵报仇之念，只想借机出气，也算了断因果。清晨照例该吃断离丸——入宫首日神皇便交待她每日服用，此药可确保女子无法怀孕，她多年不曾间断，甚至成了习惯。老太监却传下旨意：陛下离开前吩咐，那药今后不必再吃了。胡贵妃先怔后醒，狂喜至极，当场昏了过去——陛下竟允许她有孩子了。另一边井九直言不喜欢那位锦衣皇子，嫌他分寸感与位置感不好：以皇帝的境界想有后代随时可以，如今他表明态度，皇帝只怕很快会生下第二个儿子。"},{"n":144,"orig":144,"title":"青山如棋盘","people":["井九","南忘","赵腊月","瑟瑟"],"one_line":"南忘强令井九必胜，晶石之争改以棋定","summary":"修行者往往很晚才收徒，与皇帝不生孩子是同样的道理。梅会期间青山宗入住西山居，弟子们因井九与两忘峰的旧怨，对他态度复杂，但都盼他至少能走到童颜面前，别让宗门丢脸。南忘单独召见井九，房中燃着南蛮高地香，她凝视井九良久，提出的不是鼓励而是要求：「你要赢。」又冷声说有人想跟青山争，就要弄死他们。原来西海剑派就资源配额发难，最终导致青山与中州派在晶石分配上产生分歧，以往以道战胜负判定，今年却在神皇亲临棋战、数位国公推波助澜下改成以棋战定输赢——那些国公素来亲善中州派。井九平静应下，视之为因果与道心归宁；不擅言辞的南忘与人争执不过，气得衣袖发抖。二人随后前往棋盘山，山间亭子散落如棋子，此地便叫棋盘山，瑟瑟赶来会合，井九的脸引来所有视线。"},{"n":145,"orig":145,"title":"棋盘上有些灰","people":["井九","赵腊月","瑟瑟","谷元元","尚旧楼","雀娘"],"one_line":"棋战规矩与三大高手亮相，井九独行","summary":"井九与赵腊月行经棋盘山，一路受到各色视线注视，嘲笑、同情、担心皆有。翠师姐介绍棋战规矩：山间亭子便是战场，参赛者可择亭坐等挑战，也可主动挑战他人，每轮结束后梅会主持者封亭，保证人人有对手。择亭大有讲究，有人靠瀑布磨砺心性，有人讲究竹影松涛的韵味。井九却径直走过众人敬而远之的地带，途中遇见今年棋战三大热门：镜宗雀娘承继前朝贺大学士的棋道传承；一茅斋书生尚旧楼上届梅会只输童颜三子，出言生硬赶人；风刀教谷元元——其父本是征北军将领，数年前被刀圣看中棋力硬抢入教——更扬言井九会死得比他的棋还难看。赵腊月不高兴，只因举世只有她一人知道井九能赢，这种感觉不好。井九走到一条清溪边停下，说溪水很清就这里——那里根本没有亭子，众人愕然。"},{"n":146,"orig":146,"title":"棋枰上的那把火","people":["童颜","井九","谷元元","尚旧楼","雀娘","向晚书"],"one_line":"童颜登场刻薄群雄，果冬现身引井九注视","summary":"翠师姐补齐谷元元的背景，井九不动声色把雀娘、尚旧楼、谷元元三大热门尽数记住。水月庵果冬忽然现身棋盘山，容貌寻常却令井九认真看了很久——赵腊月想起那日梅园后山撕裂流云的琴音。随后白早到来，洛淮南依旧缺席。童颜与向晚书最后登场，全场致敬：他以棋入道、以道养棋，一人把天下棋道推到前所未有的高度，雀娘、尚旧楼、谷元元皆受其影响，却只能追随他的脚步。童颜对候他多时的尚旧楼刻薄相讥：写写画画只需苦练便可做到最好，下棋却要天赋，你怎么赢我？又断言刀圣不会下棋，无从判定谷元元会下棋，更对行半师之礼的雀娘吩咐「我不喜欢和这个北方小子下棋，赢了他」。雀娘大喜，谷元元脸色难看。向晚书暗自苦笑，担心刀圣动怒会给师兄与师姐白早的亲事添阻力。此时山谷里传来酒香与一个声音：童颜今天心境有问题，废话太多。"},{"n":147,"orig":147,"title":"溪间崖畔尽狂生","people":["何霑","童颜","井九","赵腊月","瑟瑟"],"one_line":"第二人何霑现身，自认今年能赢童颜","summary":"童颜的刻薄近乎无视，尚旧楼满脸通红无从反驳，他自认天赋确实远逊。谷元元大笑不服，童颜冷语回应后继续前行，雀娘得了他的指令满心欢喜，谷元元脸色更难看。向晚书暗暗发愁：刀圣若动怒，师兄与白早的亲事只怕阻力更大。这时野草丛里钻出大汉何霑——修道界人称「第二人」，散修，与邪派有来往、玄阴宗少主是其好友，三届梅会棋、书、画、道战皆拿第二，各派长辈怜其才华才容他参赛。井九听罢动了收徒的心思，摸了摸手腕，想起剑索已给了小狐狸应城小荷，又挂念起柳十岁。何霑与童颜言语交锋，自称受了某个少年启发有所进展、若童颜还是去年双山镇的水准，如今能赢他；童颜答那你今年没希望了。何霑又向赵腊月求证身份，邀她喝酒被拒，便带瑟瑟去溪上烤鱼。童颜立于崖畔不选亭子，赵腊月拦下井九取竹椅的举动，他只好席草而坐。"},{"n":148,"orig":148,"title":"万物如棋","people":["井九","童颜","何霑","赵腊月","和国公","南忘"],"one_line":"棋战开启，井九童颜直奔梅边矮亭对局","summary":"钟声响起，禅子与和国公等大人物驾临，禅子在半山三清观休息，棋战由和国公主持开场。青山间修道者如棋子般走向各亭，雀娘、尚旧楼、谷元元入驻早已选好的亭子，无人敢首轮挑战。井九仍坐在溪边草地上，被讥笑模仿童颜。何霑烤鱼归来邀战：「想赢童颜，先过我这关。」井九以「与人有约在先」回绝，起身走向一处梅边矮亭。几乎同时，在崖畔伫立许久的童颜也动了，竟与他走向同一个地方——满山哗然。原来二人从头到尾就没打算进别的亭子，今年最受瞩目的井童之战，在棋战一开始便直接上演，某种意义上这就是青山宗与中州派之争，皇帝忽然要观棋，多半也是为了这局棋。和国公急命通知宫里，南忘带青山弟子出动，禅子只问了一句谁先手。梅边亭内二人猜先，赵腊月望着井九，想起他那句话：太阳就在那里，如何能不去看。"},{"n":149,"orig":149,"title":"落子","people":["井九","童颜","南忘","赵腊月"],"one_line":"井九报出猜先之数，平淡开局暗藏惊雷","summary":"满山目光聚于梅边矮亭，参赛者纷纷离亭围观，已开的对局也停了，整座棋盘山只剩这一局棋。和国公断言以童颜的水准赢井九用不了三天三夜，除非井九玩阴招拖时间——可他是景阳真人的再传弟子。猜先时修道者可用神识探对方手中棋子数，众人不敢造次，只敢远望童颜手间那团乳白光焰，那是中州派先天玄功修至高阶的气象。井九却问「你想用哪个子」，童颜淡道我用白子，井九直接报出他手里是三颗棋子，省去单双，观者骚动。开局井九落三三，童颜立刻贴上，此后二人落子不疾不徐，局面寻常得没有半点惊喜，远处议论渐起，有人猜童颜留力是不想让青山宗太丢脸。南忘冷斥：「一群白痴。看不懂棋，就去看那些能看懂棋的人。」亭外，雀娘与尚旧楼神情凝重如临大敌，谷元元更是呼吸粗重如拉风箱。"},{"n":150,"orig":150,"title":"看不懂的棋局","people":["何霑","井九","果冬","禅子","井商","赵腊月"],"one_line":"高手尽失声，禅子摆错棋，井商想退注","summary":"白早悄然立于亭边细眉微蹙，果冬站在人群外不看棋盘，只看赵腊月。何霑连续失态惊呼：井九一步看似寻常的棋，他喊「没道理」；童颜的应对，他喊「更没道理」；井九再落子，他喊「还可以这样吗」；童颜一子挂往别处，他终于喊出「太狠了」。果冬冷冷斥他话多，何霑灌下闷酒闭嘴。观棋者由此醒悟：这局棋看似平平无奇，实则暗藏无数惊雷，只是他们的棋力看不懂。三清观里，连禅子都在自家棋盘上推演此局，长考落子后竟被道人提醒摆错了位置。峰顶和国公自认看不懂，押注稳稳押了童颜。朝歌城里，太常寺官员井商——井九幼时被送出城的兄长——闻讯第一局便对上童颜，惊得魂飞魄散，冷汗湿衫，恍惚间走到专设高级赌局的成国公府，低声问还能不能退注，管事笑而不语。"},{"n":151,"orig":151,"title":"终有一记雷霆","people":["井九","童颜","郭琪","井商","谷元元","何霑"],"one_line":"郭琪复盘叹服，中盘落子雷霆轰然而至","summary":"成国公府后园聚着半城王公与十余位棋道国手，郭大学士亲自取子在大棋盘上摆出变化，复盘讲解棋盘山那局棋，国手们恍然惊叹。郭大学士由此确认：旧梅园外童颜根本没尽全力，仍只能中盘认输，差距大得吓人。井商在人群后听得发懵——井九竟与童颜有来有往？棋盘山上，观战高手正付出巨大心神：雀娘咬唇咬破而不觉，尚旧楼闭目无声默念，与二人齐名的谷元元棋力稍弱最是狼狈，冷汗湿透，只觉这局棋与下棋的两个人都可怕。何霑早在中局便放弃跟上，明白换作自己执黑执白都已输了，对亭中二人生出心悦诚服的佩服。对局过去半个时辰，双方竟无一次长考；一片青叶落入棋盘，二人相视，同时收手暂停喝茶。棋至中盘短兵相接，童颜首次长考百息后落下一子，云层绞动、电光隐现，轰然雷霆随落子炸响。"},{"n":152,"orig":152,"title":"最后一步","people":["井九","童颜","赵腊月","谷元元","何霑","禅子"],"one_line":"棋局搏杀天象变色，童颜将落最后一步","summary":"雷声惊醒神思恍惚的谷元元，细雨落下，赵腊月盯住亭中井九，担忧写在眼里。井九开始第一次长考，应对童颜那步凌厉的靠，落子三、九，天边闪电照亮棋盘，黑子幽冷如剑光，雀娘如被刺了一剑捂住胸口，尚旧楼唇角溢血。三清观里禅子摇头长叹「太凶险了」，不再自行摆棋。峰顶和国公得知陛下刚结束临时朝会正要动身，暗盼棋局别这么快结束。此后双方再无长考，落子强悍清脆，棋盘上剑意杀意纵横，懂棋者呼吸困难：谷元元眼前幻化出雪原兵车与雪国大军，大叫昏死过去；雀娘与尚旧楼摇摇欲坠，何霑上前挡住他们视线——他早已弃局，只担心亭中二人承受的压力。暴雨倾盆，棋盘山大阵护住矮亭，棋局进入打劫终局，劫的是天地变化玄机。赵腊月看出井九双袖微颤，这是她从未见过的认真。雨停虹现，轮到童颜执子，所有人都感到这颗白棋便是最后一步。"},{"n":153,"orig":153,"title":"伟大而痛苦的胜负","people":["童颜","井九","向晚书","赵腊月","胡贵妃","谷元元"],"one_line":"童颜中盘认负，井九胜了天下棋道第一","summary":"童颜把那颗白棋轻轻放回棋瓮，胜负已分——当世乃至古往今来最强的棋道者童颜，输给了井九。人群炸开，却无人能点评这局棋，半数人对矮亭行礼致敬。皇宫御辇刚要出发便接到棋局结束的消息，神皇笑道：「既然胜负已分，那就去贵妃宫里吧。」一直盼着井九被羞辱的胡贵妃闻讯惊呼怎么可能。谷元元醒来喃喃「谁能赢他们啊」。井九平静如常，白早眼中露出一抹异色，果冬悄然离去。最难受的是向晚书：他由童颜亲手教出，又记起一年前四海宴上正是自己的话引来赵腊月反驳，才有了今日这局棋；而赵腊月鬓角微湿、梨涡浅笑地望着井九，他更加难过。童颜起身闭目仰面，雨水滑过稚嫩面庞，先说能下出此局此生无憾，随即声音微颤，道出被强忍的痛苦：「可是怎么能满足呢？我还是输了啊。」"},{"n":154,"orig":154,"title":"下棋是一件很简单的事情","people":["童颜","井九","赵腊月","向晚书"],"one_line":"童颜质问游戏与道，井九立体棋局惊四座","summary":"童颜自陈学棋时连输师娘十七盘并非没输过，但不想输给井九。他问：经过今日，棋还是游戏吗？井九答是游戏，甚至活着与世界存在也许都是游戏。童颜质问他这辈子有没有为什么拼过命，斥他对万物无情、漠然保持距离，这正是自己不喜欢他、不想输给他的原因；棋是童颜的道，他自认下出接近完美的一局却输给一个不喜欢棋的人，这不公平，会让一切失去意义。井九淡然道世界从来都是不公平的。童颜不信，他的毕生追求便是找到棋盘上的规律。井九直言琴棋书画太简单无法靠近大道，随手轻拍桌面，数百棋子悬空组出一个纵横竖三维的立体棋局——童颜承认这非人力可及，井九答修道就是做人力不可为之事，但自己确实累了，不准备再下。他道明因果：这局棋从海州四海宴就开始了，他从没说过要拿棋战优胜，只是要来与童颜下一局棋——现在，棋下完了。他带着赵腊月下山，满空棋子如雨落下。"},{"n":155,"orig":155,"title":"度尽棋劫起风波","people":["井九","何霑","雀娘","童颜"],"one_line":"何霑封棋，雀娘夺魁，井九疑出身果成寺","summary":"井九走后童颜也随之离场，放弃道战返回云梦山闭关，中州派不满的对象自然指向井九。何霑当众宣布以后都不下棋了：再下一辈子也赢不了那两个人，连衣角都摸不到。井九回到井家，得知兄长押的是单胜并未输钱。夜里他独自复盘，明白自己赢在近乎无限的精神强度上，童颜那局棋已接近完美，若非最后力竭时倒数第七步太过强硬，或者把这局拖成数十天的长局，胜负犹未可知，他对着棋盘轻声道：「你还是人间第一。」他来朝歌城本意是看那人会不会来找自己，下棋不过是游戏，心绪却有些微惘。其后数日棋战草草收场，谷元元、尚旧楼先后落败离场，镜宗雀娘撑到最后夺得优胜，似从那局棋中有所领悟。那局棋轰动朝歌，棋谱印数千张被抢购一空，宫中棋盘棋子以道法定形，陛下赏玩整夜。井九成了精于谋算的绝世美公子，而新流言四起：他可能出身果成寺。"},{"n":156,"orig":156,"title":"有人想见赵腊月","people":["井九","赵腊月","果冬","莫惜","施丰臣","梁星成"],"one_line":"果冬约赵腊月相见，施丰臣已布下杀局","summary":"青山宗早有人怀疑井九出身果成寺，试剑大会上他身露剑芒更添佐证，如今棋战展现的恐怖算力令此说流传开来，果成寺竟始终不辟谣。井九向赵腊月解释：和尚也有私心，既可掩护真正的蹈红尘传人，他走得越远对果成寺名望越有好处。众人期待他出战道战，他却无意参加，神末峰出战的是赵腊月。棋战结束十余日后，二人在赵氏别园泛舟：白早弃画择书竟夺书道第一，井九评她与童颜一样聪明，想明白了赋予形状之上的意义才是修道所求。果冬琴道第一、白早书道第一，与赵腊月的道战成了修行界比较的三人。井九有事先行离开，随后水月庵莫惜代果冬传话，约赵腊月三日后鸣翠谷单独相见。赵腊月应下，不想让井九知道——因为果冬是连三月的弟子。城南小酒馆里，清天司副巡查施丰臣呷着黄酒淡声道：「三天后就是赵腊月的死期。」对面坐着太子太傅的远房兄弟梁星成。"},{"n":157,"orig":157,"title":"施丰臣的一天","people":["施丰臣","梁太傅","景辛","梁星成","胖掌柜"],"one_line":"太子与施丰臣合谋，借不老林杀赵腊月","summary":"小酒馆里施丰臣向梁星成道明计划：借水月庵弟子约出赵腊月，杀之后栽赃到胡贵妃身上，纵然圣眷再深也是死路一条，陛下总得给青山宗一个交待。梁星成惊悉陛下今日出宫去骊山，不带牛、金两位供奉却带着贵妃。随后梁太傅面见太子景辛：断离丸停服的消息已经证实，父皇似乎准备再生一个儿子，太子之位并不稳固——在皇位面前任何冒险都值得。景辛问自己如何与此事无关，梁太傅答事情本就与他无关，又说自己信施丰臣，因为知道他的仇恨从何而来，仇恨能帮他守住一切秘密，哪怕面对青山宗。施丰臣随后密会不老林的胖掌柜谈这单买凶生意：他交出自己的把柄做投名状，而真正的筹码是太子，事成之后不老林自会从太子处拿到足够好处。深夜回到冷清的家，想到三天后赵腊月便会死去，他忽然伤感：都死了，死了也好，没有烦恼。"},{"n":158,"orig":158,"title":"王小明的半生","people":["施丰臣","王小明"],"one_line":"施丰臣因太平真人旧案，决意必杀赵腊月","summary":"施丰臣深夜翻看赵腊月与井九的卷宗，七十四条人命的血腥画面令他与多年前记忆重叠——「修道者就能随意杀人吗？我不会让青山宗再出现第二个太平真人。」太平真人之事是修道界最大秘密、青山宗最大污点，他不能对任何人说，本想面见皇帝陈情，却连贵妃都见不到。直到他发现清天司供应宫里的断离丸用量大减，推断出胡贵妃可能有孕，联系太子府后却发现太子与近臣蠢得看不出这是陛下的试探——这样的太子正好利用。他冷清的家里只有养子王小明：多年前两位修道者约战，余波震酥山壁，泥石流吞了整座村子，他从废墟里捡回这个断腿的婴儿，取了个最普通的名字，养大至今在清天司库房打杂。王小明不肯修行，只想跟师父学查案，施丰臣严肃告诫：面对修道者，阴谋与智慧都没有意义，唯有修行变强才行。三天后，赵腊月独自赴鸣翠谷之约，走进溪畔破旧道观，才发现整座道观竟是一座阵。"},{"n":159,"orig":159,"title":"赵腊月遇到的第一次暗杀","people":["赵腊月","黑衣人"],"one_line":"鸣翠谷遇袭，赵腊月断剑传讯显剑体","summary":"破观竟是一座与山水融为一体的阵法，不见杀机，唯有底蕴极深的玄门正宗方能布下。赵腊月第一时间唤出弗思剑布下漫天剑网自保——这是景阳真人参照水月庵道法自创的剑招。蒙面黑衣人现身，气息强大且高傲，点破此招至多支撑数十息，且她再无法以剑书求援，已是死局。剑元高速流逝，弗思剑渐慢生出剑啸，就在观中泥像头颅将磨平之际，赵腊月握剑出击，人剑如一，却被黑衣人双袖如墨浪般拍飞，撞墙吐血——境界差距无法以道心弥补。被震飞的弗思剑破顶远遁，那是剑书传讯：她主动断绝与飞剑的联系，必然遭受反噬重伤。黑衣人早算到这一步，隔空凝出如万重山石的一拳压向无剑的她。赵腊月举起双手相迎，掌心生出无数纯净剑意——她竟已修成后天剑体，整座破观被剑意尽数切碎。"},{"n":160,"orig":160,"title":"穿着厚布衣的少女","people":["赵腊月","果冬","黑衣人","南忘"],"one_line":"果冬琴音退敌救人，青山剑阵搜敌无果","summary":"黑衣人惊觉赵腊月已修成后天剑体，也看破她的算计：先示弱自保，再断剑示警，最后以剑体拖时间等援军。他不再保留，拳缝间散出莹白宝光，法宝正面轰击，赵腊月衣衫碎裂数十道口子、左眉渗血。远方天际传来一道破海境的剑意，黑衣人早与同伙推演过战局并不担心，道观外却忽然响起琴音——竟有人提前守在此处。他短瞬推算后当机立断，以天地遁法消身遁走，只留下一瞥。废墟外出现一位深春仍穿厚布衣的少女，正是水月庵传人果冬。她替赵腊月止血，淡淡道她比想象中要笨。赵腊月答见面本是理所当然：你是连三月的弟子，我是景阳真人的弟子。果冬确认景阳连那招剑法都留给了她，是真把她当弟子，自己确该见见她。南忘携青山弟子驭剑赶至，结剑阵搜遍百余里山野无果，她怀疑是中州派老家伙出手，问赵腊月有无事，得到的回答比她的语气还生硬：「死不了。」"},{"n":161,"orig":161,"title":"最难摆脱的不是剑光，而是意外","people":["赵腊月","过冬","南忘","金明城"],"one_line":"赵腊月遇刺获救，刺客用天地遁法逃遁却被魂火袭杀","summary":"赵腊月遭黑衣人刺杀，青山弟子赶到救援。过冬说明真相：师妹莫惜冒用她的名义约出赵腊月，与人勾结设局杀她，自己察觉后赶来，水月庵会给出交待。皇宫金供奉金明城赶到问询，赵腊月直指凶手是中州派的人，举座震惊，青山与中州派或将开战。刺客以中州派天地遁法逃遁，却被人看破，一把黑刀袭来；他动用本命法宝抵挡，光线却被幽火侵蚀，惊觉遇上了多年未现的冥部强者魂火。南忘注意到过冬比金供奉更早望向异动处，暗生疑虑。"},{"n":162,"orig":162,"title":"那人在崖边钓鸟","people":["魏成子","南忘","金供奉","年轻人","老者"],"one_line":"神秘年轻人借冥界分影诛杀魏成子，老者吞食魂火","summary":"刺客魏成子被黑雾扑倒杀死，青色巨手碾碎黑雾，将魂火尽数吞入一张生着细牙的嘴里——吞噬者是个矮小老者。他飞到崖边见一个钓鱼的年轻人，称冥师三弟子的分影能隔空杀死中州派元婴长老水准不错，又愿再做三百年狗，只求年轻人灭掉青山、绝其后患，并护他不被那两个逆徒杀死。另一边南忘与金供奉查验尸体，掀开面布确认死者是中州派元婴长老魏成子，金粉重现魂火痕迹，判断杀他的冥界妖人极强，且只来了一道分影，青山众人心情压抑诡异。"},{"n":163,"orig":163,"title":"一片血光里开始查案","people":["井九","南忘","施丰臣","鹿国公","赵腊月"],"one_line":"弗思剑报信井九知遇刺，朝廷查案南忘怒斥中州派","summary":"朝廷封锁鸣翠谷，数万军民搜寻线索，被边缘化的清天司官员施丰臣被推到最前主持查案。赵腊月危急时切断与弗思剑的联系，弗思剑回朝歌报信，井九由此得知消息，自忖赶去也来不及，只静等结果。鹿国公禀报赵腊月已送回赵府、金供奉亲自看守。井九夜探赵府，见到金供奉，明白这是皇帝表态，朝廷已开始怀疑某些人。西山居议事，清天司指挥使以天纹镜确认魏成子死于高阶冥火，南忘怒斥：清天司与神卫军尽是中州派弟子，交他们查案等于交给中州派自己。"},{"n":164,"orig":164,"title":"中州派与水月庵的处置","people":["南忘","洛淮南","井九","莫惜","和国公"],"one_line":"中州派掌门夫人南下善后，莫惜被废作交待","summary":"和国公劝南忘勿因一事开战，南忘反问有何不可。众人判断暗杀并非中州派集体意志，疑点在于不老林为何与冥部勾结、灭口痕迹为何不除净。洛淮南表态中州派全力承担，其师母即掌门道侣已南下上天光峰，将与青山掌门和元骑鲸商议善后。南忘说这还不够，还有井九——他是个很记仇的人。随后消息传来：井九离开赵府时，水月庵弟子莫惜被人打折四肢扔在他脚下，这是水月庵的交待，众人猜是过冬手笔。井九只吩咐原样送回，莫惜问他不想知道原因吗，他答不想，转身离去，莫惜痛哭。"},{"n":165,"orig":165,"title":"请你看看我","people":["井九","白早"],"one_line":"白早夜访井九邀其加入天才组织，遭拒后表白","summary":"中州派掌门独女白早夜访井九，请青山暂且沉默、勿急动不老林，称不老林的手伸得极深、可能与冥部有牵连，追查须慎重。她坦承自己与洛淮南、童颜、向晚书及西海剑派桐庐等各宗年轻天才结成一个组织，青山方面有过南山、简如云、顾寒等人，主张面对雪国威胁人族须团结主动，不能只顾避世修道，是扩大版的两忘峰，并邀井九加入。井九以不喜欢两忘峰为由拒绝，只承诺暂不动不老林。白早又问他与赵腊月是否道侣，得知不是后转了一圈，认真问道：那你看看我怎么样？"},{"n":166,"orig":166,"title":"最直接的问题","people":["井九","白早","施丰臣"],"one_line":"井九拒绝白早表白，次日直闯施丰臣家问主使","summary":"井九认真想了想，答不会考虑这些事情，白早却说这说明在他看来自己还算不错。她连番表白：喜欢他的棋、他的剑道天赋，最喜欢他无所谓的模样；又解释洛淮南与童颜只是父母属意的人选，自己并不喜欢。井九直接说这件事情不可能。白早离去，井九望着夜空，从她眼中读到无数岁月里见过的幽幽眼神，决定照旧避开。次日清晨，他在各方监视下悄然离开井府，径直走进一处寻常小院，对伏案而睡的施丰臣问：谁让你做的？施丰臣如遭冰水，瞬间清醒。"},{"n":167,"orig":167,"title":"整个人间只剩太平","people":["井九","施丰臣"],"one_line":"施丰臣自认主谋，惧赵腊月成第二个太平真人后自尽","summary":"施丰臣坦然承认自己是主谋，刺客是他请的不老林，没想到竟是中州派长老魏成子。井九直接说出景辛之名，施丰臣袖袖颤抖，却仗着无证据、溯流珠无声不能采信而不惧，井九答我做事不需要证据。施丰臣道出杀机：赵腊月对世间充满热情又好杀，他怕她成为第二个太平真人——当年人间只剩太平，寂静无声，无比可怕。他斥修道者行善虚伪，井九反问他可曾为那商州姑娘做过什么，施丰臣承认也许自己只是太怕她。井九追问其起念前后有无异常，施丰臣只盼世界改变，随即震断经脉、嚼碎毒药自尽。井九沉默离去。"},{"n":168,"orig":168,"title":"踏上修行路的王小明","people":["王小明","井九","赵腊月","胡贵妃"],"one_line":"王小明葬师离城，井九对赵腊月剖白杀心之危","summary":"施丰臣养子王小明提着白菜苔回家，发现师父自尽，痛哭不止。丧事冷清，官员们吊唁毫无哀容，矛头都指向青山宗井九；唯有被疑为主谋的胡贵妃夜里送来一笔厚金。施丰臣下葬后王小明离开朝歌城，说要回西北老家。井九告诉赵腊月施丰臣养子失踪，又指她杀心太重；赵腊月想不明白施丰臣为何非要杀自己。井九解释：能力越大危险越大，她心性不受约束又眷怜苍生，故被视为最危险者，须趁其未强大时除掉；不理世事的修道者对凡人反而更安全。末尾王小明在城外山庙取出师父遗物三清派入门功法清玄功，泪眼模糊读不进去。"},{"n":169,"orig":169,"title":"我怜世人忧患多","people":["玄阴宗三祖师","年轻人","井九","赵腊月"],"one_line":"井九论牧羊之喻，年轻人令三祖师传功王小明","summary":"井九向赵腊月剖陈修行者与凡人的关系：宗派靠凡人供养却所做甚少，如牧民养羊；但羊不会嫉妒牧民，凡人会嫉妒曾经的同伴变成修行者。有修行者认为大陆格局太稳、人族提升太慢，主张撕下面具奴役凡人、海量筛选有潜质者并催发其成长，如同真正养羊。西槐山崖边，年轻人垂线入瀑布钓异鱼，玄阴宗三祖师蹲在旁边如狗。年轻人决定让山下瘸腿少年王小明改投玄阴宗、将来做宗主；三祖师恼怒，坦言想杀他夺回自由，却因对方神魂关联某物、赌不起生死而不敢动手。年轻人摸着他的头满怀怜悯——怜悯的不是他，或许是自己。"},{"n":170,"orig":170,"title":"我们都在井底","people":["井九","赵腊月","年轻人","玄阴宗三祖师"],"one_line":"井底之叹与人间诸景：海女惨死、求医无门","summary":"年轻人与玄阴宗三祖师论生死：老者越能活越怕死，说景阳真人若还活着便是世间最怕死的人；年轻人不惧终结，只因在井底活着太无趣，不想像碧湖峰的小白那样老气横秋。井九对赵腊月说，凡人怒火不足惧，除非天地大变——灵脉尽无或雪国南下；当年雪国怪物南下，北方宗派近乎灭门，流民得财富灵器为祸人间，才有烽火连三月。他串起数幅人间图景：海州飞鲸掀翻渔船，两名海女葬身海中；输光的中年汉子朝天空剑光咒骂摔不死你；小镇青年拖着重病父亲跪求青山仙师救治，却被告知仙师半年不曾出巡，只能绝望离去。"},{"n":171,"orig":171,"title":"想想人间","people":["井九","赵腊月","胡贵妃"],"one_line":"井九自陈怕死转趋谨慎，被赵腊月说动赴道战","summary":"井九点破最无解的问题是凡人嫉妒修行者长寿——凭什么你们能活几百岁。赵腊月脱口：所以景阳师叔祖才会出事，对吧？井九没有回答，只说自人间来总会想想人间，但想想就够了，无人能想出解决办法，决定先回山。他自述行事转趋谨慎的原因：假洞府开启时被昔来峰主方景天动了杀念，旧梅园天近人也出过手，他惊觉如今很多人都能杀死自己，故本不想冒险参加道战。赵腊月劝道：你总觉得那人就是想让你去道战看些什么，若信便去看看何妨。井九摸摸她的头称有道理。另一边胡贵妃处境艰难、皇帝数日不见，想求见井九，嬷嬷说他当然是去参加道战了。"},{"n":172,"orig":172,"title":"踏血寻梅","people":["洛淮南","桐庐","禅子","井九","曹园"],"one_line":"道战踏血寻梅开赛，井九画上空白遭讥议","summary":"净觉寺收到刀圣曹园亲笔信，问井九到底是不是蹈红尘的传人，禅子看完不置可否，只说其故人一生谨慎、井九承其遗风，不会有事。梅会道战在墨海之北的万松雪山举行。朝歌西山居雨廊上以金粉绘着数十幅梅画，参赛者每杀一只雪国怪物便添一朵血梅，按怪物实力分大小，小组先画完者优胜，这就是传说中的踏血寻梅。洛淮南表现强势，一幅画上五根寒枝多数梅花发于他的枝头；西海剑派桐庐梅数不逊于他；反观青山宗，因两忘峰弟子缺席、赵腊月退出，井九所在小队的那幅画依旧空白，遭众人讥议。"},{"n":173,"orig":173,"title":"来看看你们","people":["井九","代寅","殷清陌","卢今","伍鸣钟"],"one_line":"井九小队困守孤山起争执，出发拾得诡异卵胎","summary":"井九的道战小队有玄天宗卢今、无恩门伍鸣钟、昆仑派代寅与摘星楼殷清陌。他在孤山上枯坐十数日毫无动作，代寅忍无可忍，扬言明早再不走就丢下他。井九只说感觉不对、建议再留数日；代寅质问若不愿接受呢，他当即改口那明天就离开，代寅懊悔不迭。井九来道战另有原因：鸣翠谷暗杀、不老林与冥界阴影里有他熟悉的阴谋味道，那个人既想杀赵腊月向他证明道路，也想让他亲眼看看这片冰冷残酷的雪原。启程后殷清陌惊呼避开一颗雪虫卵胎，代寅说那是无害的低阶物，井九拾起时却感觉到一道轻微吸力，觉得有趣。"},{"n":174,"orig":174,"title":"你来就你来","people":["井九","代寅","桐庐","殷清陌","伍鸣钟"],"one_line":"代寅斩六足雪足兽又追听耳，突遭惨叫坠落","summary":"井九以剑识确认卵胎里的初生雪国妖兽因恐惧装死，将它收起。数百里外，桐庐小队紧追洛淮南的战绩，得知井九多日无战绩、连雪原都不敢进，众人讥其怯懦，桐庐却因棋战一役不敢小觑他。井九小队遭遇最低阶的六足雪足兽，代寅抢先出手，青索一击裂其甲壳，伍鸣钟剑盾、殷清陌星壶挡下喷射毒液，众人初识雪原凶险。不料兽壳里跃出一只会驱使雪足兽的中阶智物听耳，代寅兴奋追杀，井九察觉不对伸手想拦，被当成抢功推开。代寅踏空追上猎物挥索斩落，忽然惨叫着从空中栽下。"},{"n":175,"orig":175,"title":"交代","people":["井九","禅子","何渭","代寅","白早"],"one_line":"代寅惨死井九队中，昆仑掌门索要交代","summary":"代寅惨死雪原，脸上被锐物割裂，昆仑法宝青索断成数十截，那小兽顺着地底黑洞遁走，连井九的剑识都未能缀上。井九看着尸体，再次确认了那人要自己来雪原的原因——这里的生死最多。朝歌西山居，众大人物赏画，禅子评白早的梅图匀称而有骨最美，暗指她能发挥同伴实力、更具领袖之姿；对井九的空白画则叹都说我这位故人之后很懒，现在看来是真的懒啊。随后画师在井九画上添了一朵小梅，又严肃地在其名上画了道黑线——道战开始死人，且偏偏死在井九队里。昆仑掌门何渭脸色寒冷，必须青山宗给个交代。"},{"n":176,"orig":176,"title":"寒意十足的信号","people":["南忘","禅子","井九","释海"],"one_line":"释海断定凶手是铁线虫，禅子迟疑后不叫停道战","summary":"南忘对清容峰弟子发脾气，对何渭索要交代一事冷笑：死就是输活就是胜，这就是道战，他要什么交代？但她心里也拿不准井九与代寅之死有无干系。净觉寺中，熟悉雪国怪物的释海老僧断定凶手不是听耳而是铁线虫——甲壳坚固连青山之剑都未必斩得开，且已多年未现，为何初夏突然苏醒？莫非又将有大兽潮？连深不可测的禅子都罕见地犹豫，最终决定不提前结束道战，只让渡海师侄北上查看，写信通知该知道的几家做好准备，等曹园的信。寒号鸟监视雪原，只见井九一行突然向深处行进，径直赶路不看猎物，天暗时停下脚步。"},{"n":177,"orig":177,"title":"只要井九有感觉","people":["井九","白早","殷清陌","幺松杉"],"one_line":"井九自省感觉不祥，剖开卵胎唤醒小甲虫","summary":"夜里扎营，殷清陌三人布下星壶、剑盾加真火的防御阵型。井九独坐思考：感觉是最靠不住的说法，只有算不清局面时才会说感觉，所
