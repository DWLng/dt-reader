以他只要有感觉，那就是感觉不好，而不好的事总会发生。他留在孤山上另有缘由——确认其余九名青山弟子的位置与走向，一朝有事能以最快速度把他们带回去。他认定那不该出现的铁线虫与自己有关：千年来最大的天地动静正是他引发的，连故友凝望的那片海的漩涡都变了走向。他划开卵胎薄膜，对小甲虫说活过来，死物竟真苏醒；他细看其躯壳关节，皆是族类最薄弱处，小甲虫恐惧颤抖。白早小队则发现有个队伍正朝他们而来，正是井九。"},{"n":178,"orig":178,"title":"晨光与暮色之间的你在哪里？","people":["白早","井九","幺松杉","殷清陌","伍鸣钟"],"one_line":"白早小队雪原夜遇雪足兽群与诡异寒雾围困","summary":"白早以推算与亲和力统御队伍，无超级战力却成绩优秀，但她自知不像外表那般自信。两个小队将在北方黑色山影前相遇，同伴只推说不知白早为何总问井九的位置。井九一行昼行夜息，忽然感应到东北十一里有道战同伴被围攻，本想让三人留下，他们坚持同去，四人踏上伍鸣钟的剑盾赶援。另一边白早小队遭高阶雪足兽夜袭，三足兽趁布阵间隙偷袭，白早击杀之却受了伤，两名同伴负伤，悬铃宗女弟子真元将尽。接着一道极寒浓雾从峡谷涌出，凝滞神识，火堆明珠尽灭，摩擦声逼近，白早握住腰间两块冰凉事物，终又松开。"},{"n":179,"orig":179,"title":"寒雾外响起的声音","people":["井九","白早","幺松杉"],"one_line":"井九雾夜驰援连斩兽群，白早言我相信他","summary":"危局中夜色里响起一道平静无波却令人信服的声音：收铃、竖盾、星壶、点火、断寒枝。井九赶到，指挥三人重燃火堆、布起星光屏障，又指出幺松杉出身雪流剑法，寒雾中剑威反增，青剑连杀雪足兽。随后整夜只闻雾外铁剑破空、金石碎裂与雪足兽惨叫，声音渐密又渐远。幺松杉担心欲出，白早说他没有说；再劝仍答我相信他。众人熬过一夜，寒雾终于消散，井九从雾中走出，晨光落脸，白早望着他心想真好看。"},{"n":180,"orig":180,"title":"远方的无数血梅","people":["井九","白早","何霑","幺松杉"],"one_line":"井九自承先动太子致腊月遇刺，画师落笔无数血梅","summary":"晨光中十余只雪足兽横尸当场，更远处尸体每隔数十丈便有一两只，延绵数百丈，一夜之间井九在寒雾中猎杀了海量怪物。井九与白早对话：白早提醒他答应过不动不老林，井九答动的不是不老林；白早指其无证据不该动施丰臣，井九说已知施丰臣与景辛府上有联系；白早追问难道没证据还要动太子，井九道出真相：是我先动了他，才有后来这些事——赵腊月遇刺实因他起。白早又判断昨夜雪足兽是数百年前兽潮遗留地底之物，不似进攻倒像要退回雪国，雪国深处必有大变。朝歌雨廊下画师对井九的画无从落笔，何霑接笔泼洒朱砂如雨，一道墨线梅枝伸向远方——那是远方的无数血梅。"},{"n":181,"orig":181,"title":"又是井九","people":["井九","何霑","白早","洛淮南"],"one_line":"井九一夜七十七梅锁定道战第一，又令队伍止步","summary":"何霑代笔补画，寒号鸟亲数井九一夜猎杀七十七只雪国怪物，而他小队自己只报了二十，道战第一毫无悬念。有人拿当年刀圣一朵大梅的旧事质疑完美与否，何霑冷语：童颜棋道都赢不了井九，洛淮南凭什么赢。道战继续，各队接连遭遇本不该在夏天苏醒的雪兽与奇寒浓雾，伤亡渐重；白早把地底怪物苏醒的判断传回朝歌，师长们只提醒小心寒雾，不肯终止道战。此时井九的小队却整整两天停在峡谷入口不进，据前方消息这又是井九的意思，令修行界师长们头痛不已。"},{"n":182,"orig":182,"title":"师叔来了","people":["井九","白早","雷一惊","幺松杉"],"one_line":"井九一路收拢各队弟子，峡谷外又遇小队相认","summary":"峡谷里两小队合流，白早指挥八人斩杀十余只企图穿峡的雪足兽，井九只偶尔点拨。白早猜他得过刀圣指点才如此了解雪国怪物，井九否认，只说自己擅长切断事物；又坦承那夜大杀四方并非倚仗境界，他是无彰初境，只是寒雾能遮掩身形、雪足兽的攻击对他太慢。众人问他为何停下，他只说等人。次日清晨，疲惫的四名年轻修道者抵达，内有青山两忘峰弟子雷一惊；井九让他们休息半个时辰后一道出发，众人愕然不解。傍晚井九带众人循某条山道而行，崖下果然有另一小队正在布阵，认出他来惊呼井师叔。"},{"n":183,"orig":183,"title":"道战第一想做啥？","people":["井九","白早","南忘","昆仑掌门","顾清"],"one_line":"井九锁定道战第一，聚拢三十余人不肯分散引猜疑","summary":"井九的梅图添上同伴斩获，正式锁定道战第一。消息传开：神末峰顾清与元姓少年置酒相庆，太常寺井商醉饮与有荣焉，鹿国公感慨明珠难掩；梅图先送净觉寺请禅子点评却迟迟没有消息，随后被送进皇宫，皇帝指名要看。西山居最高处，大人物们借大泽千里图查看：井九一路停下等待、不断与别的小队相遇合流，已聚拢三十余人却始终不分开，全是他的意思。昆仑掌门讥其骄傲想做新一代领袖，南忘罕见为他说话，中州派长老指出白早也支持他。各派师长无人猜透，井九究竟想做什么。"},{"n":184,"orig":184,"title":"你以为你是谁？","people":["井九","白早","昆仑掌门","雷一惊","禅子"],"one_line":"井九要求终止道战遭各方斥责，被指疯了","summary":"井九借行程推算，等来两支各有青山弟子的小队，峡谷里聚齐十支小队四十五人。他随即请白早传话西山居：要求立刻停止道战、召回所有弟子，理由只有一个——感觉不好。西山居一片哗然，昆仑掌门怒斥其疯癫，要求取消参赛资格；掌门长老们齐聚净觉寺，禅子只问井九既未限制他人行动也未出手，凭何治罪，和国公便当作年轻人胡闹搁下。峡谷里众人视井九如疯子，他只对青山弟子下令留下、随时准备离开。昆仑弟子怒极喝问：你以为你是谁？你以为你是禅子还是青山掌门，是不是疯了。"},{"n":185,"orig":185,"title":"不恕","people":["井九","雷一惊","白早","幺松杉"],"one_line":"雷一惊抗命被井九一剑击败，白早祭出南屏钟","summary":"面对羞辱，九名青山弟子剑意森然；白早告知井九西山居已否决其请求。井九本意只是把十小队里的青山弟子带回去，别的不问。雷一惊不忿，以修行者死于北方乃万年归途为由拒绝遵命，井九举剑便斩，数合将其击败撞上崖壁，宣称没有什么恕不能遵命，因为我不恕。其余青山弟子慑于辈份不敢再违。西海剑派弟子嘲讽怕死的师叔教训知耻的师侄，井九抬眼望他，白早自知来不及阻止，果断祭出中州派名宝流光钟——元婴以下至强的一对法宝，众人这才惊觉南屏钟竟在她手中，钟鸣轰向西海剑派弟子。"},{"n":186,"orig":186,"title":"都走","people":["井九","白早","雷一惊","幺松杉"],"one_line":"白早救下西海弟子，青山剑舟降临接走众人","summary":"南屏钟轰向西海剑派弟子，其飞剑被震入崖壁，人被震飞吐血——众人随即发现他原位悬着井九的黑剑，白早实为救他一命，井九也在她一句给我个面子后收剑。井九以事后会被长辈说见死不救为由，令在场悬铃宗与大泽弟子随行，水月庵少女拒绝，其余人陆续离去。被留下者等来等去，雷一惊哀求无效，只换来井九一句等着。忽然峡谷上空阴云蔽日，青山弟子飞剑结阵，薄云骤破，一艘山岳般的巨舟缓缓降落——青山重宝剑舟出现了。"},{"n":187,"orig":187,"title":"白城里的庙","people":["井九","白早","过冬","禅子","昆仑掌门"],"one_line":"剑舟接走弟子井九独留破局，过冬抵白城见佛","summary":"剑舟现身意味着青山宗支持井九。西山居震动，昆仑掌门质问，青山剑书回复：不确定有无问题，但井九已拿道战第一，建议各派接回弟子，出了事别怪青山没示警；禅子彻夜推演也算不清，只让各派先做准备。剑舟接走三十人，众师长却惊觉井九自己没有回来。井九向白早解释要过去看看：这是师兄设的局，他要正面破局；白早留下来不走，称随时能离开。场景转到人族最北的白城：红岩山上一座小庙，供着十余丈高的金佛与一柄三丈铁刀，门联写着救苦救难救世人，求佛求道求自己。水月庵过冬走进庙里，佛中传来声音：原来是你来了。"},{"n":188,"orig":188,"title":"我来人间看看太阳","people":["过冬","刀圣","井九","白早"],"one_line":"过冬庙中自揭来历，雪国深处异变全面爆发","summary":"白城庙中，过冬与金佛里的人相认，那人自称在她身后看了很多年。过冬坦露身份不凡：她为追上某个人付出巨大牺牲走上这条道路，自称已证明了自己的失败，如今时间不多，来人间看看太阳。她借宿一夜，清晨感到雪原深处有事将发；庙中人说冰雪女王从未有过这样的状态，从她的意识里感觉到了暴躁、愤怒、痛苦，还有紧张。同一时刻，井九在峰顶道心微动，说出事了。狂风骤起，绝壁间钻出一只房屋粗细的高阶雪虫，对白早视而不见，横越峡谷钻入对面崖壁；随后无数雪国怪物受感召般向北狂奔。"},{"n":189,"orig":189,"title":"看了一眼，万里之远","people":["井九","白早","洛淮南"],"one_line":"极寒浓雾吞没雪原，各派宝物接人，洛淮南求援","summary":"白早判断是雪国召唤地底深眠的怪物回撤，但雪国只有一位女王，何以如此？远方天地亮起，井九道是雾——铺天盖地的极寒浓雾涌来，地底洞口也冒出雾气，道战弟子已来不及撤退。井九载白早乘铁剑深入雾中，途中听见前日拒绝撤走的参赛者在雾里惨叫而死，雪地上躺着包括那两名西海剑派弟子在内的尸体。所幸各派镇派宝物尽数赶到：昆仑青莲舟、中州云船、禅子莲驾、大泽水天一线与青山剑舟，争抢寒雾散尽前接人。白早腕上竹牌突然亮起，是同门求援；她决意不走，说自己带着万里玺，随时可以离开。"},{"n":190,"orig":190,"title":"消失的高大身影","people":["白早","洛淮南","桐庐","井九","渡海僧"],"one_line":"雾中死亡逾四十三人，洛淮南被雪虫吞没失踪","summary":"白早坦承身上有两件万里玺——父亲为洛淮南备了一件，母亲也给了她一件；得知师兄求援，井九立刻驭剑载她深入寒雾。西山居清点，仅一个早晨已有四十三名参赛者死亡；怪雾隔绝神识、法舟难以深入，渡海僧、风刀教主与镇北神军指挥使冒险进雾救人。渡海僧救出桐庐，桐庐疯了一般要回去：洛淮南为救他才遭雪虫袭击，最后那高大的身影消失在黑洞般的虫嘴里，不知生死。风刀教主一掌打昏桐庐，众人因雾中连寒号鸟都承受不住的寒意被迫撤离。渡海僧满心疑惑：最先察觉危险的井九，为何反而往雾里去，如今生死不知。"},{"n":191,"orig":191,"title":"前世此生未遇之对手","people":["井九","白早"],"one_line":"井九剑意泄底遭万里威压锁定，坠入风雪漩涡","summary":"井九以六龙剑法指诀凝成剑息罩住二人，穿过死寂雪原直抵雪国真正边界——连通天境也不轻易踏足之地。洛淮南的求援信号竟北移了十三里。崖壁间无数雪虫洞口喷出寒雾，白光隐现。忽然一道强大无比的意念隔十余万里扫过，井九道心微散，生出前世都未曾遇过的威胁感，情急释出本源剑意相抗，随即意识到失策——如此反而会被对方认出并重视。果然，一道威压毫无偏差地锁定了他。井九左手剑镯卷住白早掷进石壁洞中，自己被风雪漩涡吞噬。"},{"n":192,"orig":192,"title":"雪虫腹内有只鬼","people":["白早","洛淮南"],"one_line":"白早割虫腹救醒洛淮南，反遭师兄夺玺偷袭","summary":"白早拾起弗思剑走进石洞，发现一只死去的高阶雪虫，洛淮南竟被吞在虫腹的粘稠汁液里，重伤垂危。她以弗思剑割开虫腹、灌入真元救醒洛淮南，对方却用朝元功积蓄的真元发起偷袭，将她撞飞呕血，随即以北辰钟攻击，与护主的南屏钟对轰。洛淮南坦然索夺万里玺：我是师兄，万里玺只有一个，自然让我先用，你留下等师父师娘来救。白早看着这张从小最亲近的脸，只觉陌生丑陋，终而苦笑——道战之旅好生荒唐。她明白洛淮南求援本就是算计，若不能夺玺离开，他绝不会让活着的人泄露这里的秘密。"},{"n":193,"orig":193,"title":"我不想为你做嫁衣","people":["白早","洛淮南"],"one_line":"洛淮南吐露避婚真相夺玺，井九身影现于崖壁","summary":"洛淮南自辩在虫腹中等死的过程磨光了他的勇气，发誓今后不惜一切代价活着；又道出隐情：师父师娘斗了一辈子，都想给先天不足的白早寻个双修道侣弥补亏欠，他与童颜娶她都只是做嫁衣，童颜更拿他当借口抢先避婚，他发下守雪原的宏愿也不过为了躲婚；当年说的正道大业全是陪小女孩玩的家家酒。白早回敬从未喜欢过他，喜欢的是井九。洛淮南点破她也练成了伏藏卷，逼她交出万里玺，她依言扔去。洛淮南到洞口查看井九是否真在，白早趁机凝聚真元，欲与他同归于尽，却见崖壁上一个人影正迎着风雪攀爬而上。"},{"n":194,"orig":194,"title":"令人厌倦的故事","people":["井九","白早","洛淮南"],"one_line":"洛淮南夺玺而去，白早金丹碎裂赠出第二件万里玺","summary":"洛淮南以抱歉开场，北辰钟破风雪击中井九——井九为免再惊动那位存在而不敢还手，硬受一记再度坠崖。洛淮南用万里玺独自离开。井九第三次徒手攀回，把白早塞进雪虫尸液的躯壳里保温，喂下中州宣化山的玄草丹驱寒疗伤。白早重伤中惊觉金丹已现两道裂痕，几近碎裂，二次结丹再难复原品级，修行之路堪忧。井九厌倦于洛淮南这类人心故事，自述活过两世、同样路走两遍的疲惫。白早取出第二件万里玺递给井九，说洛淮南以为她只有一件，其实父亲与母亲各给了她一件，让他用这个离开。"},{"n":195,"orig":195,"title":"与冰雪女王的谈判","people":["井九","白早","刀圣","洛淮南"],"one_line":"井九以剑意与冰雪女王谈判，刀圣刀气挡通天强者","summary":"白早解释两件万里玺本是她与井九的生路，洛淮南误听她话中有话才出手。井九推知风雪深处的存在早已超出通天境、真正藏天下，中州掌门夫妇并非无情不救，而是此时进入只会被视作威胁——这正是师兄把风雪深处那个存在也算进局里的妙处。他以剑意向远方送去谈判之意，回应他的是一道锁定自身的恐怖威压：任何被视作威胁的举动都会引发战争。白城里，中州派掌门与元骑鲸两位通天大物赶到，刀圣一道刀气横贯数百里挡住去路；庙中声音解释女王产子之际敏感易怒，谁进去都会被拼命诛杀。而洛淮南已借万里玺回到云梦山，重伤昏迷。"},{"n":196,"orig":196,"title":"谈判的结果有些微妙","people":["年轻人","玄阴宗三祖师","井九","过冬"],"one_line":"年轻人道破女王产子，井九与女王谈判定战争红线","summary":"过冬讥讽云端的通天大物们作态。居叶城火锅店里，年轻人与玄阴宗三祖师对坐鸳鸯锅，道破雪国异变真相：没什么大事，冰雪女王要生孩子了。三祖师追问年轻人是否执意要井九死、是否即便景阳已死仍然怕他，年轻人答只怕自己看不透景阳——那人无欲无求没有弱点，他想借机确认井九究竟是不是景阳。十余万里外雪峰深处，女王的意识扫过井九，视其为蝼蚁却因当年青山峰顶那道剑光而警惕愤怒，威压如雪浪南奔。谈判结果就此明确：井九任何被视作威胁的举动，都意味着战争开始。"},{"n":197,"orig":197,"title":"十年之后杀了洛淮南？","people":["井九","白早","赵腊月","洛淮南"],"one_line":"井九留守陪白早苦修，留话十年不出去就杀洛淮南","summary":"井九试探让弗思剑独自离开，即遭无形雷霆喝止，确认对方盯死的是他这个人。他对白早言明：短时间无法离开，要等到她重结金丹或女王生完孩子，并道破一切异变的根源是冰雪女王产子，血气化作寒雾召回子民。白早震骇之余问他僧人能否还俗成亲，井九以灌顶之术传她丹珠古经，教她入定三年疗伤重结金丹；自己则借剑火彻夜修行，断言赵腊月十年内会超过洛淮南。他要传讯赵腊月：若十年后仍未出去，就把洛淮南杀了——因为除非活着亲口讲出这个故事，没有人会相信。与此同时，赵腊月乘剑舟离开朝歌，前往白城。"},{"n":198,"orig":198,"title":"请讲出你的故事，信就算我输","people":["赵腊月","顾清","洛淮南","南忘"],"one_line":"洛淮南编造英雄故事，赵腊月顾清皆不信","summary":"赵腊月乘剑舟抵达白城，南忘破例相迎。九名青山弟子面见时羞愧难当——若非井九强令撤走，他们多半已死在寒雾里。元骑鲸严禁青山弟子踏入雪原，赵腊月无计，先去见剑律；顾清则前往中州派探听，受到前所未有的礼遇，听完洛淮南的版本：他为救桐庐重伤，记得血剑破虫、白早渡真元、井九浴血奋战，最后白早用万里玺送他回云梦山，随即一场雪崩，落下的全是雪虫。顾静听完告辞，向赵腊月复述后道出判断：故事没有细节便没有漏洞，但那不是井九——是洛淮南想成为的人。赵腊月附和：是啊，他这么懒，这么怕死。"},{"n":199,"orig":199,"title":"且放梨花满","people":["赵腊月","过冬","刀圣"],"one_line":"赵腊月求刀圣无果独守白城，梨花开尽剪辫离去","summary":"赵腊月到白城小庙求助，过冬道出真相：冰雪女王在生孩子，寒雾全是她的血气；此刻并非最虚弱之时，纵然集齐强者也需九成人陪葬，谁肯放弃长生去拼？过冬自述多年前也曾联络各派最强者共谋此事，无人回应，景阳的回答最绝，绝到那天之后她再没见过他。刀圣自庙中开口：女王此刻敏感易怒，强行入内只会逼她发疯，人族至少一半陪葬；不动则北地可有数十年太平，等她生养之后再战——打是打不过的，这辈子都打不过，但还是要打。各派法舟陆续离去，赵腊月独留白城守候，从冬到夏，满城梨花开尽，井九未归。她割断留长的黑辫，转身离去。本卷终。"},{"n":200,"orig":200,"title":"三年","people":["赵腊月","洛淮南","顾清","童颜","过南山"],"one_line":"三年后洛淮南声望无双，赵腊月断言该杀了","summary":"三年后青山小年承剑大会，中州派数百年来首次派人观礼，来者是以棋入道的童颜。井九已成一个传说：雪国巨变前夜他救下众多同道，自己消失在寒雾里。洛淮南因祸得福，据传在雪原得奇遇、金丹不灭而明，境界一日千里，声望无人能及，且常行走世间斩妖除魔，称性命是井九与师妹给的，理应回馈天地。赵腊月三年未下神末峰，苦修至可见游野境；顾清回报洛淮南在外的第七种情绪一次比一次淡，刻意得像怕人忘记此事。二人始终不信三年前那个故事。赵腊月望向北方说：三年了，该杀了。"},{"n":201,"orig":201,"title":"童颜拜山","people":["赵腊月","顾清","童颜","过南山","马华"],"one_line":"赵腊月决意杀洛淮南，童颜上青山定计助局","summary":"赵腊月与顾清在神末峰密议：洛淮南不除，道心蒙垢便无法破境，仙家报仇百年不晚她等不起。童颜到访青山，与过南山、顾寒、马华会于两忘峰，谈及两派交好、雪国将安分百年、冥部无动静，重点在于身在不老林的那人四年才走到海边；童颜一句「刺客的名声在于目标」点醒马华，众人定下助他成名之计。过南山决定瞒着童颜，直接征询洛淮南意见再通知那孩子。童颜随后以祭拜井九为名上神末峰，见赵腊月不出一言。十余日后，赵腊月与顾清下山，声称破境游野需寻一种极珍贵药材，全派震动。"},{"n":202,"orig":202,"title":"暮色再至宝树居","people":["赵腊月","顾清","宝树居东家"],"one_line":"宝树居全力寻三清草，赵腊月手中其实已有","summary":"赵腊月破境游野需三清草辅助，与顾清驭剑南下到宝树居。宝树居数年前靠供奉神末峰保住基业，东家得信后如临大敌，招集全楼供奉查一幅三叶草画像。老供奉翻遍古书，在《酉阳杂考》里查到数百年前大泽畔曾现一株青色仙草，青色直入眼底，被果成寺判为仙级灵草，命名三清草，随后被青山宗封存无人再提。众供奉推断赵腊月如当年景阳真人修九死剑诀，破境入游野正需此草。东家下令全楼停业、全力寻草，查到线索山里自会去要。而顶楼匣中，赵腊月其实早已有一株真正的三清草。"},{"n":203,"orig":203,"title":"春雨再至朝歌城","people":["赵腊月","顾清","鹿国公","宝树居东家","鹿国公世子"],"one_line":"三清草钓局铺开，赵腊月借鹿国公安排进宫","summary":"赵腊月把三清草交给宝树居，要求让它在指定之处出现，实则布下钓杀洛淮南的局；顾清则向东家讨教如何在不示警的情况下破除宝树居阵法。二人北上朝歌城，宿于赵园湖上，忆起三年前井九正是从此处去骊山，才有道战一去不回。夜里经鹿国公安排入宫。鹿国公世子由赵腊月现身推知国公府世代侍奉的神末峰便是景阳真人，狂喜。鹿国公则透露：神皇早知她离山可能来朝歌城，昨日已在御书房让他安排她进宫。"},{"n":204,"orig":204,"title":"夜宫再见胡贵妃","people":["赵腊月","胡贵妃","顾清","鹿国公"],"one_line":"赵腊月夜见胡贵妃，以禅子之名换洛淮南行踪","summary":"赵腊月与顾清深夜入宫见胡贵妃。她怀胎三年未生，赵腊月点破：孩子一日不生，狐妖身份随时可能坐实，陛下宠她只是无证据才无人敢言。解法是请禅子开口说她怀的是灵胎——禅子虽与她因果已尽，却欠神末峰人情。胡贵妃明白青山所求必大。顾清以庶子出身劝她：陛下要你生就是要你争，不争何必生。她应下，交换条件是提供洛淮南的行踪，且须不在云梦山、也非突发情况。她疑心自己被当成暗杀赵腊月的幕后黑手，赵腊月讥其送金银给施丰臣义子的做法太白痴，并未怀疑她。"},{"n":205,"orig":205,"title":"借剑杀人","people":["洛淮南","赵腊月","金明城","顾清","刘师叔"],"one_line":"神皇借出初子剑，洛淮南设局诛玄阴宗长老","summary":"神皇借皇家供奉金明城之手，把藏在宫中几百年的初子剑交给赵腊月——天下共主有诸多不便亲手做之事。顾清警惕，赵腊月则确认井九当年正是去骊山见过神皇。盛夏，中州派外围小派北溪门携地阶法宝赴桂云城珍器阁拍卖，而珍器阁最重要的拍品正是那株三清草。途中玄阴宗突然出手强抢，长老阴幡险些收走一名普通弟子，青铜小钟骤出——中州派首徒洛淮南竟扮作北溪门弟子藏在队中。他重伤追杀，诛灭玄阴宗长老，叹只可惜少主苏子叶未亲自出手，随后随北溪门入桂云城养伤。"},{"n":206,"orig":206,"title":"洛淮南的局","people":["洛淮南","柳十岁"],"one_line":"洛淮南自导遇险之局，与不老林刺客排练刺杀","summary":"洛淮南表面除恶务尽，实则这一战是他刻意做局：不老林悬赏他的命半真半假，他必须以遇险受伤为因离开云梦山，才能让刺客找到行刺机会，又不能是突发情况。夜里他独处自责：师父私下把万里玺交给师妹，师妹收讯后历尽千辛万苦找到他，他却做出无耻之事，悔恨难当。随后一名浑身湿透的黑衣人从井中现身，两人初次见面便排练刺杀戏码：刺客该藏进衣柜、第一剑用剑而不可用妖丹之力、他将重伤败退，细节一一商定。黑衣人问他为何肯做这种事，洛淮南答：总有人要牺牲，而且我又不会真的死。"},{"n":207,"orig":207,"title":"谁是局中人","people":["柳十岁","洛淮南","赵腊月","顾清"],"one_line":"假戏成真，柳十岁暴起魔火重伤洛淮南","summary":"行刺之夜，珍器阁拍卖会开场，三清草压轴且早已内定买家，顾清独自守在顶楼密室；赵腊月黑衣笠帽藏身民居，持初子剑待命。小院里好戏开场：剑光割开衣柜斩落桌角，洛淮南以北辰钟反击，柳十岁以魔火相抗、以血魔功遁法紧跟，两人按剧本逼真对演。然而毒手落下时柳十岁没有收手，魔火骤强数倍、血魔功竟已五重，杀意滔滔灌入洛淮南经脉，伤势无法挽回。洛淮南喷出蕴着玄功的血箭击碎黑布，露出那张干净的脸——正是柳十岁。"},{"n":208,"orig":208,"title":"洛淮南之死","people":["赵腊月","柳十岁","洛淮南","顾清","童颜"],"one_line":"赵柳联手斩杀洛淮南，其元婴落入童颜之手","summary":"柳十岁与洛淮南真刀真枪相搏，境界悬殊，柳十岁飞剑被毁、喷血而退；洛淮南重创欲遁，一道清冷剑光贯穿其身——赵腊月踏空而至，以无形剑体骤现身前，硬受重压被攥住脖颈，柳十岁的魔火重拳随之轰碎洛淮南金丹，赵腊月剑锋拂过，头颈分家。二人携初子剑消失在夜色里。珍器阁顶楼，顾清解除阵法放赵腊月入内，将血衣黑衣焚成灰，三清草将种于灰中掩藏痕迹。而洛淮南的元婴自尸身飘出，逃回云梦山绝壁洞府，正欲钻入蕴养元婴的小绿瓶，忽被棋盘状光网缚住，童颜自洞府深处走出。"},{"n":209,"orig":209,"title":"人死如烟生","people":["童颜","洛淮南"],"one_line":"童颜逼死洛淮南元婴，元婴临终道出生死执念","summary":"童颜逼问洛淮南的元婴：养成元婴瞒着所有人，只因你为万里玺杀了师妹。元婴否认，童颜承认杀局是自己设的——三年闭关想通此事，只在两忘峰说了几句话，马华自会献计；柳十岁与赵腊月都不信你的故事，所以会真的动手。元婴求活，自称一生只做过一件坏事。童颜点破他甘愿被重伤、勇敢无畏的缘由：渴望痛苦与被伤害来抵销罪孽、安抚道心。洛淮南终于想明白：在雪虫腹中半日如半生，对自我终结的恐惧挥之不去，修道者本该贪生怕死，他只错在无知无畏地直面生死考验。他求来世再见，童颜答「还是算了」，棋盘光网陷落，元婴化作一道青烟。"},{"n":210,"orig":210,"title":"谁来回答这个问题？","people":["任千竹","赵腊月","顾清","张遗爱","水月庵太上长老"],"one_line":"任千竹逼问赵腊月，青山弟子剑啸驰援桂华城","summary":"洛淮南死讯震动天下，清天司封锁桂华城查案，中州派化神巅峰长老任千竹悲怒交加。清天司指挥使张遗爱赶来主持，水月庵太上长老乘青帘小轿亲临查勘：现场有妖火与血魔功，是邪派余孽所为，却留下两道剑意——一道很淡但是青山的，另一道陌生又似曾相识。任千竹随即闯到珍器阁楼下厉喝赵腊月现身，质问她昨夜子初在哪、那道青山剑意如何解释，扬言化神巅峰要她受死一途。顾清针锋相对：要问也该先问洛淮南为何刚好出现在这座城里。任千竹威压全场欲动手，回应中州派的却是十余道剑啸——青山宗弟子到了。"},{"n":211,"orig":211,"title":"真凶是谁？","people":["过南山","童颜","任千竹","迟宴","马华","顾寒"],"one_line":"两派定性柳十岁杀洛淮南，童颜捏碎小绿瓶","summary":"迟宴率青山弟子赶到与中州派对峙，张遗爱解释赵腊月是为三清草而来，幺松杉、雷一惊怒斥血口喷人。过南山称或许知道凶手是谁却难以相信——柳十岁。童颜到场坐实，并问出现场有血魔功痕迹，众人忆起这名青山弃徒当年偷服妖丹、偷练邪功被废逐出门。血魔功与青山剑意两证俱全，任千竹无话可说。和国公追问同行凶手用剑，水月庵传书认出那是初子剑，任千竹等人色变却不再深究。废墟前，过南山、顾寒、马华惶惑不安：明明说好只是假局，洛淮南怎会真死。过南山决定自请处分。童颜捏碎一只绿色小琉璃瓶洒在废墟前——那是师兄生前最喜欢的玩意儿。"},{"n":212,"orig":212,"title":"不见天日柳十岁","people":["赵腊月","掌门","顾清","柳十岁"],"one_line":"掌门问罪赵腊月，两派通缉柳十岁不见天日","summary":"掌门召赵腊月上天光峰，她首次见到掌门腰间那道剑鞘——所谓承天剑只是个鞘。掌门问洛淮南之死，赵腊月直言：他想井九死，我就想他死；并称等了青山三年，你们不做，那我就自己做。掌门承认这个局找不到任何证据，但警告若被人猜到，两派开战生灵涂炭；又问她是否猜到施丰臣是谁，她不答，只问初子剑来历，掌门也不答。事后顾清查清初子剑是海上那位自禁雾岛的通天境剑仙之物，神皇借剑用意成谜。赵腊月与顾清相继闭关。掌门亲赴云梦山致意，随后两派联合颁令定柳十岁为真凶，以功法与天阶法宝悬赏天下追杀，他自此终生不见天日。"},{"n":213,"orig":213,"title":"奈何天日必昭昭","people":["柳十岁"],"one_line":"青山暗护柳家，柳十岁救人行踪再度暴露","summary":"两名散修探知柳十岁家在青山外小山村，欲绑其父母逼他现身。林梢忽降冰霜，一人眉心被无形剑光洞穿而死，另一人磕头求生，带着一道意志逃出：山村是青山禁地，谁都不准靠近。另一边，柳十岁在建安郡小镇茶铺前遇惊马横冲直撞，明知修行者现身小镇极易暴露行踪，仍出手拦马救人，救下车内一家三口。事后他在镇外树林发现两名三清派弟子与一名散修跟踪，散修提议杀同道灭口替他遮掩，柳十岁以「我不喜欢这样」拒绝，妖火魔拳轰杀散修，却放走两名三清派弟子——你们并非妖人，我为何要杀你们。"},{"n":214,"orig":214,"title":"朝朝如此谁能活","people":["柳十岁","老书生"],"one_line":"柳十岁斩盗匪救路人，重伤得老书生相救","summary":"柳十岁把昏迷的两名三清派弟子送回客栈，留银托付那户受助人家照看。他赶路诸多掣肘：不能驭剑、不能走闹市也不能走险峰，偏在山林撞上一伙劫货伤人的盗匪。他本不欲多管，却想到小镇那家人或许会走此路，便点名盗匪头目，对方绝望挥刀，被一击断头。他警告余匪从此莫做盗匪，随即遁走。两日后他被多名散修强者追杀围困，重伤跳入暗河穿山逃生，藏身无名野山的溪谷石缝里，远处剑光巡弋。一名老书生忽然出现在谷中，感慨他竟能活到现在——正是当年把他从村子里带走的一茅斋前辈，柳十岁露齿而笑。"},{"n":215,"orig":215,"title":"活人无数不老林","people":["柳十岁","西王孙","老书生"],"one_line":"柳十岁面见不老林首领西王孙，入林继续修剑","summary":"老书生将重伤的柳十岁藏进洞府疗伤赠丹，感慨他这样只肯杀恶人的人本不该属于不老林。伤愈后老书生引他穿幽暗地道抵达西海边破败海神庙，庙中黑衣「海神」真身端坐——正是不老林首领。首领问询，柳十岁守口如瓶：如何杀洛淮南是秘密，出剑者看不出来；首领认可初子剑归他。柳十岁坦言杀洛淮南的理由：井九没能从雪原回来，在他看来就是恶人。首领收他入不老林，柳十岁索要顶级功法晶石丹药与安全洞府，任务自选接否，首领一一应允——他要柳十岁修剑，向全世界证明离开青山也能修成不世剑法，并自报家门：吾乃西王孙。"},{"n":216,"orig":216,"title":"林中有鸟各自飞","people":["顾清","元姓少年","方景天","赵腊月"],"one_line":"三年后梅会重启，顾清修成承天剑诀赴道战","summary":"三年后寒雾将散，梅会重启。顾清出关，三年间再破境，元姓少年也临近无彰；赵腊月正冲击游野，掌门下令任何人不得打扰。顾清本想开洞府石门迎回井九骸骨，终是犹豫作罢。青山试剑大会上，顾清连胜夺得道战名额，所用的竟是天光峰不传秘剑承天剑诀，迟宴问他何时入的无彰上境，他答二十天前，举座哗然。元姓少年签运极佳，苦战险胜后也拿到名额，临行与玉山师妹相对垂泪。此次带队赴朝歌城的师长是昔来峰主方景天，太平真人四徒，素来低调似庸常，但顾家老人提醒过：青山九峰，都是上德峰，顾清不敢多看他一眼。"},{"n":217,"orig":217,"title":"又是道战临雪原","people":["顾清","元姓少年","桐庐","方景天","向晚书"],"one_line":"梅会平淡收场，道战入雪原，顾清直追向晚书","summary":"顾清明白「青山九峰都是上德峰」意指太平真人一脉，方景天身为其四徒绝不庸常。西山居中赵家豪礼送到神末峰，引来同门侧眼，顾清不以为意：太阳遮掩不住，要做的就是让自己更明亮，亮瞎他们的眼。他往井家送丹药，元姓少年去赵家。梅会开锣，琴、书、画诸战平淡收场，昔日风云人物过冬、白早、井九皆缺席，洛淮南已死。西海剑派桐庐因洛淮南之死恨上青山，当面警告顾清：若发现你们包庇那人绝不罢休。道战再度临雪原：年轻修行者随寒雾北进，寻遗骸法器为画上添红梅。顾清却带队偏离路线，直追最前方中州派向晚书与桐庐所在的小队。"},{"n":218,"orig":218,"title":"好大的动静","people":["顾清","向晚书","井九","方景天"],"one_line":"寒雾散尽寻获井九，众人破山救出竹椅上的他","summary":"顾清向向晚书坦言来意：中州派定位法器未毁，说明雪虫消化不尽遗物，万里玺、弗思剑乃至井九白早的遗骸可能同在一处，遂结伴同行。次日晨光骤亮，寒雾一夜散尽，向晚书腰间青竹小牌发亮，他以天地遁法疾飞，顾清剑光紧追不舍；白城外方景天与任千竹同时察觉北方异动，传讯掌门「找到了，无事」。二人深入死寂雪原，锁定寒雾崖壁深处，向晚书惊喜喊出师姐还活着，顾清更喜——白早活着，井九必然还活着。两人驭剑法宝破山开道，闻讯的年轻修行者纷纷加入挖掘，挖出长长斜坑。石壁塌落，洞口铁剑如火炬燃烧，剑火中央一张竹躺椅，井九躺在椅上开口：你们这动静也太大了些。"},{"n":219,"orig":219,"title":"六年里的故事","people":["井九","顾清","向晚书","白早"],"one_line":"井九白早获救，井九断言洛淮南的故事是假","summary":"井九获救，清瘦虚弱，剑元近乎枯竭，神末峰白衣破损不堪，顾清探以剑识大为震惊，忙喂服百草丹。洞中还发现一具巨大干枯雪虫尸壳，以及金玉细丝缠成的雪茧——白早盘坐其中，似在修行关键功法，断金梭割丝反损，中州派弟子不敢妄动，井九言两天后自能出来。夜里井九起身到雪原散步，向顾清解释寒雾中天地灵气凝滞难吸，须以剑火维持洞中温度，六年来真元从未饱满过，身体虚弱只因环境使然。各宗派师长竟无一前来。顾清抓紧讲述六年变故，先用最简短的话复述洛淮南当年讲的故事，井九听完只答两个字：假的。"},{"n":220,"orig":220,"title":"抽丝","people":["井九","顾清","白早","方景天"],"one_line":"井九听毕六年变故，白早雪茧将破，他将离去","summary":"顾清告知洛淮南三年前已死，是腊月师姑决意动手，井九讶异她本该五年后才有望胜过对方；听到局中有柳十岁与童颜、初子剑来自神皇，井九断定中州掌门夫妇早知情，神皇给剑只是顺水推舟，又听闻方景天带队，想起六年前假洞府开启之夜，只说无事。他细察雪茧：白早修的正是他当年传授、融入禅子智慧的道法，与水月庵功法相合，六年入定所得远超预期。他收下一只想跟他走、甲壳坚如冰玉的雪甲虫。北方那道意志自三年前转趋平静，他心知其吞噬本能未除，越平静越可怕，对孤峰低语我要走了。傍晚，井九收起竹椅走出洞外，雪茧表面飘起了一根线头。"},{"n":221,"orig":221,"title":"剥茧","people":["白早","井九","向晚书","和国公","方景天"],"one_line":"白早破茧金丹巅峰，拜谢井九六年救命之恩","summary":"雪茧丝被尽数抽离，白早破茧而出，竟已达金丹期巅峰，众人惊叹她不仅活着还破了境。她径直走到井九身前款款拜倒，以大礼谢其救命授艺之恩，中州派弟子随之向井九长揖及地。寒雾在绝壁前盘而不散，本届梅会道战就此结束。井九与白早乘云舟归来，和国公、方景天、任千竹等大人物齐来问询，白早只说当年金丹将碎，是井九师兄以剑火升温、传功法助她入定至今；众人又惊又叹，感慨他以剑火熬过六年寒雾。方景天当众问井九境界，答无彰中，大人物们以为他六年停滞，颇为遗憾。回到庭院，井九问顾清：路上方景天的表现有没有什么异样？"},{"n":222,"orig":222,"title":"小白花","people":["井九","白早","顾清","桐庐","阴三","玄阴老祖"],"one_line":"白早道别留情意，桐庐向井九下决斗书","summary":"井九把方景天曾两次试图杀自己的旧事告知顾清，命他整理线索、推演方景天会做什么，因无证据无法上报掌门。居叶城里，阴三与玄阴老祖吃火锅，赌约玄阴宗基业归谁——那个叫小明的孩子与苏子叶谁赢谁做传人。清晨白早来到青山庭院，向井九吐露情意：若能早醒一日便能多了解他一点。井九以大道朝天、若有机缘总会再见婉拒，白早却答我们很快会再见面，并将把洛淮南之事的真相告诉父母，还点破柳十岁与井九关系看来极好。桐庐求见，因柳十岁杀了洛淮南、且已知晓当年故事是假，向井九发出决斗之邀，拂袖而去。剑舟南归，井九回到青山，洗剑溪畔一片欢呼。"},{"n":223,"orig":223,"title":"小酒窝","people":["井九","赵腊月","元姓少年","顾清","方景天"],"one_line":"井九归山，赵腊月破境游野成最年轻游野境","summary":"洗剑弟子争睹小师叔风采，授课的吕仙师索性放他们去溪边看，他正是当年因南松亭被召回的师长。剑舟落在剑舟坞，数十名弟子齐声恭迎小师叔归山，方景天称掌门还在天光峰等井九。话音未落，井九忽有所感，弗思剑自行化作红光飞向神末峰——赵腊月破境入游野，成为青山数百年来最年轻的游野境，井九驭剑直奔孤峰。赵腊月出关，蓬头垢面却眼神湛然，接住弗思剑，以「剑峰」试探井九真假，得到「左易」的回答后终于笑了，梨涡再现。她进洞府洗净尘土，出来在竹椅上坐下，井九取出阴木梳替她梳头。"},{"n":224,"orig":224,"title":"一曲寒蝉","people":["井九","赵腊月","元曲","顾清"],"one_line":"元姓少年得名元曲，井九自陈雪原因果","summary":"井九让顾清把雪原之事讲给赵腊月。她问为何不向大家揭穿洛淮南的故事是假，好让柳十岁好过些；井九答：自己与白早活着，洛淮南便不算死罪，杀他就有问题，而且十岁如今要做的事需要更大的罪名。井九取出带回的雪甲虫，赵腊月为其取名寒蝉；元姓少年趁机求赐名，赵腊月随口说了「元曲」，井九评一句曲中求直，从此他便叫元曲。寒蝉畏热，被安置进冰玉榻。赵腊月问井九为何没能离开雪原、为何去救洛淮南，井九答白早有心救他，他当有所回应，是为无缺；求大道便要断个干净。她问那我们呢，井九答不知道，以前未曾有过；又说自己设的骗局骗到了那位太多疑的师兄。"},{"n":225,"orig":225,"title":"站这峰，望那峰","people":["井九","赵腊月","方景天"],"one_line":"井九带赵腊月赴碧湖峰，追查剑狱逃走之人","summary":"井九点破青山有鬼：方景天不知他查到了什么，却知道他在查，这便足够起杀心；当年左易要杀赵腊月，是卷帘人知晓她在查碧湖峰。他担心数年后自己离山时诸峰之鬼趁机出手，遂带赵腊月上碧湖峰。途中讲述真相：那人曾被囚于上德峰底剑狱，弄到一段雷魂木后决然舍弃道身，把神魂转入冥部弟子之躯逃出生天，又借孟师的剑假死而走斩断线索，孟师闭关实为被囚；前任碧湖峰主雷破云被囚后放出，也可能是灭口。井九查雷魂木查的是这个逃走的人，而非景阳飞升之谜，另一段雷魂木自有用处。二人不作通传徒步登顶，碧湖如海，湖心小岛上有一座宫殿。"},{"n":226,"orig":226,"title":"偷猫","people":["井九","赵腊月","白鬼","成由天"],"one_line":"井九以妖鸡牌破禁阵，从碧湖峰偷走镇守白鬼","summary":"碧湖峰主成由天与长老议事，因失了宝树居进献、全峰凋敝而气闷，却只能自嘲隐忍：熬过百年，把老祖服侍好比什么都重要。井九与赵腊月不经通传直上碧湖峰顶，井九先敛尽生机化作石头，再递给赵腊月一块画着锦鸡的翠绿竹牌，碧湖禁阵应声为她开路——那牌子唤作妖鸡。二人自湖水走出，登上湖心宫殿前的石阶，那里趴着一只灰扑扑的白猫，正是青山四大镇守之首白鬼，井九唤它刘阿大。井九以「宝树居还碧湖峰一半」为饵，邀白鬼去神末峰小住短则三年慢则五年，随后拎起它的后颈放进赵腊月怀里。白鬼蹭了蹭，觉得又软又暖，心软认了。"},{"n":227,"orig":227,"title":"四大镇守的来历","people":["井九","赵腊月","顾清","元曲","白鬼"],"one_line":"井九收走五段雷魂木，镇守白鬼真相大白是猫","summary":"殿内青玉阵中供着青山重宝雷魂木，乃大漩涡深处古树心历经雷击五百年方能成熟，青山开派万年只剩六段，其中一段未成熟留镇碧湖峰，井九收走其余五段，又教赵腊月像他摸她头那样摸猫，白鬼舒服得打起呼噜。成由天事后得知二人来去无踪，怅然若失。神末峰上，顾清与元曲见两位师长抱回一只白猫大为惊愕，井九直言这是镇守白鬼，二人惊得说不出话。寒蝉趴上白鬼头顶吓得半死，被猫爪捞回去当装饰。元曲追问阴凤大人是不是凤凰，井九答是鸡——正是那块妖鸡竹牌；元龟则真是只老乌龟。顾清与元曲慌忙商量给镇守做窝、去适越峰讨冰髓。"},{"n":228,"orig":228,"title":"尸狗","people":["夜哮","井九","顾清","元曲"],"one_line":"四大镇守真身曝光，尸狗夜巡剑狱与隐峰","summary":"青山四大镇守封号元龟、白鬼、阴凤、夜哮，真身却是一只老龟、一只猫、一只鸡与一条狗。井九提醒莫在阿大面前提「尸狗」之名，顾清却敏感察觉夜哮镇守原本在上德峰。上德峰远离灵脉，峰底寒井最深处是青山大阵杀门，囚着冥部妖人与魔物，秽气冲天。一只通体纯黑、身形如小山的巨狗在剑狱通道里悄然行走，禁制自开，群魔噤声，连破海境的叛徒与堪比魔神的冥部强者都恐惧万分。尸狗出剑狱巡至隐峰，叼走一名枯坐三百年求突破无望的碧湖峰破海弟子尸身，放入石山洞穴化为石像，随后回到剑狱井底静静坐下，一道天光落下。"},{"n":229,"orig":229,"title":"白吃","people":["井九","白鬼","元曲","顾清","赵腊月"],"one_line":"白鬼赖上神末峰，元曲破境，桐庐战书被拒","summary":"神末峰恢复修行日常。井九冥想时天地灵气如灌注般涌入，峰顶灵气都因此更浓，白鬼发现后每逢井九修行便跳上他头顶趴着，寒蝉再趴在猫头顶；它还认定神末峰的太阳更圆更暖，日子过得极舒坦。盛夏碧湖峰雷暴，诸峰弟子借雷洗剑，元曲于雨夜破境无彰，顾清驭剑同去；白鬼独守崖畔，尽职看护雷魂木，如尸狗在幽暗地底做事一样。转眼一年多过去，冬日初雪，顾清煮雪泡茶，与元曲议论镇守名号，井九笑说元龟、妖鸡、阿大名字里都有一，因为它们都想当老大，尸狗则觉得那三位都是白痴。剑书忽至——西海剑派桐庐下战书，井九拒绝应战。"},{"n":230,"orig":230,"title":"这样和那样的人","people":["桐庐","柳十岁","幺松杉","井九"],"one_line":"桐庐四海军中收匿名战书，柳十岁乱礁现身","summary":"桐庐在适越峰公开发难，讥讽井九不敢应战，青山弟子却不以为意——井九本就是懒散之人，从不应战。过南山、顾寒等两忘峰前列弟子因洛淮南之事被门规责罚，已闭洞两年未出。四海宴召开，天鲸掠海，西海剑派声势大涨，桐庐作为西海剑神亲传弟子在重地云台负责接待，西王孙将亲赠四件重宝。他却在房中发现一封无阵无毒的信，只写时间与地点，落款是一把红色的剑——弗思剑。十余日后，海州城外乱礁水雾中，黑衣人静候桐庐，露出那张更黑的脸：听说你想替洛淮南报仇，就该直接找我，而不是去打扰别的人。"},{"n":231,"orig":231,"title":"乱礁斗剑","people":["柳十岁","桐庐","西王孙"],"one_line":"柳十岁乱礁重伤桐庐，安然遁回云台不老林巢","summary":"乱礁之中生死斗：柳十岁的剑藏在海里，一剑划破桐庐左肩；桐庐祭出西海隐潮剑法威力最大的一招，柳十岁竟看破剑路硬接下来，随即妖火凝拳隔空轰碎他三道剑帘，重伤其胸口。但这一击耗尽真元，柳十岁见西海剑派援军剑光已至，当即遁走；西海剑派封禁海州城四处搜捕，他如鬼魅般消失——不老林的老巢就藏在西海剑派重地云台的静室里，柳十岁安然回房整理卷宗。西王孙现身，让他先休息，问明他是因桐庐到处宣扬井九怯懦而动怒，并感慨他能胜过桐庐，靠的是每剑每拳都当最后一击的拼命打法，桐庐做不到，所以输了。"},{"n":232,"orig":232,"title":"天若无情方不老（上）","people":["西王孙","柳十岁","应城小荷"],"one_line":"西王孙坦承妖丹局，应城小荷受命贴近井九","summary":"西王孙向柳十岁坦承前因：浊水底鬼目鲮与妖丹之局是他布下，本想诱一名两忘峰弟子做不老林内应；柳十岁不会演戏很快被逐出山门，反成弃徒入林羞辱青山；柳十岁杀死洛淮南后从此不可能背叛，西王孙遂彻底信他、亲传剑法，命他翻阅不老林玉册，挑人刺杀玄阴宗少主苏子叶。柳十岁借约战桐庐暗中试探，判断西海剑派并非全被控制，只是西王孙一脉，而西王孙十几年前才出现，来历成谜。另一边，西王孙召见绿裙少女应城小荷：初子剑是师父遗落大陆之剑，却数年查不到在柳十岁手里后去了何处；他要小荷继续贴着井九，不许用媚术，要以真情意成为井九的羁绊。"},{"n":233,"orig":233,"title":"寻剑","people":["井九","赵腊月","应城小荷","柳十岁","顾清","德瑟瑟"],"one_line":"井九授课万物一剑，德瑟瑟带来惊人消息","summary":"应城小荷奉命移居海州城开酒楼守候，可在四海宴灯下与柳十岁初次相识，她便慌乱至今——那朵茉莉为何会出现在他衣领上？转眼一年。神末峰上井九集中授课：顾清察觉承天剑诀在某些时候更像阵法，井九印证，并道出剑经首页「万物一剑」的真意；赵腊月问通天之上有何境界，井九答藏天下，再往上只在想象里。白鬼默默听着，它知道还有一境名为万物一，也想直到最后井九都没有提的那把万物一剑在哪里。承剑大会后，悬铃宗少主德瑟瑟第四次观礼终于被请上峰顶喝茶，她忽然睁大眼睛问：你们知道那件事了吧？"},{"n":234,"orig":234,"title":"喜欢吃烤肉的年轻人","people":["苏子叶","何霑","童颜","德瑟瑟"],"one_line":"苏子叶遇刺中毒，何霑请出童颜相救","summary":"德瑟瑟带来修行界大事：玄阴宗少主苏子叶在益州酒楼遇刺，刺客伪装成嫖客，苏子叶生死不明——他与洛淮南本是年轻一代一正一邪的最强者，先后遭暗杀。西南大陆上，何霑背着中毒的苏子叶亡命奔逃。苏子叶自述来历：父亲在母亲体内种下魔胎，母亲死了，他就是那个魔胎，天生尸毒故而脸绿。何霑等来他最信任的朋友童颜，两位天下最聪明的人见面，商定让苏子叶去宝通禅院避难，自己出饭钱打短工，还贫嘴排座次——何霑第三，井九在上头。原来玄阴宗祭祖时有年轻人以正宗玄阴魔功挑战苏子叶，长老们眼神异样，苏子叶离山查探，却中了不老林的假线索与尸槐之毒，毒将侵至魔胎。"},{"n":235,"orig":235,"title":"早有故事在上头","people":["阴三","童颜","苏子叶","玄阴老祖","井九","尤思落"],"one_line":"阴三搅局玄阴宗，尤思落出关追问柳十岁真相","summary":"童颜与苏子叶两位绝顶聪明人见面，商定去宝通禅院，苏子叶自己出饭钱打短工。冷山玄阴宗内乱落幕，王小明被长老们拥立为新少主，走火入魔的老宗主竟还活着。遁剑者玄阴老祖质问阴三：说好公平较量，为何让不老林暗杀苏子叶？阴三答水越混越好，并承认魏成子是他所杀——因为小腊月是青山弟子，轮不到中州派来杀；他与不老林的关系要等其灭亡那天再说，想灭不老林的是那些孩子，他只是喜欢。神末峰上，井九自评是世间最适合做刺客的人，却因世事不过无趣的重复、做了没有任何意义而不为。两忘峰排名第二的尤思落出关，追问柳十岁到底怎么回事，过南山决定由他来说明。"},{"n":236,"orig":236,"title":"他是谁","people":["过南山","柳十岁","尤思落","简如云","马华"],"one_line":"过南山道出柳十岁卧底真相，其决意继续潜伏","summary":"过南山向出关的尤思落揭开内情：当年梅会星湖篝火夜，各派年轻弟子立下带领人族争取未来的共同理想，要除不老林须先拿到藏于各宗派的成员名单，于是选柳十岁做内应——浊水除妖时他们发现鬼目鲮妖丹暗藏隐匿功法，当夜定下让他服丹被逐的方案，且是柳十岁自己要求，童颜备了二十七个预案。原计划再过二十年他便能接触核心名单，洛淮南之死让他地位飙升。他决意继续潜伏，找出不老林与冥部勾结的证据与最深名单，但始终想不透：西海剑神是否知情？十几年前才出现的西王孙究竟是谁，与冥界有何干系？这些年他总觉得有人在静静注视着自己。"},{"n":237,"orig":237,"title":"那么，就到这里了","people":["柳十岁","应城小荷","顾寒","过南山"],"one_line":"柳十岁查明镇魔狱之谋决意收网，明珠抵两忘峰","summary":"柳十岁从几封寻常调令里分析出不老林近期将做一件大事，目标直指朝歌城镇魔狱——这等于坐实不老林与冥部勾结，人族无法承受。他终于决定结束潜伏，最后一次读完整本玉册记住所有名字，空手离开云台，到小荷的酒楼吃了顿安静的饭；小荷隐约觉得他是来道别，他却连一片云彩都没带走。随后他竟又神不知鬼不觉回到云台静室。朝南城顾家老宅，老太爷剖开鱼腹取出一颗元气珠，命人封好送进山里。三天后，一个打着顾家族押的匣子送上两忘峰，顾寒验押后神色剧变，对过南山说：珠子在里面。过南山难以置信：这怎么可能？"},{"n":238,"orig":238,"title":"还君明珠","people":["过南山","顾寒","简如云","马华","柳十岁"],"one_line":"明珠映出柳十岁卧底真相，两忘峰待掌门决断","summary":"匣中元气珠碎裂，藏着一颗鸡卵大小的明珠——竟是柳十岁的影像珠。过南山诵经放出画面：从少年柳十岁清澈的眼睛，到服丹被逐、崖洞三年黑暗、青山试剑的血魔功、小山村、海神庙，再到云台静室与满桌玉册，画面证明他真的完成了十年之局。顾寒说：他做到了。简如云却警惕这可能是陷阱——玉册上的名字若是栽赃，两派据此行事会害死无辜、搅乱修行界；顾寒则点出关键：柳十岁只有亲手杀死洛淮南，才能取信不老林高层拿到名单。过南山阻止争执，独上天光峰禀报掌门，命众人封洞不得外出；顾寒忧心若掌门认为某些牺牲值得，柳十岁必死，马华叹他自己恐怕也清楚死亡才是最好的结局。"},{"n":239,"orig":239,"title":"剑游","people":["井九","掌门","赵腊月","白鬼"],"one_line":"井九以留柳十岁性命为条件施剑游，剑赴异陆","summary":"天光峰上掌门对元龟自语：年轻人想把世界弄大，这次事情闹得太大，只能拜托它记得那边有位朋友。神末峰上井九对来人表明：他早让阿大传话说反对此事，如今对方却来相求，交换条件只有一个——你知道那个孩子与我的关系，让他活着。随后井九进入洞府最深处、当年斩开天雷的峰顶之地，道树无风自动，剑识催动剑游：弗思剑自行离鞘远行，破罡风入虚境，又闯入雷域借天雷洗炼、补足灵气，飞越蓬莱岛与大漩涡，朝远方大陆疾驰。剑游之时不能被人打扰，白鬼与寒蝉守在寒玉榻旁。次日清晨，弗思剑抵达一座陌生大陆的海岸，山中轮廓如沉睡的巨人。"},{"n":240,"orig":240,"title":"跨过山和大海的巨人","people":["巨人","弗思剑"],"one_line":"弗思剑万里传信，巨人渡海执古树守雾岛","summary":"弗思剑降落在万里之外的陌生大陆：森林里住着生有蝉翼的美丽精魅，守护着巨莲般的果实。忽然阴云雷电聚于山脉，那道山脉竟站了起来——是位顶天立地的巨人，脸上带着历经天雷的刻痕，眼神天真如孩童。他唤弗思剑作阿加，奇怪它怎么回来了——沉睡前分明告别过。弗思剑在他眼前飞出复杂图案说明来意，巨人笑着应下，目送它返程。随后巨人徒步走进大海，趟过藏有冥部通道传闻的洛神海沟，从清晨走到日暮，来到被怪雾笼罩的雾岛旁；他先到大漩涡里摸出一根千丈长的万年古树，随后坐在海中握树守着雾岛，打了个呵欠，觉得有些无聊想睡觉。"},{"n":241,"orig":241,"title":"掌门因何发笑？","people":["何渭","宋千机","船主"],"one_line":"何渭诛杀昆仑奸细宋千机，海上神船因海神示警回航。","summary":"蓬莱岛神船远航途中突遇狂风雷鸣，船主认定这是当年救过神船的「海神」示警，急令海上宝船尽数回航，等候海神旨意。昆仑山顶天池，掌门何渭听闻玄阴宗内乱、苏子叶在益州被暗杀，心情大好，亲自带师弟宋千机赴冷山查看。远望玄阴宗血色峡谷总坛后，何渭道破喜从何来：不老林多年经营，在昆仑只安插了宋千机与刘湘两名奸细。言罢琉璃剑贯穿宋千机身体，宋千机道树尽毁而死，尸身被焚成灰。"},{"n":242,"orig":242,"title":"经","people":["何渭","苏七歌","高崖","王小明"],"one_line":"正道强者示威冷山；果成寺与水月庵封镇通天井。","summary":"何渭焚毁宋千机尸身，与中州派白真人对峙于冷山上空，邪派妖人尽皆蛰伏不敢现身。玄阴宗总坛内，瘫痪多年的宗主苏七歌、七代长老高崖与新任少主王小明各怀心思：高崖嘲弄王小明只是傀儡，王小明暗生杀机，连宗主杀不杀也在权衡。东海通天井旁，水月庵太上长老率弟子抬轿而至，果成寺住持与渡海大师带十八位苦修僧人赶到，以泛金经文织网投入地坑，无数游魂瞬间被诛，冥部气息沉入井底，这处通往冥界的通道再度被封镇。"},{"n":243,"orig":243,"title":"太常寺的斜风细雨","people":["鹿国公","过冬","鹿鸣"],"one_line":"不老林两路刺杀鹿国公皆败露，目标指向镇魔狱钥匙。","summary":"白城冬尽，过冬回到旧庙，与梁上巨刀般的存在闲谈，断言此番清剿不可能将不老林一网打尽，剑西来难杀，就算要杀也不必那存在出手。朝歌城里，鹿国公告知儿子鹿鸣：不老林要杀他，此事与其太常寺卿之位有关，且很快会了结。清晨太常寺茶水中被验出投毒，下手的竟是茶房杂役，清天司当场拿人；鹿国公心想若非事先知情几乎喝下毒茶，毒必不普通。又一名官员挤出人群称有要事禀报，廊下雨丝忽然紊乱，鹿国公抬起了头。"},{"n":244,"orig":244,"title":"离开青山的流星雨","people":["井九","赵腊月","鹿国公","金明城"],"one_line":"朝歌城收网抓捕不老林奸细；青山百剑如流星雨飞赴西海。","summary":"刺客符宝自爆，却被太常寺护寺宝物斜风细雨的光罩锁住，反遭元气锁擒获。鹿国公与皇宫供奉金明城复盘：不老林杀他意在镇魔狱钥匙兼制造混乱，幕后主使对镇魔狱知之甚详，级别却不高。朝歌城全面收网，昆仑派刘湘、太常寺杨长雨等奸细落网，只是些虫子。神末峰上，井九点破神皇送出初子剑是顺水推舟，欲借西海之手逼青山开战，却被赵腊月随手赠剑柳十岁搅了局。众人担忧柳十岁的性情不会提前脱身，井九难得心情不佳。青山群峰随即腾起数百道飞剑，如流星雨直奔西海。"},{"n":245,"orig":245,"title":"谁于水面张青盖","people":["柳十岁","小荷","南筝","屠丘","郁不欢"],"one_line":"小荷倒戈救柳十岁遁入密道，不老林三大高手围杀未果。","summary":"正道各派齐动清剿不老林安插的奸细，柳十岁确认消息后仍留在海州城酒楼吃饭。对坐的小荷摊牌：她早就知道他是青山奸细，他也知道她是派来监视的，二人举杯对饮。话音间酒楼垮塌，不老林三大高手围杀而至：妖修屠丘、携四荒瓶的郁不欢与天南野修南筝。柳十岁择屠丘为突破口突袭，却被筝音锁住飞剑，四荒瓶吸噬精血，命悬一线。小荷以青莲挡住四荒瓶，引他遁入地下密道。原来她已为这一天暗中准备了十年。"},{"n":246,"orig":246,"title":"天地间最锋利的剑","people":["柳十岁","小荷","南筝","郁不欢","屠丘"],"one_line":"手镯化出仙阶飞剑救主，剑尖却转向柳十岁领上茉莉。","summary":"密道中小荷牵着柳十岁奔逃，腕间金属镯子滑落到他腕上。她道出缘由：多年前在客栈遇上一对男女，对方留下一只镯子，嘱她日后务必帮那个少年完成要做的事，她因惧怕那人而守诺十年，买下客栈改造海州地道。二人刚出野山，便被追兵借西海算天阁锁定围住。绝境中柳十岁掷出手镯，化作一柄两尺小剑，光滑如镜、锋利绝伦，竟是仙阶飞剑，南筝三人骇然止步。但柳十岁催动不了此剑，飞剑忽然回转，剑尖对准了他衣领上的茉莉。"},{"n":247,"orig":247,"title":"心有猛虎，细嗅茉莉","people":["柳十岁","小荷","西王孙","南筝"],"one_line":"茉莉剑识唤醒仙剑连伤三敌，柳十岁被西王孙剑意击落。","summary":"飞剑轻触茉莉，将其化作精纯剑识吞入，随即欢鸣出鞘：一剑割伤南筝脸颊，震碎屠丘的钻石拳套并废其右臂，郁不欢遁沙而逃。三人联手布防，飞剑一时难破，索性驮着柳十岁与小荷破空而去。神末峰上白鬼了然井九不去救人的缘故——有此剑足够。逃亡途中西王孙的声音追至，许诺只要回头便饶命，柳十岁沉默不应。一声叹息之后，一道剑意跨越两百余里劈中飞剑，二人闭眼跌落。"},{"n":248,"orig":248,"title":"两小无猜","people":["柳十岁","小荷","西王孙"],"one_line":"仙剑挡下西王孙雷击，柳十岁携小荷入洞府疗伤避祸。","summary":"二人摔进山坑重伤难起，全凭那柄仙阶小剑硬挡西王孙隔着两百余里的剑意才保住性命，飞剑也因此黯淡。满天青山飞剑掠空西去，大泽水天一线等宗派随后压上，正道围攻云台，百年难见的阵势令小荷心惊。柳十岁背起小荷，躲进他进不老林前备好、禁制极强的洞府，喂她服丹疗伤。他问出留镯之人正是井九，赞公子是世上最聪明的好人；小荷因领教过井九的冷酷，认定他是个恶人。柳十岁便从当年小山村讲起，想以事迹说服她。"},{"n":249,"orig":249,"title":"多话的柳十岁","people":["柳十岁","小荷"],"one_line":"柳十岁卸下伪装倾诉积郁，小荷道出手镯十年的重压。","summary":"小荷说十年最开心的是地道里牵着他奔跑——手镯终于离身。那只镯子十年来如目光般监视着她，逼她守着井九的嘱托，她试过砍手也摘不下来。柳十岁由此确信公子从未怀疑过自己，话匣大开：细数离开青山前半年不洗头、苦练离别台词的影帝级演技，又问若井九早知他作假会否生气。小荷点破：也许那段话他自己都信了，且井九既知真相便不会理会他。他转而叹服公子的演技更深，絮叨公子九天学会插秧、南松亭赠丹等旧事。他坦言积压多年无从开口，小荷把他抱进怀里轻拍。"},{"n":250,"orig":250,"title":"一声叹息","people":["柳十岁","西王孙","小荷","老书生"],"one_line":"西王孙为夺初子剑亲至，一茅斋老书生现身护住柳十岁。","summary":"柳十岁领小荷到林间，起出自己最后的秘密——初子剑。此剑当年由神皇赐予赵腊月，桂华城中又转赠于他，洛淮南便死在此剑之下，西王孙寻它多年无果。二人正欲驭剑远走，西王孙的叹息再度响起，人已降临。他徒手握住初子剑，坦言云台杀局既成，留下无益，此行专为取回南海真正的传承，得剑便有望突破境界；不老林不过一把刀，要紧的是握刀之手。他欣赏柳十岁杀洛淮南的枭雄心志，却须杀之给某些人交代。此时一茅斋老书生现身，叹道原来自己也只是一把刀，西王孙答：您是笔。"},{"n":251,"orig":251,"title":"闲笔","people":["西王孙","老书生","柳十岁","小荷","金明城"],"one_line":"管城笔难敌初子剑，老书生重伤将死；江山图原是皇帝闲笔。","summary":"西王孙以初子剑剑意隔空斩向老书生。老书生祭出一茅斋镇斋四宝之一的管城笔，凌空写下一个「江」字挡住剑光，仍被西王孙君临一步踏碎，震退吐血。西王孙忽感应到东方杀机，转身遁走，临行弹出一道剑意取柳十岁性命，小荷扑身相护，老书生举扇挡下，前襟却裂开一道口子，鲜血喷涌——生机已被摧毁。朝歌城中，金明城道出陛下布局：数年前皇宫江山图失踪并非失窃，而是一步闲笔，只要西王孙敢取初子剑，便会被人循迹寻上门去。"},{"n":252,"orig":252,"title":"白发三千","people":["裴白发","裴远","金明城","鹿国公"],"one_line":"裴白发隐忍蓄势，一剑千里循江山图斩向取剑的西王孙。","summary":"金明城点明江山图可监察陛下江山之内的任何剑，敢拿便会被寻上门，鹿国公断定西海剑派大祸临头。天寿山无恩门一反常态地安静。门主裴白发当年败于西海剑神，闭关多年只饮清水，外界以为他跌境将死，实则双目虽盲、境界更胜当年。他借殿中江山图盯着初子剑的亮点数年，蓄势千夜，见剑光大亮便催动白发三千剑，一剑千里破殿而出，直斩西王孙。其兄裴远惊疑欲探，被长老拦下；名剑君不见破空而去，天寿山落下倾盆暴雨。"},{"n":253,"orig":253,"title":"君不见","people":["西王孙","顾盼","裴白发"],"one_line":"君不见一剑千里击碎初子剑与西王孙双臂，云上黑影随行。","summary":"无恩门弟子在暴雨中认出门主名剑君不见重现人间，激动落泪。此剑一剑千里，西王孙警觉回身以初子剑硬架，仍被正面斩中：初子剑灵性尽失，如废铁般飘坠向海州方向，西王孙双臂骨尽碎，拼死遁入虚境向西逃命。地面之上，神卫军统领顾盼奉命率百骑疾驰，追索那道如黑线般缓缓飘落的初子剑，严令谁敢抢夺格杀勿论。虚境里西王孙血洒长空，忽然发现云上多出一道影子，始终从容随行在他侧后方。"},{"n":254,"orig":254,"title":"高堂明镜悲白发","people":["裴白发","柳十岁","老书生","裴远","柳词"],"one_line":"柳词倒吊西王孙；裴白发清算叛徒；严书生赠笔化灰而逝。","summary":"云上影子化作绳索，将西王孙倒吊擒走，他认出来者是柳词，自知两位通天境先后出手，不冤也不服。天寿山上，裴白发现身道破要杀的正是西王孙，随即下令烧掉白鹿书院——当年有人保举他去书院见那位瞎子，他才变成瞎子。兄长裴远夺路而逃，被裴白发隔空斩断右腿、再断左脚。裴白发怒言没想到兄长会出卖自己，原来自己在真瞎之前早已瞎了许多年。崖间，垂死的严书生把管城笔赠予柳十岁，嘱其风波平息前莫现身，笑问当年是否借小解藏剑，随后摇扇化灰而逝。"},{"n":255,"orig":255,"title":"云台的真面容","people":["布秋霄","成由天","桐庐","过南山","柳十岁"],"one_line":"云台终年云雾散去露出真容，过南山亮还天珠欲播证据。","summary":"柳十岁磕头拜别，小剑变回镯子，拉着二人飘下悬崖。一茅斋斋主布秋霄随后赶到，祭过师侄严书生便飞赴西海。海州城外，大泽令施展风雨道法，将笼罩云台无数年的终年之云尽数化雾压落，云台真容终于显露——一座悬空青翠山峰。青山宗围而不攻，成由天断言要等西海剑派现身，布秋霄明白青山的目标不止云台。西海剑派果然赶到，领队的却只有年轻弟子桐庐与两名游野境长老。过南山取出中州派至宝还天珠，要在众目睽睽下播放柳十岁传回的证据。"},{"n":256,"orig":256,"title":"卖刀者说","people":["西王孙","桐庐","成由天","布秋霄","过南山"],"one_line":"还天珠铁证公布，被擒西王孙反斥正道诸派皆是买刀人。","summary":"还天珠再现柳十岁所见画面与对话，铁证如山，围观众派震动，桐庐犹指为诬陷，成由天不再多言，逼西海剑派交出名单上两百余人与云台执事。此时西王孙被影索缚住双臂，自夜空吊落阵前，他坦然承认打理不老林多年，随即反问诸派：各宗派里如他之人甚多，正道不便出手的杀戮皆借不老林完成，「你们是买刀的人，有什么资格判我有罪？」两三位掌门长老神色微变，布秋霄示意成由天准备以八方剑法灭口，西王孙冷笑挑衅：或者，便从你们青山宗开始？"},{"n":257,"orig":257,"title":"海上生巨山","people":["西海剑神","布秋霄","青山掌门真人","桐庐"],"one_line":"西海剑神与青山掌门隔空对峙，镇派神兽飞鲸破海而出。","summary":"布秋霄回应一茅斋从不买刀，并列其罪：勾结邪派冥部、妄图影响朝廷与雪国战事，喝令西海交人投降。桐庐厉声抗议之际，一道剑光自深海而来，西海剑神亲至。其剑未发已逼得围台诸派连连后退，剑光直斩而下，却被青山掌门真人单手握剑挡住。两位通天境强者首次真正交手，一时不分高下。西海剑神冷言「青山剑宗，不过如此」，青山以百余道剑光重新围死云台作答。对峙之际，漆黑海面忽然分开，隆起一座黑色的山——西海镇派神兽飞鲸破海而出。"},{"n":258,"orig":258,"title":"吾乃骑鲸乐浪人","people":["元骑鲸","布秋霄"],"one_line":"元骑鲸踏雪落鲸背，镇派神兽飞鲸被镇压坠海。","summary":"飞鲸庞大如山，威压近半步通天，鲸吼与暴雨震得诸派弟子立足不稳，镜宗弟子险些坠海。青山两位通天被西海剑神牵制，谁能挡鲸成为死局。忽然暴雨化雪，一名黑衣人踏雷携雪落上鲸背——正是青山剑律、上德峰主元骑鲸。酷寒与雷威透体而入，飞鲸哀鸣着坠回海面，掀起巨浪摧毁百里海岸与海神庙，海州城地震屋塌。青山弟子齐呼参见剑律。元骑鲸负手而立：青山不过如此，不过就是两位通天，放眼大陆除中州派再无别处。"},{"n":259,"orig":259,"title":"井九讲故事","people":["井九","南趋","赵腊月","道缘真人"],"one_line":"井九讲述南趋与青山的恩怨，点破道缘真人飞升失败真相。","summary":"西海剑神再出一剑刺入雷域，布秋霄喝令众人退远，剑光落下之处竟直指云台。神末峰上井九安然品茶：他与掌门真人有约，由巨人朋友盯着雾中群岛，掌门保柳十岁平安，何况还有柳词与那柄仙剑在。青山必胜的理由是「两个通天比一个通天多一个通天」。他随后道出西海与青山的宿怨：南海王子南趋求拜掌门道缘真人为师被拒，得前代剑仙传承修至通天巅峰后报复青山，趁道缘真人飞升之际偷袭，令其身死，南趋的道树亦被万物一剑隔空斩断，只得将洞府海岛自禁于海雾之中。"},{"n":260,"orig":260,"title":"那些年我们吃的火锅 杀的人","people":["井九","剑西来","南趋","赵腊月"],"one_line":"井九道破剑西来历与西海图谋，深夜强敌降临神末峰。","summary":"井九续讲旧事：道缘真人飞升失败后他这一脉凋零，师兄被假意逐出山门，实则是去冥界办差，归来后与井九、元骑鲸、柳词吃了多年火锅，最终重掌青山。当年师兄说要去杀人，三人随行，为稳定九峰杀了不少人。他又讲南趋一脉：其童子化名天近人为师寻传人，把被无恩门拒收的剑西来引去雾岛拜师；剑西来开创西海剑派，百年前掌握不老林，图谋超越青山。井九断言剑西来会断臂求生舍掉西海剑派，青山此战意在废其羽翼。夜里有强大气息降临神末峰，赵腊月唤醒沉睡的白猫老祖。"},{"n":261,"orig":261,"title":"他人即地狱","people":["井九","南筝","方景天"],"one_line":"井九布局钓杀方景天未果；南筝逃出雾海见剑光起自海上。","summary":"井九布下的三年之局终于引来窥伺者：夜里有强大气息逼近神末峰，他亲自解除峰顶禁阵，与崖畔白鬼静候对方入彀，来者却未出手便悄然退去。井九判断来者正是曾两次杀他的昔来峰主方景天，对方提前知晓峰上安排，必有人走漏消息——不是白鬼便是掌门或元骑鲸，他仍不知当年是谁放师兄出了剑狱。南筝在云下雾海中逃亡：屠丘与郁不欢已死，法宝系在腰间，神卫军铁骑贴符冲锋踏死她的赤象，一茅斋书生疯魔助战。她逃出浓雾攀上山巅，只见一道剑光自海面生入苍穹再落回人间，冷过地狱。"},{"n":262,"orig":262,"title":"云台明灭","people":["西海剑神","桐庐","过南山","西王孙","成由天"],"one_line":"西海剑神斩杀西王孙自毁云台，桐庐拒绝接受这番安排。","summary":"西海剑神之剑自天而落，一剑斩开云台大殿、劈裂悬空山，被影索吊在半空的西王孙被剑光切成两半，连同元婴与剑鬼一并毙命。西海剑神宣称疏于管教、亲自清理门户，命来援弟子尽数回岛。云台崩落海中，残余弟子绝望逃散，成由天下令尽量保全降者。数名云台弟子疯狂扑杀失魂落魄的桐庐，过南山舍身挡下并劝他接受现实。桐庐悲愤质问：西海就是不老林，师尊斩师叔毁云台，是要世人把罪归于师叔一人，但他不会做自欺欺人的事。"},{"n":263,"orig":263,"title":"摸鱼的白衣少女","people":["南筝","顾盼","白衣少女"],"one_line":"白衣少女一音震溃神卫军，夺走初子剑并放走南筝。","summary":"云台覆灭之战快得残酷，南筝跌跌撞撞逃下云海浓雾，撞上顾盼率领的神卫军伏兵。一名蒙纱白衣少女悄然现身，取走她的碧石筝，随意一拨，充满杀伐之意的筝音震碎骑兵与战马身上的符纸，百余名铁骑连人带马被重甲压倒。少女又从顾盼背后取走那把严实捆着的初子剑收入掌心，转而盘问南筝来历，得知她与南忘是族人兼仇人后表示自己也讨厌那个女人，饶她一命。顾盼骇然于对方轻松灭队却不杀人的举动，南筝趁乱遁入夜色。"},{"n":264,"orig":264,"title":"菜园纪事","people":["何霑","苏子叶","童颜","南筝"],"one_line":"何霑于禅院菜园拣得初子剑，昏迷的桐庐再成神秘馈赠。","summary":"南筝交出四荒瓶与钻石拳套买命，白衣少女只借走碧石筝飘然而去。西南大陆宝通禅院菜园里，中了尸毒的苏子叶由童颜求得禅院僧人暗中救治，与何霑同住养病。何霑自述来历：弃婴被老尼姑收养，庵中经文实为修行法门；此后奇遇不断，拾宝杀人皆逢凶化吉，他因此怀疑有人一直在暗中注视并供应自己所需。童颜先笑称除非那是你亲妈，随后认出菜园里那把剑正是初子剑，判断系有人故意送到何霑手中，当晚菜地里又多了一个昏迷的桐庐。"},{"n":265,"orig":265,"title":"格局 问题以及麻烦","people":["童颜","何霑","苏子叶"],"one_line":"童颜劝苏子叶改邪归正布局夺宗，何霑再凭运气拣得宝剑。","summary":"童颜点破此番云台之役是年轻弟子逼师长出手，云台被毁、西海被逐回海外便是功。何霑自嘲厌烦这种妥协，并透露道战篝火之夜，各派天才弟子曾结成秘密组织，目标就是把苏子叶这样的邪修杀干净。童颜劝苏子叶改邪归正：可助他夺回玄阴宗，再带宗门一起改，破解邪修功法之弊，暗指昆仑天池底那条上品灵脉。苏子叶提醒真正的麻烦是柳十岁杀洛淮南，恐致青山中州相争。话音未落，何霑的「运气」再度应验，竟在菜园里拣到一把清冷宝剑，童颜断言这是个大麻烦。"},{"n":266,"orig":266,"title":"亲妈 腐乳以及归期","people":["何霑","童颜","苏子叶","裴白发"],"one_line":"何霑自陈躲避幕后供应者多年；裴白发焚书院后封山西行。","summary":"童颜认出剑是初子剑，判断飞剑、四荒瓶与钻石拳套都是被人特意浅埋菜园送予何霑。何霑道出多年隐忧：冥冥中有人供应他所需，他怕对方将来收回一切或提出无法拒绝的要求，因此躲避宗派与道战多年。童颜笑称没有阴谋家会这么笨、他不值得被算计，除非那人是他亲妈且是修行界大人物。三人分了战利品，夜里桐庐又被人送到菜地。另一边，白鹿书院大火烧了一天一夜，尸骨中不见天近人；裴白发下令封了天寿山，独自踏剑向西而去，归期成谜。"},{"n":267,"orig":267,"title":"小妈来了？","people":["桐庐","何霑","过冬","苏子叶","童颜"],"one_line":"白衣少女现身原来是过冬，一语道破何霑藏纱的秘密。","summary":"桐庐在菜园醒来，与绿脸的苏子叶同床对视，飞剑已断杀意难施。何霑介绍了这座只有青菜豆腐的宝通禅院：苏子叶在此治毒，童颜一直怀疑西海并首倡此事，也不瞒桐庐——西海剑派就是不老林。桐庐昏迷前记忆全失，无人知晓是谁把他送来。此时白衣少女不蒙面纱入屋，童颜惊呼「过冬师妹」——竟是水月庵的神秘大人物、连三月关门弟子过冬。她点破宝通禅院与水月庵同属一脉、离益州解毒最近，又对何霑说破他藏在庵后溪石下从未用过的法宝轻纱，众人悚然。"},{"n":268,"orig":268,"title":"我知道你们这些年想做什么","people":["过冬","童颜","何霑","裴白发","苏子叶","桐庐"],"one_line":"过冬自陈布局倒逼师长灭云台，联手裴白发谋刺西海剑神。","summary":"过冬道破天机：那晚篝火畔的烤羊与酒，道战上桐庐、童颜、洛淮南、过南山等人皆是她挑中并引导的年轻人，她借他们之手倒逼各派师长灭了云台。但真正的幕后黑手还活着——她要杀西海剑神。她把苏子叶与桐庐交给童颜设局，初子剑交桐庐以便回西海取信；盲眼的裴白发现身，只要童颜五年内确认西海剑神位置，他可在十里之内正面剑杀，约有四成胜算。何霑追问多年馈赠的缘由，过冬坦言：你母亲是我幼妹，我是你姨妈。"},{"n":269,"orig":269,"title":"有所得","people":["过冬","何霑","阴三","玄阴老祖"],"one_line":"过冬认下何霑是外甥，白城论道言天下人皆已着急。","summary":"过冬向何霑挑明身世：他本是水月庵弟子，生母是她幼妹，自幼被她送给兰溪师太抚养，当年所赠轻纱名为浣溪纱。何霑恍然自己竟有庵主级的亲戚，狂喜难抑。白城小庙前，过冬与庙中存在对谈：她多年培养年轻弟子是想让他们成为自己这样的人，逐一评点诸天骄得失，自认异数是少数，须多结同道，并断言所有人都开始着急了。海州乱礁间，玄阴老祖与阴三凭海而立，望着云台坠落后的大海，阴三只道有所得便是欢喜。"},{"n":270,"orig":270,"title":"摸鱼儿（上）","people":["阴三","玄阴老祖"],"one_line":"阴三自陈借南趋送出西王孙重掌不老林，取出精血玉册。","summary":"阴三向玄阴老祖摊牌：他脱困后径直去了南海，说服多疑的南趋送出弟子西王孙随他回大陆；西王孙从剑西来手中接管不老林，冥部助力也是阴三牵线，故对他深信不疑。南趋与剑西来都以为这位被青山幽禁数百年的遁剑者必然要报复青山，殊不知那本就是他的青山，他的敌人西海剑派必死。他要重掌不老林，只因斩通天路须握最锋利的刀。云台坠落海中后被正道搜刮一空，阴三却在巨礁暗格中取出一只匣子——里面是用精血写名的玉册，记着不老林真正的正式成员。"},{"n":271,"orig":271,"title":"摸鱼儿（中）","people":["井九","阴三","方景天","何渭","柳十岁"],"one_line":"井九推知师兄假手布局欲杀南趋，柳十岁未随青山回山。","summary":"阴三当面开启玉册，精血写就的名字意味着不老林仍有大批隐而未发的正式成员，剑西来根本无从动用。青山弟子自西海归来，昔来峰主方景天含笑旁观；果成寺僧众镇守通天井功成离去；何渭在玄阴宗峡口隐约感到煞意未散。神末峰上井九推演全局：师兄从剑狱脱身后假手南趋一脉布局——柳十岁入不老林、不老林刺杀赵腊月，皆为给自己毁灭西海制造理由，师兄真正想杀的是南海雾岛上的老家伙。井九不愿蹚浑水，只遣弗思剑径往大海深处；柳十岁并未随青山弟子回山，无人知其所在。"},{"n":272,"orig":272,"title":"摸鱼儿（下）","people":["柳十岁","小荷","巨人"],"one_line":"守雾巨人离去宝船重航，柳十岁归乡惊闻白早赴青山提亲。","summary":"弗思剑飞抵鸣泉秘境，守雾巨人见剑大喜，随即起身把万年古树抛入大漩涡，朝西方喊了一声，转身走向东方异大陆。次日蓬莱岛海风传讯，数千艘宝船扬帆启航——盯了群岛多年的海神终于离开。数十日后，柳十岁与小荷在商州烟雨湖垂钓小住，随后取道陆路返回青山。路过云集镇前，他遥望山下父母收拾莲叶的小院，仍不敢相认。镇上张灯结彩，居民争说中州派掌门独女白早亲赴青山提亲的盛事，二人对视失色：她要提亲的对象，难道是公子？"},{"n":273,"orig":273,"title":"回山","people":["柳十岁","小荷","过南山","白早","林无知"],"one_line":"柳十岁功成回山获众弟子相迎，白早求单独一叙。","summary":"柳十岁与小荷徒步回山，过南松亭时执事震惊失态。洗剑溪畔，年轻弟子们从畏惧观望到一声「师兄，您回来了」打破沉默，欢呼相迎；当年的冷眼者心怀愧疚，天光峰弟子更觉惭愧。过南山激动迎接，马华笑意勉强，简如云对小荷面露厌恶。掌门亲传弟子林无知与守在门外的小荷闲谈，一眼看破狐妖身份，笑言玄门正派不能纳妾、不如结成道侣。溪畔忽有柔柔声音响起，白早首次现身，请与柳道友单独说话，过南山等人知情未阻。"},{"n":274,"orig":274,"title":"谈判","people":["柳十岁","白早","简如云","过南山","小荷"],"one_line":"白早与柳十岁达成封口协议，柳十岁执意先上神末峰。","summary":"洗剑阁课室里白早与柳十岁谈判：洛淮南之事她已向两忘峰说清，但真相十年内不能外宣，中州派声誉不能由柳十岁背负，将给予足够补偿并亲赴神末峰征询井九意见。白早坦言传闻为真，她是真心想与井九结成道侣，柳十岁却同情地断言：你没有机会，公子不会带任何人走，通天大道向来独行。白早坦然离去，此后数年果然将杀洛淮南的风波压得无声无息。临行简如云忽然提起小荷另有事情要问，柳十岁心生不安，执意先上神末峰见公子，过南山含笑提起当年他走后井九大为生气。"},{"n":275,"orig":275,"title":"不懂","people":["柳十岁","井九","小荷"],"one_line":"柳十岁神末峰答问获赠仙剑，井九指点修行却不懂传闻。","summary":"柳十岁徒步登神末峰，猿猴掷花果相迎。井九开门见山问他十年后想法可变，柳十岁答：既然总要有人来做这些事，我还是得做。井九平静道：选择只要能承担后果，便在对错之上。柳十岁欲归还仙剑被拒，井九斥其想法怯懦，命他尽快提升境界，并指出他妖火、血魔功、西海剑法杂修致气息驳杂，建议去行云峰剑意焠体。至于小荷安置，井九只说会处理。柳十岁试探白早提亲之事，井九竟全然不知传闻，只当是普通拜访应酬，柳十岁暗叹公子什么都懂、唯独不懂此事。"},{"n":276,"orig":276,"title":"野竹","people":["柳十岁","小荷","顾清","白如镜","过南山"],"one_line":"柳十岁留小荷于神末峰，天光峰拜师却只闻争吵而出。","summary":"柳十岁问井九师长要问的事该如何应对，井九只道事情来了再说，提前想是亏。柳十岁把小荷留在神末峰由顾清照应，小荷瞬间收敛楚楚可怜之态，心里明白抓住柳十岁便抓住一切；顾清赞其精明，却点破她不如胡贵妃之处在于一个真字，小荷挑刺他铁壶煮毛尖不合章法。柳十岁随过南山等人上天光峰拜见师父白如镜——当年对他绝情的长老。洞府外那丛野竹已蔓生无人照料，屋内忽然传出激烈争吵与器物碎裂声，许久柳十岁独自走出，神情平静。"},{"n":277,"orig":277,"title":"如临大敌","people":["白早","成由天","越千门","井九"],"one_line":"中州派真实来意是邀庆典，提亲传闻背后有人推波助澜。","summary":"天光峰争吵缘由未明。碧湖峰内，成由天得知有人想借碧湖峰翻十三年前左易被杀的悬案，与长老商议后决定不蹚浑水。中州派此行实为邀请青山出席开派三万年庆典，领队的乾元谷主越千门地位极重，提亲传闻只是隐晦试探被人传扬开来，背后有人推波助澜。白早不为所动，遍游九峰；清容峰姑娘们敌意明显，认定小师叔根本不会想要道侣。次日清晨白早登上神末峰，井九、赵腊月、顾清、元曲与小荷悉数在场，洞府深处的白猫抱着寒蝉静观，不泄气息。"},{"n":278,"orig":278,"title":"白云扑面","people":["白早","井九","赵腊月","顾清"],"one_line":"白早借传闻试探终被回绝，赵腊月言井九视活着为己事。","summary":"神末峰以最正式的礼数接待白早，气氛刻意尴尬，赵腊月盛装出席只为礼数周全。白早道出传闻来由：母亲属意童颜而她不愿结侣，故借提亲传言脱身，也想替因她停滞六年的井九分担压力；若传闻成真，两派交好、正道联盟，有百利无一害。井九重申白城旧话：这不可能。白早代父母邀他赴中州开派三万年庆典，井九允诺到时候再看。临别论白云扑面，井九道云会散、云是假的，扑面也是假的，凡被时间终结的皆是虚无。崖畔白早与赵腊月对谈，赵腊月道：他坚信活着是一个人的事。"},{"n":279,"orig":279,"title":"看见悲凉","people":["赵腊月","白早","井九"],"one_line":"赵腊月自陈同修已足，井九点破大物认输之悲凉。","summary":"崖畔白早问出曾问过柳十岁的问题：真到了那天你不会失望？赵腊月答不会，能在通天大道上同行一段已是福份；她当年甚至不敢听井九道破真身，如今同修已然知足。白早身为未来掌门不能随心意来青山，赵腊月拍肩送别。事后井九直言白早是真心，但喜欢便是坏处：喜欢便舍不得，舍不得便离不开，何况这种事情很麻烦。他更点破各派大物广收天才弟子，是因确认自己飞升无望，留下因果尘缘作另一种生命传承——做出这个选择，便是认输。赵腊月忽觉难过：修道者悲凉莫过于此。"},{"n":280,"orig":280,"title":"很妖的一问","people":["方景天","柳十岁","井九","南忘","顾清"],"one_line":"方景天暗阻柳十岁受赏，云雾深处向妖影追问一的下落。","summary":"中州派离去，井九直言拒绝结亲，清容峰百宴上姑娘们醉叹一腔情义尽空付，南忘淡然道他无情无义像极了死鬼师父景阳。柳十岁的奖赏迟迟不下，小荷入青山受阻，更有人在暗中查他，过南山与昔来峰激烈争执——阻挠者正是峰主方景天。顾清想起那夜如临大敌的隐匿强者，向井九示警，井九只答我知道。方景天独入殿后云雾，沿石梁寻到一道妖异黑影，转述雷破云死前反复喊的话：没有一，那二呢？他称现已确定二在柳十岁身上，遂问黑影：一呢？"},{"n":281,"orig":281,"title":"阴凤大人要的证明","people":["方景天","阴凤","井九","赵腊月"],"one_line":"阴凤要方景天证明井九不是景阳真人，方景天应允","summary":"方景天在适越峰与昔来峰之间的石梁上求见镇守神兽阴凤，想借掌门与剑律失和之机行事。阴凤拒绝帮忙，说自己怕的是景阳真人，当年连太平真人都被他阴过一道；白鬼在神末峰乖巧异常，必是确认了井九的身份，故要方景天先证明井九不是景阳，证明不了便没有意义，方景天应允。他还道破元骑鲸早已破境通天却秘而不宣，认为生死大恐怖之前掌门与剑律的矛盾会激化，正是机会。事后井九收到画着锦鸡的竹牌，得知方景天又有动作，暗想他难道看不出自己已无任何机会。"},{"n":282,"orig":282,"title":"一人不得道","people":["井九","赵腊月","白猫"],"one_line":"井九揭秘当年内乱：镇守为「一人得道鸡犬升天」倒戈","summary":"赵腊月问太平真人为何很早便收下众多弟子，井九说那人不信尘缘因果，相信人多力量大，其真正想法令他至今想起仍觉寒冷。当年井九与师兄能镇压诸峰，除柳词与元骑鲸外，还因太平一句「一人得道，鸡犬升天」说动了尸狗与阴凤两位镇守；此后诸峰别脉长老或死或入剑狱或避入隐峰，青山只剩太平一脉。井九安慰赵腊月这只是内部纷争，不会轻言生死。白猫讥讽井九说没人喜欢他是因为嫉妒。井九难得流露孤单情绪，赵腊月答「现在不是有我们了吗」，他满意而笑。"},{"n":283,"orig":283,"title":"左易案的再变化","people":["井九","简若山","赵腊月","柳十岁","墨池"],"one_line":"墨池求开峰会针对柳十岁；简若山暗查左易案","summary":"井九思量柳十岁的麻烦：他青山剑道被废，又修过妖丹、血魔教秘法与雾岛剑法，体系冲突，迟早出事，天下能解决的地方只有五处，可借方景天发难之机把他送走。天光峰墨池长老征得九峰同意，求开青山峰会，名义议不老林后续，实为柳十岁之事，十日后召开，井九与赵腊月决定同去。七海郡监利城，两忘峰弟子简若山持青山剑牌到卷帘人医馆索要查访结果，大夫只说目标已死，拒绝解释是否灭口，将他逐出，随即把消息定为丙等火速送回朝歌城，暗惊青山内斗已到这步田地。"},{"n":284,"orig":284,"title":"破庙灭口","people":["简若山","段莲田","迟宴","简如云"],"one_line":"简若山查案被冥部魂火灭口；迟宴截段莲田回山","summary":"简如云一直怀疑柳十岁与左易之死有关，因怕青山有人遮掩，让弟弟简若山秘密出山查案。简若山在监利城卷帘人处确认对方也在遮掩，正欲回山时在破庙里被无色魂火偷袭——火遇真实火焰才显幽蓝，能直接侵噬金丹剑丸。他认出是冥部妖人，飞剑斩不中对方本体投影，魂火蚀破剑罡，把他烧成青烟残灰。上德峰长老段莲田也在重查左易案，循线索赶到，用明光鉴照出冥部妖人痕迹；破海境的迟宴忽然而至，只说「回去再说」，段莲田只能随他回山。"},{"n":285,"orig":285,"title":"慌了的人与不省心的人","people":["段莲田","迟宴","元骑鲸","井九","赵腊月"],"one_line":"段莲田供出有人匿名信指引查案；林黄岩是井九所杀","summary":"段莲田在破庙与迟宴对峙落败，被带回上德峰面对元骑鲸质问。他承认急着重查左易案是怕柳十岁回山后记恨当年用刑之狠，又道出线索：左易在卷帘人中的故交林黄岩已死，而林黄岩当年查的正是神末峰主，他用剑律名义调阅了卷宗。迟宴指出有人向他与简族各寄过一封无气息残留的信指引查案，段莲田才知自己被人当枪使，元骑鲸以「那么你也想死吗」警告。另一边井九得知赵腊月仍在暗中追查，说出林黄岩是自己当年准备杀洛淮南时顺手所杀，叹她真是不省心。"},{"n":286,"orig":286,"title":"吾峰不孤","people":["简如云","柳十岁","过南山","赵腊月","井九"],"one_line":"赵腊月仍想查飞升元凶；简如云公开针对柳十岁","summary":"赵腊月坦言查案是因为不甘心，想知道师叔祖飞升失败的元凶。井九说雷破云送雷魂木进剑狱是为救人，与飞升无关，左易之死便由此而来；方景天纵然有关，密谈也绝不会留证据，要查只能当面去问。简如云得知弟弟死讯，怒而驭剑回两忘峰质问柳十岁当年那夜行踪，与过南山、顾寒起冲突，坚称此事无人能压。青山峰会召开在即，殿外年轻弟子们陆续走向顾清、元曲与小荷表示声援，赵腊月已是最年轻游野境，井九声望更盛，神末峰看似孤立，实则渐得人心。"},{"n":287,"orig":287,"title":"事情来了","people":["方景天","柳十岁","简如云","墨池","井九"],"one_line":"峰会之上方景天借狐妖与嘉赏发难，简如云指证","summary":"青山峰会在昔来峰大殿召开，掌门与元骑鲸缺席，由方景天主持，他一改往日庸常笑脸，众长老首次见到其真实姿态。先议不老林善后与议功，皆无波折。随后墨池问起应城狐妖，方景天以「青山非藏污纳垢之所」定论，凭清天司案卷判狐妖免死但必须逐出青山，柳十岁沉默。墨池再问为何昔来峰阻止对柳十岁的嘉赏，方景天说因有弟子提出异议，唤出丧弟不久的简如云，指证柳十岁与十三年前左易之死有关。柳十岁望向井九，井九未语，事情终于来了。"},{"n":288,"orig":288,"title":"打死我都不说","people":["柳十岁","简如云","迟宴","井九"],"one_line":"柳十岁拒答当夜行踪，被押入剑狱待审","summary":"简如云指证柳十岁当夜不在洞府，弟弟简若山查案又死于冥部妖人之手，疑似灭口。迟宴主持问话，柳十岁只说简若山之死与己无关，对当夜行踪则拒绝回答，甚至去静室或面见剑律单独陈说也不肯，理由是不想再撒谎——他在谎言里活了十余年。殿内众人都等着井九表态，他却始终沉默。迟宴宣布既然如此便以命案嫌犯论处，把柳十岁押回剑狱，直到审出结果。柳十岁当年入剑狱什么都没说，如今依旧不服。消息传出，殿外青山弟子哗然。"},{"n":289,"orig":289,"title":"我在云集镇等你","people":["小荷","顾清","柳十岁","井九","赵腊月"],"one_line":"狐妖被逐出青山，顾清陪小荷在云集镇等待","summary":"元骑鲸定下处置：柳十岁下狱待审，狐妖逐出山门。赵腊月提出异议，请让神末峰把狐妖当客人留下，方景天以没有此规矩反对，井九起身问是谁说的，白如镜应声，井九看了一眼便转身离殿，柳十岁明白井九必能解决，只需小荷活着。小荷收拾行李离峰，顾清送她到云集镇，她鼓起勇气请求留下等柳十岁，顾清答应陪她等十天，带她进了赵腊月买下的酒楼。小荷想起柳十岁便会安心，狐妖不信感情，她却觉得顾清的笑容忽然可恶起来。"},{"n":290,"orig":290,"title":"花前，星下，尸狗","people":["井九","尸狗","元曲","玉山师妹","顾清","小荷"],"one_line":"元曲奉命访玉山师妹；井九密入剑狱问尸狗旧事","summary":"顾清在酒楼告诉小荷，此处是赵腊月第一次杀人的地方，并安抚她说柳十岁没把她当麻烦。九天后，元曲奉井九之命夜访上德峰，约出玉山师妹在星空下说话。井九则经隐秘通道潜入剑狱，收起全部气息见镇守尸狗，谢它多年辛苦，感慨柳十岁再像师兄也不是师兄。他一直想知道师兄当年如何逃出剑狱，尸狗答：人不是它放的，但它没有阻止；正如当年井九把太平关进来时它也没有阻止。井九默然，这是他与师兄之间的旧账。"},{"n":291,"orig":291,"title":"劝学","people":["井九","柳十岁"],"one_line":"井九救出柳十岁，劝他修行成为最强的人","summary":"井九走过剑狱通道，看见被囚六七百年仍活着的泰炉师叔，也远远望见当年自己亲手布下剑意囚禁师兄的牢房，确认太平真人是用雷魂木嫁祸冥部妖人逃走，闭死关实为被囚。他解开剑锁救出柳十岁，在剑狱这个最安全的地方劝他：柳十岁因去过黑暗，此生无缘掌门之位；师兄当年也是靠杀到无人敢反对才坐上掌门。井九劝他不必执着清除世恶，建立最稳固的秩序需要成为世间最强的人，随后交给他一封信，让他去果成寺化解体内驳杂气息。"},{"n":292,"orig":292,"title":"传经","people":["柳十岁","禅子","小荷","井九"],"one_line":"禅子受信传柳十岁禅宗真经，允诺闭口禅","summary":"井九原想让柳十岁在剑狱遇见尸狗、借其神通净化驳杂气息，机缘未成只得改去果成寺。他带柳十岁穿过剑狱进入隐峰——原来进隐峰必经剑狱，隐峰便是更大的剑狱。柳十岁与小荷乘顾家马车北上墨丘，禅子读到落款赵腊月的信，忆起当年梅会道战自己终究慢了一步、害许多年轻弟子枉死，遂接见柳十岁，从虚空抓出金色字符印成布帛，亲授果成寺不外传的禅宗真经，又允诺让知情人闭嘴。禅子反复读信最后一段，神情凝重，打算再送一封信去一茅斋。"},{"n":293,"orig":293,"title":"种菜","people":["柳十岁","阴三","玄阴老祖","小荷"],"one_line":"柳十岁种菜修行；阴三玄阴老祖藏身果成寺","summary":"果成寺安排柳十岁与小荷接手菜园种菜，隐秘度日。每日来取菜的杂役殷福实为阴三，他初见柳十岁便怔住；后厨的火工老人则是玄阴老祖，见柳十岁也大吃一惊。夜里二人相认，玄阴老祖疑心阴三那支骨笛是他隔绝青山大阵、连接神魂的手段，更惊骇阴三知道初子剑未寻回、苏子叶尸首无踪，怀疑他已联络上不老林残部，阴三只说自己是喜欢柳十岁这孩子才来。同期宝通禅院中，苏子叶毒素已净，桐庐已带初子剑赴西海，何霑问童颜为何放行。"},{"n":294,"orig":294,"title":"有毒","people":["苏子叶","童颜","何霑","方景天","阴凤"],"one_line":"苏子叶以丹毒保清醒；方景天与阴凤再辩井九身份","summary":"童颜向何霑解释，桐庐因对杀师愧疚不安，情绪外露反而最易取得剑西来信任，是合适的内应。苏子叶服下妖鹤红冠炼成的丹毒，靠剧毒换神魂稳固与清醒，何霑怒斥他会早死，苏子叶坦言邪修没有灵脉，唯有如此才能保持清醒、追求变强，不像父亲那样浑噩而活，童颜再度提议把正道宗派的灵脉分出来。另一边方景天对阴凤说，井九当年敢冒险救柳十岁，正是景阳会做的事；阴凤反驳那两个孩子只是障眼法，又称井九从进青山第一天起便毫不隐藏，方景天反问这难道不更可疑。井九躺在竹椅上认真想心事。"},{"n":295,"orig":295,"title":"智者","people":["井九","赵腊月","顾清","元曲"],"one_line":"井九自曝修行难题：飞剑与剑丸无法合一","summary":"井九自认善恶如浮云，唯一追求是飞升，能理解方景天报仇与雷破云求破境之心。赵腊月追问方景天曾请天近人杀他、上德峰是否可疑，井九答元骑鲸杀了雷破云，师兄弟之间又无证据；她问他何时能进破海境，他苦笑不语。随后他发现真正的麻烦：雪原寒洞六年为护白早不停燃烧剑火，真元始终以最低限度运行，如今剑观自识发现再无寸进可能——他的飞剑与剑丸无法合一。他召集弟子坦白此事，顾清元曲无从置喙，赵腊月也觉荒唐。"},{"n":296,"orig":296,"title":"沉思者","people":["井九","赵腊月","顾清","元曲"],"one_line":"井九封山闭关，静坐十余日想收剑之法","summary":"赵腊月劝井九闭关，井九解释自己随时可入道心通明，从不需要闭关，并点评天光峰卓如岁初入山门便闭关十余年、连赵腊月都未曾见过，不过是养望，等一个确认自己是青山年轻一代最强者的时刻；他还两次叮嘱赵腊月修行莫被卓如岁越过去。赵腊月剑书通知诸峰，以弗思剑启动禁阵封山。井九进洞府盘膝沉思，十余日姿势不变，宛如壁画仙人。某日他试收剑，莫仙师留下的铁剑无论如何催动都无法靠近身体，仿佛敬畏，甚至恐惧。"},{"n":297,"orig":297,"title":"吞剑者","people":["井九","柳十岁","小荷"],"one_line":"井九七十余法尽败，以离魂秘法试剑重伤","summary":"井九前世承意境圆满时便预知收剑难题，入无彰境后果然无法把铁剑收入剑丸，只能背剑而行。游野境需神魂附于剑丸与飞剑共养、生出剑鬼，收不了剑便无法前行，他静思想出七十余种方法全部失败，确认自己修的剑道与朝天大陆所有剑宗不同，必须另立新道。他冒险用血魔教离魂秘法让神魂离体落向铁剑，结果神魂受创，痛苦放大无数倍直透意识，喷出一口鲜血，他却平静调息无碍，只是忧虑连柳词与元骑鲸也解决不了这道难题。同期果成寺里，柳十岁读经毫无进展，体内真元骚动将发作。"},{"n":298,"orig":298,"title":"师者","people":["柳十岁","阴三","小荷"],"one_line":"杂役阴三为柳十岁讲经，一句忘经点化","summary":"柳十岁真元冲突咳嗽发作仍不肯求助，阴三取菜时察觉，柳十岁福至心灵把禅子所授真经布帛请他看。阴三看出他的困境，只说「不是很难」，随即逐段讲经，字句浅白、善用比喻，如私塾老先生，柳十岁听得如痴如醉，小荷由警惕转为敬服，每备茶相送。十余日后经文讲毕，阴三留下点睛一句：懂得之后要把经文忘却，方是经中真义。柳十岁识海天光乍现，当场入定，醒来后阴三已杳。他不知这位殷福先生实为藏身果成寺的前代高人。"},{"n":299,"orig":299,"title":"逝者","people":["柳十岁","小荷","阴三","禅子"],"one_line":"柳十岁除夕遥祭故人；阴三白山室饮水如酒","summary":"禅子感应到菜园方向的灯花，派渡海僧暗中查看，不惊动柳十岁。柳十岁入定三天醒来，发现殷福已三日未至，去灶房打听，寺里竟无人认识此人。除夕夜小荷做了满桌好菜，柳十岁多摆两副碗筷，祭奠严先生与西王孙两位故人，说公子从不过年。原来殷福是阴三，与玄阴老祖藏身果成寺白山静修室：他是修行界最出色的老师，亲手教出三个通天却都背叛了他，多年未曾授业，因想念教人之乐才冒险为柳十岁讲经；他求的是生灭而非空色。除夕钟声里他感慨逝者如斯，饮清水如酒，道一声须尽欢。"},{"n":300,"orig":300,"title":"临兵斗者","people":["井九","赵腊月","白猫","过冬","刀圣"],"one_line":"井九百日无果决另立新道，携白猫赴朝歌城","summary":"白城过年，过冬与刀圣谈及果成寺这一代没有蹈红尘传人，过冬属意何霑，刀圣表示会写信回寺。宝通禅院只剩何霑与童颜苦等，云梦山白早与掌门父母一年一度共进年饭。神末峰积雪中井九出关，承认百日之内没能解决收剑难题——修行不是精诚所至，必须另立新道。冥部与人间生命本质相通，他决定去朝歌城找朋友帮忙，只带白猫阿大同行，对其说出一个「斗」字，白猫态度立变应允，井九还说会把它交托给它不喜欢的那位。这个斗字是星斗之斗还是临兵斗者之斗，无人知晓。"},{"n":301,"orig":301,"title":"再至朝歌城","people":["井九","白猫","井商","赵腊月"],"one_line":"井九携白猫赴朝歌城，欲入太常寺学魂火之御","summary":"夜里井九把五段成熟的雷魂木投进剑狱，尸狗如藏骨头般收好。翌日他抱白猫乘铁剑独赴朝歌城，赵腊月察觉他难得地急迫：师兄逃离剑狱比他重修早一年，他原本笃定能追回，如今转世金轮之法遇到难题，便想到冥部最高阶秘法魂火之御，而此等强者只有镇魔狱里才有，其入口便是太常寺。他经卷帘人医馆问明路径，入住井府，见到井商一家与已长大的名义侄儿，一句笨拙的「吃了吗」表达善意，准备夜见鹿国公。"},{"n":302,"orig":302,"title":"皇位继承的问题","people":["井九","鹿鸣","胡贵妃","鹿国公"],"one_line":"景辛声望渐隆，青山已暗中力挺胡贵妃之子","summary":"井九从鹿国公世子鹿鸣处得知朝局：景辛皇子并未被废反而声望渐隆，因他母妃是中州派白真人的爱徒，中州派全力支持；一茅斋则明确反对胡贵妃之子。胡贵妃原本腹背受敌，日子却还不算难过，只因五年前起赵家年年送礼——青山宗罕见地表明了态度，中州派与一茅斋也不得不重视。井九想明白这是赵腊月与柳词、元骑鲸默契的布局，自嘲真该把顾清带来。当夜他入皇城见神皇，御书房中一场对话后，他提出要见那位小皇子。"},{"n":303,"orig":303,"title":"亮剑","people":["井九","胡贵妃","景尧","鹿国公"],"one_line":"井九定景尧拜师顾清，宣我要进太常寺","summary":"井九夜访胡贵妃，看她怀里刚睡醒的小皇子景尧，问他喜欢什么，小家伙答黄饼，井九以真、慧、缜三字点评，令胡贵妃喜不自胜。随后他提出让景尧拜入青山门下，胡贵妃以为是井九亲自教，井九说辈份不对，选定的师父是顾清，胡贵妃想到当年被顾清刻薄讥讽，本想拒绝，终究应下。井九写信让鹿国公安排顾清进宫，先带景尧读两年书——这便是青山直接亮剑。鹿国公问还需要自己做什么，井九说出令他头皮发麻的话：我要进太常寺。"},{"n":304,"orig":304,"title":"入太常寺","people":["井九","鹿国公","白猫"],"one_line":"井九留白猫守井家，自称快则三年出太常寺","summary":"鹿国公极力劝阻井九进太常寺，问明了两个不确定的答案——进到第几层不确定，快则三年、慢则更久，顿时心灰。井九安抚白猫：带它同去必然被那位发现，不如留下替他盯着井家，防中州派与一茅斋施压，并道出「斗」的真意——景尧当上神皇便是他与中州派分出胜负，胜过几千年分不出高下的生死相搏。白猫应下，承诺若井九出事便缠住对方给他逃生的机会。随后一辆蒙着黑布的囚车穿过清天司夹道，把井九送进了太常寺深处，鹿国公袖藏中州派法宝斜风细雨，终究没敢拿出来。"},{"n":305,"orig":305,"title":"下镇魔狱","people":["井九","鹿国公"],"one_line":"镇魔狱即在太常寺地底，井九自解禁制潜行","summary":"鹿国公自请坐镇太常寺，又把世子鹿鸣外放南河州三年避祸。黑车驶入太常寺地底——世人皆知镇魔狱，鲜有人知它就在太常寺下，由鹿国公打理，可见神皇信任。井九入狱先受一道可怕神魂威压洗礼，他装作被震至昏迷，被玄金傀儡拖入第一层囚室；狱中囚犯多被那道威压震碎精神，日夜说着谁也听不懂的话。他带着两把钥匙、早知阵图解法，无声无息解开元气锁走出囚室，如幽灵般穿过层层黑暗，跳下断崖，落入第二层。"},{"n":306,"orig":306,"title":"见五彩人","people":["井九"],"one_line":"井九穿毒潭入太常狱，寻得五彩衣冥皇","summary":"第二层名为终日狱，酷热难当、绿雾剧毒，井九的白衣被蚀成丝缕，只见大妖白骨沉在剧毒水潭里。他判断通往下一层的通道就在潭底，遂潜入毒水，穿过石缝来到第三层太常狱。此地与天地完全隔绝，没有时间与空间的概念，只有一条通往深渊的罡风通道，他绝不踏入，而是凭冥皇之玺与本体的玄妙联系，在无方位的黑暗里漂流多日，终于寻到目标——一方彩色天地里，一个浑身藏着光、穿五彩衣的冥部妖人正在给树浇水。"},{"n":307,"orig":307,"title":"学冥皇法","people":["冥皇","井九"],"one_line":"井九见冥皇自称师侄，求传绝密魂火之御","summary":"那人便是冥皇——前任冥皇唯一的血脉，尚未登基便被人族擒住。他六百年不见活人，开口便是人族语言，令井九暗赞。井九自称太平真人弟子，冥皇让他以叔父相称。井九直陈来意：求传魂火之御。此法是冥部最高阶秘法，历代只有冥皇可学。他解释缘由：世间剑鬼元婴皆随主人修行成长，而他的剑鬼只能自行修行，这种法门与修行规律根本冲突，从无先例；但魂火之御里的御字是驾驭，魂火能驾驭自身，那么剑鬼或许也能——这便是他苦寻的剑鬼修行之法。"},{"n":308,"orig":308,"title":"说从前事","people":["冥皇","井九"],"one_line":"冥皇忆遭太平背叛往事；井九自认背叛师父","summary":"冥皇质疑井九凭什么断言剑鬼只能自修，井九不肯吐实。冥皇于是讲出旧事：六百年前太平真人叛出青山入冥，与他结为好友，劝他为冥部万世太平来人间谈判，谈判决裂，人族翻脸将他擒入镇魔狱，这就是他全部的下场。井九转述师兄当年自辩「只是顺势而行」，又告知太平如今也被囚剑狱，而且是被自己背叛——井九亲口承认。冥皇大笑太平也有今天，情绪稍平。井九开条件：他日入冥传冥皇功法给继承者，助冥皇传承延续；冥皇问他冥皇之玺是否在身，井九答「我不愚蠢」。"},{"n":309,"orig":309,"title":"做简单人","people":["井九","冥皇"],"one_line":"井九点破太平操控冥部，以传玺之诺谈条件","summary":"井九点破冥部如今仍受太平操控：魏成子被灭口、浊水鬼目鲮等事背后都有冥部影子，太平三百年前再入冥立下威望，一旦恢复实力必然挑动冥人与人间开战。他以此劝说冥皇：冥师打着冥皇名义拒绝再立新皇，太平一定不会容许冥皇传承延续；而你终究会死，井九承诺境界足够后持冥皇之玺入冥，传功给冥皇指定的继承者。他自省把谈判弄复杂了，索性任由冥皇施为。冥皇推断井九身上带着与玺心神相连之物，一面拖延一面以魂火布网困他，井九早看破，只让他把想做的做完。"},{"n":310,"orig":310,"title":"同天地大","people":["井九","冥皇"],"one_line":"井九硬扛魂火之刑，体内空间大如天地","summary":"冥皇魂火化网困住井九，提出交出冥皇之玺或者死。井九不逃不辩，以最笨的办法用剑意硬撑，在无形魂火中承受了不知多久的灼烧——这是他重生以来最大的危险，消耗的精神不比雪原六年少，躯体如受刑般痛苦，他却撑到了最后。冥皇趁机用冥河之手搜遍井九，竟在一个比天地还大的空间里找到冥皇之玺，却根本带不出来，惊问缘由，井九答「天地本应这般大」。冥皇杀他不得、夺玺不能，沉默良久，道出一句：原来你也是失去了一切的人。"},{"n":311,"orig":311,"title":"镇魔狱的蚊子","people":["井九","冥皇"],"one_line":"冥皇提荒唐条件：替他解决打不死的蚊子","summary":"冥皇同意传授魂火之御，条件却荒唐至极——帮他对付镇魔狱里打不死的蚊子。太常狱与天地隔绝、永世不变，蚊子作为其中一部分也不会死，六百年来日夜叮咬，连冥皇都苦不堪言。井九这才明白阿大当初拒绝同来的理由之一便是蚊子太多。他查看后确认蚊子之小超出想象上限，剑意力量都无从斩中。冥皇透露这些蚊子惧怕雷威，这话是从太平真人口中听来，井九闻言暗示自己携有青山雷魂木，冥皇神色微变，两人各怀心思，一桩交易就此有了雏形。"},{"n":312,"orig":312,"title":"春天正是读书天","people":["井九","冥皇"],"one_line":"清心铃驱蚊，冥皇开讲魂火修行九境","summary":"井九识破冥皇已想到脱困之法——雷魂木加转魂之法便可借第二层囚徒逃离，暗惊其智谋不逊师兄。他教冥皇大泽风雨道法刻入阵图，又把瑟瑟所赠的清心铃悬入云中，铃声引出筷子粗细的小闪电，雷威终于镇住蚊群。冥皇满意后正式开课：魂火并非自生，冥部妖人须入冥河试炼寻找自己的冥火，纳入体内称为拥火，再将冥火融入血脉生成魂火，如此逐境递进。井九听得极认真，青翠山谷里铃声与讲经声相和，大好春光正好修行。"},{"n":313,"orig":313,"title":"静斗道字一闪念","people":["冥皇","井九","鹿国公"],"one_line":"魂火之御倾囊相授，二人推演剑鬼新道","summary":"冥皇讲明魂火九境，而魂火之御不在九境之内：须切割一块记着秘法的神魂，用火琢之法烙进离体魂火，让其自行修行。此法极度危险，魂火可能自生灵智断开主魂化作妖火，一旦外泄冥部恐将灭族，故为冥皇绝密。冥皇要求发血誓，井九答血誓可破，冥皇索性直接开讲。此后二人反复问答推演，要把魂火之御改造成剑鬼自修之法，冥皇惊觉井九学识智慧犹胜当年的太平，兴奋投入，两人常沉默对坐，如阴云中两道身影激烈辩论。同期太常寺里，鹿国公听闻国公府传来「碗破了」的信号，霍然惊醒。"},{"n":314,"orig":314,"title":"听碗 玩猫 宣官","people":["鹿国公","顾清","白猫","井梨"],"one_line":"顾清入宫为帝师；白猫暗中教井梨修行","summary":"碗碎信号确证后，鹿国公等待顾清。顾清因青山内部对涉入皇位之争争执激烈，迟至赵腊月出面拍板才获准离山，赶到朝歌城时已误了多日。他在井宅夜遇归来的白猫，又撞见小侄儿井梨与白猫玩骨牌，更吃惊地发现白猫竟在教井梨修行的玉门吐息法。次日顾清随鹿国公大朝会前入宫，青山仙师成为二皇子先生的消息传遍朝歌城，青山正式亮剑，只是各方都猜不透真实意图；至于井九在镇魔狱中情形如何，鹿国公想都不敢想。"},{"n":315,"orig":315,"title":"知徒莫若师","people":["顾清","景尧","胡贵妃","阴三"],"one_line":"景尧服软拜师；阴三推知井九身在太常寺","summary":"顾清入宫拜见神皇，再到贵妃寝宫与景尧见面。三岁的小皇子聪慧过人，感知到母亲不喜顾清，便不肯先行礼，顾清便如春风般静立不动，以大欺小耗到孩子双腿发软险些跌倒，多嘴的嬷嬷被胡贵妃借机掌嘴处置，景尧终于带着哭音行礼，拜了先生。果成寺里，阴三从不老林密报得知井九去了朝歌城，瞬间想通：井九也遇到了修行问题，无彰到游野必会撞上那道坎，而他早想通多年。他笑着推断出井九的所在——原来你在太常寺。"},{"n":316,"orig":316,"title":"如何安度晚年？","people":["阴三","玄阴老祖","童颜","何霑","过冬"],"one_line":"阴三欲往太常寺；童颜定下杀剑神之局","summary":"阴三收拾佛经准备远行，说佛经示警「看见生灭，便不得解脱」，玄阴老祖请缨代跑，阴三警告「你去那里会死的」，实则不许他离开自己视线。宝通禅院里，童颜完成过冬布置的功课——刺杀西海剑神的方案：通天境大物只能由裴白发这样的通天者出手，他所做的是为裴白发选出战场并设法把二人送进去，成功率约四五成；过冬若参与可提至八九成，但她自言还需二十年恢复，而裴白发只剩三年寿命。过冬决定带何霑去果成寺。"},{"n":317,"orig":317,"title":"睡美人","people":["童颜","井九","冥皇"],"one_line":"井九沉睡印证新法，身如魂火悬浮惊冥皇","summary":"童颜下山，想到裴先生是明知必死仍要求战，又听闻井九境界停滞云游在外，他相信算无遗策的井九离开青山前必已算清一切，转而自问：还有最后八百年生命，自己该做什么。镇魔狱里，井九与冥皇的讨论终于结束，他已掌握魂火之御并推演出剑鬼自修之法的雏形，接下来要在意识最深处印证道法，于是躺在竹椅上陷入沉睡，托冥皇有事叫醒。数日后冥皇发现他的身体离开竹椅两指宽，如魂火般稳定悬浮，大感震惊，隐约生出一个猜测，走向断崖面对真实的混沌黑暗，做出决断。"},{"n":318,"orig":318,"title":"岂为一己之不遇乎","people":["顾清","向晚书","景尧","胡贵妃","冥皇"],"one_line":"景尧受教读书；中州派向晚书试探顾清","summary":"冥皇做出决断，气息增强，显然是要全力助井九成事。朝歌城深冬暴雪，景尧每日天不亮便在雪地里蹲步练拳，胡贵妃心疼却不敢干预；顾清只教读书与自我控制，尤其是控制过人的聪慧。顾清出宫途中感慨朝歌雪灾无人救援——修行界各有理由置身事外——随后被中州派掌门亲传弟子向晚书拦下请吃饭。向晚书已入景辛皇子府，直言听闻神末峰事务皆由顾清打理，试探青山为何介入皇位之争；顾清只答神末峰欠胡贵妃一个人情，再无多话。"},{"n":319,"orig":319,"title":"红尘白雪，找你麻烦","people":["梁太傅","景辛","顾清","白猫"],"one_line":"不老林持旧事证据威胁景辛，逼其写罪己信","summary":"顾清回井宅，发现白猫已教井梨修起玉门吐息法，暗自吃惊。另一边，一个胖掌柜持空白拜帖见到景辛皇子与梁太傅，自报九年前受清天司施丰臣所托办事，暗示当年赵腊月遇刺一事牵连皇子——证据足以令一茅斋倒戈，更会让青山取皇子性命。景辛独自出来面对，自认此生只做错过这一件事，与太傅商定：亲笔写信将前后细节送呈云梦山白真人，此事绝不能让一茅斋知道，梁太傅则去私下联络斋主布秋霄。"},{"n":320,"orig":320,"title":"信","people":["梁太傅","鹿国公","顾清","柳十岁","小荷"],"one_line":"不老林求送信入太常寺；顾清移樽果成寺求教","summary":"两年后不老林再提条件：送一个人进太常寺，只为给里面某个人送封信，送信人自知必死，胖掌柜甘愿赴死。鹿国公守着太常寺两年，井九音讯全无。景尧年长两岁，顾清教他修行遇到难关——神皇血脉与狐妖传承纠缠——胡贵妃一窍不通，顾清索性把求援信从神末峰改投果成寺。柳十岁与小荷接信，小荷抱怨一番仍认真作答；柳十岁则常去寺前帮忙，各地病人客死墨丘者众。寺中日常依旧，玄阴老祖给相熟的胖僧人送去一条烤狗腿，笑称自己最擅长做狗腿。"},{"n":321,"orig":321,"title":"就是三年","people":["鹿鸣","鹿国公","景辛皇子","井九","冥皇","井梨"],"one_line":"鹿鸣回京探局势，井九三年期满于镇魔狱中醒来","summary":"鹿鸣三年任满回朝歌城，被旧副手顾盼拦住引见景辛皇子。皇子诉说自己对神皇忠诚无碍却始终不受信任，这番话实是说给鹿国公听。鹿国公分析局势：一茅斋支持景辛，中州派请炼虚长老越千门坐镇皇子府，青山宗因井九迟迟不现身而态度暧昧。井梨与墙那头的邻家小姑娘闲聊，白猫静静望向太常寺。太常寺地底青翠山谷里，井九三年之期已到，从静悬中醒来，气息变得轻清似仙；冥皇也恢复了远超三年前的实力。"},{"n":322,"orig":322,"title":"时间洪流前的对话","people":["井九","冥皇"],"one_line":"井九点破蚊子机关真相，冥皇托付后事","summary":"井九点破冥皇的软肋：镇魔狱里的蚊子是太常狱的机关，每日吸走一粒魂火经罡门送入深渊，向冥部证明他还活着，冥皇根本无力驱赶。如今三年没有魂火送下，冥部认定他已死，将另立新皇、断绝往来。冥皇甘愿被臣民遗忘，视之为身为帝王的代价。井九说出自己曾见数万飞剑在星辰间燃烧的画面，许诺代他多看几眼；又告知太平真人当年确曾谋划救他，盼他终得平静。冥皇托付井九：将来若有无玉玺无魂火之御者自称新皇，便去杀他。"},{"n":323,"orig":323,"title":"镇魔狱里来了一只鬼","people":["井九","冥皇","老人","景辛皇子"],"one_line":"冥皇赠枝命名幽冥仙剑，景辛密信惊动守狱老人","summary":"冥皇折下花枝赠予井九，为井九以魂火之御自创的剑鬼之法取名「幽冥仙剑」。井九回到镇魔狱第三层，种下花枝、收走部分蚊子，飘然离去——他帮冥皇驱蚊，等于给了对方重获力量的机会，只因他尊重生命最后的选择。另一边，景辛皇子借清天司送一封信入镇魔狱，信文只有一句「镇魔狱里来了一只鬼」。守狱的发光老人取信后，将送信的中年人扔进剧毒碧潭腐蚀殆尽，只盼这只「鬼」能让自己吃饱。"},{"n":324,"orig":324,"title":"钟声因何而鸣","people":["井九","阴三","玄阴老祖","老人"],"one_line":"阴三布局欲借苍龙杀井九放冥皇","summary":"老人在碧潭边守候多日，抓来一名邪道高手撕臂吞食果腹。井九自潭底带回浸泡三年、吸饱潭毒的铁剑，以剑罡遮脸现身，老人垂涎欲滴。果成寺里，阴三向玄阴老祖承认入狱之信是他布局：信经景辛皇子与中州派之手，必然送到苍龙眼前；他要的局面是井九死、苍龙绝、冥皇出，朝歌城必迎地震。他唯一不清楚的是太常狱情形，只能在塔林安放佛经，听着钟声默祷：只能靠你自己了，除了我，人间没有谁会帮你。"},{"n":325,"orig":325,"title":"龙牙之痛","people":["井九","苍龙"],"one_line":"苍龙欲吞井九，龙牙反被崩裂","summary":"井九浮出毒潭，取回浸泡三年吸饱潭毒的铁剑，以剑罡遮脸现身。老者正是中州派镇山神兽苍龙的神魂：按白先人所定协议它只可吃狱中死者，却长年违背协议捕食活人增延寿元。苍龙认出青山剑法，要将井九养到最佳状态吞食，再以搜魂术凌迟其神魂取记忆。井九平静宣告：你欲加给青山弟子的所有痛苦，都将回赠于你。龙牙咬下竟应声崩裂，井九趁隙遁走，留下一句「这只是开始」。"},{"n":326,"orig":326,"title":"幽冥仙剑的第一次登场","people":["井九","苍龙"],"one_line":"幽冥仙剑首秀，井九借追杀适应新身法","summary":"井九以魂火之御为根基的幽冥仙剑首次现世：身如无形之火，瞬息数里，鬼魅般避开苍龙的天地合围。苍龙据镇魔狱主场之利倒转天地、捏碎空间、拉塌山崖、纵起火海，井九数度负伤却越战越快——他是在借这场追逐急剧压缩新身体的适应过程，等于拿大乘神兽当陪练。苍龙用尽天地遁法仍抓他不住，推测这青山弟子是柳词关门弟子卓如岁，井九什么也不承认。"},{"n":327,"orig":327,"title":"互相伤害的龙与剑","people":["井九","苍龙"],"one_line":"井九以毒剑伤苍龙本体，双方互不相让","summary":"苍龙以「私会冥皇、勾结冥部」的死罪相胁，许诺井九说出目的便饶命，井九不允，反点破要害：镇魔狱天地即苍龙本身，攻击其中任意一处便是伤它本体。他随即把吸饱碧潭剧毒的铁剑刺进石崖裂缝，剧毒顺着伤口蔓延，苍龙痛不欲生、毒患溃烂。苍龙恼羞成怒，不顾内伤动用大乘期神通，雷电罡风齐下，将井九轰得耳中流血、喷血呕红；井九重伤垂死，仍反手一剑再刺进山崖。"},{"n":328,"orig":328,"title":"朝歌城的地震","people":["鹿国公","越千门","金明城","张遗爱","井梨"],"one_line":"朝歌城震动，神皇下令全城撤离","summary":"清晨前的朝歌城突发地震，鹿国公与清天司指挥使张遗爱确认震源就在太常寺地底十七里处。中州派乾元谷主越千门赶到，要求入镇魔狱查看苍龙安危，被鹿国公以太常寺管辖权与中州派法宝斜风细雨拦阻，皇城供奉金明城又奉神皇旨意封禁：非亲笔旨意与鹿国公同意，任何人不得擅入。神皇随后传旨撤离朝歌城所有人，修行者与飞舟协助疏散。井梨随井宅离城，终究没等到白猫出现。"},{"n":329,"orig":329,"title":"等待冥皇","people":["井九","苍龙","神皇","胡贵妃","顾清"],"one_line":"井九重伤被擒，所求只是时间","summary":"皇城内顾清强自镇定，照常指点景尧皇子修行，心里却疑心异变与师父井九有关。神皇安抚胡贵妃，把一枚朱雀玉卵交给她暖着，让她看看何时能孵出小朱雀。镇魔狱第二层，重伤垂死的井九落入苍龙之手，苍龙得意洋洋逼他求饶。井九平静道破：我求的不是痛快，是时间——他以幽冥仙剑周旋至今，就是在等冥皇现身。苍龙悚然回首，望向连它自己也无法感知的镇魔狱深处。"},{"n":330,"orig":330,"title":"他在凝视深渊","people":["冥皇","井九","苍龙"],"one_line":"冥皇渡过时空之河，决意赴死而出","summary":"井九早把一切算清：师兄算到他潜入镇魔狱并通知中州派，他索性顺势而为，借震动促成全城疏散，再等冥皇。青翠山谷中，冥皇取出银铃、踏散阵法，将疯狂来袭的蚊子尽数电杀，随后一步跨过时空之河抵达彼岸——真实世界的镇魔狱通道。他看到井九留下的花枝，神魂归一，放声大笑：当年被仙箓所伤无法回归下界，此刻出去必遭人族强者围杀，他仍义无反顾飞向通往深渊的通道，凝视深渊，深渊也凝视着他。"},{"n":331,"orig":331,"title":"镇魔狱里走了一只鬼","people":["神皇","越千门","鹿国公","胡贵妃","井九"],"one_line":"神皇传谕诸派来援，井九破洞而出","summary":"朝歌城地震不止，越千门强求入狱被金明城率神卫军拦住。神皇一面令中州派仙师协助撤民，一面传谕诸派速来朝歌增援——只因云梦山离朝歌城太近。他向胡贵妃道破秘辛：千年前飞升的白刃正是中州派掌门，元骑鲸早已通天却隐瞒多年，故中州派才是世人心中第一玄门正宗。若井九出不来，他准备亲自出手摧毁梅会规则。此时太常寺地面出现边缘光滑的圆洞，天上一个小黑点数息间消失再现，快得绝非飞剑。"},{"n":332,"orig":332,"title":"苍龙现世","people":["井九","苍龙","鹿国公","神皇","胡贵妃"],"one_line":"镇魔狱即苍龙本体，真身破地而出","summary":"苍龙选择追杀井九而非对付冥皇——它坚信冥皇困在腹中永世难出，还自称是故意放井九出来再杀。太常寺地底涌水抬升，整座寺离地而起，苍龙现出真身：原来太常寺黑檐就是龙角，镇魔狱即是苍龙本体，狱中囚徒尽数关在它巨大身躯里。朝歌城震动，鹿国公瘫坐于地忧心井九，胡贵妃紧捧朱雀玉卵。井九直上高空，轻而易举穿过朝歌城大阵，紧追的苍龙却一头撞上大阵，轰出漫天裂痕。"},{"n":333,"orig":333,"title":"神龙见首不见尾","people":["井九","苍龙","神皇","刘阿大","胡贵妃"],"one_line":"神皇备战苍龙，井九入虚境忽然停身","summary":"苍龙强行撞破朝歌城大阵，喷出本命龙息，极端低寒冻结井九所过之处，而井九在雪原与上德峰历练多年毫不畏惧。神皇取出朱雀玉卵准备吞服迎战，自知最好也只是惨胜，已在盘算战后请青山果成寺、册立白早为中州派掌门等一整套后手。废墟里白猫刘阿大紧盯苍龙，等它身体完全离地、露出尾部罡门弱点，并坚信井九冻不死。二者穿过罡风进入虚境，井九忽然停下回首，对苍龙说「就到这里了」，苍龙竟也随之停住。"},{"n":334,"orig":334,"title":"龙回头","people":["苍龙","越千门","刘阿大","向晚书"],"one_line":"苍龙尾部被钉，失控坠落重创朝歌城","summary":"苍龙低头看见自己身躯，发出凄厉龙啸——尾部被某种力量钉在地底，整条龙躯被拉长变细，如皮筋绷至极致。太常寺外众人看龙躯变细，越千门疑心镇魔狱最深处有力量拽住龙尾，与两位皇家供奉如临大敌。苍龙神魂失控松劲，龙躯缩回地底，本体自高空失控坠落，砸毁朝歌城大片街道，酿成最猛烈的一次地震。刘阿大捂眼不忍再看；越千门只见洞中湖水狂暴，一根龙须无力地动了动，沉了下去。"},{"n":335,"orig":335,"title":"亿万个小冥皇","people":["冥皇","苍龙","越千门","谈真人"],"one_line":"冥皇以魂火之御烧灼苍龙内伤求谈","summary":"冥皇立于通往深渊的通道尽头，深情凝望下界，以深情为力化作铁锚，把苍龙尾部死死钉在地底深处。苍龙神魂老者带伤寻至，见冥皇真已脱出太常狱。冥皇挥袖放出无数小冥皇模样的魂火，钻入井九剑伤与潭水侵蚀的每一道裂口烧灼——这才是真正的最高阶魂火之御。老者痛彻心扉，终于放下姿态求谈。地面上，一茅斋强者许书生报出「十七息」，中州掌门谈真人将以天地遁法最高境界降临。"},{"n":336,"orig":336,"title":"七大派齐至朝歌城","people":["布秋霄","谈真人","神皇","柳词","顾清","景尧皇子"],"one_line":"诸派掌门齐至，神皇闭阵示威后放行","summary":"一茅斋主布秋霄驾镇派之宝龙尾砚先至，中州掌门谈真人现于西方天际，却与禅子一同停在未开放的朝歌城大阵之外——神皇故意不解阵以示对峙，直到禅子莲驾现于墨丘、青山掌门柳词的剑意自南方而至，大阵才开放。柳词到场时神皇挑了挑眉，鹿国公看出那是真正的放松。皇城里，顾清给景尧皇子讲解七大宗派渊源与亲疏站队，直言神皇就是要做让各宗派不高兴的事，又劝胡贵妃将受宠嬷嬷送回乡保命。"},{"n":337,"orig":337,"title":"人间与冥皇的第二次谈判开始了","people":["冥皇","苍龙","顾清","胡贵妃","景尧皇子"],"one_line":"冥皇开条件谈判，苍龙却骤然发难困其于石壶","summary":"顾清点破当年梅会之盟的用意：七大宗派与皇族彼此制衡，而神皇偏爱行让宗派不高兴之事。镇魔狱中，冥皇与苍龙神魂正式谈判，开出条件：撤去蚊子、还他一片真正的青翠山谷、给他一个能对话的人——最好是族人，不要云梦山的，若青山来人便要青山人。老者称无权应允，请冥皇随自己上到神识可及处与外界强者直接谈。冥皇破潭而出时，老者却骤然发难，把天地急剧缩小成封闭石壶，将他困入其中。"},{"n":338,"orig":338,"title":"壶中天地","people":["冥皇","苍龙"],"one_line":"苍龙耗三百年修为困冥皇，反被夺神魂之柄","summary":"苍龙以耗损三百年修为为代价，施展白家神通壶中天地，将冥皇连同碧潭封入封闭石壶，欲吞下冥皇从此天下无敌；井九在它眼里只是送到嘴边却吃不下的猎物。潭水如胃液般侵蚀冥皇的魂火护罩，生死关头冥皇反手抓住老者手腕，二者血肉渐渐相融、再难分开；老者惊觉自己根本无法离开，冥皇淡然道破：论对神魂的控制，天上地下我第一。这才是真正的魂火之御，老者第一次尝到了被吞噬的恐惧。"},{"n":339,"orig":339,"title":"白沙在涅","people":["冥皇","苍龙"],"one_line":"苍龙以为吞掉冥皇，实则冥皇已入其神魂","summary":"老者认定相融与吞噬皆是冥皇制造的幻觉，搅动潭水成漩涡，将冥皇肉身蚀散至只余金玉骨骼；开壶后镇魔狱中魂火尽数消散，他认定冥皇已死。老者吞纳冥皇遗留的能量，狂喜自觉将要飞升，笑声却陡然被止住——「你的欢喜从何而来」竟从他口中自己说出：冥皇早已寄居其神魂之内，他双手变得白秀、眉毛悄然消失。冥皇坦言从一开始就没想活，如今只想带着苍龙一起死。"},{"n":340,"orig":340,"title":"不甘心的刘阿大以及某些隐意","people":["井九","苍龙","刘阿大","柳词","神皇","白真人"],"one_line":"苍龙神魂被夺，诸派商议镇杀起纷争","summary":"苍龙神魂在体内与冥皇相争，自残并再施壶中天地也无济于事，狱中幸存囚徒齐声高呼「杀了它」。刘阿大发现废墟角落一条伤痕累累的小黑蛇正欲扑杀，被赶到的井九一把拎起抱入地底。小黑蛇升空变回苍龙本体，痛苦挣扎欲往北方遁走——诸强大物皆看出其神魂已被冥皇控制，柳词出声请诸派出手镇杀，中州掌门沉默不肯，隐身的白真人忽然质问「先前有人从地底遁走」，神皇随即现身封堵。朝歌城上空一片凝滞。"},{"n":341,"orig":341,"title":"四大强者锁冥皇","people":["冥皇","布秋霄","谈真人","柳词","禅子","白真人"],"one_line":"一茅斋祭龙尾砚锁苍龙，冥皇受四强锁定","summary":"布秋霄率先出手，以一茅斋镇派之宝龙尾砚压住苍龙尾部将其锁死——依梅会协议，一茅斋握有对苍龙的处置权。冥皇自苍龙眉间血口飘出，瞬间被谈真人等四道通天气息锁死，但苍龙神魂已被冥皇占据，诸强投鼠忌器不敢出手。谈真人与柳词质问冥皇，禅子提议若苍龙理亏，果成寺请冥皇往塔林清修，诸派意动，白真人冷哼反对。冥皇拒绝：塔林囚禁与镇魔狱何异？他仍只是人族锁着下界子民的铁链，如此活着，不如去死。"},{"n":342,"orig":342,"title":"一曲冥河远","people":["冥皇","苍龙","禅子","白真人","元骑鲸","越千门"],"one_line":"冥皇吹奏冥河摇篮曲，与苍龙同归于尽","summary":"元骑鲸踏剑而至，质问当年中州派出手可曾顾及青山。白真人威胁苍龙若死便屠冥部万民泄愤，禅子承诺果成寺必会阻止。冥皇知无人会放他回冥部，便对苍龙说出死因：太贪，壶中安逸磨尽了探究天地的渴望，这样的活着与死无异，并警诫人族同样贪婪、将来或因此而亡。他以碧潭大妖玉骨为笛，吹一曲冥河摇篮曲为苍龙送葬，曲终神魂随风散去，苍龙坠亡，云梦山麒麟悲啸。十余日后朝歌修复，三十七派齐聚太常寺追查镇魔狱之变，越千门质问鹿国公当日为何阻中州派入狱。"},{"n":343,"orig":343,"title":"早已准备被发现的草蛇灰线","people":["越千门","鹿国公","渡海僧","张遗爱","和国公"],"one_line":"调查揪出「宋信」，线索直指景辛皇子府","summary":"追查会上鹿国公态度强硬，坚称真相便是苍龙违约欲食冥皇、反被同归于尽，越千门无法反驳，转而追查地底遁走之人。渡海僧提议从镇魔狱囚徒档案查起，很快发现名叫「宋信」的囚犯档案有异：此人由清天司指挥使张遗爱亲自经手送入，囚室门曾被傀儡之外的什么人打开。张遗爱在逼问下说出此人乃梁太傅所送——线索直指景辛皇子府，满堂死寂。渡海僧留审张遗爱，鹿国公匆匆进宫面圣。"},{"n":344,"orig":344,"title":"不打诳语的僧人们","people":["越千门","张遗爱","渡海僧","鹿国公"],"one_line":"越千门百般遮掩，渡海僧坚持彻查到底","summary":"越千门夜访被看守的张遗爱，劝他莫把皇子府牵连进来，反被张遗爱倒打一耙，质问中州派强令他往镇魔狱送人可曾考虑他的处境，不欢而散，渡海僧在门外听得一清二楚。当夜神卫军包围景辛皇子府，清天司连夜自查。次日越千门向渡海僧和盘托出「真相」，称宋信确是不老林余孽、送入镇魔狱是为借苍龙审讯，渡海僧以「出家人不打诳语，但不代表好骗」拒绝采信，坚持查清。鹿国公带来神皇旨意：陛下震怒必须查明真相，还要代问越长老一句——中州派究竟想做什么？"},{"n":345,"orig":345,"title":"离开然后又回来的那个人","people":["鹿国公","越千门","井九","张遗爱","渡海僧"],"one_line":"各方调查反而替井九完美打了掩护","summary":"因中州派沉默不配合，调查难以深入，处理结果雷声大雨点小：景辛被禁足皇子府三年，苍龙遗骸留于太常寺，送人入狱之事未深究，张遗爱毫发无损。卷帘人排查证实各派化神以上长老当日均有不在场证明，逃走者身份成谜。鹿国公却觉此事顺利得蹊跷：渡海僧把火引向中州派，卷帘人与果成寺又配合得天衣无缝，恰好掩盖了真身井九。他正出神，消失三年、惹出塌天大事的井九戴着笠帽，如逛街般走进了太常寺。"},{"n":346,"orig":346,"title":"新的开始","people":["井九","阴三","刘阿大","白早","井梨"],"one_line":"井九现身为白猫系铃，阴三自认布局之人","summary":"井九从太常寺竹林旁的紫花丛里取出银铃系上白猫颈间，笑言苍龙已废，千年龙虎斗算是刘阿大胜了。他怀念镇魔狱里与冥皇数十日的交谈，想起师兄笔记里对冥皇的评价，深知冥皇中仙箓后本就难活着离开，如今已是最好结局。果成寺里，阴三正是当年带冥皇回人间之人，玄阴老祖尊其为「真人」；他本就不愿景辛继位，借不老林旧事把皇子府拖入镇魔狱一案，重创中州派，只遗憾井九未死。井九回井宅见到长大的井梨，白早踏海棠而来，怔怔说他似乎更好看了。"},{"n":347,"orig":347,"title":"一朵花落的时间","people":["井九","白早"],"one_line":"白早一句过冬非师妹，惊醒井九故人梦","summary":"白早察觉井九气息清冽仙意十足，井九以在皇宫禁地修行三年作答。两人谈及皇位：井九断言景辛绝无可能继位——他就是不喜欢此人，何况其母出自白真人门下——景尧是唯一选择。白早金丹圆满将成婴，井九点拨丹珠古经源出水月庵。白早忧心苍龙死后中州与青山两派关系恶化，自己与井九连朋友都难做；井九寄语修道不该被宗派出身血脉所困。白早临别说起过冬师妹恐怕不该称师妹——这是童颜所说。井九如遭雷击，追问过冬下落。"},{"n":348,"orig":348,"title":"家长里短","people":["井九","白早","顾清","井梨","刘阿大"],"one_line":"井九向顾清坦白镇魔狱三年真相","summary":"白早只知童颜三年前曾消失一段时日，归来后守口如瓶；她辞行前提醒井九勿忘数年后的云梦大会。夜里井九用四句话向顾清交底：这三年在镇魔狱、剑鬼问题已解决、逃出镇魔狱的是他、冥皇是他放的。顾清虽难认同师父行事，只能劝他往后小心。叙述补笔：真正最险的一刻其实是苍龙缩成小黑蛇时，若非井九抱住欲扑杀的刘阿大，中州与青山难免开战。井九决意离开，让顾清三年之期已满、一同回青山。"},{"n":349,"orig":349,"title":"过冬你到底是谁？","people":["井九","顾清","胡贵妃","景尧皇子","连三月"],"one_line":"井九夜查卷帘人，过冬来历扑朔迷离","summary":"井九带顾清乘铁剑夜行，铁剑已能纳剑入体，顾清确信师父剑鬼问题彻底解决。他先入皇宫为景尧定下青山弟子身份、安抚胡贵妃，随后直飞北方雪原白城——当年赵腊月曾在红崖小庙等他一年多。再到居叶城向卷帘人医馆查过冬来历：十五年前过冬突然现身水月庵，自称连三月关门弟子，庵主与太上长老竟默认其身份；而连三月多年前便已通天，所谓闭关求破境只是幌子。井九一句话点破：这些都是假的。"},{"n":350,"orig":350,"title":"改派立教","people":["井九","顾清","苏子叶","童颜"],"one_line":"玄阴宗将改派立教，井九悟出杀神之局","summary":"井九与顾清在居叶城酒楼听得消息：三日后玄阴宗改派立教。前任宗主苏七歌被亲生儿子苏子叶偷袭成废人，苏子叶如今竟是西海剑派客卿。井九由童颜自西南归来、宴席上一盘不合时令的红菜苔推断他去过益州宝通禅院，再把苏子叶、宝通禅院诸线索串起，悟出童颜等人要杀西海剑神，但他断言剑西来杀不死，加上裴白发也不行。他当即动身去西海，穿越冷山边缘时，遥见玄阴宗山门烈阳幡冲天，一道浓烈杀意自远方锁定铁剑。"},{"n":351,"orig":351,"title":"冷山里的热血少年在看着你","people":["井九","顾清"],"one_line":"烈阳幡千里扬威，一双怨毒眼睛锁定井九","summary":"井九带顾清御铁剑穿冷山赴西海，风刀教数十道刀意拦路，验过青山剑牌后放行，众人惊叹来者速度绝非寻常长老。冷山深处玄阴宗山门烈阳幡冲天而起，隔千里焚杀一名著名散修，威势远超两百年记载。井九认出烈阳幡，警意却并非因幡——火焰深处有一双眼睛正死死盯着他，怨毒杀意浓烈如实质。世间想杀井九的人不多，恨他至此者更少，铁剑加速西去。"},{"n":352,"orig":352,"title":"小明教主","people":["王小明","井九","苏七歌","高崖","顾清"],"one_line":"魔头王小明执掌玄阴教，誓杀井九赵腊月","summary":"玄阴宗内，新任教主王小明以完全认主的烈阳幡为凭，识破高崖与瘫痪前宗主苏七歌欲重立傀儡的算计，逼二人服从乞恕。他本是施丰臣养子：义父买凶刺杀赵腊月事败自尽，他携功法入冷山，凭奇遇习得玄阴宗最古老的魔功，四年间清除苏子叶嫡系登上宗主之位。他隔千里望见井九，杀意翻涌，却因无必杀把握强行按捺，立誓总有一天杀了井九与赵腊月。井九推算不出这段仇怨来历，命顾清回青山查玄阴宗主底细，能杀便杀；二人抵达海畔，感应到深海远处两名绝世剑修正在大战。"},{"n":353,"orig":353,"title":"潮来又潮去","people":["井九","西海剑神","裴白发","苏子叶","顾清","过冬"],"one_line":"西海海底观战，过冬暗杀剑神当场败露","summary":"井九以潮来剑法分开海水，携顾清潜入西海深处观战：西海剑神与裴白发激战竟日，剑落处海裂数百丈。裴白发重伤坠海，西海剑神亦染血沉落，实为装作昏迷静候真正的杀招。西海门人分两路下海，苏子叶抢先捞起裴白发，驾玄阴宗魔舟救人遁走，以剧毒水墙挡住追兵。桐庐趁师尊沉落欲下手弑师，迟疑间被斩伤失去机会；一名貌不惊人的少女悄然贴近剑神胸口拍下一掌——西海剑神睁开了眼，她是过冬。"},{"n":354,"orig":354,"title":"让我们忘了那片海","people":["西海剑神","过冬","苏子叶","裴白发","何霑","井九"],"one_line":"苏子叶倒戈杀裴白发，白猫挡剑救众人","summary":"西海剑神直起身，一剑斩向过冬。她连碎数十张天蚕丝手帕与护身法宝，静悬海中，眼神平静赴死。另一边苏子叶驾舟救出裴白发后骤然倒戈，一手探入其胸口捏碎心脏——他早已暗中叛变，此局只为骗取剑神信任。何霑驾浣溪纱抢回裴白发遗体，险死于剑神一剑，顾清依「遇事扔猫」之嘱掷出白猫，白猫挡下剑光救下众人。剑神震怒，桐庐愧疚不辩，引剑自刎于海面。井九救走过冬，西海剑神一剑追杀，双方坠上沙滩时井九已被斩得几乎断成两截。"},{"n":355,"orig":355,"title":"行路难","people":["井九","过冬"],"one_line":"井九以天蚕丝缝身续命，裹过冬成茧","summary":"沙滩上过冬追问井九到底是谁，井九不答，只借她指尖的天蚕丝，以铁剑高速缝合自己的断躯——西海剑神那一剑太快，伤口平整反而好缝，椎骨、脏腑逐一缝好，他保住了命。过冬三处道脉被斩，颈下瘫痪、生机渐消，井九断言她不会死，以天蚕丝把她裹成蚕茧续命，系在自己腕上。夜里二人对望：过冬看不出这张脸的来历，只断定他绝非寻常年轻弟子；井九却认出她正是那位数百年前立誓再不相见的故人，杀人数万、见惯白骨的疯姑娘。"},{"n":356,"orig":356,"title":"山居以观白骨及沧海","people":["赵腊月","童颜","白早","何霑","顾清","井九"],"one_line":"赵腊月误信井九已死，童颜吐露杀局真意","summary":"顾清独自回青山复命，赵腊月与众人皆以为井九死在西海剑神剑下；她平静之下心绪恶劣，一脚把自责的何霑踢下崖，命顾清将其押往水月庵。云梦山上白早逼问童颜西海之局真相：明面上的败局只是前半段，真正目的是让苏子叶取得剑神信任，苏子叶保证自己有必杀剑西来之法；裴先生知情赴死，桐庐本也会殉师。白早悲愤众人皆被算计，童颜却道：当年我们也以为你死在雪原——救走过冬的若是井九，他未必会死。井九拖着蚕茧过冬寻到山中妖兽石洞，布阵养伤。"},{"n":357,"orig":357,"title":"风景都看透","people":["井九","过冬","孙老爷"],"one_line":"偷车南行留信报平安，庵堂对坐养伤","summary":"井九夜探山村查问路况，回洞时发现山般巨妖已死在洞前——他身上沾着苍龙与白鬼的气息，妖兽竟被活活吓死。过冬教他套马，他偷走退官孙老爷的马车，以「僵尸吸血」的戏法吸干管事、吓退追众，载着蚕茧南行。途中他到卷帘人医馆借走轮椅，真正目的是留信一封：让卷帘人把「井九还活着」的消息传往神末峰。十余日后抵达大原城外过冬当年自建的庵堂，二人对坐圆窗观湖养伤，过冬言水月庵与此处并无不同，井九索性多留些时日。"},{"n":358,"orig":358,"title":"受不得闲愁","people":["过冬","井九","赵腊月","李公子","顾清"],"one_line":"过冬自陈赌命求道，井九决定留下相伴","summary":"过冬道出西海之行的缘由：她以秘法燃烧寿元求破通天，所剩时间无多，凡有一线可能都要一试，并托井九日后照拂侄儿何霑。井九理解这种修道者的赌命，决定留在庵堂，一面照料她一面参悟幽冥仙剑、稳固新境。青山方面，赵腊月从卷帘人处确认井九还活着，开始借黑石在金鞭溪断崖苦练十七里外飞剑杀人的绝技。庵堂荷潭边，二人静观一名溺水公子沉浮而不救，救人后过冬对追问不休的公子自称与井九是兄妹。"},{"n":359,"orig":359,"title":"对马弹琴李公子","people":["李公子","井九","过冬"],"one_line":"李公子痴恋过冬对马弹琴，井九赠金离去","summary":"溺水的李公子是大原太守之子，倾慕轮椅上的过冬，连日登门被拒，便夜半入庵对马弹琴；井九与过冬听其琴声干净，未加驱赶，某夜起琴声却再未出现。秋深离庵，老尼交还李公子重金求来的宝树居丹药。途经大原城，井九见李公子沦为街头琴师遭人嘲笑，从卷帘人处得知其父因当年上折请立景尧被政敌构陷罢官、郁郁而终，李公子申冤不成反被挚友骗走祖传古画，井九悄然留下一箱金叶而去。卷帘人报：三年后中州派开派大会以一道长生仙箓为彩头，井九决定与会，此物正是为救过冬所备。"},{"n":360,"orig":360,"title":"某人出关","people":["赵腊月","顾清","卓如岁","王小明","元曲","过南山"],"one_line":"赵腊月胜过南山，闭关二十载卓如岁出关","summary":"三年后，赵腊月传书诸峰，将以青山唯一名额亲赴中州派问道大会争长生仙箓。顾清办妥井九所托，寻回李家被窃古画送还，画中星夜撑伞的漠然女子令赵腊月莫名眼熟；卷帘人送来玄阴教主「明王」画像，赵腊月认出他竟是当年清天司库房的力工王小明，暗怨井九当日未斩草除根。天光峰试剑，赵腊月于浓雾中一剑胜过南山，众弟子敬畏之余愈发念及后山闭关的那位天才。忽然彩虹落峰顶，闭关二十余载的掌门关门弟子卓如岁终于出关，青山震动。"},{"n":361,"orig":361,"title":"新湖，破庙，星空","people":["井九","过冬","何霑","卓如岁","赵腊月"],"one_line":"井九探通天井别过冬，破庙夜话后惊闻赵腊月败于卓如岁","summary":"井九回到东海通天井，感知冥界因冥皇死讯陷入混乱，冥师焦头烂额；他打算等冥界新君确立后亲自送还冥皇之玺，又专程到水月庵与过冬告别。某野山破庙里，各地修行者聚在篝火旁议论问道大会：卓如岁出关试剑胜了赵腊月成为青山问道人选，中州派七人参赛被疑内定仙箓；年轻僧人何霑忍不住怒斥众人，点破只要景阳真人在，便无人敢觊觎青山。井九在山野躺竹椅看星空，得知赵腊月竟输给了卓如岁，想起当年叮嘱她不能输，心中不解。"},{"n":362,"orig":362,"title":"尴尬而不失紧张的相见","people":["井九","卓如岁","南忘","方景天","白早","顾清"],"one_line":"问道大会开幕，井九被断资格后借水月庵名义出战","summary":"中州开派三万年，问道大会在云梦山召开，井九戴笠帽登记入山，执事弟子认出名字惊动全山。青山众弟子抵达迎仙谷，闭关二十年、出关便胜了赵腊月的卓如岁成为全场焦点。井九随后现身引来轰动，瑟瑟想亲近被他无视。他向青山众人提出要挑战卓如岁争问道资格，南忘与方景天先后拒绝，方景天以其未参加试剑为由断了他的路。井九走到水月庵青帘小轿前说「我来吧」，太上长老竟应允让他代表水月庵出战，全场哗然。"},{"n":363,"orig":363,"title":"杠铃或银铃般的笑声","people":["井九","南忘","白早","方景天","瑟瑟","顾清"],"one_line":"井九强留青山身份代表水月庵，还答应瑟瑟去杀老太君","summary":"井九声称大会规则未禁止，不需离开青山便可代表水月庵出战。南忘怒极欲动手，方景天以场合不妥制止；两忘峰弟子却齐向井九执礼请安，方景天神色更冷。白早与井九相见，井九解释自己一直隐藏实力，还透露他在青山没有师长。青山议事上白如镜斥他背叛宗门，井九以柳十岁当年被弃旧事反唇相讥，起身离席，方景天暗自心惊。其后井九兑现旧诺，瑟瑟提出要他帮忙杀死亲奶奶老太君，井九竟一口应下，瑟瑟银铃般笑着离开。"},{"n":364,"orig":364,"title":"天下三懒","people":["井九","何霑","瑟瑟","卓如岁","白早"],"one_line":"井九借清心铃备战幻境，卓如岁私下约他一战","summary":"井九告诉瑟瑟何霑如今在果成寺，瑟瑟欢喜离去。他向白早打探问道大会，得知仙箓疑藏在青天鉴营造的云梦幻境中。井九寻到落发的何霑，何霑吐露朋友背叛害死朋友的痛苦，瑟瑟以自己身世相慰，二人相约烤鱼。井九向瑟瑟借来她的本命清心铃，准备在幻境中使用。卓如岁私下拦住井九，直言不明白他的自信究竟从何而来，约他单独一战，不许旁人看见。白早把地方安排在自己的山谷，童颜、何霑、瑟瑟等看客却不期而至，夜战将启。"},{"n":365,"orig":365,"title":"满天火花问你行不行","people":["井九","卓如岁","童颜","白早","何霑"],"one_line":"满天火花中井九瞬移制敌，胜卓如岁惊动诸派","summary":"童颜断定井九必胜，因为井九算力天下第一，没有必胜把握根本不会出现。二人相距数十丈开战，飞剑反复相撞，在山谷里留下满天火花，童颜推算出井九处于劣势。战况惊动云梦山，各派强者赶到观战。井九决定速战，把铁剑插入地里诱敌，卓如岁疾退而攻，井九却凭诡异身法瞬移到他身前，一脚踩住其飞剑，一指点在他胸口，留下数十道剑痕。井九获胜，众派震惊，南忘对外宣称他是先天无形剑体，掩去真正手段。"},{"n":366,"orig":366,"title":"我本游野中人","people":["井九","顾清","卓如岁","简如云","南忘","白千军"],"one_line":"井九震服卓如岁显游野中境，问道大会正式开场","summary":"简如云讥讽井九靠卓如岁相让才偷袭得手，井九掷铁剑欲杀之，南忘弹剑相救，众人惊觉井九可能已是游野中境。卓如岁问他这是什么剑法，井九劝他多出门走走。回到山居，顾清拒绝换剑，表示剑随人起，要用普通剑战胜强敌，井九暗叹神末峰尽是笨蛋。他算到自己问鼎时可能动用幽冥仙剑，今夜借无形剑体之说掩人耳目，心中却仍有算不清的不安。十余日后问道大会开场，越千门主持，井九代表水月庵出战，中州派竟有白千军等七人参加。"},{"n":367,"orig":367,"title":"问道于氓","people":["井九","白早","青儿","卓如岁","何霑"],"one_line":"问道者云集，青儿凭心情考问，怪答者接连过关","summary":"问道者名单揭晓：中州派有白千军、向晚书、童颜、白早等七人，另有昆仑文士、一茅斋书生奚一云、镜宗雀娘、一名散修与无恩门黑瘦少年。白早与井九约定入幻境后互不相认，若遇见他自会认出。青天鉴灵青儿现身考较，提问全凭心情：无恩门弟子直接答「一加一等于二」获准通过，何霑答「一加四等于十四」也因有趣过关。卓如岁疑心中州派会借机除掉他与井九，井九却说正因如此，二人才必然能够过关。"},{"n":368,"orig":368,"title":"你的名字","people":["井九","青儿","卓如岁","童颜","白真人"],"one_line":"青儿随心发问众人各显神通，井九入幻境转生为楚皇子","summary":"青儿提问毫无规律，有人因丑被拒，抗议时被她千手震飞。童颜凭弹珠之戏险胜过关，卓如岁把「你怎么这么没精神」当作问题歪答过关，井九只报上名字「井九」便得青儿青眼通过。众人被引入崖洞，围绕青天鉴冥想，井九嗅到一丝仙气，怀疑长生仙箓就藏在云梦幻境里。白真人从青儿处得知井九报的并非真名却也没撒谎，大惑不解。青天鉴启动，众人沉入幻境，楚国皇宫里诞生了一名皇子，婴儿睁眼，正是井九转生，三日便能自己起身行走。"},{"n":369,"orig":369,"title":"问鼎","people":["井九","何霑","柳十岁","童颜"],"one_line":"问道者转生五国争夺青铜鼎，井九成楚国九皇子","summary":"幻境规则揭晓：二十六名问道者转生到楚罗秦赵齐五国，谁能统一大陆得神使认可取青铜鼎，谁便胜出，境界上限被锁在游野初境。何霑转生为江上漂流弃婴，柳十岁生在修行宗派杂役之家，井九则成了楚国九皇子——皇后难产而死，楚皇因而厌恶此子。楚国靖王世子与九皇子同日出生，天生宿慧，靖王醉后曾言其三十岁可问鼎神使。井九从宫女闲谈里推断世子是童颜、雀娘或白早，也猜到转生与本人意愿相关，决意走一条与所有问道者都不同的路。"},{"n":370,"orig":370,"title":"两小儿辩日","people":["井九","何霑","姜瑞","童颜"],"one_line":"姜瑞出卖何霑害其净身入宫，秦公主初见井九倾心","summary":"井九在御园替宫女落子后惊觉幻境影响渐深，从此不再下棋。童颜把关键资料写成只有自己认得的异形字防遗忘。何霑与散修姜瑞在两村水沟边认出彼此，结盟互保。姜瑞回家暗示酒鬼父亲何霑家捡到了狗头金，夜里父亲杀死何霑养母、打伤何霑，又把他卖给人贩子，几经倒手到赵国，何霑被送入皇宫净身。同一时间秦皇携五岁小公主访楚，小公主对九皇子一见倾心，两国皇帝密谈支开众人时，她爬到井九身前。"},{"n":371,"orig":371,"title":"昏君生涯的开始","people":["井九","白早","张大学士","童颜"],"one_line":"井九登基装昏君托政大学士，童颜记名防忘","summary":"小公主与井九互认，求他装作没认出，井九让青鸟隐去这段画面。秦使归国途中遇伏，秦皇身死，其弟沛国公屠戮登基，反诬楚国靖王，实则暗中搜寻公主下落。数年后楚皇溺亡，十岁皇子继位，新帝登基便命人把寝宫地板削成蜕皮之屋样式，举朝痛骂昏君。大学士入宫试探，井九一句「先皇是你杀的吗」镇住对方，随即把朝政尽付他摄政，自己称病不理朝政，昏君之名坐实。沧州的靖王世子童颜推演不出他的图谋，写下只有自己认得的三字：我是童颜。"},{"n":372,"orig":372,"title":"那些不能被忘记的人","people":["童颜","何霑","洪老太监","姜瑞"],"one_line":"何霑献鱼得拜洪公公门下，童颜疑心有问道者被暗杀","summary":"童颜在此界的使命是助师妹白早问鼎夺仙箓，他眼中只有井九一个对手。何霑转生赵国皇宫为小太监，苦心接近权宦洪老太监未果，又在御园偶遇郁闷的赵国太子，与太子分食烤鱼换来玉佩，借机再见洪老太监，答出「凭什么」的答案，洪老太监大笑收他学功法。童颜已查出十余名问道者下落，却发现有人抢先杀死数名问道者，且自己的记忆日渐模糊，只能靠那本异形字簿子温习。姜瑞除掉酒鬼父亲、安顿家人后求学谋名步步向上，自觉太慢，忽见街上立着一个黑衣人。"},{"n":373,"orig":373,"title":"那些不要再提起的事","people":["何霑","姜瑞","白早","白昼","张大学士"],"one_line":"何霑救姜瑞成赵国权宦，白昼助白早复国求婚被拒","summary":"黑衣人重创姜瑞，暗中来罗国的何霑出手救下他，黑衣人猜不透那幽灵来历，闻罗国骑兵逼近而退。何霑学成洪老太监的诡异功法，成为赵国权宦小何公公，曾毒杀洪老太监、助太子弑君。秦国公主白早流亡北海郡，少年武神白昼（白千军）引胡兵连克五城助其复国，向她求婚被拒后不再提起。楚国盛世，张大学士宣言「吾非相，乃摄也」，拒绝篡位；他在秀山草庐遇到墨公弟子云栖，称此子之才仅在靖王世子与皇帝之下。泉山水车入宫，一场刺杀在即。"},{"n":374,"orig":374,"title":"一桩事先张扬的行刺案","people":["井九","柳十岁","张大学士"],"one_line":"柳十岁化名无恩门弟子入幻境救驾，成井九贴身侍卫","summary":"泉山刺客入宫之事早被很多人知晓，宫中一片诡异沉默。晨光里刺客攻入皇宫，一名黑瘦少年浴血杀光刺客与内应侍卫，井九出殿认他作贴身侍卫。少年正是柳十岁，奉青山掌门柳词之命，以无恩门弟子身份入幻境助井九夺仙箓。井九以清心铃探其眉心，发现青天鉴灵在他神魂里烙了血魔教余孽的印记，随手抹去。此番行刺由张大公子与青壮派官员促成，大学士并不知情。张大学士入宫跪见，柳十岁请示是否杀他，井九只说当作无事发生，让大学士自行善后。"},{"n":375,"orig":375,"title":"一夜长如岁","people":["井九","卓如岁","童颜","柳十岁","白昼"],"one_line":"卓如岁杀戮出局者身份曝光，白昼称杀神白早遭幽禁","summary":"行刺善后，礼部尚书夺官，张大公子被逐回乡，井九身边多了寸步不离的小侍卫柳十岁。问道者接连被黑衣刺客杀死出局，众人从苏醒者口中确认刺客是卓如岁。昆仑丘成道因罗国覆灭提前出局，醒后嫉妒发作，袖风袭向井九神魂，被清心铃化解，青儿将他卷扔出洞。三年后北海造反成功，白昼立为太子，手段残暴人称杀神，公主白早被幽禁冷宫。向晚书被黑衣人所杀，卓如岁随后现身沧州湖畔与童颜摊牌，道出自己就是那名刺客。"},{"n":376,"orig":376,"title":"杀不死便对你说一句话","people":["卓如岁","童颜","柳十岁","墨公"],"one_line":"卓如岁杀伐立威后离去，井九借柳十岁带话敲打童颜","summary":"卓如岁向童颜摊牌：与其慢慢争鼎，不如杀光其余问道者，让自己成为唯一胜者，同时以杀人磨炼战力。他借雀娘的线索找到向晚书并将其杀死，雀娘也未能幸免；何霑一身邪气他暂不想招惹，白早下落不明。童颜点破幻境境界有上限，劝其收手无效；湖上埋伏着劲弩与最强者墨公，卓如岁识破埋伏却坦然离去，因为井九的侍卫柳十岁就藏在树后，二者势均力敌。柳十岁转达井九的话：别再让人在都城吹风说大学士要篡位，童颜听罢心情莫名转好。"},{"n":377,"orig":377,"title":"朝朝暮暮柳十岁","people":["井九","柳十岁","童颜"],"one_line":"柳十岁渐忘前尘痴护井九，楚皇突然下旨召童颜入京","summary":"童颜复盘湖畔对峙，始终算不到井九的路数：井九当众一句「大学士办事很好，你们不要胡闹」平息倒阁风潮，随后大学士彻底掌控朝堂，井九依旧深居皇宫，让人无从下手。柳十岁在幻境里渐渐忘却前尘，认不出井九，只记得要保护他，井九知道缘由，却不知他接下来会怎样。问道二十年，秦国渐盛、赵国得明君、齐国被何公公压榨，楚国盛世之下，靖王手握重兵渐成心腹大患。深秋，楚国皇帝忽然下旨：令靖王世子入京。"},{"n":378,"orig":378,"title":"风雪故人来","people":["井九","童颜","白早","雀娘","向晚书"],"one_line":"雪亭对坐二十年后重逢，童颜坦言为白早必杀井九","summary":"童颜冒雪入京，全城百姓感佩其勇气。雪亭里他与井九时隔二十年再会，二人坦陈转生因果：童颜因怜惜先天不足的白早而转生为瘸子，立志为良相；白早因心志成为落难公主；何霑因厌恶自身好运而厄运连连。童颜直言算不到井九为何转生为皇子，盘点问道者已死九人余十七人，九人被他控制，剩下七人包括井九、卓如岁与白早。他承认为保白早必杀井九，请井九给他证明自己想错了的机会。青天鉴外，雀娘与向晚书苏醒相认，天空直播二人对弈，谷外一片沸腾。"},{"n":379,"orig":379,"title":"雪泥鸿爪各西东","people":["井九","童颜","卓如岁","墨公","青儿"],"one_line":"井九童颜雪亭对弈，卓如岁挡青鸟，墨公入京引天劫","summary":"众人围观井九与童颜对弈，青鸟画面突然被卓如岁遮住，青儿传中州派承诺：不干涉问道，但杀人者要准备被人杀。卓如岁隐入风雪，谷外众人猜到这可能是青山联手除掉童颜的局。青鸟随后展示都城全貌：沧州死士潜伏、楚国禁军待命，童颜敢入京必有凭恃。最出人意料的是墨公随行入京，独自立于皇宫雪地仰头望天，连青鸟都深深看了他一眼。棋局进行间，井九察觉风雪那头有人正在破劫，童颜心绪复杂，已猜到那人是谁。"},{"n":380,"orig":380,"title":"就算天空再深看不出裂痕","people":["墨公","井九","童颜","张大学士","柳十岁"],"one_line":"墨公触动境界上限引天劫，井九落子雷落皇宫","summary":"墨公立于皇宫雪地引动天劫——这个世界的修行境界被锁在游野初境，他触碰了更高境界。张大学士在值房听闻风声，下属劝他趁皇帝与世子相争之机举事，他以墨公只为天下公义出手为由拒绝，却隐隐觉得今日有大事将发。童颜陷入两难：墨公是他请来的，应劫必身死道消，会毁掉他的布局；可身为修道者，他不忍让墨公错过朝闻道的机会。井九落子，天雷轰落皇宫，柳十岁持伞出宫，静候墨公抉择。青鸟落在棋桌上，望着井九，眼里满是探询与困惑。"},{"n":381,"orig":381,"title":"害怕悲剧重演我的命中命中","people":["井九","童颜","墨公","柳十岁","雀娘"],"one_line":"墨公弃破劫入宫弑君，井九胜棋心生倦意","summary":"青鸟不承认自己是规则，暗示深意。井九与童颜继续对弈，棋局平稳淡然，唯有雀娘能看懂二人棋力远胜当年。柳十岁在广场看墨公抉择。墨公本应童颜之邀来杀皇帝以保天下均势，却在落雪天里窥见天空可被剑斩开的真实，天劫因此而生。他在拔剑向天与转身弑君之间抉择，最终选择放弃破劫，转身走进皇宫。柳十岁回报后风雪雷声止息，井九落子宣称获胜，并对走进宫门的墨公说：希望他回首往事时不后悔今日选择。"},{"n":382,"orig":382,"title":"不在天下，就在亭下","people":["井九","童颜","墨公","柳十岁","卓如岁"],"one_line":"井九揭穿杀局，卓如岁断臂，柳十岁锁剑重伤","summary":"墨公道明弃道是因心怀天下，但仍要为苍生杀井九。童颜察觉棋盘里藏着生灭意味，确认井九从一开始就要杀自己；井九点破问道胜负就在亭下不在天下，正因童颜猜到了什么才必须死。童颜求墨公带他离开，卓如岁自宫门阴影暴起；童颜用火铳与符宝轰断卓如岁一臂，墨公则直取井九，柳十岁以承天剑法徒手锁剑，寒剑贯穿其身仍死握不放。井九以极快剑速在童颜背上留下掌印，又让墨公周身生出数百血洞，生机与真气尽散。"},{"n":383,"orig":383,"title":"越美丽的东西我越不可碰","people":["井九","墨公","童颜","柳十岁","张大学士","卓如岁"],"one_line":"童颜墨公相继死亡，井九定罪己诏幽冷宫","summary":"井九解释神魂无肉身故幽冥仙剑速度无双。墨公遗憾自己只能选一次，坐化雪地；童颜临死前想问井九怕他猜到什么，井九令他死去。柳十岁自刎离场。张大学士入宫看到惨状，井九以「靖王世子勾结墨公行刺」定论，大学士深知真相却只能接受，提出罪己诏自幽冷宫，又问井九想不想生儿子被拒。青鸟暗中选择画面掩护真相，向井九求答墨公为何能看见真实，井九说真实才能看见真实，并点醒她与自己第一次对白真人撒谎有关，青鸟惊问井九究竟是什么。"},{"n":384,"orig":384,"title":"眉头仍骤满密云","people":["井九","童颜","白真人","柳十岁","青儿"],"one_line":"童颜向白真人禀报井九欲破幻境上限","summary":"井九答青儿：只要别的问道者不知其想法即可，并断言她不会泄密。回音谷外众人不解青山为何杀童颜自毁大局。柳十岁醒来，与童颜相顾无言各自散去；童颜直接飞上白真人所在峰顶，禀报井九不参与争霸而是要杀死所有问道者，更推测他要在幻境里突破境界上限——此话被井九逐他出幻境便是为了保密。白真人嘲弄此想荒唐，青天鉴有天宝与仙气镇压不可能突破，但童颜想不通井九为何付出如此代价。井九居冷宫修行，青鸟禀报赵皇似乎也醒了。"},{"n":385,"orig":385,"title":"在遮阴的栗树下","people":["何霑","赵皇"],"one_line":"赵皇托孤何霑遭拒，君臣互认利用起于栗树","summary":"青鸟奉井九之意巡查诸国，最后到了赵国皇宫。赵皇病弱却雄才，与何霑君臣相得共谋国事：崤山水渠将成悬在齐国头顶的利剑。赵皇自知命不久长，决意从宗室过继河间王世子为嗣，托何霑辅佐；何霑反对，称那是养不熟的狼崽子，并坦言自己一直想当真正的皇帝。二人清算当年栗树做手脚的旧账，承认自始便是彼此利用。赵皇临别问何霑是否不是这个世界的人，何霑不答，只承诺侍候他到最后、保皇后一世福泽，独自立在御园栗树下如怀旧的魔鬼。"},{"n":386,"orig":386,"title":"天下藏于吾身","people":["何霑","井九","青儿"],"one_line":"青儿明悟藏天下之境，青天鉴世界渐变真实","summary":"何霑坐镇缉事厂，处置书院、齐商、御史，权势滔天。青鸟向井九禀报赵皇看破虚实之事，井九指点她认清自己：她因第一次对白真人说谎而成为完整的天宝真灵，踏入藏天下境界——青天鉴里的世界会因她变成真实，其中的人也将成为真正的人，她与这方世界共生。井九叮嘱她等待并保密，又透露自己曾见过另一个天宝真灵，更多时候是一把剑。青儿问他是否担心秦赵，井九答别人的事与己无关，他要的只是仙箓。"},{"n":387,"orig":387,"title":"皇帝轮流死","people":["白千军","白早","何霑"],"one_line":"白千军弑老皇登基，奚一云自忘身份，赵皇驾崩","summary":"青儿问井九胜算，井九说他与旁人道路不同。秦国老皇帝驾崩，白千军逼老皇帝当夜就死，登基称白皇帝，登基前夜探视被幽禁的白早，得知奚一云的下落——他在齐国化名云栖求学讲学，竟主动忘记了自己的问道者身份，一心救苍生行大道。白早下令尽快杀他除患；白千军坦言想再多忘记一些事，被白早淡然挡回。五年后赵皇病死，河间王世子入京继位，因不肯走正明门与何霑对峙，何霑一句「不想走正明门，那就请回吧」便令其低头。"},{"n":388,"orig":388,"title":"今年到张家","people":["何霑","张大学士","太后","小皇帝"],"one_line":"小皇帝入宫受制何霑，张大学士临终叩冷宫门","summary":"小皇帝被迫走正明门入宫，何霑警告他河间府五年输送的死士谋士已尽数被诛，命他只认先皇为父，许他私下称自己叔父。何霑与太后定约垂帘听政，又拿通齐卷宗逼太后清洗御史台、封万松书院，杖责言官，权倾朝野人称九千岁。镜头转向楚国：权摄朝政二十余年的张大学士自知将死，入冷宫求见幽居的井九，一句「臣已经老了，要死了」换得宫门开启。而都城流传御玺已随大学士还给陛下，成为朝中诸公无法定张家死罪的隐忧。"},{"n":389,"orig":389,"title":"一屋暗灯，照不穿我身（上）","people":["井九","张大学士","裴将军","张大公子","金澄"],"one_line":"暗灯叙别大学士含笑而终，张党遭清算","summary":"冷宫一盏暗灯下，张大学士与井九叙旧话别：大学士自陈八十高寿，全赖陛下历年赐丹续命；井九坦言飞升需突破规则，还需多年方能回去。大学士请他看在苍生份上出宫收拾局面，井九以烂摊子何必收拾婉拒。大学士笑问他是天才还是白痴，井九答「我很聪明的，只是有些懒」，并承认自己是仙人下凡，大学士此生无憾，老泪匍匐。初秋大学士薨逝，楚国举哀；随后御史发难，清算张党，裴将军下狱，张大公子被押回都城受辱。老夫人探狱，透露大学士遗言「什么都不用做」，御玺已被还给陛下。"},{"n":390,"orig":390,"title":"皇袍加身","people":["井九","金澄","张大公子","卓如岁","陈大学士"],"one_line":"抄府夜井九皇袍亲临，栽赃谋逆当场破功","summary":"陈大学士与金澄借皇帝名义清算张家，苦于皇帝不露面，安排太监放火烧宫却离奇失败，秋雨绵延宫中火始终未起。他们逼张大公子认罪，送入白绫毒药；张大公子绝望自尽时发现瓶中竟是清水——卓如岁奉命救下诏狱众人。朝廷趁机查抄学士府，金澄暗藏皇袍栽赃张家谋逆，军士砸开老夫人房门，却见井九披发黄袍从屋中走出，淡淡说道「朕是皇帝，不穿皇袍穿什么」，满府骇然跪倒，谁也不知陛下何时出的宫。"},{"n":391,"orig":391,"title":"待到秋来百花杀","people":["井九","金澄","陈大学士","张大公子","卓如岁"],"one_line":"井九朝堂立威屠殿，一言定死全家之罪","summary":"金澄欲指认井九是假皇帝，话未出口便心跳骤停、咳血而亡。井九向老夫人践诺保张家一世富贵。大朝会上他宣布「张大学士是朕选的人，动他就是动朕，那是要死全家的」，只赦免点名的七八名官员与小太监。陈大学士质问皇帝真伪，断言无人会听命于幽禁多年的白痴；井九答从未想过困住他们，殿门随即关闭，他独自屠殿。卓如岁与张大公子守在门外，井九提剑浴血而出，只让张大公子给母亲带话：这发绳不大结实。"},{"n":392,"orig":392,"title":"此事无关真假","people":["井九","卓如岁","青儿","童颜","柳十岁"],"one_line":"井九点灯悟真假，童颜柳十岁谷外相试","summary":"井九血洗朝堂，把还活着的官员放出去办事，裴将军与周大学士（原周太守）接管军政。卓如岁问他到底要怎么做，井九说自己与他差不多——修行杀人夺仙箓；卓如岁随即赴赵国杀何霑。夜里青鸟回报叛乱已平，井九点灯独坐，道出「世间很多事情本就无关真假」，回音谷外众人闻之怅然。童颜就此与柳十岁搭话，试探青山布局，柳十岁以白早欠中州派一个人情化解揭穿危机。赵国何公公放话：楚国最多再撑五年。"},{"n":393,"orig":393,"title":"聪明不在当下","people":["何霑","白千军","白早","井九","卓如岁"],"one_line":"裴将军死楚国危，井九识破白早掌秦国权柄","summary":"幻境岁月飞逝，问道者只剩七人：白早、白千军、奚一云、何霑、井九、卓如岁与姜瑞。白皇帝横扫北疆武功盖世，齐国加速拓海，云栖讲学收徒声望如山；何霑把持赵国权柄，挫败卓如岁的缉事厂刺杀，两人皆重伤。裴大将军寿终，秦赵瓜分楚国：白千军得了楚国大半疆土，何霑替赵国拿下最肥沃的东野与西大营。秦楚战争里井九看出秦军节奏出自白早之手，确认她是秦国幕后掌权者。裴将军死后，秦赵大军疯狂南下合围楚国。"},{"n":394,"orig":394,"title":"风波恶","people":["井九","白早","周大学士","卓如岁"],"one_line":"楚国请降，白早易容入殿断了井九杀局","summary":"西大营覆灭，楚都末日氛围弥漫，朝野暗生降意却无人敢言。井九召朝会，开口便是「拟旨吧，朕准了」，还指定只与咸阳谈、不与沧州谈——他主动揽下降罪之名，周大学士含泪主持和谈，严令封锁消息。秦国使团秘密入城，井九忽传旨要亲自见使团；殿上来的竟是白早，她易容为秦国官员，说若再不来怕是见不到最后一面。卓如岁从廊柱后走出，气急败坏道「这下完了」——原来井九算准并等着白皇帝亲自前来送死，白早先来一步，此局落空。"},{"n":395,"orig":395,"title":"行路难","people":["井九","白早","卓如岁","叶韵","何霑"],"one_line":"楚国亡而皇宫焚，井九诈死遁去不知所踪","summary":"白早与井九叙旧，确认他早在幻境里筹谋破境——杀童颜便是为争取时间，可惜十年仍不够；卓如岁自认此路不通，断臂装铁臂按自己的路走。和谈结束，条件利于百姓，井九受封临山王成亡国象征。名妓叶韵杀辱骂楚皇的郡王世子，血书「更无一个是男儿」，被何霑收入赵营。云栖盛赞楚皇。靖王率秦军入城受降当夜，冷宫方向燃起大火，皇宫焚毁三天三夜，楚皇尸骨无存，天下皆以为其殉国，满城挂起白幡。"},{"n":396,"orig":396,"title":"刺秦","people":["卓如岁","白千军","白早"],"one_line":"卓如岁孤身刺秦重伤白皇帝，力竭自尽出幻境","summary":"井九焚宫后下落成谜，白千军下令彻查其生死，白早以无国之君不足为虑劝阻。卓如岁假扮商行管事混入咸阳行刺，一剑斩碎高公公，一拳轰穿铁门震杀十余高手并重伤秦皇；秦军数百高手车轮围攻半日，卓如岁力竭，一掌拍落自己头顶自尽，临终讥讽白千军真把自己当皇帝、注定没有前途。他在青天鉴边醒来，退出幻境。谷外众人细品青山独修与中州领袖人族两条道路之争，各自深思。"},{"n":397,"orig":397,"title":"议赵","people":["何霑","少年皇帝","云栖","太后"],"one_line":"赵国帝相暗斗，何霑公开否认河间王入太庙","summary":"卓如岁死后秦国进入平稳期，焚宫遁走的井九连青鸟都寻不到踪迹。赵国小皇帝渐长，孝敬太后、尊礼何公公，暗中培植班底；何公公却常年在各州郡巡视，原来五年布置只为趁裴将军病逝一举夺下西大营与东野。何霑回都受万民夹道，向小皇帝点破楚皇死活无关紧要。数年后小皇帝将亲政，有进士上疏请尊生父河间王入太庙，朝野诡异安静；一书生拦驾逼问，何霑公开回答「河间王是郡王，没资格进太庙」，埋下帝相决裂引线。游学至此的云栖对学生说：我支持何太监。"},{"n":398,"orig":398,"title":"弑君","people":["何霑","云栖","少年皇帝","太后"],"one_line":"何霑雷霆清洗帝党，少年皇帝方知一切皆被纵容","summary":"云栖阐释支持何霑之理：既认先皇为父便不可反悔，舍不得皇位就别想两边占便宜。虐杀书生案激起民愤，缉事厂被砸却发现早已搬空；当夜何霑雷霆反击，抓捕将领官员、封太学、杖毙言官，逼少年皇帝公开认错。太后斡旋无果，云栖求见为何霑搭台阶，声望更高。正当帝党以为有机可乘，少年皇帝中毒，才知自己的经营全在何霑默许之内，连虐杀书生栽赃也是他教的功课。何霑说这次只是给先帝一个交待。"},{"n":399,"orig":399,"title":"问死","people":["何霑","太后","姜瑞","少年皇帝"],"one_line":"少年皇帝梦中毒亡，何霑抓姜瑞欲问其死法","summary":"少年皇帝在睡梦中死去，何霑道破杀他的理由：他不肯认先帝为父，先帝会绝后，只好再挑一个愿意当儿子的皇帝，自己并非想当皇帝。太后惊觉两帝之死皆与何霑有关，却承认当年他重伤养伤时不敢动手，何霑点破她下毒之事，坦言活着太累，且当年给先帝熬的药里没有毒。其后何霑纵酒，命人把被监视多年的姜瑞带来，讲故事唤醒他的记忆：当年是他设计害得何霑家破人亡被阉入宫。何霑问他喜欢怎么死。"},{"n":400,"orig":400,"title":"惊梦","people":["何霑","姜瑞","太后"],"one_line":"何霑凌迟姜瑞了断恩仇，携缉事厂出海遁世","summary":"何霑道出留姜瑞数十年只因对方是他在幻境里不忘真实的锚点，如今顿觉无意义，便封其经脉送去凌迟。姜瑞临刑前求他遵守幻境规矩莫记恨，何霑微笑应下，说外面我们还是朋友。其后何霑不再上朝，日渐健忘，常在御园栗树下抚疤沉思，终于忆起银发老者临终那句话：小舟从此逝。他携整个缉事厂借齐赵水道与齐国船队悄然出海，消失于天下。赵国举国震恐，朝廷定其七十四项大罪，太后只批下散漫无礼等数条，雪夜里独自在栗树下红了眼眶。"},{"n":401,"orig":401,"title":"出题","people":["秦皇","云栖","白早"],"one_line":"云栖赴咸阳说秦皇失败，殿上行刺借符重伤秦皇","summary":"何太监弃赵国不知所踪，秦皇与各方遍寻无果。数年后，秦皇为扫清一统天下的障碍，与白早商议后诏告天下，邀主张非战的齐国大儒云栖入咸阳，欲以铁的事实说服他：抵抗只会带来灾难，不如归降。云栖献上七个治国之问，秦皇自认无法解决，索性明言要解决提出问题的人，给云栖一次杀自己的机会。云栖持剑冒弩雨行刺，身中十余支剧毒弩箭，危急间书卷中暗藏的符引燃爆炸，毁掉秦皇的地道机关并将其炸伤。秦皇惊问早已忘尽前尘的云栖为何会写符，云栖笑答：原来我以前就会。"},{"n":402,"orig":402,"title":"烧云","people":["奚一云","秦皇","井九"],"one_line":"云栖行刺重创秦皇，咸阳书生被屠，井九遥望咸阳","summary":"青天鉴世界本无符，云栖忘尽前尘，却在读书修行中自行创出符道，堪称开宗立派。他断剑指着秦皇，讥其聪明而猥琐地活着；秦皇威胁要坑杀其弟子信徒、焚毁其书。云栖临死前陆续忆起前尘，记起秦皇所求乃仙箓，也想起了井九之名，坦然道无论在哪个世界自己都是自己，并非迷失。秦皇大笑而去，秦军乱刀斩杀奚一云，又血洗咸阳学宫，百余书生杀敌数倍后尽数战死，尸身与书籍同焚，天空尽是血色火光。千里外，须发疯长如野人的井九立在崖畔，遥望咸阳，晚霞如烧云。"},{"n":403,"orig":403,"title":"睁眼","people":["白早","秦皇","奚一云","童颜"],"one_line":"白早与秦皇决裂，醒来后众人发现井九失踪","summary":"白早痛斥秦皇坑杀书生只会让天下更不服，秦皇扬言杀到无人敢反对。当夜，皇后带宫女行刺秦皇，毒匕被贴身软甲挡下，行刺失败遭血腥清洗，咸阳学宫被烧成废墟。秦皇循线索追到沧州秘密基地——那里的一切都是童颜当年留给白早的。两人决裂，白早提醒他将来可能忘掉一切，但请记住井九这个名字，随后翻开一本自创异体字写就、无人能懂的书，从幻境中醒来。奚一云也已出关，最关心楚皇井九藏在何处。白早震惊地发现，连鉴灵青鸟都找不到井九的踪迹，童颜凝重告知：井九不见了。"},{"n":404,"orig":404,"title":"最后的问道者","people":["井九","秦皇","何霑","白早","童颜"],"one_line":"何霑远航不归，秦皇封禅不周山，神使竟是井九","summary":"童颜与白早发现青鸟找不到井九，却从还天珠画面里看到何霑：他背手行走于大海之上，百余艘巨船追随其后。何霑船队抵达两处异大陆，听闻赵太后死讯，在船尾阴影里站了一夜，对旧部说认识的都快死光了，回去做什么。赵国随后被灭，秦国又灭齐、逐杀北荒蛮人，天下一统。秦皇始终记得来到这个世界听到的第一句话：成为天下共主便能问鼎得仙箓。他倾国之力修通天大道，血腥镇压沿途起义，九天赶至不周山封禅。庙中青铜鼎旁立着白衣人，他跪拜神使，抬头却认出那张脸——井九。"},{"n":405,"orig":405,"title":"神使现身","people":["井九","秦皇","神使","青鸟"],"one_line":"井九早已藏身庙中，重伤秦皇，用其血引出神使","summary":"井九自楚国皇宫那场火后，凭青鸟指引径直来到不周山，确认青铜鼎彼时只是凡物，便在庙边一住数十年，日日修行，杀死所有前来打探的秦国死士。秦皇封禅至此，见神使竟是井九，惊怒交加。数十名随行强者被井九以幽冥仙剑瞬息斩成肉块，秦皇断腿重伤。秦皇之血溅上铜鼎竟沸腾生烟，请出青烟中的史官小人——神使，即青天鉴规则本身。神使判定唯有天下共主才有资格问鼎，且一切有据。井九不为所动，收剑走向铜鼎，直言自己等了几十年，为的就是让神使把鼎交出来。"},{"n":406,"orig":406,"title":"要与天公试比高","people":["井九","神使","青鸟"],"one_line":"井九挥剑直上斩向规则，天雷加身，神使消散仙箓现世","summary":"神使公布问道榜单：白千军居首，何霑第二，奚一云第三，白早第四，童颜第五，井九与卓如岁仅列中段，谷外众人哗然。井九当众威胁神使交鼎，并道出道理：墨公当年摸到这个世界的上限便遭雷劫，而他要试试天高还是自己更高。木剑斩入青烟即溃，他却径直踏入烟中，无数道剑光斩碎小庙，引动天地异象，天雷倾落，一道剑光迎雷而上。青鸟忧虑此战尽被外界看去，日后必有麻烦。雷停天晴，井九回到峰顶，清风拂散青烟，神使随之化作光点消散无踪，青铜鼎纹饰隐隐透出仙意。"},{"n":407,"orig":407,"title":"夺鼎","people":["井九","白千军","秦皇","白早","童颜"],"one_line":"井九握住仙箓破虚空归来，一拳震碎白千军本命法宝","summary":"井九道破修道本义便是打破规则：他从入幻境第一天起想的就不是问鼎而是夺鼎，外界来客只要道心清明，便不该眼里有那道线。规则消散后他看清铜鼎即是仙箓，左手握鼎硬受仙气冲击，在青鸟铃声的远空回应中一声「收」，天地竟因此近了数分。他向虚空踏出一步，在青天鉴畔睁眼醒来，众问道者齐身道贺。刚醒的白千军带着秦皇的暴戾不服规则，挥拳偷袭，被井九左拳一击震断五指、臂骨与本命法宝尽碎，吐血跌回青天鉴。童颜注意到井九左手始终未松，猜想仙箓正被他握在掌中。"},{"n":408,"orig":408,"title":"摘桃","people":["井九","瑟瑟","甄桃","何霑","青鸟"],"one_line":"井九许诺仙箓归水月庵，永夜中的鉴灵发现世界活了","summary":"白真人出手带走重伤的白千军与还天珠，何霑最后一个醒来，与井九约定也许有一天会重回幻境看看。井九向瑟瑟兑现承诺多杀五人，并向水月庵少女甄桃致歉，宣布自己以水月庵弟子身份问道所得仙箓应归水月庵，只是暂不能交付，举座皆惊。青天鉴失去还天珠后陷入永夜冰封，青鸟巡游死寂世界，却发现带咸腥味的海风——井九打破规则后，这个世界无需仙箓便能自行复苏，她为此欢欣。井九回青山观礼台，白早察觉他看似平静实则凝重。何霑宣布将去白城，此时青山观礼台气氛骤然紧张。"},{"n":409,"orig":409,"title":"意难忘","people":["井九","南忘","柳十岁","卓如岁","白真人"],"one_line":"卓如岁一声懒哼震慑质疑者，井九独守仙箓有异的秘密","summary":"昆仑长老指井九夺鼎不合规则，卓如岁一声懒散的鼻音——青山著名的「你们想死吗」——令全场噤声。众人皆见仙箓应在井九左手中，几位掌门正在云梦深处商议。井九闭门谢客，南忘持锦瑟剑弦守在蜕皮之屋外，连方景天也不得入内。柳十岁登山探望，井九只让他看过一眼便令归位。井九向南忘承认仙箓有问题，但只肯对柳词一人言明，还让顾清提前回了青山。另边，白真人在密府中凭还天珠回放幻境全部画面，看穿青鸟刻意略过的关键镜头，认出井九就是当年大闹镇魔狱、致苍龙死亡的灰影。"},{"n":410,"orig":410,"title":"是，师叔","people":["井九","柳词","白真人","麒麟"],"one_line":"白真人冰封青天鉴，井九向柳词道破仙箓是夺舍之局","summary":"白真人以玄冰封印青天鉴，镇压入云梦山地底绝脉。她与麒麟都不急杀井九：仙箓无法被炼化，得箓者只会沦为承载仙识的傀儡。井九向柳词道破真相——中州派所出并非副箓而是正箓，白刃飞升时在箓中留下一道仙识，问道大会实为替她挑选最强道身，欲借夺舍归来，成一道隐而不发的雷霆。井九决意炼化仙箓断其归路，自认没有全然把握，若不成便斩断左手。柳词以承天剑法在其拳上布下无形剑阵，封尽仙气。临别井九问三百年没打牌了吧，柳词行礼：是的，师叔。"},{"n":411,"orig":411,"title":"掌门你来做？","people":["井九","柳词","麒麟"],"one_line":"柳词携井九归山，火锅桌上暗谈旧案，机锋往来","summary":"问道大会落幕，各宗天才各奔前程，井九随柳词驭剑云先行离山，白早未见其人隐隐不安。归途上麒麟尾随欲报苍龙之仇，井九故意从指缝泄出一缕仙意，引动数百妖物邪修垂涎欲滴；柳词再度封住其左手，一声冷漠的「嗯」威压群山，群妖跪伏或遁走。两人在云集镇旧酒楼吃火锅，谈及当年方景天涉嫌指使孟姓弟子助冥皇脱困的旧案，井九直言能解其剑阵者唯有柳词，问是否是他放的人。柳词只以「掌门你来做」相抵，井九仍是不要，柳词拂袖携他离去。"},{"n":412,"orig":412,"title":"阵阵阴风乱我心","people":["井九","赵腊月","顾清"],"one_line":"井九回神末峰，嘱顾清习承天剑备任掌门，与腊月夜话","summary":"剑云落回神末峰，青山年轻弟子欣喜若狂，以为小师叔回归。井九在树叶上写信让元曲转呈元骑鲸，随后告诉顾清：今后你要做掌门，承天剑要练好，别的先放放，还要给他换剑。井九召出闭关数年的赵腊月，用太平留下的阴木梳为她梳头，把镇魔狱、西海与仙箓始末一一讲明：仙箓里的仙识让他觉得似曾相识，他怀疑当年烟消云散阵本身就有问题——从教景阳道法之初，太平或许就没想让他飞升成功。赵腊月宁愿相信是白刃在仙界偷袭，井九摇头：若阵法无错，白刃岂是飞升成仙后的景阳的对手。"},{"n":413,"orig":413,"title":"晚来天欲酒","people":["井九","赵腊月","阴三","玄阴老祖","柳十岁"],"one_line":"井九道破白刃惧无限而留归路，欲寻已死的朋友相助","summary":"井九向赵腊月解释白刃留仙箓作归路的缘由：仙界是无垠空间，没有落脚点与同伴，自我在精神里的投影会无限放大，她惧的是无限与身处无限中的自己。井九说将来赵腊月总要飞升，提前知道没有坏处，并坦言自己对柳词与元骑鲸都无法尽信，却最信她。炼化仙箓最大难关是白刃那道层阶太高的仙识，井九说要找一位朋友帮忙——而那位朋友已经死了。果成寺里，阴三断言井九并非景阳、只是在躲避，自觉此事伤感；玄阴老祖与胖僧人暗通消息，称西海那位一切都好，正设法劝其动心——只需一剑杀两位真人，青史留名。柳十岁旧疾复咳，阴三提着酒上门。"},{"n":414,"orig":414,"title":"二十三年的小池塘","people":["井九","童颜","柳十岁","阴三","赵腊月"],"one_line":"童颜闻鉴灵哀鸣决意挖洞救援，井九回山腹洞府验尸","summary":"阴三到菜园讨酒，再次问柳十岁为何不去一茅斋，柳十岁仍不言。童颜醉后登云梦山，在洛淮南秘府听见地底传来鉴灵青儿的哀鸣，推算出青天鉴被镇压于地脉深处，此局太大非他可插手，便传讯白早诈称闭关，实则脱衣挖洞，算出要挖十二年也不退缩。青山落雪，井九以果成寺之行与雷魂木送回碧湖为条件说动白鬼，带赵腊月与猫下山。路过柳十岁家乡，井九往柳家水缸投丹，让赵腊月抱猫在村口池塘等候，自己独入山腹洞府，对石榻上死去多年的故人说：今天先确认白刃有没有出手。"},{"n":415,"orig":415,"title":"知之为不知","people":["井九","赵腊月","大常僧"],"one_line":"井九以仙气验尸证实偷袭景阳者正是白刃，赴果成寺","summary":"井九在剑阵环护的山腹洞府里，以神念代替石榻尸骸运功，逼出其体内十余粒金色碎片，与仙箓仙气同质——当年偷袭景阳的正是中州派白刃仙人，就此证实。他忆起飞升时亲见的画面：数万飞剑在星域燃烧成烟火，烟消云散阵未能斩尽的因果如一线牵回朝天大陆，有人不想他离开。随后他带赵腊月乘铁剑赶往墨丘果成寺，把白猫搁上肩头去寻隐居的大常僧，说要在此参禅。静园深处的小石塔，竟是前代神皇的灵骨塔——神皇假死退位、隐寺修佛的传说是真的，井九要找的那位朋友便是他。"},{"n":416,"orig":416,"title":"此庙此园可静心","people":["井九","柳十岁","赵腊月","大常僧","小荷"],"one_line":"井九借禅寺静心炼化仙识，探访柳十岁得见管城笔","summary":"井九来果成寺的用意是借古寺晨钟暮鼓与神皇灵塔静心，抵抗白刃仙识对道心的浸润，再引其进入寂灭。他要赵腊月先稳境界，在寺中听几年经，她倔强不肯应下破境之期。两人持木牌出寺探望柳十岁，饭桌上井九再问为何不去一茅斋，柳十岁取出严先生遗物：一把普通折扇与一枝管城笔——当年冥皇便是被此笔所困。柳十岁道出隐情：严先生是一茅斋叛徒，怕追查旧事给井九惹祸，所以宁可不去了。井九应承绝不外泄，劝他设法解决体内真气问题。柳十岁随后搬进静园服侍，菜园门在小荷身后幽怨地关上。"},{"n":417,"orig":417,"title":"果成寺的生活","people":["井九","赵腊月","柳十岁","大常僧","阴三"],"one_line":"静园三人一猫听经煮茶，阴三与井九同寺而互不知情","summary":"井九与赵腊月在果成寺静园住下：大常僧扫落叶打盹，赵腊月读佛经，井九躺竹椅，柳十岁煮茶修竹椅、打理菜园，白猫赖在腊月膝上。成迦大师开讲天树七参经，赵腊月听得入神，井九却在蒲团上睡着，白猫后来听经也入了迷。禅子与律堂首席已赴雪原，豫郡爆发疫情，寺中年轻僧人奔走救灾。柳十岁咳嗽渐频，真气冲突有复发迹象，小荷忧心。塔林白山禅堂里，阴三读经晒太阳，玄阴老祖偷肉解馋；阴三与井九这对青山宗历史上最传奇的师兄弟同寺而居，彼此竟毫不知情。春至，阴三道心微动，想起柳十岁，往菜园去。"},{"n":418,"orig":418,"title":"风中传来谁的声音","people":["阴三","柳十岁","井九","小荷","玄阴老祖"],"one_line":"阴三点破柳十岁难当掌门，又隔空递来炼箓之法","summary":"阴三到菜园讨酒，点破柳十岁这辈子当不了青山掌门，除非修到他自己那种程度，并劝小荷眼界放宽，将来或可去别的大陆。话音间他气息微露，惊得小荷跪地，随即他察觉自己竟不知井九就在寺中——井九是为仙箓来求佛法解脱，与他一样。玄阴老祖问要不要杀井九，阴三笑称逗你玩，因其身边有白鬼护持，并在塔林地上暗画阵法。静园里井九听风辨声，忽觉推演失灵，暗感不安。阴三再度登门，留下一叠写有炼化仙箓之法的纸，嘱柳十岁不要透露自己身份。井九阅后承认：这方法颇有道理。"},{"n":419,"orig":419,"title":"新年快乐","people":["井九","赵腊月","阴三","玄阴老祖","柳十岁"],"one_line":"井九与阴三隔纸论道后断联，新年夜炼化一成仙识","summary":"玄阴老祖忧心真人通信太过冒险，阴三却再出一道佛学难题。井九看后沉思良久，次日写成回信，送达时已是夏末。阴三读罢回信坐看一夜星辰，确认井九已隐约猜到烟消云散阵的问题，再未回信，就此断绝来往。静园岁月平稳，赵腊月境界将稳入游野中境，柳十岁真气渐平。又是大寒新岁，井九趁新旧相交天地之势最盛、仙气最弱之机，以剑意蘸墨凌空写经，把左拳伸入经文，无声无息炼化仙识，一年余炼得一成。赵腊月第一次向他叩行弟子礼，随后依偎进他怀里，只让他一人看见小女儿情态。"},{"n":420,"orig":420,"title":"写了五年的字","people":["井九","赵腊月","白真人","麒麟","白早","童颜"],"one_line":"井九年夜炼识将成，麒麟请战被白真人驳回","summary":"白早年下与父母一晤，忧心童颜闭关蹊跷、仙箓之事云梦山竟毫无反应。童颜仍在地底掘进。麒麟感应到仙识正在消散，几度请命去果成寺杀井九，白真人以门规禁其离山，只道不信井九能炼化仙箓，何况他境界太低。果成寺中岁月如流，转眼五年：井九沉默而苍白，眼底隐现金色，赵腊月欲破境被他按下，自己却不惜损耗剑元神魂加速炼化。再临新岁，他将于年夜写下最后一篇经文，成则尽得仙箓仙气，败则被仙识反噬沦为傀儡。今年鹿国公将代表神皇还愿，规模格外隆重——井九这才想起，塔中人已走了三百年。"},{"n":421,"orig":421,"title":"在腊排骨 经声 帷帽里寻找答案","people":["奚一云","童颜","井九","卓如岁","白千军","麒麟"],"one_line":"祭塔之日各派齐聚，帷帽弟子现出麒麟真容","summary":"年关将近，神皇离世三百年的祭塔在果成寺举行，朝歌城使团与各派代表齐聚，水月庵未派人，一茅斋来了奚一云，中州派来了白千军与一名戴帷帽的弟子，青山则派卓如岁代为观礼，柳词嘱他该看的时候不要看漏。童颜挖了六年终于抵达地脉深处，隔冰见到虚淡欲散的青儿，他此来只为求解：青天鉴到底出了什么事。静园里柳十岁咳疾加重，井九眼底金色渐深。祭塔日六人入园，奚一云坚持要帷帽弟子摘帽，对方一句话便震得他呕血，随后摘帽露出额上双角——来者竟是中州派镇山神兽麒麟。"},{"n":422,"orig":422,"title":"说说当年镇魔狱的事","people":["麒麟","井九","卓如岁","渡海僧","赵腊月"],"one_line":"麒麟现名齐灵，声言问罪井九，园外猫叫骤起","summary":"自称齐灵的麒麟明言来找井九，暴喝其出来，声言要拆园毁寺，渡海僧只得摆出应战姿态，暗盼能撑到禅子赶回。麒麟选择祭塔日发难，正因为井九炼化仙箓已到最易出事的关头，白真人仍盼仙识入体的旧计成行，中州
