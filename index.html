"summary":"戒指问题解决，承天剑程序仍无解，雪姬虽通晓承天剑也无力拔除。井九请她把自己变成「她那样」——以极低温压制意识强度，让精神世界处于低能耗状态，程序的活跃度随之下降。井九醒来不再头痛，人却迟缓呆滞如孤独症患者，腕上青色光绳持续显形。溪是少女祭司的复制人，芯片过载致脑受损，忘却前事，只记得服侍井九。众人离开时遇上躲藏的太空海盗，寒蝉散发远古威压震倒众人，一行人径直走过，海盗尽数冻毙，下水道化作冰雪地狱。星球天空的酸雨化作大雪，少女抱着裹油布的娃娃，与脚步沉重的少年渐行渐远。"},{"n":891,"orig":892,"title":"此去经年","people":["赵腊月","钟李子","阿大","井九"],"one_line":"赵腊月飞升寻师，落脚钟李子公寓","summary":"钟李子确认短发少女就是赵腊月，白猫是青山镇守白鬼刘阿大。赵腊月苦修数百年成为同代首位飞升者，遇上海盗船便迫其教授这个世界常识；她在星域网看到小说与游戏，又从新闻里认出井九，得知钟李子被送回星门基地后判断井九出事，令船直驶星门，被发现后背着推进器跳入太空，与阿大一路漂流至今。今日她落入钟李子公寓，听其推断井九选边却两边皆有问题；钟李子感伤与井九多日未见，赵腊月淡淡道：我与他五百年没见了。此时军方清空对面楼宇、架起十几件远程武器并派卫星监控，赵腊月剑意一动，监控设备尽碎。"},{"n":892,"orig":893,"title":"新房客","people":["赵腊月","钟李子","冉寒冬","阿大"],"one_line":"赵腊月试枪退敌，冉寒冬连线相邀","summary":"赵腊月毁掉监控后径直走进对面指挥部，随手取过特种兵的重枪试威力：左手堵住枪口扣动扳机，枪管炸裂如玫瑰，她掌心只蹭破一点皮，确认这种枪械约等于破海境全力一剑，随即以眼神警告众人，飘然离去。她入住公寓，学着井九的样子看新闻，阿大则趴在钟李子怀里打呼噜。钟李子把井九做的银色笔记本电脑给她用，赵腊月专查枪械、机甲、战舰等军事资料。屏幕忽然黑屏显出「你是谁」，视频里是井九的秘书冉寒冬，她循数位标识连上电脑，认出屏幕上的脸与小说游戏里的赵腊月一模一样，遂邀她前来，有事相告。"},{"n":893,"orig":894,"title":"新生活","people":["赵腊月","钟李子","冉寒冬","阿大"],"one_line":"赵腊月决意赴主星，遭电磁枪与激光伏击","summary":"冉寒冬带赵腊月入隐网，在摩天轮里密谈，双方信息拼出井九处境的模糊轮廓；赵腊月盯着星图上雾外星系的小行星带，钟李子提醒那边已封锁，她只说：我在这里等他。二人带着阿大在公寓住下，头顶有卫星监控、战舰远程武器待命，分子分析仪却一无所获。她嫌配给食物难吃，迷上火锅连吃七八顿。她断定井九即便归来也不会回公寓，要寻人不如直接去主星找那位，宣布今晚吃麻辣烫、明天去主星。她无视持青山剑符拦路的军官，十余支远程电磁枪齐射被剑阵挡下，天外同步卫星的激光主炮亦轰然而至，她翻手祭出青铜镜青天鉴迎击。"},{"n":894,"orig":895,"title":"一起走吧","people":["赵腊月","钟李子","阿大"],"one_line":"青天鉴反射激光毁战舰，赵腊月携钟李子启程","summary":"激光主炮落在青天鉴上，镜子反光，一道白束无声折返太空，命中黑色战舰，战舰燃烧崩解，舰上军人死伤惨重。赵腊月一剑把生化人军官斩成碎块，再以最快的弗思剑逐一清算狙击手与躲藏的军人。阿大劝阻，它仍惧她——井九飞升后无人压制她的杀性，弗思剑收割无数生命，直到禅子来青山长谈才稍好。晚间她买了青菜猪血做麻辣烫，钟李子问是不是人血，她答人血不好吃。深夜赵腊月问钟李子是否一起走，钟李子应下。她在公寓布下雷霆剑阵守护，随后携钟李子驭弗思剑离去，街坊都知道她不会回来了，或许会死在外面，这样挺好。"},{"n":895,"orig":896,"title":"天亮就出发","people":["赵腊月","星门女祭司","钟李子","冉寒冬","阿大"],"one_line":"女祭司叛堂授卷轴，赵腊月驾雷神号升空","summary":"钟李子随赵腊月游历守二都市，再到祭堂拜会星门女祭司。女祭司坦言昨天死了很多人，交出一份载有家的信息与祭司一脉隐秘历史的卷轴；赵腊月慰藉她：若世上真有神明，只能是他。女祭司问还会有人来吗、战争是否将启，赵腊月答今年还有两三人，胜负取决于对方但胜利终属我们；又以剑识在瓷盆三片瓣留标记，留下给柳、卓、童三姓来人的信。随后她借冉寒冬给的权限侵入雷神号巨型机甲，驾之轰然升空。冉寒冬提醒勿轻易屏蔽信息，话音未落她自身数据寸寸碎裂，光幕浮出一行字：破茧者，你过线了。"},{"n":896,"orig":897,"title":"抬棺而战","people":["赵腊月","陈崖","曹园","钟李子"],"one_line":"赵腊月驾机甲赴主星，陈崖抬仙骸见曹园","summary":"那位少女祭司在光幕现身。赵腊月问她能否进行物理操作，对方答与井九当年相同：我只能做我能做的。赵腊月说：能停机就停下机甲，能让战舰开炮就开炮，若什么都不能，就等我来见你。少女祭司答「我等你」，影像化碎。雷神号在全世界注视下直奔主星，网友把事件命名为巨型机甲的叛乱。另一边，星核舰队司令陈崖见一地尸体，感慨青山出来的都是猛人，转赴前进三号基地寻曹园。他落到酷热行星的岩浆地表劝曹园出关，告知井九已死；曹园不信，称景阳怎么会死。陈崖便取出通体透明的巨棺，里面是纯阳真人李将军的仙骸。"},{"n":897,"orig":898,"title":"巨型机甲的叛乱","people":["赵腊月","钟李子","冉寒冬","陈崖","曹园"],"one_line":"曹园拒信井九已死，赵腊月只身入主星古堡","summary":"陈崖称自己视李将军为精神引领者，连他都死了井九为何不能死；曹园不认同，答就算我们都死光了景阳也不会死。雷神号在无数道注视下穿过扭率通道逼近主星，军方始终未开火，网民热议。冉寒冬遭兄长带兵逮捕，坚称没见到遗嘱就仍是井九的秘书，忽接命令要她去接人。雷神号降入军方基地，钟李子出舱，舱内却空无一人——赵腊月早已以最快的弗思剑独自赶路，随一抹融入朝霞的红光步入古堡。她望着向日葵仿作，直问眼前浴衣少女：你就是远古文明留下来的电脑？少女惊异于她的直接，问她底气何来，她答：我有猫，你有吗？"},{"n":898,"orig":899,"title":"青鸟殷勤为探看","people":["赵腊月","那位少女祭司","阿大","井九"],"one_line":"祭司全盘托出布局，赵腊月投下第二票","summary":"阿大散出幽冷气息，废掉古堡内外监控与卫星。少女祭司领赵腊月至庭院，把故事原原本本讲完，并看穿她闯主星意在激化飞升者矛盾、试探青山宗影响力，赞她与井九很像。她说自己是那位神明所造，神的立场就是她的立场、遗愿就是她的想法，故拒绝与井九联手；又展示星图，预判陈崖会抬李纯阳仙骸劝曹园入伍，曾举终将放弃井九，大悲和尚则在犹豫是否杀曾举。赵腊月道出自己的大道：只要他能活下去，就代表我能活下去——继西来之后投出第二票。她推算井九再过百余天便会死去，劝她届时冷静；赵腊月答：那就祈祷吧。"},{"n":899,"orig":900,"title":"滑板少女与少年","people":["赵腊月","青儿","钟李子","冉寒冬","井九"],"one_line":"赵腊月确认井九活着欢玩滑板，井九墙头吹琴","summary":"窗边青鸟正是青天鉴器灵青儿。赵腊月问她能否夺舍那位少女，青儿答对方太大且无处不在，无从下手，只认器灵这个称呼。青儿失言提起那个死鬼的问题，赵腊月忽然骂出讨厌那个死老太婆，随即抱膝埋头——原来她一路暗怕井九已死，如今终于确认他活着，多年未有的紧张才释放出来。钟李子与冉寒冬寻至茶楼，赵腊月见到广场上的悬浮滑板便有了兴趣，踩着滑板在欢呼里飞驰，笑得极美：那个家伙还活着，真好。与此同时，蝎尾星云边缘的重污染星球上，穿蓝色连帽衫、腕系青绳的少年独坐废弃墙头，望着天降的雪，吹起了口琴。"},{"n":900,"orig":901,"title":"生活的意义","people":["井九","溪","雪姬","寒蝉","伊芙"],"one_line":"井九极限省电隐居，与溪雪姬寒蝉扮一家人","summary":"重污染星球近日落的是雪。社区事务官伊芙驱散少年们，注意到墙头吹口琴的蓝衣少年，少年们说他有个脑子有毛病的妹妹，自己像自闭症。少年动作迟缓地跳下墙，回到住处敲门，门内天真少女唤他哥哥，抱着雪白大娃娃看电视。娃娃头上的蝴蝶结正是寒蝉，敲击他颈部传递消息；娃娃是雪姬，少女是芯片受损、忘却前事的溪，少年自然是井九。他把自身调到极限省电模式：再低一步便会沉睡或死亡，稍高一点就会激发承天程序。他机械地看着新闻，听到溪问酸辣苞白放白醋还是陈醋，沉默良久答道：麦田没有意义。"},{"n":901,"orig":902,"title":"向往的生活","people":["井九","雪姬","溪","寒蝉","伊芙"],"one_line":"井九以傻者身份安居学琴，雪姬寒意镇痛","summary":"井九答非所问令溪与雪姬不解，一家四口过起普通人的生活：溪操持家务，寒蝉借蚊子替全家应答。雪姬悟出只要断网、不好奇，像普通人一样生活，就能避开世界主控程序的视线，不再害怕。伊芙女士上门送来二次登记表格与兴趣班材料，提到口琴吹得好，寒蝉借蚊子替井九应答。井九决定学钢琴，雪姬认定景阳真的疯了而非装傻。夜里井九必须抱着雪姬才能入睡；半夜头痛发作，雪姬以极寒渡入他眉心压制大脑放电，看着他腕上的青绳心生怜悯。清晨溪抱怨暖气又坏——其实是雪姬寒气所致，井九请她修暖气，并再次宣布要学钢琴。"},{"n":902,"orig":903,"title":"鸟竹，猫花，雪红","people":["井九","溪","伊芙","寒蝉","雪姬"],"one_line":"井九报名学琴，风衣怪客尾随至家门","summary":"井九与溪乘地铁去市活动中心报名。伊芙女士接待，井九经寒蝉借蚊子代言后报了钢琴课，溪被安顿在阅读室。课上井九不弹只听，被老师评价迟钝，他却在下课的电子乐里听出某种熟悉感。归途地铁上，对面坐下一名戴黑面具的米色风衣男子，车厢乘客纷纷避让，井九浑然不觉，溪好奇注视却无惧意。傍晚回家，雪地里有鸟爪印、猫脚印与殷红血迹；雪姬欣赏之余打个响指，整栋空楼的房间依次亮灯，布局如棋如星。回到家中做饭，溪擦开窗上雾气，看见风衣男子正站在院中，以为是同住小区的邻居，傻笑着向他点头致意。"},{"n":903,"orig":904,"title":"吹飞一根毫毛","people":["井九","方连","雪姬","寒蝉","溪"],"one_line":"列星境海盗袭宅被杀，雪姬获祖师毫毛","summary":"风衣男子名叫方连，是被通缉的列星上境海盗，因星域封锁成了笼中困兽，他认定720这栋楼适合做窝点，决意杀掉这对兄妹。他刚走近便见到一只悬浮的白甲虫——寒蝉，寒意彻骨，他转身欲逃，落雪化作无形刀锋贯穿其身，列星强者就此毙命。雪姬验看尸体，捏出一枚透明薄冰片，认出是青山祖师多年前留在宇宙里的一根毫毛，正是它散发念力控制方连心神；她把尸体冻成齑粉。雪姬夜夜研究井九腕上的青绳，想炼出承天剑、多握一把剑作为与那位少女抗衡的后手，却始终不得其法。井九望着星空忽然说：我想学棋。"},{"n":904,"orig":905,"title":"览物之情得无异乎？","people":["赵腊月","井九","钟李子","冉寒冬","雪姬","江与夏"],"one_line":"雪姬拽青绳不动；赵腊月谈与井九之情","summary":"夜里雪姬试着拉扯井九腕上的青绳，连小行星都能扯碎的她竟拉不动。次日清晨，寒蝉举着一架高级黑色钢琴穿行雪街送到720，井九按下琴键露出开心的笑。主星两万米高空的基台被改造成山峰，是冉家的家族祭堂，如今成了赵腊月的行宫。她来主星后什么都没做，冉东楼与赵腊月一面之后竟辞去主星行政长官与军部职务，率冉家把她当祖宗供奉。餐间冉寒冬问赵腊月与井九的不同，她说井九不喜杀人怕死，自己不怕死所以不怕杀人，但又承认他比自己高一个层次。钟李子问她是否喜欢井九，赵腊月答喜欢，但不止男女，更像是战友。"},{"n":905,"orig":906,"title":"情，不在悲喜之间","people":["赵腊月","大悲和尚","冉寒冬","钟李子","江与夏"],"one_line":"赵腊月谈情如超新星，夜会少年僧人欢喜","summary":"三名少女继续采访赵腊月的感情观。她说喜欢无所谓，就像喜欢看花听溪，但不要指望花为你开、溪为你鸣，因为就算我们今天死了，太阳明天照常升起。她以超新星比喻感情：爆炸只是瞬间，光芒却会在宇宙里行走几十亿年，何况她与井九一起生活过一百五十年，虽然大部分时间他在睡觉。夜间赵腊月赴首都特区滑板聚会，如今失踪的沈云埋已成全民偶像。广场上出现一名踩悬浮滑板的俊俏少年僧人，冉寒冬欲开炮被拦，赵腊月与其踏板飞出大气层，在太空相认。少年僧人自承看着李将军与西来的生死有所感慨，已把法号改为欢喜。"},{"n":906,"orig":907,"title":"让我们一起投降吧","people":["赵腊月","欢喜僧","雪姬"],"one_line":"禅宗之祖欲率人类向暗物之海投降","summary":"大悲和尚的来历揭晓：他本是农夫出身，战场悟道后拜入曾圣人门下，在通天井畔落发成僧，回墨丘修建果成寺，是第一位医僧、禅宗之祖，两千岁肉身成佛飞升至此。他一直在主星等赵腊月相见，第一句话便是：你不应该来这里。他的滑板裂成禅宗至宝大涅盘，赵腊月以弗思剑相对，主星武器平台纷纷锁定她。欢喜僧传音说出一桩疯狂的计划：我要投降——他想带着整个人类向暗物之海投降。他推断无人能找到雪姬，说明她可能去了暗物之海，正成为那些怪物的主宰；若雪姬真成怪物君王，人类便第一次有了投降的对象。"},{"n":907,"orig":908,"title":"我见天地","people":["赵腊月","欢喜僧","井九","雪姬","阿大","冉寒冬"],"one_line":"欢喜僧断言井九虽生犹死，琴声现壮阔","summary":"赵腊月斥欢喜僧的想法荒唐，他反驳：就算沈青山握住井九也只是无趣的重复，自己的方案再荒唐也值得试，至少该找到雪姬；又说井九就算活着也已死了，醒来便会入鞘失去自我。赵腊月答他无资格让全人类陪他赌博。冉寒冬回报曹园的信号出现在王右星系太阳风暴里；她再次问要不要去找井九，赵腊月答如果他自己不肯醒谁也找不到，只能等。另一边，星球落雪的节奏竟与雪姬心情相关；井九头痛加剧，药已用尽，全靠雪姬以寒意维持深眠。清晨他弹琴，琴声无情却有一种壮阔——这说明他快要醒了，也可能快要死了。"},{"n":908,"orig":909,"title":"天地再来一人","people":["井九","雪姬","溪","童颜","星门女祭司","寒蝉"],"one_line":"童颜飞升至星门，自认天衍四九之一","summary":"井九学写诗，笔尖艰涩；溪在隔壁房间养花，寒蝉采蜜，她尝蜜直呼真甜。雪姬穿墙到隔壁单元，把六层楼打通成天井书海，将商场买的红衣化作披风，驾着环绕飞舞的书册如临幻境。井九写下阴暗的诗句，看到红披风雪姬时觉画面眼熟却想不起。晚饭新闻里播报钟李子完成祭司学院学业，明年将正式继任星门女祭司。星门地表，一位中年书生自晨雾中走出，拈起瓷盆里写着童颜之名的花瓣，道：大道五十，天衍四九，我是其一。他不留痕迹地碾碎花瓣里的信息。盆中柳十岁与卓如岁的花瓣尚在，二人还未脱情劫与关口。"},{"n":909,"orig":910,"title":"去任何地方必有其目的","people":["童颜","赵腊月","曹园","星门女祭司","钟李子","冉寒冬"],"one_line":"童颜整顿星门祭堂，赵腊月雪山小庙寻曹园","summary":"童颜从花瓣信息与女祭司的卷宗入手，先用七天编写数据分析软件，再辅以人性与故事模型写下名单与十几套方案；星门祭堂一声令下便可控制基地，但关键仍在井九。他认为井九写小说并做成游戏，是想在新世界再造一个卷帘人，遂要求更新游戏尤其是世界窗口对话系统，并约见漩雨公司总裁等人。与此同时，赵腊月带着钟李子、冉寒冬远行，抵达田园派据点星球：那里没有科技痕迹，民众如远古般跪拜朝雪山前行。二人寻到雪山下的小庙，庙中金漆剥落的佛正是曹园，他言明帮不上井九的忙，赵腊月直接质问：那你来这里有什么用？"},{"n":910,"orig":911,"title":"人类的本质就是努力","people":["赵腊月","曹园","钟李子","冉寒冬"],"one_line":"曹园胜陈崖后守棺，示苦行僧悟人类之力","summary":"赵腊月坐在庙门槛上，如当年白城小庙一幕。曹园自陈飞升只为好奇，连三月已死，他终于想开；他与陈崖一战获胜，却不知该如何选择，索性逃避，陈崖便告诉他这颗星球并把棺材交给他——庙后琉璃巨棺里正是李将军的仙骸，他成了守棺人。他带众人登上雪山，先看跪拜前行的信徒，再看冰峰上的苦行僧——皆是不会修行、拒绝基因改造的普通人，遇险时竟手拉手短暂飞起；曹园称这种力量可能与信仰有关，人类一直在为存在下去寻找各种方法。曹园最后说：好在他再过几十天就要死了。湖面上倒映的数字，正是天数。"},{"n":911,"orig":912,"title":"青天鉴的异变","people":["赵腊月","曹园","青山祖师","陈崖","青儿","阿大"],"one_line":"赵腊月谋以青天鉴留井九神魂","summary":"曹园认为雪姬不会去暗物之海。赵腊月取出青天鉴沉入湖中，火鲤被雪原气息吓得缩回，阿大化作数百丈白色巨虎震慑全湖。她请教青天鉴的秘密：鉴中生命先天是灵体，道身已毁的火鲤神魂犹存，死去的古人竟也在池边重现——死了但其实还活着。她的谋划随之揭晓：井九醒来便会入鞘，沉睡数十日后必死，不如借青天鉴之法让他的神魂脱离身体继续活着。同一时刻，祖星温泉边，青山祖师听取破茧者汇报；陈崖已把李将军遗骸交给曹园，又报大悲和尚去了矿星大区，最担心雪姬与井九在一起。祖师终于开口，说出的却是：童颜。"},{"n":912,"orig":913,"title":"祖孙对话","people":["青山祖师","卓如岁","陈崖","童颜"],"one_line":"祖师点名童颜，与卓如岁垂钓论道","summary":"祖师说出童颜之名，陈崖明白是要斩草除根。卓如岁在赵腊月、童颜之后飞升，被祖师直接接入祖星传授剑道与世界历史。祖师问他童颜该不该杀，卓如岁答自己是青山掌门、对方是中州掌门，管他死活；问及井九，他直言打不过也不喜欢。夜宴间祖师谈明月：月球早被挖空改造成祖星防御系统；他留在祖星做远古数据挖掘，称只有知道来处才能明白去处，又道井九写故事是宣言与记录——他要去无尽去处，便要把来处写清楚。祖师自言正往无尽深渊里去，若他死而不能回，卓如岁便留下整理资料。卓如岁趁机求情：让他活着好不好？"},{"n":913,"orig":914,"title":"这一切到底是什么鬼","people":["陈崖","童颜","星门女祭司","丹先生","卓如岁","青山祖师"],"one_line":"陈崖围祭堂逼问，丹先生供出童颜行踪","summary":"卓如岁为童颜求情得允，再求饶过井九，祖师答：把我的剑还给我。另一边战舰降落星门，军队包围祭堂，陈崖质问星门女祭司背叛那位，女祭司自称是神的侍者而非那台电脑的随从，其思想无人能窥探；军方欲封禁大道朝天游戏，她指出游戏节点遍布星域网，除非关闭整个星域网。陈崖撂下「你们太弱小」离去，找到电子修理铺的丹先生——此人竟是卷帘人的真正开创者，假死飞升后被祖师安置在星门监视历代飞升者，他供出童颜去了大角星。而童颜实已潜入天普星封禁实验室，查明谈真人曾化名苟教授在此研究核动力炉。"},{"n":914,"orig":915,"title":"你来自哪颗星？","people":["童颜","陈丹","赵腊月","丹先生"],"one_line":"童颜写信拿捏丹先生，出示井九倒计时","summary":"童颜在西北大学旁的车站与少女陈丹攀谈，得知她是普二女子师范大学学生，暗恋队里一名男生却不敢表白。童颜回酒店提笔给丹先生写信：女儿身体与精神都健康，质问他为何不关心自己的女儿——原来陈丹正是丹先生之女，李将军都不知晓的这个信息，如今成了童颜拿捏丹先生的把柄。他以海棠火漆封缄寄出，需七十多天才能送达。随后他进入网吧，用第七套身份登入大道朝天游戏，与赵腊月在游戏里的白城羊肉铺会合。童颜摆出棺材形闹钟，显示那位推算的井九余下天数：四十七。赵腊月一掌把闹钟砸成零件。"},{"n":915,"orig":916,"title":"童颜的太空漫游","people":["童颜","赵腊月","笠帽老人","沈云埋"],"one_line":"童颜辞别赵腊月，潜入戒备森严的沈家老宅","summary":"赵腊月吃火锅压下火气，童颜为她分析局势：星河联盟三十几名飞升者因祖师统领与井九这一共同压力而抱团，四十七天后井九醒来或死去，上层便会松动；关键是有几人肯站他们这边。他断言大道之争终归生死之争，决定去沈家寻找沈云埋——那艘黑色战舰下落不明，但必须找到他。他提前辞别旅行团，登上偷渡飞船，途中令全船人昏睡，飘出舱外独渡向沈家所在的隐秘星球。沈家星球有六名承夜境强者看守大阵，童颜以破阵之能悄然直入云雾深处，被一名酷似青山祖师的笠帽老人拦住，随手掀开了对方的笠帽。"},{"n":916,"orig":917,"title":"仲捉棋？","people":["井九","雪姬","童颜","笠帽老人","溪","寒蝉"],"one_line":"童颜携弹闯沈宅，井九输棋遭雪姬特训","summary":"笠帽老人是沈家老宅阵法的主持者，与童颜连下八局太空军棋后，又摆出三百六十五道的巨型立体棋局，称破局才可入老宅。童颜自知短时间破不了，把装有炸弹的行李包放上棋盘：带我进老宅，不然就炸了这颗星球。井九在兴趣班与八九岁男孩对弈太空军棋惨败，被孩子们嘲笑。雪姬得知后大为光火，先震碎寒蝉，再借蚊子播音讲解规则，逼井九特训，走错一步便打——能打痛他的只有她。特训结束后井九衣衫成缕，眼角旧裂痕重现。晚饭后他弹琴写诗；雪姬摩挲沈青山毫毛所化的冰片，转头又以同样粗暴的方式教井九下五子棋。"},{"n":917,"orig":918,"title":"惊雷","people":["井九","雪姬","溪","伊芙","寒蝉"],"one_line":"井九下棋夺奖初开心，溪渐忆前尘","summary":"数日后井九在棋类兴趣班取胜，心情大好，弹琴首次带上情绪；雪姬看破：感情源自不完美，人类真是弱小可怜而且荒唐。溪对寒蝉吐露秘密：她渐渐记起自己不是哥哥的亲妹妹，本该是位大小姐，猜自己是被拐卖的小可怜，但哥哥对她很好。寒蝉转告雪姬，当夜雪姬照旧把溪冻成冰块；她觉得这样的日子有些累，竟也沉沉睡着，鼾声如九天惊雷。少年文艺汇演上，井九的钢琴独奏夺得三等奖，他向伊芙要的礼物是看电影。老套的太空海盗电影正放映，伊芙突被三级召唤召回，井九独自观影，对片中母巢莫名觉得眼熟。"},{"n":918,"orig":919,"title":"数字化生存","people":["赵腊月","伊芙","井九","卓如岁","那位少女祭司"],"one_line":"天地各处显倒计时数字，井九死期将至","summary":"井九观影归家，雪姬研究冰片，溪预感近日将有大事。伊芙被三级召唤至应急会议：某大工业星区发生小型爆炸，空间出现不稳定征兆，可能产生空间裂缝；众人因距离遥远不以为意，她却觉得一切如电影般不真实。各星球近来怪事频发。真相在于天地各处显现的数字：佛国湖面、主星羊群、祖星沙滩各摆出一个数字——那是少女祭司推算的井九醒来或死去之期。赵腊月自君子国归来，望见羊群踏出十七：井九十七天后便会醒来然后死去。她并不相信，却无法无视宇宙的信号，膝上横起血红弗思剑；群山温泉里，浴衣少女正端着酒杯。"},{"n":919,"orig":920,"title":"都是皮囊","people":["童颜","青山祖师","沈云埋"],"one_line":"童颜以星球炸弹逼入沈家，发现备用躯体库","summary":"重型机甲群被调往蝎尾星云应对空间裂缝，草原上的白色碎骨也摆出数字，知道内情者都在等待那一天。童颜深入沈家老宅：满宅笠帽老人弈棋煮茶扫地画像，全是被严禁的复制人；侧院博物馆藏着比神明年代更早的人类遗存。喷泉边，青山祖师隔着无数光年借老人眼睛注视童颜。他亮明来意要沈云埋，以足以炸毁星球的行李包作底气；祖师称已为儿子设定三百年后醒来，童颜只盼他自己上过闹钟，获准安静搜寻半小时。他勘定阵眼在喷泉下，提着倒计时的炸弹步入山腹冰库，洞顶倒悬的塑料袋里皆是浅肤色的人形躯体。"},{"n":920,"orig":921,"title":"有名字的老人","people":["童颜","黄木槿","沈云埋","青山祖师"],"one_line":"童颜唤醒沈云埋暗线，焚沈家老宅而去","summary":"冰库倒悬的塑料袋里全是生化人——沈云埋的备用身体。童颜由此明白真相：沈云埋的修行、改造乃至一生都只是一场实验。随行老者才是那线生机：他暗中为少爷安排了一个连沈云埋自己都不知道的人，又启动躯体腹中的中微子通讯，信号可穿透岩层与大阵抵达黑色战舰。童颜的炸弹以苍龙之胃加麒麟血炼成的空间法宝为壶，内置数百颗多相核弹。老者求他焚了这座圈养复制人的宅子。童颜问老者名字，答曰黄木槿，是少爷小时候取的。他挥手作别，雾气与大火吞没沈家老宅，老者举火把告别后渐渐变形，童颜化作流光消失于宇宙。"},{"n":921,"orig":922,"title":"有女儿的先生","people":["丹先生","青山祖师","卓如岁","陈崖"],"one_line":"青山祖师揭飞升者互杀旧事，丹先生自爆拒胁","summary":"卓如岁从青山祖师处得知真相：三万年来青山与云梦山的飞升者在另一宇宙互相兑杀，七位青山剑仙由此殒命。因丹先生向童颜泄露沈家老宅位置，害老宅被焚，青山祖师斥其背叛。陈崖抓到丹先生，以他寻女一事相胁，逼问童颜下落。丹先生拒绝屈服，主动冲破自身道法屏障，任那根红色细线法宝将自己绞得粉碎，血染修理铺街道——陈崖出手阻拦失败，只因他在雾外星系被井九斩断三指，双手难当红线。临死前他从容点烟，讥讽天命所归不过是看谁拣垃圾的本事强。角落里，一只染血的劣质手环散出微光，仿佛在传递某种信号。"},{"n":922,"orig":923,"title":"破棺","people":["童颜","沈云埋"],"one_line":"童颜救出沈云埋头颅，惊闻井九将死","summary":"沈家老宅焚毁时发出的微弱信号借中微子穿越宇宙，抵达囚禁沈云埋头颅的幽灵黑色战舰；一名舰员头颅炸裂震开舰体缝隙，信号得以连续外泄，连成一条可循的线，经修理铺丹先生的血与假手环传到童颜手环上。童颜知丹先生已死，劫了太空海盗的快船，七天后寻到黑色战舰，破舰而入杀光舰上人员，连女管家也未及开枪自爆。他在引力场隔绝的舱房里找到盆中泡着的沈云埋头颅，喂入营养液，搬来机械臂与医疗物资，重造面容，再渡入仙气。沈云埋苏醒即破口大骂，听闻井九三天后便会死，只讥这笑话太烂，末了长叹：老李也死了。"},{"n":923,"orig":924,"title":"从零开始","people":["沈云埋","童颜","赵腊月"],"one_line":"童颜携沈云埋启程回朝天大陆求援","summary":"沈云埋决意复仇：星核舰队过半舰长听命于他，但备用身体已毁，老宅藏身又被童颜烧掉，复仇之路从零开始。童颜提出向朝天大陆求援——他是中州派掌门，可以仙箓传信，纵使可能打破两界界限、令人类提前灭亡也在所不惜。沈云埋念井九是他唯一的朋友，慨然同行；童颜告知其父放逐他三百年或为留他作人类火种，沈云埋自认不过是实验品。黑色战舰借黑洞转向，驶往朝天大陆。另一边，赵腊月抱弗思剑独坐崖边，只等井九死讯便斩向浴衣少女与星球；暮色里草原羊群排出「一」字，湖底巨鲲吐出环形气泡，天地归零。"},{"n":924,"orig":925,"title":"大爆炸是一切的开始","people":["井九","雪姬","赵腊月","曹园","浴衣少女"],"one_line":"倒计时归零井九未死，梦火裂缝直通海底","summary":"承天剑倒计时归零，全宇宙都以为井九醒了、死了，却什么都没发生：湖中巨鲲冲破环形气泡振翅飞天，曹园微笑；赵腊月闻知井九与雪姬在一起，收剑不赴死；浴衣少女亦推算出雪姬藏身人类社会，与井九作伴，庆功酒未饮。正当各方错愕，星河联盟中央电脑拉响警报：蝎尾星云梦火行星工业基地爆炸，一道空间裂缝七秒内扩至三百九十三米，为星门基地遇袭以来之最，且裂缝另一头不是海面，而是暗物之海的海底。而井九与雪姬、溪浑然不觉，照常弹琴吃饭，夜里竟隔着几十光年当场看见蝎尾工业区的大爆炸。"},{"n":925,"orig":926,"title":"漫长的一天","people":["伊芙","曾举","浴衣少女","陈崖","姜知星"],"one_line":"全星域备战撤离，曾举率烈阳号驰援梦火","summary":"大工业区的市政厅里，工会执行长怒斥政府阴谋，认为几十光年外的爆炸与己无关，反对劳民伤财；但暗物之海可借扭率空洞快速袭来，市府仍下令全民做好撤入地底基地的准备，伊芙领命三天完成街区撤离。浴衣少女决意重开封闭一年多的空间通道，令陈崖率舰队赶赴蝎尾星云组织撤离；陈崖为杀丹先生误了驰援，只能联系857基地。曾举放出狱中的烈阳号官兵，与舰长姜知星率队驰援，号令全星域就近舰队支援、三千余艘战舰分散护撤，约三亿人待撤。战舰生活区里，一名手戴流光银镯的灰格衬衫研究员嗅着茉莉茶，身份成谜。"},{"n":926,"orig":927,"title":"海底漫步者","people":["黑衣道人","曾举","姜知星"],"one_line":"钢铁蒲公英死守梦火，兽潮压顶剑光归来","summary":"蝎尾星云是联盟交通与重工业核心，六座行星工业基地皆被点燃融炼，梦火基地正是裂缝所在。重伤的黑衣道人独守危局：血拇、半尾、代序自裂缝涌出，十七艘守卫舰队以七千颗钢铁蒲公英的弹幕绞杀兽潮。曾举凭雪国兽潮般的直觉，强令战舰提前撤离、钢铁蒲公英重新列阵，话音刚落裂缝果然猛扩近倍，兽潮狂涌，弹幕将怪物绞成齑粉。钢铁蒲公英弹尽停摆，代序渐多，防线将崩，曾举欲引爆残存核弹同归于尽，通讯里忽响起一道冷如剑的声音：「我在回来途中，稍等。」一道明亮剑光穿透裂缝照灭兽潮，黑衣道人自死寂海底漫步归来。"},{"n":927,"orig":928,"title":"疾风吹散蒲公英","people":["黑衣道人","曾举"],"one_line":"黑衣道人断臂灭四母巢，重开裂缝融蚀","summary":"黑衣道人不顾重伤，背着融蚀设备贴近裂缝，以七百万度光热洪流封堵，中途触手偷袭搅乱光网，他怒骂着抱起设备猛扫。四只母巢随即钻出——此级怪物由众怪碎片杂合重生，极难杀死。道人化剑撞碎一只，左肩旧伤却被另一只偷袭，仙躯蒙黑，他索性斩落左臂断尾求生，装上机械臂再战；又将内藏多相核弹的钢铁蒲公英塞进母巢体内引爆，连灭四只，随后吸食核爆光热中的仙气回神，继续融蚀。全军默默为他祈祷，融蚀终入正轨。可他忽然觉出裂缝那头有异，视线与神识竟都被什么挡住，什么也看不见。"},{"n":928,"orig":929,"title":"剑仙恩生","people":["恩生","欢喜僧","曾举"],"one_line":"处暗者堵裂缝，剑仙恩生赴死，欢喜僧接手","summary":"裂缝早被一只处暗者塞满——它是暗物之海怪物群的帝王级存在，井九当年曾险死其手，如今核弹、激光尽数被其挡下。黑衣道人拒绝曾举的撤退令：「是处暗者，那就更不能退。」他自报家门：无恩门开派祖师，俗家姓名存羽，取意「天之无恩而大恩生」，无恩门自开派之初便是青山宗盟友。他自知必死，向全军自陈将战死此地，请诸君送行，随即合剑刺出处暗者，却被那股实质般的死亡寒意冻成银色雕像。千钧一发之际，禅宗之祖欢喜僧踏金属盘而至，碎霜按肩道「交给我吧」，将他掷回战舰，转身面对处暗者：「我再送你一程。」"},{"n":929,"orig":930,"title":"苍老的少年僧人","people":["欢喜僧","曾举","恩生"],"one_line":"欢喜僧灭处暗者重伤，扬言要杀老师曾举","summary":"欢喜僧以岩浆金龙与金身大手印镇压处暗者，少年容颜急速苍老。处暗者无法突破，径直自爆，行星被撕开一半，他金身碎裂被震飞至宇宙深处，由大涅盘接住。烈阳号率军赶到，等离子炮稳定战局，核弹如垃圾般封锁裂缝。曾举入医疗舱探望恩生，赠丹药并警告不得再抗军令；恩生自责误事，请曾举劝祖师接回沈云埋——精确融蚀唯沈云埋成功过两次。角落里，险死还生的欢喜僧盘坐疗伤。原来这位禅宗之祖正是曾举的徒弟：墨丘农夫出身，沙场悟道，创果成寺。师徒多年重逢，曾举却忽然问：「你想去杀我？」答曰：「是啊。」"},{"n":930,"orig":931,"title":"我去地狱找个人","people":["欢喜僧","曾举","恩生","姜知星"],"one_line":"欢喜僧宣告投向暗物之海，孤身入地狱寻雪姬","summary":"欢喜僧向曾举、恩生摊牌：暗物之海才是主世界，人类宇宙只是幽暗次元，大坝千疮百孔补不完，战争没有胜机。他的方案是找到雪姬——他推断女王陛下能感知乃至控制暗能量，朝天大陆实验室或许正是为孕育联通两个宇宙的存在而设——助她成为暗物之海君王，然后臣服于她。为免曾举阻拦，他本该先杀师，看在裂缝待补的份上暂且留命。他自认雪姬不会躲藏，遂当着全舰队的目光踏大涅盘飞入空间裂缝，头也不回。姜知星喃喃问可知道那边是什么，曾举答：「他当然知道那就是地狱。」灰格衬衫研究员最懂他：我不入地狱，谁入地狱。"},{"n":931,"orig":932,"title":"世内世外美如画","people":["欢喜僧","井九","雪姬","溪","曾举"],"one_line":"欢喜僧深引兽潮，井九一家淡然收下冻梨","summary":"欢喜僧深入暗物之海引开兽潮，暗能量不住侵蚀金身与禅心，他以佛火护体，借着垂死恒星的光找到数十只母巢，为后世留画存数据，道一声「来吧」转身便走。曾举的信息传来劝返，他坚信雪姬就在这边，不肯回头。另一头，井九与雪姬、溪在家中照常下棋吃饭；电视里滚动着预警字幕，邻居少年送来一篮冻梨与笨拙的善意字条，溪咬得眼泪直流，只得摆在窗台等太阳晒软。电视里官员彻夜争吵，井九速写窗台冻梨，又想起擅长画画的何霑。世内是鸡毛蒜皮的撤离准备，世外是高僧赴死的海底独行。"},{"n":932,"orig":933,"title":"是你吗？陛下","people":["欢喜僧","雪姬"],"one_line":"欢喜僧陷幻境忆败于雪姬旧事，惊觉是陛下提醒","summary":"欢喜僧被暗能量与处暗者的意志拖入幻境，重历两千年人生：墨丘饥民、沙场悟道、偷学青山剑法、千里风廊、创建果成寺、白城抗兽潮，直至坐化飞升，桩桩件件令他欣慰。幻境深处，他忆起当年独闯冰峰挑战雪姬，被一招破去金身打入雪海，在数十丈冰层下漂流濒死，最后冰裂天光，雪姬立于崖上唤他醒来。他顿悟那声「嘤嘤」是提醒——如今他在暗物之海海底再度濒死，恰与当年对应。欢喜僧惊醒，才知险些被处暗者永困幻境。他第一反应竟是欣慰：原来陛下在提醒自己。只是唤醒他的，究竟是她，还是他心里的陛下？"},{"n":933,"orig":934,"title":"我来到你的城市","people":["欢喜僧"],"one_line":"欢喜僧脱出暗物之海，坠望月星结塔镇裂缝","summary":"欢喜僧近观处暗者绘图存档，忽又一只现身，他不肯载入人类史册，转身便走。黑暗中忽现一点天光——新的空间裂缝正在成形，那可能是他离开暗物之海的最后机会。他循光而至，裂缝另一头竟是一颗居住行星。他以大涅盘抵住裂缝，硬扛两个世界的对冲之力，被喷出四十多公里，裂缝终被稳定在米许宽。他传念珠讯息给烈阳号，挟持卫星向全星球广播撤退令，又在废墟上结成十三层佛光宝塔镇压裂缝。此时窥视感再起，却来自行星之上——天眼望去，远处正是一座有篮球场与旧宿舍楼的破败小城。"},{"n":934,"orig":935,"title":"吃了吗？","people":["爱伦","伊芙","曾举","溪","欢喜僧"],"one_line":"望月星现裂缝，全星撤离，伊芙夜访七二〇","summary":"欢喜僧的念珠讯息传回：蝎尾星云边缘的望月星出现新空间裂缝。七名飞升者为九百六十万人的偏远星球争执不休，多数主张截断空间通道弃星，曾举拍板：「还是要去看看，不然万一呢？」烈阳号官兵全员自愿驰援，航程七天。望月星雾山市政厅吵了十七天，市长爱伦沦为笑柄；「第一序列事件，全体准备撤离」的广播骤然响彻全星球，工会老执行长一巴掌把发懵的市长拍醒，撤离启动。伊芙负责的四千宿舍区居民顺利登车，却不放心井九兄妹，赶回七二〇楼下；门开了，溪端着粥问：「老师，您吃了吗？」"},{"n":935,"orig":936,"title":"要帮忙吗？","people":["井九","伊芙","溪","雪姬","欢喜僧"],"one_line":"四千人被合金门困住，井九上前问要不要帮忙","summary":"伊芙催井九一家撤离，又赶去接独居孕妇，井九劝她「不要做英雄」，她答「不是做英雄，是责任」。裂缝暴涨引发地震，雾山市有序撤入地底。军方唤醒的无数蟑螂侦测出暗能量浸染范围远小于推算——因为欢喜僧正在镇压。井九问雪姬要不要帮忙，雪姬只盯着虚空不语。撤离最后关头出了大问题：工厂宿舍区四千民众所在基地的合金门被岩层数十年挤压变形卡死，物理嵌顿，三套备用方案尽皆失败，除非调战舰来援。站台恐慌渐起，技术官员瘫跪在地。混乱中，穿蓝色运动服的少年牵着抱娃娃的小姑娘走到门前：「需要帮忙吗？」"},{"n":936,"orig":937,"title":"存在的意义","people":["井九","伊芙","溪","雪姬","寒蝉"],"one_line":"井九液化金属开门救人，事了拂衣去","summary":"井九掌心流出金属细流，渗入锁芯遍布门内构件，十米高的合金门缓缓开启，四千民众欢呼入内，地底广场上众人却敬而远之，把他当怪物。伊芙送孕妇赶到，方知是他开的门。趁合金门将合，井九起身离开：他向伊芙预演了怪物救人反被驱逐的经典剧情，懒得重复，便先走了。金属回流体内，合金门再度卡死。回到七二〇，井九弹琴，问雪姬为何不去帮那位少年僧人，雪姬漠然不应；溪抱怨错过动画片，寒蝉则思考存在的意义。井九淡淡道：「麦田好像不需要守望者。」作者附记向读者推荐史铁生《我与地坛》。"},{"n":937,"orig":938,"title":"九个黑色的太阳","people":["欢喜僧"],"one_line":"九个处暗者降临望月星，如九个黑色太阳","summary":"佛光高塔被裂缝暴涨震裂，暗能量加速渗向地表，野兔田鼠纷纷黑化。欢喜僧改换策略，召出金色巨佛以大手印盖住裂缝，指节渐被黑暗侵蚀发黑；触手从掌缝钻出，被他生生撕断、吸入腹中焚尽。母巢们集体自爆震碎大手印，他踏大涅盘以刀法驭剑，数万刀将涌出的母巢绞成黑烟。然而裂缝里接连走出处暗者——先是巨人头颅，再是生着肉翅的异形，然后第三个、第四个……整整九个处暗者升上高空，如九个黑色太阳夺走所有光线，帝王般俯视世界。欢喜僧站在崖边，心想这一切到底是他妈的怎么回事。"},{"n":938,"orig":939,"title":"为你弹奏一首夜曲","people":["井九","雪姬","欢喜僧","溪","伊芙"],"one_line":"雪姬借琴音退兽潮，黑鸟临窗，猫声求救","summary":"九个处暗者引动天地，欢喜僧忽然彻悟：陛下就在这颗星球上收服臣民。雾山市被黑色兽潮淹没，万物触之即黑化，地底基地里九百万人哭喊绝望，胖子少年因偷藏卤鸡蛋挨了父母巴掌，伊芙则忧心井九兄妹的安危。七二〇楼里，雪姬令井九以右手弹琴、左手按在窗台——原来她自晨光变暗起就散出意志：不准靠近，不然全部都死。她不愿被迫出手惊动神明代言人暴露自己，便以琴音向愚蠢的怪物们传意。兽潮竟真的绕开了这栋楼，只有一只黑化的鸟落在桦树上，喙穿树干向内浸染。危急关头，树上忽然响起一声恐惧的猫叫。"},{"n":939,"orig":940,"title":"七二零守卫战","people":["井九","雪姬","溪","寒蝉","伊芙"],"one_line":"雪姬化井九为剑，剑网护七二〇灭兽潮","summary":"怀孕的小猫为避黑鸟向井九一家求救，雪姬的小圆手按上井九肩头，他左手指甲化作无形金属丝，一剑把黑鸟斩成两截，桦树应声而断，成了小猫的逃生桥。兽潮随即扑向七二〇，无形剑网将群怪寸寸切碎；井九的身躯也在雪姬加持下缩成少年、化身为剑——正是他当年说的「我最擅长做的事情就是切断」。剑弦残火腾起巨大火球，将怪物残骸烧成青烟。血拇这类微生物钻过剑网孔隙，却被镇魔狱的看不见的蚊子捕食殆尽。寒蝉归位窗台，漠然如君王。雪姬只觉无聊，让井九继续弹琴，七二〇如礁石屹立于黑色洪流中央。"},{"n":940,"orig":941,"title":"踏碎冻梨出铁门","people":["井九","雪姬","溪","曾举","欢喜僧"],"one_line":"琴曲终了，井九一家冰封出发，举世绝望","summary":"烈阳号尚需七天航程，望月星先是传出九百六十万人撤离成功的惊喜，随即九个处暗者升空，曾举与陈崖绝望撤令，浴衣少女开始计算封死扭率通道，举世皆判此星必亡。唯有卫星画面显示：七二〇号楼前兽潮绕行，四次冲击皆化作火球，舰上灰格衬衫研究员认出那些燃烧的剑纹，激动又惘然。欢喜僧重伤被三只处暗者围困，苦候陛下出手。井九的琴曲终于弹完，雪姬指向卧室，溪取出红布；雪姬踏碎一颗冻梨，整栋楼骤然冰封。井九收拾行李，想带走怀孕小猫反被挠伤，便留下一团剑火为它取暖，随后牵着溪踏出铁门。"},{"n":941,"orig":942,"title":"篮球场上","people":["井九","雪姬","溪","欢喜僧","浴衣少女"],"one_line":"井九出楼点杀群怪，怪物反扑七二〇","summary":"井九牵着裹红布的雪姬走出单元门，全星球怪物骤然静止，九个黑太阳也停止不动；下一瞬，所有怪物疯了一般反向扑向七二〇楼。中央电脑与温泉边浴衣少女同时锁定：那颗星球正是神明长大的望月星，她惊疑井九是否就是神明遗言所指的继承者。井九以指尖射出金属细线，如打枪般逐个点杀逼近的怪物，严寒将尸骸冻成雪粒；他带溪穿过楼区来到篮球场，重伤的欢喜僧踩大涅盘赶来，跌坐雪中，怔怔盯着她怀里的红布娃娃。黑潮沿悬浮轨道逼近，井九对着二十几公里外的枢纽站认真虚点，一根细线杀一只怪物。"},{"n":942,"orig":943,"title":"一生万物","people":["井九","雪姬","卓如岁","恩生","赵腊月"],"one_line":"雪姬隔空讲道，井九化身孩童万炮灭怪","summary":"井九以指尖金属线狙击全城怪物，二十几公里内无怪能近身，烈阳号官兵看得热血沸腾。此时篮球场四周响起合声：「道生一，一生二，二生三……万物负阴而抱阳」——是雪姬隔着虚空为井九讲道，全宇宙的强者都在凝神听讲，青山祖师、赵腊月亦不例外。井九因这段道音想起自己并非莱恩，随即想起不可想起，腕上青色光绳骤然绷紧，他的身躯缩小成三四岁的小男孩。男孩举右手向天，掌心生出万道剑弦如新日喷薄——实为万道重离子炮同时开火，一瞬杀尽星球表面所有怪物。宇宙各处光幕定格于这幅画面，卓如岁喃喃道：「这也可以？」"},{"n":943,"orig":944,"title":"世界的主宰","people":["井九","雪姬","溪","欢喜僧","曾举"],"one_line":"重离子炮难破黑域，井九重伤，雪姬现身主宰","summary":"万道重离子炮落在天空竟被滑开——九个处暗者相连形成黑域，如引力场般护住彼此。欢喜僧点破机关，井九却把万线合一，凝成一道贯天金属线刺入一只处暗者体内；对方死亡意志顺线反噬，精神世界一片空白的井九毫无还手之力，被轰落坑底昏死。全宇宙绝望之际，众人唯一的指望是雪姬——朝天大陆有史以来的最强者。溪怀里的红布忽然伸出一只小圆手，敲醒溪后，那个娃娃般的雪姬站上篮球场：寒蝉在她脸上爬出一道红线咧作嘴巴，她一声「嘤嘤」，威压传遍星球与深空，向所有人、所有怪物宣告——我才是世界的主宰。"},{"n":944,"orig":945,"title":"每一拳都要破碎虚空","people":["雪姬","欢喜僧","溪","井九"],"one_line":"雪姬升空碎黑域，拳拳破碎虚空","summary":"九个处暗者携黑夜压向地面，欢喜僧恍然：空间裂缝与兽潮皆因暗物之海畏惧雪姬而来，意在杀她。雪姬把红布盖住昏死的井九，飞身高空，一瞬毁掉全星球卫星与监控，切断望月星与联盟网络的联系，令浴衣少女再看不到她，因为随时准备要逃。随后她挥拳轰向实质般的黑夜，每一拳都破碎虚空，硬生生把黑域打得节节后退、裂开缝隙。全星球气温骤降逾百度，河流湖泊尽数冻结，欢喜僧燃起火莲为身边的溪取暖。"},{"n":945,"orig":946,"title":"牵手，你便是我的剑","people":["雪姬","井九","欢喜僧"],"one_line":"雪姬冻住九处暗者，邀井九执万物一剑","summary":"黑域如琉璃般碎裂，九只处暗者退向大气层边缘。雪姬转身追杀，小拳带着接近绝对零度的寒意，把一只只母巢冻成丑陋冰团，雪线织成六角星阵。欢喜僧看出她汗落成河——耗损极重，而冻住不等于杀死。井九此时醒来，雪姬望向他，那是与当年柳词请他执承天剑一样的邀请：请成为我的剑。巧的是承天剑法正是他当年在三千庵亲手教她的。习惯战胜恐惧，井九随意点头，被她握住手。红布化灰，一道远胜恒星的剑光冲天，遍地雪灰化作飞剑，如青山剑阵重现，连穿九只处暗者。"},{"n":946,"orig":947,"title":"几十万年后，此地又有烟花","people":["雪姬","欢喜僧","井九","溪"],"one_line":"九大处暗者灰飞烟灭，欢喜僧求同行被砸入地底","summary":"万物一剑连穿九只处暗者，自爆的死亡气息亦被剑光斩碎，九大母巢彻底消亡，化作九道美丽光环，残余粒子被吹向恒星焚尽。雪姬打响指点亮七二〇的灯，又挥手把残余的空间裂缝冻成坚固冰墙——飞升者要冒死为之的事，于她不过挥手之劳。欢喜僧赶来恳请与陛下同行去暗物之海，雪姬只报一声嫌烦的嘤嘤；他伸手想留住她，被她一拳连砸十几记，生生打进十几公里深的地底，废墟轰然倒塌。井九看她落拳未用真力，隐觉她与这和尚似有旧识。雪姬带着溪与井九离开，雪落又止，三人踪迹消失在原野里。"},{"n":947,"orig":948,"title":"余波","people":["曾举","曹园","欢喜僧","恩生","爱伦"],"one_line":"望月星解危举世欢呼，曾举救出欢喜僧","summary":"望月星气温回升，监控恢复，确认怪物死绝、裂缝被神秘力量堵住，九百多万地底民众爆发出欢呼。曹园乘海盗快船赶到天火工业基地，从重伤的恩生手里接过融蚀设备，以不灭金身独自修补裂缝。烈阳号降落，曾举亲自查探，指尖触及冰封裂缝便确认了雪姬的强大；又在废墟深处发现古怪深洞，五级清场后把昏睡六天的欢喜僧从洞底提出。欢喜僧喃喃感叹雪看多了会不会盲，曾举打趣那是白内障。欢喜僧临走提醒曾举不要逞强融蚀。而另一边，爱伦市长看着光幕上的命令大为震撼：为什么要逮捕伊芙？"},{"n":948,"orig":949,"title":"触动了伤心的魂","people":["欢喜僧","曾举","伊芙"],"one_line":"欢喜僧读心知雪姬惧电脑，抛出人类化魂方案","summary":"欢喜僧与曾举疗伤毕，仍不解雪姬既已收服万物一剑为何还留在望月星。伊芙被军方拘来问话，欢喜僧以果成寺两心通读其记忆，看到井九兄妹藏居楼中、不与世人往来的点滴，得出结论：陛下不是藏天下，是藏自己——她真的害怕那台电脑里可能留有神明控制她的方法。这个事实令禅宗之祖大受冲击。他随即向曾举摊出终极方案：暗能量只浸染生命体，若全人类舍弃肉身、以灵魂形式进入大涅盘三千世界，再奉雪姬为暗物之海君王，人类便可在这片海底存续。曾举斥其不可能，欢喜僧反问：「人类以灵魂形式存在有什么不好呢？」"},{"n":949,"orig":950,"title":"我是柳十岁","people":["欢喜僧","曾举","柳十岁","伊芙"],"one_line":"欢喜僧入魔夺魂，灰衣研究员自报我是柳十岁","summary":"欢喜僧论证灵魂可以独存——南趋的剑鬼、西来体内的阴凤残魂、青天鉴变活人皆是例证；曾举断言凡人不可能皆如南趋，强行夺魂只会炼出死魂灵。欢喜僧却看中伊芙干净坚定的灵魂，当场施天人通要摄走她的魂魄。曾举出手阻止，却惊见欢喜僧足下生出黑莲——他在暗物之海被处暗者侵磨太久，禅心入魔。二人大战：圣人血凝成飞剑被大涅盘震碎，曾举写「定」字经，被欢喜僧一纸「嗔」字斩落山崖。欢喜僧探手摄魂，飞来的却是救下伊芙的灰衣中年人；对方以禅宗光镜硬接佛火龙拳，再以管城笔撕碎「怒」字，自报家门：「我是柳十岁。」"},{"n":950,"orig":951,"title":"让我给你解释一下为什么你打不过我","people":["柳十岁","欢喜僧","曾举"],"one_line":"柳十岁万宝齐出，不二初子双剑破大涅盘","summary":"柳十岁亮明身份：一茅斋新晋圣人、天生道种、青山两忘峰弟子、血魔教唯一传人，更是井九的童子。二人再战：欢喜僧的念珠清光、金刚杵接连被万魂幡卷碎，大涅盘也被冥皇之玺砸出小坑；他自恃大涅盘内藏三千世界无人能破，柳十岁却祭出从未实战过的银色小剑不二剑。不二剑毫无怯意，以万物一剑道穿过重重世界刺在大涅盘上——曾举感慨这是青山剑道第五人走到万物一。第二剑换初子剑精准落在原口再进，欢喜僧椎骨断裂、腰下瘫痪，瘫坐盘上喷血。他问那是什么剑，答曰：初子剑。万物之下的不二与初子竟都在这孩子手里。"},{"n":951,"orig":952,"title":"青山就是忍不住","people":["欢喜僧","柳十岁","曾举"],"one_line":"欢喜僧撒孢子遁走，柳十岁道出盯杀之约","summary":"欢喜僧腰下虽瘫，仍驾大涅盘冲天而逃，把历年吸入盘中的黑暗孢子、血拇尽数撒向星球——为人类而战的禅宗之祖做出此事，悲凉可笑。曾举挥扇封毒烟，柳十岁以万魂幡收尽孢子；欢喜僧临走撕碎一艘战舰，撂话「等我脱了这衣服，再回来找你们」。曾举向全星系广播：大悲和尚被域外天魔污了禅心，疯了。叙话中柳十岁坦言：新一代数年前便约定盯死最强前代仙人，他本该盯欢喜僧，找不到才盯住了曾举；两把名剑得自雾岛剑经与彭郎相助。柳十岁说公子写书是怕前代师长思乡，曾举摸着他的头叹道：对井九而言，这里才是家乡。"},{"n":952,"orig":953,"title":"公子住过的地方","people":["柳十岁","曾举","赵腊月","伊芙"],"one_line":"柳十岁探七二〇断定井九未醒，密会赵腊月","summary":"柳十岁与曾举走进七二〇，小猫认得他的声音安静下来；伊芙被请来闲谈，讲述一年来给莱恩送海报、看着他学琴下棋的点滴。柳十岁翻看琴上画本，断定公子不可能这般勤奋、更不可能学琴棋书画——井九并未醒，只是不知被雪姬带去了何处。他借战舰网络潜入《大道朝天》游戏，在果成寺菜园向赵腊月汇报。赵腊月责他出手太早，应等曾举与欢喜僧两败俱伤再尽杀之；柳十岁只道曾圣人是好人，劝她莫要好杀。原来小荷葬在菜园，他守坟数年，直到童颜飞升、顾清跨海吊唁才出山，想着公子与他们或许需要自己。"},{"n":953,"orig":954,"title":"千里孤坟不凄凉","people":["柳十岁","顾清","赵腊月","胡太后","甄桃"],"one_line":"柳十岁守坟往事，顾清携妻重返朝天","summary":"四百年前柳十岁守完师兄奚一云之坟，又为小荷守墓菜园；赵腊月劝他回青山，笑称不然就把卓如岁踢了让他做掌门，童颜也来共议飞升后诸事。数百年后三人果然飞升，在游戏果成寺重聚，商议如何解决雪姬的问题；柳十岁从石塔取出藏着的泡菜坛子——小狐狸已死，老狐狸也所剩无多。另一边，帝师顾清携胡太后、甄桃乘宝船重游鸣泉秘境，笑谈何霑躲进白城小庙多年；此行是为平咏佳所托之物与那件大事归来。途经蓬莱，水月庵仍不肯原谅他拐走最优秀女弟子，不许船靠岸；其子景尧出家为僧，也始终不肯见母亲。"},{"n":954,"orig":955,"title":"笑问客从何处来","people":["顾清","元曲","胡太后","甄桃"],"one_line":"顾清还乡吃火锅，神末峰猴群认旧人","summary":"顾清不驭剑而坐马车还乡，那辆镶水晶的豪车正是师父当年座驾。他先回云集镇吃火锅，酒楼东家按祖传画像认出他，册子末页那幅白衣剑仙脸上却是一片空白。随后他踏剑经洗剑溪回到神末峰，重逢鬓已染霜的元曲；两位妻子为火锅红白汤谁先沸争执，元曲点破当年是顾清用神通让两锅同沸。谈及上德峰之殇：黑玉盘上尸狗镇守，迟宴寻灵脉十几年无果，长老故去大半，广元真人化作清风别过青山。他伫立崖畔睹物思人，猴子们却骚动起来，竟对这张陌生面孔生出熟悉感，顾清对小猴子笑道：我本来就是这里的人。"},{"n":955,"orig":956,"title":"通天大阵","people":["顾清","平咏佳","南忘","雀娘","景澄"],"one_line":"各宗合力筑通天大阵，静待飞升援井九","summary":"神皇景澄上神末峰拜见祖母胡太后与师祖顾清。故上德峰黑玉盘上，各宗派正合力构筑通天大阵：以景阳飞升的烟消云散阵为基、反用太平真人通天杀阵之意，由阵道大宗师雀娘主持，晶石法宝如流水般涌来，只为送人出界——半年前童颜来信，称井九在仙界出事。清容峰上，南忘收着中州派的仙箓，笑骂着说不必担心井九，那家伙就不会有事。青山一统天下，万宗朝天，修行界迎来最美好的大修行时代。阵成之日，水月庵长老的桃枝只剩最后一瓣，平咏佳接枝插腰，环视群峰问道：今日谁要飞升？"},{"n":956,"orig":957,"title":"那些人儿","people":["平咏佳","彭郎","阿飘","苏子叶","雀娘"],"one_line":"飞升名额之争，彭郎阿飘登场","summary":"通天大阵启动在即，走的人依次站出：主持大阵的雀娘要出棋坪看看；资质普通的元曲夫妇自嘲最有资格报名；邪道巨擘苏子叶以解药之名强讨名额，一句「谁不服」震住全场。无恩门掌门彭郎无声无息现身——他才是人族第一强者，只因雪国女王离不开朝天大陆，还被支使「出去抓个仙人回来」。冥皇阿飘乘轿杀到，指着平咏佳鼻子骂他不让自己飞升，又叮嘱元曲讨还冥皇之玺。神末峰上，顾清一家远远看着，道破本质：这不过是打不过就回来搬救兵；顾清自知战力不足去了添乱，决意留守，笑看元曲夫妇去「观光」。"},{"n":957,"orig":958,"title":"一切源起于两个疯子","people":["沈云埋","童颜","卓觉晓"],"one_line":"黑棺抵达朝天大陆之外，童颜古镜传讯","summary":"黑棺战舰抵达海印星云边缘，沈云埋用舰上材料拼出全合金机械巨躯，脑袋装进中控室，自嘲像老电影里的机械战警；童颜淡淡道：你和卓如岁会成为好朋友。战舰抵达那片虚无前——白色恒星投影其中，那便是朝天大陆的太阳；沈云埋兴奋地抛出空间监狱、神明镜子等十七种猜想，又在悬浮的竹椅前想起书中旧事，被童颜拦住不得取椅。童颜掷出一面古镜——中州派开派祖师传下的通讯法器，镜中石阶云雾深处，一名红衣少女踏阶而上，正是他的关门弟子。两位「疯子」隔着虚空，终于与朝天大陆接上了头。"},{"n":958,"orig":959,"title":"我也想出去看看","people":["卓觉晓","平咏佳","尸狗","童颜","沈云埋"],"one_line":"卓觉晓押阵而来，尸狗开口求飞升","summary":"童颜与沈云埋在战舰中计算虚空边界的能量区间，沈云埋絮叨老电影打发无聊。朝天大陆这边，该走的都站了出来，卓觉晓却带着中州派高手姗姗而来，这位红衣少女掌门把元曲夫妇、雀娘、苏子叶统统唤作「家伙」，还扬言要替青山把掌门一肩挑了，被平咏佳连哄带劝按下。随着平咏佳一道剑意点燃流金，通天大阵轰然启动，数百件法宝依次亮起，剑意渐生。然而大阵最深处还坐着一座黑色的山——镇守尸狗始终未离。它缓缓睁眼，目光温暖而好奇，说出青山上下第一次听见它开口的话：「我也想出去看看。」满峰动容。"},{"n":959,"orig":960,"title":"集体度劫","people":["沈云埋","童颜","尸狗","彭郎","雀娘"],"one_line":"众仙渡劫出界，沈云埋隔空加油削薄天穹","summary":"南忘掷出仙箓，尸狗咬箓升空，彭郎、苏子叶、雀娘、元曲夫妇相继入光柱。天劫骤至：覆盖整片天空的雷暴轰下万千闪电，大阵光柱摇摇欲坠，天地灵气急速枯竭。战舰里，沈云埋仍怕两界湮灭，最终携苍龙之胃所装的多相核弹与融蚀设备出舱，借童颜的云梦阵与融化金属凝成的青山剑阵，朝着虚空一点喷出狂暴光热洪流——「这不是烧焊，是加油」。大陆上众人只见天外落下一道精确洪流，把那一点天空缓缓削薄；天光峰的石龟打了个呵欠，把落下的天劫闪电尽数吞了。雷暴散去，诸人不见，界线仍在，灵气自石龟呼吸间缓缓回归。"},{"n":960,"orig":961,"title":"天若有情天亦吵","people":["沈云埋","童颜","彭郎","顾清","胡太后"],"one_line":"新仙登舰，童颜谋突袭青山祖师救井九","summary":"尸狗与彭郎等新飞升者在黑棺战舰中醒来，只觉仙界黑暗寒冷、大失所望。沈云埋自称沈青山之子、行动总指挥，众人肃然行礼，被童颜拆穿父子早已反目；随后以脑机系统急灌常识，并言明来意：井九失踪，童颜将突袭青山祖师救人。新人们各有盘算：雀娘要先见师父，苏子叶不便插手，元曲只肯加油，彭郎非见井九不出手，气得沈云埋大骂。战舰掠近恒星短暂开启，借引力场屏蔽，错过了望月星的画面。另一头，顾清携妻周游大陆，四年后胡太后于朝歌城辞世，其子景尧守灵整夜，仍想不明白母亲爱的是谁。"},{"n":961,"orig":962,"title":"一声简单的嘤嘤","people":["井九","雪姬","溪","曹园","卓如岁","青山祖师"],"one_line":"联盟大网追捕井九雪姬，雪姬定下去祖星杀祖师的计划","summary":"星河联盟以数万战舰与二十几名飞升者铺开大网追捕井九与雪姬，柳十岁从望月星球居民楼走出，对卫星露出微笑。海滩上卓如岁震惊柳十岁藏得深，青山祖师断言雪姬既现身宇宙便会被找到，井九不过是一把剑。天火基地裂缝融蚀成功，曹园继承欢喜僧遗产，背铁刀去暗物之海送他最后一程，撤离民众在天街转运港目睹金佛追杀曹园。巨型战舰里，溪照顾未醒的井九，他仍是自闭少年，头疼加重，腕上青色光绳愈发实质。雪姬推算出路线：先在空间通道里做那件大事，再去镂空象牙球般的星球休息，最后去祖星杀沈青山，得意嘤嘤。"},{"n":962,"orig":963,"title":"明天来临","people":["井九","溪","雪姬","陈崖"],"one_line":"井九刺破溪的芯片，战舰载三人驶入隔绝通道","summary":"溪在战舰里吃饭哼歌，拒绝了井九同看动画片的邀请。战舰用拟真游戏画面安抚撤离民众，宣布明日进入人类发现的最长空间通道——通往主星云的伽雷通道。次日溪带井九吃饭、看演出，两人首次暴露在监控下却无人能看见；溪颈后被雪姬当作蚊子叮了一口。井九上台与星球总工程师对弈太空军棋，不落下风。倒计时开启，井九却在最后关头站到溪身后，以化作细线的指甲刺破她后颈的芯片——那正是那位的降临容器。战舰随即驶入与世隔绝的通道，雪姬露出得意而可怕的笑。通道外两百艘战舰早已埋伏，陈崖率队，更多飞升者正在赶来。"},{"n":963,"orig":964,"title":"废话","people":["浴衣少女","陈崖","柳十岁","曾举","赵腊月"],"one_line":"电脑推算出雪姬动向，仙舰群布网伽雷通道","summary":"主星温泉边的浴衣少女动用中央电脑全部算力倒溯分析，锁定雪姬疲惫虚弱、可能经伽雷通道逃走，命陈崖率舰埋伏，并下令不要惊醒井九。通道外陈崖紧张说出「出口也就是入口」，接到主星确认，两位黑衣妖仙立下生还后的愿望。烈阳号上柳十岁检查万魂幡等法宝，向曾举直言要杀陈崖那样的仙人三个；曾举未决定站哪边。主星北面，赵腊月让冉寒冬传数据，宣布动手的不是自己。战舰倒计时进入通道，井九突然以指甲化线刺破溪颈后芯片，雪姬露出可怕得意的笑容。"},{"n":964,"orig":965,"title":"可以触碰，便可以毁灭","people":["井九","雪姬","溪"],"one_line":"井九设局困住那位，可以触碰便可以毁灭","summary":"井九醒来，向被困在溪身体里的那位揭底：这是他与雪姬从地下水道就开始的局——先营造她渴望观战的场景，再断绝宪章网络诱其降临这具她最惯用的身体，入通道后毁掉芯片，使她成为可以被触碰、被杀死的躯壳；雪姬更曾演练一年多冻住她的手段。井九与她论「我」，断言杀死的这个她就是死亡，令她第一次感到真正的恐惧。溪试图谈协议，井九拒绝，称孩子们会凭心意知道该做什么。青色光绳不断陷入井九手腕，那是控制他的程序与剑鞘，溪嘲讽出通道他便会被沈青山握住，井九答受不了就再睡。"},{"n":965,"orig":966,"title":"看见白猫","people":["赵腊月","阿大","成霜"],"one_line":"联盟超饱和攻击无效，阿大踩碎引力场现身主星","summary":"赵腊月盯了温泉边浴衣少女多日，见对方启动引力场护体，断然出手。联盟中央电脑判定她要行刺，主星防御系统对观景平台发起超饱和打击，千道光柱齐至。阿大绽成巨大白色蒲公英包住整个崖台，把激光、粒子炮与电磁弹尽数吞入腹中，一个喷嚏反将卫星与轨道炮轰散。东易道飞升者成霜出手，被阿大一爪挥飞，衣衫尽碎。主星城市陷入混乱，民众仰头看见遮天白猫。阿大落到北半球，像小猫按线团般一爪踩碎引力场雪球，温泉边的浴衣少女抬头，看见了那只白猫。"},{"n":966,"orig":967,"title":"备份清除计划","people":["赵腊月","青儿","阿大"],"one_line":"赵腊月斩杀少女毁灭备份，青儿夺舍中央电脑","summary":"赵腊月先一步落到地表古堡，园中只剩生化人尸体。她掷出弗思剑，瞬间将温泉边的浴衣少女斩成碎屑沉入水底，但阿大警告杀死少女不等于杀死那位。电子音宣称自己无法被杀，赵腊月以青天鉴指引万千剑意杀入主星所有运算核心，关停两大备用数据库，烧毁数十具「溪」式备用躯体的颈后芯片。宇宙深处荒凉行星上的中央电脑本体，绿色字符如青鸟振翅——真正动手的是青儿：她早在枝头守候多日，趁那位灵魂被封在溪体内夺舍成功，取得中央电脑控制权。赵腊月随即命她发送程序令全宇宙战舰自锁，并寻找控制雪姬的方法。"},{"n":967,"orig":968,"title":"不管是不是人类都喜欢想多","people":["井九","雪姬","溪","陈崖"],"one_line":"全宇宙战舰被程序锁死，井九拒绝爱的指控","summary":"伽雷通道外围杀舰队增至千余艘与六位仙人，陈崖等布置引力场捕捉。最高权限指令突然令所有战舰自锁进入绝对静默——赵腊月的程序让战舰误以为将入扭率空洞，强行开启便会自爆。仙人们逃出战舰，判断中央电脑已被人控制。通道内青色光绳不断陷入井九手腕，雪姬度寒气为他缓解，代价是他遗忘一些东西。溪挑拨说传人们控制中央电脑等于控制他，井九坦言自己已应雪姬之请做她的剑，双向控制即是不控制，待雪姬恢复便去杀沈青山。雪姬将溪冻入演练过一年的坚冰，溪抛出最后的质问：你们还是爱人类的啊。井九只答：你还是想多了。"},{"n":968,"orig":969,"title":"后仰便是君临","people":["雪姬","井九","溪","陈崖","青儿"],"one_line":"雪姬握井九为剑挡回等离子炮，白线破空而去","summary":"井九答不出囚禁那位是否等于杀死溪姑娘，索性闭眼变回自闭少年。战舰驶出伽雷通道，唯独这艘自动解除静默，舰内响起青儿的声音：我来接你回家。陈崖以阵法激发等离子炮轰击，雪姬带着井九与冰中溪出战舰，握住他的手当剑迎击，等离子束被绝对平滑的身体原路挡回，反将炮台与阵法消融，陈崖轻伤，两位黑衣妖仙被震飞数千公里。仙人们由此确认望月星球九名处暗者是怎么死的。陈崖喊话愿许雪姬自由，只求她别管人类。雪姬身体微微后仰——后仰便是君临，嘤嘤一声后带着井九化作一道白线离去。"},{"n":969,"orig":970,"title":"眼光所及之处","people":["赵腊月","冉东楼","青儿","冉寒冬"],"one_line":"赵腊月直播立威，机甲如雨坠落宣告掌控世界","summary":"仙人们震撼于雪姬不惧深空的速度，猜想她是负熵生命，陈崖决意去祖星等候。主星温泉边，赵腊月催青儿尽快找到物理操作权限，军方与祭堂随即包围群山。冉东楼质问她为何打破多年默契的平静，赵腊月答「我需要你们的文明」，令全体投降；冉寒冬三人坦然站到她身后。红衣主教冲上前被冉东楼亲手击杀，他随即代表主星宣誓效忠。赵腊月令青儿向全星河联盟新闻直播此地画面，让井九、雪姬乃至失踪的童颜都看到她已掌控世界，无数人在画面里认出她。最后她望向天空，数百台武装机甲便如雨坠落——这个世界都在她的控制之下。"},{"n":970,"orig":971,"title":"全世界向她投降","people":["赵腊月","冉寒冬","柳十岁","陈崖","冉东楼"],"one_line":"无人敢赌自爆，冉家效忠，赵腊月全面接管联盟","summary":"武装机甲如雨坠落，赵腊月警告自锁战舰若强行开启便会自爆，无人敢赌十几万艘战舰的烟花，只得任她摆布。她说若井九无法成为新神明，就由她来做。伽雷通道外，陈崖借量子通讯求见，赵腊月只留下「这个宇宙最大的问题是距离」便挂断。柳十岁在游戏里确认民用飞行器解禁，得知童颜仍无消息，决定亲自去祖星走一趟。银色飞船飞往军部大楼途中，冉寒冬汇报联席会议安排；赵腊月点破自己出手正因井九现身——他不会没有把握便露面，新闻直播是发给井九与童颜的信号。冉寒冬还坦承冉家一直站在他们这边，父亲那些沉痛都是演技。"},{"n":971,"orig":972,"title":"一杯茶的功夫","people":["赵腊月","冉寒冬","陈中校","阿大"],"one_line":"赵腊月一杯茶的功夫完成政变，携四万战舰出征","summary":"银色飞船降落在军部大楼，满楼武器无一敢开火。李将军旧部陈中校用无芯片的旧式火药枪射击，被赵腊月捏住变形的子弹，问「你想死吗」，她放下枪奉茶。联席会议上祭司发难即被踢出，赵腊月放出星门女祭司躬身称她「神使」的画面，五分钟便结束会议，令各星域沦为孤岛。随后数百艘战舰被唤醒，舰长们拒降，冉寒冬安排三天内接受思想烙印验证。赵腊月带着阿大到恒星旁饱吸仙气沉睡恢复，数日后政变悄然完成，收服四万艘战舰。她在办公室合上停在原页的小说，毁掉蓝色蝴蝶饰物；军部大楼化作巨型战舰升空，与集结的四万艘战舰会合。"},{"n":972,"orig":973,"title":"战舰上的观光客们","people":["沈云埋","童颜","雀娘","苏子叶","元曲","彭郎"],"one_line":"刺杀小队乘黑色战舰抵达太阳系，迎面撞上仙人","summary":"沈云埋驾驶沈家黑色战舰，载着童颜、雀娘、彭郎、元曲、玉山、苏子叶等人，冒恒星引力加速赶往祖星，执行刺杀青山祖师的计划。他列出前代飞升者战力表：大悲和尚、成霜、和仙姑、神打先师、无问道人、被井九斩断三指的陈崖、双生黑衣妖仙顾左顾右等。众人还得知青山祖师的底细：他自认被神明选中，对拯救人类毫无信心，投降无意义又放不下责任，所以痛苦变态，严禁任何人打开朝天大陆留火种。战舰抵达太阳系外围，尸狗率先警觉——一艘破烂飞船迎面而来，船上十几位气息惊人的存在。沈云埋尴尬承认：他们是仙人。"},{"n":973,"orig":974,"title":"海盗船上的乘客们","people":["陈崖","顾左","恩生","和仙姑","神打先师"],"one_line":"仙人夺海盗船赴祖星，与刺杀小队在太阳系相遇","summary":"多日前，被困的陈崖等仙人在隐网以黄玉二号矿石作饵引来海盗船，杀光海盗夺船，接上剑仙恩生、无问道人、和仙姑、神打先师等十三位仙人。破烂船舱里，顾左感伤几年间朝天大陆同源自相残杀，质疑除了用万物一剑点燃恒星是否别无他法；恩生直言所有对策都是赌博，要争取成为胜利的一方。仙人们推演了对柳十岁法宝、赵腊月剑道与白鬼仙气的布置，认定井九不醒不足为惧，雪姬则一拥而上听天由命。海盗船抵达太阳系外围时彻底散架，恩生干脆坐在船顶。远处，一艘黑色战舰破洞处站着几个新人，船顶趴着一只巨大的黑狗。"},{"n":974,"orig":975,"title":"对线","people":["童颜","苏子叶","和仙姑","元曲","玉山","雀娘"],"one_line":"两船对轰互有损伤，战舰撞上无形杀机开始碎裂","summary":"童颜决定抢先进入太阳系赶赴祖星，黑色战舰全速开拔。和仙姑隔空织网锁住战舰，双方隔着数千公里对轰：雀娘在陨石间布下拟成陨石的太空暗雷重创海盗船，神打先师以打神道金环击穿战舰防御，元曲、玉山夫妇以剑弦与冰墙勉强支撑。苏子叶以青色血珠染显无形之网，一把魔焰将其烧断，战舰骤然加速甩脱海盗船，还依沈云埋所请绕开了不吉利的冥王星。然而尸狗与彭郎同时警觉——前方一片虚无中藏着极度凶险。苏子叶放出黑幡试探，瞬间被无物切碎，他喷血重伤。战舰随即开始无声解体，合金与法宝纷纷断裂。"},{"n":975,"orig":976,"title":"太阳系是一座剑阵","people":["尸狗","童颜","彭郎","沈云埋","雀娘"],"one_line":"尸狗驮众人生门入阵，太阳系竟是祖师布的剑阵","summary":"战舰破碎之际，尸狗驮着众人，在满天隐而未发的剑意里看破隐藏的道路，安然前行；海盗船上的仙人们也随之通过。童颜等人落在一颗荒芜星球的高山，沈云埋揭晓这是火星，西天边那颗蓝色星球便是人类摇篮祖星。众人很快发现火星的大气里同样有剑意，卫星「宁静地碎了」。彭郎点破真相：整座太阳系是一座剑阵——八大行星排成上长下短的十字形，宛如一把宇宙诞生以来最大的剑，太阳是镶嵌在剑柄底部的明珠。青山祖师以太阳为阵枢、行星为阵基，借无限空间的引力引发天地杀机，壮阔到无法形容。"},{"n":976,"orig":977,"title":"火星上的课题组","people":["沈云埋","童颜","雀娘","苏子叶","彭郎"],"one_line":"剑阵无出口祖师自囚，火星课题组推演破阵之法","summary":"众人在火星复盘：此处是剑阵生门，却没有出口——青山祖师以数百年把太阳系变成绝对隔绝的死阵，自囚于此，也把整个世界囚禁在外。沈云埋认为这是怕井九与雪姬来杀他，童颜判断祖师是想再开辟一个朝天大陆，熬死井九。为破阵，火星上的课题组开始推演：沈云埋授课，童颜与雀娘演算，苏子叶以魂火验证出公式缺失两个关键点；彭郎提出阵眼在动。童颜与雀娘强行观星，尽数吐血重伤。得不到关键数据，彭郎与尸狗决意亲身入阵寻找阵眼，化作一光点一黑山消失在宇宙里。"},{"n":977,"orig":978,"title":"天降奇山","people":["陈崖","和仙姑","元曲","玉山","雀娘"],"one_line":"陈崖化山砸落火星，玉山元曲接连败北","summary":"课题在火星继续，彭郎与尸狗迟迟未归。十余天后，陈崖化作数十丈高的石人自虚空砸落山顶，一拳轰入崖石，震出火星史上最强的沙尘暴。众人被震飞：玉山与雀娘最远。和仙姑赶到，玉山主动请战，雪流剑法在这件名为梦蝶的仙网前毫无施展余地，被掷入山腹生死未知。元曲撑伤出战，以清容峰无端剑意混融雪流的干冰寒气冻住仙网，露出无形剑体破网而入，仍被和仙姑以漫天雪蝶化成的雪团击中胸口，喷血坠向荒原。雀娘散出数百面残破铜镜迎敌——那是她自创的黑白分棋之道。"},{"n":978,"orig":979,"title":"吾爱吾师","people":["和仙姑","雀娘","童颜","恩生","沈云埋","苏子叶"],"one_line":"黑白棋道困和仙姑，童颜擒两仙回崖谈判","summary":"满天铜镜化作黑白棋子绞杀，和仙姑衣裙破裂、金血燃烧，虽凭仙气赌赢却没有下杀手，问出雀娘是井九的弟子便收回玉山与元曲，感慨晚辈道法高明却境界不足。另一边，剑仙恩生循迹找到自埋的沈云埋机器人，两个机械臂互竖中指。苏子叶被云师的拂尘仙气压得认输，仍讨打不休。崖顶陈崖盘算尸狗、彭郎的去向，不解柳十岁与赵腊月为何未到。峡谷里，童颜面对神打先师等三名仙人，以满是青山剑意的小钟连出奇谋，重伤擒下两名仙人，随后破开天空现身崖间，以两人性命要挟前代仙人谈判。"},{"n":979,"orig":980,"title":"吾师即是真理","people":["彭郎","陈崖","童颜","和仙姑","沈云埋"],"one_line":"仙人设局伏击彭郎，承天剑鞘锁剑一杵轰飞","summary":"众仙惊叹童颜竟集云梦与青山两家之长。沈云埋劝童颜杀人逃命，童颜真的引动杀意，和仙姑喝止，陈崖冷淡表示反正都是死。和仙姑问明各方立场：沈云埋为父要把自己变成活死人而来复仇；童颜等人则因祖师的道路要井九死，而井九怎么都不会死——谁能活下来，谁就是阶段性的真理。此时彭郎自剑阵归来，脸色苍白，剑被青色光绳系于颈间。仙人们早已设局等他，五位仙人祭出最强法宝阵法围困，彭郎以承自鬼剑道的剑遁术穿阵而出，仍被陈崖以青山祖师新铸的承天剑鞘锁住手与剑，一记石杵如山般把他轰飞远方，生死不知。"},{"n":980,"orig":981,"title":"诸神的黄昏","people":["彭郎","神打先师","和仙姑","陈崖","沈云埋","恩生"],"one_line":"彭郎带枷连胜两仙，八仙大阵静候尸狗","summary":"陈崖一拳脱力，宣告晚辈输了，八位仙人布下八仙过海大阵，只待困杀归来的尸狗。沈云埋喊出此山名为奥林匹斯，神话里诸神皆死于此，又打算引爆自己通知尸狗。黄昏时分，彭郎从荒砾间一步步走来，横剑于颈如弦上之箭，连人带和仙姑的无形巨网撞飞，将她砸进十余里高的崖壁。面对神打先师的打神道雷音，他以弯剑为琴、指尖作声，剑音压过雷鸣，斩碎系鼓的草绳与小鼓，一指弹剑震散仙气，神打先师重伤败退。彭郎连胜两位仙人，再转身时面对拦路的同门恩生，横剑的姿式如戴着枷。"},{"n":981,"orig":982,"title":"剑，生来就是要出鞘的","people":["彭郎","恩生","无问道人","陈崖","童颜","沈云埋"],"one_line":"彭郎断绳斩废恩生一臂，无问道人反水斩陈崖","summary":"彭郎向恩生低头告罪，仍执意上山，恩生弃剑入座，以万物一剑把整颗火星化为己剑，彭郎则反手斩向颈间青色光绳，险似自刎却重获自由，一剑斩断恩生手臂。恩生欣慰晚辈所悟是自创的无恩门剑道——剑生来就要出鞘，这是井九当年在三千院所教。彭郎拖着重伤回到崖顶，宣布还没打完，要报复偷袭的陈崖。此时无问道人突然反水，借路过陈崖身边之机挥巨剑斩下，陈崖仓促以石盾格挡，脸上裂如蛛网。无问道人质问丹先生之死，点破顾左顾右兄弟与此有关，童颜闭眼回忆起星门基地的电子维修铺——丹先生的死确实与他有关。"},{"n":982,"orig":983,"title":"把你打成一座残缺的石像","people":["无问道人","陈崖","童颜","柳十岁","云师"],"one_line":"无问道人战剑阵化尘埃，柳十岁一拳打成石像","summary":"无问道人质问陈崖为何杀丹先生，得知丹因向童颜等人泄露沈家老宅与祖星位置而死，他直言「我现在不同意你们的道了」，举剑再战。陈崖抛出青色光绳引动太阳系剑阵的剑意闪电群，无问道人怀着剑者的傲气正面迎战，被剑阵斩成尘埃身死。童颜敲响小钟施展天地遁法，瞬移至陈崖身前一掌击碎其石人腹部，露出仙法本源，被云师救下。陈崖命人杀童颜，又把青光绳抛向彭郎引来剑阵闪电。千钧一发之际，两道剑光绞碎闪电，柳十岁自天而降，一拳接一拳打垮陈崖，云师以云丝缚住碎裂的躯体，陈屋山石人只剩半身石像。"},{"n":983,"orig":984,"title":"会师","people":["柳十岁","沈云埋","彭郎","童颜","云师","元曲"],"one_line":"诸仙之战两败俱伤，双方退往基地各自疗伤","summary":"战后盘点：无问道人已死，陈崖只剩一口气，恩生、和仙姑、神打先师与紫气东来君、董先生皆被重创，前代仙人可战者仅余六人。双方隔着数百公里僵持，谁也离不开火星。云师感叹诸神之战不过是蜗牛角上争斗，踏云离山而去。沈云埋抱着众伤员离开山顶，去往人类文明童年遗留的环形基地。柳十岁这才露出内伤深重的真容——他一直在演戏震慑群仙。众人间互通消息：童颜传信回朝天大陆，元曲等人才得以飞升来援；井九与雪姬杀九名处暗者之事令众人骇然。彭郎说起剑阵里前后皆渺渺的可怕，尸狗至今失散；童颜推演它暂无大碍，众人开始治伤。"},{"n":984,"orig":985,"title":"老屋 井底以及桃源","people":["沈云埋","卓如岁","青山祖师","赵腊月"],"one_line":"祖师自比桃源等井九死，赵腊月寻至星门基地","summary":"环形基地里众人养伤，沈云埋讲述人类文明童年史：火星基地曾毁于小型核战争，人类无法突破光速，宇宙的距离才是真正的枷锁。另一边，卓如岁在祖星陪青山祖师读《桃源记》，天空里太阳消失、血月高悬，行星排成倒十字巨剑。他问太阳系是否就是祖师的桃源，祖师毫不担心破阵：雪姬不可能永远稳住井九，等他必须醒来之时，就是他的死期。海岛另一面藏着海底巨大空间，无数黑色方塔组成远古大阵。祖师察觉尸狗也出来了，好奇它会忠于谁。守二都市边缘，赵腊月抱着阿大现身——青儿推算井九真的在这里。"},{"n":985,"orig":986,"title":"积沙成塔","people":["赵腊月","井九","雪姬","阿大","溪"],"one_line":"赵腊月骗过雪姬，星门公寓寻见未醒的井九","summary":"赵腊月潜入星门基地地底街区，故意留下「严禁外泄」的假话——她没找到控制雪姬的方法，却要让雪姬相信东西在青儿手里。她循着青山剑意找到公寓，看见井九坐在软椅里看电视，雪姬裹着被子蹲在一边，溪被冻在冰块里。雪姬嘤嘤道出原委：井九拒绝醒来，下意识想继续做蓝衣少年逃避头疼与祖师。赵腊月当面撒下弥天大谎，称杀了祖师东西才会交还，成功骗过雪姬。阿大与寒蝉久别重逢，寒蝉要它把井九抱下头顶，它却看到冰块里的溪。赵腊月低头望向井九，五百年后再次相遇，井九慌乱换台，电视里的太空海盗男女接起吻来。"},{"n":986,"orig":987,"title":"原来你真在这里","people":["赵腊月","井九","雪姬","阿大","寒蝉"],"one_line":"赵腊月寻到装傻的井九，谎骗雪姬控制之物下落","summary":"赵腊月率舰队收服反抗星球途中悄然降临星门基地，嘱青儿严禁外泄、连童颜都不能知道；她确认基地无敌方埋伏后走进公寓，在青山剑阵笼罩的房间里找到雪姬与装傻的井九——他穿着蓝色连帽衫看电视，拒绝醒来面对承天剑与青山祖师，雪姬养好伤本要带他去祖星也被他拒绝。赵腊月对雪姬撒下提前演练无数遍的弥天大谎，称控制雪姬的东西在青儿手里、须杀了祖师才能拿到；寒蝉与阿大重逢嬉闹，溪仍被封在冰块中，阿大提议杀她以绝后患又自己摇头否决。最后赵腊月与井九近距离对视，他不认得她，慌乱换了频道，屏幕正播到男女主角接吻——相隔五百年，再次相遇。"},{"n":987,"orig":988,"title":"虽九死而不悔","people":["赵腊月","井九","雪姬","阿大"],"one_line":"弗思剑作锁链唤醒井九，九死不悔压住承天剑","summary":"赵腊月权衡后放弃让井九继续冬眠，决定冒险唤醒：她抽出弗思剑化作红色剑索系上井九的脖颈，阻断意识与身体的联系，以神末峰九死剑诀把森然剑意灌入剑索，用「弗思」即「不想」的道理强行压制那段承天剑程序的侵蚀。井九的呼吸渐渐平缓，眉眼恢复完美，真正醒来，虚弱得如卧床多年的病人。他判断出自己被剑索锁住，轻叹「这样我会死得更快」，赵腊月答「这是你教我的」，又道「我的剑是你教的」——神末峰修的是九死剑诀，虽九死而不悔，你是井九，就该骄傲而清醒地活着。"},{"n":988,"orig":989,"title":"出井","people":["井九","赵腊月","雪姬","阿大"],"one_line":"井九得知太阳系成剑阵，自称飞升前已有破局法","summary":"井九向赵腊月问明局势：中央电脑已被青儿控制，她接管星河联盟，柳十岁与曾举乘烈阳号先行去祖星，三万多艘战舰在后。赵腊月坦承烈阳号在祖星外围捕捉到沈家战舰化为的微粒，推算太阳系已被祖师变成一座剑阵，柳十岁已进阵查探生死未卜。井九叹出多年未说的口头禅「真烦」。众人乘战舰离开星门基地，赵腊月推着轮椅上的井九在舰内散心，路过巨型黑洞时井九久望不舍。她问破阵杀祖师之法，井九答：飞升之前就想到了——那时候他便明白了如何摆脱一切控制，获得真正的自由。"},{"n":989,"orig":990,"title":"看见真的太阳","people":["井九","和仙姑","曾举","童颜","雀娘"],"one_line":"舰队会师盖向太阳系，阵眼被推定是巨型战舰","summary":"舰队与三万多艘战舰会师，组成半圆球形的盖子罩向太阳系。井九隔着舷窗看见那颗真正的太阳，想起旧句：来人间一趟，总要看看太阳，我代你看到了。火星上，柳十岁送曾举与和仙姑去基地，童颜托话称祖师设阵可能连前代仙人也要尽数杀死。曾举道出百余年资源暗中流向太阳系的旧账，和仙姑凭借直觉提出关键推论：剑阵的阵眼不是自然天体，而是一艘从未露面的超巨型战舰，比最大的运输母舰还要大七十几倍。众人豁然开朗之余，雀娘却更为忧心——战舰阵眼可随时改变位置，祖师随时可以变阵，生门未必永远是生门。"},{"n":990,"orig":991,"title":"来了","people":["井九","赵腊月","青山祖师","卓如岁","雀娘","童颜"],"one_line":"剑阵开始变阵困杀火星，井九下令万舰开火","summary":"基地的推演突然被引力扰动打断——一个极大质量的天体正在靠近太阳系。雀娘失声：剑阵开始变阵了。一旦变阵完成，生门将成死地，火星上所有人无路可逃。童颜让沈云埋去喊前代仙人一起破阵，实为多绑几个人质。祖星海边，青山祖师察觉「来了」，拔起钓竿；海底无数黑色方塔亮起蓝色电芒，深静的剑意射向太阳系深处，剑阵悄然变化。卓如岁跪抱祖师双腿，恳求已经杀了一个就别再杀，却只看到神明般深静无情的眼睛。另一边，赵腊月推着轮椅到窗前，问井九「开始吗」，井九轻嗯一声，三万多艘战舰随之开火。"},{"n":991,"orig":992,"title":"他来了","people":["井九","雪姬","赵腊月","青儿"],"one_line":"万舰齐射难撼剑阵分毫，井九决意亲身入阵","summary":"三万多艘战舰对太阳系齐射二十七分钟，是人类文明史上最大的一次能量输出，却只削减剑阵百分之零点零零三的能量域——恒星级的防御面前，舰队无能为力。井九一眼看破此阵本源：青山剑道的极处万物一剑，不是万物皆可为剑，而是万物可为一剑，祖师以整个太阳系为剑。青儿提议撤军发展科技三千年可抵恒星级别，井九笑答到时候记得去他坟上拔草，并借青儿落肩传递了确认信息。权衡之后井九决定入阵：祖师摆下此阵就是等他来破。雪姬率先飞入，以承天剑意荡开剑阵开路——那正是井九当年在三千院所教。赵腊月推着轮椅随她入了虚空。"},{"n":992,"orig":993,"title":"他带着她来了","people":["井九","雀娘","沈云埋","雪姬","神打先师","恩生"],"one_line":"井九落崖力挺雀娘直觉，雪姬随手夺鼓冻剑","summary":"火星崖间的破阵推演陷入混战，沈云埋自创迭代穿线法却没有算力，雀娘提出用纯阳变换破题——那是李将军当年被撤稿的失败论文，遭众人嘲笑。此时一辆轮椅自天空落下，井九声音虚弱却毫不含糊地支持雀娘：当年下棋时就看出你直觉比童颜强，不要怀疑这一点。雀娘激动跪拜，柳十岁等人纷纷行礼，沈云埋也与他认了旧交。神打先师等六位前代仙人却围住轮椅，恩生握剑欲战。忽然一只圆乎乎的小手从神打先师臂下伸来，拿走了他千年的打神鼓，路过恩生身侧时更是冰冻了他的剑鞘——如雪的小姑娘走到轮椅前，众仙如见深渊。"},{"n":993,"orig":994,"title":"雪崩","people":["雪姬","井九","顾左","顾右","陈崖","彭郎"],"one_line":"雪姬威慑众仙捏合双魂，一拳冻住下落的天空","summary":"雪姬的出现令全场如临深渊，前代仙人纷纷行礼，彭郎一句「见过岳母大人」让众人再度震惊。陈崖怒斥众人在雪国怪物面前噤若寒蝉，被寒蝉落在头顶冻成冰雕。顾左顾右向雪姬出手，顾左被连击飞五次——井九点破两人本是同魂双体，须同时杀死才能真正死掉。雪姬来了兴致，把兄弟俩抓到一处强行挤压，竟要像金属压合实验般把他们重新揉成一个。此时夜空深处的气态行星移位，剑阵开始向火星压下——井九醒悟祖师正是等他与雪姬入阵才变阵。雪姬一拳轰出，无数雪粒白光冻凝天空，硬生生止住了天空的落下。"},{"n":994,"orig":995,"title":"天空中下着沙","people":["井九","雪姬","雀娘","赵腊月","柳十岁"],"one_line":"沙漏计时七十一小时，井九解题雪姬驱蚊计算","summary":"雪姬以小拳头撑住天空，井九用龙卷风卷沙做沙漏计时：七十一小时后剑阵变阵完成，火星将被吞没。井九听完众人推演，轻声解题，雀娘以铜镜记录，雪姬则驱使无形蚊群在崖壁上排列计算，连井九带雪姬都被用到力竭。得知尸狗独自留在剑阵里寻找阵眼十几天，井九动怒，令向整个太阳系广播坐标召它回来。众人离开山顶去基地闲逛，井九感叹飞升的晚辈没一人唤他师父，赵腊月便说你要我叫就叫，井九唯有咳嗽。第三天回到山顶，沙将落尽，雀娘带来两个新的麻烦。"},{"n":995,"orig":996,"title":"需要毁灭太阳吗？","people":["沈云埋","井九","雀娘","赵腊月","神打先师","雪姬"],"one_line":"阵枢被点破在祖星，毁太阳破阵之言刺向井九","summary":"雀娘带来两个麻烦：其一，找到阵眼后谁去太空摧毁；其二，函数里有个互隐值，阵眼位置被阵枢遮蔽，无法算出。沈云埋忽然悟到：当年演练的阵枢是指挥舰，因为祖师在其上——在他看来自己才是这世界唯一的太阳，所以剑阵阵枢不是太阳，而是祖星。井九印证：换作他也会这样做。只要有人从祖星发出信号便能定位阵眼，赵腊月提出卓如岁可能就在祖星——那是事先的约定。剑阵不断下压，天空裂开又被雪姬冻住。神打先师抛出诛心之言：毁了太阳即可破阵，而景阳真人的仙躯正是神明留下的恒星级武器，可以点燃恒星。所有人的视线落向了井九。"},{"n":996,"orig":997,"title":"仙人还是英雄？","people":["井九","卓如岁","青山祖师","神打先师","云师","和仙姑"],"one_line":"井九拒绝点燃太阳，卓如岁向祖师吐露杀心","summary":"神打先师怂恿井九解开剑索点燃太阳以救众人，可柳十岁等人都清楚，井九连为人类牺牲都不乐意，断然不会照做，只答「想点儿别的」。绝望的紫气东来君疯狂质问后飞入剑阵，不到三小时便道消身亡。火星另一面的峡谷里，云师与和仙姑看着冻凝的天空，云师牵她登上白云，吹笛哼起农家小调，就此离开战局。祖星海边，祖师咳血告知结局：雪姬会重伤，井九神魂将被切散、身体由承天剑接管。卓如岁表明既不帮井九一方、也不容祖师滥杀，并终于吐露积怨：师父柳词之死源于童颜设的局，他一直想杀童颜，这正是赵腊月算准他会犹豫的原因。"},{"n":997,"orig":998,"title":"塔","people":["卓如岁","青山祖师"],"one_line":"卓如岁以剑为舟刺祖师失败，沙塔即信息散天外","summary":"卓如岁对青山祖师出手，不用万物一剑，只以吞舟剑飞渡祖师万物一剑化成的大河，想刺杀他唯一的弱点——苍老的身体。祖师令海水退潮，河道消失，吞舟剑坠成碎片，卓如岁重伤认负，自嘲是班门弄斧。祖师随手毁掉他此前堆下的十七座沙塔与石塔，看似断了他传递信息的手段。卓如岁却道破天机：塔本就是人类文明用来望远传声的建筑，那些沙塔不是传信的工具，而是信息本身——塔崩塌时，写满信息的沙尘随风四散，有些终将飘出大气层进入太空。「假作真时真亦假」，祖师这才明白自己一直被这位看似闲散的青山掌门算计。"},{"n":998,"orig":999,"title":"点燃我胸中的朝阳","people":["雪姬","沈云埋","柳十岁","井九","赵腊月","溪"],"one_line":"阵眼算出雪姬只身赴险，众仙结阵撑住天倾","summary":"井九与雪姬早从剑阵变化中推得诸多规律，再结合卓如岁散入太空的数据，寒蝉率蚊群极速运算，终于算出阵眼位置，十余只蚊子力竭而亡。雪姬把寒蝉郑重托给阿大，随后消失于天空化作一道白线；她走前示意赵腊月斩开冰块放出溪，再以剑意入脑将其死死控制。雪姬离去后冻凝的天空再也撑不住，剑阵压落火星。沈云埋自耳钉取出核动力炉插入阵眼，与众仙法宝结阵，柳十岁顶替昏死的倪仙人主阵，九件法宝在仙气激发下撑住落下的天空，山顶幸存。沈云埋向着祖星宣告：父亲，你觉得自己是唯一的太阳吗？我才是。"},{"n":999,"orig":1000,"title":"拆天解地见本源","people":["雪姬","井九","沈云埋"],"one_line":"雪姬找到阵眼巨舰，拆天解地撕出黑色石碑","summary":"山顶稳定后，井九却始终觉得阵眼的质量与体积不相称，让沈云埋向整个太阳系广播。剑阵里，雪姬凭承天剑意挡住万千剑意，以破碎虚空的重拳反复振荡空间，终于找到异常安静的暴风眼——阵眼是一艘大得难以想象的超级战舰，内部竟藏着一个有山海、溪流、楼阁与群岛的世界，却空无一人。这个世界正是掩盖核心的阵法。雪姬不屑寻找，直接双手撕开战舰外壁，拆解天地：天幕碎裂，电离星辰熄灭，假太阳被她摘出冻爆，大地海岛节节崩解。就在那座废岛化为微粒的瞬间，泥沙般的雨滴深处，隐约显出一座黑色的方尖碑。"},{"n":1000,"orig":1001,"title":"黑色石碑以及黑色的你","people":["雪姬","尸狗"],"one_line":"黑色方尖碑现世控制雪姬，尸狗咬住她向外拉","summary":"黑色方尖碑极致标准、吞噬光线，明在眼前却似远在万光年外——它是更高级文明在此宇宙的投影，正是神明留下的能控制雪姬的东西。雪姬生平第一次感到恐惧，转身逃亡却无论怎样飞都改变不了与黑碑的相对位置。她以最强也最耗损的蓝色冰柱横亘身前，冰柱旋即被那道来自另一个世界的意志尽数震碎。她坠上碑面，双手抵碑，掌心渐渐没入黑色碑体，整个人越来越像人类，也就是越来越弱小。危急时刻，尸狗自天而落，踩上碑面咬住雪姬向外猛拉，体内镇压的万千剑伤尽数爆发，寒意裹血轰然炸开，那只雪白的小手终于缓缓拔出。"},{"n":1001,"orig":1002,"title":"来自月亮的钟声","people":["井九","青山祖师","赵腊月","卓如岁","谈真人","溪"],"one_line":"井九唤出藏身月亮的谈真人，以月为钟毁掉剑阵阵枢","summary":"火星众仙对抗太阳系剑阵时，赵腊月发现阵眼竟是溪多年前交给青山祖师的、能控制雪姬之物——剑阵实为诱杀众人的罗网。井九毫不犹豫下令杀溪，溪抢先用最快语速说出控制方法藏在祖星，得以活命。井九随即让沈云埋耗掉七成能量向太阳系广播：「如果你在这里，那就出手，不要总这么粘糊。」祖星上的青山祖师由此想起被众人遗忘的谈真人——他雾外星系奔袭失败后并未离开，已在月亮里藏了两年。钟声自月而起，月亮开裂崩解，显出中空内部；钟声之力更摧毁祖星海底阵枢的关键处。谈真人手持破损的景云钟，从月亮碎片中现身。"},{"n":1002,"orig":1003,"title":"各自的守望","people":["尸狗","何仙姑","云师","井九","谈真人","青山祖师"],"one_line":"剑阵崩解，井九弃守待援，携众乘猫赶赴祖星","summary":"阵眼战舰被雪姬毁去，尸狗为带她逃离在黑碑上疯狂奔跑；剑阵随阵眼被毁、海底阵枢受损而崩解。火星峡谷底，重伤的何仙姑为云师织乌篷，两人见剑意消散，确认整座剑阵正在崩塌。众仙之阵散解，火星恢复，沈云埋算出崩解到柯伊伯带外还需十六小时，但井九决定不再等待舰队杀到，即刻动身去祖星，众人乘变大的阿大出发，恩生抓着猫毛跟随。祖星上，谈真人对祖师承认毁阵是为中州派列祖列宗讨还私仇，又言「有什么意义呢」后飘然离去，实为给井九等人争取时间；祖师自言只要陛下仍在掌控，旁人不足为惧。"},{"n":1003,"orig":1004,"title":"孩子气","people":["井九","沈青山","溪","沈云埋","卓如岁","赵腊月"],"one_line":"井九与祖师海边初见，互道名号并开出交易条件","summary":"阿大驮着众人抵达祖星海岛，井九与青山祖师两辆轮椅在海边相对，两位虚弱至极的老人见面先相对咳嗽。沈云埋以儿子身份与父亲斗嘴，祖师关切询问溪的状况，又点评赵腊月：锋芒冲动正是她修的九死不悔剑道。井九开口先问祖师如何称呼，祖师答叫沈青山——从此不以青山祖师身份相对；井九自报井九，只认对手。随后他开出条件：交出控制雪姬的方法，他便离开、让祖师活着，言下之意若不走祖师必死。众人震惊于这份自信，赵腊月却想起井九在战舰上说过，飞升前便已想好应对之法。"},{"n":1004,"orig":1005,"title":"祖师看你一眼","people":["柳十岁","沈青山","井九","溪","赵腊月"],"one_line":"柳十岁斩溪一臂相胁，祖师终交出控制雪姬之宝","summary":"井九道出带溪同行的真正用意——战友不能抛弃，他要以此要挟祖师换雪姬活命。祖师反问他可曾为谁拼命，井九答没有战友，连三月已死，质疑祖师怎会为一个同伴让步。话音未落，柳十岁突然出剑斩落溪的左臂，随即细致为她治伤并道歉，由背负盛名的他来做恶人，再向祖师郑重行礼请其三思。祖师只看了他一眼便出手：不二剑哀鸣，万魂幡、惊神笔等至宝皆如破铜烂铁，柳十岁惨败，幸被赵腊月一句「你真想她死」喝停。祖师闭眼再睁做出决断，从袖中取出金丝镂空小球，内藏一颗幽黑纯净的宝石，正是控制雪姬的关键之物。"},{"n":1005,"orig":1006,"title":"我是来杀你的","people":["井九","沈青山","沈云埋","溪","卓如岁"],"one_line":"阿大携宝赴太阳解围，井九与祖师论道言明必杀之","summary":"沈云埋以儿子身份凑近验看小球，盛赞黑宝石的切割工艺远超祖师手笔；阿大与寒蝉携小球飞往太阳，果然令黑碑平息，雪姬与尸狗脱险。井九向众人解释：感情如孤立系统里的总量不变，溪愿为祖师交出至宝，祖师便会为她舍弃，因果如此简单。溪却冷斥祖师变得愚蠢，独自去海边拾贝，捡了块月亮坠落的尖石藏起。众人忧虑交易后战争未完，柳十岁坦言拼命也只是送命。井九与祖师继续坐而论道，井九自称是人类文明与祖星万物的延续，又道出万物一因惧怕祖师而留在朝天大陆，末了言明：就算你不杀我，我也要杀你。"},{"n":1006,"orig":1007,"title":"坐而论道","people":["井九","恩生","赵腊月","沈青山","青儿","柳十岁"],"one_line":"恩生责众不敬被井九驳斥，青儿携剑光暗袭祖师","summary":"众人以神识偷听议论，赵腊月紧盯溪防其被用作变数。被阿大击落大海的恩生寻回小岛，指责众人对开创青山宗的祖师缺少基本敬意，井九反驳：祖师不过恰好拾到那把剑，谁拾到都一样，宗派之名无关紧要，后人无须感恩。井九一反常态话多，众人隐约觉得那目光像在看一个死人。远方传来阿大解除太阳那边危机的封平安信，协议将终，气氛骤然绷紧。柳十岁再向祖师请战，赵腊月放出剑意，青儿已粘着两道弧形剑光无声现于祖师身后偷袭，沙中血色初子剑同时刺出。同一时刻，朝天大陆青山剑阵大动，碧湖峰雷暴骤落，平咏佳脸色大变。"},{"n":1007,"orig":1008,"title":"天上地下","people":["沈青山","柳十岁","赵腊月","卓如岁","彭郎"],"one_line":"群雄轮番战祖师皆败，彭郎一剑被两指夹碎","summary":"祖师还手，青儿被其沉静眼神所慑灵体濒碎，火鲤大王惨败遁回，赵腊月无形剑体被破，重伤跪地。柳十岁不管不顾祭出万魂幡、不二剑等全部法宝，仍被尽数化解，颓然吐血。朝天大陆上，新入门弟子正游历剑峰寻剑，拜祭历代掌门与祖师画像。卓如岁不再逃避，以承天剑阵试探祖师的万物剑阵，被无形剑网侵蚀仙躯，血染沙滩。最后彭郎提剑上前，不用任何流派剑法，只是简简单单一剑刺出，祖师神情首次认真，两根枯指夹住剑光如天地相合，长剑应声碎裂，裂势蔓延至其手前停止。祖师神识惊天动地，旷古绝今。"},{"n":1008,"orig":1009,"title":"断剑","people":["井九","沈青山","赵腊月","沈云埋","童颜","柳十岁"],"one_line":"祖师自陈万物剑阵无敌，井九亲手扯断弗思剑索","summary":"小楼尽头单独挂着祖师的大幅画像。沙滩上祖师道破真相：他在之处即万物剑阵，规则由他心意而定，无人能胜，先前允诺不过是尽在掌握。井九想起师兄那句「想呼风唤雨」，轻声答自己「不想」，剑阵随之松动。祖师劝他解开颈间剑索一试，又以狼被驯化成狗的故事讥其如戴项圈；井九称剑索是支撑他清醒来此的呼吸机，重申到此就是来杀他，并承认方法可能致命，所以一直拖延思考。他无法像南趋那样剑鬼离体——景阳神魂与万物一剑本就是一体的井九，只能毁去身体。说罢他抬手抓住颈间弗思剑索，指尖用力，血色剑索崩断成数十截。"},{"n":1009,"orig":1010,"title":"撕耳","people":["井九","沈青山","柳十岁","赵腊月","雪姬","阿大"],"one_line":"井九以断臂对抗承天剑控制，继而撕落双耳","summary":"弗思剑索碎裂，井九重获自由，祖师炼制的新承天剑随即发动，青色光绳在他腕上越陷越深，众人无力阻止。太阳那边，阿大携小球令黑碑平息，雪姬与尸狗重伤脱险。井九与祖师意志对峙，渐被同化成一把人形之剑。他忽举右手斩落自己左手，光绳随之消失，却又出现在左肩——这是灵魂的镣铐，无法以物理手段摆脱，他再斩落整条左臂，神情平静如程序运行。众人震撼于他对世界的无情竟能对自己如此冷酷。柳十岁喊出不自由毋宁死，井九直言听烦了这身体是人类唯一希望的说法，随手撕下自己的耳朵。"},{"n":1010,"orig":1011,"title":"脱衣","people":["井九","沈青山","童颜","赵腊月","沈云埋","卓如岁"],"one_line":"井九自毁完美身躯欲脱衣而去，神魂化孩童落地","summary":"井九撕落双耳后，以指剑沿眼角细缝剖开自己，如玉髓般的内脏流出，动作平静近乎机械。沈云埋与卓如岁想起削肉还骨的古老故事，童颜却看穿他目的明确绝非自弃。井九道出飞升前三个故事的真意——曹园要想得开、苏子叶不怕死、他自己要「脱了衣服」：完美身躯不过是衣服，脱去才能摆脱承天剑，正如他曾助雪姬、青儿、平咏佳脱离旧主。祖师讥问自由的灵魂如何长存，沈云埋警告灵魂转移从无成功先例。剑光暴涨，万物一剑本体渐现，井九的身影却在光中消散，一道孩童般的光影赤足落在沙滩，踏出人类最重要的一步。"},{"n":1011,"orig":1012,"title":"离魂","people":["井九","沈青山","赵腊月","恩生"],"one_line":"神魂化童的井九与祖师剑阵相争，跃上其膝称赢","summary":"井九的神魂凝成孩童，与坐守万物剑阵的祖师展开无声之战。祖师神识化作持柴刀的年轻樵夫斩向小孩，万物剑意两用，整颗星球处处皆是战场，飞鱼吞虾、落石砸花皆可为杀。小孩步履蹒跚却步步逼近，祖师的轮椅不断后退直至水池边，众人渐悟其意图——灵魂难以久存，时间才是小孩最怕的武器，他要拖到神魂涣散。满天剑光剑鸣令众人跌坐，恩生赞叹这场观之不尽的剑争。小孩身影渐淡之际，忽哼起恐怖童谣在无形之线上跳绳，随即一跃落在祖师膝头，与他平视，开心宣布：我赢了。"},{"n":1012,"orig":1013,"title":"斩首","people":["井九","沈青山","溪","柳十岁","赵腊月","卓如岁"],"one_line":"井九夺舍毁祖师神识本源，沈青山自断头颅而亡","summary":"小孩道出胜负之由：祖师把意识留在剑阵里不敢完全离开，而南趋、太平真人、前代冥皇的道都落在井九身上，他在这条脱去身体的路上走得更远。祖师对溪念起「今夜我不关心人类，我只想你」，托付她若井九活下来便尽量让人类延续；溪自白受胁时没舍得自杀，柳十岁与赵腊月承诺会让她活着。祖师又说起青山宗「你想死吗」这句口头禅的来历，自认老而不惧死，任柴刀落下。刹那间小孩扑入祖师怀中消失——这是夺舍，井九要以自身毁掉那道神识的本源。祖师取不二剑轻轻一割，头颅落入水池，身躯化沙而散；沈云埋的脑袋也扑通落水，父子头颅隔水相对。"},{"n":1013,"orig":1014,"title":"我们的灵魂要去何处安放？","people":["沈云埋","沈青山","井九","童颜","赵腊月","彭郎"],"one_line":"祖师神识散去举世跪别，井九神魂归体只余九天","summary":"沈云埋与父亲头颅在水池中相对，祖师解释当年放逐儿子实为给人类留火种，自嘲「沈青山」与「云埋青山」两个名字都不吉利，随后金光散去，古往今来最强大的神识安静消亡。青山众弟子尽数跪拜，井九与溪没有跪。众人忧其神魂将散，欲以青天鉴收纳被拒，小孩跳回轮椅，神魂归入那具残破躯体——井九坦言身体还能撑九天。童颜收起井九剖出的内脏，称这是极珍贵的材料，三百年后人类或需修复万物一剑点燃恒星；他随即提议要不要趁势杀了雪姬，彭郎认真回应：我在这里呢。"},{"n":1014,"orig":1015,"title":"离开前应该有一场盛大的火锅","people":["井九","溪","谈真人","卓如岁","赵腊月","童颜"],"one_line":"众人陪井九吃最后的火锅，溪引他地底见神明投影","summary":"童颜以玩笑称现在是杀雪姬的最好机会，彭郎认真回绝，众人听出他是真的放松了。井九以破烂的万魂幡盖身吸纳魂火稍减痛苦，又让青儿飞赴太阳那边接回阿大。等待舰队期间，他忽然提议吃顿火锅——他想看大家吃。卓如岁备桌椅调料，柳十岁摘菜，彭郎捞海鲜，煮成椰子海鲜锅。烈阳号接来火星众仙，确认祖师死讯后海边一片死寂。神末峰吃火锅向来是做大事前的习惯。溪默默挤上桌，谈真人不知何时现身同桌，对井九连声叹气亦无办法。井九说想看沈青山临终提的东西，溪引众人深入地底一千米，黑盒射出光线，凝成一个穿军装的普通年轻男人——神明。"},{"n":1015,"orig":1016,"title":"神明是如何诞生的","people":["许乐","井九","溪","赵腊月","柳十岁"],"one_line":"神明自述：许乐死后入宪章网络，三天破戒成神","summary":"投影中的年轻军官自述名叫许乐，生于帝国、长于东林星，有着正常的英雄一生。肉体死亡那一刻，他的意识整体转入宪章网络，与宪章光辉融为一体。他起初警惕无边的权力，发誓什么都不做，结果只忍了三天便出手，用战舰激光炮轰平临海州一座小岛，从此一路以物理操作统一帝国与联邦，改名星河联盟，仅用一千三百年便成为全人类封拜的神明。他解除出生植入芯片、推动制度改革，在宪章光辉里近乎全知全能，与小飞共同治理人类，迎来数万年和平。后来他乘曲率飞船找到祖星，只见文明全盛期的遗迹与一具机器人残骸。"},{"n":1016,"orig":1017,"title":"接下来的故事","people":["许乐","井九","赵腊月","柳十岁","溪"],"one_line":"朝天大陆原是外星文明监狱，神明迁人类入内避劫","summary":"许乐继续讲述：他研究曲率飞船时，左天星域边缘一条扭率空洞突然崩塌，暗物之海就此降临，一切应对之法皆告失败。他派出飞船四寻答案，在银河某处发现一片物理规则迥异的虚无，判断那是更高级文明留下的监狱，深眠其中的看守正是雪姬；他幸运地一开始就找到控制她的方法，却因承诺守口至今。他决意把监狱改造成人类堡垒，用无数年把荒凉世界改造成朝天大陆，又在虚无边界建造信息窗口——即中州派那件法宝。最后他为人类备下两条路：挖空边缘行星让部分人躲入地底，再选一部分生命与改造兽进入那个世界，一切都是他做的决定。"},{"n":1017,"orig":1018,"title":"他的故事就到这里了","people":["许乐","井九","溪","赵腊月","柳十岁"],"one_line":"许乐自述点燃恒星牺牲始末，点破万物一剑来历","summary":"许乐交代结局：他用监狱中找到的恒星级别武器执行点燃恒星计划，因只有他能充当武器的控制程序，遂关停宪章电脑赴死，与暗物之海同归于尽，溪为此啜泣。他点破万物一剑正是监狱里最强的武器，构成它的粒子不属于这个宇宙，这是监狱源自更高级文明的最大证据；青天鉴则是关押麻烦犯人的小黑屋；若狱中人类能突破界线归来，便强到足以对抗暗物之海。他自陈漫长岁月里差点变成自己最厌恶的存在，反而感谢暗物之海，又叮嘱身为继承人的井九。言罢投影消散，再被唤回时只重复「问吧」，溪拾起石头砸去，石头穿过光影落地。"},{"n":1018,"orig":1019,"title":"第一天","people":["井九","雪姬","尸狗","阿大","赵腊月","柳十岁"],"one_line":"井九还宝予雪姬还其自由，神魂归体静待命运","summary":"阿大驮着重伤的雪姬与尸狗归来，尸狗向井九行礼后没入大海养伤。寒蝉交还金丝镂空小球，井九却直接递还雪姬，金丝骤断，黑色宝石物归原主——她终于获得彻底自由，对井九生出无论何事都愿应允的心意。神识相交间井九问出她的来历：她诞生于那座监狱，看守囚犯亿万万年，直到自称神明的许乐带着歉意与她达成协议。前代仙人不许离开，等着井九解决自身问题或死去，言明他不能死。赵腊月透露青天鉴里有些人死了却又活着，井九决定入内一探。柳十岁做好竹椅，赵腊月以青天鉴为枕，井九在椅上安然睡去，这是第一天。"},{"n":1019,"orig":1020,"title":"星际穿越","people":["井九","赵腊月","童颜","沈云埋","卓如岁","柳十岁"],"one_line":"井九神魂入青天鉴问生路，留魂火外出星际穿行","summary":"井九的神魂进入青天鉴，见到浑然不觉已死的张老太爷与渐渐凝成真人的赵国皇帝，确认灵魂可以单独存在，但青天鉴是封闭系统，而宇宙外有暗物之海，他拒绝童颜的缚灵阵——不想退。柳十岁取出蓬莱宝船王所赠的定神灯，井九用仅剩的三根手指打响指点燃魂火作为归途标记，卓如岁等人连忙布阵护灯。随后他以纯意识穿行物质世界，数秒内绕星球三圈，来到海底阵枢吸尽黑色方碑的电弧，学会以感知代替身体。第二天他抵达太阳，从黑碑获得感悟，直接穿透恒星而出，成为神明之后第一个穿越恒星的智慧生命，第三天学会在宇宙中定位。"},{"n":1020,"orig":1021,"title":"回忆杀","people":["井九","欢喜僧","曹园"],"one_line":"井九超度欢喜僧解放大涅盘，神魂返乡遍访故人","summary":"井九从黑碑确认它只能影响那个高级文明自身的事物，遂穿日而出，飞向本星系群边缘的佛国。曹园自蝎尾星云一路追杀欢喜僧至此，因大涅盘众生受其禅念挟制而未落刀。井九化作清风渗入欢喜僧体内，抽出其禅念，欢喜僧在哭笑难辨中安然死去，尸身散作金沙，大涅盘里七十几个世界的囚魂得到解脱。随后他回望虚无外的中州派法宝，径直进入朝天大陆：与巨人朋友畅谈、惊吓蓬莱宝船王、掀起练剑白衣仙子的衣裙听她道好久不见、令千里风廊狂风停歇，再访朝歌城、雪原、果成寺与东海，水月庵前枯死多年的桃树忽然开满桃花。"},{"n":1021,"orig":1022,"title":"做一切事","people":["井九","顾清","元龟","平咏佳","南忘"],"one_line":"井九返乡拜别顾清南忘，逼问出元龟原是囚犯","summary":"井九走访三千庵连三月化晨光处后回到神末峰。顾清自甄桃去世后独守峰顶旧木屋，井九与他喝茶，让他寻机飞升，宣布自己将远行、应该不会回来，又提出吃火锅、打麻将，如今能喝酒、能做一切事。平咏佳赶至跪拜，井九告知沈青山已死；南忘踏剑桥而来送酒，脚踝银铃乱响。诸事完毕后他去天光峰见元龟，点破黑碑与万物一剑从始至终都被人看守——神明轻易取走而雪姬亿万年来找不到，答案在元龟腹中。元龟承认当年受高级文明执行者的意志所制，只能监视雪姬，便顺势把两物交给了神明，末了坦白：其实我是一个囚犯。"},{"n":1022,"orig":1023,"title":"宇宙的欲望","people":["井九","元龟","赵腊月","溪","沈云埋","卓如岁"],"one_line":"元龟自认囚犯，井九交待后事后神魂离体而去","summary":"元龟自陈是监狱第一个也是最后一个囚犯，意识被抹去植入看守意志，如今使命已了却不肯离开——活着就是最大的自由。井九回神末峰闭关数年，第三次飞升离开朝天大陆，随后潜入暗物之海，借母巢感知到另一个世界的雾状生命，彼此确认存在却无法交流。祖星海边众人守到第九天，灯火将熄时井九睁眼交待：暗物之海那边才是主世界，人类的问题人类自己解决；若实在无解，就把元龟带出来，让它像吃星光一样吃掉黑暗。他向少女祭司道谢，抚阿大、嘱柳十岁，最后与赵腊月相拥说了声「走了」。手臂轻落，井九气息断绝，众人诵史铁生之文，相信他只是去了别处。"},{"n":1023,"orig":1024,"title":"无涯","people":["井九","赵腊月","钟李子","雪姬","南忘","平咏佳"],"one_line":"群像各归其处，井九缩小神魂离宇宙独行大道","summary":"多年后群像各归其处：钟李子带着血布束着的向日葵真迹回星门基地；赵腊月与柳十岁在八五七基地寻找追随井九之法；卓如岁任星河联盟首任执政官，政务实由青儿打理；雪姬不辞而别，去宇宙深处寻找消失的高级文明，火星山崖留字「宇宙很大，我想去看看」；曹园与童颜借天蚕丝研究修复万物一剑；前代仙人不信井九飞升，蠢蠢欲动，南忘、白早、平咏佳飞升赶到接掌局面。真相揭晓：井九将感知无限缩小直至比粒子更小，穿出宇宙，破开一片湖面，回到他想象出的朝天大陆，与连三月并肩看朝阳，同西来的意识论存在与意义，笑言所以要一直活着，随后走进纯净白光——大道独行，不必相送。"},{"n":1024,"orig":null,"title":"后记（窗外的湖）","people":[],"one_line":"作者猫腻回顾创作生涯与完本心境，预告后路","summary":"猫腻完本感言：他生于幸福家庭，母亲遗言「风平浪静，走」化入书中。本书不讲道理，只想写心中的修仙——修行只为问能否长生，井九的无味下藏着对生命最大的热情。此书与《庆余年》《间客》同属一个世界观，末卷名「出神记」，是他最后一部大长篇，完本日恰逢结婚十周年。他计划休整、推动《间客》影视化、写更狠的中短篇，继续写下去。"}]};
const E = BOOK.entries;
const $ = s => document.querySelector(s);
let cur = 0;
const LS = {pos:'ct2_pos', fs:'ct2_fs', th:'ct2_theme', read:'ct2_read'};
const readSet = new Set(JSON.parse(localStorage.getItem(LS.read) || '[]'));

function chTitle(e){ return e.orig ? `第${e.orig}章${e.title ? ' ' + e.title : ''}` : e.title; }
function splitParas(s){
  const out = []; let buf = '', depth = 0;
  for (const ch of s){
    if (ch === '「') depth++;
    else if (ch === '」') depth = Math.max(0, depth-1);
    if (ch === '；' && depth === 0){ if (buf.trim()) out.push(buf.trim()); buf = ''; }
    else buf += ch;
  }
  if (buf.trim()) out.push(buf.trim());
  return out;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.display='none', 1600); }

function render(i, keepY){
  cur = Math.max(0, Math.min(E.length-1, i));
  const e = E[cur];
  $('#cTitle').textContent = chTitle(e);
  $('#hTitle').textContent = chTitle(e);
  $('#cOne').textContent = e.one_line || '';
  $('#cPeople').innerHTML = (e.people||[]).map(p=>`<span>${p}</span>`).join('');
  const paras = splitParas(e.summary||'');
  const merged = [];
  paras.forEach(s=>{ if(merged.length && (s.length<8 || merged[merged.length-1]._short)) {
      const p = merged[merged.length-1]; p._t += '；' + s; p._short = s.length<8; }
    else merged.push({_t:s, _short:s.length<8}); });
  $('#cBody').innerHTML = merged.map((p,k)=>{
    const sents = splitSentences(p._t).map(s=>`<span class="sent">${escHtml(s)}</span>`).join('');
    return `<p class="${k===0?'first':''}">${sents}</p>`;
  }).join('');
  const nx = E[cur+1], pv = E[cur-1];
  $('#cEnd').innerHTML = nx ? `<button id="goNext">下一章 · ${chTitle(nx)}</button>` :
    `<div style="color:var(--dim);font-size:13px">— 全书完 · 感谢阅读 —</div>`;
  if (nx) $('#goNext').onclick = ()=>go(1);
  $('#btnPrev').disabled = cur===0; $('#btnNext').disabled = cur===E.length-1;
  $('#pos').textContent = `${cur+1}/${E.length}`;
  readSet.add(e.n); localStorage.setItem(LS.read, JSON.stringify([...readSet]));
  history.replaceState(null,'','#n'+e.n);
  if (!keepY) scrollTo(0,0);
  drawBar(); buildToc();
}
function go(d){
  if (d<0 && cur===0){ toast('已是第一章'); return; }
  if (d>0 && cur===E.length-1){ toast('已是最后一章'); return; }
  render(cur+d); }
function drawBar(){
  const sc = $('#art').getBoundingClientRect();
  const y = window.scrollY, h = document.documentElement.scrollHeight - innerHeight;
  const frac = h>0 ? Math.min(1, y/h) : 1;
  $('#pbar').style.width = (((cur + frac) / E.length)*100).toFixed(2) + '%';
}

function buildToc(){
  const q = ($('#tocQ').value||'').trim();
  $('#tocList').innerHTML = E.map((e,i)=>{
    const t = chTitle(e);
    if (q && !(t.includes(q) || String(e.n).includes(q) || (e.orig&&String(e.orig).includes(q)) || (e.people||[]).some(p=>p.includes(q)))) return '';
    return `<div data-i="${i}" class="${i===cur?'cur':''}"><span class="rn">${e.orig||'卷末'}</span>
      <span style="flex:1">${e.title}</span>${readSet.has(e.n)?'<span class="tick">✓</span>':''}</div>`;
  }).join('');
  $('#tocList').querySelectorAll('div').forEach(el=>el.onclick = ()=>{
    $('#tocMask').classList.remove('open'); render(+el.dataset.i); });
}
$('#btnToc').onclick = ()=>{ $('#tocMask').classList.add('open'); $('#tocQ').value=''; buildToc(); };
$('#tocClose').onclick = ()=>$('#tocMask').classList.remove('open');
$('#tocMask').onclick = ev=>{ if(ev.target.id==='tocMask') $('#tocMask').classList.remove('open'); };
$('#tocQ').oninput = buildToc;
/* 导航 */
$('#btnPrev').onclick = ()=>go(-1);
$('#btnNext').onclick = ()=>go(1);
document.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft') go(-1); if(e.key==='ArrowRight') go(1); });
/* 滑动手势 */
let tx=0, ty=0;
addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx)>64 && Math.abs(dx)>2*Math.abs(dy)) go(dx<0?1:-1);
}, {passive:true});
/* 字号 */
function setFont(fs){ fs = Math.max(15, Math.min(26, fs));
  document.documentElement.style.setProperty('--fs', fs+'px');
  localStorage.setItem(LS.fs, fs); }
$('#btnFont').onclick = ()=>{ const cur0 = parseInt(localStorage.getItem(LS.fs)||'19');
  setFont(cur0>=24 ? 17 : cur0+2); toast('字号 ' + (localStorage.getItem(LS.fs)||19)); };
/* 主题 */
const THEMES = ['dark','paper','green'];
function setTheme(t){ document.documentElement.dataset.theme = t;
  localStorage.setItem(LS.th, t);
  document.querySelector('meta[name=theme-color]').content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); }
$('#btnTheme').onclick = ()=>{ const t = THEMES[(THEMES.indexOf(document.documentElement.dataset.theme)+1)%3];
  setTheme(t); toast('主题: ' + ({dark:'夜',paper:'纸',green:'青'})[t]); };
const AUDIO_VOICES = [
  {tag:'audio_female', label:'🎧 在线高清 · 听书女声'},
  {tag:'audio_male',   label:'🎧 在线高清 · 青年男声'},
  {tag:'audio_girl',   label:'🎧 在线高清 · 少女音色'}
];
const AUM = { cache:{}, async get(tag){
  if (tag in this.cache) return this.cache[tag];
  try { const r = await fetch(`audio/${tag}/manifest.json`);
        this.cache[tag] = r.ok ? await r.json() : null; }
  catch(e){ this.cache[tag] = null; }
  return this.cache[tag]; } };
const AU = { on:false, paused:false, player:null, tag:null, times:[], sents:[], idx:0, playingN:null, _auto:false };

/* ── 听书 TTS v2（番茄式：分组朗读+句级跟随+迷你播放条）── */
const TTS = { on:false, paused:false, gi:0, sents:[], groups:[], timer:null, estTimer:null,
              _skip:false, _auto:false, playingN:null, _gStart:0, _gAnchor:0, _gRate:1, _gK:0, follow:true };
function splitSentences(t){
  const out = []; let buf = '';
  for (const ch of t){ buf += ch; if ('。！？；…'.includes(ch)){ out.push(buf); buf = ''; } }
  if (buf.trim()) out.push(buf);
  return out.filter(s=>s.trim());
}
function escHtml(s){ return s.replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function ttsVoices(){
  const all = ('speechSynthesis' in window) ? speechSynthesis.getVoices() : [];
  const zh = all.filter(v=>/^zh/i.test(v.lang));
  return zh.length ? zh : all;
}
function ttsFillVoices(){
  const sel = $('#ttsVoice'); const curv = localStorage.getItem('ct_voice')||'audio:audio_female';
  let html = AUDIO_VOICES.map(v=>`<option value="audio:${v.tag}" ${('audio:'+v.tag)===curv?'selected':''}>${v.label}</option>`).join('');
  const vs = ttsVoices();
  html += vs.length ? vs.map(v=>`<option value="${escHtml(v.voiceURI)}" ${v.voiceURI===curv?'selected':''}>本机 · ${escHtml(v.name)}（${v.lang}）</option>`).join('')
                    : '<option value="tts:none">（本机暂无可用语音）</option>';
  sel.innerHTML = html;
  if (!localStorage.getItem('ct_voice')) localStorage.setItem('ct_voice', 'audio:audio_female');
}
if ('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = ttsFillVoices; ttsFillVoices(); }
function collectSents(){ return [...document.querySelectorAll('#cBody .sent')].map(el=>({el, t: el.textContent})); }
function buildGroups(sents){
  const chunks = []; let cur = [], len = 0;
  for (const snt of sents){
    if (cur.length && (len >= 120 || (len >= 50 && /[。！？…]/.test(cur[cur.length-1].t.trim().slice(-1))))){ chunks.push(cur); cur = []; len = 0; }
    cur.push(snt); len += snt.t.length;
  }
  if (cur.length) chunks.push(cur);
  return chunks.map(g=>{
    let off = 0; const offs = g.map(snt=>{ const o = off; off += snt.t.length; return o; });
    return { sents:g, text:g.map(snt=>snt.t).join(''), offs, base:TTS.sents.indexOf(g[0]),
             strong: /[。！？…]/.test(g[g.length-1].t.trim().slice(-1)) };
  });
}
function ttsClearHl(){ document.querySelectorAll('.sent.speaking').forEach(el=>el.classList.remove('speaking')); }
function hlSent(sents, i){
  const snt = sents[i]; if (!snt) return;
  ttsClearHl(); snt.el.classList.add('speaking');
  if (snt.el.isConnected && TTS.follow){
    const r = snt.el.getBoundingClientRect();
    if (r.top < 70 || r.bottom > innerHeight - 130) snt.el.scrollIntoView({block:'center', behavior:'smooth'});
  }
}
function chTitleByN(n){ const e = E.find(x=>x.n===n); return e ? (e.orig ? `第${e.orig}章${e.title?' '+e.title:''}` : e.title) : ''; }
function markBtn(){
  const on = AU.on || TTS.on, paused = AU.on ? AU.paused : TTS.paused;
  const pn = AU.on ? AU.playingN : TTS.playingN;
  $('#ttsPlay').textContent = on ? (paused ? '▶ 继续' : '⏸ 暂停') : '▶ 从当前阅读位置开始听';
  $('#ttsPlay').classList.toggle('playing', on && !paused);
  $('#btnTts').classList.toggle('playing', on && !paused);
  $('#ttsBar').hidden = !on;
  $('#art').style.paddingBottom = on ? 'calc(var(--ft) + env(safe-area-inset-bottom) + 92px)' : '';
  if (on){ $('#tbPlay').textContent = paused ? '▶' : '⏸';
    $('#tbTitle').textContent = chTitleByN(pn) + (paused ? '（已暂停）' : ''); }
}
function ttsStart(){
  if(!('speechSynthesis' in window)){ toast('本设备浏览器不支持听书'); return; }
  TTS.sents = collectSents();
  if(!TTS.sents.length){ toast('本章无可朗读内容'); return; }
  TTS.playingN = E[cur].n; TTS.follow = localStorage.getItem('ct_follow') !== '0';
  let st = 0;
  for(let i=0;i<TTS.sents.length;i++){ if(TTS.sents[i].el.getBoundingClientRect().bottom > 60){ st = i; break; } }
  TTS.groups = buildGroups(TTS.sents);
  TTS.gi = 0;
  for (let k=0;k<TTS.groups.length;k++){ const g = TTS.groups[k];
    if (st >= g.base && st < g.base + g.sents.length){ TTS.gi = k; break; } }
  TTS.on = true; TTS.paused = false;
  markBtn(); ttsSpeakGroup();
}
function ttsSpeakGroup(){
  if(!TTS.on || TTS.paused) return;
  if(TTS.gi >= TTS.groups.length){
    if(localStorage.getItem('ct_auto') !== '0'){
      const idx = E.findIndex(x=>x.n===TTS.playingN);
      if (idx >= 0 && idx < E.length-1){
        TTS._auto = true; render(idx+1); TTS._auto = false;
        TTS.playingN = E[idx+1].n;
        setTimeout(()=>{ TTS.sents = collectSents(); TTS.groups = buildGroups(TTS.sents); TTS.gi = 0; markBtn(); ttsSpeakGroup(); }, 450);
      } else { ttsStop(true); toast('全书听完'); }
    } else { ttsStop(true); toast('本章听完'); }
    return;
  }
  const g = TTS.groups[TTS.gi];
  TTS._gK = -1; TTS._gStart = performance.now(); TTS._gAnchor = 0;
  TTS._gRate = parseFloat(localStorage.getItem('ct_rate')||'1');
  hlSent(TTS.sents, g.base);
  clearInterval(TTS.estTimer);
  TTS.estTimer = setInterval(()=>{
    if (!TTS.on || TTS.paused) return;
    const chars = TTS._gAnchor + (performance.now() - TTS._gStart)/1000 * 4.3 * TTS._gRate;
    let k = 0;
    for (let j=0;j<g.offs.length;j++){ if (chars >= g.offs[j]) k = j; }
    if (k !== TTS._gK){ TTS._gK = k; hlSent(TTS.sents, g.base + k); }
  }, 300);
  const u = new SpeechSynthesisUtterance(g.text);
  const vn = localStorage.getItem('ct_voice');
  const v = ttsVoices().find(x=>x.voiceURI===vn);
  if(v) u.voice = v;
  u.rate = TTS._gRate;
  u.pitch = parseFloat(localStorage.getItem('ct_pitch')||'1');
  u.onboundary = (e)=>{ if (!TTS.on || TTS.paused) return;
    TTS._gAnchor = e.charIndex || 0; TTS._gStart = performance.now();
    let k = 0;
    for (let j=0;j<g.offs.length;j++){ if (TTS._gAnchor >= g.offs[j]) k = j; }
    if (k !== TTS._gK){ TTS._gK = k; hlSent(TTS.sents, g.base + k); }
  };
  u.onend = ()=>{ if(TTS._skip){ TTS._skip = false; return; }
    clearInterval(TTS.estTimer);
    if(!TTS.on || TTS.paused) return;
    TTS.gi++;
    TTS.timer = setTimeout(ttsSpeakGroup, g.strong ? 120 : 320);
  };
  u.onerror = ()=>{ if(TTS._skip){ TTS._skip = false; return; }
    clearInterval(TTS.estTimer);
    if(!TTS.on || TTS.paused) return;
    TTS.gi++; TTS.timer = setTimeout(ttsSpeakGroup, 120);
  };
  speechSynthesis.speak(u);
}
function ttsPause(){ TTS.paused = true; clearTimeout(TTS.timer); clearInterval(TTS.estTimer); speechSynthesis.cancel(); markBtn(); }
function ttsStop(closeSheet){
  TTS.on = false; TTS.paused = false; TTS.playingN = null;
  clearTimeout(TTS.timer); clearInterval(TTS.estTimer); TTS._skip = true; speechSynthesis.cancel();
  ttsClearHl(); markBtn();
  if(closeSheet) $('#ttsSheet').classList.remove('open');
}
$('#btnTts').onclick = ()=>{
  const sh = $('#ttsSheet');
  const willOpen = !sh.classList.contains('open');
  sh.classList.toggle('open', willOpen);
  if(willOpen){ ttsFillVoices();
    if(!('speechSynthesis' in window)) toast('本设备浏览器不支持听书'); }
};
$('#ttsCollapse').onclick = ()=> $('#ttsSheet').classList.remove('open');
function stopAll(closeSheet){ auStop(false); ttsStop(false); if (closeSheet) $('#ttsSheet').classList.remove('open'); }
async function playToggle(){
  const sameP = (AU.on && AU.playingN === E[cur].n) || (TTS.on && TTS.playingN === E[cur].n);
  if (sameP){
    if (AU.on){ if (AU.paused){ AU.paused = false; markBtn(); AU.player.play(); } else auPause(); }
    else { if (TTS.paused){ TTS.paused = false; markBtn(); ttsSpeakGroup(); } else ttsPause(); }
    return;
  }
  stopAll(false);
  const ok = await auStart();
  if (!ok) ttsStart();
}
$('#ttsPlay').onclick = playToggle;
$('#tbPlay').onclick = playToggle;
$('#ttsStopBtn').onclick = ()=> stopAll(true);
$('#tbStop').onclick = ()=> stopAll(true);
$('#tbExpand').onclick = ()=>{ $('#ttsSheet').classList.add('open'); ttsFillVoices(); };
$('#tbTitle').onclick = ()=>{ const idx = E.findIndex(x=>x.n===TTS.playingN); if(idx>=0 && E[cur].n!==TTS.playingN) render(idx); };
document.querySelectorAll('#ttsRates button').forEach(b=> b.onclick = ()=>{
  localStorage.setItem('ct_rate', b.dataset.r);
  document.querySelectorAll('#ttsRates button').forEach(x=>x.classList.toggle('on', x===b));
  if (AU.on){ AU.player.playbackRate = Math.min(2, parseFloat(b.dataset.r)); }
  else if (TTS.on && !TTS.paused){ TTS._skip = true; speechSynthesis.cancel(); setTimeout(ttsSpeakGroup, 150); }
});
$('#ttsVoice').onchange = async ()=>{
  localStorage.setItem('ct_voice', $('#ttsVoice').value);
  if (AU.on || TTS.on){ stopAll(false); const ok = await auStart(); if (!ok) ttsStart(); }
};
$('#ttsPitch').oninput = ()=> localStorage.setItem('ct_pitch', $('#ttsPitch').value);
$('#ttsAuto').onchange = ()=> localStorage.setItem('ct_auto', $('#ttsAuto').checked ? '1' : '0');
$('#ttsFollow').onchange = ()=>{ localStorage.setItem('ct_follow', $('#ttsFollow').checked ? '1' : '0'); TTS.follow = $('#ttsFollow').checked; };
/* ── 在线高清音频引擎（MiniMax 预生成 + SRT 句级时间轴）── */
function auPlayer(){
  if (!AU.player){ AU.player = new Audio(); AU.player.preload = 'auto';
    AU.player.addEventListener('ended', auEnded);
    AU.player.addEventListener('timeupdate', auTick); }
  return AU.player;
}
async function auStart(){
  const v = localStorage.getItem('ct_voice')||'';
  if (!v.startsWith('audio:')) return false;
  const tag = v.slice(6);
  const m = await AUM.get(tag);
  const e = E[cur];
  const entry = m && m.chapters[String(e.n)];
  if (!entry) return false;
  AU.tag = tag; AU.times = entry.s || []; AU.playingN = e.n;
  AU.sents = collectSents();
  AU.follow = localStorage.getItem('ct_follow') !== '0';
  const p = auPlayer();
  p.src = `audio/${tag}/ch${String(e.n).padStart(4,'0')}.m4a`;
  p.playbackRate = Math.min(2, parseFloat(localStorage.getItem('ct_rate')||'1'));
  let st = 0;
  for (let i=0;i<AU.sents.length;i++){ if (AU.sents[i].el.getBoundingClientRect().bottom > 60){ st = i; break; } }
  AU.idx = Math.min(st, AU.times.length-1);
  try { p.currentTime = Math.max(0, (AU.times[AU.idx]||0) - 0.12); } catch(err){}
  AU.on = true; AU.paused = false;
  ttsClearHl(); hlSent(AU.sents, AU.idx); markBtn();
  p.play();
  return true;
}
function auTick(){
  if (!AU.on || !AU.times.length) return;
  const t = AU.player.currentTime + 0.05;
  let lo = 0, hi = AU.times.length - 1, idx = 0;
  while (lo <= hi){ const mid = (lo+hi)>>1; if (AU.times[mid] <= t){ idx = mid; lo = mid+1; } else hi = mid-1; }
  if (idx !== AU.idx){ AU.idx = idx; hlSent(AU.sents, idx); }
}
function auEnded(){
  if (localStorage.getItem('ct_auto') !== '0'){
    const idx = E.findIndex(x=>x.n===AU.playingN);
    if (idx >= 0 && idx < E.length-1){
      AU._auto = true; render(idx+1); AU._auto = false;
      auStart().then(ok => { if (!ok) ttsStart(); });
      return;
    }
  }
  auStop(true); toast('本章听完');
}
function auPause(){ AU.paused = true; AU.player.pause(); markBtn(); }
function auStop(closeSheet){
  AU.on = false; AU.paused = false;
  if (AU.player) AU.player.pause();
  ttsClearHl(); markBtn();
  if (closeSheet) $('#ttsSheet').classList.remove('open');
}
/* 进度记忆 */
let _sv = 0;
addEventListener('scroll', ()=>{ drawBar();
  const now = Date.now(); if (now-_sv<600) return; _sv = now;
  localStorage.setItem(LS.pos, JSON.stringify({n:E[cur].n, y:window.scrollY})); }, {passive:true});
/* 启动 */
if (!BOOK.done){ const b = $('#banner'); b.hidden = false;
  b.textContent = `速读版压缩中 · 已收录 ${BOOK.present}/${BOOK.total_units} 章 · 当前压缩率 ${BOOK.ratio_pct}%`; }
setFont(parseInt(localStorage.getItem(LS.fs)||'19'));
setTheme(localStorage.getItem(LS.th) || 'dark');
const _savedRate = localStorage.getItem('ct_rate')||'1';
document.querySelectorAll('#ttsRates button').forEach(b=>b.classList.toggle('on', b.dataset.r===_savedRate));
$('#ttsPitch').value = localStorage.getItem('ct_pitch')||'1';
$('#ttsAuto').checked = localStorage.getItem('ct_auto') !== '0';
$('#ttsFollow').checked = localStorage.getItem('ct_follow') !== '0';
let start = 0;
const hm = location.hash.match(/^#n(\d+)$/);
if (hm){ const k = E.findIndex(e=>e.n===+hm[1]); if (k>=0) start = k; }
else { const pos = JSON.parse(localStorage.getItem(LS.pos)||'null');
  if (pos){ const k = E.findIndex(e=>e.n===pos.n); if (k>=0) start = k; var _y = pos.y||0; } }
render(start);
if (typeof _y === 'number' && _y>0) requestAnimationFrame(()=>scrollTo(0,_y));
</script>
